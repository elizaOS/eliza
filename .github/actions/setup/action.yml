name: setup
description: Node 26, pnpm from packageManager and its cache; with verification, Dafny from its pinned release, Quint's evaluator, Chromium and the spec cache; on a pull request, Turborepo's cache.
inputs:
  job:
    description: Names the caches this job saves, so that jobs of one run do not save under one key; a job that saves nothing leaves it.
    default: verify
  verification:
    description: Set up the tools pnpm verify needs beyond Node and pnpm.
    default: "true"
outputs:
  spec-cache-path:
    description: What the spec cache holds, for the step that saves it at the end of a job.
    value: ${{ steps.spec-cache.outputs.path }}
  spec-cache-key:
    description: The key to save the spec cache under, unique to this run attempt; empty without verification.
    value: ${{ steps.spec-cache.outputs.key }}
  turbo-cache-key:
    description: On a pull request, the key to save Turborepo's local cache under, unique to this run attempt.
    value: ${{ steps.turbo-cache.outputs.key }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - name: Install Dafny
      if: inputs.verification == 'true'
      shell: bash
      run: |
        version=4.11.0
        curl --fail --location --retry 3 -o "$RUNNER_TEMP/dafny.zip" "https://github.com/dafny-lang/dafny/releases/download/v$version/dafny-$version-x64-ubuntu-22.04.zip"
        echo "a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179  $RUNNER_TEMP/dafny.zip" | sha256sum --check --strict
        unzip -q "$RUNNER_TEMP/dafny.zip" -d "$RUNNER_TEMP"
        "$RUNNER_TEMP/dafny/dafny" --version
        echo "$RUNNER_TEMP/dafny" >> "$GITHUB_PATH"
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    # Turborepo skips a task whose inputs it has seen; spec skips a simulation or proof it has seen, and the selftest's
    # shared projects skip a tool run an earlier selftest made (nightly, fuzz.yml runs it without them).
    # Quint downloads its evaluator to ~/.quint from GitHub's rate-limited API: once per cache, not per run.
    # Only restored here: a job saves it at its end whatever the outcome (ci.yml), since a failed or cancelled run
    # still checked most of what the next one would. A job restores what a job of its name last saved, else any job's.
    - id: spec-cache
      if: inputs.verification == 'true'
      shell: bash
      env:
        JOB: ${{ inputs.job }}
      run: |
        shared='spec-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-'
        prefix="${shared}${JOB}-"
        key="${prefix}${{ github.sha }}-${{ github.run_attempt }}"
        [[ $key == spec-*-"$JOB"-${{ github.sha }}-${{ github.run_attempt }} ]] || { echo "::error::Malformed spec cache key '$key'"; exit 1; }
        {
          echo "restore<<EOF"
          printf '%s\n' "$prefix" "$shared"
          echo "EOF"
          echo "key=$key"
          echo "path<<EOF"
          printf '%s\n' .spec-cache .cache/selftest/.spec-cache 'apps/*/.spec-cache' 'packages/*/.spec-cache' vibestack/studio/.spec-cache 'vibestack/examples/*/.spec-cache' '~/.quint'
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - if: inputs.verification == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.spec-cache.outputs.path }}
        key: ${{ steps.spec-cache.outputs.key }}
        restore-keys: ${{ steps.spec-cache.outputs.restore }}
    - id: turbo-cache
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        JOB: ${{ inputs.job }}
      run: echo "key=turbo-${{ runner.os }}-${{ runner.arch }}-${JOB}-${{ github.sha }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
    - if: steps.turbo-cache.outputs.key != ''
      uses: actions/cache/restore@v6
      with:
        path: .turbo/cache
        key: ${{ steps.turbo-cache.outputs.key }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.job }}-
          turbo-${{ runner.os }}-${{ runner.arch }}-
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Quint's first-run downloader uses the unauthenticated GitHub API.
    # Fetch its pinned release directly before concurrent checks need it.
    - name: Install Quint evaluator
      if: inputs.verification == 'true'
      run: |
        evaluator_version=$(node -p "require('@informalsystems/quint/dist/src/rust/binaryManager.js').QUINT_EVALUATOR_VERSION")
        evaluator_dir="$HOME/.quint/rust-evaluator-$evaluator_version"
        if [ ! -x "$evaluator_dir/quint_evaluator" ]; then
          mkdir -p "$evaluator_dir"
          curl --fail --location --retry 3 "https://github.com/quint-co/quint/releases/download/evaluator/$evaluator_version/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$evaluator_dir"
        fi
        "$evaluator_dir/quint_evaluator" --help
      shell: bash
    # Studio's journeys and every test:browser drive a real Chromium.
    - if: inputs.verification == 'true'
      run: |
        pnpm exec playwright install-deps chromium & deps=$!
        pnpm exec playwright install chromium
        wait "$deps"
      shell: bash
