name: Run full E2E
description: Exercise real product flows through the canonical E2E command.
runs:
  using: composite
  steps:
    - name: Apply dependency compatibility patches
      shell: bash
      run: |
        bun packages/scripts/patch-punycode-deprecation.mjs
        bun packages/scripts/patch-llama-cpp-capacitor.mjs
        bun packages/scripts/patch-electrobun-linux-cef-profile.mjs
    - name: Install Chromium
      shell: bash
      run: packages/scripts/github/install-playwright-browsers.sh chromium
    - name: Run full E2E
      shell: bash
      run: bun run test:e2e
