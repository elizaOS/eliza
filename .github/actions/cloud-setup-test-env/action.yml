name: Setup Cloud Test Environment
description: Common setup for Bun-based cloud test jobs with optional local services. Runs from packages/cloud/shared/.

inputs:
  bun-version:
    description: Bun version to install (pinned to avoid GitHub API rate-limit flakes).
    required: false
    # pinned: floating canary hangs `bun install` on hosted CI runners and
    # writes lockfileVersion 2 which breaks --frozen-lockfile (#11184/#9454).
    # Cloud Tests + cloud-e2e call this action without an override, so this
    # default is what actually runs on those (queue-starved) lanes.
    default: "1.3.14"
  setup-db:
    description: Start PGlite TCP server and run migrations.
    required: false
    default: "false"
  db-backend:
    description: "Database backend to start when setup-db is true: postgres or pglite."
    required: false
    default: "postgres"

runs:
  using: composite
  steps:
    - name: Verify PostgreSQL container runtime
      if: inputs.setup-db == 'true' && inputs.db-backend == 'postgres'
      shell: bash
      run: |
        if ! command -v docker >/dev/null 2>&1; then
          echo "::error::PostgreSQL-backed cloud tests require the Docker CLI."
          exit 1
        fi
        if ! docker info >/dev/null 2>&1; then
          echo "::error::PostgreSQL-backed cloud tests require access to the Docker daemon."
          exit 1
        fi

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: "24.15.0"

    - name: Resolve Bun release variant
      id: bun-variant
      shell: bash
      run: node packages/scripts/ci-fetch-bun-release.mjs --print-variant

    - name: Restore Bun release zip
      id: bun-zip-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/eliza-bun-release/bun.zip
        key: bun-release-${{ steps.bun-variant.outputs.variant }}-${{ inputs.bun-version }}

    - name: Fetch and serve Bun release zip
      id: bun-zip
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/eliza-bun-release"
        url_file="${RUNNER_TEMP}/eliza-bun-download-url"
        server_log="${RUNNER_TEMP}/eliza-bun-release-server.log"
        mkdir -p "$out"
        rm -f "$url_file" "$out/download-url" "$server_log"
        node packages/scripts/ci-fetch-bun-release.mjs --out-dir "$out"
        nohup node packages/scripts/ci-fetch-bun-release.mjs \
          --out-dir "$out" --serve-only --url-file "$url_file" \
          >"$server_log" 2>&1 &
        server_pid=$!
        disown || true
        if ! url="$(node packages/scripts/ci-await-bun-release-server.mjs \
          --pid "$server_pid" --url-file "$url_file" --timeout-ms 60000)"; then
          echo "::error::Bun zip local server did not become ready"
          if [ -s "$server_log" ]; then
            echo "::group::Bun zip server diagnostics (localhost/path data only)"
            sed -n '1,80p' "$server_log"
            echo "::endgroup::"
          fi
          exit 1
        fi
        echo "serving Bun zip at $url"
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      env:
        HOME: ${{ runner.temp }}/bun-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        USERPROFILE: ${{ runner.temp }}/bun-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-download-url: ${{ steps.bun-zip.outputs.url }}
        no-cache: true

    - name: Install dependencies
      shell: bash
      working-directory: packages/cloud/shared
      run: |
        for attempt in 1 2 3; do
          if [ "$attempt" -eq 3 ]; then
            bun install --frozen-lockfile --no-save --verbose && git diff --exit-code -- bun.lock && exit 0
          else
            bun install --frozen-lockfile --no-save && git diff --exit-code -- bun.lock && exit 0
          fi

          echo "bun install attempt $attempt failed or changed bun.lock; retrying in 10s..."
          sleep 10
        done

        exit 1

    - name: Build linked elizaOS workspaces
      shell: bash
      working-directory: packages/cloud/shared
      run: bun run build:linked-workspaces

    - name: Validate migration journal
      shell: bash
      working-directory: packages/cloud/shared
      run: bun run db:check-migrations

    - name: Start PostgreSQL test server
      if: inputs.setup-db == 'true' && inputs.db-backend == 'postgres'
      shell: bash
      run: |
        docker rm -f eliza-cloud-test-postgres >/dev/null 2>&1 || true
        docker run \
          --name eliza-cloud-test-postgres \
          -e POSTGRES_HOST_AUTH_METHOD=trust \
          -e POSTGRES_DB=postgres \
          -p 5432:5432 \
          -d pgvector/pgvector:pg16
        timeout 60 bash -c 'until docker exec eliza-cloud-test-postgres pg_isready -U postgres -d postgres; do sleep 0.5; done'

        for attempt in {1..120}; do
          if bun -e 'import pg from "pg"; const { Client } = pg; const client = new Client({ connectionString: process.env.DATABASE_URL }); await client.connect(); await client.query("select 1"); await client.end();' >/dev/null 2>&1; then
            exit 0
          fi

          sleep 0.5
        done

        docker logs eliza-cloud-test-postgres
        exit 1

    - name: Start PGlite TCP server
      if: inputs.setup-db == 'true' && inputs.db-backend == 'pglite'
      shell: bash
      working-directory: packages/cloud/shared
      env:
        PGLITE_IN_MEMORY: "1"
        PGLITE_PORT: "5432"
        PGLITE_HOST: "127.0.0.1"
        PGLITE_MAX_CONNECTIONS: "64"
      run: |
        bun run pglite:server &
        timeout 30 bash -c 'until bash -c "echo >/dev/tcp/127.0.0.1/5432" 2>/dev/null; do sleep 0.5; done'

    - name: Run database migrations
      if: inputs.setup-db == 'true'
      shell: bash
      working-directory: packages/cloud/shared
      env:
        DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      run: bun run db:migrate
