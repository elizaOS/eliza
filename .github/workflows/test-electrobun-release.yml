name: Validate Electrobun Release Workflow

on:
  # Reusable entry for the scheduled exhaustive develop lane (#12342).
  workflow_call:
    inputs:
      concurrency_scope:
        description: "Caller-owned concurrency namespace"
        required: false
        type: string
        default: standalone
  pull_request:
    branches: [main]
  workflow_dispatch:

# A reusable caller's scope separates it from the standalone ref domain. PRs
# still supersede obsolete work; exhaustive work always completes.
concurrency:
  group: test-electrobun-release-${{ inputs.concurrency_scope || 'standalone' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  NODE_NO_WARNINGS: "1"

jobs:
  validate-release-workflow:
    name: Release Workflow Contract
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-24.04' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          run-postinstall: "true"
          init-submodules: "false"

      - name: Run regression matrix contract
        run: bun run test:regression-matrix:release-contract

      - name: Run release contract suite
        run: bun run test:release:contract
