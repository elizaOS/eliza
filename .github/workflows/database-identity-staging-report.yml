name: Database identity staging report

on:
  workflow_dispatch:
    inputs:
      expected_cloud_commit:
        description: Exact 40-character staging commit to inspect
        required: true
        type: string

      read_only_deletion_billing_provenance:
        description: Also report unresolved migration 0398 authority counts without changing any row
        required: false
        default: false
        type: boolean

      read_only_agent_deletion_authority:
        description: Also classify guarded agent ownership and existing deletion/stop receipts without exporting IDs
        required: false
        default: false
        type: boolean

      read_only_failed_agent_deletion_jobs:
        description: Also classify complete failed deletion-job authority without IDs, raw payloads, retries or writes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject untrusted source
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_cloud_commit }}
          CHECKED_OUT_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" != "refs/heads/staging" ]]; then
            echo "::error::database identity report requires the trusted staging source"
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_COMMIT" != "$CHECKED_OUT_COMMIT" ]]; then
            echo "::error::database identity report requires the exact checked-out commit"
            exit 1
          fi

  report:
    needs: admission
    if: needs.admission.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: database-identity-staging-report
      cancel-in-progress: false
    env:
      DATABASE_IDENTITY_GATE_MODE: report
      DATABASE_IDENTITY_ENVIRONMENT: staging

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: 1.4.2
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          run-postinstall: "false"

      - name: Build required linked runtime
        run: |
          bun run build:core

      - name: Probe fixed runtime dependencies
        run: bun run packages/cloud/scripts/admin/preflight-database-identity.ts --probe-dependencies

      # Step scoping keeps DATABASE_URL out of the earlier steps' declared
      # environments, preventing direct or accidental injection there. It is
      # not an adversarial isolation boundary: every preceding step shares this
      # mutable job and can persist state. Admission proves only that the
      # operator-supplied SHA equals github.sha on staging before the staging
      # Environment is attached; it does not prove reviewer approval. Human
      # source review and effective staging admission remain external parts of
      # the trusted computing base.
      - name: Emit redacted staging identity receipts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run packages/cloud/scripts/admin/preflight-database-identity.ts

      - name: Report deletion billing provenance counts without mutation
        if: ${{ inputs.read_only_deletion_billing_provenance == true || inputs.read_only_agent_deletion_authority == true || inputs.read_only_failed_agent_deletion_jobs == true }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ELIZA_DELETION_BILLING_PROVENANCE_REPORT: "1"
          ELIZA_DELETION_BILLING_AUTHORITY_REPORT: ${{ (inputs.read_only_agent_deletion_authority == true || inputs.read_only_failed_agent_deletion_jobs == true) && '1' || '0' }}
          ELIZA_DELETION_FAILED_JOB_REPORT: ${{ inputs.read_only_failed_agent_deletion_jobs == true && '1' || '0' }}
          ELIZAOS_CLOUD_API_KEY: ${{ (inputs.read_only_agent_deletion_authority == true || inputs.read_only_failed_agent_deletion_jobs == true) && secrets.ELIZAOS_CLOUD_API_KEY || '' }}
        run: bun run packages/cloud/scripts/admin/deletion-billing-provenance-report.ts

      - name: Retain closed deletion billing provenance receipt
        if: ${{ inputs.read_only_deletion_billing_provenance == true || inputs.read_only_agent_deletion_authority == true || inputs.read_only_failed_agent_deletion_jobs == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deletion-billing-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/issue-review-cloud/deletion-billing-provenance.json
          if-no-files-found: error
          retention-days: 7
