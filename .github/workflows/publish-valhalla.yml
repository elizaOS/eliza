name: Publish Valhalla Site

on:
  workflow_dispatch:
  push:
    branches: [develop, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release tarball from Google Drive
        run: |
          curl -L -c /tmp/cookie.txt -o /tmp/valhalla-os.tar.gz \
            "https://drive.google.com/uc?export=download&id=1_rFRoaRKhbqHB0CXOVygtYUtfVYH18jO"
          # Handle Google Drive confirmation if prompted
          CONFIRM=$(awk '/download/ {print $NF}' /tmp/cookie.txt)
          if [ -n "$CONFIRM" ]; then
            curl -L -b /tmp/cookie.txt -o /tmp/valhalla-os.tar.gz \
              "https://drive.google.com/uc?export=download&confirm=$CONFIRM&id=1_rFRoaRKhbqHB0CXOVygtYUtfVYH18jO"
          fi

      - name: Extract release package
        run: |
          mkdir -p /tmp/valhalla-extract
          tar -xzf /tmp/valhalla-os.tar.gz -C /tmp/valhalla-extract

      - name: Prepare Pages artifact
        run: |
          mkdir -p public/os
          cp /tmp/valhalla-extract/valhalla-os/valhalla98.html public/os/index.html
          cp /tmp/valhalla-extract/valhalla-os/valhalla98.html public/valhalla98.html
          cp /tmp/valhalla-extract/valhalla-os/index.html public/index.html
          cp /tmp/valhalla-extract/valhalla-os/server.ts ./server.ts
          echo "valhalla-app.xyz" > public/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
