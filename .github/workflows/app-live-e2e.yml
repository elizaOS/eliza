name: App Live E2E

# Gated, NON-blocking live lane for the packages/app e2e suite — the home for
# REAL (not stub/mock) coverage of the dimensions the keyless PR lanes can only
# fixture-test.
#
# Why the keyless lanes can't do this: every PR-gating lane (scenario-pr, ci,
# test) forces the deterministic stub API (CI=true => FORCE_STUB_STACK, see the
# tested shouldForceStubStack helper) and blanks all provider/cloud keys, because
# secrets cannot be exposed to fork PRs and real model/cloud turns cost money and
# add network flake. So real coverage MUST live in a secret-gated, non-PR lane.
#
# The keystone that makes this possible: ELIZA_UI_SMOKE_LIVE_STACK=1 overrides the
# CI stub-force, so the live stack boots the real @elizaos/app-core runtime and
# the live-only specs (test.skip'd in keyless CI) un-skip.
#
# Runs on demand; never on pull_request.

on:
  workflow_dispatch:
    inputs:
      run_android_local_chat:
        description: "Also run the on-device Android local-chat smoke (boots an emulator + builds/installs the APK + stages a GGUF)."
        type: boolean
        default: false
      run_cloud_staging:
        description: "Also run the staging Cloud login+personal-identity+chat lane (requires the staging Environment's ELIZAOS_CLOUD_API_KEY)."
        type: boolean
        default: false
      run_cloud_production:
        description: "Also run the production Cloud login+personal-identity+chat lane. Keep false for staging-only evidence."
        type: boolean
        default: false

concurrency:
  group: app-live-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  # The keystone: opt the live stack out of the CI-based stub force so the real
  # app-core runtime boots. Without this, CI=true re-forces the stub even with a
  # provider key present and every "live" test self-skips.
  ELIZA_UI_SMOKE_LIVE_STACK: "1"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  NODE_NO_WARNINGS: "1"
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # The Anthropic repository credential can be present but unfunded. The App
  # Live chat lane already validates this repository's OpenAI key, so use that
  # funded provider for the mandatory walkthrough screenshot review too.
  AI_QA_VISION_BACKEND: openai
  AI_QA_VISION_MODEL: gpt-5-mini
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  # App Live runs with disposable state on headless Linux. Bypass the native
  # keychain path even if a stale D-Bus address makes the runner look graphical;
  # @napi-rs/keyring can terminate the runtime before JavaScript can report it.
  ELIZA_VAULT_DISABLE_KEYCHAIN: "1"
  ELIZA_VAULT_PASSPHRASE: app-live-e2e-headless-vault-only
  ELIZA_UI_SMOKE_BACKEND_LOG_PATH: e2e-recordings/app-live/backend.log

jobs:
  # Real LOCAL chat turn through the live stack: a real app-core runtime + a real
  # provider model, asserting an exact model-produced marker (APP_LIVE_AGENT_OK).
  # UI-driven counterpart to dev-smoke; proves chat send/stream reaches a real
  # agent from the UI.
  app-live-chat:
    name: app live chat (real local runtime)
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 45
    env:
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Free disk space for browser smoke
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install Playwright Chromium
        run: .github/scripts/install-playwright-browsers.sh chromium

      - name: Generate shared i18n assets
        run: bun run --cwd packages/shared build:i18n

      # Vite loads package exports before renderer aliases apply; fresh CI
      # checkouts need these dist bundles before packages/app can resolve
      # @elizaos/core and @elizaos/shared subpaths.
      - name: Build @elizaos/core + @elizaos/shared browser bundles
        run: bunx turbo run build --filter=@elizaos/core --filter=@elizaos/shared

      # Prebuild the renderer dist so the live stack reuses a fresh bundle
      # instead of a cold in-harness vite build (viteRendererBuildNeeded check).
      - name: Build app renderer bundle
        run: bun run --cwd packages/app build:web

      - name: Run live agent chat (real model turn)
        run: bun run --cwd packages/app test:e2e test/ui-smoke/live-agent-chat.spec.ts --project=chromium -g "live agent"

      # Deep settings/vault round-trips that the keyless stub structurally
      # cannot serve (write→reload→read-back against the real on-disk vault +
      # runtime). LIVE_STACK=1 is set job-wide, so the test.skip(!LIVE_STACK)
      # guards in these specs open. The two *-interactions specs also run keyless
      # in scenario-pr.yml (skipping their deep blocks); here they run them.
      - name: Run settings + vault live-stack deep e2e
        run: |
          bun run --cwd packages/app test:e2e test/ui-smoke/vault-routing.spec.ts test/ui-smoke/wallet-keys.spec.ts test/ui-smoke/vault-modal-interactions.spec.ts test/ui-smoke/settings-sections-interactions.spec.ts --project=chromium
          # Provider switching deliberately restarts the runtime. Run it in a
          # fresh final harness so its lifecycle cannot strand unrelated tests
          # behind the startup shell while the selected test provider restarts.
          bun run --cwd packages/app test:e2e test/ui-smoke/provider-config.spec.ts --project=chromium

      - name: Upload live-chat artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-live-e2e-chat
          path: |
            packages/app/playwright-report/
            packages/app/test-results/
            e2e-recordings/app-live/backend.log
          if-no-files-found: ignore
          retention-days: 7

  # Full continuous walkthrough against the REAL backend agent + model: cold
  # launch → in-chat onboarding (greeting → runtime CHOICE → provider → one real
  # POST /api/first-run) → all 8 tutorial frames → help/settings/wallet → a real
  # chat round-trip (trajectory captured) → view switching → settings edit. Runs
  # WITHOUT --skip-review so the AI vision reviewer scores every NN-step.png and
  # writes WALKTHROUGH_VERDICTS.md (the PR mock lane is keyless and can't).
  walkthrough-live:
    name: full walkthrough (real backend + model + vision verdicts)
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 60
    env:
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Free disk space for browser smoke
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fail fast on missing/invalid/unfunded reviewer credentials before the
      # expensive dependency install + browser/model walkthrough. Runs after
      # setup-node so it uses the pinned toolchain, not the runner's system node.
      - name: Preflight visual reviewer credentials and credits
        run: node scripts/ai-qa/reviewer-preflight.mjs

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install Playwright Chromium
        run: .github/scripts/install-playwright-browsers.sh chromium

      - name: Install ffmpeg (recording stitch)
        run: .github/scripts/install-apt-packages.sh ffmpeg

      - name: Generate shared i18n assets
        run: bun run --cwd packages/shared build:i18n

      # Vite resolves linked workspace package exports while loading the app
      # config, before renderer aliases can redirect to source files.
      - name: Build @elizaos/core + @elizaos/shared browser bundles
        run: bunx turbo run build --filter=@elizaos/core --filter=@elizaos/shared

      # Prebuild the renderer dist so the live stack reuses a fresh bundle
      # instead of a cold in-harness vite build.
      - name: Build app renderer bundle
        run: bun run --cwd packages/app build:web

      - name: Drive + record + vision-review the full walkthrough (live)
        run: bun run --cwd packages/app test:e2e:walkthrough:live -- --reviewer-preflighted

      - name: Upload walkthrough screenshots + recording + verdicts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-live-e2e-walkthrough
          path: |
            reports/walkthrough/
            e2e-recordings/app/walkthrough/
            packages/app/test/ui-smoke/walkthrough/WALKTHROUGH_VERDICTS.md
          if-no-files-found: ignore
          retention-days: 7

  # Real CLOUD login + Personal Eliza identity resolution + chat through the app UI against real Eliza
  # Cloud. cloud-live.spec.ts mocks nothing; ELIZA_UI_SMOKE_CLOUD_LIVE=1 leaves
  # first-run open so the spec drives cloud onboarding, and ELIZAOS_CLOUD_API_KEY
  # authenticates. The secret-gated job fails before setup when neither accepted
  # repository secret is configured; the spec remains safely skippable outside
  # this workflow so keyless PR lanes cannot spend Cloud credits.
  cloud-live:
    name: cloud login + personal identity + chat (real Eliza Cloud, production)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_cloud_production) }}
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 45
    env:
      ELIZA_UI_SMOKE_CLOUD_LIVE: "1"
      # The spec asserts the resolved API origin matches this environment
      # before spending any Cloud credit (#18076), so a misconfigured base URL
      # cannot silently retarget the production lane.
      ELIZA_UI_SMOKE_CLOUD_EXPECTED_ENV: production
      # Prefer the variable named for the runtime contract, but retain the
      # repository's established ELIZACLOUD_API_KEY as the canonical fallback.
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY || secrets.ELIZACLOUD_API_KEY }}
      # Suppress Playwright's automatic full-page ARIA snapshot. Credentialed
      # Playwright output is not uploaded by this job.
      PLAYWRIGHT_NO_COPY_PROMPT: "1"
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Require real Cloud credential
        shell: bash
        run: |
          set -euo pipefail
          cloud_key_without_whitespace="${ELIZAOS_CLOUD_API_KEY:-}"
          cloud_key_without_whitespace="${cloud_key_without_whitespace//[[:space:]]/}"
          if [[ -z "$cloud_key_without_whitespace" ]]; then
            echo "::error::App Live E2E requires ELIZAOS_CLOUD_API_KEY or ELIZACLOUD_API_KEY; refusing a green-by-skip Cloud job."
            exit 1
          fi
          unset cloud_key_without_whitespace

      - name: Free disk space for browser smoke
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install Playwright Chromium
        run: .github/scripts/install-playwright-browsers.sh chromium

      - name: Generate shared i18n assets
        run: bun run --cwd packages/shared build:i18n

      # Cloud-live still builds the same renderer bundle, so it needs the same
      # workspace dists before Vite can load packages/app/vite.config.ts.
      - name: Build @elizaos/core + @elizaos/shared browser bundles
        run: bunx turbo run build --filter=@elizaos/core --filter=@elizaos/shared

      - name: Build app renderer bundle
        run: bun run --cwd packages/app build:web

      - name: Run real cloud login + personal identity + chat
        run: bun run --cwd packages/app test:e2e test/ui-smoke/cloud-live.spec.ts --project=chromium

  # STAGING counterpart of cloud-live (#18076): the same real login +
  # Personal Eliza identity + chat path, pinned to the staging control plane. Kept a
  # separate job so staging and production report as distinct results and
  # artifacts. It is fail-closed by construction:
  #   - the job-level ELIZAOS_CLOUD_BASE_URL pins the staging API origin and
  #     the spec's origin contract (ELIZA_UI_SMOKE_CLOUD_EXPECTED_ENV=staging)
  #     hard-fails on any resolution that is not that origin — it can never
  #     fall back to production;
  #   - the credential comes ONLY from the protected `staging` Environment's
  #     ELIZAOS_CLOUD_API_KEY (a production key does not authenticate against
  #     staging, and no repository-secret fallback is allowed here);
  #   - a missing credential fails the job loudly before any setup/build work.
  # Scheduled runs stay opt-in via ELIZA_CLOUD_STAGING_LIVE_READY until an
  # owner has minted the staging-scoped key, so an unconfigured nightly is a
  # visible skip, not a misleading red or a green-by-skip.
  # NOTE: this lane drives the renderer bundle built from the checked-out
  # revision against the staging API; it does not exercise the deployed
  # staging Pages artifact (recorded in the spec annotations + step summary).
  cloud-live-staging:
    name: cloud login + personal identity + chat (real Eliza Cloud, staging)
    if: ${{ (github.event_name == 'schedule' && vars.ELIZA_CLOUD_STAGING_LIVE_READY == '1') || (github.event_name == 'workflow_dispatch' && inputs.run_cloud_staging) }}
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    environment: staging
    timeout-minutes: 45
    env:
      ELIZA_UI_SMOKE_CLOUD_LIVE: "1"
      ELIZA_UI_SMOKE_CLOUD_EXPECTED_ENV: staging
      ELIZAOS_CLOUD_BASE_URL: https://api-staging.eliza.app
      # Keep the target on every subprocess, including the live-stack harness's
      # guarded renderer rebuild path; the explicit prebuild step is not the
      # only process allowed to rebuild dist.
      VITE_ELIZA_CLOUD_BASE: https://api-staging.eliza.app
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY }}
      ELIZA_UI_SMOKE_STAGING_CHAT_LATENCY_EVIDENCE_PATH: ${{ github.workspace }}/artifacts/app-live-e2e/cloud-staging-chat-latency.json
      ELIZA_UI_SMOKE_STAGING_CONTINUITY_EVIDENCE_PATH: ${{ github.workspace }}/artifacts/app-live-e2e/cloud-staging-continuity.json
      # Suppress Playwright's automatic full-page ARIA snapshot. This job
      # uploads only the closed receipt, never raw Playwright output.
      PLAYWRIGHT_NO_COPY_PROMPT: "1"
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Require staging-scoped Cloud credential and origin
        shell: bash
        run: |
          set -euo pipefail
          staging_key_without_whitespace="${ELIZAOS_CLOUD_API_KEY:-}"
          staging_key_without_whitespace="${staging_key_without_whitespace//[[:space:]]/}"
          if [[ -z "$staging_key_without_whitespace" ]]; then
            echo "::error::The staging Cloud lane requires the staging Environment's ELIZAOS_CLOUD_API_KEY; refusing to run (and never falling back to the production key)."
            exit 1
          fi
          unset staging_key_without_whitespace
          if [[ "${ELIZAOS_CLOUD_BASE_URL:-}" != "https://api-staging.eliza.app" ]]; then
            echo "::error::The staging Cloud lane must pin ELIZAOS_CLOUD_BASE_URL=https://api-staging.eliza.app; got '${ELIZAOS_CLOUD_BASE_URL:-}'."
            exit 1
          fi

      - name: Free disk space for browser smoke
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install Playwright Chromium
        run: .github/scripts/install-playwright-browsers.sh chromium

      - name: Generate shared i18n assets
        run: bun run --cwd packages/shared build:i18n

      - name: Build @elizaos/core + @elizaos/shared browser bundles
        run: bunx turbo run build --filter=@elizaos/core --filter=@elizaos/shared

      - name: Build app renderer bundle
        # The renderer resolves its Cloud base at BUILD time from
        # VITE_ELIZA_CLOUD_BASE and otherwise defaults to production
        # (ui/src/platform/ios-runtime.ts resolveCloudApiBase). The job-level
        # ELIZAOS_CLOUD_BASE_URL pins the spawned runtime's proxy, which
        # carries Personal Eliza identity resolution; it does NOT reach Vite.
        # The chat leg is
        # what breaks: selectOrProvisionCloudAgent derives the shared-agent
        # base from the boot value, so a production-defaulted bundle sends a
        # staging agent id and this lane's staging bearer to api.eliza.app
        # (#18076).
        env:
          VITE_ELIZA_CLOUD_BASE: ${{ env.ELIZAOS_CLOUD_BASE_URL }}
        run: bun run --cwd packages/app build:web

      - name: Run real STAGING cloud login + personal identity + chat
        id: staging-cloud-smoke
        shell: bash
        run: |
          set -uo pipefail
          rm -f -- "$ELIZA_UI_SMOKE_STAGING_CHAT_LATENCY_EVIDENCE_PATH"
          rm -f -- "$ELIZA_UI_SMOKE_STAGING_CONTINUITY_EVIDENCE_PATH"
          started_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
          echo "started_ms=$started_ms" >> "$GITHUB_OUTPUT"
          set +e
          bun run --cwd packages/app test:e2e test/ui-smoke/cloud-live.spec.ts --project=chromium
          test_status=$?
          set -e
          completed_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
          echo "completed_ms=$completed_ms" >> "$GITHUB_OUTPUT"
          exit "$test_status"

      - name: Validate privacy-safe staging chat latency evidence
        id: staging-cloud-chat-latency
        if: ${{ always() && steps.staging-cloud-smoke.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          latency_ms="$(bun packages/app/test/staging-cloud-chat-latency-evidence.ts "$ELIZA_UI_SMOKE_STAGING_CHAT_LATENCY_EVIDENCE_PATH")"
          echo "first_turn_latency_ms=$latency_ms" >> "$GITHUB_OUTPUT"

      - name: Validate privacy-safe staging history continuity evidence
        id: staging-cloud-continuity
        if: ${{ always() && steps.staging-cloud-smoke.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          continuity_evidence="$(bun packages/app/test/cloud-live-continuity-contract.ts "$ELIZA_UI_SMOKE_STAGING_CONTINUITY_EVIDENCE_PATH")"
          echo "continuity_evidence=$continuity_evidence" >> "$GITHUB_OUTPUT"

      - name: Resolve fail-closed staging receipt evidence
        id: staging-cloud-receipt-evidence
        if: ${{ always() && steps.staging-cloud-smoke.outcome != 'skipped' }}
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.staging-cloud-smoke.outcome }}
          LATENCY_VALIDATION_OUTCOME: ${{ steps.staging-cloud-chat-latency.outcome }}
          CONTINUITY_VALIDATION_OUTCOME: ${{ steps.staging-cloud-continuity.outcome }}
          VALIDATED_FIRST_TURN_LATENCY_MS: ${{ steps.staging-cloud-chat-latency.outputs.first_turn_latency_ms }}
          VALIDATED_CONTINUITY_EVIDENCE: ${{ steps.staging-cloud-continuity.outputs.continuity_evidence }}
        run: |
          set -euo pipefail
          receipt_outcome=failure
          first_turn_latency_ms=unavailable
          continuity_evidence=unavailable
          if [[ "$SMOKE_OUTCOME" == "success" \
            && "$LATENCY_VALIDATION_OUTCOME" == "success" \
            && "$CONTINUITY_VALIDATION_OUTCOME" == "success" \
            && "$VALIDATED_FIRST_TURN_LATENCY_MS" =~ ^[1-9][0-9]*$ \
            && "$VALIDATED_CONTINUITY_EVIDENCE" == "verified" ]]; then
            receipt_outcome=success
            first_turn_latency_ms="$VALIDATED_FIRST_TURN_LATENCY_MS"
            continuity_evidence="$VALIDATED_CONTINUITY_EVIDENCE"
          fi
          {
            echo "receipt_outcome=$receipt_outcome"
            echo "first_turn_latency_ms=$first_turn_latency_ms"
            echo "continuity_evidence=$continuity_evidence"
          } >> "$GITHUB_OUTPUT"

      - name: Write secret-free staging receipt
        if: ${{ always() && steps.staging-cloud-smoke.outcome != 'skipped' }}
        env:
          TEST_OUTCOME: ${{ steps.staging-cloud-receipt-evidence.outputs.receipt_outcome || 'failure' }}
          TEST_STARTED_MS: ${{ steps.staging-cloud-smoke.outputs.started_ms }}
          TEST_COMPLETED_MS: ${{ steps.staging-cloud-smoke.outputs.completed_ms }}
          FIRST_TURN_LATENCY_MS: ${{ steps.staging-cloud-receipt-evidence.outputs.first_turn_latency_ms || 'unavailable' }}
          CONTINUITY_EVIDENCE: ${{ steps.staging-cloud-receipt-evidence.outputs.continuity_evidence || 'unavailable' }}
        run: |
          node packages/scripts/write-staging-cloud-receipt.mjs \
            --output artifacts/app-live-e2e/cloud-staging-receipt.json \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --outcome "$TEST_OUTCOME" \
            --started-ms "$TEST_STARTED_MS" \
            --completed-ms "$TEST_COMPLETED_MS" \
            --first-turn-latency-ms "$FIRST_TURN_LATENCY_MS" \
            --continuity-evidence "$CONTINUITY_EVIDENCE"

      - name: Record what this lane drove
        if: ${{ always() }}
        env:
          TEST_OUTCOME: ${{ steps.staging-cloud-receipt-evidence.outputs.receipt_outcome || 'failure' }}
          CONTINUITY_EVIDENCE: ${{ steps.staging-cloud-receipt-evidence.outputs.continuity_evidence || 'unavailable' }}
        run: |
          {
            echo "## Staging Cloud live lane"
            echo "- API target: https://api-staging.eliza.app (the spec asserts it before auth/Personal identity/chat traffic)"
            echo "- Renderer scope: local bundle from \`${GITHUB_SHA}\`; this job does NOT test a deployed staging Pages artifact"
            echo "- First-turn metric definition: composer send click to the same fresh assistant row settled and accepted by the liveness contract (not first-token latency); the receipt records measured or unavailable"
            if [[ "$TEST_OUTCOME" == "success" && "$CONTINUITY_EVIDENCE" == "verified" ]]; then
              echo "- Continuity: verified — canonical Personal identity GET + one challenge turn, then successful server-history GET + challenge-bound user/assistant rows after reload and a fresh BrowserContext; zero agent create/provision/upgrade/delete mutations"
              echo "- Cleanup: no test-owned agent; account-owned conversation history preserved (no deletion attempted or claimed)"
            else
              echo "- Continuity: unavailable — the run did not produce a verified continuity proof"
              echo "- Cleanup: unavailable — no deletion or preservation claim is made for this run"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cloud-live staging artifacts
        if: ${{ always() && steps.staging-cloud-smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-live-e2e-cloud-staging
          path: artifacts/app-live-e2e/cloud-staging-receipt.json
          if-no-files-found: error
          retention-days: 7

  # Real on-device LOCAL provisioning + chat on Android: boots an emulator, builds
  # + installs the debuggable APK, stages the smoke GGUF, starts the native
  # ElizaAgentService local runtime, and asserts a real streamed on-device model
  # reply (test:sim:local-chat:android:live). The ONLY lane that exercises Android
  # local provisioning for real. Opt-in (workflow_dispatch input) because it is
  # heavy. android-emulator-runner is the de-facto standard emulator action.
  android-local-chat:
    name: android local chat (on-device GGUF)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_android_local_chat }}
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # android-emulator-runner provides the booted AVD + adb; the script builds
      # and installs the APK, then runs the live on-device local-chat smoke, which
      # stages the GGUF and asserts a real model reply.
      - name: Build, install, and run Android on-device local-chat smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            bun run --cwd packages/app build:android
            bun run --cwd packages/app install:android:adb
            bun run --cwd packages/app test:sim:local-chat:android:live

  # Desktop (Electrobun) packaged e2e. The build + agent boot run on a standard
  # runner and catch real packaged-app bugs (e.g. a missing JSON import attribute
  # that breaks the wallet plugin on boot). The renderer-driving assertions need a
  # real GPU display (the app uses WebGPU); on GPU-less runners the build + launch
  # still validate, so the renderer step is best-effort.
  desktop-packaged:
    name: desktop packaged (build + boot + renderer)
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 60
    env:
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Install WebKitGTK + xvfb for the Electrobun webview
        # libayatana-appindicator3-1: libNativeWrapper.so (tray support) links
        # against it; without it every packaged spec dies at launch with
        # ERR_DLOPEN_FAILED before the test bridge comes up (the lane was red
        # for 5+ days with "Packaged app exited before the desktop test bridge
        # became ready").
        # scrot/imagemagick/x11-apps/ffmpeg: ScreenCaptureManager tries, in
        # order, scrot, ImageMagick import, ffmpeg x11grab, then xwd+ffmpeg for
        # /main-window/screenshot. ffmpeg also stitches the walkthrough MP4.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libwebkit2gtk-4.1-0 libgtk-3-0 mesa-utils libgl1-mesa-dri \
            libayatana-appindicator3-1 scrot imagemagick x11-apps ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install Playwright runner
        run: .github/scripts/install-playwright-browsers.sh chromium

      # Build the packaged desktop app (catches build/packaging breaks). Run from
      # the repo root so desktop-build.mjs resolves packages/app.
      - name: Build the Electrobun desktop app
        run: node packages/app-core/scripts/desktop-build.mjs build

      # Launch + drive the packaged app under a virtual display + software GL.
      - name: Run packaged desktop e2e (xvfb)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" bun run --cwd packages/app test:desktop:packaged

      - name: Upload desktop-packaged artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-live-e2e-desktop
          path: |
            packages/app/playwright-report/
            packages/app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # A nightly that is always red is indistinguishable from no lane: without an
  # alert, nobody notices the desktop loop has no green unattended cadence and
  # regressions accumulate silently (issue #13681). This job turns a red
  # scheduled run into an actionable signal by commenting on the tracking issue
  # with the per-job results and a link to the run. Scheduled runs only —
  # manual workflow_dispatch runs stay quiet to avoid noise.
  notify-on-failure:
    name: notify on red nightly
    needs:
      [
        app-live-chat,
        walkthrough-live,
        cloud-live,
        cloud-live-staging,
        desktop-packaged,
      ]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    permissions:
      issues: write
    steps:
      - name: "Comment red-nightly diagnostic on tracking issue #13681"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_CHAT: ${{ needs.app-live-chat.result }}
          R_WALK: ${{ needs.walkthrough-live.result }}
          R_CLOUD: ${{ needs.cloud-live.result }}
          R_CLOUD_STAGING: ${{ needs.cloud-live-staging.result }}
          R_DESKTOP: ${{ needs.desktop-packaged.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              "## 🌙 Nightly App Live E2E failed (scheduled run)",
              "",
              "The only scheduled desktop-packaged lane went red. Per-job results:",
              "",
              `- app live chat: \`${process.env.R_CHAT}\``,
              `- full walkthrough: \`${process.env.R_WALK}\``,
              `- cloud login+personal-identity+chat (production): \`${process.env.R_CLOUD}\``,
              `- cloud login+personal-identity+chat (staging): \`${process.env.R_CLOUD_STAGING}\``,
              `- desktop packaged (build+boot+renderer): \`${process.env.R_DESKTOP}\``,
              "",
              `Run log: ${process.env.RUN_URL}`,
              "",
              "Staging uploads a secret-free receipt; the production cloud-live",
              "job deliberately uploads nothing, so its evidence is job status",
              "plus the run log only.",
              "",
              "_Auto-posted by app-live-e2e.yml so a red nightly notifies someone (Done-when, #13681)._",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 13681,
              body,
            });
