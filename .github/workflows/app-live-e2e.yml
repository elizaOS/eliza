name: App Live E2E Cerebras Credential Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cerebras-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
      - name: Verify current model and one real completion
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const source = await readFile('packages/host/src/contracts/service-routing.ts', 'utf8');
          const model = /export const DEFAULT_CEREBRAS_TEXT_MODEL = "([^"]+)"/.exec(source)?.[1];
          if (!model) throw new Error('Canonical Cerebras model was not found');
          const headers = { 'content-type': 'application/json', authorization: `Bearer ${process.env.CEREBRAS_API_KEY}` };
          const listing = await fetch('https://api.cerebras.ai/v1/models', { headers, signal: AbortSignal.timeout(15000) });
          const catalog = listing.ok ? await listing.json() : null;
          const available = catalog?.data?.some(entry => entry.id === model) === true;
          console.log(JSON.stringify({ provider: 'cerebras', model, catalogHttpStatus: listing.status, modelAvailable: available }));
          if (!available) process.exit(2);
          const response = await fetch('https://api.cerebras.ai/v1/chat/completions', {
            method: 'POST', headers,
            body: JSON.stringify({ model, max_tokens: 128, temperature: 0, messages: [{ role: 'user', content: 'Reply exactly LIVE_PREFLIGHT_OK.' }] }),
            signal: AbortSignal.timeout(30000),
          });
          const body = response.ok ? await response.json() : null;
          const content = body?.choices?.[0]?.message?.content;
          const markerReceived = typeof content === 'string' && content.includes('LIVE_PREFLIGHT_OK');
          console.log(JSON.stringify({ provider: 'cerebras', model, completionHttpStatus: response.status, markerReceived }));
          process.exitCode = response.ok && markerReceived ? 0 : 2;
          NODE
