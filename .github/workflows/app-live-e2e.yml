name: App Live Chat Cerebras Qualification
on:
  workflow_dispatch:
    inputs:
      run_android_local_chat:
        description: Also run the on-device Android local-chat smoke (boots an emulator
          + builds/installs the APK + stages a GGUF).
        type: boolean
        default: false
      run_cloud_staging:
        description: Also run the staging Cloud login+personal-identity+chat lane
          (requires the staging Environment's ELIZAOS_CLOUD_API_KEY).
        type: boolean
        default: false
      approve_staging_billable_dedicated_confirmation:
        description: Explicitly approve one visible Dedicated confirmation click in the
          staging Cloud lane. This may start billable compute.
        type: boolean
        default: false
      run_native_staging_credentials:
        description: Exercise scoped staging native PKCE, encrypted restoration and
          revocation without external provider sign-in or paid compute.
        type: boolean
        default: false
      run_cloud_production:
        description: Also run the production Cloud login+personal-identity+chat lane.
          Keep false for staging-only evidence.
        type: boolean
        default: false
      production_credential_preflight_only:
        description: Check production test credential expiry and read-only account
          authentication without browser or model calls. Also select
          run_cloud_production and run_only_requested.
        type: boolean
        default: false
      run_shared_runtime:
        description: Run only finite public/synthetic Shared runtime QA with the
          existing Cerebras key. No app UI, native delivery, account, Cloud or
          deploy access.
        type: boolean
        default: false
      shared_runtime_reviewed_sha:
        description: "For Shared QA only: exact source SHA reviewed after normal source
          CI. Must equal this dispatch commit."
        type: string
        default: ""
      shared_runtime_suite:
        description: "Shared QA: baseline = qualified SF/weather + math + public fact;
          bare-weather = bare SF + math; full adds quiet/truth controls."
        type: choice
        options:
          - baseline
          - bare-weather
          - typed-weather
          - behavior
          - full
        default: baseline
      run_only_requested:
        description: Skip the default local/walkthrough/desktop lanes and run only
          explicitly selected opt-in lanes.
        type: boolean
        default: false
concurrency:
  group: app-live-e2e-${{ github.ref }}${{ inputs.run_shared_runtime &&
    '-shared-runtime' || '' }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI: "true"
  ELIZA_UI_SMOKE_LIVE_STACK: "1"
  BUN_VERSION: 1.4.2
  NODE_VERSION: 24.15.0
  NODE_NO_WARNINGS: "1"
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AI_QA_VISION_BACKEND: openai
  AI_QA_VISION_MODEL: gpt-5-mini
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  ELIZA_VAULT_DISABLE_KEYCHAIN: "1"
  ELIZA_VAULT_PASSPHRASE: app-live-e2e-headless-vault-only
  ELIZA_UI_SMOKE_BACKEND_LOG_PATH: e2e-recordings/app-live/backend.log
jobs:
  app-live-chat:
    name: app live chat (real local runtime)
    if: ${{ !inputs.run_shared_runtime && (github.event_name != 'workflow_dispatch'
      || !inputs.run_only_requested) }}
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]'
      || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 45
    env:
      PGLITE_WASM_MODE: node
      ELIZA_PROVIDER: cerebras
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Free disk space for browser smoke
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true
          df -h /
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          setup-python: "true"
          install-protoc: "true"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
      - name: Install Playwright Chromium
        run: packages/scripts/github/install-playwright-browsers.sh chromium
      - name: Build runtime contracts and provider exports
        run: bunx turbo run build --filter=@elizaos/core
          --filter=@elizaos/plugin-elizacloud
          --filter=@elizaos/plugin-local-inference
      - name: Build app renderer bundle
        run: bun run --cwd packages/app build:web
      - name: Run live agent chat (real model turn)
        shell: bash
        run: >
          set -euo pipefail

          if bun run --cwd packages/app test:e2e
          test/ui-smoke/live-agent-chat.spec.ts --project=chromium -g "live
          agent" >/dev/null 2>&1; then
            echo "Live agent chat passed (category=live-chat-passed; raw-output=suppressed)."
          else
            status=$?
            echo "::error::Live agent chat failed (category=live-chat-failed; exit=${status}; raw-output=suppressed)."
            exit "$status"
          fi
      - name: Run settings + vault live-stack deep e2e
        shell: bash
        run: >
          set -euo pipefail

          run_closed_e2e() {
            local category="$1"
            shift
            if "$@" >/dev/null 2>&1; then
              echo "Credentialed E2E passed (category=${category}-passed; raw-output=suppressed)."
            else
              local status=$?
              echo "::error::Credentialed E2E failed (category=${category}-failed; exit=${status}; raw-output=suppressed)."
              return "$status"
            fi
          }

          run_closed_e2e settings-vault \
            bun run --cwd packages/app test:e2e test/ui-smoke/vault-routing.spec.ts test/ui-smoke/wallet-keys.spec.ts test/ui-smoke/vault-modal-interactions.spec.ts test/ui-smoke/settings-sections-interactions.spec.ts --project=chromium
          # Provider switching deliberately restarts the runtime. Run it in a

          # fresh final harness so its lifecycle cannot strand unrelated tests

          # behind the startup shell while the selected test provider restarts.

          run_closed_e2e provider-config \
            bun run --cwd packages/app test:e2e test/ui-smoke/provider-config.spec.ts --project=chromium
      - name: Upload live-chat artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-live-e2e-chat
          path: e2e-recordings/app-live/backend.log
          if-no-files-found: error
          retention-days: 7
