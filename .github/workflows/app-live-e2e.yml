name: App Live E2E Reviewer Credential Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
      - name: Probe both supported reviewer providers
        run: |
          node --input-type=module <<'NODE'
          process.argv[1] = 'reviewer-provider-probe';
          const { preflightReviewer } = await import('./packages/scripts/ai-qa/reviewer-preflight.ts');
          const results = [];
          for (const backend of ['openai', 'anthropic']) {
            const result = await preflightReviewer({ backend });
            const httpStatus = /^HTTP (\d+):/.exec(result.detail)?.[1] ?? null;
            const record = { backend, ok: result.ok, classification: result.classification, httpStatus };
            results.push(record);
            console.log(JSON.stringify(record));
          }
          console.log(JSON.stringify({
            otherConfiguredKeys: {
              cerebras: Boolean(process.env.CEREBRAS_API_KEY?.trim()),
              google: Boolean(process.env.GOOGLE_GENERATIVE_AI_API_KEY?.trim()),
              openrouter: Boolean(process.env.OPENROUTER_API_KEY?.trim()),
            },
            supportedReviewerBackends: ['openai', 'anthropic'],
          }));
          if (!results.some(result => result.ok)) {
            const model = 'openai/gpt-5-mini';
            const endpoint = 'https://openrouter.ai/api/v1/chat/completions';
            const probe = await preflightReviewer({ backend: 'openai', apiKey: process.env.OPENROUTER_API_KEY, endpoint, model });
            const record = { backend: 'openrouter-openai-compatible', model, ok: probe.ok, classification: probe.classification, httpStatus: /^HTTP (\d+):/.exec(probe.detail)?.[1] ?? null };
            console.log(JSON.stringify(record));
            if (probe.ok) {
              const { readFile } = await import('node:fs/promises');
              const png = (await readFile('packages/ui/assets/favicons/apple-touch-icon.png')).toString('base64');
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'content-type': 'application/json', authorization: `Bearer ${process.env.OPENROUTER_API_KEY}` },
                body: JSON.stringify({ model, max_completion_tokens: 512, reasoning_effort: 'minimal', response_format: { type: 'json_object' }, messages: [{ role: 'user', content: [{ type: 'text', text: 'Return JSON with key description that describes this image in one sentence.' }, { type: 'image_url', image_url: { url: `data:image/png;base64,${png}` } }] }] }),
                signal: AbortSignal.timeout(60000),
              });
              let validDescription = false;
              if (response.ok) {
                const body = await response.json();
                try { validDescription = typeof JSON.parse(body.choices?.[0]?.message?.content ?? '').description === 'string'; } catch {}
              }
              record.ok = response.ok && validDescription;
              console.log(JSON.stringify({ backend: record.backend, model, imageHttpStatus: response.status, imageVerdictReceived: validDescription }));
            }
            results.push(record);
          }
          process.exitCode = results.some(result => result.ok) ? 0 : 2;
          NODE
