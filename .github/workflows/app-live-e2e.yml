name: App Live E2E Reviewer Credential Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
      - name: Probe both supported reviewer providers
        run: |
          node --input-type=module <<'NODE'
          import { preflightReviewer } from './packages/scripts/ai-qa/reviewer-preflight.ts';
          const results = [];
          for (const backend of ['openai', 'anthropic']) {
            const result = await preflightReviewer({ backend });
            const httpStatus = /^HTTP (\d+):/.exec(result.detail)?.[1] ?? null;
            const record = { backend, ok: result.ok, classification: result.classification, httpStatus };
            results.push(record);
            console.log(JSON.stringify(record));
          }
          console.log(JSON.stringify({
            otherConfiguredKeys: {
              cerebras: Boolean(process.env.CEREBRAS_API_KEY?.trim()),
              google: Boolean(process.env.GOOGLE_GENERATIVE_AI_API_KEY?.trim()),
              openrouter: Boolean(process.env.OPENROUTER_API_KEY?.trim()),
            },
            supportedReviewerBackends: ['openai', 'anthropic'],
          }));
          process.exitCode = results.some(result => result.ok) ? 0 : 2;
          NODE
