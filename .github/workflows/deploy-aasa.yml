name: Deploy iOS Association

on:
  push:
    branches: [main]
    paths:
      - "packages/homepage/edge/apple-app-site-association.json"
      - "packages/homepage/edge/apple-app-site-association.ts"
      - "packages/homepage/edge/apple-app-site-association.test.ts"
      - "packages/homepage/edge/text-modules.d.ts"
      - "packages/homepage/edge/tsconfig.json"
      - "packages/homepage/public/.well-known/apple-app-site-association"
      - "packages/homepage/scripts/verify-aasa-response.mjs"
      - "packages/homepage/wrangler-aasa.toml"
      - "packages/homepage/package.json"
      - "packages/app-core/platforms/ios/App/App.xcodeproj/project.pbxproj"
      - "packages/app-core/platforms/ios/App/App/App.entitlements"
      - ".github/workflows/deploy-aasa.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Full commit SHA or release tag containing the AASA contract to publish"
        required: false
        type: string

concurrency:
  group: deploy-aasa-edge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-ref:
    name: Validate Production Source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Resolve production deploy commit
        id: resolve
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REPOSITORY" != "elizaOS/eliza" ]; then
            echo "::error::The production AASA workflow may run only in elizaOS/eliza."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual production AASA deployments must dispatch the workflow from main."
            exit 1
          fi

          git fetch --force --tags origin \
            "+refs/heads/main:refs/remotes/origin/main"

          requested="$REQUESTED_REF"
          if [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            resolved="$(git rev-parse --verify "${requested}^{commit}")"
          else
            tag="${requested#refs/tags/}"
            if [ -z "$tag" ] || ! git check-ref-format "refs/tags/$tag"; then
              echo "::error::AASA deployments accept only a full commit SHA or a release tag."
              exit 1
            fi
            resolved="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          fi

          if ! git merge-base --is-ancestor "$resolved" origin/main; then
            echo "::error::AASA deploy commit $resolved is not contained in origin/main."
            exit 1
          fi

          echo "sha=$resolved" >> "$GITHUB_OUTPUT"

  deploy-and-verify-origin:
    name: Publish & Verify iOS Association Origin
    needs: validate-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-ref.outputs.sha }}
          persist-credentials: false
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Test and typecheck AASA edge contract
        working-directory: packages/homepage
        run: bun run test:aasa-edge

      - name: Bundle AASA edge Worker
        working-directory: packages/homepage
        run: bunx wrangler@4.100.0 deploy --config wrangler-aasa.toml --dry-run --outdir "$RUNNER_TEMP/eliza-app-aasa-edge"

      - name: Check AASA edge credentials
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required before publishing the iOS association."
            exit 1
          fi

      - name: Deploy AASA edge Worker
        id: deploy
        working-directory: packages/homepage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:aasa-edge

      - name: Verify live AASA origin immediately
        id: origin
        run: node packages/homepage/scripts/verify-aasa-response.mjs --origin-live --attempts=12 --retry-ms=5000 --timeout-ms=5000

      - name: Restore the previous safe origin on verification failure
        if: ${{ always() && steps.deploy.outcome == 'success' && steps.origin.outcome != 'success' }}
        working-directory: packages/homepage
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if bunx wrangler@4.100.0 rollback --config wrangler-aasa.toml --yes --message "Automatic rollback after AASA origin verification failed"; then
            exit 0
          fi

          echo "::warning::No previous Worker version was available; deleting the exact-path Worker restores the inert Pages fallback."
          bunx wrangler@4.100.0 delete --config wrangler-aasa.toml --force

  verify-apple-cdn:
    name: Observe Apple CDN Readiness
    needs: [validate-ref, deploy-and-verify-origin]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-ref.outputs.sha }}
          persist-credentials: false
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"

      - name: Wait for Apple's unmodified CDN cache
        run: node packages/homepage/scripts/verify-aasa-response.mjs --apple-cdn-live --attempts=60 --retry-ms=15000 --timeout-ms=10000
