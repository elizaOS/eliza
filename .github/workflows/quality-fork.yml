name: Quality (Fork)

# Fork-safe quality variant. Only runs on PRs from forked repositories
# (or via manual dispatch) so secret-less forks still get lint, typecheck,
# and a build smoke without inheriting any privileged secrets.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # PR metadata changes may enqueue a skipped pull_request run while a manual
  # exact-head proof is waiting. Event-scoped groups keep that skipped run from
  # cancelling the manual proof before a hosted runner is assigned.
  group: quality-fork-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-24.04
    # Fresh Turbo-cold attempt 5 was still linting successfully when the old
    # 10m ceiling canceled it at 10m26s. Allow a finite 15m cold window; attempt
    # 4 completed the same lane in 8m30s.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          clean: true

      - name: Enforce runner workspace hygiene
        run: |
          # Self-hosted runners reuse the _work checkout across workflows. Jobs
          # that check out submodules (nightly, build-android, publish-packages,
          # voice-live-e2e, ...) leave populated submodule trees behind, and
          # actions/checkout with `submodules: false` does not remove them.
          # Their vendored files can leak into later repo-wide commands unless
          # the reused checkout is cleaned explicitly.
          git submodule deinit -f --all >/dev/null
          git clean -ffdx --quiet
          status_output=$(git status --porcelain)
          if [ -n "$status_output" ]; then
            echo "::error::Runner workspace contaminated: git status is not clean after submodule deinit + clean. This is a stale-runner-workspace problem, not a branch regression."
            echo "$status_output"
            exit 1
          fi
          populated=$(git submodule status | grep -cv '^-' || true)
          if [ "$populated" != "0" ]; then
            echo "::error::Runner workspace contaminated: $populated submodule(s) still populated in a submodules:false job."
            git submodule status
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          # Fork lint is intentionally bounded; restoring the broad fallback
          # can cost more than installing the exact lockfile dependency set.
          cache-bun-install: "false"

      - name: Run anti-larp test gate self-test
        run: bun run audit:focused-tests:self-test

      - name: Run anti-larp test gate
        run: bun run audit:focused-tests

      - name: Run type-duplication finder self-test
        run: bun run audit:type-duplication:self-test

      - name: Run lint (read-only)
        run: bun run lint:check

      - name: Run format check
        run: bun run format:check

  typecheck:
    name: Type Check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-24.04
    # Fresh attempt #16657 measured 4m15s of setup (including a wasteful 2m50s
    # stale 1.6 GiB Bun-cache fallback restore) plus 13m28s of still-running
    # full-graph typecheck. Skip that stale restore below and retain a finite
    # 25m cold ceiling for the unfiltered graph; warm runs remain much faster.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          cache-bun-install: "false"

      # @elizaos/core's package.json points "main"/"types" at dist/ files
      # that don't exist until the build runs. Plugins that resolve core
      # via node_modules (rather than the root tsconfig path mapping) fail
      # typecheck without this. turbo.json declares `typecheck` depends on
      # `@elizaos/core#build`, but downstream packages with broken src
      # references can fail before turbo schedules the core build, so we
      # build it explicitly here.
      - name: Build @elizaos/core dist
        working-directory: packages/core
        run: bun run build

      - name: Run typecheck
        # The full graph starts native TypeScript workers; eight concurrent
        # processes can exhaust a four-vCPU hosted runner before diagnostics.
        run: NODE_OPTIONS='--max-old-space-size=8192' node packages/scripts/run-turbo.mjs run typecheck --concurrency=4

  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-24.04
    # A cold workspace build alone has taken 13m and the two-worker homepage
    # suite 25m38s total; the old 32m ceiling cancelled real runs mid-suite
    # whenever both were cold (observed on #17157 and #17256). 45m covers the
    # measured worst case of each phase with margin; homepage-scope gating
    # below keeps non-homepage PRs from paying the suite at all.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        env:
          # The legacy fixture bundle contains stale visual baselines; homepage
          # tests must use the expectations committed with the checked-out SHA.
          ELIZA_SKIP_ARTIFACT_SYNC: "1"
        with:
          bun-version: ${{ env.BUN_VERSION }}
          python-version: "3.13"
          install-command: bun install --frozen-lockfile --ignore-scripts
          cache-bun-install: "false"

      - name: Install pinned skill validator dependency
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          --requirement packages/skills/skills/skill-creator/requirements.txt

      - name: Validate fork-safe browser contract
        run: bun run audit:quality-fork-browser

      - name: Build
        run: bun run build

      # Mirrors quality.yml's homepage-scope gate: the homepage Playwright
      # suite only proves anything when a homepage release surface changed,
      # and unconditionally running it burned ~20 runner-minutes per fork PR
      # while pushing cold runs past the job ceiling.
      - name: Check homepage smoke scope
        id: homepage-scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "${{ github.base_ref }}"
          if merge_base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"; then
            changed_files="$(git diff --name-only "${merge_base}" HEAD)"
          else
            echo "No merge base found with origin/${{ github.base_ref }}; falling back to direct base/head diff." >&2
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)"
          fi
          if grep -Eq '^(packages/homepage/|packages/shared/|packages/app-core/scripts/write-homepage-release-data\.mjs|\.github/workflows/(deploy-homepage|release-electrobun|release-orchestrator|quality-fork)\.yml)' <<< "${changed_files}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip unrelated homepage smoke
        if: steps.homepage-scope.outputs.run != 'true'
        run: echo "Skipping homepage smoke; this PR does not touch homepage release surfaces."

      - name: Build homepage
        if: steps.homepage-scope.outputs.run == 'true'
        working-directory: packages/homepage
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install homepage browser
        if: steps.homepage-scope.outputs.run == 'true'
        working-directory: packages/homepage
        run: ./node_modules/.bin/playwright install chromium

      - name: Test homepage downloads
        if: steps.homepage-scope.outputs.run == 'true'
        working-directory: packages/homepage
        # The Three.js landing route consumes the runner's software-rendering
        # budget by itself. A second browser makes wall-clock animation time
        # exceed the readiness boundary and costs more in retries than serial
        # execution costs here.
        run: bun run test:e2e --workers=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload homepage browser failure artifacts
        if: failure() && steps.homepage-scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homepage-playwright-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/homepage/test-results
          if-no-files-found: error
          retention-days: 7

  elizaos-cli-global-smoke:
    name: elizaos CLI global-install smoke (#8000)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        env:
          HOME: ${{ runner.temp }}/bun-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          USERPROFILE: ${{ runner.temp }}/bun-home-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint bin exports (#8000 static guard)
        run: bun run --cwd packages/elizaos lint:bin-exports

      - name: Packaged smoke (global + local install, node + bun)
        run: bun run --cwd packages/elizaos test:packaged
