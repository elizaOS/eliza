# This read-only workflow preserves deterministic macOS and Windows runtime
# proof. Develop Full remains the sole automatic authority; manual dispatches
# use the trusted develop definition to test one exact candidate commit.
name: Core Platform Tests
run-name: Core Platform Tests (${{ inputs.source_sha || github.sha }})

on:
  workflow_call:
    inputs:
      run_windows_workflow:
        description: Run Windows workflow survivor acceptance against the exact source
        required: false
        type: boolean
        default: false
      source_sha:
        description: Optional exact commit SHA for a trusted caller
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      run_windows_workflow:
        description: Run Windows workflow survivor acceptance against the exact source
        required: false
        type: boolean
        default: false
      source_sha:
        description: Exact 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  platform-smoke:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Validate manual source request
        if: inputs.source_sha != ''
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Manual Platform Smoke must be dispatched with --ref develop"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be an exact lowercase 40-character commit SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual_sha instead of requested $EXPECTED_SHA"
            exit 1
          fi
          echo "Validated source: \`$actual_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Run batch watchdog process-tree self-test
        run: node packages/scripts/test-cloud-run-watchdog.self-test.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Link workspace packages
        run: node packages/scripts/ensure-workspace-symlinks.ts

      - name: Build core
        run: bun run --cwd packages/core build

      - name: Run core tests
        run: bun run test:core

  workflow-windows-survivor:
    if: inputs.run_windows_workflow == true
    name: Workflow survivor (Windows, exact source)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Validate manual source request
        if: inputs.source_sha != ''
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Manual Platform Smoke must be dispatched with --ref develop"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be an exact lowercase 40-character commit SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual_sha instead of requested $EXPECTED_SHA"
            exit 1
          fi
          echo "Validated source: \`$actual_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Install dependencies with normal hooks
        run: bun install --frozen-lockfile
      - name: Check embedded native helper
        run: bun plugins/plugin-workflow/scripts/build-windows-lease-resource.ts --check
      - name: Check child prelude
        run: bun plugins/plugin-workflow/scripts/build-worker-lease-prelude.ts --check
      - name: Check owning source formatting
        working-directory: plugins/plugin-workflow
        run: bunx --no-install biome format src/services/workflow-worker-lease.windows.ts src/services/platform-backend-contract.ts src/services/windows-worker-lease-resource.ts src/services/workflow-worker-lease-prelude.ts
      - name: Native Windows and real Smithers survivor acceptance
        shell: powershell
        run: ./plugins/plugin-workflow/scripts/windows-lease/Run-WindowsAcceptance.ps1
