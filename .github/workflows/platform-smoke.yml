# This reusable workflow preserves deterministic macOS and Windows runtime proof
# inside the single Develop Full authority.
name: Platform Smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Run batch watchdog process-tree self-test
        run: node packages/scripts/test-cloud-run-watchdog.self-test.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build core
        run: bun run build:core

      - name: Run core tests
        run: bun run test:core
