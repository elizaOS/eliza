name: Valhalla iOS simulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/plugin-valhalla-copybot/mobile/**"
      - ".github/workflows/valhalla-ios.yml"

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: plugins/plugin-valhalla-copybot/mobile
        run: npm install
      - name: Unsigned simulator project
        working-directory: plugins/plugin-valhalla-copybot/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Pods
        working-directory: plugins/plugin-valhalla-copybot/mobile/ios
        run: pod install
      - name: Simulator build
        working-directory: plugins/plugin-valhalla-copybot/mobile/ios
        run: |
          xcodebuild \
            -workspace Valhalla.xcworkspace \
            -scheme Valhalla \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Signing later
        run: echo "No Apple team secret is required for this simulator build. Device signing can use APPLE_TEAM_ID later."
