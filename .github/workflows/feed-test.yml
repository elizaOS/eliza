name: feed-test

# Path-gated CI lane for the nested packages/feed monorepo (issue #9943).
#
# Why this exists: packages/feed has ~525 test files but ran in ZERO CI lanes.
# The root workspace excludes it (`!packages/feed`) and the root test runner
# honors that negation, while feed's own `test:ci` script was invoked by nothing.
# This lane compiles the direct elizaOS workspace dependencies, runs Feed's
# typecheck and unit suite, then builds and boots the production container. The
# container check is the packaging contract: inference/storage plugins must be
# installed, importable, and able to serve an authenticated database-backed
# health request from the same image Railway deploys.

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "packages/feed/**"
      - "packages/cloud/routing/**"
      - "packages/contracts/**"
      - "packages/core/**"
      - "packages/logger/**"
      - "packages/prompts/**"
      - "packages/registry/**"
      - "packages/shared/**"
      - "plugins/plugin-anthropic/**"
      - "plugins/plugin-openai/**"
      - "plugins/plugin-sql/**"
      - ".dockerignore"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/feed-test.yml"
  workflow_dispatch:

concurrency:
  group: feed-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  feed-checks:
    name: feed compile, unit, and production image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Required env for feed modules that validate configuration at import time.
    # CI-only placeholders — no secrets. DATABASE_URL points at the postgres
    # service below so any lazily-connecting module resolves a real DSN.
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/feed_test"
      DIRECT_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/feed_test"
      NEXT_PUBLIC_STEWARD_API_URL: "http://localhost:31337"
      STEWARD_JWT_SECRET: "ci-feed-unit-placeholder-jwt-secret"
      CRON_SECRET: "ci-feed-unit-placeholder-cron-secret"
      NODE_ENV: "test"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      # The root workspace owns every Feed app/package plus the elizaOS plugins
      # they reference. Installing again from the deliberately excluded Feed
      # root cannot resolve those root-owned plugin workspaces.
      - name: Install root workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Feed's elizaOS workspace dependencies
        run: |
          bun run --cwd packages/shared build
          bun run --cwd packages/core build
          bun run --cwd plugins/plugin-sql build
          bun run --cwd plugins/plugin-anthropic build
          bun run --cwd plugins/plugin-openai build

      - name: Typecheck feed workspace
        working-directory: packages/feed
        run: bun run typecheck

      - name: Run feed unit tests
        working-directory: packages/feed
        run: bun run test:unit

      - name: Build Feed production image
        run: docker build -f packages/feed/Dockerfile -t feed-production-ci .

      - name: Boot Feed production image and probe database health
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name feed-production-smoke --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env DIRECT_DATABASE_URL="$DIRECT_DATABASE_URL" \
            --env NEXT_PUBLIC_STEWARD_API_URL="$NEXT_PUBLIC_STEWARD_API_URL" \
            --env STEWARD_JWT_SECRET="$STEWARD_JWT_SECRET" \
            --env CRON_SECRET="$CRON_SECRET" \
            --env NODE_ENV=production \
            --env PORT=3100 \
            feed-production-ci
          cleanup() {
            docker logs feed-production-smoke || true
            docker rm --force feed-production-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error \
              --header "Authorization: Bearer $CRON_SECRET" \
              http://127.0.0.1:3100/api/cron/health-check; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' feed-production-smoke | grep -q true; then
              exit 1
            fi
            sleep 2
          done
          exit 1
