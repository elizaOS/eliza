# Validates the Flathub packaging contract and performs a clean, network-disabled
# build of the store manifest on Linux whenever its release inputs change.

name: Flatpak packaging

on:
  pull_request:
    paths:
      - ".github/workflows/flatpak-packaging.yml"
      - "package.json"
      - "packages/elizaos/package.json"
      - "packages/app-core/package.json"
      - "packages/app-core/scripts/flatpak-packaging.test.mjs"
      - "packages/app-core/packaging/flatpak/**"
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/flatpak-packaging.yml"
      - "package.json"
      - "packages/elizaos/package.json"
      - "packages/app-core/package.json"
      - "packages/app-core/scripts/flatpak-packaging.test.mjs"
      - "packages/app-core/packaging/flatpak/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build store manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --or-update flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.flatpak.Builder

      - name: Verify pinned packaging inputs
        run: node --test packages/app-core/scripts/flatpak-packaging.test.mjs

      - name: Run Flathub manifest and AppStream linters
        working-directory: packages/app-core/packaging/flatpak
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest ai.elizaos.App.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            appstream ai.elizaos.App.metainfo.xml

      - name: Build Flathub manifest without network
        working-directory: packages/app-core/packaging/flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --install --repo=repo \
            --mirror-screenshots-url=https://dl.flathub.org/media \
            --compose-url-policy=full build-dir ai.elizaos.App.yml

      - name: Lint repository
        working-directory: packages/app-core/packaging/flatpak
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo

      - name: Exercise installed entrypoint
        if: ${{ always() }}
        run: flatpak run ai.elizaos.App --version
