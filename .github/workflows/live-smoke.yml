# This manual workflow is the general credential-backed product smoke
# dispatcher. Specialized app and voice live-evidence flows
# (`app-live-e2e.yml`, `voice-live-e2e.yml`) also run on schedule or dispatch.
# Live integrations do not run on pull requests, so missing credentials cannot
# make normal repository health red.
name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Live surface to exercise
        required: true
        default: all
        type: choice
        options: [all, app, scenarios, group-chat, live-information, cloud, voice, dedicated]
      planner_provider:
        description: Acting model provider for focused live-information or group-chat suites
        required: true
        default: openai
        type: choice
        options: [openai, anthropic, openrouter]
      stale_canary_suffix:
        description: "Exact prior dedicated-canary suffix (r<run-id>a<attempt>) to verify and delete before the fresh canary"
        required: false
        type: string
        default: ""
      diagnose_canary_suffix:
        description: "Read-only staging diagnosis for one exact failed dedicated-canary suffix; performs no lifecycle mutation"
        required: false
        type: string
        default: ""
      cleanup_only:
        description: "Delete only the exact prior dedicated canary; never create a replacement"
        required: false
        type: boolean
        default: false

concurrency:
  # The shared smoke credential must remain attached to an empty organization.
  # Serialize every manual live suite so an `all` and `cloud` dispatch cannot
  # race between the read-only preflight and fresh create.
  group: live-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ inputs.suite }}
    # cleanup_only is an exclusive destructive-recovery mode. Never run an
    # unrelated live suite under the same dispatch, regardless of suite input.
    if: ${{ inputs.diagnose_canary_suffix == '' && !inputs.cleanup_only && inputs.suite != 'dedicated' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY || secrets.ELIZACLOUD_API_KEY }}
      ELIZAOS_CLOUD_BASE_URL: ${{ vars.ELIZAOS_CLOUD_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Require exact independently judged scenario credentials
        if: inputs.suite == 'live-information' || inputs.suite == 'group-chat'
        shell: bash
        env:
          PLANNER_PROVIDER: ${{ inputs.planner_provider }}
        run: |
          set -euo pipefail
          case "$PLANNER_PROVIDER" in
            openai) planner_key="${OPENAI_API_KEY:-}" ;;
            anthropic) planner_key="${ANTHROPIC_API_KEY:-}" ;;
            openrouter) planner_key="${OPENROUTER_API_KEY:-}" ;;
            *) echo "::error::Unsupported acting model provider."; exit 1 ;;
          esac
          planner_key_without_whitespace="${planner_key//[[:space:]]/}"
          judge_key="${EVAL_CEREBRAS_API_KEY:-${CEREBRAS_API_KEY:-}}"
          judge_key_without_whitespace="${judge_key//[[:space:]]/}"
          if [[ -z "$planner_key_without_whitespace" ]]; then
            echo "::error::The selected acting model credential is missing or blank; compatible provider keys cannot substitute for it."
            exit 1
          fi
          if [[ -z "$judge_key_without_whitespace" ]]; then
            echo "::error::The independent Cerebras judge credential is missing or blank."
            exit 1
          fi
          unset planner_key planner_key_without_whitespace judge_key judge_key_without_whitespace

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          node-version: "24.15.0"
          install-command: bun install --frozen-lockfile --ignore-scripts
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install Chromium
        if: inputs.suite == 'all' || inputs.suite == 'app'
        run: .github/scripts/install-playwright-browsers.sh chromium

      - name: App walkthrough
        if: inputs.suite == 'all' || inputs.suite == 'app'
        run: bun run --cwd packages/app test:e2e:walkthrough:live

      # Both the scenario graph and cloud API load the compiled
      # @elizaos/core/edge export. The lean install above skips lifecycle
      # scripts, so build that contract before either consumer starts.
      - name: Build core runtime contract
        if: inputs.suite == 'all' || inputs.suite == 'scenarios' || inputs.suite == 'group-chat' || inputs.suite == 'live-information' || inputs.suite == 'cloud'
        run: bun run build:core

      - name: Live scenarios
        if: inputs.suite == 'all' || inputs.suite == 'scenarios'
        run: bun run --cwd packages/scenario-runner test:live:e2e

      - name: Group-chat evaluation
        if: inputs.suite == 'group-chat'
        id: group-chat-evaluation
        continue-on-error: true
        env:
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          SCENARIO_TURN_TIMEOUT_MS: "300000"
        run: >-
          bun packages/scripts/run-scenarios-isolated.mjs
          packages/test/scenarios/group-chat
          --lane live-only
          --provider ${{ inputs.planner_provider }}
          --workers 4
          --timeout-ms 900000
          --report reports/group-chat-evaluation/aggregate.json
          --artifacts-dir reports/group-chat-evaluation/scenarios

      - name: Validate complete independently judged group-chat evidence
        if: inputs.suite == 'group-chat'
        run: >-
          bun packages/scripts/validate-group-chat-eval-report.ts
          --report reports/group-chat-evaluation/aggregate.json
          --artifacts-dir reports/group-chat-evaluation/scenarios
          --scenario-dir packages/test/scenarios/group-chat
          --provider ${{ inputs.planner_provider }}

      - name: Upload group-chat evaluation evidence
        if: always() && inputs.suite == 'group-chat'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: group-chat-${{ inputs.planner_provider }}-${{ github.run_id }}
          path: reports/group-chat-evaluation
          if-no-files-found: error
          retention-days: 14

      - name: Live information routing
        if: inputs.suite == 'live-information'
        env:
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          SCENARIO_TURN_TIMEOUT_MS: "300000"
        run: >-
          bun --conditions eliza-source --tsconfig-override tsconfig.json
          packages/scenario-runner/src/cli.ts run packages/test/scenarios
          --scenario cross.live-information-routing --lane live-only
          --provider ${{ inputs.planner_provider }}
          --run-dir reports/scenarios/live-information/run
          --report-dir reports/scenarios/live-information/report
          --export-native reports/scenarios/live-information/native.jsonl

      - name: Upload live information evidence
        if: always() && inputs.suite == 'live-information'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-information-${{ inputs.planner_provider }}-${{ github.run_id }}
          path: reports/scenarios/live-information
          if-no-files-found: warn
          retention-days: 14

      - name: Cloud end-to-end
        if: inputs.suite == 'all' || inputs.suite == 'cloud'
        run: bun run test:cloud:e2e

      - name: Voice service
        if: inputs.suite == 'all' || inputs.suite == 'voice'
        run: bun run --cwd packages/scenario-runner test:real-service:voice

      - name: Railway voice contract
        if: inputs.suite == 'all' || inputs.suite == 'voice'
        env:
          ELIZA_VOICE_LIVE_RAILWAY: "1"
          KOKORO_TTS_URL: ${{ vars.ELIZA_VOICE_KOKORO_TTS_URL }}
          WHISPER_STT_URL: ${{ vars.ELIZA_VOICE_WHISPER_STT_URL }}
          WHISPER_STT_MODEL: ${{ vars.ELIZA_VOICE_WHISPER_STT_MODEL }}
        run: bun test packages/cloud/api/__tests__/voice-kokoro-whisper-live.test.ts

  dedicated:
    name: Managed dedicated staging canary
    if: inputs.diagnose_canary_suffix == '' && (inputs.cleanup_only || inputs.suite == 'all' || inputs.suite == 'dedicated')
    runs-on: ubuntu-24.04
    environment: staging
    # Serialize this live lifecycle even when an `all` run overlaps a
    # `dedicated` run. Cleanup must finish before another canary starts.
    concurrency:
      group: managed-dedicated-staging-canary
      cancel-in-progress: false
    # Absolute script deadlines stay below this cap and reserve time for the
    # finally cleanup before Actions can terminate the job.
    timeout-minutes: 45
    env:
      CLOUD_DEDICATED_CANARY_BASE_URL: https://api-staging.eliza.app
      CLOUD_DEDICATED_CANARY_EVIDENCE_PATH: reports/managed-dedicated-canary.json
      CLOUD_DEDICATED_CANARY_STALE_CANARY_SUFFIX: ${{ inputs.stale_canary_suffix || '' }}
      CLOUD_DEDICATED_CANARY_CLEANUP_ONLY: ${{ inputs.cleanup_only && 'true' || 'false' }}
      # Conditional identity checks and lifecycle locking first shipped here.
      # Cleanup-only may run from a newer workflow branch, so bind it to this
      # minimum deployed API contract instead of incorrectly requiring HEAD.
      CLOUD_DEDICATED_CANARY_MINIMUM_CLEANUP_API_SHA: aada8198bc10045c8c841ea4d6dab974ac2a3319
      # Keep this identical to App Live's accepted repository-secret contract.
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY || secrets.ELIZACLOUD_API_KEY }}
    steps:
      - name: Require real Cloud credential
        shell: bash
        run: |
          set -euo pipefail
          cloud_key_without_whitespace="${ELIZAOS_CLOUD_API_KEY:-}"
          cloud_key_without_whitespace="${cloud_key_without_whitespace//[[:space:]]/}"
          if [[ -z "$cloud_key_without_whitespace" ]]; then
            echo "::error::Managed dedicated canary requires ELIZAOS_CLOUD_API_KEY or ELIZACLOUD_API_KEY; refusing green-by-skip."
            exit 1
          fi
          unset cloud_key_without_whitespace

      - name: Require exact staging target
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expected = "https://api-staging.eliza.app";
          const raw = process.env.CLOUD_DEDICATED_CANARY_BASE_URL ?? "";
          let url;
          try {
            url = new URL(raw);
          } catch {
            throw new Error("Managed dedicated canary target is not a valid URL");
          }
          if (
            url.origin !== expected ||
            url.username ||
            url.password ||
            (url.pathname !== "/" && url.pathname !== "") ||
            url.search ||
            url.hash
          ) {
            throw new Error(
              "Managed dedicated canary is pinned to the exact staging origin without userinfo, path, query, or fragment",
            );
          }
          NODE

      - name: Bind stale-recovery intent
        id: recovery_intent
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const raw =
            process.env.CLOUD_DEDICATED_CANARY_STALE_CANARY_SUFFIX ?? "";
          const requested = raw !== "";
          const cleanupOnly =
            process.env.CLOUD_DEDICATED_CANARY_CLEANUP_ONLY === "true";
          if (requested && !/^r[1-9]\d{7,19}a[1-9]\d{0,3}$/.test(raw)) {
            throw new Error("Stale-canary recovery input is invalid");
          }
          if (cleanupOnly && !requested) {
            throw new Error("Cleanup-only requires an exact stale-canary suffix");
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `requested=${requested ? "true" : "false"}\n`,
          );
          NODE

      - name: Checkout exact run commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Preflight cleanup API ancestry
        id: cleanup_api_preflight
        if: inputs.cleanup_only
        shell: bash
        run: |
          set -euo pipefail
          deployed_commit="$(
            node --input-type=module <<'NODE'
            const response = await fetch("https://api-staging.eliza.app/api/health", {
              headers: { accept: "application/json" },
              signal: AbortSignal.timeout(20_000),
            });
            if (!response.ok) {
              throw new Error(`Staging health returned HTTP ${response.status}`);
            }
            const body = await response.json();
            if (
              typeof body !== "object" ||
              body === null ||
              typeof body.commit !== "string" ||
              !/^[a-f0-9]{40}$/.test(body.commit)
            ) {
              throw new Error("Staging health did not return an exact deploy commit");
            }
            process.stdout.write(body.commit);
          NODE
          )"
          minimum_cleanup_api_sha="${CLOUD_DEDICATED_CANARY_MINIMUM_CLEANUP_API_SHA:-}"
          if [[ -z "$minimum_cleanup_api_sha" ]] || ! git cat-file -e "${minimum_cleanup_api_sha}^{commit}" 2>/dev/null; then
            echo "::error::Required cleanup API contract commit is absent from this repository checkout."
            exit 1
          fi
          if ! git cat-file -e "${deployed_commit}^{commit}" 2>/dev/null; then
            echo "::error::Staging reported a deploy commit absent from this repository checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$minimum_cleanup_api_sha" "$deployed_commit"; then
            echo "::error::Staging deploy predates the conditional cleanup API contract."
            exit 1
          fi
          echo "deployed_commit=$deployed_commit" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install contract dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate canary and workflow contracts
        run: |
          bun test \
            packages/cloud/scripts/admin/bridge-reply-verdict.test.ts \
            packages/cloud/scripts/admin/managed-dedicated-canary.test.ts \
            packages/cloud/scripts/admin/managed-dedicated-canary-workflow.test.ts

      - name: Run bounded managed dedicated canary
        id: live
        if: ${{ success() && (!inputs.cleanup_only || steps.cleanup_api_preflight.outcome == 'success') }}
        env:
          CLOUD_DEDICATED_CANARY_EXPECTED_DEPLOY_COMMIT: ${{ steps.cleanup_api_preflight.outputs.deployed_commit || '' }}
        shell: bash
        run: |
          set +e
          mkdir -p reports
          bun run packages/cloud/scripts/admin/managed-dedicated-canary.ts
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Validate privacy-safe evidence artifact
        id: privacy
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$CLOUD_DEDICATED_CANARY_EVIDENCE_PATH"
          if [[ ! -s "$evidence_path" ]]; then
            echo "::error::Canary produced no evidence artifact to privacy-check."
            exit 1
          fi
          bun -e '
            import { readFileSync, renameSync, writeFileSync } from "node:fs";
            import { canonicalizeManagedDedicatedCanaryArtifact } from "./packages/cloud/scripts/admin/managed-dedicated-canary.ts";
            const evidencePath = process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH;
            if (!evidencePath) {
              console.error("::error::Canary evidence path is not configured.");
              process.exit(1);
            }
            const { canonical, errors } = canonicalizeManagedDedicatedCanaryArtifact(
              readFileSync(evidencePath, "utf8"),
            );
            if (errors.length > 0) {
              console.error("::error::Canary evidence failed strict privacy validation: " + errors.join(","));
              process.exit(1);
            }
            if (canonical === null) process.exit(1);
            const canonicalPath = evidencePath + ".validated-" + process.pid;
            writeFileSync(canonicalPath, canonical, { mode: 0o600 });
            renameSync(canonicalPath, evidencePath);
          '
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Upload privacy-safe timing and path evidence
        if: ${{ always() && steps.privacy.outputs.validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-dedicated-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/managed-dedicated-canary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce live proof, deployed SHA, and cleanup
        if: ${{ always() }}
        env:
          LIVE_PROCESS_STATUS: ${{ steps.live.outputs.status }}
          PRIVACY_VALIDATED: ${{ steps.privacy.outputs.validated }}
          EXPECTED_RECOVERY_REQUESTED: ${{ steps.recovery_intent.outputs.requested }}
          EXPECTED_CLEANUP_ONLY: ${{ inputs.cleanup_only && 'true' || 'false' }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$CLOUD_DEDICATED_CANARY_EVIDENCE_PATH"
          if [[ ! -s "$evidence_path" ]]; then
            echo "::error::Canary produced no evidence; zero-executed/skip outcomes are failures."
            exit 1
          fi
          if [[ "${PRIVACY_VALIDATED:-missing}" != "true" ]]; then
            echo "::error::Canary evidence did not pass the separate strict privacy validator."
            exit 1
          fi

          deployed_commit="$(
            bun -e '
              import { readFileSync } from "node:fs";
              import {
                validateManagedDedicatedCanaryCleanupEvidence,
                validateManagedDedicatedCanaryEvidence,
              } from "./packages/cloud/scripts/admin/managed-dedicated-canary.ts";
              const evidence = JSON.parse(readFileSync(process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH, "utf8"));
              const cleanupOnly = process.env.EXPECTED_CLEANUP_ONLY === "true";
              const errors = cleanupOnly
                ? validateManagedDedicatedCanaryCleanupEvidence(evidence)
                : validateManagedDedicatedCanaryEvidence(evidence);
              const expectedRecoveryRequested =
                process.env.EXPECTED_RECOVERY_REQUESTED === "true";
              if (evidence.recovery?.requested !== expectedRecoveryRequested) {
                errors.push("workflow_recovery_intent_mismatch");
              }
              if (errors.length > 0) {
                console.error("::error::Canary evidence rejected: " + errors.join(","));
                process.exit(1);
              }
              process.stdout.write(evidence.deployedCommit);
            '
          )"

          if [[ "${LIVE_PROCESS_STATUS:-missing}" != "0" ]]; then
            echo "::error::Live canary process exited ${LIVE_PROCESS_STATUS:-without status}."
            exit 1
          fi
          if ! git cat-file -e "${deployed_commit}^{commit}" 2>/dev/null; then
            echo "::error::Staging reported a deploy commit absent from this repository checkout."
            exit 1
          fi
          if [[ "${EXPECTED_CLEANUP_ONLY:-false}" != "true" ]]; then
            expected_source_sha="${EXPECTED_SOURCE_SHA:-}"
            if [[ -z "$expected_source_sha" ]] || ! git cat-file -e "${expected_source_sha}^{commit}" 2>/dev/null; then
              echo "::error::Expected canary source commit is absent from this repository checkout."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$expected_source_sha" "$deployed_commit"; then
              echo "::error::Staging deploy does not contain this canary's expected source commit."
              exit 1
            fi
          else
            minimum_cleanup_api_sha="${CLOUD_DEDICATED_CANARY_MINIMUM_CLEANUP_API_SHA:-}"
            if [[ -z "$minimum_cleanup_api_sha" ]] || ! git cat-file -e "${minimum_cleanup_api_sha}^{commit}" 2>/dev/null; then
              echo "::error::Required cleanup API contract commit is absent from this repository checkout."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$minimum_cleanup_api_sha" "$deployed_commit"; then
              echo "::error::Staging deploy predates the conditional cleanup API contract."
              exit 1
            fi
          fi

          bun -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(readFileSync(process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH, "utf8"));
            const t = evidence.timingsMs;
            console.log("### Managed dedicated staging canary");
            console.log("");
            console.log("- operation: `" + evidence.operation + "`");
            console.log("- deployed commit: `" + evidence.deployedCommit + "`");
            console.log("- tier: `" + evidence.path.observedTier + "`");
            console.log("- paths: `" + evidence.path.successfulPaths + "/2`");
            console.log("- bridge transport: `" + evidence.path.bridgeTransport + "`");
            console.log("- chat requests: `" + evidence.capacity.chatRequests + "/" + evidence.capacity.maxChatRequests + "`");
            console.log("- recovery requested: `" + evidence.recovery.requested + "`");
            console.log("- recovery match: `" + evidence.recovery.match + "`");
            console.log("- recovery performed: `" + evidence.recovery.performed + "`");
            console.log("- recovery confirmed: `" + evidence.recovery.confirmed + "`");
            console.log("- cleanup: `" + evidence.cleanup.status + "`");
            console.log("");
            console.log("| phase | ms |");
            console.log("| --- | ---: |");
            for (const phase of ["health", "capacityGuard", "create", "ready", "bridge", "sse", "cleanup", "total"]) {
              if (Number.isFinite(t[phase])) console.log("| " + phase + " | " + t[phase] + " |");
            }
          ' >> "$GITHUB_STEP_SUMMARY"

          if [[ "${EXPECTED_CLEANUP_ONLY:-false}" == "true" ]]; then
            echo "Exact staging canary cleanup passed without creating a replacement."
          else
            echo "Managed dedicated canary passed with exact cleanup."
          fi

  dedicated-diagnostic:
    name: Read-only managed dedicated provision diagnosis
    if: inputs.diagnose_canary_suffix != ''
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: managed-dedicated-staging-canary
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      CANARY_DIAGNOSTIC_SUFFIX: ${{ inputs.diagnose_canary_suffix }}
      CANARY_RECOVERY_SUFFIX: ${{ inputs.stale_canary_suffix }}
      CANARY_DIAGNOSTIC_CLEANUP_ONLY: ${{ inputs.cleanup_only && 'true' || 'false' }}
      CANARY_DIAGNOSTIC_RAW_PATH: reports/managed-dedicated-provision-diagnostic.raw.json
      CANARY_DIAGNOSTIC_EVIDENCE_PATH: reports/managed-dedicated-provision-diagnostic.json
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Validate provision diagnostic contract
        run: bun test packages/cloud/scripts/admin/managed-dedicated-provision-diagnostic.test.ts

      - name: Query exact failed canary read-only
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.RAILWAY_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=20000
        run: |
          set -euo pipefail
          raw_ready=false
          cleanup_incomplete_raw() {
            if [[ "$raw_ready" != true ]]; then
              rm -f -- "$CANARY_DIAGNOSTIC_RAW_PATH"
            fi
          }
          trap cleanup_incomplete_raw EXIT
          if [[ ! "$CANARY_DIAGNOSTIC_SUFFIX" =~ ^r[1-9][0-9]{7,19}a[1-9][0-9]{0,3}$ ]]; then
            echo "::error::Diagnostic suffix is invalid."
            exit 1
          fi
          if [[ -n "$CANARY_RECOVERY_SUFFIX" || "$CANARY_DIAGNOSTIC_CLEANUP_ONLY" == true ]]; then
            echo "::error::Read-only diagnosis and lifecycle mutation inputs are mutually exclusive."
            exit 1
          fi
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Staging DATABASE_URL is unavailable."
            exit 1
          fi

          mkdir -p reports
          umask 077
          PSQL_DATABASE_URL="$(
            bun packages/cloud/scripts/admin/libpq-connection-url.ts
          )"
          echo "::add-mask::$PSQL_DATABASE_URL"
          psql "$PSQL_DATABASE_URL" \
            --no-psqlrc \
            --no-align \
            --tuples-only \
            --quiet \
            --set ON_ERROR_STOP=1 \
            --set suffix="$CANARY_DIAGNOSTIC_SUFFIX" \
            > "$CANARY_DIAGNOSTIC_RAW_PATH" <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '20s';
          WITH target AS (
            SELECT
              id,
              status,
              execution_tier,
              database_status,
              error_message,
              error_count,
              updated_at,
              sandbox_id IS NOT NULL AS sandbox_id_present,
              node_id IS NOT NULL AS node_id_present,
              container_name IS NOT NULL AS container_name_present,
              headscale_ip IS NOT NULL AS headscale_ip_present,
              replacement_cleanup_sandbox_id IS NOT NULL AS replacement_sandbox_id_present,
              replacement_cleanup_node_id IS NOT NULL AS replacement_node_id_present,
              replacement_cleanup_container_name IS NOT NULL AS replacement_container_name_present,
              replacement_cleanup_attempt_id IS NOT NULL AS replacement_attempt_id_present,
              replacement_cleanup_container_id IS NOT NULL AS replacement_container_id_present,
              replacement_cleanup_vpn_node_id IS NOT NULL AS replacement_vpn_node_id_present
            FROM agent_sandboxes
            WHERE agent_name = 'managed-dedicated-canary-' || :'suffix'
          ),
          newest_provision_job AS (
            SELECT
              jobs.status,
              jobs.error,
              jobs.result ->> 'error' AS result_error,
              jobs.attempts,
              jobs.max_attempts,
              jobs.retryable_requeues,
              jobs.execution_interruptions,
              jobs.result_storage,
              jobs.error_storage,
              jobs.scheduled_for,
              jobs.started_at,
              jobs.completed_at,
              jobs.created_at,
              jobs.updated_at
            FROM jobs
            INNER JOIN target ON target.id::text = jobs.agent_id
            WHERE jobs.type = 'agent_provision'
            ORDER BY jobs.created_at DESC, jobs.id DESC
            LIMIT 1
          )
          SELECT json_build_object(
            'targetCount', (SELECT count(*) FROM target),
            'agent', (
              SELECT json_build_object(
                'status', status,
                'executionTier', execution_tier,
                'databaseStatus', database_status,
                'errorMessage', error_message,
                'errorCount', error_count,
                'updatedAt', updated_at,
                'locator', json_build_object(
                  'sandboxIdPresent', sandbox_id_present,
                  'nodeIdPresent', node_id_present,
                  'containerNamePresent', container_name_present,
                  'headscaleIpPresent', headscale_ip_present
                ),
                'replacementLocator', json_build_object(
                  'sandboxIdPresent', replacement_sandbox_id_present,
                  'nodeIdPresent', replacement_node_id_present,
                  'containerNamePresent', replacement_container_name_present,
                  'attemptIdPresent', replacement_attempt_id_present,
                  'containerIdPresent', replacement_container_id_present,
                  'vpnNodeIdPresent', replacement_vpn_node_id_present
                )
              )
              FROM target
              LIMIT 1
            ),
            'provisionJob', (
              SELECT json_build_object(
                'status', status,
                'error', error,
                'resultError', result_error,
                'attempts', attempts,
                'maxAttempts', max_attempts,
                'retryableRequeues', retryable_requeues,
                'executionInterruptions', execution_interruptions,
                'resultStorage', result_storage,
                'errorStorage', error_storage,
                'scheduledFor', scheduled_for,
                'startedAt', started_at,
                'completedAt', completed_at,
                'createdAt', created_at,
                'updatedAt', updated_at
              )
              FROM newest_provision_job
            )
          );
          COMMIT;
          SQL
          raw_ready=true

      - name: Classify privacy-safe provision diagnostic
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f -- "$CANARY_DIAGNOSTIC_RAW_PATH"' EXIT
          bun run packages/cloud/scripts/admin/managed-dedicated-provision-diagnostic.ts \
            "$CANARY_DIAGNOSTIC_SUFFIX" \
            "$CANARY_DIAGNOSTIC_RAW_PATH" \
            "$CANARY_DIAGNOSTIC_EVIDENCE_PATH"

      - name: Summarize replacement cleanup reconciliation eligibility
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.RAILWAY_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=20000
        run: |
          set -euo pipefail
          PSQL_DATABASE_URL="$(bun packages/cloud/scripts/admin/libpq-connection-url.ts)"
          echo "::add-mask::$PSQL_DATABASE_URL"
          summary="$({
            psql "$PSQL_DATABASE_URL" \
              --no-psqlrc \
              --no-align \
              --tuples-only \
              --quiet \
              --set ON_ERROR_STOP=1 \
              --set suffix="$CANARY_DIAGNOSTIC_SUFFIX" <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '20s';
          WITH target AS (
            SELECT id, organization_id, replacement_cleanup_created_at
            FROM agent_sandboxes
            WHERE agent_name = 'managed-dedicated-canary-' || :'suffix'
          ),
          eligible AS (
            SELECT candidate.replacement_cleanup_created_at
            FROM agent_sandboxes AS candidate
            WHERE candidate.replacement_cleanup_sandbox_id IS NOT NULL
              AND candidate.execution_tier IN ('dedicated', 'dedicated-always')
              AND (
                candidate.replacement_cleanup_attempt_id IS NULL
                OR candidate.replacement_cleanup_created_at <= NOW() - INTERVAL '30 minutes'
              )
              AND NOT EXISTS (
                SELECT 1
                FROM jobs
                WHERE jobs.organization_id = candidate.organization_id
                  AND jobs.agent_id = candidate.id::text
                  AND jobs.status IN ('pending', 'in_progress')
                  AND jobs.type IN (
                    'agent_provision',
                    'agent_delete',
                    'agent_suspend',
                    'agent_resume',
                    'agent_restart',
                    'agent_upgrade',
                    'agent_admin_canary_image',
                    'agent_downgrade',
                    'agent_sleep',
                    'agent_wake'
                  )
              )
          ),
          facts AS (
            SELECT
              target.replacement_cleanup_created_at,
              target.replacement_cleanup_created_at <= NOW() - INTERVAL '30 minutes'
                AS grace_elapsed,
              (
                SELECT count(*)
                FROM jobs
                WHERE jobs.organization_id = target.organization_id
                  AND jobs.agent_id = target.id::text
                  AND jobs.status IN ('pending', 'in_progress')
                  AND jobs.type IN (
                    'agent_provision',
                    'agent_delete',
                    'agent_suspend',
                    'agent_resume',
                    'agent_restart',
                    'agent_upgrade',
                    'agent_admin_canary_image',
                    'agent_downgrade',
                    'agent_sleep',
                    'agent_wake'
                  )
              )::integer AS active_exclusive_jobs,
              (
                SELECT count(*)
                FROM eligible
                WHERE eligible.replacement_cleanup_created_at <
                  target.replacement_cleanup_created_at
              )::integer AS older_eligible_fences,
              (SELECT count(*) FROM eligible)::integer AS total_eligible_fences
            FROM target
          )
          SELECT json_build_object(
            'targetCount', (SELECT count(*) FROM target),
            'cleanupCreatedAt', (SELECT replacement_cleanup_created_at FROM facts),
            'graceElapsed', COALESCE((SELECT grace_elapsed FROM facts), false),
            'activeExclusiveJobs', COALESCE((SELECT active_exclusive_jobs FROM facts), 0),
            'olderEligibleFences', COALESCE((SELECT older_eligible_fences FROM facts), 0),
            'totalEligibleFences', COALESCE((SELECT total_eligible_fences FROM facts), 0)
          );
          COMMIT;
          SQL
          } | sed '/^[[:space:]]*$/d' | head -n 1)"
          jq -e '
            keys == ["activeExclusiveJobs", "cleanupCreatedAt", "graceElapsed", "olderEligibleFences", "targetCount", "totalEligibleFences"] and
            .targetCount == 1 and
            (.cleanupCreatedAt | type == "string") and
            (.cleanupCreatedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-][0-9]{2}:[0-9]{2})$")) and
            (.graceElapsed | type == "boolean") and
            (.activeExclusiveJobs | type == "number") and
            (.olderEligibleFences | type == "number") and
            (.totalEligibleFences | type == "number")
          ' <<<"$summary" >/dev/null
          echo "### Replacement cleanup reconciliation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            "- cleanup fence created: `" + .cleanupCreatedAt + "`\n" +
            "- grace elapsed: `" + (.graceElapsed | tostring) + "`\n" +
            "- active exclusive jobs: `" + (.activeExclusiveJobs | tostring) + "`\n" +
            "- older eligible fences: `" + (.olderEligibleFences | tostring) + "`\n" +
            "- total eligible fences: `" + (.totalEligibleFences | tostring) + "`"
          ' <<<"$summary" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Classify control-plane replacement cleanup failure
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            block="$(
              sudo journalctl \
                -u eliza-provisioning-worker.service \
                --since '5 minutes ago' \
                -o cat \
                --no-pager 2>/dev/null \
                | awk '
                    index($0, "[agent-sandbox] Replacement cleanup remains pending") {
                      captured = $0
                      remaining = 12
                      next
                    }
                    remaining > 0 {
                      captured = captured ORS $0
                      remaining -= 1
                    }
                    END { print captured }
                  ' \
                || true
            )"
            lower="$(printf '%s' "$block" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              '') category='missing' ;;
              *'permission denied'*|*'publickey'*|*'authentication methods failed'*) category='ssh_auth' ;;
              *'timed out'*|*'timeout'*) category='ssh_timeout' ;;
              *'connection refused'*|*'econnrefused'*) category='ssh_refused' ;;
              *'could not resolve'*|*'enotfound'*|*'getaddrinfo'*) category='ssh_dns' ;;
              *'connection reset'*|*'econnreset'*) category='ssh_reset' ;;
              *'command exited with code'*) category='ssh_command_exit' ;;
              *'connection error for'*) category='ssh_connect_error' ;;
              *'stream error'*) category='ssh_stream_error' ;;
              *'replacement secret cleanup receipt was missing or malformed'*) category='secret_receipt_invalid' ;;
              *'replacement cleanup state receipt was malformed'*) category='state_receipt_invalid' ;;
              *'replacement candidate observation receipt was missing or malformed'*) category='candidate_observation_receipt_invalid' ;;
              *'replacement candidate proof conflicts'*) category='candidate_proof_conflict' ;;
              *'replacement candidate proof id mismatch'*) category='candidate_proof_id_mismatch' ;;
              *'exact replacement attempt label mismatch'*) category='exact_attempt_label_mismatch' ;;
              *'replacement attempt label mismatch'*) category='attempt_label_mismatch' ;;
              *'replacement container id mismatch'*) category='container_id_mismatch' ;;
              *'cannot verify replacement identity'*'expected one inspect record'*) category='inspect_record_count' ;;
              *'cannot verify replacement identity'*'malformed inspect record'*) category='inspect_record_malformed' ;;
              *'cannot verify replacement identity'*'invalid docker id'*) category='inspect_docker_id_invalid' ;;
              *'cannot prove id-less replacement'*'interrupted docker create may still materialize'*) category='docker_create_unresolved' ;;
              *'exact replacement cleanup ssh authority is unavailable'*) category='cleanup_ssh_authority_unavailable' ;;
              *'exact replacement cleanup node authority is incomplete'*) category='node_authority_invalid' ;;
              *'exact replacement cleanup node record is no longer registered'*) category='node_authority_missing' ;;
              *'exact replacement cleanup node authority changed'*) category='node_authority_drift' ;;
              *"node "*" is not registered"*) category='node_not_registered' ;;
              *'exact replacement vpn cleanup requires a durable headscale node id'*) category='vpn_node_id_unresolved' ;;
              *'cannot clean invalid headscale node id'*) category='vpn_node_id_invalid' ;;
              *"cannot prove headscale node "*" absent after cleanup"*) category='vpn_absence_unproven' ;;
              *'vpn registration window remains open'*) category='vpn_registration_window_open' ;;
              *'cannot recover vpn identity'*'without a node name'*) category='vpn_node_name_missing' ;;
              *'cannot recover vpn identity'*'without a registration start time'*) category='vpn_registration_start_missing' ;;
              *'cannot recover vpn identity'*'invalid registration start time'*) category='vpn_registration_start_invalid' ;;
              *'cannot recover vpn identity'*'registration count exceeds the cleanup bound'*) category='vpn_registration_count_exceeded' ;;
              *'cannot recover vpn identity'*'matching registrations'*) category='vpn_multiple_registrations' ;;
              *'cannot recover vpn identity'*) category='vpn_identity_invalid' ;;
              *"headscale api "*" failed: 401"*|*"headscale api "*" failed: 403"*) category='headscale_api_auth' ;;
              *"headscale api "*" failed:"*) category='headscale_api_failure' ;;
              *'cannot prove'*'absent'*) category='absence_unproven' ;;
              *'sandbox provider cannot prove a persisted replacement absent'*) category='provider_contract_missing' ;;
              *) category='unclassified' ;;
            esac
            signals=''
            for signal in \
              replacement_cleanup_unresolved replacement docker_sandbox docker_ssh secret receipt \
              inspect identity attempt container headscale vpn node authority mismatch \
              missing malformed unavailable invalid not_registered cannot_prove failed \
              without registration matching exceeds bound \
              exit succeeded disappeared release allocation; do
              case "$signal:$lower" in
                replacement_cleanup_unresolved:*'replacement cleanup is unresolved'*) matched=true ;;
                docker_sandbox:*'docker-sandbox'*) matched=true ;;
                docker_ssh:*'docker-ssh'*) matched=true ;;
                not_registered:*'not registered'*) matched=true ;;
                cannot_prove:*'cannot prove'*) matched=true ;;
                *:*"${signal//_/-}"*) matched=true ;;
                *) matched=false ;;
              esac
              if [ "$matched" = true ]; then
                signals="${signals:+$signals,}$signal"
              fi
            done
            unset block lower
            echo "replacement_cleanup_failure_category=$category"
            echo "replacement_cleanup_failure_signals=${signals:-none}"

      - name: Upload privacy-safe provision diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-dedicated-provision-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/managed-dedicated-provision-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize classified provision result
        shell: bash
        run: |
          set -euo pipefail
          bun -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(
              readFileSync(process.env.CANARY_DIAGNOSTIC_EVIDENCE_PATH, "utf8"),
            );
            const job = evidence.provisionJob;
            console.log("### Managed dedicated provision diagnostic");
            console.log("");
            console.log("- exact target count: `" + evidence.targetCount + "`");
            console.log("- sandbox status: `" + evidence.sandbox.status + "`");
            console.log("- database status: `" + evidence.sandbox.databaseStatus + "`");
            console.log("- sandbox error class: `" + evidence.sandbox.errorCode + "`");
            console.log("- provision job status: `" + job.status + "`");
            console.log("- provision job error class: `" + job.errorCode + "`");
            console.log("- persisted result class: `" + job.resultErrorCode + "`");
            console.log("- attempts: `" + job.attempts + "/" + job.maxAttempts + "`");
            console.log("- retryable requeues: `" + job.retryableRequeues + "`");
            console.log("- execution interruptions: `" + job.executionInterruptions + "`");
            console.log("- replacement intent present: `" + evidence.sandbox.replacementLocator.attemptIdPresent + "`");
            console.log("- replacement Docker id present: `" + evidence.sandbox.replacementLocator.containerIdPresent + "`");
            console.log("- replacement VPN id present: `" + evidence.sandbox.replacementLocator.vpnNodeIdPresent + "`");
          ' >> "$GITHUB_STEP_SUMMARY"

  shared-staging-onboarding:
    name: Shared staging onboarding
    needs: smoke
    if: ${{ always() && inputs.diagnose_canary_suffix == '' && !inputs.cleanup_only && (inputs.suite == 'all' || inputs.suite == 'cloud') }}
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      # The runner contract uses ELIZAOS_CLOUD_API_KEY; ELIZACLOUD_API_KEY is
      # the repository's established staging smoke credential.
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY || secrets.ELIZACLOUD_API_KEY }}
      CLOUD_SHARED_STAGING_SMOKE_EVIDENCE_PATH: reports/live-smoke/shared-staging-onboarding.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          node-version: "24.15.0"
          install-command: bun install --frozen-lockfile --ignore-scripts
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Require isolated staging credential
        shell: bash
        run: |
          set -euo pipefail
          key_without_whitespace="${ELIZAOS_CLOUD_API_KEY:-}"
          key_without_whitespace="${key_without_whitespace//[[:space:]]/}"
          if [[ -z "$key_without_whitespace" ]]; then
            echo "::error::Shared staging onboarding requires ELIZAOS_CLOUD_API_KEY or ELIZACLOUD_API_KEY; refusing a green skip."
            exit 1
          fi
          unset key_without_whitespace

      - name: Run shared staging onboarding smoke
        id: shared_live
        run: bun run cloud:shared-onboarding:live

      - name: Upload privacy-safe shared staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-staging-onboarding
          path: reports/live-smoke/shared-staging-onboarding.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce shared live proof, deployed SHA, and cleanup
        if: ${{ always() }}
        env:
          LIVE_PROCESS_OUTCOME: ${{ steps.shared_live.outcome }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$CLOUD_SHARED_STAGING_SMOKE_EVIDENCE_PATH"
          if [[ ! -s "$evidence_path" ]]; then
            echo "::error::Shared staging smoke produced no evidence."
            exit 1
          fi

          deployed_commit="$(
            bun -e '
              import { readFileSync } from "node:fs";
              const evidence = JSON.parse(readFileSync(process.env.CLOUD_SHARED_STAGING_SMOKE_EVIDENCE_PATH, "utf8"));
              if (
                evidence.verdict !== "pass" ||
                evidence.cleanup?.status !== "passed" ||
                evidence.cleanup?.possibleOrphan !== false ||
                typeof evidence.deployedCommit !== "string" ||
                !/^[a-f0-9]{40}$/.test(evidence.deployedCommit)
              ) {
                console.error("::error::Shared staging evidence did not prove pass + exact cleanup.");
                process.exit(1);
              }
              process.stdout.write(evidence.deployedCommit);
            '
          )"

          if [[ "${LIVE_PROCESS_OUTCOME:-missing}" != "success" ]]; then
            echo "::error::Shared staging smoke process did not succeed."
            exit 1
          fi
          if ! git cat-file -e "${deployed_commit}^{commit}" 2>/dev/null; then
            echo "::error::Staging reported a deploy commit absent from this repository checkout."
            exit 1
          fi
          expected_source_sha="${EXPECTED_SOURCE_SHA:-}"
          if [[ -z "$expected_source_sha" ]] || ! git cat-file -e "${expected_source_sha}^{commit}" 2>/dev/null; then
            echo "::error::Expected shared-smoke source commit is absent from this checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$expected_source_sha" "$deployed_commit"; then
            echo "::error::Staging deploy does not contain this shared-smoke source commit."
            exit 1
          fi
