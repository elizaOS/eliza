# This manual workflow is the general credential-backed product smoke
# dispatcher. Specialized app and voice live-evidence flows
# (`app-live-e2e.yml`, `voice-live-e2e.yml`) also run on schedule or dispatch.
# Live integrations do not run on pull requests, so missing credentials cannot
# make normal repository health red.
name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Live surface to exercise
        required: true
        default: all
        type: choice
        options: [all, app, scenarios, group-chat, live-information, cloud, voice, dedicated]
      planner_provider:
        description: Acting model provider for focused live-information or group-chat suites
        required: true
        default: openai
        type: choice
        options: [openai, anthropic, openrouter]
      stale_canary_suffix:
        description: "Exact prior dedicated-canary suffix (r<run-id>a<attempt>) to verify and delete before the fresh canary"
        required: false
        type: string
        default: ""
      diagnose_canary_suffix:
        description: "Read-only staging diagnosis for one exact failed dedicated-canary suffix; performs no lifecycle mutation"
        required: false
        type: string
        default: ""
      cleanup_only:
        description: "Delete only the exact prior dedicated canary; never create a replacement"
        required: false
        type: boolean
        default: false

concurrency:
  # The shared smoke credential must remain attached to an empty organization.
  # Serialize every manual live suite so an `all` and `cloud` dispatch cannot
  # race between the read-only preflight and fresh create.
  group: live-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ inputs.suite }}
    # cleanup_only is an exclusive destructive-recovery mode. Never run an
    # unrelated live suite under the same dispatch, regardless of suite input.
    if: ${{ inputs.diagnose_canary_suffix == '' && !inputs.cleanup_only && inputs.suite != 'dedicated' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY || secrets.ELIZACLOUD_API_KEY }}
      ELIZAOS_CLOUD_BASE_URL: ${{ vars.ELIZAOS_CLOUD_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Require exact independently judged scenario credentials
        if: inputs.suite == 'live-information' || inputs.suite == 'group-chat'
        shell: bash
        env:
          PLANNER_PROVIDER: ${{ inputs.planner_provider }}
        run: |
          set -euo pipefail
          case "$PLANNER_PROVIDER" in
            openai) planner_key="${OPENAI_API_KEY:-}" ;;
            anthropic) planner_key="${ANTHROPIC_API_KEY:-}" ;;
            openrouter) planner_key="${OPENROUTER_API_KEY:-}" ;;
            *) echo "::error::Unsupported acting model provider."; exit 1 ;;
          esac
          planner_key_without_whitespace="${planner_key//[[:space:]]/}"
          judge_key="${EVAL_CEREBRAS_API_KEY:-${CEREBRAS_API_KEY:-}}"
          judge_key_without_whitespace="${judge_key//[[:space:]]/}"
          if [[ -z "$planner_key_without_whitespace" ]]; then
            echo "::error::The selected acting model credential is missing or blank; compatible provider keys cannot substitute for it."
            exit 1
          fi
          if [[ -z "$judge_key_without_whitespace" ]]; then
            echo "::error::The independent Cerebras judge credential is missing or blank."
            exit 1
          fi
          unset planner_key planner_key_without_whitespace judge_key judge_key_without_whitespace

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          node-version: "24.15.0"
          install-command: bun install --frozen-lockfile --ignore-scripts
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install Chromium
        if: inputs.suite == 'all' || inputs.suite == 'app'
        run: .github/scripts/install-playwright-browsers.sh chromium

      - name: App walkthrough
        if: inputs.suite == 'all' || inputs.suite == 'app'
        run: bun run --cwd packages/app test:e2e:walkthrough:live

      # Both the scenario graph and cloud API load the compiled
      # @elizaos/core/edge export. The lean install above skips lifecycle
      # scripts, so build that contract before either consumer starts.
      - name: Build core runtime contract
        if: inputs.suite == 'all' || inputs.suite == 'scenarios' || inputs.suite == 'group-chat' || inputs.suite == 'live-information' || inputs.suite == 'cloud'
        run: bun run build:core

      - name: Live scenarios
        if: inputs.suite == 'all' || inputs.suite == 'scenarios'
        run: bun run --cwd packages/scenario-runner test:live:e2e

      - name: Group-chat evaluation
        if: inputs.suite == 'group-chat'
        id: group-chat-evaluation
        continue-on-error: true
        env:
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          SCENARIO_TURN_TIMEOUT_MS: "300000"
        run: >-
          bun packages/scripts/run-scenarios-isolated.mjs
          packages/test/scenarios/group-chat
          --lane live-only
          --provider ${{ inputs.planner_provider }}
          --workers 4
          --timeout-ms 900000
          --report reports/group-chat-evaluation/aggregate.json
          --artifacts-dir reports/group-chat-evaluation/scenarios

      - name: Validate complete independently judged group-chat evidence
        if: inputs.suite == 'group-chat'
        run: >-
          bun packages/scripts/validate-group-chat-eval-report.ts
          --report reports/group-chat-evaluation/aggregate.json
          --artifacts-dir reports/group-chat-evaluation/scenarios
          --scenario-dir packages/test/scenarios/group-chat
          --provider ${{ inputs.planner_provider }}

      - name: Upload group-chat evaluation evidence
        if: always() && inputs.suite == 'group-chat'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: group-chat-${{ inputs.planner_provider }}-${{ github.run_id }}
          path: reports/group-chat-evaluation
          if-no-files-found: error
          retention-days: 14

      - name: Live information routing
        if: inputs.suite == 'live-information'
        env:
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          SCENARIO_TURN_TIMEOUT_MS: "300000"
        run: >-
          bun --conditions eliza-source --tsconfig-override tsconfig.json
          packages/scenario-runner/src/cli.ts run packages/test/scenarios
          --scenario cross.live-information-routing --lane live-only
          --provider ${{ inputs.planner_provider }}
          --run-dir reports/scenarios/live-information/run
          --report-dir reports/scenarios/live-information/report
          --export-native reports/scenarios/live-information/native.jsonl

      - name: Upload live information evidence
        if: always() && inputs.suite == 'live-information'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-information-${{ inputs.planner_provider }}-${{ github.run_id }}
          path: reports/scenarios/live-information
          if-no-files-found: warn
          retention-days: 14

      - name: Cloud end-to-end
        if: inputs.suite == 'all' || inputs.suite == 'cloud'
        run: bun run test:cloud:e2e

      - name: Voice service
        if: inputs.suite == 'all' || inputs.suite == 'voice'
        run: bun run --cwd packages/scenario-runner test:real-service:voice

      - name: Railway voice contract
        if: inputs.suite == 'all' || inputs.suite == 'voice'
        env:
          ELIZA_VOICE_LIVE_RAILWAY: "1"
          KOKORO_TTS_URL: ${{ vars.ELIZA_VOICE_KOKORO_TTS_URL }}
          WHISPER_STT_URL: ${{ vars.ELIZA_VOICE_WHISPER_STT_URL }}
          WHISPER_STT_MODEL: ${{ vars.ELIZA_VOICE_WHISPER_STT_MODEL }}
        run: bun test packages/cloud/api/__tests__/voice-kokoro-whisper-live.test.ts

  dedicated:
    name: Managed dedicated staging canary
    if: inputs.diagnose_canary_suffix == '' && (inputs.cleanup_only || inputs.suite == 'all' || inputs.suite == 'dedicated')
    runs-on: ubuntu-24.04
    environment: staging
    # Serialize this live lifecycle even when an `all` run overlaps a
    # `dedicated` run. Cleanup must finish before another canary starts.
    concurrency:
      group: managed-dedicated-staging-canary
      cancel-in-progress: false
    # Absolute script deadlines stay below this cap and reserve time for the
    # finally cleanup before Actions can terminate the job.
    timeout-minutes: 45
    env:
      CLOUD_DEDICATED_CANARY_BASE_URL: https://api-staging.eliza.app
      CLOUD_DEDICATED_CANARY_EVIDENCE_PATH: reports/managed-dedicated-canary.json
      CLOUD_DEDICATED_CANARY_STALE_CANARY_SUFFIX: ${{ inputs.stale_canary_suffix || '' }}
      CLOUD_DEDICATED_CANARY_CLEANUP_ONLY: ${{ inputs.cleanup_only && 'true' || 'false' }}
      # Conditional identity checks and lifecycle locking first shipped here.
      # Cleanup-only may run from a newer workflow branch, so bind it to this
      # minimum deployed API contract instead of incorrectly requiring HEAD.
      CLOUD_DEDICATED_CANARY_MINIMUM_CLEANUP_API_SHA: aada8198bc10045c8c841ea4d6dab974ac2a3319
      # Keep this identical to App Live's accepted repository-secret contract.
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY || secrets.ELIZACLOUD_API_KEY }}
    steps:
      - name: Require real Cloud credential
        shell: bash
        run: |
          set -euo pipefail
          cloud_key_without_whitespace="${ELIZAOS_CLOUD_API_KEY:-}"
          cloud_key_without_whitespace="${cloud_key_without_whitespace//[[:space:]]/}"
          if [[ -z "$cloud_key_without_whitespace" ]]; then
            echo "::error::Managed dedicated canary requires ELIZAOS_CLOUD_API_KEY or ELIZACLOUD_API_KEY; refusing green-by-skip."
            exit 1
          fi
          unset cloud_key_without_whitespace

      - name: Require exact staging target
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expected = "https://api-staging.eliza.app";
          const raw = process.env.CLOUD_DEDICATED_CANARY_BASE_URL ?? "";
          let url;
          try {
            url = new URL(raw);
          } catch {
            throw new Error("Managed dedicated canary target is not a valid URL");
          }
          if (
            url.origin !== expected ||
            url.username ||
            url.password ||
            (url.pathname !== "/" && url.pathname !== "") ||
            url.search ||
            url.hash
          ) {
            throw new Error(
              "Managed dedicated canary is pinned to the exact staging origin without userinfo, path, query, or fragment",
            );
          }
          NODE

      - name: Bind stale-recovery intent
        id: recovery_intent
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const raw =
            process.env.CLOUD_DEDICATED_CANARY_STALE_CANARY_SUFFIX ?? "";
          const requested = raw !== "";
          const cleanupOnly =
            process.env.CLOUD_DEDICATED_CANARY_CLEANUP_ONLY === "true";
          if (requested && !/^r[1-9]\d{7,19}a[1-9]\d{0,3}$/.test(raw)) {
            throw new Error("Stale-canary recovery input is invalid");
          }
          if (cleanupOnly && !requested) {
            throw new Error("Cleanup-only requires an exact stale-canary suffix");
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `requested=${requested ? "true" : "false"}\n`,
          );
          NODE

      - name: Checkout exact run commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Preflight cleanup API ancestry
        id: cleanup_api_preflight
        if: inputs.cleanup_only
        shell: bash
        run: |
          set -euo pipefail
          deployed_commit="$(
            node --input-type=module <<'NODE'
            const response = await fetch("https://api-staging.eliza.app/api/health", {
              headers: { accept: "application/json" },
              signal: AbortSignal.timeout(20_000),
            });
            if (!response.ok) {
              throw new Error(`Staging health returned HTTP ${response.status}`);
            }
            const body = await response.json();
            if (
              typeof body !== "object" ||
              body === null ||
              typeof body.commit !== "string" ||
              !/^[a-f0-9]{40}$/.test(body.commit)
            ) {
              throw new Error("Staging health did not return an exact deploy commit");
            }
            process.stdout.write(body.commit);
          NODE
          )"
          minimum_cleanup_api_sha="${CLOUD_DEDICATED_CANARY_MINIMUM_CLEANUP_API_SHA:-}"
          if [[ -z "$minimum_cleanup_api_sha" ]] || ! git cat-file -e "${minimum_cleanup_api_sha}^{commit}" 2>/dev/null; then
            echo "::error::Required cleanup API contract commit is absent from this repository checkout."
            exit 1
          fi
          if ! git cat-file -e "${deployed_commit}^{commit}" 2>/dev/null; then
            echo "::error::Staging reported a deploy commit absent from this repository checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$minimum_cleanup_api_sha" "$deployed_commit"; then
            echo "::error::Staging deploy predates the conditional cleanup API contract."
            exit 1
          fi
          echo "deployed_commit=$deployed_commit" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install contract dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate canary and workflow contracts
        run: |
          bun test \
            packages/cloud/scripts/admin/bridge-reply-verdict.test.ts \
            packages/cloud/scripts/admin/managed-dedicated-canary.test.ts \
            packages/cloud/scripts/admin/managed-dedicated-canary-workflow.test.ts

      - name: Run bounded managed dedicated canary
        id: live
        if: ${{ success() && (!inputs.cleanup_only || steps.cleanup_api_preflight.outcome == 'success') }}
        env:
          CLOUD_DEDICATED_CANARY_EXPECTED_DEPLOY_COMMIT: ${{ steps.cleanup_api_preflight.outputs.deployed_commit || '' }}
        shell: bash
        run: |
          set +e
          mkdir -p reports
          bun run packages/cloud/scripts/admin/managed-dedicated-canary.ts
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Validate privacy-safe evidence artifact
        id: privacy
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$CLOUD_DEDICATED_CANARY_EVIDENCE_PATH"
          if [[ ! -s "$evidence_path" ]]; then
            echo "::error::Canary produced no evidence artifact to privacy-check."
            exit 1
          fi
          bun -e '
            import { readFileSync, renameSync, writeFileSync } from "node:fs";
            import { canonicalizeManagedDedicatedCanaryArtifact } from "./packages/cloud/scripts/admin/managed-dedicated-canary.ts";
            const evidencePath = process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH;
            if (!evidencePath) {
              console.error("::error::Canary evidence path is not configured.");
              process.exit(1);
            }
            const { canonical, errors } = canonicalizeManagedDedicatedCanaryArtifact(
              readFileSync(evidencePath, "utf8"),
            );
            if (errors.length > 0) {
              console.error("::error::Canary evidence failed strict privacy validation: " + errors.join(","));
              process.exit(1);
            }
            if (canonical === null) process.exit(1);
            const canonicalPath = evidencePath + ".validated-" + process.pid;
            writeFileSync(canonicalPath, canonical, { mode: 0o600 });
            renameSync(canonicalPath, evidencePath);
          '
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Upload privacy-safe timing and path evidence
        if: ${{ always() && steps.privacy.outputs.validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-dedicated-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/managed-dedicated-canary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce live proof, deployed SHA, and cleanup
        if: ${{ always() }}
        env:
          LIVE_PROCESS_STATUS: ${{ steps.live.outputs.status }}
          PRIVACY_VALIDATED: ${{ steps.privacy.outputs.validated }}
          EXPECTED_RECOVERY_REQUESTED: ${{ steps.recovery_intent.outputs.requested }}
          EXPECTED_CLEANUP_ONLY: ${{ inputs.cleanup_only && 'true' || 'false' }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$CLOUD_DEDICATED_CANARY_EVIDENCE_PATH"
          if [[ ! -s "$evidence_path" ]]; then
            echo "::error::Canary produced no evidence; zero-executed/skip outcomes are failures."
            exit 1
          fi
          if [[ "${PRIVACY_VALIDATED:-missing}" != "true" ]]; then
            echo "::error::Canary evidence did not pass the separate strict privacy validator."
            exit 1
          fi

          deployed_commit="$(
            bun -e '
              import { readFileSync } from "node:fs";
              import {
                validateManagedDedicatedCanaryCleanupEvidence,
                validateManagedDedicatedCanaryEvidence,
              } from "./packages/cloud/scripts/admin/managed-dedicated-canary.ts";
              const evidence = JSON.parse(readFileSync(process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH, "utf8"));
              const cleanupOnly = process.env.EXPECTED_CLEANUP_ONLY === "true";
              const errors = cleanupOnly
                ? validateManagedDedicatedCanaryCleanupEvidence(evidence)
                : validateManagedDedicatedCanaryEvidence(evidence);
              const expectedRecoveryRequested =
                process.env.EXPECTED_RECOVERY_REQUESTED === "true";
              if (evidence.recovery?.requested !== expectedRecoveryRequested) {
                errors.push("workflow_recovery_intent_mismatch");
              }
              if (errors.length > 0) {
                console.error("::error::Canary evidence rejected: " + errors.join(","));
                process.exit(1);
              }
              process.stdout.write(evidence.deployedCommit);
            '
          )"

          if [[ "${LIVE_PROCESS_STATUS:-missing}" != "0" ]]; then
            echo "::error::Live canary process exited ${LIVE_PROCESS_STATUS:-without status}."
            exit 1
          fi
          if ! git cat-file -e "${deployed_commit}^{commit}" 2>/dev/null; then
            echo "::error::Staging reported a deploy commit absent from this repository checkout."
            exit 1
          fi
          if [[ "${EXPECTED_CLEANUP_ONLY:-false}" != "true" ]]; then
            expected_source_sha="${EXPECTED_SOURCE_SHA:-}"
            if [[ -z "$expected_source_sha" ]] || ! git cat-file -e "${expected_source_sha}^{commit}" 2>/dev/null; then
              echo "::error::Expected canary source commit is absent from this repository checkout."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$expected_source_sha" "$deployed_commit"; then
              echo "::error::Staging deploy does not contain this canary's expected source commit."
              exit 1
            fi
          else
            minimum_cleanup_api_sha="${CLOUD_DEDICATED_CANARY_MINIMUM_CLEANUP_API_SHA:-}"
            if [[ -z "$minimum_cleanup_api_sha" ]] || ! git cat-file -e "${minimum_cleanup_api_sha}^{commit}" 2>/dev/null; then
              echo "::error::Required cleanup API contract commit is absent from this repository checkout."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$minimum_cleanup_api_sha" "$deployed_commit"; then
              echo "::error::Staging deploy predates the conditional cleanup API contract."
              exit 1
            fi
          fi

          bun -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(readFileSync(process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH, "utf8"));
            const t = evidence.timingsMs;
            console.log("### Managed dedicated staging canary");
            console.log("");
            console.log("- operation: `" + evidence.operation + "`");
            console.log("- deployed commit: `" + evidence.deployedCommit + "`");
            console.log("- tier: `" + evidence.path.observedTier + "`");
            console.log("- paths: `" + evidence.path.successfulPaths + "/2`");
            console.log("- bridge transport: `" + evidence.path.bridgeTransport + "`");
            console.log("- chat requests: `" + evidence.capacity.chatRequests + "/" + evidence.capacity.maxChatRequests + "`");
            console.log("- recovery requested: `" + evidence.recovery.requested + "`");
            console.log("- recovery match: `" + evidence.recovery.match + "`");
            console.log("- recovery performed: `" + evidence.recovery.performed + "`");
            console.log("- recovery confirmed: `" + evidence.recovery.confirmed + "`");
            console.log("- cleanup: `" + evidence.cleanup.status + "`");
            console.log("");
            console.log("| phase | ms |");
            console.log("| --- | ---: |");
            for (const phase of ["health", "capacityGuard", "create", "ready", "bridge", "sse", "cleanup", "total"]) {
              if (Number.isFinite(t[phase])) console.log("| " + phase + " | " + t[phase] + " |");
            }
          ' >> "$GITHUB_STEP_SUMMARY"

          if [[ "${EXPECTED_CLEANUP_ONLY:-false}" == "true" ]]; then
            echo "Exact staging canary cleanup passed without creating a replacement."
          else
            echo "Managed dedicated canary passed with exact cleanup."
          fi

  dedicated-diagnostic:
    name: Read-only managed dedicated provision diagnosis
    if: inputs.diagnose_canary_suffix != ''
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: managed-dedicated-staging-canary
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      CANARY_DIAGNOSTIC_SUFFIX: ${{ inputs.diagnose_canary_suffix }}
      CANARY_RECOVERY_SUFFIX: ${{ inputs.stale_canary_suffix }}
      CANARY_DIAGNOSTIC_CLEANUP_ONLY: ${{ inputs.cleanup_only && 'true' || 'false' }}
      CANARY_DIAGNOSTIC_RAW_PATH: reports/managed-dedicated-provision-diagnostic.raw.json
      CANARY_DIAGNOSTIC_EVIDENCE_PATH: reports/managed-dedicated-provision-diagnostic.json
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Validate provision diagnostic contract
        run: >-
          bun test
          packages/cloud/scripts/admin/managed-dedicated-provision-diagnostic.test.ts
          packages/scripts/__tests__/staging-worker-journal-diagnostic.test.ts

      - name: Classify recent provisioning worker failures
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            sudo journalctl -u eliza-provisioning-worker.service --since '2 hours ago' -o json --no-pager | python3 -c '
            import collections, json, re, sys
            patterns = {
                "sandbox_health_timeout": r"Sandbox health check timed out",
                "sandbox_creation_timeout": r"Sandbox creation failed:.*(?:timed out|timeout)",
                "database_provision_failed": r"Database provisioning failed:",
                "environment_decryption_failed": r"Environment decryption failed:",
                "ssh_command_timeout": r"\[docker-ssh\] Command timed out",
                "ssh_connect_timeout": r"(?:SSH|connection|connect).*timed out",
                "docker_health_timeout": r"Docker health check timed out",
                "tailnet_health_timeout": r"Tailnet health check timed out",
                "vpn_registration_timeout": r"VPN registration timeout",
                "registration_unresolved": r"Headscale registration did not reach an exact observable completion",
                "job_watchdog_timeout": r"Execution timed out; retaining ownership until quiescent",
                "image_pull_failed": r"Image pull failed",
                "image_pull_completed": r"Image pulled successfully",
                "docker_capacity_unavailable": r"No (?:reachable )?Docker capacity",
                "container_daemon_unavailable": r"Cannot connect to the Docker daemon|docker_daemon_unavailable",
                "container_created": r"\[docker-sandbox\] Created container",
                "provision_failed": r"agent_provision failed",
                "provision_completed": r"agent_provision completed",
                "runtime_module_resolution": r"Cannot find (?:package|module)|ERR_MODULE_NOT_FOUND",
                "runtime_out_of_memory": r"heap out of memory|Out of memory|OOMKilled",
                "runtime_database_unavailable": r"database.*(?:unavailable|connection refused|timeout)",
                "remote_command_timeout": r"remote_command_timeout",
                "unclassified_timeout": r"timed out|timeout|ETIMEDOUT",
            }
            patterns = {key: re.compile(value, re.I) for key, value in patterns.items()}
            counts = collections.Counter()
            durations = collections.Counter()
            functions = collections.Counter()
            allowed_functions = (
                "executeJob", "provision", "create", "checkHealthDetailed", "checkHealth",
                "ensureDatabase", "mintAgentToken", "ensureImage", "prepareRuntime",
                "withTimeout", "fetch", "exec", "connect", "ensureAgentDatabase",
            )
            records = 0
            for line in sys.stdin:
                entry = json.loads(line)
                message = entry["MESSAGE"]
                if not isinstance(message, str):
                    raise ValueError("Journal message is not text")
                records += 1
                for key, pattern in patterns.items():
                    if pattern.search(message):
                        counts[key] += 1
                if patterns["unclassified_timeout"].search(message):
                    for value in re.findall(r"timed out after ([0-9]{1,8})ms", message):
                        durations[value] += 1
                    for name in allowed_functions:
                        if re.search(r"\bat (?:[A-Za-z0-9_]+\.)?" + name + r"\s*\(", message):
                            functions[name] += 1
            print(json.dumps({"schemaVersion": 1, "scope": "staging-worker-two-hours", "records": records, "signals": dict(counts), "timeoutDurationsMs": dict(durations), "timeoutFunctions": dict(functions)}, sort_keys=True))
            '

      - name: Classify exact canary journal by suffix
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          CANARY_DIAGNOSTIC_SUFFIX: ${{ inputs.diagnose_canary_suffix }}
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          envs: CANARY_DIAGNOSTIC_SUFFIX
          script: |
            set -euo pipefail
            [[ "$CANARY_DIAGNOSTIC_SUFFIX" =~ ^r[1-9][0-9]{7,19}a[1-9][0-9]{0,3}$ ]] || exit 1
            expected_name="managed-dedicated-canary-$CANARY_DIAGNOSTIC_SUFFIX"
            journal="$(
              sudo journalctl \
                -u eliza-provisioning-worker.service \
                --since '4 hours ago' \
                -o cat \
                --no-pager 2>/dev/null \
                | tail -n 20000 \
                || true
            )"
            ids="$(
              printf '%s\n' "$journal" \
                | grep -F "$expected_name" \
                | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' \
                | sort -u \
                || true
            )"
            id_count="$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$id_count" = 1 ]; then
              agent_id="$(printf '%s\n' "$ids" | sed '/^$/d')"
              echo "::add-mask::$agent_id"
              block="$(printf '%s\n' "$journal" | grep -F -B 16 -A 24 "$agent_id" | tail -n 1600 || true)"
              target='resolved'
            elif [ "$id_count" = 0 ]; then
              block="$(printf '%s\n' "$journal" | grep -F -B 16 -A 160 "$expected_name" | tail -n 800 || true)"
              target='missing_id'
            else
              block=''
              target='ambiguous_id'
            fi
            lower="$(printf '%s' "$block" | tr '[:upper:]' '[:lower:]')"
            observation="$(
              printf '%s\n' "$lower" \
                | sed -n 's/^.*docker candidate mesh observation before cleanup: //p' \
                | tail -n 1
            )"
            case "$observation" in
              *'authkey_rejected=true'*|*'interactive=true'*) category='mesh_auth_required' ;;
              *'container=exited'*|*'container=dead'*) category='candidate_container_exited' ;;
              *'socket=false'*'daemon=false'*) category='tailscale_daemon_unavailable' ;;
              *'control=false'*) category='headscale_control_unreachable' ;;
              *'dns_failed=true'*) category='headscale_dns_failure' ;;
              *'tls_failed=true'*) category='headscale_tls_failure' ;;
              *'control_transport_failed=true'*) category='headscale_control_transport_failure' ;;
              *'control_key=false'*) category='headscale_control_key_not_fetched' ;;
              *'login_started=false'*) category='tailscale_login_not_started' ;;
              *'register_request=false'*) category='tailscale_register_request_not_sent' ;;
              *'status=error'*) category='tailscale_status_unavailable' ;;
              *'backend=needslogin'*) category='tailscale_needs_login' ;;
              *'backend=needsmachineauth'*) category='tailscale_needs_machine_auth' ;;
              *'backend=starting'*) category='tailscale_starting_without_ip' ;;
              *'backend=stopped'*) category='tailscale_stopped' ;;
              *'backend=running'*'ip=false'*) category='tailscale_running_without_ip' ;;
              *'ip=true'*) category='candidate_ip_observed' ;;
              '')
                case "$lower" in
                  *'required headscale registration: auth_required'*) category='mesh_auth_required' ;;
                  *'required headscale registration: container_exited'*) category='candidate_container_exited' ;;
                  *'headscale registration did not reach an exact observable completion'*) category='registration_unresolved' ;;
                  *'vpn registration timeout'*) category='registration_timeout' ;;
                  *' registered on vpn:'*) category='registration_observed' ;;
                  '') category='missing' ;;
                  *) category='unclassified' ;;
                esac
                ;;
              *) category='observation_unclassified' ;;
            esac
            observation_present=false
            [ -n "$observation" ] && observation_present=true
            provision_failed=false
            provision_completed=false
            case "$lower" in *'agent_provision failed'*) provision_failed=true ;; esac
            case "$lower" in *'agent_provision completed'*) provision_completed=true ;; esac
            echo "suffix_journal_target=$target"
            echo "suffix_journal_mesh_category=$category"
            echo "suffix_journal_observation_present=$observation_present"
            echo "suffix_journal_provision_failed=$provision_failed"
            echo "suffix_journal_provision_completed=$provision_completed"
            if [ "$observation_present" = true ]; then
              for field in container socket daemon status backend authorized authurl ip route tun control \
                control_key login_started register_request control_transport_failed tls_failed dns_failed \
                authkey_rejected interactive up_failed agent_started; do
                value="$(printf '%s' "$observation" | tr ',' '\n' | sed -n "s/^${field}=//p" | tail -n 1)"
                case "$field:$value" in
                  container:running|container:paused|container:restarting|container:removing|container:exited|container:dead|container:created|container:unknown) ;;
                  status:success|status:error) ;;
                  backend:running|backend:starting|backend:stopped|backend:needslogin|backend:needsmachineauth|backend:nostate|backend:unknown) ;;
                  authorized:true|authorized:false|authorized:unknown) ;;
                  socket:true|socket:false|daemon:true|daemon:false|authurl:true|authurl:false|ip:true|ip:false|route:true|route:false|tun:true|tun:false|control:true|control:false|control_key:true|control_key:false|login_started:true|login_started:false|register_request:true|register_request:false|control_transport_failed:true|control_transport_failed:false|tls_failed:true|tls_failed:false|dns_failed:true|dns_failed:false|authkey_rejected:true|authkey_rejected:false|interactive:true|interactive:false|up_failed:true|up_failed:false|agent_started:true|agent_started:false) ;;
                  *) value='unknown' ;;
                esac
                echo "suffix_journal_observation_${field}=$value"
              done
            fi
            unset expected_name journal ids id_count agent_id block lower observation target category \
              observation_present provision_failed provision_completed CANARY_DIAGNOSTIC_SUFFIX

      - name: Query exact failed canary read-only
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.RAILWAY_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=20000
        run: |
          set -euo pipefail
          raw_ready=false
          cleanup_incomplete_raw() {
            if [[ "$raw_ready" != true ]]; then
              rm -f -- "$CANARY_DIAGNOSTIC_RAW_PATH"
            fi
          }
          trap cleanup_incomplete_raw EXIT
          if [[ ! "$CANARY_DIAGNOSTIC_SUFFIX" =~ ^r[1-9][0-9]{7,19}a[1-9][0-9]{0,3}$ ]]; then
            echo "::error::Diagnostic suffix is invalid."
            exit 1
          fi
          if [[ -n "$CANARY_RECOVERY_SUFFIX" || "$CANARY_DIAGNOSTIC_CLEANUP_ONLY" == true ]]; then
            echo "::error::Read-only diagnosis and lifecycle mutation inputs are mutually exclusive."
            exit 1
          fi
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Staging DATABASE_URL is unavailable."
            exit 1
          fi

          mkdir -p reports
          umask 077
          PSQL_DATABASE_URL="$(
            bun packages/cloud/scripts/admin/libpq-connection-url.ts
          )"
          echo "::add-mask::$PSQL_DATABASE_URL"
          psql "$PSQL_DATABASE_URL" \
            --no-psqlrc \
            --no-align \
            --tuples-only \
            --quiet \
            --set ON_ERROR_STOP=1 \
            --set suffix="$CANARY_DIAGNOSTIC_SUFFIX" \
            > "$CANARY_DIAGNOSTIC_RAW_PATH" <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '20s';
          WITH target AS (
            SELECT
              id,
              status,
              execution_tier,
              database_status,
              error_message,
              error_count,
              updated_at,
              sandbox_id IS NOT NULL AS sandbox_id_present,
              node_id IS NOT NULL AS node_id_present,
              container_name IS NOT NULL AS container_name_present,
              headscale_ip IS NOT NULL AS headscale_ip_present,
              replacement_cleanup_sandbox_id IS NOT NULL AS replacement_sandbox_id_present,
              replacement_cleanup_node_id IS NOT NULL AS replacement_node_id_present,
              replacement_cleanup_container_name IS NOT NULL AS replacement_container_name_present,
              replacement_cleanup_attempt_id IS NOT NULL AS replacement_attempt_id_present,
              replacement_cleanup_container_id IS NOT NULL AS replacement_container_id_present,
              replacement_cleanup_vpn_node_id IS NOT NULL AS replacement_vpn_node_id_present
            FROM agent_sandboxes
            WHERE agent_name = 'managed-dedicated-canary-' || :'suffix'
          ),
          newest_provision_job AS (
            SELECT
              jobs.status,
              jobs.error,
              jobs.result ->> 'error' AS result_error,
              jobs.attempts,
              jobs.max_attempts,
              jobs.retryable_requeues,
              jobs.execution_interruptions,
              jobs.result_storage,
              jobs.error_storage,
              jobs.scheduled_for,
              jobs.started_at,
              jobs.completed_at,
              jobs.created_at,
              jobs.updated_at
            FROM jobs
            INNER JOIN target ON target.id::text = jobs.agent_id
            WHERE jobs.type = 'agent_provision'
            ORDER BY jobs.created_at DESC, jobs.id DESC
            LIMIT 1
          )
          SELECT json_build_object(
            'targetCount', (SELECT count(*) FROM target),
            'agent', (
              SELECT json_build_object(
                'status', status,
                'executionTier', execution_tier,
                'databaseStatus', database_status,
                'errorMessage', error_message,
                'errorCount', error_count,
                'updatedAt', updated_at,
                'locator', json_build_object(
                  'sandboxIdPresent', sandbox_id_present,
                  'nodeIdPresent', node_id_present,
                  'containerNamePresent', container_name_present,
                  'headscaleIpPresent', headscale_ip_present
                ),
                'replacementLocator', json_build_object(
                  'sandboxIdPresent', replacement_sandbox_id_present,
                  'nodeIdPresent', replacement_node_id_present,
                  'containerNamePresent', replacement_container_name_present,
                  'attemptIdPresent', replacement_attempt_id_present,
                  'containerIdPresent', replacement_container_id_present,
                  'vpnNodeIdPresent', replacement_vpn_node_id_present
                )
              )
              FROM target
              LIMIT 1
            ),
            'provisionJob', (
              SELECT json_build_object(
                'status', status,
                'error', error,
                'resultError', result_error,
                'attempts', attempts,
                'maxAttempts', max_attempts,
                'retryableRequeues', retryable_requeues,
                'executionInterruptions', execution_interruptions,
                'resultStorage', result_storage,
                'errorStorage', error_storage,
                'scheduledFor', scheduled_for,
                'startedAt', started_at,
                'completedAt', completed_at,
                'createdAt', created_at,
                'updatedAt', updated_at
              )
              FROM newest_provision_job
            )
          );
          COMMIT;
          SQL
          raw_ready=true

      - name: Classify privacy-safe provision diagnostic
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f -- "$CANARY_DIAGNOSTIC_RAW_PATH"' EXIT
          bun run packages/cloud/scripts/admin/managed-dedicated-provision-diagnostic.ts \
            "$CANARY_DIAGNOSTIC_SUFFIX" \
            "$CANARY_DIAGNOSTIC_RAW_PATH" \
            "$CANARY_DIAGNOSTIC_EVIDENCE_PATH"

      - name: Diagnose activated target job origin
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.RAILWAY_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=20000
        run: |
          set -euo pipefail
          PSQL_DATABASE_URL="$(bun packages/cloud/scripts/admin/libpq-connection-url.ts)"
          echo "::add-mask::$PSQL_DATABASE_URL"
          psql "$PSQL_DATABASE_URL" --no-psqlrc --no-align --tuples-only --quiet \
            --set ON_ERROR_STOP=1 --set suffix="$CANARY_DIAGNOSTIC_SUFFIX" <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '20s';
          WITH canary AS (
            SELECT organization_id, user_id FROM agent_sandboxes
            WHERE agent_name = 'managed-dedicated-canary-' || :'suffix'
          ), target AS (
            SELECT agent.id, agent.organization_id, agent.user_id, agent.status,
              agent.lifecycle_job_id, agent.lifecycle_execution_generation, agent.deletion_attempt_id
            FROM canary
            JOIN personal_dedicated_upgrade_authorities AS authority
              ON authority.organization_id = canary.organization_id AND authority.user_id = canary.user_id
            JOIN agent_sandboxes AS agent
              ON agent.id = authority.dedicated_agent_id
              AND agent.organization_id = authority.organization_id AND agent.user_id = authority.user_id
            WHERE (SELECT count(*) FROM canary) = 1
          ), selected_target AS (
            SELECT * FROM target WHERE (SELECT count(*) FROM target) = 1
          ), organization AS (
            SELECT org.is_active, org.account_lifecycle_state,
              org.account_lifecycle_revision, org.account_deletion_request_id
            FROM selected_target JOIN organizations AS org ON org.id = selected_target.organization_id
          ), latest_job AS (
            SELECT job.* FROM target
            JOIN jobs AS job ON job.agent_id = target.id::text
              AND job.organization_id = target.organization_id AND job.user_id = target.user_id
            WHERE job.type = 'agent_provision' AND (SELECT count(*) FROM target) = 1
            ORDER BY job.created_at DESC, job.id DESC LIMIT 1
          )
          SELECT json_build_object(
            'kind', 'activated-target-job-origin',
            'canaryCount', (SELECT count(*) FROM canary),
            'targetCount', (SELECT count(*) FROM target),
            'jobCount', (SELECT count(*) FROM latest_job),
            'startedAt', (SELECT started_at FROM latest_job),
            'updatedAt', (SELECT updated_at FROM latest_job),
            'attempts', (SELECT attempts FROM latest_job),
            'errorStoredExternally', (SELECT error_storage = 'r2' FROM latest_job),
            'failureKind', (SELECT CASE
              WHEN error_storage = 'r2' THEN 'external_error'
              WHEN error IS NULL THEN 'none'
              WHEN error ~ 'Account lifecycle fenced provisioning job' THEN 'account_preparation_fenced'
              WHEN error ~ 'Account lifecycle fenced provider admission' THEN 'account_provider_fenced'
              WHEN error ~ 'Agent lifecycle resource generation is already owned' THEN 'resource_generation_owned'
              WHEN error ~ 'Lifecycle execution generation is no longer current' THEN 'job_generation_stale'
              WHEN error ~ 'has conflicting .* job' THEN 'conflicting_lifecycle_job'
              WHEN error ~ 'timeout exceeded when trying to connect' THEN 'database_pool_timeout'
              WHEN error ~ 'canceling statement due to lock timeout' THEN 'database_lock_timeout'
              WHEN error ~ 'canceling statement due to statement timeout' THEN 'database_statement_timeout'
              WHEN error ~ 'Reviewed backup authority changed' THEN 'reviewed_backup_changed'
              WHEN error ~ 'Reviewed fresh-boot authority changed' THEN 'reviewed_fresh_boot_changed'
              WHEN split_part(error, E'\n', 1) ~* 'timed out|timeout' THEN 'timeout'
              ELSE 'unclassified' END FROM latest_job),
            'organizationActive', (SELECT is_active FROM organization),
            'accountLifecycleState', (SELECT account_lifecycle_state FROM organization),
            'accountLifecycleRevision', (SELECT account_lifecycle_revision::text FROM organization),
            'accountDeletionRequested', (SELECT account_deletion_request_id IS NOT NULL FROM organization),
            'sandboxStatus', (SELECT status FROM selected_target),
            'sandboxDeletionRequested', (SELECT deletion_attempt_id IS NOT NULL FROM selected_target),
            'sandboxLifecycleJobPresent', (SELECT lifecycle_job_id IS NOT NULL FROM selected_target),
            'sandboxLifecycleJobMatches', (SELECT selected_target.lifecycle_job_id = latest_job.id FROM selected_target, latest_job),
            'sandboxGenerationMatches', (SELECT selected_target.lifecycle_execution_generation = latest_job.execution_generation FROM selected_target, latest_job),
            'jobQuiesced', (SELECT execution_quiesced_at IS NOT NULL FROM latest_job),
            'jobHasLiveLease', (SELECT EXISTS (
              SELECT 1 FROM job_execution_leases AS lease
              WHERE lease.job_id = latest_job.id AND lease.expires_at > NOW()
            ) FROM latest_job),
            'errorTerms', ARRAY(
              SELECT DISTINCT term[1] FROM latest_job,
                regexp_matches(lower(split_part(error, E'\n', 1)), '\m(timeout|timed|query|connection|connect|handshake|socket|pool|database|postgres|acquire|client|read|write|fetch|abort|aborted|operation|exceeded|trying|response|request|statement|health|sandbox|docker|ssh|vpn|headscale|backup|restore|revocation|lock|lease|body|headers|control|preflight|capacity|admission|fence|fenced|account|lifecycle|generation|owned|current|conflicting|revision|stale|steward|kms|crypto|encryption|decryption|redis|s3|r2|tls|certificate|auth|credential|token|key|econnreset|etimedout|econnrefused)\M', 'g') AS term
              ORDER BY term[1]
            ),
            'stackFrames', ARRAY(
              SELECT DISTINCT frame[1] FROM latest_job,
                regexp_matches(error, '((?:provisioning-jobs|provisioning-account-lifecycle-fence|account-lifecycle-authority|provider-admission|eliza-sandbox|managed-eliza-config|with-timeout|agent-env-crypto|agent-tier-upgrade-target|kms-client|steward-client|api-keys)\.ts:[0-9]+(?::[0-9]+)?)', 'g') AS frame
              ORDER BY frame[1]
            ),
            'stackModules', ARRAY(
              SELECT DISTINCT module[1] FROM latest_job,
                regexp_matches(error, '(pg-pool/index\.js|pg/lib/client\.js|postgres/src/connection\.js|docker-ssh-client\.ts|eliza-sandbox\.ts|provisioning-jobs\.ts|managed-eliza-config\.ts|with-timeout\.ts|agent-env-crypto\.ts|agent-tier-upgrade-target\.ts|kms-client\.ts|steward-client\.ts|api-keys\.ts)', 'g') AS module
              ORDER BY module[1]
            )
          );
          COMMIT;
          SQL

      - name: Summarize replacement cleanup reconciliation eligibility
        id: cleanup_reconciliation
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.RAILWAY_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=20000
        run: |
          set -euo pipefail
          PSQL_DATABASE_URL="$(bun packages/cloud/scripts/admin/libpq-connection-url.ts)"
          echo "::add-mask::$PSQL_DATABASE_URL"
          summary="$({
            psql "$PSQL_DATABASE_URL" \
              --no-psqlrc \
              --no-align \
              --tuples-only \
              --quiet \
              --set ON_ERROR_STOP=1 \
              --set suffix="$CANARY_DIAGNOSTIC_SUFFIX" <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '20s';
          WITH target AS (
            SELECT
              id,
              organization_id,
              headscale_ip,
              replacement_cleanup_created_at,
              replacement_cleanup_sandbox_id IS NOT NULL AS cleanup_fence_present,
              deletion_attempt_id IS NOT NULL AS deletion_attempt_present,
              lifecycle_job_id IS NOT NULL AS lifecycle_job_present,
              lifecycle_execution_generation IS NOT NULL AS lifecycle_generation_present,
              (
                COALESCE(
                  replacement_cleanup_container_id,
                  activation_container_id,
                  CASE WHEN sandbox_id ~ '^[0-9a-f]{12,64}$' THEN sandbox_id END,
                  replacement_cleanup_container_name,
                  container_name
                ) IS NOT NULL
                AND COALESCE(replacement_cleanup_node_id, activation_node_id, node_id) IS NOT NULL
              ) AS inspectable_candidate_present
            FROM agent_sandboxes
            WHERE agent_name = 'managed-dedicated-canary-' || :'suffix'
          ),
          latest_provision AS (
            SELECT
              jobs.id,
              jobs.execution_generation IS NOT NULL AS execution_generation_present,
              jobs.execution_quiesced_at IS NOT NULL AS execution_quiesced_present,
              EXISTS (
                SELECT 1
                FROM job_execution_leases
                WHERE job_execution_leases.job_id = jobs.id
                  AND job_execution_leases.execution_generation = jobs.execution_generation
                  AND job_execution_leases.expires_at > NOW()
              ) AS live_execution_lease_present
            FROM jobs
            INNER JOIN target ON target.id::text = jobs.agent_id
            WHERE jobs.type = 'agent_provision'
            ORDER BY jobs.created_at DESC, jobs.id DESC
            LIMIT 1
          ),
          latest_delete AS (
            SELECT jobs.id
            FROM jobs
            INNER JOIN target ON target.id::text = jobs.agent_id
            WHERE jobs.type = 'agent_delete'
            ORDER BY jobs.created_at DESC, jobs.id DESC
            LIMIT 1
          ),
          eligible AS (
            SELECT candidate.replacement_cleanup_created_at
            FROM agent_sandboxes AS candidate
            WHERE candidate.replacement_cleanup_sandbox_id IS NOT NULL
              AND candidate.execution_tier IN ('dedicated', 'dedicated-always')
              AND (
                candidate.replacement_cleanup_attempt_id IS NULL
                OR candidate.replacement_cleanup_created_at <= NOW() - INTERVAL '30 minutes'
              )
              AND NOT EXISTS (
                SELECT 1
                FROM jobs
                WHERE jobs.organization_id = candidate.organization_id
                  AND jobs.agent_id = candidate.id::text
                  AND jobs.status IN ('pending', 'in_progress')
                  AND jobs.type IN (
                    'agent_provision',
                    'agent_delete',
                    'agent_suspend',
                    'agent_resume',
                    'agent_restart',
                    'agent_upgrade',
                    'agent_admin_canary_image',
                    'agent_downgrade',
                    'agent_sleep',
                    'agent_wake'
                  )
              )
          ),
          facts AS (
            SELECT
              target.replacement_cleanup_created_at,
              target.headscale_ip,
              target.cleanup_fence_present,
              target.deletion_attempt_present,
              target.lifecycle_job_present,
              target.lifecycle_generation_present,
              target.inspectable_candidate_present,
              target.replacement_cleanup_created_at <= NOW() - INTERVAL '30 minutes'
                AS grace_elapsed,
              (
                SELECT count(*)
                FROM jobs
                WHERE jobs.organization_id = target.organization_id
                  AND jobs.agent_id = target.id::text
                  AND jobs.status IN ('pending', 'in_progress')
                  AND jobs.type IN (
                    'agent_provision',
                    'agent_delete',
                    'agent_suspend',
                    'agent_resume',
                    'agent_restart',
                    'agent_upgrade',
                    'agent_admin_canary_image',
                    'agent_downgrade',
                    'agent_sleep',
                    'agent_wake'
                  )
              )::integer AS active_exclusive_jobs,
              (
                SELECT count(*)
                FROM eligible
                WHERE eligible.replacement_cleanup_created_at <
                  target.replacement_cleanup_created_at
              )::integer AS older_eligible_fences,
              (SELECT count(*) FROM eligible)::integer AS total_eligible_fences
            FROM target
          )
          SELECT json_build_object(
            'targetCount', (SELECT count(*) FROM target),
            'agentId', (SELECT id FROM target),
            'deleteJobId', (SELECT id FROM latest_delete),
            'headscaleIp', (SELECT headscale_ip FROM facts),
            'cleanupFencePresent', COALESCE((SELECT cleanup_fence_present FROM facts), false),
            'deletionAttemptPresent', COALESCE((SELECT deletion_attempt_present FROM facts), false),
            'lifecycleJobPresent', COALESCE((SELECT lifecycle_job_present FROM facts), false),
            'lifecycleGenerationPresent', COALESCE((SELECT lifecycle_generation_present FROM facts), false),
            'provisionExecutionGenerationPresent', COALESCE((SELECT execution_generation_present FROM latest_provision), false),
            'provisionExecutionQuiescedPresent', COALESCE((SELECT execution_quiesced_present FROM latest_provision), false),
            'provisionLiveExecutionLeasePresent', COALESCE((SELECT live_execution_lease_present FROM latest_provision), false),
            'inspectableCandidatePresent', COALESCE((SELECT inspectable_candidate_present FROM facts), false),
            'cleanupCreatedAt', (SELECT replacement_cleanup_created_at FROM facts),
            'graceElapsed', COALESCE((SELECT grace_elapsed FROM facts), false),
            'activeExclusiveJobs', COALESCE((SELECT active_exclusive_jobs FROM facts), 0),
            'olderEligibleFences', COALESCE((SELECT older_eligible_fences FROM facts), 0),
            'totalEligibleFences', COALESCE((SELECT total_eligible_fences FROM facts), 0)
          );
          COMMIT;
          SQL
          } | sed '/^[[:space:]]*$/d' | head -n 1)"
          jq -e '
            keys == ["activeExclusiveJobs", "agentId", "cleanupCreatedAt", "cleanupFencePresent", "deleteJobId", "deletionAttemptPresent", "graceElapsed", "headscaleIp", "inspectableCandidatePresent", "lifecycleGenerationPresent", "lifecycleJobPresent", "olderEligibleFences", "provisionExecutionGenerationPresent", "provisionExecutionQuiescedPresent", "provisionLiveExecutionLeasePresent", "targetCount", "totalEligibleFences"] and
            .targetCount == 1 and
            (.agentId | test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")) and
            (.deleteJobId == null or (.deleteJobId | test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"))) and
            (.cleanupFencePresent | type == "boolean") and
            (
              (
                .cleanupFencePresent and
                (.cleanupCreatedAt | type == "string") and
                (.cleanupCreatedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-][0-9]{2}:[0-9]{2})$"))
              ) or
              ((.cleanupFencePresent | not) and .cleanupCreatedAt == null)
            ) and
            (.graceElapsed | type == "boolean") and
            (.inspectableCandidatePresent | type == "boolean") and
            (.deletionAttemptPresent | type == "boolean") and
            (.lifecycleJobPresent | type == "boolean") and
            (.lifecycleGenerationPresent | type == "boolean") and
            (.provisionExecutionGenerationPresent | type == "boolean") and
            (.provisionExecutionQuiescedPresent | type == "boolean") and
            (.provisionLiveExecutionLeasePresent | type == "boolean") and
            (.activeExclusiveJobs | type == "number") and
            (.headscaleIp == null or (.headscaleIp | test("^100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.([0-9]{1,3})\\.([0-9]{1,3})$"))) and
            (.olderEligibleFences | type == "number") and
            (.totalEligibleFences | type == "number")
          ' <<<"$summary" >/dev/null
          agent_id="$(jq -r '.agentId' <<<"$summary")"
          echo "::add-mask::$agent_id"
          echo "agent_id=$agent_id" >> "$GITHUB_OUTPUT"
          unset agent_id
          delete_job_id="$(jq -r '.deleteJobId // ""' <<<"$summary")"
          if [ -n "$delete_job_id" ]; then
            echo "::add-mask::$delete_job_id"
          fi
          echo "delete_job_id=$delete_job_id" >> "$GITHUB_OUTPUT"
          unset delete_job_id
          headscale_ip="$(jq -r '.headscaleIp // ""' <<<"$summary")"
          if [ -n "$headscale_ip" ]; then
            echo "::add-mask::$headscale_ip"
          fi
          echo "headscale_ip=$headscale_ip" >> "$GITHUB_OUTPUT"
          unset headscale_ip
          echo "fence_present=$(jq -r '.cleanupFencePresent' <<<"$summary")" >> "$GITHUB_OUTPUT"
          echo "inspectable_candidate_present=$(jq -r '.inspectableCandidatePresent' <<<"$summary")" >> "$GITHUB_OUTPUT"
          echo "### Replacement cleanup reconciliation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            "- cleanup fence present: `" + (.cleanupFencePresent | tostring) + "`\n" +
            "- cleanup fence created: `" + (.cleanupCreatedAt // "none") + "`\n" +
            "- inspectable candidate present: `" + (.inspectableCandidatePresent | tostring) + "`\n" +
            "- deletion attempt present: `" + (.deletionAttemptPresent | tostring) + "`\n" +
            "- lifecycle job present: `" + (.lifecycleJobPresent | tostring) + "`\n" +
            "- lifecycle generation present: `" + (.lifecycleGenerationPresent | tostring) + "`\n" +
            "- provision execution generation present: `" + (.provisionExecutionGenerationPresent | tostring) + "`\n" +
            "- provision execution quiesced: `" + (.provisionExecutionQuiescedPresent | tostring) + "`\n" +
            "- provision live execution lease: `" + (.provisionLiveExecutionLeasePresent | tostring) + "`\n" +
            "- grace elapsed: `" + (.graceElapsed | tostring) + "`\n" +
            "- active exclusive jobs: `" + (.activeExclusiveJobs | tostring) + "`\n" +
            "- older eligible fences: `" + (.olderEligibleFences | tostring) + "`\n" +
            "- total eligible fences: `" + (.totalEligibleFences | tostring) + "`"
          ' <<<"$summary" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Inspect control-plane route to exact canary peer
        if: steps.cleanup_reconciliation.outputs.headscale_ip != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          CANARY_HEADSCALE_IP: ${{ steps.cleanup_reconciliation.outputs.headscale_ip }}
          CANARY_DIAGNOSTIC_SUFFIX: ${{ inputs.diagnose_canary_suffix }}
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          envs: CANARY_HEADSCALE_IP,CANARY_DIAGNOSTIC_SUFFIX
          script: |
            set -euo pipefail
            [[ "$CANARY_HEADSCALE_IP" =~ ^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.([0-9]{1,3})\.([0-9]{1,3})$ ]] || exit 1
            [[ "$CANARY_DIAGNOSTIC_SUFFIX" =~ ^[a-z0-9-]{8,80}$ ]] || exit 1
            status_json="$(sudo tailscale status --json 2>/dev/null || true)"
            backend="$(jq -r '.BackendState // "unknown"' <<<"$status_json" 2>/dev/null || echo unknown)"
            self_ip=false
            peer_present=false
            peer_online=false
            if jq -e '.Self.TailscaleIPs | type == "array" and length > 0' <<<"$status_json" >/dev/null 2>&1; then
              self_ip=true
            fi
            if jq -e --arg ip "$CANARY_HEADSCALE_IP" '[.Peer[]? | select((.TailscaleIPs // []) | index($ip))] | length == 1' <<<"$status_json" >/dev/null 2>&1; then
              peer_present=true
            fi
            if jq -e --arg ip "$CANARY_HEADSCALE_IP" '[.Peer[]? | select(((.TailscaleIPs // []) | index($ip)) and .Online == true)] | length == 1' <<<"$status_json" >/dev/null 2>&1; then
              peer_online=true
            fi
            suffix_peer_count="$(jq -r --arg suffix "$CANARY_DIAGNOSTIC_SUFFIX" '[.Peer[]? | select(((.HostName // "") | contains($suffix)) or ((.DNSName // "") | contains($suffix)))] | length' <<<"$status_json" 2>/dev/null || echo 0)"
            suffix_peer_online_count="$(jq -r --arg suffix "$CANARY_DIAGNOSTIC_SUFFIX" '[.Peer[]? | select((((.HostName // "") | contains($suffix)) or ((.DNSName // "") | contains($suffix))) and .Online == true)] | length' <<<"$status_json" 2>/dev/null || echo 0)"
            suffix_peer_ip="$(jq -r --arg suffix "$CANARY_DIAGNOSTIC_SUFFIX" '[.Peer[]? | select(((.HostName // "") | contains($suffix)) or ((.DNSName // "") | contains($suffix)))] | if length == 1 then (.[0].TailscaleIPs[0] // "") else "" end' <<<"$status_json" 2>/dev/null || true)"
            suffix_ip_matches_database=false
            suffix_route_tailnet=false
            suffix_ping_reachable=false
            suffix_health_reachable=false
            if [[ "$suffix_peer_ip" =~ ^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
              [ "$suffix_peer_ip" = "$CANARY_HEADSCALE_IP" ] && suffix_ip_matches_database=true
              suffix_route_device="$(ip route get "$suffix_peer_ip" 2>/dev/null | awk '{ for (i = 1; i <= NF; i += 1) if ($i == "dev") { print $(i + 1); exit } }')"
              [ "$suffix_route_device" = tailscale0 ] && suffix_route_tailnet=true
              if timeout --signal=TERM --kill-after=2s 12s sudo tailscale ping --timeout=5s --c=1 "$suffix_peer_ip" >/dev/null 2>&1; then
                suffix_ping_reachable=true
              fi
              suffix_health_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 "http://$suffix_peer_ip:2138/api/health" 2>/dev/null || true)"
              case "$suffix_health_status" in
                200|301|302|401) suffix_health_reachable=true ;;
              esac
            fi
            route_device="$(ip route get "$CANARY_HEADSCALE_IP" 2>/dev/null | awk '{ for (i = 1; i <= NF; i += 1) if ($i == "dev") { print $(i + 1); exit } }')"
            route_tailnet=false
            [ "$route_device" = tailscale0 ] && route_tailnet=true
            ping_reachable=false
            if timeout --signal=TERM --kill-after=2s 12s sudo tailscale ping --timeout=5s --c=1 "$CANARY_HEADSCALE_IP" >/dev/null 2>&1; then
              ping_reachable=true
            fi
            health_reachable=false
            health_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 "http://$CANARY_HEADSCALE_IP:2138/api/health" 2>/dev/null || true)"
            case "$health_status" in
              200|301|302|401) health_reachable=true ;;
            esac
            case "$backend" in
              Running|Starting|Stopped|NeedsLogin|NeedsMachineAuth|NoState) ;;
              *) backend=unknown ;;
            esac
            echo "control_plane_tailnet_backend=$backend"
            echo "control_plane_tailnet_self_ip=$self_ip"
            echo "control_plane_canary_peer_present=$peer_present"
            echo "control_plane_canary_peer_online=$peer_online"
            echo "control_plane_canary_route_tailscale0=$route_tailnet"
            echo "control_plane_canary_ping_reachable=$ping_reachable"
            echo "control_plane_canary_health_reachable=$health_reachable"
            echo "control_plane_suffix_peer_count=$suffix_peer_count"
            echo "control_plane_suffix_peer_online_count=$suffix_peer_online_count"
            echo "control_plane_suffix_ip_matches_database=$suffix_ip_matches_database"
            echo "control_plane_suffix_route_tailscale0=$suffix_route_tailnet"
            echo "control_plane_suffix_ping_reachable=$suffix_ping_reachable"
            echo "control_plane_suffix_health_reachable=$suffix_health_reachable"
            unset status_json backend self_ip peer_present peer_online route_device route_tailnet \
              ping_reachable health_status health_reachable suffix_peer_count suffix_peer_online_count \
              suffix_peer_ip suffix_ip_matches_database suffix_route_device suffix_route_tailnet \
              suffix_ping_reachable suffix_health_status suffix_health_reachable CANARY_HEADSCALE_IP \
              CANARY_DIAGNOSTIC_SUFFIX

      - name: Classify control-plane replacement cleanup failure
        if: steps.cleanup_reconciliation.outputs.fence_present == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            block="$(
              sudo journalctl \
                -u eliza-provisioning-worker.service \
                --since '5 minutes ago' \
                -o cat \
                --no-pager 2>/dev/null \
                | awk '
                    index($0, "[agent-sandbox] Replacement cleanup remains pending") {
                      captured = $0
                      remaining = 12
                      next
                    }
                    remaining > 0 {
                      captured = captured ORS $0
                      remaining -= 1
                    }
                    END { print captured }
                  ' \
                || true
            )"
            lower="$(printf '%s' "$block" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              '') category='missing' ;;
              *'permission denied'*|*'publickey'*|*'authentication methods failed'*) category='ssh_auth' ;;
              *'timed out'*|*'timeout'*) category='ssh_timeout' ;;
              *'connection refused'*|*'econnrefused'*) category='ssh_refused' ;;
              *'could not resolve'*|*'enotfound'*|*'getaddrinfo'*) category='ssh_dns' ;;
              *'connection reset'*|*'econnreset'*) category='ssh_reset' ;;
              *'command exited with code'*) category='ssh_command_exit' ;;
              *'connection error for'*) category='ssh_connect_error' ;;
              *'stream error'*) category='ssh_stream_error' ;;
              *'replacement secret cleanup receipt was missing or malformed'*) category='secret_receipt_invalid' ;;
              *'replacement cleanup state receipt was malformed'*) category='state_receipt_invalid' ;;
              *'replacement candidate observation receipt was missing or malformed'*) category='candidate_observation_receipt_invalid' ;;
              *'replacement candidate proof conflicts'*) category='candidate_proof_conflict' ;;
              *'replacement candidate proof id mismatch'*) category='candidate_proof_id_mismatch' ;;
              *'exact replacement attempt label mismatch'*) category='exact_attempt_label_mismatch' ;;
              *'replacement attempt label mismatch'*) category='attempt_label_mismatch' ;;
              *'replacement container id mismatch'*) category='container_id_mismatch' ;;
              *'cannot verify replacement identity'*'expected one inspect record'*) category='inspect_record_count' ;;
              *'cannot verify replacement identity'*'malformed inspect record'*) category='inspect_record_malformed' ;;
              *'cannot verify replacement identity'*'invalid docker id'*) category='inspect_docker_id_invalid' ;;
              *'cannot prove id-less replacement'*'interrupted docker create may still materialize'*) category='docker_create_unresolved' ;;
              *'exact replacement cleanup ssh authority is unavailable'*) category='cleanup_ssh_authority_unavailable' ;;
              *'exact replacement cleanup node authority is incomplete'*) category='node_authority_invalid' ;;
              *'exact replacement cleanup node record is no longer registered'*) category='node_authority_missing' ;;
              *'exact replacement cleanup node authority changed'*) category='node_authority_drift' ;;
              *"node "*" is not registered"*) category='node_not_registered' ;;
              *'exact replacement vpn cleanup requires a durable headscale node id'*) category='vpn_node_id_unresolved' ;;
              *'cannot clean invalid headscale node id'*) category='vpn_node_id_invalid' ;;
              *"cannot prove headscale node "*" absent after cleanup"*) category='vpn_absence_unproven' ;;
              *'vpn registration window remains open'*) category='vpn_registration_window_open' ;;
              *'cannot recover vpn identity'*'without a node name'*) category='vpn_node_name_missing' ;;
              *'cannot recover vpn identity'*'without a registration start time'*) category='vpn_registration_start_missing' ;;
              *'cannot recover vpn identity'*'invalid registration start time'*) category='vpn_registration_start_invalid' ;;
              *'cannot recover vpn identity'*'registration count exceeds the cleanup bound'*) category='vpn_registration_count_exceeded' ;;
              *'cannot recover vpn identity'*'matching registrations'*) category='vpn_multiple_registrations' ;;
              *'cannot recover vpn identity'*) category='vpn_identity_invalid' ;;
              *"headscale api "*" failed: 401"*|*"headscale api "*" failed: 403"*) category='headscale_api_auth' ;;
              *"headscale api "*" failed:"*) category='headscale_api_failure' ;;
              *'cannot prove'*'absent'*) category='absence_unproven' ;;
              *'sandbox provider cannot prove a persisted replacement absent'*) category='provider_contract_missing' ;;
              *) category='unclassified' ;;
            esac
            signals=''
            for signal in \
              replacement_cleanup_unresolved replacement docker_sandbox docker_ssh secret receipt \
              inspect identity attempt container headscale vpn node authority mismatch \
              missing malformed unavailable invalid not_registered cannot_prove failed \
              without registration matching exceeds bound \
              exit succeeded disappeared release allocation; do
              case "$signal:$lower" in
                replacement_cleanup_unresolved:*'replacement cleanup is unresolved'*) matched=true ;;
                docker_sandbox:*'docker-sandbox'*) matched=true ;;
                docker_ssh:*'docker-ssh'*) matched=true ;;
                not_registered:*'not registered'*) matched=true ;;
                cannot_prove:*'cannot prove'*) matched=true ;;
                *:*"${signal//_/-}"*) matched=true ;;
                *) matched=false ;;
              esac
              if [ "$matched" = true ]; then
                signals="${signals:+$signals,}$signal"
              fi
            done
            unset block lower
            echo "replacement_cleanup_failure_category=$category"
            echo "replacement_cleanup_failure_signals=${signals:-none}"

      - name: Classify private mesh observation failure
        if: steps.cleanup_reconciliation.outputs.agent_id != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          CANARY_AGENT_ID: ${{ steps.cleanup_reconciliation.outputs.agent_id }}
          CANARY_DIAGNOSTIC_SUFFIX: ${{ inputs.diagnose_canary_suffix }}
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          envs: CANARY_AGENT_ID,CANARY_DIAGNOSTIC_SUFFIX
          script: |
            set -euo pipefail
            [[ "$CANARY_AGENT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || exit 1
            [[ "$CANARY_DIAGNOSTIC_SUFFIX" =~ ^r[1-9][0-9]{7,19}a[1-9][0-9]{0,3}$ ]] || exit 1
            block="$(
              sudo journalctl \
                -u eliza-provisioning-worker.service \
                --since '4 hours ago' \
                -o cat \
                --no-pager 2>/dev/null \
                | grep -F -B 12 -A 12 "$CANARY_DIAGNOSTIC_SUFFIX" \
                | tail -n 1200 \
                || true
            )"
            lower="$(printf '%s' "$block" | tr '[:upper:]' '[:lower:]')"
            observation="$(
              printf '%s\n' "$lower" \
                | sed -n 's/^.*docker candidate mesh observation before cleanup: //p' \
                | tail -n 1
            )"
            case "$observation" in
              *'authkey_rejected=true'*|*'interactive=true'*) category='mesh_auth_required' ;;
              *'container=exited'*|*'container=dead'*) category='candidate_container_exited' ;;
              *'socket=false'*'daemon=false'*) category='tailscale_daemon_unavailable' ;;
              *'socket=false'*) category='tailscale_socket_missing' ;;
              *'daemon=false'*) category='tailscale_daemon_missing' ;;
              *'route=false'*) category='container_default_route_missing' ;;
              *'tun=false'*) category='container_tun_missing' ;;
              *'control=false'*) category='headscale_control_unreachable' ;;
              *'dns_failed=true'*) category='headscale_dns_failure' ;;
              *'tls_failed=true'*) category='headscale_tls_failure' ;;
              *'control_transport_failed=true'*) category='headscale_control_transport_failure' ;;
              *'control_key=false'*) category='headscale_control_key_not_fetched' ;;
              *'login_started=false'*) category='tailscale_login_not_started' ;;
              *'register_request=false'*) category='tailscale_register_request_not_sent' ;;
              *'status=error'*) category='tailscale_status_unavailable' ;;
              *'backend=needslogin'*) category='tailscale_needs_login' ;;
              *'backend=needsmachineauth'*) category='tailscale_needs_machine_auth' ;;
              *'backend=starting'*) category='tailscale_starting_without_ip' ;;
              *'backend=stopped'*) category='tailscale_stopped' ;;
              *'backend=running'*'ip=false'*) category='tailscale_running_without_ip' ;;
              *'ip=true'*) category='candidate_ip_observed' ;;
              '')
                case "$lower" in
              *'docker candidate cannot complete required headscale registration: auth_required'*) category='mesh_auth_required' ;;
              *'docker candidate cannot complete required headscale registration: container_exited'*) category='candidate_container_exited' ;;
              *'headscale registration does not match the exact docker candidate'*) category='candidate_identity_mismatch' ;;
              *'auth error polling vpn'*) category='headscale_api_auth' ;;
              *'headscale api '*' failed:'*) category='headscale_api_failure' ;;
              *'headscale registration did not reach an exact observable completion'*) category='registration_unresolved' ;;
              *'headscale rename completion'*) category='rename_unresolved' ;;
              *'vpn registration failed'*) category='registration_failed' ;;
              *'vpn registration timeout'*) category='registration_timeout' ;;
              *' registered on vpn:'*) category='registration_observed' ;;
              '') category='missing' ;;
              *) category='unclassified' ;;
                esac
                ;;
              *) category='observation_unclassified' ;;
            esac
            signals=''
            for signal in \
              auth_required container_exited identity_mismatch api_auth api_failure \
              registration_failed registration_timeout registration_observed \
              rename_unresolved exact_completion_unresolved; do
              case "$signal:$lower" in
                auth_required:*'required headscale registration: auth_required'*) matched=true ;;
                container_exited:*'required headscale registration: container_exited'*) matched=true ;;
                identity_mismatch:*'headscale registration does not match the exact docker candidate'*) matched=true ;;
                api_auth:*'auth error polling vpn'*) matched=true ;;
                api_failure:*'headscale api '*' failed:'*) matched=true ;;
                registration_failed:*'vpn registration failed'*) matched=true ;;
                registration_timeout:*'vpn registration timeout'*) matched=true ;;
                registration_observed:*' registered on vpn:'*) matched=true ;;
                rename_unresolved:*'headscale rename completion'*) matched=true ;;
                exact_completion_unresolved:*'headscale registration did not reach an exact observable completion'*) matched=true ;;
                *) matched=false ;;
              esac
              if [ "$matched" = true ]; then
                signals="${signals:+$signals,}$signal"
              fi
            done
            observation_present=false
            [ -n "$observation" ] && observation_present=true
            unset block lower
            echo "private_mesh_failure_category=$category"
            echo "private_mesh_failure_signals=${signals:-none}"
            echo "private_mesh_observation_present=$observation_present"
            if [ "$observation_present" = true ]; then
              for field in container socket daemon status backend authorized authurl ip route tun control \
                control_key login_started register_request control_transport_failed tls_failed dns_failed \
                authkey_rejected interactive up_failed agent_started; do
                value="$(printf '%s' "$observation" | tr ',' '\n' | sed -n "s/^${field}=//p" | tail -n 1)"
                case "$field:$value" in
                  container:running|container:paused|container:restarting|container:removing|container:exited|container:dead|container:created|container:unknown) ;;
                  status:success|status:error) ;;
                  backend:running|backend:starting|backend:stopped|backend:needslogin|backend:needsmachineauth|backend:nostate|backend:unknown) ;;
                  authorized:true|authorized:false|authorized:unknown) ;;
                  socket:true|socket:false|daemon:true|daemon:false|authurl:true|authurl:false|ip:true|ip:false|route:true|route:false|tun:true|tun:false|control:true|control:false|control_key:true|control_key:false|login_started:true|login_started:false|register_request:true|register_request:false|control_transport_failed:true|control_transport_failed:false|tls_failed:true|tls_failed:false|dns_failed:true|dns_failed:false|authkey_rejected:true|authkey_rejected:false|interactive:true|interactive:false|up_failed:true|up_failed:false|agent_started:true|agent_started:false) ;;
                  *) value='unknown' ;;
                esac
                echo "private_mesh_observation_${field}=$value"
              done
            fi
            unset observation observation_present CANARY_AGENT_ID

      - name: Inspect exact private mesh candidate
        if: steps.cleanup_reconciliation.outputs.fence_present == 'true' || steps.cleanup_reconciliation.outputs.inspectable_candidate_present == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          envs: CANARY_DIAGNOSTIC_SUFFIX
          script: |
            set -euo pipefail
            set +e
            raw="$(
              timeout --signal=TERM --kill-after=5s 75s sudo systemd-run \
                --quiet \
                --wait \
                --pipe \
                --collect \
                --uid=deploy \
                --gid=deploy \
                --property=EnvironmentFile=/opt/eliza/cloud/.env.local \
                --property=WorkingDirectory=/opt/eliza \
                --property=Environment=PATH=/home/deploy/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin \
                /usr/bin/env bun --conditions=eliza-source \
                packages/cloud/scripts/admin/managed-dedicated-mesh-state-diagnostic.ts \
                "$CANARY_DIAGNOSTIC_SUFFIX" 2>&1
            )"
            probe_status=$?
            set -e
            diagnostic="$(printf '%s\n' "$raw" | sed -n 's/^MESH_DIAGNOSTIC=//p' | tail -n 1)"
            unset raw
            if [ -z "$diagnostic" ]; then
              echo "::error::Exact private mesh diagnostic produced no closed artifact (status $probe_status)."
              exit 1
            fi
            unset probe_status
            jq -e '
              keys == ["application", "container", "host", "logs", "runtime", "schemaVersion", "tailscale", "targetCount"] and
              .schemaVersion == 3 and
              .targetCount == 1 and
              (.host | keys == ["containerdServiceActive", "dockerServiceActive", "liveRestoreConfigured"]) and
              ([.host.containerdServiceActive, .host.dockerServiceActive, .host.liveRestoreConfigured] | all(type == "boolean")) and
              (.container | keys == ["exitCode", "health", "imageMatchesConfigured", "inspect", "status"]) and
              (.container.inspect == "success" or .container.inspect == "error") and
              (.container.status | IN("created", "running", "paused", "restarting", "removing", "exited", "dead", "unknown")) and
              (.container.health | IN("starting", "healthy", "unhealthy", "none", "unknown")) and
              (.container.exitCode == null or (.container.exitCode | type == "number")) and
              (.container.imageMatchesConfigured == null or (.container.imageMatchesConfigured | type == "boolean")) and
              (.tailscale | keys == ["authUrlPresent", "backendState", "daemonPresent", "ipPresent", "machineAuthorized", "query", "socketPresent"]) and
              (.tailscale.query == "success" or .tailscale.query == "error") and
              (.tailscale.backendState == null or (.tailscale.backendState | IN("NeedsLogin", "NeedsMachineAuth", "NoState", "Running", "Starting", "Stopped"))) and
              (.tailscale.machineAuthorized == null or (.tailscale.machineAuthorized | type == "boolean")) and
              ([.tailscale.authUrlPresent, .tailscale.daemonPresent, .tailscale.ipPresent, .tailscale.socketPresent] | all(type == "boolean")) and
              (.logs | keys == ["agentStarted", "authKeyRejected", "interactiveAuthRequired", "tailscaleUpFailed"]) and
              ([.logs.agentStarted, .logs.authKeyRejected, .logs.interactiveAuthRequired, .logs.tailscaleUpFailed] | all(type == "boolean")) and
              (.runtime | keys == ["agentProcessPresent", "entrypointProcessPresent", "forceNoise443Enabled", "pid1", "stuckCliEscapePresent", "tailscaleUpProcessPresent"]) and
              (.runtime.pid1 | IN("agent", "entrypoint", "other", "tailscale-up", "unknown")) and
              ([.runtime.agentProcessPresent, .runtime.entrypointProcessPresent, .runtime.forceNoise443Enabled, .runtime.stuckCliEscapePresent, .runtime.tailscaleUpProcessPresent] | all(type == "boolean"))
              and (.application | keys == ["apiExposePortEnabled", "cloudProvisioned", "health", "root"])
              and (.application.health | IN("accepted", "response", "unreachable", "unknown"))
              and (.application.root | IN("accepted", "response", "unreachable", "unknown"))
              and ([.application.apiExposePortEnabled, .application.cloudProvisioned] | all(type == "boolean"))
            ' <<<"$diagnostic" >/dev/null
            jq -r '
              "private_mesh_container_status=" + .container.status,
              "private_mesh_container_exit_code=" + ((.container.exitCode // "none") | tostring),
              "private_mesh_container_health=" + (.container.health // "unknown"),
              "private_mesh_container_image_matches_configured=" + ((.container.imageMatchesConfigured // "unknown") | tostring),
              "private_mesh_host_live_restore=" + (.host.liveRestoreConfigured | tostring),
              "private_mesh_host_docker_service_active=" + (.host.dockerServiceActive | tostring),
              "private_mesh_host_containerd_service_active=" + (.host.containerdServiceActive | tostring),
              "private_mesh_tailscale_query=" + .tailscale.query,
              "private_mesh_tailscale_backend=" + (.tailscale.backendState // "unknown"),
              "private_mesh_tailscale_machine_authorized=" + ((.tailscale.machineAuthorized // "unknown") | tostring),
              "private_mesh_tailscale_auth_url=" + (.tailscale.authUrlPresent | tostring),
              "private_mesh_tailscale_socket=" + (.tailscale.socketPresent | tostring),
              "private_mesh_tailscale_daemon=" + (.tailscale.daemonPresent | tostring),
              "private_mesh_tailscale_ip=" + (.tailscale.ipPresent | tostring),
              "private_mesh_log_auth_key_rejected=" + (.logs.authKeyRejected | tostring),
              "private_mesh_log_interactive_auth=" + (.logs.interactiveAuthRequired | tostring),
              "private_mesh_log_tailscale_up_failed=" + (.logs.tailscaleUpFailed | tostring),
              "private_mesh_log_agent_started=" + (.logs.agentStarted | tostring),
              "private_mesh_runtime_pid1=" + .runtime.pid1,
              "private_mesh_runtime_agent_process=" + (.runtime.agentProcessPresent | tostring),
              "private_mesh_runtime_entrypoint_process=" + (.runtime.entrypointProcessPresent | tostring),
              "private_mesh_runtime_tailscale_up_process=" + (.runtime.tailscaleUpProcessPresent | tostring),
              "private_mesh_runtime_force_noise_443=" + (.runtime.forceNoise443Enabled | tostring),
              "private_mesh_runtime_stuck_cli_escape=" + (.runtime.stuckCliEscapePresent | tostring),
              "private_mesh_application_health=" + (.application.health // "unknown"),
              "private_mesh_application_root=" + (.application.root // "unknown"),
              "private_mesh_application_cloud_provisioned=" + (.application.cloudProvisioned | tostring),
              "private_mesh_application_api_expose_port=" + (.application.apiExposePortEnabled | tostring)
            ' <<<"$diagnostic"
            unset diagnostic

      - name: Classify exact Headscale API inventory
        if: steps.cleanup_reconciliation.outputs.agent_id != ''
        shell: bash
        env:
          CANARY_DIAGNOSTIC_SUFFIX: ${{ inputs.diagnose_canary_suffix }}
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$CANARY_DIAGNOSTIC_SUFFIX" =~ ^[a-z0-9-]{8,80}$ ]] || exit 1
          [ -n "${HEADSCALE_API_KEY//[[:space:]]/}" ] || exit 1
          inventory="$(
            curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 20 \
              --header "Authorization: Bearer $HEADSCALE_API_KEY" \
              https://headscale-staging.eliza.app/api/v1/node
          )"
          jq -r --arg suffix "$CANARY_DIAGNOSTIC_SUFFIX" '
            [(.nodes // [])[] | select((.name // "") | contains($suffix))] as $nameMatches
            | [(.nodes // [])[] | select((.givenName // "") | contains($suffix))] as $givenNameMatches
            | [
                "headscale_api_name_match_count=" + (($nameMatches | length) | tostring),
                "headscale_api_given_name_match_count=" + (($givenNameMatches | length) | tostring),
                "headscale_api_name_match_ip_count=" + ([$nameMatches[] | select(((.ipAddresses // []) | length) > 0)] | length | tostring),
                "headscale_api_name_match_created_at_count=" + ([$nameMatches[] | select((.createdAt // "") | fromdateiso8601? != null)] | length | tostring),
                "headscale_api_name_match_agent_tag_count=" + ([$nameMatches[] | select(((.tags // []) | index("tag:agent")) != null)] | length | tostring)
              ]
            | .[]
          ' <<<"$inventory"
          unset inventory HEADSCALE_API_KEY CANARY_DIAGNOSTIC_SUFFIX

      - name: Classify exact Headscale registration exchange
        if: steps.cleanup_reconciliation.outputs.agent_id != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          CANARY_AGENT_ID: ${{ steps.cleanup_reconciliation.outputs.agent_id }}
          CANARY_DIAGNOSTIC_SUFFIX: ${{ inputs.diagnose_canary_suffix }}
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          envs: CANARY_AGENT_ID,CANARY_DIAGNOSTIC_SUFFIX
          script: |
            set -euo pipefail
            [[ "$CANARY_AGENT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || exit 1
            [[ "$CANARY_DIAGNOSTIC_SUFFIX" =~ ^[a-z0-9-]{8,80}$ ]] || exit 1
            block="$(
              sudo journalctl \
                -u headscale.service \
                --since '4 hours ago' \
                -o cat \
                --no-pager 2>/dev/null \
                | grep -F -B 12 -A 12 "$CANARY_DIAGNOSTIC_SUFFIX" \
                | tail -n 1200 \
                || true
            )"
            lower="$(printf '%s' "$block" | tr '[:upper:]' '[:lower:]')"
            request_seen=false
            preauth_registration=false
            invalid_key=false
            expired_key=false
            used_key=false
            ownership_error=false
            timed_out=false
            tag_rejected=false
            [ -n "$lower" ] && request_seen=true
            case "$lower" in *'registering node with pre-auth key'*) preauth_registration=true ;; esac
            case "$lower" in *'invalid authkey'*|*'invalid auth key'*|*'invalid pre auth key'*) invalid_key=true ;; esac
            case "$lower" in *'authkey expired'*|*'auth key expired'*) expired_key=true ;; esac
            case "$lower" in *'authkey already used'*|*'auth key already used'*) used_key=true ;; esac
            case "$lower" in *'different machine key'*|*'ownership'*) ownership_error=true ;; esac
            case "$lower" in *'registration timed out'*) timed_out=true ;; esac
            case "$lower" in *'requested tags invalid or not permitted'*|*'advertise-tags'*'invalid'*) tag_rejected=true ;; esac
            if [ "$invalid_key" = true ]; then
              category='invalid_key'
            elif [ "$expired_key" = true ]; then
              category='expired_key'
            elif [ "$used_key" = true ]; then
              category='used_key'
            elif [ "$ownership_error" = true ]; then
              category='ownership_error'
            elif [ "$timed_out" = true ]; then
              category='registration_timed_out'
            elif [ "$tag_rejected" = true ]; then
              category='tag_rejected'
            elif [ "$preauth_registration" = true ]; then
              category='preauth_registration_seen'
            elif [ "$request_seen" = true ]; then
              category='agent_log_seen_without_preauth_registration'
            else
              category='no_exact_registration_log'
            fi
            inventory="$(sudo headscale nodes list -o json 2>/dev/null)"
            expected_node_name="managed-dedicated-canary-${CANARY_DIAGNOSTIC_SUFFIX}-${CANARY_AGENT_ID:0:12}"
            inventory_summary="$(
              jq -r --arg suffix "$CANARY_DIAGNOSTIC_SUFFIX" --arg expected "$expected_node_name" '
                [
                  .[]
                  | select((.name // "") | contains($suffix))
                ] as $nodes
                | ([.[] | select(.name == "cp-staging-router")]) as $controlPlaneNodes
                | ($nodes | map(select(.name == $expected))) as $exact
                | ($nodes | map(select(
                    (.name // "") as $name
                    | ($name | startswith($expected + "-")) and
                      (($name | ltrimstr($expected + "-")) | test("^[a-z0-9]{8}$"))
                  ))) as $suffixed
                | [
                    "headscale_canary_node_count=" + (($nodes | length) | tostring),
                    "headscale_canary_node_online_count=" + ([$nodes[] | select(.online == true)] | length | tostring),
                    "headscale_canary_node_ip_count=" + ([$nodes[] | select(((.ipAddresses // .ip_addresses // []) | length) > 0)] | length | tostring),
                    "headscale_canary_agent_tag_count=" + ([$nodes[] | select(((.tags // []) | index("tag:agent")) != null)] | length | tostring),
                    "headscale_canary_node_name_category=" + (
                      if ($exact | length) > 0 then "exact"
                      elif ($suffixed | length) > 0 then "collision_suffix"
                      elif ($nodes | length) > 0 then "unexpected_suffix"
                      else "absent"
                      end
                    ),
                    "headscale_control_plane_node_count=" + (($controlPlaneNodes | length) | tostring),
                    "headscale_control_plane_node_online_count=" + ([$controlPlaneNodes[] | select(.online == true)] | length | tostring),
                    "headscale_control_plane_node_ip_count=" + ([$controlPlaneNodes[] | select(((.ipAddresses // .ip_addresses // []) | length) > 0)] | length | tostring),
                    "headscale_control_plane_proxy_tag_count=" + ([$controlPlaneNodes[] | select(((.tags // []) | index("tag:eliza-proxy")) != null)] | length | tostring)
                  ]
                | .[]
              ' <<<"$inventory"
            )"
            unset block lower CANARY_AGENT_ID CANARY_DIAGNOSTIC_SUFFIX inventory expected_node_name
            echo "headscale_registration_category=$category"
            echo "headscale_registration_request_seen=$request_seen"
            echo "headscale_preauth_registration_seen=$preauth_registration"
            echo "headscale_invalid_key_seen=$invalid_key"
            echo "headscale_expired_key_seen=$expired_key"
            echo "headscale_used_key_seen=$used_key"
            echo "headscale_ownership_error_seen=$ownership_error"
            echo "headscale_registration_timeout_seen=$timed_out"
            echo "headscale_tag_rejection_seen=$tag_rejected"
            printf '%s\n' "$inventory_summary"
            unset inventory_summary

      - name: Summarize Headscale ingress protocol
        if: steps.cleanup_reconciliation.outputs.agent_id != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            version_raw="$(sudo headscale version 2>/dev/null || true)"
            version="$(printf '%s' "$version_raw" | grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
            if [[ ! "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version='unknown'
            fi
            unset version_raw

            # Default nginx access logs contain remote addresses and user
            # agents. Reduce the bounded tail on-host to exact method/path/status
            # counters and emit only those closed aggregate fields.
            summary="$({
              sudo tail -n 20000 /var/log/nginx/access.log 2>/dev/null || true
              sudo zcat -f /var/log/nginx/access.log.1 2>/dev/null || true
            } | awk '
              function count_path(method, path, status) {
                if (method == "GET" && path ~ /^\/key([?]|$)/) key[status] += 1
                if (path == "/ts2021") {
                  ts2021[status] += 1
                  if (method == "POST") ts2021_post += 1
                  if (method == "GET") ts2021_get += 1
                }
                if (method == "POST" && path == "/machine/register") machine_register[status] += 1
              }
              {
                split($0, quoted, "\"")
                split(quoted[2], request, " ")
                split(quoted[3], response, " ")
                if (length(request) >= 2 && response[1] ~ /^[0-9][0-9][0-9]$/) {
                  count_path(request[1], request[2], response[1])
                }
              }
              END {
                key_total = ts_total = machine_total = 0
                for (status in key) key_total += key[status]
                for (status in ts2021) ts_total += ts2021[status]
                for (status in machine_register) machine_total += machine_register[status]
                printf "key_total=%d\n", key_total
                printf "ts2021_total=%d\n", ts_total
                printf "ts2021_post=%d\n", ts2021_post + 0
                printf "ts2021_get=%d\n", ts2021_get + 0
                printf "machine_register_total=%d\n", machine_total
                for (status in ts2021) printf "ts2021_status_%s=%d\n", status, ts2021[status]
                for (status in machine_register) printf "machine_register_status_%s=%d\n", status, machine_register[status]
              }
            ')"
            echo "headscale_version=$version"
            printf '%s\n' "$summary"
            unset version summary

      - name: Summarize recent agent pre-auth key state
        if: steps.cleanup_reconciliation.outputs.agent_id != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            raw="$(sudo headscale preauthkeys list --output json 2>/dev/null)"
            summary="$(
              jq -c '
                def epoch:
                  if type == "object" then (.seconds // 0 | tonumber)
                  elif type == "string" then
                    (sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601? // 0)
                  else 0
                  end;
                [
                  .[]
                  | select((((.aclTags // .acl_tags // []) | index("tag:agent")) != null))
                  | select(
                      ((.createdAt // .created_at // null) | epoch) >= (now - 14400)
                    )
                ] as $keys
                | {
                    count: ($keys | length),
                    used: ([$keys[] | select(.used == true)] | length),
                    unused: ([$keys[] | select(.used != true)] | length),
                    reusable: ([$keys[] | select(.reusable == true)] | length),
                    expired: ([
                      $keys[]
                      | select(
                          ((.expiration // null) | epoch) < now
                        )
                    ] | length)
                  }
              ' <<<"$raw"
            )"
            unset raw
            jq -e '
              keys == ["count", "expired", "reusable", "unused", "used"] and
              ([.count, .expired, .reusable, .unused, .used] | all(type == "number")) and
              .count >= 0 and .used >= 0 and .unused >= 0 and
              .reusable >= 0 and .expired >= 0 and
              .used + .unused == .count
            ' <<<"$summary" >/dev/null
            jq -r '
              "headscale_recent_agent_key_count=" + (.count | tostring),
              "headscale_recent_agent_key_used=" + (.used | tostring),
              "headscale_recent_agent_key_unused=" + (.unused | tostring),
              "headscale_recent_agent_key_reusable=" + (.reusable | tostring),
              "headscale_recent_agent_key_expired=" + (.expired | tostring)
            ' <<<"$summary"
            unset summary

      - name: Classify exact dedicated lifecycle journal
        if: steps.cleanup_reconciliation.outputs.agent_id != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          CANARY_AGENT_ID: ${{ steps.cleanup_reconciliation.outputs.agent_id }}
          CANARY_DELETE_JOB_ID: ${{ steps.cleanup_reconciliation.outputs.delete_job_id }}
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 2m
          envs: CANARY_AGENT_ID,CANARY_DELETE_JOB_ID
          script: |
            set -euo pipefail
            [[ "$CANARY_AGENT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || exit 1
            if [ -n "$CANARY_DELETE_JOB_ID" ]; then
              [[ "$CANARY_DELETE_JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || exit 1
            fi
            block="$(
              sudo journalctl \
                -u eliza-provisioning-worker.service \
                --since '4 hours ago' \
                -o cat \
                --no-pager 2>/dev/null \
                | { grep -F -B 12 -A 12 -e "$CANARY_AGENT_ID" ${CANARY_DELETE_JOB_ID:+-e "$CANARY_DELETE_JOB_ID"} || true; } \
                | tail -n 1200 \
            )"
            lower="$(printf '%s' "$block" | tr '[:upper:]' '[:lower:]')"
            recent_recovery_block="$(
              sudo journalctl \
                -u eliza-provisioning-worker.service \
                --since '3 hours ago' \
                -o cat \
                --no-pager 2>/dev/null \
                | grep -F -A 12 \
                    -e '[docker-sandbox] Docker teardown recovery decision' \
                    -e '[docker-sandbox] Docker teardown failed twice; probing daemon recovery' \
                    -e '[docker-sandbox] Docker daemon recovered and container removed' \
                    -e '[docker-sandbox] Docker daemon recovery did not prove container removal' \
                | tail -n 240 \
                || true
            )"
            recent_recovery_lower="$(printf '%s' "$recent_recovery_block" | tr '[:upper:]' '[:lower:]')"
            signals=''
            for signal in \
              provision_completed heartbeat_grace heartbeat_disconnected \
              terminal_database restart_enqueued disconnected_recovery \
              delete_started delete_completed delete_failed credential_revocation \
              docker_recovery_started docker_recovery_completed docker_recovery_failed; do
              case "$signal:$lower" in
                provision_completed:*'agent_provision completed'*) matched=true ;;
                heartbeat_grace:*'heartbeat miss within grace window'*) matched=true ;;
                heartbeat_disconnected:*'heartbeat failed past grace window, marking disconnected'*) matched=true ;;
                terminal_database:*'terminal database liveness'*) matched=true ;;
                restart_enqueued:*'enqueued restart for terminal database liveness failure'*) matched=true ;;
                disconnected_recovery:*'disconnected recovery failed'*) matched=true ;;
                delete_started:*'executing agent_delete'*|*'deleting agent'*) matched=true ;;
                delete_completed:*'agent_delete completed'*) matched=true ;;
                delete_failed:*'marked sandbox as deletion_failed'*|*'unknown agent_delete failure'*) matched=true ;;
                credential_revocation:*'inference revocation'*|*'revokeforagent'*) matched=true ;;
                docker_recovery_started:*'docker teardown failed twice; probing daemon recovery'*) matched=true ;;
                docker_recovery_completed:*'docker daemon recovered and container removed'*) matched=true ;;
                docker_recovery_failed:*'docker daemon recovery did not prove container removal'*) matched=true ;;
                *) matched=false ;;
              esac
              if [ "$matched" = true ]; then
                signals="${signals:+$signals,}$signal"
              fi
            done
            case "$lower" in
              *'terminal database liveness'*) heartbeat_category='database_terminal' ;;
              *'containerruntimefailurekind'*'oom_killed'*) heartbeat_category='container_oom_killed' ;;
              *'containerruntimefailurekind'*'module_resolution'*) heartbeat_category='container_module_resolution' ;;
              *'containerruntimefailurekind'*'heap_oom'*) heartbeat_category='container_heap_oom' ;;
              *'containerruntimefailurekind'*'startup_failed'*) heartbeat_category='container_startup_failed' ;;
              *'containerruntimefailurekind'*'terminal_database'*) heartbeat_category='container_database_terminal' ;;
              *'containerruntimefailurekind'*'memory_watchdog_restart'*) heartbeat_category='container_memory_watchdog_restart' ;;
              *'containerruntimefailurekind'*'port_conflict'*) heartbeat_category='container_port_conflict' ;;
              *'containerruntimefailurekind'*'mesh_auth'*) heartbeat_category='container_mesh_auth' ;;
              *'containerruntimefailurekind'*'restarting'*) heartbeat_category='container_restarting' ;;
              *'containerruntimefailurekind'*'exited_nonzero'*) heartbeat_category='container_exited_nonzero' ;;
              *'containerruntimefailurekind'*'exited_zero'*) heartbeat_category='container_exited_zero' ;;
              *'containerruntimefailurekind'*'unhealthy'*) heartbeat_category='container_unhealthy' ;;
              *'containerruntimefailurekind'*'starting'*) heartbeat_category='container_starting' ;;
              *'containerruntimefailurekind'*'not_running'*) heartbeat_category='container_not_running' ;;
              *'containerruntimefailurekind'*'inspect_unavailable'*) heartbeat_category='container_inspect_unavailable' ;;
              *'reconcileoutcome'*'container-dead'*) heartbeat_category='container_dead' ;;
              *'reconcileoutcome'*'ip-unresolvable'*) heartbeat_category='tailnet_ip_unresolvable' ;;
              *'reconcileoutcome'*'unrepairable'*) heartbeat_category='tailnet_unrepairable' ;;
              *'api/health returned '*) heartbeat_category='health_http_status' ;;
              *'connection refused'*|*'econnrefused'*) heartbeat_category='connection_refused' ;;
              *'no route to host'*|*'network is unreachable'*) heartbeat_category='tailnet_route_unreachable' ;;
              *'timed out'*|*'timeout'*) heartbeat_category='timeout' ;;
              *'fetch failed'*) heartbeat_category='fetch_transport' ;;
              *) heartbeat_category='unclassified' ;;
            esac
            case "$lower" in
              *'inference revocation boundary is unavailable'*) delete_category='inference_revocation_unavailable' ;;
              *'inference revocation durable object binding is missing'*) delete_category='inference_revocation_binding_missing' ;;
              *'refusing to delete without a current backup'*) delete_category='pre_delete_capture_refused' ;;
              *'[docker-ssh] command timed out'*) delete_category='docker_command_timeout' ;;
              *'[docker-ssh] connection to '*'timed out'*) delete_category='docker_connect_timeout' ;;
              *'[docker-ssh] connection error'*) delete_category='docker_connection_error' ;;
              *'not found in memory or db. cannot resolve target node'*) delete_category='teardown_locator_unresolved' ;;
              *'missing persisted docker node metadata'*) delete_category='teardown_node_metadata_missing' ;;
              *'docker node '*' is missing hostname'*) delete_category='teardown_node_hostname_missing' ;;
              *'missing port data for'*) delete_category='teardown_runtime_ports_missing' ;;
              *'stopfailurekind'*)
                case "$lower" in
                  *'stopfailurekind'*'teardown_locator_unresolved'*) delete_category='teardown_locator_unresolved' ;;
                  *'stopfailurekind'*'teardown_node_metadata_missing'*) delete_category='teardown_node_metadata_missing' ;;
                  *'stopfailurekind'*'teardown_node_hostname_missing'*) delete_category='teardown_node_hostname_missing' ;;
                  *'stopfailurekind'*'ssh_authentication'*) delete_category='ssh_authentication' ;;
                  *'stopfailurekind'*'ssh_transport'*) delete_category='ssh_transport' ;;
                  *'stopfailurekind'*'remote_command_timeout'*) delete_category='remote_command_timeout' ;;
                  *'stopfailurekind'*'docker_daemon'*) delete_category='docker_daemon' ;;
                  *'stopfailurekind'*'docker_stop_pair_failed'*) delete_category='docker_stop_pair_failed' ;;
                  *'stopfailurekind'*'provider_initialization'*) delete_category='provider_initialization' ;;
                  *) delete_category='unclassified_stop_failure' ;;
                esac
                ;;
              *'failed to stop container'*) delete_category='docker_stop_pair_failed' ;;
              *'failed to delete sandbox'*) delete_category='sandbox_stop_failed' ;;
              *'value.toisostring is not a function'*) delete_category='timestamp_shape_invalid' ;;
              *'still owns backup catalog v2 authority'*) delete_category='backup_catalog_authority_retained' ;;
              *'reviewed restore authority is fenced for agent'*) delete_category='reviewed_restore_authority_fenced' ;;
              *'failed query: delete from "agent_sandboxes"'*) delete_category='sandbox_row_delete_query_failed' ;;
              *'failed query: update "api_keys"'*) delete_category='credential_revocation_query_failed' ;;
              *'deadlock detected'*) delete_category='database_deadlock' ;;
              *'could not serialize access'*) delete_category='database_serialization' ;;
              *'connection terminated'*|*'connection closed'*) delete_category='database_connection_lost' ;;
              *'agent deletion ownership changed'*|*'agent row delete lost its lifecycle ownership'*) delete_category='database_ownership_lost' ;;
              *'marked sandbox as deletion_failed'*) delete_category='permanent_failure_unclassified' ;;
              *) delete_category='none' ;;
            esac
            case "$lower" in
              *'docker daemon recovered and container removed'*) docker_recovery='completed' ;;
              *'docker daemon recovery did not prove container removal'*) docker_recovery='failed' ;;
              *'docker teardown failed twice; probing daemon recovery'*) docker_recovery='started' ;;
              *) docker_recovery='not_attempted' ;;
            esac
            recent_recovery_started_count="$(printf '%s\n' "$recent_recovery_lower" | grep -Fc 'docker teardown failed twice; probing daemon recovery' || true)"
            recent_recovery_completed_count="$(printf '%s\n' "$recent_recovery_lower" | grep -Fc 'docker daemon recovered and container removed' || true)"
            recent_recovery_failed_count="$(printf '%s\n' "$recent_recovery_lower" | grep -Fc 'docker daemon recovery did not prove container removal' || true)"
            recent_recovery_decision_count="$(printf '%s\n' "$recent_recovery_lower" | grep -Fc 'docker teardown recovery decision' || true)"
            case "$recent_recovery_lower" in
              *'recoverystage'*'live_restore_proof'*) docker_recovery_stage='live_restore_proof' ;;
              *'recoverystage'*'docker_info_probe'*) docker_recovery_stage='docker_info_probe' ;;
              *'recoverystage'*'docker_force_stop'*) docker_recovery_stage='docker_force_stop' ;;
              *'recoverystage'*'docker_start'*) docker_recovery_stage='docker_start' ;;
              *'recoverystage'*'docker_info'*) docker_recovery_stage='docker_info' ;;
              *'recoverystage'*'exact_container_remove'*) docker_recovery_stage='exact_container_remove' ;;
              *) docker_recovery_stage='none' ;;
            esac
            self_heal_enabled=false
            if printf 'true' | sudo node \
              /usr/local/lib/eliza-admin/systemd-environment-line.mjs \
              equals \
              /opt/eliza/cloud/.env.local \
              CONTAINERS_PREPULL_SELF_HEAL_RESTART >/dev/null 2>&1; then
              self_heal_enabled=true
            fi
            teardown_resolution_started=false
            teardown_target_resolved=false
            teardown_sandbox_authority_resolved=false
            teardown_node_authority_resolved=false
            teardown_absence_probe_unavailable=false
            teardown_stop_failed=false
            teardown_remove_failed=false
            case "$lower" in *'[agent-sandbox] deleting agent'*) teardown_resolution_started=true ;; esac
            case "$lower" in *'[docker-sandbox] stopping container'*) teardown_target_resolved=true ;; esac
            case "$lower" in *'teardown sandbox authority resolved'*) teardown_sandbox_authority_resolved=true ;; esac
            case "$lower" in *'teardown node authority resolved'*) teardown_node_authority_resolved=true ;; esac
            case "$lower" in *'exact pre-delete absence probe unavailable'*) teardown_absence_probe_unavailable=true ;; esac
            case "$lower" in *'[docker-sandbox] docker stop failed'*) teardown_stop_failed=true ;; esac
            case "$lower" in *'[docker-sandbox] docker rm failed'*) teardown_remove_failed=true ;; esac
            unset block lower recent_recovery_block recent_recovery_lower CANARY_AGENT_ID CANARY_DELETE_JOB_ID
            echo "dedicated_lifecycle_signals=${signals:-none}"
            echo "dedicated_heartbeat_failure_category=$heartbeat_category"
            echo "dedicated_delete_failure_category=$delete_category"
            echo "dedicated_docker_recovery=$docker_recovery"
            echo "dedicated_docker_recovery_failure_stage=$docker_recovery_stage"
            echo "dedicated_recent_docker_recovery_started_count=$recent_recovery_started_count"
            echo "dedicated_recent_docker_recovery_completed_count=$recent_recovery_completed_count"
            echo "dedicated_recent_docker_recovery_failed_count=$recent_recovery_failed_count"
            echo "dedicated_recent_docker_recovery_decision_count=$recent_recovery_decision_count"
            echo "dedicated_docker_self_heal_enabled=$self_heal_enabled"
            echo "dedicated_teardown_resolution_started=$teardown_resolution_started"
            echo "dedicated_teardown_target_resolved=$teardown_target_resolved"
            echo "dedicated_teardown_sandbox_authority_resolved=$teardown_sandbox_authority_resolved"
            echo "dedicated_teardown_node_authority_resolved=$teardown_node_authority_resolved"
            echo "dedicated_teardown_absence_probe_unavailable=$teardown_absence_probe_unavailable"
            echo "dedicated_teardown_stop_failed=$teardown_stop_failed"
            echo "dedicated_teardown_remove_failed=$teardown_remove_failed"

      - name: Upload privacy-safe provision diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-dedicated-provision-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/managed-dedicated-provision-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize classified provision result
        shell: bash
        run: |
          set -euo pipefail
          bun -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(
              readFileSync(process.env.CANARY_DIAGNOSTIC_EVIDENCE_PATH, "utf8"),
            );
            const job = evidence.provisionJob;
            console.log("### Managed dedicated provision diagnostic");
            console.log("");
            console.log("- exact target count: `" + evidence.targetCount + "`");
            console.log("- sandbox status: `" + evidence.sandbox.status + "`");
            console.log("- database status: `" + evidence.sandbox.databaseStatus + "`");
            console.log("- sandbox error class: `" + evidence.sandbox.errorCode + "`");
            console.log("- provision job status: `" + job.status + "`");
            console.log("- provision job error class: `" + job.errorCode + "`");
            console.log("- persisted result class: `" + job.resultErrorCode + "`");
            console.log("- attempts: `" + job.attempts + "/" + job.maxAttempts + "`");
            console.log("- retryable requeues: `" + job.retryableRequeues + "`");
            console.log("- execution interruptions: `" + job.executionInterruptions + "`");
            console.log("- replacement intent present: `" + evidence.sandbox.replacementLocator.attemptIdPresent + "`");
            console.log("- replacement Docker id present: `" + evidence.sandbox.replacementLocator.containerIdPresent + "`");
            console.log("- replacement VPN id present: `" + evidence.sandbox.replacementLocator.vpnNodeIdPresent + "`");
          ' >> "$GITHUB_STEP_SUMMARY"

  shared-staging-onboarding:
    name: Shared staging onboarding
    needs: smoke
    if: ${{ always() && inputs.diagnose_canary_suffix == '' && !inputs.cleanup_only && (inputs.suite == 'all' || inputs.suite == 'cloud') }}
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      # The runner contract uses ELIZAOS_CLOUD_API_KEY; ELIZACLOUD_API_KEY is
      # the repository's established staging smoke credential.
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY || secrets.ELIZACLOUD_API_KEY }}
      CLOUD_SHARED_STAGING_SMOKE_EVIDENCE_PATH: reports/live-smoke/shared-staging-onboarding.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          node-version: "24.15.0"
          install-command: bun install --frozen-lockfile --ignore-scripts
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Require isolated staging credential
        shell: bash
        run: |
          set -euo pipefail
          key_without_whitespace="${ELIZAOS_CLOUD_API_KEY:-}"
          key_without_whitespace="${key_without_whitespace//[[:space:]]/}"
          if [[ -z "$key_without_whitespace" ]]; then
            echo "::error::Shared staging onboarding requires ELIZAOS_CLOUD_API_KEY or ELIZACLOUD_API_KEY; refusing a green skip."
            exit 1
          fi
          unset key_without_whitespace

      - name: Run shared staging onboarding smoke
        id: shared_live
        run: bun run cloud:shared-onboarding:live

      - name: Upload privacy-safe shared staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-staging-onboarding
          path: reports/live-smoke/shared-staging-onboarding.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce shared live proof, deployed SHA, and cleanup
        if: ${{ always() }}
        env:
          LIVE_PROCESS_OUTCOME: ${{ steps.shared_live.outcome }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$CLOUD_SHARED_STAGING_SMOKE_EVIDENCE_PATH"
          if [[ ! -s "$evidence_path" ]]; then
            echo "::error::Shared staging smoke produced no evidence."
            exit 1
          fi

          deployed_commit="$(
            bun -e '
              import { readFileSync } from "node:fs";
              const evidence = JSON.parse(readFileSync(process.env.CLOUD_SHARED_STAGING_SMOKE_EVIDENCE_PATH, "utf8"));
              if (
                evidence.verdict !== "pass" ||
                evidence.cleanup?.status !== "passed" ||
                evidence.cleanup?.possibleOrphan !== false ||
                typeof evidence.deployedCommit !== "string" ||
                !/^[a-f0-9]{40}$/.test(evidence.deployedCommit)
              ) {
                console.error("::error::Shared staging evidence did not prove pass + exact cleanup.");
                process.exit(1);
              }
              process.stdout.write(evidence.deployedCommit);
            '
          )"

          if [[ "${LIVE_PROCESS_OUTCOME:-missing}" != "success" ]]; then
            echo "::error::Shared staging smoke process did not succeed."
            exit 1
          fi
          if ! git cat-file -e "${deployed_commit}^{commit}" 2>/dev/null; then
            echo "::error::Staging reported a deploy commit absent from this repository checkout."
            exit 1
          fi
          expected_source_sha="${EXPECTED_SOURCE_SHA:-}"
          if [[ -z "$expected_source_sha" ]] || ! git cat-file -e "${expected_source_sha}^{commit}" 2>/dev/null; then
            echo "::error::Expected shared-smoke source commit is absent from this checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$expected_source_sha" "$deployed_commit"; then
            echo "::error::Staging deploy does not contain this shared-smoke source commit."
            exit 1
          fi
