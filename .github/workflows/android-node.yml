name: Android Node runtime

on:
  pull_request:
    branches: [develop, staging, main]
    paths: [.github/workflows/android-node-build.yml, .github/patches/node-26.13.1-android-host.patch]
  push:
    branches: [develop, staging, main]
    paths: [.github/workflows/android-node-build.yml, .github/patches/node-26.13.1-android-host.patch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-node-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    uses: ./.github/workflows/android-node-build.yml
    with:
      publish-compiler-cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
