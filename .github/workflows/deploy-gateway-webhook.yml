name: Deploy Gateway Webhook

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  authorize-target:
    name: Authorize gateway webhook (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # Approval completes outside the shared mutation lock so a waiting review
    # cannot block Cloudflare releases or edge rollback.
    environment: ${{ inputs.environment }}
    steps:
      - name: Record protected-environment authorization
        run: echo "${{ inputs.environment }} gateway release authorized"

  deploy:
    name: Deploy gateway webhook (${{ inputs.environment }})
    needs: authorize-target
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    # The active deployment receipt is consumed by the edge cutover, so both
    # mutations and the canonical Cloudflare release use one critical section.
    concurrency:
      group: cloud-cf-release-v6-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_BRANCH: ${{ inputs.environment == 'production' && 'main' || 'staging' }}
      EXPECTED_SERVICE_NAME: ${{ inputs.environment == 'production' && 'eliza-gateway-webhook-production' || 'eliza-gateway-webhook-staging' }}
      EXPECTED_CLOUD_URL: ${{ inputs.environment == 'production' && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
      EXPECTED_ROUTER_ORIGIN: ${{ inputs.environment == 'production' && 'eliza-production-1.eliza.app' || 'eliza-staging-1.eliza.app' }}
      EXPECTED_AGENT_BASE_DOMAIN: ${{ inputs.environment == 'production' && 'cloud.eliza.app' || 'cloud-staging.eliza.app' }}
      EXPECTED_GATEWAY_URL: ${{ inputs.environment == 'production' && 'https://eliza-gateway-webhook-production.square-rain-7251.workers.dev' || 'https://eliza-gateway-webhook-staging.square-rain-7251.workers.dev' }}
      GATEWAY_WEBHOOK_URL: ${{ vars.ELIZA_APP_WEBHOOK_GATEWAY_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Use a gateway-scoped credential without replacing shared release access.
      CLOUDFLARE_API_TOKEN: ${{ secrets.GATEWAY_WEBHOOK_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      GATEWAY_RUNTIME_CONFIG: ${{ secrets.GATEWAY_WEBHOOK_RUNTIME_CONFIG }}
      GATEWAY_WEBHOOK_BOOTSTRAP_SECRET: ${{ secrets.GATEWAY_WEBHOOK_BOOTSTRAP_SECRET }}
      ELIZA_APP_WEBHOOK_GATEWAY_SECRET: ${{ secrets.ELIZA_APP_WEBHOOK_GATEWAY_SECRET }}
      CLOUDFLARE_GATEWAY_ACTIVE: ${{ vars.GATEWAY_WEBHOOK_CLOUDFLARE_ACTIVE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.15.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Resolve protected Telegram public identity
        env:
          STAGING_TELEGRAM_BOT_ID: ${{ vars.VITE_TELEGRAM_BOT_ID }}
          STAGING_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
        run: |
          set -euo pipefail

          fail() {
            printf '%s\n' "::error::$1" >&2
            exit 1
          }
          valid_bot_id() {
            local candidate="$1"
            [[ "$candidate" =~ ^[1-9][0-9]{0,15}$ ]] || return 1
            (( 10#$candidate <= 4503599627370495 ))
          }

          canonical_source="packages/cloud/shared/src/lib/public-telegram-identity.ts"
          canonical_bot_id="$(sed -nE 's/^export const ELIZA_TELEGRAM_BOT_ID = "([^"]+)";$/\1/p' "$canonical_source")"
          canonical_bot_username="$(sed -nE 's/^export const ELIZA_TELEGRAM_BOT_USERNAME = "([^"]+)";$/\1/p' "$canonical_source")"
          valid_bot_id "$canonical_bot_id" || fail "The cloud canonical Telegram bot ID is missing or invalid"
          [[ "$canonical_bot_username" =~ ^[A-Za-z0-9_]{5,32}$ ]] || fail "The cloud canonical Telegram username is missing or invalid"
          canonical_username_key="$(printf '%s' "$canonical_bot_username" | tr '[:upper:]' '[:lower:]')"
          [[ "$canonical_username_key" == *bot ]] || fail "The cloud canonical Telegram username must use the managed bot suffix"

          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            resolved_id="$canonical_bot_id"
            resolved_username="$canonical_bot_username"
          else
            valid_bot_id "$STAGING_TELEGRAM_BOT_ID" || fail "Protected staging VITE_TELEGRAM_BOT_ID is missing or invalid"
            [[ "$STAGING_TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z0-9_]{5,32}$ ]] || fail "Protected staging VITE_TELEGRAM_BOT_USERNAME is missing or invalid"
            staging_username_key="$(printf '%s' "$STAGING_TELEGRAM_BOT_USERNAME" | tr '[:upper:]' '[:lower:]')"
            [[ "$staging_username_key" == *bot ]] || fail "Protected staging Telegram username must use the managed bot suffix"
            if [ "$STAGING_TELEGRAM_BOT_ID" = "$canonical_bot_id" ] || \
              [ "$staging_username_key" = "$canonical_username_key" ]; then
              fail "Staging Telegram identity must be fully distinct from production"
            fi
            resolved_id="$STAGING_TELEGRAM_BOT_ID"
            resolved_username="$STAGING_TELEGRAM_BOT_USERNAME"
          fi

          printf 'TELEGRAM_EXPECTED_BOT_ID=%s\n' "$resolved_id" >> "$GITHUB_ENV"
          printf 'TELEGRAM_EXPECTED_BOT_USERNAME=%s\n' "$resolved_username" >> "$GITHUB_ENV"
          echo "Resolved the protected $TARGET_ENVIRONMENT Telegram identity without printing its values."

      - name: Validate protected canonical configuration
        shell: bash
        run: |
          set -euo pipefail

          required_settings=(
            TARGET_ENVIRONMENT
            DEPLOY_BRANCH
            EXPECTED_SERVICE_NAME
            EXPECTED_CLOUD_URL
            EXPECTED_ROUTER_ORIGIN
            EXPECTED_AGENT_BASE_DOMAIN
            EXPECTED_GATEWAY_URL
            GATEWAY_WEBHOOK_URL
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            GATEWAY_RUNTIME_CONFIG
            CLOUDFLARE_GATEWAY_ACTIVE
            TELEGRAM_EXPECTED_BOT_ID
            TELEGRAM_EXPECTED_BOT_USERNAME
          )
          missing=()
          for name in "${required_settings[@]}"; do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required gateway-webhook setting name(s) on the protected $TARGET_ENVIRONMENT environment: ${missing[*]}"
            exit 1
          fi

          case "$TARGET_ENVIRONMENT" in
            staging | production) ;;
            *)
              echo "::error::Unsupported protected environment"
              exit 1
              ;;
          esac

          require_exact() {
            local name="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$name does not match the canonical $TARGET_ENVIRONMENT gateway-webhook contract"
              exit 1
            fi
          }

          require_exact GITHUB_REF "$GITHUB_REF" "refs/heads/$DEPLOY_BRANCH"
          require_exact GATEWAY_WEBHOOK_URL "$GATEWAY_WEBHOOK_URL" "$EXPECTED_GATEWAY_URL"
          require_exact CHECKED_OUT_SHA "$(git rev-parse HEAD)" "$GITHUB_SHA"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::The checkout is not an exact clean source tree"
            exit 1
          fi

          require_exact CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID" "23cf6feaeaa541f6a0675053c33da768"
          require_exact CLOUDFLARE_GATEWAY_ACTIVE "$CLOUDFLARE_GATEWAY_ACTIVE" "true"
          echo "Protected target and completed Cloudflare ownership handoff verified."

      - name: Install gateway host dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter '@elizaos/gateway-container'

      - name: Check Blooio environment isolation
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          ELIZA_APP_BLOOIO_PHONE_NUMBER: ${{ secrets.ELIZA_APP_BLOOIO_PHONE_NUMBER }}
        run: node packages/cloud/scripts/verify-blooio-environment-isolation.ts

      - name: Verify protected runtime settings and credential equality
        shell: bash
        env:
          # The Cloudflare Worker receives these exact GitHub Environment
          # secrets from cloud-cf-release.yml. Comparing them here is the only
          # place both sides of the Blooio webhook contract are observable, so
          # a Worker/gateway value divergence is caught before deploy instead
          # of as a 401 on every live webhook.
          WORKER_ELIZA_APP_BLOOIO_API_KEY: ${{ secrets.ELIZA_APP_BLOOIO_API_KEY }}
          WORKER_ELIZA_APP_BLOOIO_PHONE_NUMBER: ${{ secrets.ELIZA_APP_BLOOIO_PHONE_NUMBER }}
          WORKER_ELIZA_APP_BLOOIO_WEBHOOK_SECRET: ${{ secrets.ELIZA_APP_BLOOIO_WEBHOOK_SECRET }}
          WORKER_ELIZA_APP_TELEGRAM_BOT_TOKEN: ${{ secrets.ELIZA_APP_TELEGRAM_BOT_TOKEN }}
          WORKER_ELIZA_APP_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.ELIZA_APP_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          variables_raw_path="$RUNNER_TEMP/gateway-webhook-runtime-variables-raw.json"
          variables_path="$RUNNER_TEMP/gateway-webhook-runtime-variable-inventory.json"
          printf '%s' "$GATEWAY_RUNTIME_CONFIG" > "$variables_raw_path"
          jq -e 'type == "object" and all(.[]; type == "string")' "$variables_raw_path" >/dev/null
          jq '{
            canonical: {
              ELIZA_CLOUD_URL: .ELIZA_CLOUD_URL,
              AGENT_ROUTER_ORIGIN_HOST: .AGENT_ROUTER_ORIGIN_HOST,
              ELIZA_CLOUD_AGENT_BASE_DOMAIN: .ELIZA_CLOUD_AGENT_BASE_DOMAIN,
              ELIZA_APP_TELEGRAM_BOT_ID: .ELIZA_APP_TELEGRAM_BOT_ID,
              ELIZA_APP_TELEGRAM_BOT_USERNAME: .ELIZA_APP_TELEGRAM_BOT_USERNAME
            },
            blooio_nonblank_names: [
              to_entries[] |
              select(.key == "ELIZA_APP_BLOOIO_API_KEY" or
                     .key == "ELIZA_APP_BLOOIO_PHONE_NUMBER" or
                     .key == "ELIZA_APP_BLOOIO_WEBHOOK_SECRET") |
              select((.value | type) == "string" and (.value | test("\\S"))) |
              .key
            ],
            telegram_nonblank_names: [
              to_entries[] |
              select(.key == "ELIZA_APP_TELEGRAM_BOT_TOKEN" or
                     .key == "ELIZA_APP_TELEGRAM_WEBHOOK_SECRET") |
              select((.value | type) == "string" and (.value | test("\\S"))) |
              .key
            ],
            nonblank_sensitive_names: [
              to_entries[] |
              select(.value | type == "string" and length > 0) |
              .key
            ]
          }' "$variables_raw_path" > "$variables_path"

          # A per-run salt makes every digest useless outside this process, so
          # an equality proof never becomes an offline guessing oracle even if
          # a digest were to escape into a log.
          protected_match_salt="$(openssl rand -hex 32)"
          protected_digest() {
            printf '%s' "${1:-}" |
              openssl dgst -sha256 -hmac "$protected_match_salt" -r |
              cut -d' ' -f1
          }
          declare -A gateway_blooio_digests=()
          for name in \
            ELIZA_APP_BLOOIO_API_KEY \
            ELIZA_APP_BLOOIO_PHONE_NUMBER \
            ELIZA_APP_BLOOIO_WEBHOOK_SECRET; do
            gateway_value="$(jq -r --arg name "$name" \
              'if (.[$name] | type) == "string" then .[$name] else "" end' \
              "$variables_raw_path")"
            gateway_blooio_digests["$name"]="$(protected_digest "$gateway_value")"
            gateway_value=""
          done

          declare -A gateway_telegram_digests=()
          for name in \
            ELIZA_APP_TELEGRAM_BOT_TOKEN \
            ELIZA_APP_TELEGRAM_WEBHOOK_SECRET; do
            gateway_value="$(jq -r --arg name "$name" \
              'if (.[$name] | type) == "string" then .[$name] else "" end' \
              "$variables_raw_path")"
            gateway_telegram_digests["$name"]="$(protected_digest "$gateway_value")"
            printf -v "gateway_$name" '%s' "$gateway_value"
            gateway_value=""
          done

          env \
            "TELEGRAM_BOT_TOKEN=${gateway_ELIZA_APP_TELEGRAM_BOT_TOKEN:-}" \
            "TELEGRAM_WEBHOOK_SECRET=${gateway_ELIZA_APP_TELEGRAM_WEBHOOK_SECRET:-}" \
            "TELEGRAM_EXPECTED_BOT_ID=$TELEGRAM_EXPECTED_BOT_ID" \
            "TELEGRAM_EXPECTED_BOT_USERNAME=$TELEGRAM_EXPECTED_BOT_USERNAME" \
            "TELEGRAM_ATTESTATION_CONTEXT=$TARGET_ENVIRONMENT" \
            node packages/cloud/scripts/verify-telegram-bot-identity.ts
          gateway_ELIZA_APP_TELEGRAM_BOT_TOKEN=""
          gateway_ELIZA_APP_TELEGRAM_WEBHOOK_SECRET=""
          shred -u "$variables_raw_path"

          require_exact_variable() {
            local name="$1"
            local expected="$2"
            if ! jq -e --arg name "$name" --arg expected "$expected" \
              '.canonical[$name] == $expected' "$variables_path" >/dev/null; then
              echo "::error::$name does not match the canonical $TARGET_ENVIRONMENT gateway value"
              exit 1
            fi
          }
          require_sensitive_name() {
            local name="$1"
            if ! jq -e --arg name "$name" \
              '.nonblank_sensitive_names | index($name) != null' \
              "$variables_path" >/dev/null; then
              echo "::error::Required sensitive gateway setting name is absent or blank: $name"
              exit 1
            fi
          }
          require_blooio_name() {
            local name="$1"
            if ! jq -e --arg name "$name" \
              '.blooio_nonblank_names | index($name) != null' \
              "$variables_path" >/dev/null; then
              echo "::error::Required protected $TARGET_ENVIRONMENT Blooio gateway setting name is absent or blank: $name"
              exit 1
            fi
          }
          require_telegram_name() {
            local name="$1"
            if ! jq -e --arg name "$name" \
              '.telegram_nonblank_names | index($name) != null' \
              "$variables_path" >/dev/null; then
              echo "::error::Required protected $TARGET_ENVIRONMENT Telegram gateway setting name is absent or blank: $name"
              exit 1
            fi
          }

          require_exact_variable ELIZA_CLOUD_URL "$EXPECTED_CLOUD_URL"
          require_exact_variable AGENT_ROUTER_ORIGIN_HOST "$EXPECTED_ROUTER_ORIGIN"
          require_exact_variable ELIZA_CLOUD_AGENT_BASE_DOMAIN "$EXPECTED_AGENT_BASE_DOMAIN"
          require_exact_variable ELIZA_APP_TELEGRAM_BOT_ID "$TELEGRAM_EXPECTED_BOT_ID"
          require_exact_variable ELIZA_APP_TELEGRAM_BOT_USERNAME "$TELEGRAM_EXPECTED_BOT_USERNAME"
          for name in \
            GATEWAY_BOOTSTRAP_SECRET \
            GATEWAY_INTERNAL_SECRET \
            AGENT_SERVER_SHARED_SECRET \
            ELIZA_APP_WEBHOOK_GATEWAY_SECRET; do
            require_sensitive_name "$name"
          done
          for name in \
            ELIZA_APP_BLOOIO_API_KEY \
            ELIZA_APP_BLOOIO_PHONE_NUMBER \
            ELIZA_APP_BLOOIO_WEBHOOK_SECRET; do
            require_blooio_name "$name"
          done
          for name in \
            ELIZA_APP_TELEGRAM_BOT_TOKEN \
            ELIZA_APP_TELEGRAM_WEBHOOK_SECRET; do
            require_telegram_name "$name"
          done
          # Name presence on both sides still permits Worker secret A and
          # gateway secret B, which passes every names-only check and then
          # 401s every live Blooio webhook. Compare salted digests so the
          # values must actually agree without either value being read,
          # printed, or written anywhere.
          for name in \
            ELIZA_APP_BLOOIO_API_KEY \
            ELIZA_APP_BLOOIO_PHONE_NUMBER \
            ELIZA_APP_BLOOIO_WEBHOOK_SECRET; do
            worker_name="WORKER_$name"
            worker_value="${!worker_name:-}"
            if [ -z "${worker_value//[[:space:]]/}" ]; then
              echo "::error::Required protected $TARGET_ENVIRONMENT Blooio GitHub environment secret is absent or blank: $name"
              exit 1
            fi
            if [ "$(protected_digest "$worker_value")" != "${gateway_blooio_digests[$name]:-}" ]; then
              echo "::error::Protected $TARGET_ENVIRONMENT Blooio value differs between the Cloudflare Worker GitHub environment secret and the gateway setting: $name (compared by salted digest; values were not printed)"
              exit 1
            fi
            worker_value=""
          done
          echo "Verified 3 protected $TARGET_ENVIRONMENT Blooio Worker/gateway value matches by salted digest; values were not printed."
          for name in \
            ELIZA_APP_TELEGRAM_BOT_TOKEN \
            ELIZA_APP_TELEGRAM_WEBHOOK_SECRET; do
            worker_name="WORKER_$name"
            worker_value="${!worker_name:-}"
            if [ -z "${worker_value//[[:space:]]/}" ]; then
              echo "::error::Required protected $TARGET_ENVIRONMENT Telegram GitHub environment secret is absent or blank: $name"
              exit 1
            fi
            if [ "$(protected_digest "$worker_value")" != "${gateway_telegram_digests[$name]:-}" ]; then
              echo "::error::Protected $TARGET_ENVIRONMENT Telegram value differs between the Cloudflare Worker GitHub environment secret and the gateway setting: $name (compared by salted digest; values were not printed)"
              exit 1
            fi
            worker_value=""
          done
          echo "Verified the protected $TARGET_ENVIRONMENT Telegram credential pair, selected identity, and getMe attestation; values were not printed."
          if ! jq -e '.nonblank_sensitive_names as $names |
            (($names | index("REDIS_URL")) != null or
             ((($names | index("KV_REST_API_URL")) != null) and
              (($names | index("KV_REST_API_TOKEN")) != null)))' \
            "$variables_path" >/dev/null; then
            echo "::error::Required sensitive gateway setting names must include REDIS_URL or the KV_REST_API_URL/KV_REST_API_TOKEN pair"
            exit 1
          fi
          echo "Canonical routing values and required sensitive variable names are present; sensitive values were not printed or changed."

      - name: Verify paired release credentials before mutation
        run: node packages/cloud/scripts/verify-cloudflare-gateway-release-config.ts --candidate-only

      - name: Deploy exact gateway source and settings to Cloudflare
        id: cloudflare_deploy
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node packages/cloud/scripts/cloudflare-gateway-deployment.ts > "$RUNNER_TEMP/gateway-before.json"
          image_tag="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$EXPECTED_SERVICE_NAME:$GITHUB_SHA"
          docker build --platform linux/amd64 \
            --build-arg "ELIZA_GATEWAY_SOURCE_SHA=$GITHUB_SHA" \
            --file packages/cloud/services/gateway-webhook/Dockerfile \
            --tag "$image_tag" .
          bunx wrangler@4.151.3 containers registries credentials registry.cloudflare.com \
            --expiration-minutes 120 --push --pull --json > "$RUNNER_TEMP/gateway-registry-credential.json"
          jq -r .password "$RUNNER_TEMP/gateway-registry-credential.json" | \
            docker login registry.cloudflare.com \
              --username "$(jq -r .username "$RUNNER_TEMP/gateway-registry-credential.json")" --password-stdin
          shred -u "$RUNNER_TEMP/gateway-registry-credential.json"
          docker push "$image_tag"
          docker buildx imagetools inspect "$image_tag" --format '{{json .Manifest}}' > "$RUNNER_TEMP/gateway-image.json"
          image_digest="$(jq -er .digest "$RUNNER_TEMP/gateway-image.json")"
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          export GATEWAY_RELEASE_IMAGE="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$EXPECTED_SERVICE_NAME@$image_digest"
          bun packages/cloud/scripts/prepare-gateway-release.ts
          bunx wrangler@4.151.3 deploy \
            --config "$RUNNER_TEMP/gateway-wrangler.json" \
            --env "webhook-$TARGET_ENVIRONMENT" \
            --var "BUILD_ID:$GITHUB_SHA" \
            --var GATEWAY_ENABLED:true \
            --secrets-file "$RUNNER_TEMP/gateway-secrets.json" \
            --containers-rollout immediate > "$RUNNER_TEMP/gateway-deploy.log"
          version_id="$(sed -nE 's/^Current Version ID: ([a-f0-9-]+)$/\1/p' "$RUNNER_TEMP/gateway-deploy.log")"
          [[ "$version_id" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          EXPECTED_GATEWAY_IMAGE="$GATEWAY_RELEASE_IMAGE" EXPECTED_GATEWAY_VERSION="$version_id" node packages/cloud/scripts/cloudflare-gateway-deployment.ts > "$RUNNER_TEMP/gateway-after.json"
          test "$(jq -r .versionId "$RUNNER_TEMP/gateway-before.json")" != "$version_id"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "image=$GATEWAY_RELEASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$(jq -r .deploymentId "$RUNNER_TEMP/gateway-after.json")" >> "$GITHUB_OUTPUT"
          shred -u "$RUNNER_TEMP/gateway-secrets.json"

      - name: Verify deployed health and canonical fallback configuration
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.cloudflare_deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          umask 077
          assert_active_deployment() {
            EXPECTED_GATEWAY_IMAGE="${{ steps.cloudflare_deploy.outputs.image }}" \
            EXPECTED_GATEWAY_DEPLOYMENT="$DEPLOYMENT_ID" \
            EXPECTED_GATEWAY_VERSION="${{ steps.cloudflare_deploy.outputs.version_id }}" \
              node packages/cloud/scripts/cloudflare-gateway-deployment.ts > /dev/null
          }

          assert_active_deployment before
          health_path="$RUNNER_TEMP/gateway-webhook-health.json"
          health_status=""
          for _ in $(seq 1 60); do
            health_status=$(curl \
              --silent \
              --show-error \
              --max-time 15 \
              --output "$health_path" \
              --write-out '%{http_code}' \
              "$GATEWAY_WEBHOOK_URL/health" || true)
            if [ "$health_status" = "200" ] && \
              jq -e --arg sha "$GITHUB_SHA" '.status == "healthy" and .buildId == $sha' "$health_path" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          if [ "$health_status" != "200" ] || \
            ! jq -e --arg sha "$GITHUB_SHA" '.status == "healthy" and .buildId == $sha' "$health_path" >/dev/null; then
            echo "::error::Canonical gateway-webhook health did not become ready"
            exit 1
          fi

          node packages/cloud/scripts/verify-cloudflare-gateway-release-config.ts

          forwarder_probe_path="$RUNNER_TEMP/gateway-webhook-forwarder-auth-readiness.json"
          if ! forwarder_probe_status=$(curl \
            --silent \
            --show-error \
            --max-time 15 \
            --output "$forwarder_probe_path" \
            --write-out '%{http_code}' \
            "$GATEWAY_WEBHOOK_URL/ready/forwarder-auth/eliza-app"); then
            echo "::error::Forwarder-auth readiness probe failed to complete"
            exit 1
          fi
          if [ "$forwarder_probe_status" != "401" ] || \
            ! jq -e \
              'type == "object" and
               keys == ["error", "project", "status"] and
               .error == "unauthorized" and
               .status == "enforced" and
               .project == "eliza-app"' \
              "$forwarder_probe_path" >/dev/null; then
            echo "::error::Gateway did not prove the exact enforced eliza-app forwarder-auth contract"
            exit 1
          fi

          telegram_probe_path="$RUNNER_TEMP/gateway-webhook-telegram-identity-readiness.json"
          if ! telegram_probe_status=$(curl \
            --silent \
            --show-error \
            --max-time 15 \
            --output "$telegram_probe_path" \
            --write-out '%{http_code}' \
            "$GATEWAY_WEBHOOK_URL/ready/telegram-identity/eliza-app"); then
            echo "::error::Telegram identity readiness probe failed to complete"
            exit 1
          fi
          if [ "$telegram_probe_status" != "200" ] || \
            ! jq -e \
              'type == "object" and
               keys == ["project", "status"] and
               .project == "eliza-app" and
               .status == "attested"' \
              "$telegram_probe_path" >/dev/null; then
            echo "::error::Gateway did not prove the selected Telegram identity"
            exit 1
          fi
          assert_active_deployment after
          echo "Exact manifest, active deployment identity, live health, canonical fallback, Telegram identity, and forwarder-auth readiness passed."

      - name: Write exact deployment receipt
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.cloudflare_deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/gateway-webhook-deployment-receipt"
          mkdir -p "$receipt_dir"
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg deploymentId "$DEPLOYMENT_ID" \
            --arg service "$EXPECTED_SERVICE_NAME" \
            --arg versionId "${{ steps.cloudflare_deploy.outputs.version_id }}" \
            --arg image "${{ steps.cloudflare_deploy.outputs.image }}" \
            '{
              sourceSha: $sourceSha,
              environment: $environment,
              deploymentId: $deploymentId,
              versionId: $versionId,
              provider: "cloudflare",
              image: $image,
              service: $service,
              telegramIdentity: "attested"
            }' > "$receipt_dir/gateway-webhook-deployment.json"

      - name: Publish exact deployment receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gateway-webhook-deployment-${{ inputs.environment }}-${{ github.sha }}
          path: ${{ runner.temp }}/gateway-webhook-deployment-receipt/gateway-webhook-deployment.json
          if-no-files-found: error
          retention-days: 30

      - name: Write deployment summary
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.cloudflare_deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          {
            echo "### Gateway webhook deployment"
            echo
            echo "- Environment: \`$TARGET_ENVIRONMENT\`"
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo "- Cloudflare deployment: \`$DEPLOYMENT_ID\`"
            echo "- Service: \`$EXPECTED_SERVICE_NAME\`"
            echo "- Canonical health: passed"
            echo "- Canonical fallback pair: verified"
            echo "- Forwarder-auth readiness: enforced for eliza-app with exact headerless 401"
            echo "- Telegram identity: attested for the selected protected environment"
            echo "- Tracked Cloudflare host and Dockerfile: deployed"
            echo "- Active deployment identity: verified before and after probes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary deployment files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in "$RUNNER_TEMP"/gateway-webhook-*.json "$RUNNER_TEMP"/gateway-secrets.json "$RUNNER_TEMP"/gateway-before.json "$RUNNER_TEMP"/gateway-after.json "$RUNNER_TEMP"/gateway-registry-credential.json "$RUNNER_TEMP"/gateway-wrangler.json; do
            if [ -f "$path" ]; then shred -u "$path"; fi
          done
