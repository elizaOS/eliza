name: Develop PR

# Pull-request gate for `develop`: lint, owning-package tests, typecheck, and
# build. Policy-only coverage floors are intentionally absent; the test job
# executes the ordinary suites of the packages that own the changed files, so
# behavioral regressions are still caught before merge while the exhaustive
# matrix stays post-merge.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: develop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  test:
    # Explicit name: the aggregate workflow contract resolves this required
    # context by its `name: test` marker.
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The owning-package selector diffs against the merge base, so the
          # full history must be available.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          install-command: bun install
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Build core
        run: bun run build:core

      # Tests run through the canonical orchestrator (run-all-tests.mjs — there
      # is deliberately no Turbo `test` task), scoped to the workspace packages
      # that own the changed files. Owning-package scope keeps this job bounded:
      # root-level or global-input changes select no package here and rely on
      # the post-merge exhaustive lane, instead of degenerating into the whole
      # 250-package suite on one hosted runner.
      - name: Run affected package tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node packages/scripts/run-turbo.mjs ls --output=json > "$RUNNER_TEMP/workspace-packages.json"
          git diff --name-only "$BASE_SHA...HEAD" > "$RUNNER_TEMP/changed-files.txt"
          dirs="$(jq -r --rawfile changed "$RUNNER_TEMP/changed-files.txt" '
            [.packages.items[].path] as $pkgs
            | ($changed | split("\n") | map(select(length > 0))) as $files
            | [ $files[]
                | . as $f
                | ($pkgs | map(select(. as $p | $f | startswith($p + "/"))) | max_by(length))
                | select(. != null) ]
            | unique
            | map(gsub("\\."; "\\\\."))
            | join("|")
          ' "$RUNNER_TEMP/workspace-packages.json")"
          if [ -z "$dirs" ]; then
            echo "No changed files belong to a workspace package; package suites are covered by the post-merge exhaustive lane."
            exit 0
          fi
          echo "Owning packages under test: ${dirs//|/, }"
          TEST_SCRIPT_FILTER='^test$' node packages/scripts/run-all-tests.mjs \
            --only=test --no-cloud --concurrency=4 \
            --filter="\\((${dirs})\\)#"

      # packages/scripts is not a workspace package, so Turbo cannot discover
      # its tests. Keep the ordinary script suite explicit without deriving a
      # pass/fail decision from changed-file coverage shape.
      - name: Run repository script tests
        run: bun test --conditions=eliza-source packages/scripts/__tests__/

      - name: Verify the proposed aggregate state machine
        run: node packages/scripts/develop-pr-aggregate.self-test.mjs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Run lint (read-only)
        run: bun run lint:check

      - name: Check formatting
        run: bun run format:check

  typecheck:
    runs-on: ubuntu-latest
    # 35 not 20: at --concurrency=4 a near-total affected cone (~250 packages)
    # needs headroom — the one green full-cone run spent 11 minutes in the
    # typecheck step alone, on top of checkout/install/build:core (#15140).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so `turbo run typecheck --affected` can resolve the PR
          # merge base (#12341); a shallow clone degrades to typechecking all.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # Typecheck resolves `@elizaos/core` types from its built dist, so build
      # core before running tsc across the affected cone.
      - name: Build core
        run: bun run build:core

      # --concurrency=4 not 8: hosted ubuntu-latest runners have 4 vCPUs and
      # 16 GB RAM, and when the affected cone goes near-total (a base-branch
      # commit touching turbo globalDependencies like root package.json /
      # turbo.json makes every stale-base PR typecheck all ~250 packages) eight
      # concurrent tsgo processes exhaust the runner — the OS SIGKILLs tasks or
      # the runner VM itself dies (#15140). NODE_OPTIONS only bounds node-based
      # tools, not native tsgo, so concurrency is the memory lever here.
      - name: Run typecheck (affected)
        run: NODE_OPTIONS='--max-old-space-size=8192' node packages/scripts/run-turbo.mjs run typecheck --concurrency=4 --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Build packages
        run: bun run build:core
