name: Develop PR

# Reusable lightweight gate for pull requests targeting `develop`: lint,
# typecheck, build, and the unit suites owned by changed plugin packages. The
# canonical CI workflow calls this gate so outside contributions create one
# approval boundary instead of a second approval-gated workflow run.
# `main` PRs retain the heavy gates through `ci.yaml`, `test.yml`'s peers, and
# `quality.yml`. Steps mirror their post-merge counterparts where applicable.

on:
  workflow_call:

concurrency:
  group: develop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Validate CI Bun version pin contract
        run: node packages/scripts/ci-bun-version-contract.mjs --inventory "$RUNNER_TEMP/bun-runtime-inventory.json"

      - name: Upload Bun runtime resolution inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-runtime-inventory
          path: ${{ runner.temp }}/bun-runtime-inventory.json
          retention-days: 30

      - name: Run lint (read-only)
        run: bun run lint:check

      - name: Check formatting
        run: bun run format:check

      - name: Install pinned workflow linters
        run: .github/scripts/install-workflow-linters.sh "$RUNNER_TEMP/workflow-linters"

      - name: Run actionlint on merge-critical workflows
        run: >-
          "$RUNNER_TEMP/workflow-linters/actionlint"
          -config-file .github/actionlint.yaml
          .github/workflows/claude-ci-autoheal.yml
          .github/workflows/ci-develop-push.yml
          .github/workflows/ci.yml
          .github/workflows/develop-pr.yml
          .github/workflows/cloud-tests.yml
          .github/workflows/gitleaks.yml
          .github/workflows/test.yml

  typecheck:
    runs-on: ubuntu-latest
    # 35 not 20: at --concurrency=4 a near-total affected cone (~250 packages)
    # needs headroom — the one green full-cone run spent 11 minutes in the
    # typecheck step alone, on top of checkout/install/build:core (#15140).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so `turbo run typecheck --affected` can resolve the PR
          # merge base (#12341); a shallow clone degrades to typechecking all.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # Typecheck resolves `@elizaos/core` types from its built dist, so build
      # core before running tsc across the affected cone.
      - name: Build core
        run: bun run build:core

      # --concurrency=4 not 8: hosted ubuntu-latest runners have 4 vCPUs and
      # 16 GB RAM, and when the affected cone goes near-total (a base-branch
      # commit touching turbo globalDependencies like root package.json /
      # turbo.json makes every stale-base PR typecheck all ~250 packages) eight
      # concurrent tsgo processes exhaust the runner — the OS SIGKILLs tasks or
      # the runner VM itself dies (#15140). NODE_OPTIONS only bounds node-based
      # tools, not native tsgo, so concurrency is the memory lever here.
      - name: Run typecheck (affected)
        run: NODE_OPTIONS='--max-old-space-size=8192' node packages/scripts/run-turbo.mjs run typecheck --concurrency=4 --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Build packages
        run: bun run build:core

  # Plugin specs did not run pre-merge for `develop` PRs: `test.yml` has no
  # `pull_request` trigger, and `windows-ci.yml`'s PR trigger is scoped to
  # `main` — so a regression only a plugin spec can catch was discovered after
  # merge (#17550). This job closes that gap on the develop PR gate only; it
  # does not touch post-merge coverage in `test.yml`, and it does not duplicate
  # the Windows lane, which owns `plugin-app-control` on Windows specifically.
  #
  # Scoped to plugin packages the PR actually changes: the full plugin sweep is
  # a sharded post-merge lane and is far too slow for a per-PR gate.
  plugin-tests:
    name: plugin-tests
    runs-on: ubuntu-latest
    # Rust-backed plugin suites can compile their native test harness on a cold
    # hosted runner. The cache keeps normal runs short; the cap prevents a
    # changed plugin from consuming an unbounded gate slot.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the changed-package diff can resolve the PR base;
          # a shallow clone cannot see the merge base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # Both sides of a rename are treated as changes so moving a file between
      # plugins cannot leave the source package's tests out of the gate.
      # Direct plugin workspaces are the only plugin shape declared by the root
      # workspace manifest; nested package.json files are implementation data.
      - name: Resolve changed plugin packages
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          selected=()
          changed_paths_file=$(mktemp)
          sorted_packages_file=$(mktemp)
          trap 'rm -f "$changed_paths_file" "$sorted_packages_file"' EXIT
          git diff --no-renames --name-only -z "$BASE_SHA"...HEAD -- plugins > "$changed_paths_file"
          while IFS= read -r -d '' changed_path; do
            relative="${changed_path#plugins/}"
            # Top-level build files and plugins/__tests__ are repository-level
            # plugin contracts rather than package workspaces; the script lane
            # owns them. Nested unknown directories still fail closed below.
            if [[ "$relative" != */* ]]; then
              continue
            fi
            case "$relative" in
              __tests__/*) continue ;;
            esac
            pkg="$relative"
            pkg="${pkg%%/*}"
            # A full package deletion has no current manifest or tests to run.
            # This also permits cleanup of pre-convention legacy package names;
            # malformed nested roots that still exist remain a hard failure.
            if [ ! -e "plugins/$pkg" ]; then
              continue
            fi
            if [[ ! "$pkg" =~ ^plugin-[a-z0-9-]+$ ]]; then
              echo "Unsupported plugin workspace path: $changed_path" >&2
              exit 1
            fi
            manifest="plugins/$pkg/package.json"
            if [ -f "$manifest" ] && node -e '
              const { readFileSync } = require("node:fs");
              const manifest = JSON.parse(readFileSync(process.argv[1], "utf8"));
              process.exit(typeof manifest.scripts?.test === "string" ? 0 : 1);
            ' "$manifest"; then
              selected+=("$pkg")
            fi
          done < "$changed_paths_file"

          if [ "${#selected[@]}" -gt 0 ]; then
            printf '%s\n' "${selected[@]}" | sort -u > "$sorted_packages_file"
            selected=()
            while IFS= read -r pkg; do
              selected+=("$pkg")
            done < "$sorted_packages_file"
          fi

          if [ "${#selected[@]}" -eq 0 ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No changed plugin package has a test script; nothing to gate."
          else
            joined=$(IFS='|'; echo "${selected[*]}")
            echo "filter=\\(plugins/($joined)\\)" >> "$GITHUB_OUTPUT"
            echo "count=${#selected[@]}" >> "$GITHUB_OUTPUT"
            echo "Gating ${#selected[@]} plugin package(s): $joined"
          fi

      - name: Cache cargo registry and shared target dir
        if: steps.changed.outputs.filter != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cargo-shared-target
          key: ${{ runner.os }}-cargo-develop-plugin-tests-${{ hashFiles('plugins/*/rust/Cargo.lock', 'plugins/*/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-develop-plugin-tests-

      # The post-merge plugin lane builds the core dependency graph and view
      # bundles before invoking package-owned test scripts. Matching those
      # prerequisites prevents a clean hosted runner from failing on absent
      # generated artifacts instead of the changed plugin's behavior.
      - name: Run unit tests for changed plugins
        if: steps.changed.outputs.filter != ''
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-shared-target
          TEST_PACKAGE_FILTER: ${{ steps.changed.outputs.filter }}
          TEST_SCRIPT_FILTER: "^test$"
        run: |
          bun run build:core
          bun run build:views
          # This step only runs when at least one changed plugin was selected,
          # so --require-work (fail when the lane matches zero runnable tasks)
          # carries the retired minimum-task vacuous-green guard under the
          # runner's surviving flag surface; unknown flags exit 2 before any
          # test runs.
          node packages/scripts/run-all-tests.mjs --only=test --no-cloud --concurrency=3 --require-work
