name: Develop PR

# Lightweight gate for pull requests targeting `develop`: lint, typecheck, and
# build only. The full test/e2e/scenario/benchmark surface runs post-merge on
# push to `develop` (and nightly/on-demand), not on every PR — so PR feedback
# stays fast and hosted-runner capacity is spent on the ~200 daily PRs' fast
# signal rather than the whole integration matrix. `main` PRs keep the heavy
# gates via `ci.yaml`, `test.yml`'s peers, and `quality.yml`. Steps mirror
# `ci.yaml` so PR and post-merge lanes stay in agreement.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: develop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Run lint (read-only)
        run: bun run lint:check

      - name: Check formatting
        run: bun run format:check

      # Also present in quality.yml, which only runs on PRs to `main` and on
      # post-merge pushes — so a change to this bundle reached develop with the
      # smoke never having executed anywhere. It settles every claim through
      # the REAL prune tool (effective flags, unknown-flag rejection, an actual
      # stale-vs-fresh reclaim, and a two-orphan sweep), which is exactly the
      # class of defect a string-compare version let ship before (#15398).
      - name: Run runner-workspace cleanup smoke
        run: ./packages/deploy/runner-workspace-cleanup/smoke-test.sh

      - name: Validate merge-critical workflow invariants
        run: node packages/scripts/ci-workflow-invariants.mjs

      - name: Install pinned workflow linters
        run: .github/scripts/install-workflow-linters.sh "$RUNNER_TEMP/workflow-linters"

      - name: Run actionlint on merge-critical workflows
        run: >-
          "$RUNNER_TEMP/workflow-linters/actionlint"
          -config-file .github/actionlint.yaml
          .github/workflows/develop-pr.yml
          .github/workflows/develop-pr-gate.yml
          .github/workflows/cloud-tests.yml
          .github/workflows/gitleaks.yml
          .github/workflows/local-inference-matrix.yml
          .github/workflows/stale-base-guard.yml
          .github/workflows/test.yml

      - name: Run zizmor on base-trusted workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          "$RUNNER_TEMP/workflow-linters/zizmor"
          --offline
          .github/workflows/develop-pr-gate.yml
          .github/workflows/stale-base-guard.yml

  typecheck:
    runs-on: ubuntu-latest
    # 35 not 20: at --concurrency=4 a near-total affected cone (~250 packages)
    # needs headroom — the one green full-cone run spent 11 minutes in the
    # typecheck step alone, on top of checkout/install/build:core (#15140).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so `turbo run typecheck --affected` can resolve the PR
          # merge base (#12341); a shallow clone degrades to typechecking all.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # Typecheck resolves `@elizaos/core` types from its built dist, so build
      # core before running tsc across the affected cone.
      - name: Build core
        run: bun run build:core

      # --concurrency=4 not 8: hosted ubuntu-latest runners have 4 vCPUs and
      # 16 GB RAM, and when the affected cone goes near-total (a base-branch
      # commit touching turbo globalDependencies like root package.json /
      # turbo.json makes every stale-base PR typecheck all ~250 packages) eight
      # concurrent tsgo processes exhaust the runner — the OS SIGKILLs tasks or
      # the runner VM itself dies (#15140). NODE_OPTIONS only bounds node-based
      # tools, not native tsgo, so concurrency is the memory lever here.
      - name: Run typecheck (affected)
        run: NODE_OPTIONS='--max-old-space-size=8192' node packages/scripts/run-turbo.mjs run typecheck --concurrency=4 --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Build packages
        run: bun run build:core

  # Plugin specs did not run pre-merge for `develop` PRs: `test.yml` has no
  # `pull_request` trigger, and `windows-ci.yml`'s PR trigger is scoped to
  # `main` — so a regression only a plugin spec can catch was discovered after
  # merge (#17550). This job closes that gap on the develop PR gate only; it
  # does not touch post-merge coverage in `test.yml`, and it does not duplicate
  # the Windows lane, which owns `plugin-app-control` on Windows specifically.
  #
  # Scoped to plugin packages the PR actually changes: the full plugin sweep is
  # a sharded post-merge lane and is far too slow for a per-PR gate.
  plugin-tests:
    runs-on: ubuntu-latest
    # 20 not 10: `build:core` alone is ~1.5 min, and the cap only binds when a
    # PR touches an unusual number of plugin packages at once.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the changed-package diff can resolve the PR base;
          # a shallow clone cannot see the merge base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454)
          install-command: bun install
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # Emits a `(plugins/<pkg>)`-anchored regex — the same label surface
      # `TEST_PACKAGE_FILTER` already matches in `test:plugins`. Only directories
      # that are real packages with a `test` script are included, so a PR
      # touching, say, `plugins/dist/**` does not select a task-less filter.
      - name: Resolve changed plugin packages
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          selected=""
          for pkg in $(git diff --name-only "$BASE_SHA"...HEAD -- plugins \
            | awk -F/ 'NF > 2 && $1 == "plugins" { print $2 }' | sort -u); do
            if [ -f "plugins/$pkg/package.json" ] \
              && node -e "process.exit(require('./plugins/$pkg/package.json').scripts?.test ? 0 : 1)"; then
              selected="${selected:+$selected|}$pkg"
            fi
          done
          if [ -z "$selected" ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "No changed plugin package has a test script; nothing to gate."
          else
            echo "filter=\\(plugins/($selected)\\)" >> "$GITHUB_OUTPUT"
            echo "Gating plugin packages: $selected"
          fi

      # Same runner the post-merge lane uses for these packages: each package's
      # own `test` script (`vitest run`) via run-all-tests.mjs. `--min-tasks=1`
      # fails closed if the filter selects nothing, so a silently empty gate
      # cannot report green.
      - name: Run unit tests for changed plugins
        if: steps.changed.outputs.filter != ''
        env:
          TEST_PACKAGE_FILTER: ${{ steps.changed.outputs.filter }}
          TEST_SCRIPT_FILTER: "^test$"
        run: |
          bun run build:core
          node packages/scripts/run-all-tests.mjs --only=test --no-cloud --concurrency=3 --min-tasks=1
