name: Cloud Latency Certification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected deployment environment to certify.
        required: true
        default: staging
        type: choice
        options: [staging, production]
      token_identity_preflight:
        description: Verify protected Cloudflare token identity only; no model calls or permission changes.
        required: true
        default: false
        type: boolean
      token_permissions_preflight:
        description: Read identified protected token policy metadata only; no model calls or permission changes.
        required: true
        default: false
        type: boolean
      expected_deploy_sha:
        description: Exact 40-character ancestor that the selected environment must serve.
        required: false
        type: string
      acknowledged_contract_digest:
        description: Exact SHA-256 acknowledgement after reviewing verifier changes since the deployed revision; blank when unchanged.
        required: false
        default: ""
        type: string
      probe_case:
        description: Synthetic probe model@reasoning_effort@max_tokens; max leaves the output limit to the provider
        required: false
        default: "qwen-3.8-27b@high@max"
        type: string
      run_auth:
        description: Also run protected inference-auth hit, miss, non-standing guards, and sanitized Worker Tail proof.
        required: true
        default: false
        type: boolean
      run_suspended:
        description: Also prove the optional suspended-standing 403 guard (requires run_auth).
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloud-latency-certification-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  token-identity-preflight:
    # The selected protected environment supplies credentials; source refs remain fixed.
    if: ${{ (inputs.token_identity_preflight || inputs.token_permissions_preflight) && ((inputs.environment == 'production' && github.ref == 'refs/heads/main') || (inputs.environment != 'production' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - name: Verify protected token identity without model calls
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CERTIFICATION_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          CLOUDFLARE_TOKEN_PERMISSION_REPORT: ${{ inputs.token_permissions_preflight }}
        run: |
          set -euo pipefail
          if [[ "$CERTIFICATION_ENVIRONMENT" != "production" && "$CERTIFICATION_ENVIRONMENT" != "staging" ]]; then
            echo '{"failure":"unsupported_environment"}'
            exit 1
          fi
          if [[ "$CERTIFICATION_ENVIRONMENT" == "production" && "$GITHUB_REF" != "refs/heads/main" ]] ||
             [[ "$CERTIFICATION_ENVIRONMENT" != "production" && "$GITHUB_REF" != "refs/heads/develop" && "$GITHUB_REF" != "refs/heads/staging" ]]; then
            echo '{"failure":"untrusted_ref"}'
            exit 1
          fi
          node packages/cloud/scripts/cloudflare-token-identity-preflight.ts

  certify:
    if: ${{ !inputs.token_identity_preflight && !inputs.token_permissions_preflight }}
    name: Certify exact deployed gateway and traces
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.environment || 'staging' }}
    env:
      CERTIFICATION_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      BUN_VERSION: "1.4.2"
      NODE_VERSION: "24.15.0"
      EXPECTED_DEPLOY_SHA: ${{ inputs.expected_deploy_sha }}
      ACKNOWLEDGED_CONTRACT_DIGEST: ${{ inputs.acknowledged_contract_digest }}
      PROBE_CASE: ${{ inputs.probe_case }}
      RUN_AUTH: ${{ inputs.run_auth }}
      RUN_SUSPENDED: ${{ inputs.run_suspended }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY }}
      ELIZA_STAGING_SUSPENDED_API_KEY: ${{ secrets.ELIZA_STAGING_SUSPENDED_API_KEY }}
      INFERENCE_AUTH_PROBE_TOKEN: ${{ secrets.INFERENCE_AUTH_PROBE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate trusted exact-SHA dispatch and protected credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::expected_deploy_sha must be a lowercase 40-character commit."
            exit 1
          fi
          expected_ref="refs/heads/staging"
          if [[ "$CERTIFICATION_ENVIRONMENT" == "production" ]]; then
            expected_ref="refs/heads/main"
            if [[ "$RUN_AUTH" == "true" || "$RUN_SUSPENDED" == "true" ]]; then
              echo "::error::Auth cache probes are supported only in staging."
              exit 1
            fi
          elif [[ "$CERTIFICATION_ENVIRONMENT" != "staging" ]]; then
            echo "::error::Unsupported certification environment."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "::error::Certification must dispatch the selected environment trusted workflow definition."
            exit 1
          fi
          if [[ "$RUN_SUSPENDED" == "true" && "$RUN_AUTH" != "true" ]]; then
            echo "::error::run_suspended is valid only when run_auth=true."
            exit 1
          fi
          required=(
            CEREBRAS_API_KEY
            ELIZAOS_CLOUD_API_KEY
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )
          if [[ "$RUN_AUTH" == "true" ]]; then
            required+=(INFERENCE_AUTH_PROBE_TOKEN)
          fi
          if [[ "$RUN_SUSPENDED" == "true" ]]; then
            required+=(ELIZA_STAGING_SUSPENDED_API_KEY)
          fi
          missing=()
          for name in "${required[@]}"; do
            value_without_whitespace="${!name:-}"
            value_without_whitespace="${value_without_whitespace//[[:space:]]/}"
            [[ -n "$value_without_whitespace" ]] || missing+=("$name")
          done
          unset value_without_whitespace
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required protected environment secret: %s\n' "${missing[@]}"
            exit 1
          fi
          echo "Protected environment credential names are configured; values were not printed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun for pinned Wrangler
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run exact-SHA privacy-safe latency certification
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/artifacts/cloud-latency-certification"
          args=(
            --environment "$CERTIFICATION_ENVIRONMENT"
            --deploy-sha "$EXPECTED_DEPLOY_SHA"
            --output-dir "$output_dir"
            --probe-case "$PROBE_CASE"
            --acknowledged-contract-digest "$ACKNOWLEDGED_CONTRACT_DIGEST"
          )
          if [[ "$RUN_AUTH" == "true" ]]; then
            args+=(--auth)
          fi
          if [[ "$RUN_SUSPENDED" == "true" ]]; then
            args+=(--suspended)
          fi
          node packages/cloud/scripts/cloud-latency-certification.ts "${args[@]}"

      - name: Remove private Worker telemetry material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          private_directories=(
            "$RUNNER_TEMP"/eliza-inference-auth-tail-*
            "$RUNNER_TEMP"/eliza-inference-trace-*
          )
          for directory in "${private_directories[@]}"; do
            if [[ ! -d "$directory" || -L "$directory" ]]; then
              echo "::error::Refusing unexpected private Tail cleanup target."
              exit 1
            fi
            rm -rf -- "$directory"
          done

      - name: Upload sanitized certification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloud-latency-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cloud-latency-certification/source.json
            artifacts/cloud-latency-certification/deployment.json
            artifacts/cloud-latency-certification/placement.json
            artifacts/cloud-latency-certification/paired.jsonl
            artifacts/cloud-latency-certification/auth-failure.json
            artifacts/cloud-latency-certification/inference-auth.jsonl
            artifacts/cloud-latency-certification/inference-auth-worker.jsonl
            artifacts/cloud-latency-certification/inference-traces.json
            artifacts/cloud-latency-certification/trace-denial.json
            artifacts/cloud-latency-certification/summary.json
          if-no-files-found: warn
          retention-days: 7
