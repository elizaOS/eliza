# Deploy packages/homepage to Cloudflare Pages.
#
# Two targets, two very different rules:
#
#   staging.eliza.app  (CF Pages project: eliza-home-staging, production_branch=develop)
#     - AUTOMATIC on every develop push touching packages/homepage/**.
#     - Built against STAGING cloud APIs (VITE_ELIZACLOUD_API_URL=https://staging.elizacloud.ai)
#       so nobody has to smoke-test against prod data ever again.
#
#   eliza.app / www.eliza.app  (CF Pages project: eliza-app-home)
#     - MANUAL ONLY: workflow_dispatch with target=production, gated by the
#       `production` GitHub environment (required reviewers). Standing rule:
#       no eliza.app prod deploy without explicit human approval.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   - must include Cloudflare Pages:Edit on the elizalabs
#                            account (same token cloud-cf-deploy.yml uses; if it
#                            is Workers-only, mint a token with Pages:Edit and
#                            update the secret — do NOT reuse a global key).
#   CLOUDFLARE_ACCOUNT_ID  - elizalabs account id (matches packages/cloud/api/wrangler.toml).
#
# Required repo variables (public identifiers, not secrets):
#   VITE_TELEGRAM_BOT_ID, VITE_TELEGRAM_BOT_USERNAME,
#   VITE_DISCORD_CLIENT_ID, VITE_WHATSAPP_PHONE_NUMBER
#   (enforced at build time via ELIZA_REQUIRE_CHANNEL_CONFIG=1 so a deployable
#   bundle can never ship with dead channel buttons).

name: Deploy Homepage (Cloudflare Pages)

concurrency:
  group: deploy-homepage-pages-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

on:
  push:
    branches: [develop]
    paths:
      - "packages/homepage/**"
      - "packages/app-core/scripts/write-homepage-release-data.mjs"
      - "packages/app-core/scripts/lib/asset-cdn.mjs"
      - ".github/workflows/deploy-homepage-staging.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      ref:
        description: "Git ref to build (defaults to the dispatched ref)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 25
    # push events and dispatched staging runs use the `staging` environment;
    # only an explicit workflow_dispatch with target=production hits the
    # reviewer-protected `production` environment.
    environment: ${{ github.event.inputs.target == 'production' && 'production' || 'staging' }}
    env:
      DEPLOY_TARGET: ${{ github.event.inputs.target || 'staging' }}
    steps:
      - name: Refuse automatic production deploys
        if: env.DEPLOY_TARGET == 'production' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::Production deploys are workflow_dispatch-only."
          exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install homepage dependencies
        working-directory: packages/homepage
        run: bun install --no-save --ignore-scripts

      - name: Typecheck homepage
        working-directory: packages/homepage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run typecheck

      - name: Build homepage
        working-directory: packages/homepage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELIZA_REQUIRE_CHANNEL_CONFIG: "1"
          VITE_TELEGRAM_BOT_ID: ${{ vars.VITE_TELEGRAM_BOT_ID }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          # Public OAuth application id (not a secret). The vars entry wins when
          # set; the literal fallback keeps staging builds functional before the
          # repo variable exists — without it ELIZA_REQUIRE_CHANNEL_CONFIG=1
          # fails the build and a hand-rolled bundle ships "Discord is not
          # configured" (2026-08-11 staging QA).
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID || '1474591626759376967' }}
          VITE_WHATSAPP_PHONE_NUMBER: ${{ vars.VITE_WHATSAPP_PHONE_NUMBER }}
          # Apex, never `www.`: www.elizacloud.ai 308-redirects to the apex and
          # CORS preflights do not follow redirects, so a bundle built against
          # the www host loses every /api/eliza-app/* POST in preflight (#18447).
          VITE_ELIZACLOUD_API_URL: ${{ env.DEPLOY_TARGET == 'production' && 'https://elizacloud.ai' || 'https://staging.elizacloud.ai' }}
        run: bun run build

      - name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured (token needs Pages:Edit on the elizalabs account)."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: packages/homepage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$DEPLOY_TARGET" = "production" ]; then
            PROJECT="eliza-app-home"; BRANCH="main"
          else
            PROJECT="eliza-home-staging"; BRANCH="develop"
          fi
          bunx wrangler@4.116.0 pages deploy dist \
            --project-name "$PROJECT" \
            --branch "$BRANCH" \
            --commit-hash "$GITHUB_SHA"

      - name: Verify deployment
        run: |
          if [ "$DEPLOY_TARGET" = "production" ]; then
            URL="https://eliza.app/"
          else
            URL="https://staging.eliza.app/"
          fi
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL") && [ "$CODE" = "200" ] && exit 0
            echo "attempt $i: $URL -> $CODE; retrying in 15s"
            sleep 15
          done
          echo "::error::$URL did not return 200 after deploy"
          exit 1
