      - name: Require subscription authority outcome
        if: always()
        env:
          SHOULD_RUN: ${{ steps.authority-diff.outputs.run }}
          TEST_OUTCOME: ${{ steps.authority-test.outcome }}
        run: |
          set -euo pipefail
          if [ "$SHOULD_RUN" = "true" ] && [ "$TEST_OUTCOME" != "success" ]; then
            echo "::error::Subscription authority proof was required but finished with $TEST_OUTCOME."
            exit 1
          fi
          if [ "$SHOULD_RUN" = "false" ] && [ "$TEST_OUTCOME" != "skipped" ]; then
            echo "::error::Subscription authority proof ran outside its affected path."
            exit 1
          fi

  required:
    name: All Tests Passed
    if: always()
    needs:
      - secret-scan
      - source-checks
      - billing-payment-replay-e2e
      - subscription-authority-postgres
    runs-on: ubuntu-24.04
    steps:
      - name: Require every admission lane
        env:
          RESULTS: >-
            secret-scan=${{ needs.secret-scan.result }}
            source-checks=${{ needs.source-checks.result }}
            billing-payment-replay-e2e=${{ needs.billing-payment-replay-e2e.result }}
            subscription-authority-postgres=${{ needs.subscription-authority-postgres.result }}
        run: |
          set -euo pipefail
          for pair in $RESULTS; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "::error title=PR admission::$name finished with $result"
              exit 1
            fi
          done
