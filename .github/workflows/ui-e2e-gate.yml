name: UI Fixture Contracts
on:
  workflow_call:
    inputs:
      concurrency_scope:
        description: Caller-owned concurrency namespace
        required: false
        type: string
        default: standalone
concurrency:
  group: ui-e2e-gate-${{ inputs.concurrency_scope || 'standalone' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24.15.0
jobs:
  ui-core-fixture-e2e:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          cache-bun-install: "false"
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          setup-python: "false"
          install-protoc: "false"
      - name: Ensure generated shared i18n data
        run: node packages/app-core/scripts/ensure-shared-i18n-data.mjs
      - name: Build core runtime contract
        run: bun run build:core
      - name: Install Playwright Chromium
        run: PLAYWRIGHT_INSTALL_CWD=packages/ui .github/scripts/install-playwright-browsers.sh chromium
      - name: Agent surface e2e
        run: bun run --cwd packages/ui test:agent-surface-e2e
      - name: Orchestrator accounts widget e2e
        run: bun run --cwd packages/ui test:orchestrator-accounts-e2e
      - name: Background view e2e
        run: bun run --cwd packages/ui test:background-e2e
      - name: Chat sheet drag-gesture e2e
        run: bun run --cwd packages/ui test:chat-sheet-e2e
      - name: Bottom bar e2e
        run: bun run --cwd packages/ui test:bottombar-e2e
      - name: Chat ambient e2e
        run: bun run --cwd packages/ui test:chat-ambient-e2e
      - name: Notification shade gesture e2e
        run: bun run --cwd packages/ui test:notifications-e2e
      - name: Home-screen real-touch e2e
        run: bun run --cwd packages/ui test:home-screen-e2e
      - name: Fused wake integration e2e
        run: bun run --cwd packages/ui test:fused-wake-integration-e2e
      - name: Warm-up message eviction e2e
        run: bun run --cwd packages/ui test:warmup-eviction-e2e
      - name: Warming absorption and rekey race e2e
        run: bun run --cwd packages/ui test:warming-absorption-e2e
      - name: Launcher real-drag reorder e2e
        run: bun run --cwd packages/ui test:launcher-e2e
      - name: View lifecycle e2e
        run: bun run --cwd packages/ui test:view-lifecycle-e2e
      - name: Proactive suggestions pipeline + UI e2e
        run: bun run --cwd packages/ui test:suggestions-e2e
      - name: Frontend hosting e2e
        run: bun run --cwd packages/ui test:frontend-hosting-e2e
      - name: Credentials e2e
        run: bun run --cwd packages/ui test:credentials-e2e
      - name: Cloud settings surface (slop-removal) e2e
        run: bun run --cwd packages/ui test:slop-removal-e2e
      - name: Upload UI fixture e2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-core-fixture-e2e-output
          path: |
            packages/ui/src/agent-surface/__e2e__/output
            packages/ui/src/components/chat/widgets/__e2e__/output
            packages/ui/src/components/chat/widgets/__e2e__/output-ftu
            packages/ui/src/components/pages/__e2e__/output-background
            packages/ui/src/components/views/__e2e__/output-view-lifecycle
            packages/ui/src/components/shell/__e2e__/output
            packages/ui/src/components/shell/__e2e__/output-home
            packages/ui/src/components/shell/__e2e__/output-notifications
            packages/ui/src/components/shell/__e2e__/output-bottombar
            packages/ui/src/components/shell/__e2e__/output-fused-wake-integration
            packages/ui/src/components/pages/__e2e__/output-launcher
            packages/ui/src/components/pages/__e2e__/output-background
            packages/ui/src/components/pages/__e2e__/output-suggestions
            packages/ui/src/cloud/applications/__e2e__/output-frontend-hosting
            packages/ui/src/cloud/organization/__e2e__/output-credentials
            packages/ui/src/cloud/__e2e__/output-slop-removal
            packages/ui/src/components/shell/__e2e__/output-warmup-eviction
            packages/ui/src/components/shell/__e2e__/output-warming-absorption
          retention-days: 3
          if-no-files-found: ignore
  fixture-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          setup-python: "false"
          install-protoc: "false"
      - name: Install Playwright Chromium + WebKit
        run: PLAYWRIGHT_INSTALL_CWD=packages/ui .github/scripts/install-playwright-browsers.sh chromium webkit
      - name: Ensure generated shared i18n data
        run: node packages/app-core/scripts/ensure-shared-i18n-data.mjs
      - name: Build core contract
        run: bun run build:core
      - name: Settings page e2e
        run: bun run --cwd packages/ui test:settings-e2e
      - name: Chat infinite-scroll e2e (chromium)
        run: bun run --cwd packages/ui test:chat-infinite-scroll-e2e
      - name: Chat infinite-scroll e2e (webkit)
        run: ENGINE=webkit bun run --cwd packages/ui test:chat-infinite-scroll-e2e
      - name: Wallet widget e2e
        run: bun run --cwd packages/ui test:wallet-widget-e2e
      - name: Activity feedback e2e
        run: bun run --cwd packages/ui test:activity-feedback-e2e
      - name: Task pipeline widget e2e
        run: bun run --cwd packages/ui test:task-pipeline-e2e
      - name: Permission priming e2e
        run: bun run --cwd packages/ui test:permission-priming-e2e
      - name: Divider drag perf gate
        run: bun run --cwd packages/ui test:divider-drag-perf-gate
      - name: Home locale e2e
        run: bun run --cwd packages/ui test:home-locale-e2e
      - name: Widget certification e2e
        run: bun run --cwd packages/ui test:widget-cert-e2e
      - name: Upload extended fixture e2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-extended-fixture-e2e-output
          path: |
            packages/ui/src/components/pages/__e2e__/output-infinite-scroll
            packages/ui/src/components/pages/__e2e__/output-settings
            packages/ui/src/components/chat/widgets/__e2e__/output
            packages/ui/src/components/chat/widgets/__e2e__/output-wallet
            packages/ui/src/components/chat/__e2e__/output-activity-feedback
            packages/ui/src/components/permissions/__e2e__/output-permission-priming
            packages/ui/src/components/composites/__e2e__/output-divider-perf
            packages/ui/tmp/home-locale-e2e
            packages/ui/src/testing/__e2e__/output-widget-cert
          retention-days: 3
          if-no-files-found: ignore
  chat-shell-gestures:
    name: Chat shell gesture + parity e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          setup-python: "false"
          install-protoc: "false"
      - name: Ensure generated shared i18n data
        run: node packages/app-core/scripts/ensure-shared-i18n-data.mjs
      - name: Install Playwright chromium + webkit
        run: .github/scripts/install-playwright-browsers.sh chromium webkit
      - name: Render-parity contract
        run: bun run --cwd packages/ui test -- src/components/chat/render-parity.contract.test.tsx
      - name: Conversation-nav unit + interleaving
        run: bun run --cwd packages/ui test -- src/components/shell/conversation-nav.test.ts
      - name: Chat-sheet Safari/WebKit gesture smoke
        run: bun run --cwd packages/ui test:chat-sheet-safari-e2e
      - name: Chat-scroll web e2e
        run: bun run --cwd packages/ui test:chat-scroll-web-e2e
      - name: Chat transcript axis-lock e2e (chromium)
        run: bun run --cwd packages/ui test:chat-scroll-axis-lock-e2e
      - name: Chat transcript axis-lock e2e (webkit)
        run: ENGINE=webkit bun run --cwd packages/ui test:chat-scroll-axis-lock-e2e
      - name: Launcher gesture long-loop e2e
        env:
          ELIZA_LOOP_SEED: "12375"
        run: bun run --cwd packages/ui test:launcher-loop-e2e
      - name: Chat overlay perf gate
        run: bun run --cwd packages/ui test:chat-perf-gate
      - name: Chat overlay scroll/maximize perf gate
        run: bun run --cwd packages/ui test:perf-gate-e2e
      - name: Frame-glitch (transient) e2e
        run: bun packages/ui/src/components/shell/__e2e__/run-chat-sheet-frame-glitch-e2e.mjs
      - name: Frame-glitch canary self-test
        run: bun packages/ui/src/components/shell/__e2e__/run-chat-sheet-frame-glitch-e2e.mjs --canary
      - name: Upload gesture videos + screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chat-shell-gesture-artifacts
          path: |
            packages/ui/src/components/shell/__e2e__/output/
            packages/ui/src/components/shell/__e2e__/output-webkit/
            packages/ui/src/components/shell/__e2e__/output-home/
            packages/ui/src/components/shell/__e2e__/output-launcher-loop/
            packages/ui/src/components/shell/__e2e__/output-bottombar/
            packages/ui/src/components/shell/__e2e__/output-warmup-eviction/
            packages/ui/src/components/shell/__e2e__/output-perf-gate/
            packages/ui/src/components/shell/__e2e__/output-frame-glitch/
          if-no-files-found: warn
          retention-days: 3
    env:
      CI: "true"
      BUN_VERSION: 1.3.14
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
