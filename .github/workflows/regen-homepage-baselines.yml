# Regenerate the homepage Playwright visual-regression baselines on the Linux
# renderer that CI diffs against, and publish them as a downloadable artifact.
#
# The committed baselines under
# packages/homepage/tests/e2e/visual.spec.ts-snapshots/ are chromium-linux
# renders, so macOS development machines cannot refresh them locally. Dispatch
# this workflow from the branch whose UI changed, download the artifact, and
# commit the PNGs to that branch. This workflow never deploys and never writes
# to the repository.

name: Regenerate Homepage Baselines

on:
  workflow_dispatch:
  # Temporary branch trigger: workflow_dispatch only works once this file is
  # on the default branch, so the redesign branch self-triggers on push.
  push:
    branches: [shaw/eliza-homepage-redesign-952489]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install frozen workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Refresh homepage release data
        working-directory: packages/homepage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../app-core/scripts/write-homepage-release-data.mjs

      - name: Install homepage browser
        run: PLAYWRIGHT_INSTALL_CWD=packages/homepage .github/scripts/install-playwright-browsers.sh chromium

      - name: Regenerate visual baselines
        working-directory: packages/homepage
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_FORCE_ASYNC_LOADER: "1"
        run: bunx playwright test tests/e2e/visual.spec.ts --update-snapshots

      - name: Upload baselines artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homepage-visual-baselines-${{ github.sha }}
          path: packages/homepage/tests/e2e/visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 3
