            ) THEN
              RAISE EXCEPTION 'deletion intent pair constraint is missing or incomplete';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_constraint constraint_row
              INNER JOIN pg_class relation ON relation.oid = constraint_row.conrelid
              INNER JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
              WHERE namespace.nspname = current_schema()
                AND relation.relname = 'agent_sandboxes'
                AND constraint_row.conname = 'agent_sandboxes_replacement_cleanup_locator_check'
                AND constraint_row.contype = 'c'
                AND constraint_row.convalidated
                AND md5(
                  regexp_replace(
                    pg_get_constraintdef(constraint_row.oid),
                    E'\\s+',
                    ' ',
                    'g'
                  )
                ) = '3f30c7b71231f35d83b9944c7d86fb4a'
            ) THEN
              RAISE EXCEPTION 'replacement cleanup locator constraint is missing or incomplete';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_constraint constraint_row
              INNER JOIN pg_class relation ON relation.oid = constraint_row.conrelid
              INNER JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
              WHERE namespace.nspname = current_schema()
                AND relation.relname = 'agent_sandboxes'
                AND constraint_row.conname = 'agent_sandboxes_rollback_standby_contract_check'
                AND constraint_row.contype = 'c'
                AND constraint_row.convalidated
                AND md5(
                  regexp_replace(
                    pg_get_constraintdef(constraint_row.oid),
                    E'\\s+',
                    ' ',
                    'g'
