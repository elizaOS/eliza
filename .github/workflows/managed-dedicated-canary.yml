name: Managed Dedicated Staging Canary

# Bounded, fail-closed proof of the managed Cloud dedicated-agent path. This
# lane never talks to the Hetzner API directly: the deployed staging
# provisioner owns capacity and the canary uses the same repository Cloud
# credential as App Live. One fixed concurrency group plus the script's stale
# canary guard ensures no second canary can be created while one exists.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      stale_canary_suffix:
        description: "Exact prior workflow suffix (r<run-id>a<attempt>) to verify and delete before creating the fresh canary"
        required: false
        type: string
        default: ""
      diagnose_stale_canary_suffix:
        description: "Read-only staging diagnosis for one exact stale canary suffix; performs no canary or lifecycle mutation"
        required: false
        type: string
        default: ""
  # A maintainer-applied label lets the workflow prove a new harness before it
  # reaches the default branch; the staging environment still owns secret and
  # approval policy.
  pull_request:
    types: [labeled]

concurrency:
  group: managed-dedicated-staging-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: Provision + bridge + SSE + cleanup
    if: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'run-managed-dedicated-canary') && inputs.diagnose_stale_canary_suffix == '' }}
    runs-on: ubuntu-24.04
    environment: staging
    # The script's absolute worst-case request budgets stay below this cap and
    # reserve its final cleanup window before Actions can terminate the job.
    timeout-minutes: 45
    env:
      CLOUD_DEDICATED_CANARY_BASE_URL: https://api-staging.elizacloud.ai
      CLOUD_DEDICATED_CANARY_EVIDENCE_PATH: reports/managed-dedicated-canary.json
      CLOUD_DEDICATED_CANARY_STALE_CANARY_SUFFIX: ${{ inputs.stale_canary_suffix || '' }}
      # Keep this identical to App Live's accepted repository-secret contract.
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY || secrets.ELIZACLOUD_API_KEY }}
    steps:
      - name: Require real Cloud credential
        shell: bash
        run: |
          set -euo pipefail
          cloud_key_without_whitespace="${ELIZAOS_CLOUD_API_KEY:-}"
          cloud_key_without_whitespace="${cloud_key_without_whitespace//[[:space:]]/}"
          if [[ -z "$cloud_key_without_whitespace" ]]; then
            echo "::error::Managed dedicated canary requires ELIZAOS_CLOUD_API_KEY or ELIZACLOUD_API_KEY; refusing green-by-skip."
            exit 1
          fi
          unset cloud_key_without_whitespace

      - name: Require exact staging target
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expected = "https://api-staging.elizacloud.ai";
          const raw = process.env.CLOUD_DEDICATED_CANARY_BASE_URL ?? "";
          let url;
          try {
            url = new URL(raw);
          } catch {
            throw new Error("Managed dedicated canary target is not a valid URL");
          }
          if (
            url.origin !== expected ||
            url.username ||
            url.password ||
            (url.pathname !== "/" && url.pathname !== "") ||
            url.search ||
            url.hash
          ) {
            throw new Error(
              "Managed dedicated canary is pinned to the exact staging origin without userinfo, path, query, or fragment",
            );
          }
          NODE

      - name: Bind stale-recovery intent
        id: recovery_intent
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const raw =
            process.env.CLOUD_DEDICATED_CANARY_STALE_CANARY_SUFFIX ?? "";
          const requested = raw !== "";
          if (requested && !/^r[1-9]\d{7,19}a[1-9]\d{0,3}$/.test(raw)) {
            throw new Error("Stale-canary recovery input is invalid");
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `requested=${requested ? "true" : "false"}\n`,
          );
          NODE

      - name: Checkout exact run commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: canary

      - name: Validate canary and failure contracts
        run: |
          bun test \
            packages/scripts/cloud/admin/bridge-reply-verdict.test.ts \
            packages/scripts/cloud/admin/managed-dedicated-canary.test.ts

      - name: Run bounded managed dedicated canary
        id: live
        shell: bash
        run: |
          set +e
          mkdir -p reports
          bun run packages/scripts/cloud/admin/managed-dedicated-canary.ts
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Validate privacy-safe evidence artifact
        id: privacy
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$CLOUD_DEDICATED_CANARY_EVIDENCE_PATH"
          if [[ ! -s "$evidence_path" ]]; then
            echo "::error::Canary produced no evidence artifact to privacy-check."
            exit 1
          fi
          bun -e '
            import { readFileSync, renameSync, writeFileSync } from "node:fs";
            import { canonicalizeManagedDedicatedCanaryArtifact } from "./packages/scripts/cloud/admin/managed-dedicated-canary.ts";
            const evidencePath = process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH;
            if (!evidencePath) {
              console.error("::error::Canary evidence path is not configured.");
              process.exit(1);
            }
            const { canonical, errors } = canonicalizeManagedDedicatedCanaryArtifact(
              readFileSync(evidencePath, "utf8"),
            );
            if (errors.length > 0) {
              console.error("::error::Canary evidence failed strict privacy validation: " + errors.join(","));
              process.exit(1);
            }
            if (canonical === null) process.exit(1);
            const canonicalPath = evidencePath + ".validated-" + process.pid;
            writeFileSync(canonicalPath, canonical, { mode: 0o600 });
            renameSync(canonicalPath, evidencePath);
          '
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Upload privacy-safe timing and path evidence
        if: ${{ always() && steps.privacy.outputs.validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-dedicated-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/managed-dedicated-canary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce live proof, deployed SHA, and cleanup
        if: ${{ always() }}
        env:
          LIVE_PROCESS_STATUS: ${{ steps.live.outputs.status }}
          PRIVACY_VALIDATED: ${{ steps.privacy.outputs.validated }}
          EXPECTED_RECOVERY_REQUESTED: ${{ steps.recovery_intent.outputs.requested }}
          # Canonical staging rejects feature-ref deploys. A labeled PR therefore
          # proves the exact harness at its checked-out head against the deployed
          # base it proposes to extend; post-merge runs prove their own SHA.
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$CLOUD_DEDICATED_CANARY_EVIDENCE_PATH"
          if [[ ! -s "$evidence_path" ]]; then
            echo "::error::Canary produced no evidence; zero-executed/skip outcomes are failures."
            exit 1
          fi
          if [[ "${PRIVACY_VALIDATED:-missing}" != "true" ]]; then
            echo "::error::Canary evidence did not pass the separate strict privacy validator."
            exit 1
          fi

          deployed_commit="$(
            bun -e '
              import { readFileSync } from "node:fs";
              import { validateManagedDedicatedCanaryEvidence } from "./packages/scripts/cloud/admin/managed-dedicated-canary.ts";
              const evidence = JSON.parse(readFileSync(process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH, "utf8"));
              const errors = validateManagedDedicatedCanaryEvidence(evidence);
              const expectedRecoveryRequested =
                process.env.EXPECTED_RECOVERY_REQUESTED === "true";
              if (evidence.recovery?.requested !== expectedRecoveryRequested) {
                errors.push("workflow_recovery_intent_mismatch");
              }
              if (errors.length > 0) {
                console.error("::error::Canary evidence rejected: " + errors.join(","));
                process.exit(1);
              }
              process.stdout.write(evidence.deployedCommit);
            '
          )"

          if [[ "${LIVE_PROCESS_STATUS:-missing}" != "0" ]]; then
            echo "::error::Live canary process exited ${LIVE_PROCESS_STATUS:-without status}."
            exit 1
          fi
          if ! git cat-file -e "${deployed_commit}^{commit}" 2>/dev/null; then
            echo "::error::Staging reported a deploy commit absent from this repository checkout."
            exit 1
          fi
          expected_source_sha="${EXPECTED_SOURCE_SHA:-}"
          if [[ -z "$expected_source_sha" ]] || ! git cat-file -e "${expected_source_sha}^{commit}" 2>/dev/null; then
            echo "::error::Expected canary source commit is absent from this repository checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$expected_source_sha" "$deployed_commit"; then
            echo "::error::Staging deploy does not contain this canary's expected source commit."
            exit 1
          fi

          bun -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(readFileSync(process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH, "utf8"));
            const t = evidence.timingsMs;
            console.log("### Managed dedicated staging canary");
            console.log("");
            console.log("- deployed commit: `" + evidence.deployedCommit + "`");
            console.log("- tier: `" + evidence.path.observedTier + "`");
            console.log("- paths: `" + evidence.path.successfulPaths + "/2`");
            console.log("- bridge transport: `" + evidence.path.bridgeTransport + "`");
            console.log("- chat requests: `" + evidence.capacity.chatRequests + "/" + evidence.capacity.maxChatRequests + "`");
            console.log("- recovery requested: `" + evidence.recovery.requested + "`");
            console.log("- recovery match: `" + evidence.recovery.match + "`");
            console.log("- recovery performed: `" + evidence.recovery.performed + "`");
            console.log("- recovery confirmed: `" + evidence.recovery.confirmed + "`");
            console.log("- cleanup: `" + evidence.cleanup.status + "`");
            console.log("");
            console.log("| phase | ms |");
            console.log("| --- | ---: |");
            for (const phase of ["health", "capacityGuard", "create", "ready", "bridge", "sse", "cleanup", "total"]) {
              if (Number.isFinite(t[phase])) console.log("| " + phase + " | " + t[phase] + " |");
            }
          ' >> "$GITHUB_STEP_SUMMARY"

          echo "Managed dedicated canary passed with exact cleanup."

  diagnose:
    name: Read-only stale canary diagnosis
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_stale_canary_suffix != '' }}
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 10
    env:
      CANARY_DIAGNOSTIC_SUFFIX: ${{ inputs.diagnose_stale_canary_suffix }}
      CANARY_RECOVERY_SUFFIX: ${{ inputs.stale_canary_suffix }}
      CANARY_DIAGNOSTIC_RAW_PATH: reports/managed-dedicated-canary-diagnostic.raw.json
      CANARY_DIAGNOSTIC_EVIDENCE_PATH: reports/managed-dedicated-canary-diagnostic.json
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: canary

      - name: Validate diagnostic contracts
        run: bun test packages/scripts/cloud/admin/managed-dedicated-canary-diagnostic.test.ts

      - name: Query exact stale canary read-only
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=20000
        run: |
          set -euo pipefail
          raw_ready=false
          cleanup_incomplete_raw() {
            if [[ "$raw_ready" != true ]]; then
              rm -f -- "$CANARY_DIAGNOSTIC_RAW_PATH"
            fi
          }
          trap cleanup_incomplete_raw EXIT
          if [[ ! "$CANARY_DIAGNOSTIC_SUFFIX" =~ ^r[1-9][0-9]{7,19}a[1-9][0-9]{0,3}$ ]]; then
            echo "::error::Diagnostic suffix is invalid."
            exit 1
          fi
          if [[ -n "$CANARY_RECOVERY_SUFFIX" ]]; then
            echo "::error::Diagnostic and mutation recovery inputs are mutually exclusive."
            exit 1
          fi
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Staging DATABASE_URL is unavailable."
            exit 1
          fi

          mkdir -p reports
          umask 077
          PSQL_DATABASE_URL="$(
            bun packages/scripts/cloud/admin/libpq-connection-url.ts
          )"
          echo "::add-mask::$PSQL_DATABASE_URL"
          psql "$PSQL_DATABASE_URL" \
            --no-psqlrc \
            --no-align \
            --tuples-only \
            --quiet \
            --set ON_ERROR_STOP=1 \
            --set suffix="$CANARY_DIAGNOSTIC_SUFFIX" \
            > "$CANARY_DIAGNOSTIC_RAW_PATH" <<'SQL'
          BEGIN READ ONLY, ISOLATION LEVEL REPEATABLE READ;
          SET LOCAL statement_timeout = '20s';
          DO $schema_preflight$
          DECLARE
            missing_columns text;
          BEGIN
            SELECT string_agg(required.table_name || '.' || required.column_name, ', ')
            INTO missing_columns
            FROM (
              VALUES
                ('agent_sandboxes', 'deletion_attempt_id'),
                ('agent_sandboxes', 'deletion_started_at'),
                ('agent_sandboxes', 'replacement_cleanup_sandbox_id'),
                ('agent_sandboxes', 'replacement_cleanup_node_id'),
                ('agent_sandboxes', 'replacement_cleanup_container_name'),
                ('agent_sandboxes', 'replacement_cleanup_attempt_id'),
                ('agent_sandboxes', 'replacement_cleanup_container_id'),
                ('agent_sandboxes', 'replacement_cleanup_vpn_node_id'),
                ('agent_sandboxes', 'replacement_cleanup_vpn_node_name'),
                ('agent_sandboxes', 'replacement_cleanup_preserved_vpn_node_id'),
                ('agent_sandboxes', 'replacement_cleanup_vpn_registration_started_at'),
                ('agent_sandboxes', 'replacement_cleanup_allocation_counted'),
                ('agent_sandboxes', 'replacement_cleanup_created_at'),
                ('agent_sandboxes', 'rollback_standby_state'),
                ('agent_sandboxes', 'rollback_standby_generation'),
                ('agent_sandboxes', 'rollback_standby_rollout_id'),
                ('agent_sandboxes', 'rollback_standby_source_job_id'),
                ('agent_sandboxes', 'rollback_standby_decision_job_id'),
                ('agent_sandboxes', 'rollback_standby_verified_backup_id'),
                ('agent_sandboxes', 'rollback_standby_restore_validation_id'),
                ('agent_sandboxes', 'rollback_standby_restore_validation_aggregate_sha256'),
                ('agent_sandboxes', 'rollback_standby_restore_candidate_provider_sandbox_id'),
                ('agent_sandboxes', 'rollback_standby_restore_candidate_replacement_attempt_id'),
                ('agent_sandboxes', 'rollback_standby_sandbox_id'),
                ('agent_sandboxes', 'rollback_standby_node_id'),
                ('agent_sandboxes', 'rollback_standby_container_name'),
                ('agent_sandboxes', 'rollback_standby_container_id'),
                ('agent_sandboxes', 'rollback_standby_bridge_url'),
                ('agent_sandboxes', 'rollback_standby_health_url'),
                ('agent_sandboxes', 'rollback_standby_bridge_port'),
                ('agent_sandboxes', 'rollback_standby_web_ui_port'),
                ('agent_sandboxes', 'rollback_standby_headscale_ip'),
                ('agent_sandboxes', 'rollback_standby_vpn_node_id'),
                ('agent_sandboxes', 'rollback_standby_docker_image'),
                ('agent_sandboxes', 'rollback_standby_image_digest'),
                ('agent_sandboxes', 'rollback_standby_previous_docker_image'),
                ('agent_sandboxes', 'rollback_standby_previous_image_digest'),
                ('agent_sandboxes', 'rollback_standby_environment_revision'),
                ('agent_sandboxes', 'rollback_standby_allocation_counted'),
                ('agent_sandboxes', 'rollback_standby_primary_sandbox_id'),
                ('agent_sandboxes', 'rollback_standby_primary_node_id'),
                ('agent_sandboxes', 'rollback_standby_primary_container_name'),
                ('agent_sandboxes', 'rollback_standby_primary_container_id'),
                ('agent_sandboxes', 'rollback_standby_primary_vpn_node_id'),
                ('agent_sandboxes', 'rollback_standby_primary_replacement_attempt_id'),
                ('agent_sandboxes', 'rollback_standby_created_at'),
                ('agent_snapshot_restore_validations', 'restore_validation_id'),
                ('agent_snapshot_restore_validations', 'validation_job_id'),
                ('agent_snapshot_restore_validations', 'source_job_id'),
                ('agent_snapshot_restore_validations', 'rollout_id'),
                ('agent_snapshot_restore_validations', 'standby_generation'),
                ('agent_snapshot_restore_validations', 'organization_id'),
                ('agent_snapshot_restore_validations', 'sandbox_record_id'),
                ('agent_snapshot_restore_validations', 'agent_id'),
                ('agent_snapshot_restore_validations', 'target_owner_user_id'),
                ('agent_snapshot_restore_validations', 'backup_id'),
                ('agent_snapshot_restore_validations', 'capture_nonce'),
                ('agent_snapshot_restore_validations', 'source_environment_revision'),
                ('agent_snapshot_restore_validations', 'source_image_digest'),
                ('agent_snapshot_restore_validations', 'source_sandbox_id'),
                ('agent_snapshot_restore_validations', 'target_image'),
                ('agent_snapshot_restore_validations', 'target_digest'),
                ('agent_snapshot_restore_validations', 'candidate_route_mode'),
                ('agent_snapshot_restore_validations', 'validation_state'),
                ('agent_snapshot_restore_validations', 'aggregate_sha256'),
                ('agent_snapshot_restore_validations', 'target_provider_sandbox_id'),
                ('agent_snapshot_restore_validations', 'target_replacement_attempt_id'),
                ('agent_snapshot_restore_validations', 'target_provider_node_id'),
                ('agent_snapshot_restore_validations', 'target_provider_container_name'),
                ('agent_snapshot_restore_validations', 'target_provider_container_id'),
                ('agent_snapshot_restore_validations', 'target_provider_volume_path'),
                ('agent_snapshot_restore_validations', 'target_provider_bridge_url'),
                ('agent_snapshot_restore_validations', 'target_provider_health_url'),
                ('agent_snapshot_restore_validations', 'target_provider_bridge_port'),
                ('agent_snapshot_restore_validations', 'target_provider_web_ui_port'),
                ('agent_snapshot_restore_validations', 'target_provider_vpn_node_id'),
                ('agent_snapshot_restore_validations', 'target_provider_vpn_node_name'),
                ('agent_snapshot_restore_validations', 'target_provider_vpn_registration_started_at'),
                ('agent_snapshot_restore_validations', 'target_provider_allocation_counted'),
                ('agent_snapshot_restore_validations', 'receipt_state'),
                ('agent_snapshot_restore_validations', 'receipt_schema_version'),
                ('agent_snapshot_restore_validations', 'receipt_transfer'),
                ('agent_snapshot_restore_validations', 'receipt_file_count'),
                ('agent_snapshot_restore_validations', 'receipt_total_bytes'),
                ('agent_snapshot_restore_validations', 'receipt_requires_restart'),
                ('agent_snapshot_restore_validations', 'receipt_success'),
                ('agent_snapshot_restore_validations', 'receipt_committed_at'),
                ('agent_snapshot_restore_validations', 'route_exposed_at'),
                ('agent_snapshot_restore_validations', 'candidate_container_absent_at'),
                ('agent_snapshot_restore_validations', 'candidate_vpn_absent_at'),
                ('agent_snapshot_restore_validations', 'candidate_volume_absent_at'),
                ('agent_snapshot_restore_validations', 'candidate_retired_at'),
                ('agent_snapshot_restore_validations', 'created_at'),
                ('agent_snapshot_restore_validations', 'updated_at'),
                ('jobs', 'id'),
                ('jobs', 'type'),
                ('jobs', 'status'),
                ('jobs', 'data'),
                ('jobs', 'data_storage'),
                ('jobs', 'result'),
                ('jobs', 'result_storage'),
                ('jobs', 'error'),
                ('jobs', 'error_storage'),
                ('jobs', 'attempts'),
                ('jobs', 'max_attempts'),
                ('jobs', 'organization_id'),
                ('jobs', 'user_id'),
                ('jobs', 'agent_id'),
                ('jobs', 'scheduled_for'),
                ('jobs', 'started_at'),
                ('jobs', 'completed_at'),
                ('jobs', 'created_at'),
                ('jobs', 'updated_at'),
                ('agent_sandbox_backups', 'id'),
                ('agent_sandbox_backups', 'sandbox_record_id'),
                ('agent_sandbox_backups', 'snapshot_type'),
                ('agent_sandbox_backups', 'snapshot_schema_version'),
                ('agent_sandbox_backups', 'verification_status'),
                ('agent_sandbox_backups', 'verified_at'),
                ('agent_sandbox_backups', 'verification_error'),
                ('agent_sandbox_backups', 'storage_commit_state'),
                ('agent_sandbox_backups', 'content_hash')
            ) AS required(table_name, column_name)
            LEFT JOIN information_schema.columns actual
              ON actual.table_schema = current_schema()
              AND actual.table_name = required.table_name
              AND actual.column_name = required.column_name
            WHERE actual.column_name IS NULL;
            IF missing_columns IS NOT NULL THEN
              RAISE EXCEPTION 'managed canary diagnostic schema is incomplete: %', missing_columns;
            END IF;

            IF EXISTS (
              SELECT 1
              FROM information_schema.columns actual
              WHERE actual.table_schema = current_schema()
                AND actual.table_name = 'jobs'
                AND actual.column_name = ANY (ARRAY[
                  'id',
                  'type',
                  'status',
                  'data',
                  'data_storage',
                  'result',
                  'result_storage',
                  'error',
                  'error_storage',
                  'attempts',
                  'max_attempts',
                  'organization_id',
                  'user_id',
                  'agent_id',
                  'scheduled_for',
                  'started_at',
                  'completed_at',
                  'created_at',
                  'updated_at'
                ])
                AND (
                  actual.udt_name <> CASE
                    WHEN actual.column_name IN ('id', 'organization_id', 'user_id')
                      THEN 'uuid'
                    WHEN actual.column_name IN ('data', 'result')
                      THEN 'jsonb'
                    WHEN actual.column_name IN ('attempts', 'max_attempts')
                      THEN 'int4'
                    WHEN actual.column_name IN (
                      'scheduled_for',
                      'started_at',
                      'completed_at',
                      'created_at',
                      'updated_at'
                    ) THEN 'timestamp'
                    ELSE 'text'
                  END
                  OR CASE
                    WHEN actual.column_name IN (
                      'id',
                      'type',
                      'status',
                      'data',
                      'data_storage',
                      'result_storage',
                      'error_storage',
                      'attempts',
                      'max_attempts',
                      'organization_id',
                      'scheduled_for',
                      'created_at',
                      'updated_at'
                    ) THEN actual.is_nullable <> 'NO'
                    ELSE actual.is_nullable <> 'YES'
                  END
                )
            ) THEN
              RAISE EXCEPTION 'pointed job authority columns are incompatible';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM information_schema.columns actual
              WHERE actual.table_schema = current_schema()
                AND actual.table_name = 'agent_sandboxes'
                AND actual.column_name = ANY (ARRAY[
                  'rollback_standby_state',
                  'rollback_standby_generation',
                  'rollback_standby_rollout_id',
                  'rollback_standby_source_job_id',
                  'rollback_standby_decision_job_id',
                  'rollback_standby_verified_backup_id',
                  'rollback_standby_restore_validation_id',
                  'rollback_standby_restore_validation_aggregate_sha256',
                  'rollback_standby_restore_candidate_provider_sandbox_id',
                  'rollback_standby_restore_candidate_replacement_attempt_id',
                  'rollback_standby_sandbox_id',
                  'rollback_standby_node_id',
                  'rollback_standby_container_name',
                  'rollback_standby_container_id',
                  'rollback_standby_bridge_url',
                  'rollback_standby_health_url',
                  'rollback_standby_bridge_port',
                  'rollback_standby_web_ui_port',
                  'rollback_standby_headscale_ip',
                  'rollback_standby_vpn_node_id',
                  'rollback_standby_docker_image',
                  'rollback_standby_image_digest',
                  'rollback_standby_previous_docker_image',
                  'rollback_standby_previous_image_digest',
                  'rollback_standby_environment_revision',
                  'rollback_standby_allocation_counted',
                  'rollback_standby_primary_sandbox_id',
                  'rollback_standby_primary_node_id',
                  'rollback_standby_primary_container_name',
                  'rollback_standby_primary_container_id',
                  'rollback_standby_primary_vpn_node_id',
                  'rollback_standby_primary_replacement_attempt_id',
                  'rollback_standby_created_at'
                ])
                AND (
                  actual.is_nullable <> 'YES'
