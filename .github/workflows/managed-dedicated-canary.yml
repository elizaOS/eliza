name: Managed Dedicated Staging Canary

# Bounded, fail-closed proof of the managed Cloud dedicated-agent path. This
# lane never talks to the Hetzner API directly: the deployed staging
# provisioner owns capacity and the canary uses the same repository Cloud
# credential as App Live. One fixed concurrency group plus the script's stale
# canary guard ensures no second canary can be created while one exists.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      stale_canary_suffix:
        description: "Exact prior workflow suffix (r<run-id>a<attempt>) to verify and delete before creating the fresh canary"
        required: false
        type: string
        default: ""
      diagnose_stale_canary_suffix:
        description: "Read-only staging diagnosis for one exact stale canary suffix; performs no canary or lifecycle mutation"
        required: false
        type: string
        default: ""
  # A maintainer-applied label lets the workflow prove a new harness before it
  # reaches the default branch; the staging environment still owns secret and
  # approval policy.
  pull_request:
    types: [labeled]

concurrency:
  group: managed-dedicated-staging-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: Provision + bridge + SSE + cleanup
    if: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'run-managed-dedicated-canary') && inputs.diagnose_stale_canary_suffix == '' }}
    runs-on: ubuntu-24.04
    environment: staging
    # The script's absolute worst-case request budgets stay below this cap and
    # reserve its final cleanup window before Actions can terminate the job.
    timeout-minutes: 45
    env:
      CLOUD_DEDICATED_CANARY_BASE_URL: https://api-staging.elizacloud.ai
      CLOUD_DEDICATED_CANARY_EVIDENCE_PATH: reports/managed-dedicated-canary.json
      CLOUD_DEDICATED_CANARY_STALE_CANARY_SUFFIX: ${{ inputs.stale_canary_suffix || '' }}
      # Keep this identical to App Live's accepted repository-secret contract.
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY || secrets.ELIZACLOUD_API_KEY }}
    steps:
      - name: Require real Cloud credential
        shell: bash
        run: |
          set -euo pipefail
          cloud_key_without_whitespace="${ELIZAOS_CLOUD_API_KEY:-}"
          cloud_key_without_whitespace="${cloud_key_without_whitespace//[[:space:]]/}"
          if [[ -z "$cloud_key_without_whitespace" ]]; then
            echo "::error::Managed dedicated canary requires ELIZAOS_CLOUD_API_KEY or ELIZACLOUD_API_KEY; refusing green-by-skip."
            exit 1
          fi
          unset cloud_key_without_whitespace

      - name: Require exact staging target
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expected = "https://api-staging.elizacloud.ai";
          const raw = process.env.CLOUD_DEDICATED_CANARY_BASE_URL ?? "";
          let url;
          try {
            url = new URL(raw);
          } catch {
            throw new Error("Managed dedicated canary target is not a valid URL");
          }
          if (
            url.origin !== expected ||
            url.username ||
            url.password ||
            (url.pathname !== "/" && url.pathname !== "") ||
            url.search ||
            url.hash
          ) {
            throw new Error(
              "Managed dedicated canary is pinned to the exact staging origin without userinfo, path, query, or fragment",
            );
          }
          NODE

      - name: Bind stale-recovery intent
        id: recovery_intent
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const raw =
            process.env.CLOUD_DEDICATED_CANARY_STALE_CANARY_SUFFIX ?? "";
          const requested = raw !== "";
          if (requested && !/^r[1-9]\d{7,19}a[1-9]\d{0,3}$/.test(raw)) {
            throw new Error("Stale-canary recovery input is invalid");
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `requested=${requested ? "true" : "false"}\n`,
          );
          NODE

      - name: Checkout exact run commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: canary

      - name: Validate canary and failure contracts
        run: |
          bun test \
            packages/cloud/scripts/admin/bridge-reply-verdict.test.ts \
            packages/cloud/scripts/admin/managed-dedicated-canary.test.ts

      - name: Run bounded managed dedicated canary
        id: live
        shell: bash
        run: |
          set +e
          mkdir -p reports
          bun run packages/cloud/scripts/admin/managed-dedicated-canary.ts
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Validate privacy-safe evidence artifact
        id: privacy
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$CLOUD_DEDICATED_CANARY_EVIDENCE_PATH"
          if [[ ! -s "$evidence_path" ]]; then
            echo "::error::Canary produced no evidence artifact to privacy-check."
            exit 1
          fi
          bun -e '
            import { readFileSync, renameSync, writeFileSync } from "node:fs";
            import { canonicalizeManagedDedicatedCanaryArtifact } from "./packages/cloud/scripts/admin/managed-dedicated-canary.ts";
            const evidencePath = process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH;
            if (!evidencePath) {
              console.error("::error::Canary evidence path is not configured.");
              process.exit(1);
            }
            const { canonical, errors } = canonicalizeManagedDedicatedCanaryArtifact(
              readFileSync(evidencePath, "utf8"),
            );
            if (errors.length > 0) {
              console.error("::error::Canary evidence failed strict privacy validation: " + errors.join(","));
              process.exit(1);
            }
            if (canonical === null) process.exit(1);
            const canonicalPath = evidencePath + ".validated-" + process.pid;
            writeFileSync(canonicalPath, canonical, { mode: 0o600 });
            renameSync(canonicalPath, evidencePath);
          '
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Upload privacy-safe timing and path evidence
        if: ${{ always() && steps.privacy.outputs.validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-dedicated-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/managed-dedicated-canary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce live proof, deployed SHA, and cleanup
        if: ${{ always() }}
        env:
          LIVE_PROCESS_STATUS: ${{ steps.live.outputs.status }}
          PRIVACY_VALIDATED: ${{ steps.privacy.outputs.validated }}
          EXPECTED_RECOVERY_REQUESTED: ${{ steps.recovery_intent.outputs.requested }}
          # Canonical staging rejects feature-ref deploys. A labeled PR therefore
          # proves the exact harness at its checked-out head against the deployed
          # base it proposes to extend; post-merge runs prove their own SHA.
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$CLOUD_DEDICATED_CANARY_EVIDENCE_PATH"
          if [[ ! -s "$evidence_path" ]]; then
            echo "::error::Canary produced no evidence; zero-executed/skip outcomes are failures."
            exit 1
          fi
          if [[ "${PRIVACY_VALIDATED:-missing}" != "true" ]]; then
            echo "::error::Canary evidence did not pass the separate strict privacy validator."
            exit 1
          fi

          deployed_commit="$(
            bun -e '
              import { readFileSync } from "node:fs";
              import { validateManagedDedicatedCanaryEvidence } from "./packages/cloud/scripts/admin/managed-dedicated-canary.ts";
              const evidence = JSON.parse(readFileSync(process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH, "utf8"));
              const errors = validateManagedDedicatedCanaryEvidence(evidence);
              const expectedRecoveryRequested =
                process.env.EXPECTED_RECOVERY_REQUESTED === "true";
              if (evidence.recovery?.requested !== expectedRecoveryRequested) {
                errors.push("workflow_recovery_intent_mismatch");
              }
              if (errors.length > 0) {
                console.error("::error::Canary evidence rejected: " + errors.join(","));
                process.exit(1);
              }
              process.stdout.write(evidence.deployedCommit);
            '
          )"

          if [[ "${LIVE_PROCESS_STATUS:-missing}" != "0" ]]; then
            echo "::error::Live canary process exited ${LIVE_PROCESS_STATUS:-without status}."
            exit 1
          fi
          if ! git cat-file -e "${deployed_commit}^{commit}" 2>/dev/null; then
            echo "::error::Staging reported a deploy commit absent from this repository checkout."
            exit 1
          fi
          expected_source_sha="${EXPECTED_SOURCE_SHA:-}"
          if [[ -z "$expected_source_sha" ]] || ! git cat-file -e "${expected_source_sha}^{commit}" 2>/dev/null; then
            echo "::error::Expected canary source commit is absent from this repository checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$expected_source_sha" "$deployed_commit"; then
            echo "::error::Staging deploy does not contain this canary's expected source commit."
            exit 1
          fi

          bun -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(readFileSync(process.env.CLOUD_DEDICATED_CANARY_EVIDENCE_PATH, "utf8"));
            const t = evidence.timingsMs;
            console.log("### Managed dedicated staging canary");
            console.log("");
            console.log("- deployed commit: `" + evidence.deployedCommit + "`");
            console.log("- tier: `" + evidence.path.observedTier + "`");
            console.log("- paths: `" + evidence.path.successfulPaths + "/2`");
            console.log("- bridge transport: `" + evidence.path.bridgeTransport + "`");
            console.log("- chat requests: `" + evidence.capacity.chatRequests + "/" + evidence.capacity.maxChatRequests + "`");
            console.log("- recovery requested: `" + evidence.recovery.requested + "`");
            console.log("- recovery match: `" + evidence.recovery.match + "`");
            console.log("- recovery performed: `" + evidence.recovery.performed + "`");
            console.log("- recovery confirmed: `" + evidence.recovery.confirmed + "`");
            console.log("- cleanup: `" + evidence.cleanup.status + "`");
            console.log("");
            console.log("| phase | ms |");
            console.log("| --- | ---: |");
            for (const phase of ["health", "capacityGuard", "create", "ready", "bridge", "sse", "cleanup", "total"]) {
              if (Number.isFinite(t[phase])) console.log("| " + phase + " | " + t[phase] + " |");
            }
          ' >> "$GITHUB_STEP_SUMMARY"

          echo "Managed dedicated canary passed with exact cleanup."

  diagnose:
    name: Read-only stale canary diagnosis
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_stale_canary_suffix != '' }}
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 10
    env:
      CANARY_DIAGNOSTIC_SUFFIX: ${{ inputs.diagnose_stale_canary_suffix }}
      CANARY_RECOVERY_SUFFIX: ${{ inputs.stale_canary_suffix }}
      CANARY_DIAGNOSTIC_RAW_PATH: reports/managed-dedicated-canary-diagnostic.raw.json
      CANARY_DIAGNOSTIC_EVIDENCE_PATH: reports/managed-dedicated-canary-diagnostic.json
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: canary

      - name: Validate diagnostic contracts
        run: bun test packages/cloud/scripts/admin/managed-dedicated-canary-diagnostic.test.ts

      - name: Query exact stale canary read-only
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=20000
        run: |
          set -euo pipefail
          raw_ready=false
          cleanup_incomplete_raw() {
            if [[ "$raw_ready" != true ]]; then
              rm -f -- "$CANARY_DIAGNOSTIC_RAW_PATH"
            fi
          }
          trap cleanup_incomplete_raw EXIT
          if [[ ! "$CANARY_DIAGNOSTIC_SUFFIX" =~ ^r[1-9][0-9]{7,19}a[1-9][0-9]{0,3}$ ]]; then
            echo "::error::Diagnostic suffix is invalid."
            exit 1
          fi
          if [[ -n "$CANARY_RECOVERY_SUFFIX" ]]; then
            echo "::error::Diagnostic and mutation recovery inputs are mutually exclusive."
            exit 1
          fi
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Staging DATABASE_URL is unavailable."
            exit 1
          fi

          mkdir -p reports
          umask 077
          PSQL_DATABASE_URL="$(
            bun packages/cloud/scripts/admin/libpq-connection-url.ts
          )"
          echo "::add-mask::$PSQL_DATABASE_URL"
          psql "$PSQL_DATABASE_URL" \
            --no-psqlrc \
            --no-align \
            --tuples-only \
            --quiet \
            --set ON_ERROR_STOP=1 \
            --set suffix="$CANARY_DIAGNOSTIC_SUFFIX" \
            > "$CANARY_DIAGNOSTIC_RAW_PATH" <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '20s';
          WITH target AS (
            SELECT
              id,
              status,
              error_message,
              error_count,
              deletion_attempt_id IS NOT NULL AS deletion_owned,
              deletion_started_at,
              updated_at,
              sandbox_id IS NOT NULL AS sandbox_id_present,
              node_id IS NOT NULL AS node_id_present,
              container_name IS NOT NULL AS container_name_present
            FROM agent_sandboxes
            WHERE agent_name = 'managed-dedicated-canary-' || :'suffix'
          ),
          newest_jobs AS (
            SELECT
              jobs.id AS sort_id,
              jobs.created_at AS sort_created_at,
              json_build_object(
                'status', jobs.status,
                'error', jobs.error,
                'result', CASE
                  WHEN jobs.result IS NULL THEN NULL
                  ELSE json_build_object(
                    'containerStopped', jobs.result -> 'containerStopped',
                    'rowDeleted', jobs.result -> 'rowDeleted',
                    'error', jobs.result -> 'error'
                  )
                END,
                'attempts', jobs.attempts,
                'maxAttempts', jobs.max_attempts,
                'resultStorage', jobs.result_storage,
                'errorStorage', jobs.error_storage,
                'scheduledFor', jobs.scheduled_for,
                'startedAt', jobs.started_at,
                'completedAt', jobs.completed_at,
                'createdAt', jobs.created_at,
                'updatedAt', jobs.updated_at
              ) AS diagnostic
            FROM jobs
            INNER JOIN target ON target.id::text = jobs.agent_id
            WHERE jobs.type = 'agent_delete'
            ORDER BY jobs.created_at DESC, jobs.id DESC
            LIMIT 3
          )
          SELECT json_build_object(
            'targetCount', (SELECT count(*) FROM target),
            'agent', (
              SELECT json_build_object(
                'status', status,
                'errorMessage', error_message,
                'errorCount', error_count,
                'deletionOwned', deletion_owned,
                'deletionStartedAt', deletion_started_at,
                'updatedAt', updated_at,
                'locator', json_build_object(
                  'sandboxIdPresent', sandbox_id_present,
                  'nodeIdPresent', node_id_present,
                  'containerNamePresent', container_name_present
                )
              )
              FROM target
              LIMIT 1
            ),
            'jobs', COALESCE(
              (
                SELECT json_agg(
                  newest_jobs.diagnostic
                  ORDER BY newest_jobs.sort_created_at DESC, newest_jobs.sort_id DESC
                )
                FROM newest_jobs
              ),
              '[]'::json
            )
          );
          COMMIT;
          SQL
          raw_ready=true

      - name: Classify privacy-safe diagnostic
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f -- "$CANARY_DIAGNOSTIC_RAW_PATH"' EXIT
          bun run packages/cloud/scripts/admin/managed-dedicated-canary-diagnostic.ts \
            "$CANARY_DIAGNOSTIC_SUFFIX" \
            "$CANARY_DIAGNOSTIC_RAW_PATH" \
            "$CANARY_DIAGNOSTIC_EVIDENCE_PATH"

      - name: Upload privacy-safe diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-dedicated-canary-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/managed-dedicated-canary-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize classified result
        shell: bash
        run: |
          set -euo pipefail
          bun -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(
              readFileSync(process.env.CANARY_DIAGNOSTIC_EVIDENCE_PATH, "utf8"),
            );
            const latestJob = evidence.jobs[0];
            console.log("### Managed dedicated staging canary diagnostic");
            console.log("");
            console.log("- exact target count: `" + evidence.targetCount + "`");
            console.log("- sandbox status: `" + evidence.sandbox.status + "`");
            console.log("- sandbox error class: `" + evidence.sandbox.errorCode + "`");
            console.log("- latest job status: `" + latestJob.status + "`");
            console.log("- latest job error class: `" + latestJob.errorCode + "`");
            console.log("- latest job recovery class: `" + latestJob.recoveryCode + "`");
            console.log("- latest persisted result class: `" + latestJob.resultErrorCode + "`");
            console.log("- attempts: `" + latestJob.attempts + "/" + latestJob.maxAttempts + "`");
            console.log("- container stopped: `" + latestJob.containerStopped + "`");
            console.log("- row deleted: `" + latestJob.rowDeleted + "`");
          ' >> "$GITHUB_STEP_SUMMARY"
