name: Release Candidate Proof

# Runs the credential-free candidate and real local transport integrations on
# the exact pull-request head whenever release authority changes. The uploaded
# receipts bind that head to immutable plan/tarball, Verdaccio, bare-Git, and
# loopback GitHub artifacts without exposing or requesting publication secrets.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/actions/setup-bun-workspace/**
      - .github/workflows/release-candidate-pr.yml
      - .github/workflows/release-orchestrator.yml
      - .github/workflows/release.yaml
      - packages/scripts/__tests__/release-*.test.ts
      - packages/scripts/lib/release-*.mjs
      - packages/scripts/release-candidate.mjs
      - packages/scripts/release-cohort.json
      - turbo.json

permissions:
  contents: read

concurrency:
  group: release-candidate-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Credential-free candidate and transports
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup credential-free workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          run-postinstall: "false"

      - name: Prove setup preserved exact source bytes
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Exercise candidate and real local transports
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
        run: >-
          bun test
          packages/scripts/__tests__/release-candidate.test.ts
          packages/scripts/__tests__/release-contract.test.ts
          packages/scripts/__tests__/release-git.integration.test.ts
          packages/scripts/__tests__/release-github.integration.test.ts
          packages/scripts/__tests__/release-manifests.test.ts
          packages/scripts/__tests__/release-registry.test.ts
          packages/scripts/__tests__/release-verdaccio.integration.test.ts
          packages/scripts/__tests__/release-workflow.test.ts

      - name: Bind receipts to workflow and source identity
        env:
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/release-evidence
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const receipt = {
            schemaVersion: 1,
            repository: process.env.REPOSITORY,
            headSha: process.env.HEAD_SHA,
            workflowRef: process.env.WORKFLOW_REF,
            workflowSha: process.env.WORKFLOW_SHA,
            runId: process.env.RUN_ID,
            credentialMode: "contents-read/no-persisted-git/no-publication-secrets",
          };
          fs.mkdirSync(process.env.EVIDENCE_DIRECTORY, { recursive: true });
          fs.writeFileSync(
            path.join(process.env.EVIDENCE_DIRECTORY, "workflow-receipt.json"),
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE

      - name: Upload immutable exact-head receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-proof-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 30
