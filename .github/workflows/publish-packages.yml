name: Publish Packages

# Post-release package distribution. Called by release-orchestrator.yml or
# manually dispatched for retries / ad-hoc republish operations.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0.0-beta.0)"
        required: true
        type: string
      pypi:
        description: "Publish to PyPI"
        required: false
        type: boolean
        default: true
      snap:
        description: "Publish to Snap Store"
        required: false
        type: boolean
        default: true
      flatpak:
        description: "Build the x86_64 Flatpak side-load bundle"
        required: false
        type: boolean
        default: true
      apt:
        description: "Build Debian package"
        required: false
        type: boolean
        default: true
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false
      DEBIAN_GPG_PRIVATE_KEY:
        required: false
      DEBIAN_GPG_KEY_ID:
        required: false
      DEBIAN_GPG_PASSPHRASE:
        required: false
      PYPI_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0.0-beta.0)"
        required: true
        type: string
      pypi:
        description: "Publish to PyPI"
        type: boolean
        default: true
      snap:
        description: "Publish to Snap Store"
        type: boolean
        default: true
      flatpak:
        description: "Build the x86_64 Flatpak side-load bundle"
        type: boolean
        default: true
      apt:
        description: "Build Debian package"
        type: boolean
        default: true

concurrency:
  group: publish-packages
  cancel-in-progress: false

env:
  CI: "true"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      npm_version: ${{ steps.ver.outputs.npm_version }}
      pypi_version: ${{ steps.ver.outputs.pypi_version }}
      deb_version: ${{ steps.ver.outputs.deb_version }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
    steps:
      - name: Determine versions
        id: ver
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Release version must be stable, beta.N, or rc.N semver"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$VERSION" >> "$GITHUB_OUTPUT"

          PYPI_VERSION="$(printf '%s\n' "$VERSION" | sed -E 's/-beta\.([0-9]+)$/b\1/; s/-rc\.([0-9]+)$/rc\1/')"
          echo "pypi_version=$PYPI_VERSION" >> "$GITHUB_OUTPUT"

          DEB_VERSION="$(printf '%s\n' "$VERSION" | sed -E 's/-beta\./~beta/; s/-rc\./~rc/')"
          echo "deb_version=${DEB_VERSION}-1" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ -(beta|rc)\. ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            IS_PRERELEASE=true
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            IS_PRERELEASE=false
          fi

          echo "Version: $VERSION"
          echo "PyPI: $PYPI_VERSION"
          echo "Debian: ${DEB_VERSION}-1"
          echo "Pre-release: $IS_PRERELEASE"

  # ── PyPI ───────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: prepare
    if: inputs.pypi
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    permissions:
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/elizaos-app/${{ needs.prepare.outputs.pypi_version }}/
    steps:
      - name: Require PyPI credentials
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PYPI_TOKEN" ]]; then
            echo "::error::PyPI publishing is enabled but PYPI_TOKEN is unavailable"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: v${{ needs.prepare.outputs.version }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release tag identity
        env:
          EXPECTED_TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "$EXPECTED_TAG^{commit}")"
          if [[ "$HEAD_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "::error::Checkout $HEAD_COMMIT does not match $EXPECTED_TAG at $TAG_COMMIT"
            exit 1
          fi
          test "$(git tag --points-at HEAD --list "$EXPECTED_TAG")" = "$EXPECTED_TAG"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"
          check-latest: false

      - name: Verify release source version
        run: |
          set -euo pipefail
          EXPECTED="${{ needs.prepare.outputs.npm_version }}"
          for manifest in packages/agent/package.json packages/elizaos/package.json; do
            ACTUAL="$(node -p "require('./${manifest}').version")"
            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "::error::$manifest is $ACTUAL; release input is $EXPECTED"
              exit 1
            fi
          done

      - name: Update version in source
        working-directory: packages/app-core/packaging/pypi
        run: |
          PYPI_VERSION="${{ needs.prepare.outputs.pypi_version }}"
          sed -i "s/^version = .*/version = \"$PYPI_VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$PYPI_VERSION\"/" elizaos_app/__init__.py
          echo "Updated to version: $PYPI_VERSION"
          grep "version" pyproject.toml | head -1
          grep "__version__" elizaos_app/__init__.py

      - name: Build package
        working-directory: packages/app-core/packaging/pypi
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement build-requirements.lock
          DIST_DIR="$RUNNER_TEMP/elizaos-pypi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$DIST_DIR"
          python -m build --no-isolation --outdir "$DIST_DIR"
          python verify_artifacts.py "$DIST_DIR"
          echo "Built packages:"
          ls -lh "$DIST_DIR"

      - name: Validate package
        working-directory: packages/app-core/packaging/pypi
        run: |
          python -m twine check "$RUNNER_TEMP"/elizaos-pypi-"${GITHUB_RUN_ID}"-"${GITHUB_RUN_ATTEMPT}"/*

      - name: Test package installs
        working-directory: packages/app-core/packaging/pypi
        run: |
          set -euo pipefail
          python -m unittest -v test_loader.py
          wheels=("$RUNNER_TEMP"/elizaos-pypi-"${GITHUB_RUN_ID}"-"${GITHUB_RUN_ATTEMPT}"/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install --no-deps "${wheels[0]}"
          python -c "import elizaos_app; print(f'elizaos_app {elizaos_app.__version__} loaded OK')"
          python -c "
          from elizaos_app.loader import _parse_version
          assert _parse_version('v22.12.0') == (22, 12, 0)
          print('Loader tests passed')
          "
          EXPECTED="${{ needs.prepare.outputs.npm_version }}"
          for attempt in $(seq 1 30); do
            if npm view "elizaos@${EXPECTED}" version --json >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "::error::elizaos@${EXPECTED} was not available for the real launcher smoke"
              exit 1
            fi
            sleep 20
          done
          test "$(timeout 180 elizaos-app --version)" = "$EXPECTED"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: ${{ runner.temp }}/elizaos-pypi-${{ github.run_id }}-${{ github.run_attempt }}/
          password: ${{ secrets.PYPI_TOKEN }}
          attestations: false

  # ── Homebrew ───────────────────────────────────────────────────────────
  # NOTE: Homebrew tap updates are handled by the standalone update-homebrew.yml
  # workflow, which triggers via repository_dispatch. Do not duplicate here.

  # ── Snap ───────────────────────────────────────────────────────────────
  publish-snap:
    name: Publish Snap Store package
    needs: prepare
    if: inputs.snap
    uses: ./.github/workflows/snap-publish.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.is_prerelease == 'true' && 'beta' || 'stable' }}
      tag: v${{ needs.prepare.outputs.version }}
    secrets: inherit
  # ── Debian / apt ───────────────────────────────────────────────────────
  build-deb:
    name: Build Debian Package
    needs: prepare
    if: inputs.apt
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # gh release upload
    steps:
      - name: Free disk space on runner
        run: |
          set -euo pipefail
          echo "=== before ==="
          df -h /
          # error-policy:J6 optional hosted-runner toolchains are reclaimed on
          # a best-effort basis; package verification remains fail-closed.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== after ==="
          df -h /
          AVAILABLE_KB="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          MIN_FREE_KB=$((30 * 1024 * 1024))
          if (( AVAILABLE_KB < MIN_FREE_KB )); then
            echo "::error::Debian build requires at least 30 GiB free; found ${AVAILABLE_KB} KiB"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: v${{ needs.prepare.outputs.version }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release tag identity
        env:
          EXPECTED_TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "$EXPECTED_TAG^{commit}")"
          if [[ "$HEAD_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "::error::Checkout $HEAD_COMMIT does not match $EXPECTED_TAG at $TAG_COMMIT"
            exit 1
          fi
          test "$(git tag --points-at HEAD --list "$EXPECTED_TAG")" = "$EXPECTED_TAG"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"
          check-latest: false

      - name: Install Debian build prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            debhelper \
            devscripts \
            fakeroot \
            lintian \
            xz-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "canary"

      - name: Install workspace dependencies
        run: bun run install:light

      - name: Verify release source version
        run: |
          set -euo pipefail
          EXPECTED="${{ needs.prepare.outputs.npm_version }}"
          ACTUAL="$(node -p "require('./packages/agent/package.json').version")"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build agent runtime closure
        run: >-
          node packages/scripts/run-turbo.mjs run build
          --filter=@elizaos/agent...
          --concurrency=8

      - name: Prepare packaged runtime
        run: >-
          node packages/scripts/prepare-packaged-runtime.mjs
          --source-root .
          --destination-root packages/app-core/packaging/debian/runtime
          --entry @elizaos/agent
          --stub @elizaos/plugin-vision
          --stub @elizaos/plugin-wallet
          --stub @elizaos/plugin-whatsapp

      - name: Provision locked Node.js runtime
        run: >-
          node packages/scripts/locked-node-runtime.mjs
          packages/app-core/packaging/debian/node-runtime

      - name: Generate runtime license inventory
        run: >-
          node packages/app-core/packaging/generate-license-inventory.mjs
          packages/app-core/packaging/debian/runtime

      - name: Reject bundled FFmpeg executables
        env:
          PACKAGED_RUNTIME: packages/app-core/packaging/debian/runtime
        run: |
          set -euo pipefail
          test -d "$PACKAGED_RUNTIME"
          mapfile -t bundled_media_bins < <(
            find "$PACKAGED_RUNTIME" \
              \( -type f -o -type l \) \
              \( -name ffmpeg -o -name ffmpeg.exe -o -name ffprobe -o -name ffprobe.exe \) \
              -print
          )
          if [[ "${#bundled_media_bins[@]}" -ne 0 ]]; then
            printf 'Packaged runtime must not redistribute FFmpeg executables:\n' >&2
            printf '  %s\n' "${bundled_media_bins[@]}" >&2
            exit 1
          fi

      - name: Prepare debian packaging
        run: |
          set -euo pipefail
          test ! -e debian
          install -d debian
          git archive --format=tar HEAD packages/app-core/packaging/debian | \
            tar --extract --directory=debian --strip-components=4
          test ! -e debian/runtime
          test ! -e debian/node-runtime

          # Update changelog version
          DEB_VERSION="${{ needs.prepare.outputs.deb_version }}"
          sed -i "1s/([^)]*)/($DEB_VERSION)/" debian/changelog
          sed -i "1s/UNRELEASED/unstable/" debian/changelog

          echo "Debian version: $DEB_VERSION"
          head -3 debian/changelog
          dpkg-checkbuilddeps debian/control

      - name: Build .deb package
        run: |
          set -euo pipefail
          dpkg-buildpackage -us -uc -b
          echo "Built packages:"
          ls -lh ../*.deb
          mkdir -p deb-output
          mapfile -t main_debs < <(
            find .. -maxdepth 1 -type f -name 'elizaos-app_*.deb' \
              ! -name '*-dbgsym_*' -print
          )
          if [[ "${#main_debs[@]}" -ne 1 ]]; then
            printf 'Expected one main elizaos-app .deb, found %s\n' \
              "${#main_debs[@]}" >&2
            printf '%s\n' "${main_debs[@]}" >&2
            exit 1
          fi
          bash packages/app-core/packaging/debian/verify-maintainer-scripts.sh \
            "${main_debs[0]}"
          cp "${main_debs[0]}" deb-output/

      - name: Reject FFmpeg executables in final Debian payload
        run: |
          set -euo pipefail
          mapfile -t main_debs < <(
            find deb-output -maxdepth 1 -type f -name 'elizaos-app_*.deb' \
              ! -name '*-dbgsym_*' -print
          )
          test "${#main_debs[@]}" -eq 1
          PAYLOAD_ROOT="$RUNNER_TEMP/elizaos-deb-payload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test ! -e "$PAYLOAD_ROOT"
          cleanup_payload_root() {
            rm -rf -- "$PAYLOAD_ROOT"
          }
          trap cleanup_payload_root EXIT
          dpkg-deb --extract "${main_debs[0]}" "$PAYLOAD_ROOT"
          mapfile -t bundled_media_bins < <(
            find "$PAYLOAD_ROOT" \
              \( -type f -o -type l \) \
              \( -iname ffmpeg -o -iname ffmpeg.exe -o -iname ffprobe -o -iname ffprobe.exe \) \
              -print
          )
          if [[ "${#bundled_media_bins[@]}" -ne 0 ]]; then
            printf 'Final Debian payload must not redistribute FFmpeg executables:\n' >&2
            printf '  %s\n' "${bundled_media_bins[@]}" >&2
            exit 1
          fi
          rm -rf -- "$PAYLOAD_ROOT"
          trap - EXIT

      - name: Lint .deb with lintian
        run: |
          set +e
          lintian --fail-on error -i --pedantic --no-tag-display-limit \
            deb-output/elizaos-app_*.deb > lintian.log 2>&1
          LINTIAN_EXIT=$?
          set -e
          while IFS= read -r line; do
            case "$line" in
              E:*) echo "::error::lintian: $line" ;;
              W:*) echo "::warning::lintian: $line" ;;
              I:*|P:*) echo "::notice::lintian: $line" ;;
            esac
          done < lintian.log
          if [[ "$LINTIAN_EXIT" -ne 0 ]] || grep -Eq '^E:' lintian.log; then
            echo "::error::lintian reported a policy error (exit $LINTIAN_EXIT)"
            exit 1
          fi

      - name: Upload lintian log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-debian-lintian-log
          path: lintian.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Test .deb package
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.npm_version }}
        run: |
          set -euo pipefail
          mapfile -t main_debs < <(
            find deb-output -maxdepth 1 -type f -name 'elizaos-app_*.deb' \
              ! -name '*-dbgsym_*' -print
          )
          test "${#main_debs[@]}" -eq 1
          DEB_PATH="$(realpath "${main_debs[0]}")"
          DEB_DEPENDS="$(dpkg-deb -f "$DEB_PATH" Depends)"
          if grep -Eq '(^|[,[:space:]])nodejs([,[:space:]()]|$)' <<< "$DEB_DEPENDS"; then
            echo "::error::Debian package unexpectedly depends on host nodejs: $DEB_DEPENDS"
            exit 1
          fi
          if [[ "$DEB_DEPENDS" == *'${'* ]] ||
             ! grep -Eq '(^|,[[:space:]]*)libc6([[:space:],(]|$)' <<< "$DEB_DEPENDS" ||
             ! grep -Eq '(^|,[[:space:]]*)libstdc\+\+6([[:space:],(]|$)' <<< "$DEB_DEPENDS"; then
            echo "::error::Debian shared-library dependencies were not derived: $DEB_DEPENDS"
            exit 1
          fi
          sudo apt-get install -y "$DEB_PATH"
          BUNDLED_NODE=/usr/lib/elizaos-app/node/bin/node
          test "$("$BUNDLED_NODE" --version)" = "v24.15.0"
          test "$(sha256sum "$BUNDLED_NODE" | cut -d' ' -f1)" = \
            "d1de76d8edf2fededf6f8b30d244e2c0529ac607923a018283b77e9c74bd932c"
          test -s /usr/lib/elizaos-app/node/LICENSE
          test -s /usr/lib/elizaos-app/node/elizaos-runtime-provenance.json
          test -L /usr/lib/elizaos-app/node/bin/npm
          test -f /usr/lib/elizaos-app/node/include/node/node.h
          test -f /usr/lib/elizaos-app/node/lib/node_modules/npm/package.json
          test -s /usr/lib/elizaos-app/LICENSE
          test -s /usr/lib/elizaos-app/THIRD_PARTY_NOTICES.json
          # Hosts may legitimately strip /usr/share/doc at install time (dpkg
          # path-exclude on GitHub runners and minimal containers), so the
          # Debian-policy doc copies are asserted against the package payload,
          # never the installed filesystem.
          for doc_copy in \
            "nodejs-LICENSE:/usr/lib/elizaos-app/node/LICENSE" \
            "nodejs-runtime-provenance.json:/usr/lib/elizaos-app/node/elizaos-runtime-provenance.json" \
            "elizaos-LICENSE:/usr/lib/elizaos-app/LICENSE" \
            "third-party-notices.json:/usr/lib/elizaos-app/THIRD_PARTY_NOTICES.json"; do
            doc_name="${doc_copy%%:*}"
            runtime_copy="${doc_copy#*:}"
            dpkg-deb --fsys-tarfile "$DEB_PATH" |
              tar -xO "./usr/share/doc/elizaos-app/$doc_name" |
              cmp - "$runtime_copy"
          done
          test "$(sha256sum /usr/lib/elizaos-app/LICENSE | cut -d ' ' -f 1)" = \
            "d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d"
          "$BUNDLED_NODE" -e '
          const inventory = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
          if (
            inventory.schemaVersion !== 1 ||
            inventory.project.sha256 !== "d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d" ||
            inventory.packageCount !== inventory.packages.length ||
            inventory.packageCount < 1 ||
            inventory.licenseTextCount !== inventory.licenseTexts.length ||
            inventory.licenseTextCount < 1 ||
            inventory.packages.some((entry) => !entry.licenseDeclared)
          ) process.exit(1);
          ' /usr/lib/elizaos-app/THIRD_PARTY_NOTICES.json

          grep -Fq 'export PATH=/usr/lib/elizaos-app/node/bin:$PATH' \
            /usr/bin/elizaos-app
          grep -Fq \
            'exec /usr/lib/elizaos-app/node/bin/node /usr/lib/elizaos-app/node_modules/@elizaos/agent/bin.js' \
            /usr/bin/elizaos-app
          "$BUNDLED_NODE" --input-type=module <<'NODE_PROVENANCE'
          import { readFileSync } from "node:fs";
          const provenance = JSON.parse(readFileSync(
            "/usr/lib/elizaos-app/node/elizaos-runtime-provenance.json",
            "utf8",
          ));
          if (
            provenance.version !== "24.15.0" ||
            provenance.platform !== "linux-x64" ||
            provenance.archiveSha256 !== "472655581fb851559730c48763e0c9d3bc25975c59d518003fc0849d3e4ba0f6" ||
            provenance.executableSha256 !== "d1de76d8edf2fededf6f8b30d244e2c0529ac607923a018283b77e9c74bd932c" ||
            provenance.source?.sha256 !== "a4f653d79ed140aaad921e8c22a3b585ca85cfdab80d4030f6309e4663a8a1c8"
          ) {
            throw new Error(`Unexpected installed Node.js provenance: ${JSON.stringify(provenance)}`);
          }
          NODE_PROVENANCE
          MEDIA_SMOKE="$(mktemp --suffix=.mp4)"
          trap 'rm -f "$MEDIA_SMOKE"' EXIT
          /usr/bin/ffmpeg -hide_banner -loglevel error \
            -f lavfi -i color=c=black:s=16x16:d=0.04 \
            -c:v libx264 -pix_fmt yuv420p -y "$MEDIA_SMOKE"
          CODEC_NAME="$(
            /usr/bin/ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name \
              -of default=noprint_wrappers=1:nokey=1 "$MEDIA_SMOKE"
          )"
          test "$CODEC_NAME" = h264
          rm -f "$MEDIA_SMOKE"
          trap - EXIT
          test "$(PATH=/nonexistent /usr/bin/elizaos-app --version)" = \
            "$EXPECTED_VERSION"
          PATH=/usr/bin:/bin "$BUNDLED_NODE" packages/scripts/verify-packaged-cli.mjs \
            --expected "$EXPECTED_VERSION" \
            --health-url http://127.0.0.1:43138/api/health \
            --service-arg serve \
            -- /usr/bin/elizaos-app

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debian-package
          path: deb-output/
          retention-days: 90

      - name: Attach .deb to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.prepare.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No GitHub release found for $TAG; cannot attach .deb artifacts."
            exit 1
          fi
          mapfile -t main_debs < <(
            find deb-output -maxdepth 1 -type f -name 'elizaos-app_*.deb' \
              ! -name '*-dbgsym_*' -print
          )
          test "${#main_debs[@]}" -eq 1
          LOCAL_DEB="${main_debs[0]}"
          LOCAL_NAME="$(basename "$LOCAL_DEB")"
          EXISTING_DEB_NAMES="$(
            gh release view "$TAG" --json assets \
              --jq '.assets[].name | select(test("^elizaos-app_.*\\.deb$"))'
          )"
          existing_debs=()
          if [[ -n "$EXISTING_DEB_NAMES" ]]; then
            mapfile -t existing_debs <<< "$EXISTING_DEB_NAMES"
          fi
          if [[ "${#existing_debs[@]}" -gt 1 ]]; then
            echo "::error::Release $TAG contains multiple main elizaos-app .deb assets"
            exit 1
          fi
          if [[ "${#existing_debs[@]}" -eq 1 ]]; then
            if [[ "${existing_debs[0]}" != "$LOCAL_NAME" ]]; then
              echo "::error::Release $TAG already contains ${existing_debs[0]}; expected $LOCAL_NAME"
              exit 1
            fi
            ASSET_CHECK_DIR="$RUNNER_TEMP/elizaos-release-asset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
            test ! -e "$ASSET_CHECK_DIR"
            install -d -m 700 "$ASSET_CHECK_DIR"
            cleanup_asset_check_dir() {
              rm -rf -- "$ASSET_CHECK_DIR"
            }
            trap cleanup_asset_check_dir EXIT
            gh release download "$TAG" \
              --pattern "$LOCAL_NAME" \
              --dir "$ASSET_CHECK_DIR"
            DOWNLOADED_DEB="$ASSET_CHECK_DIR/$LOCAL_NAME"
            test -f "$DOWNLOADED_DEB"
            LOCAL_SHA256="$(sha256sum "$LOCAL_DEB" | cut -d ' ' -f 1)"
            RELEASE_SHA256="$(sha256sum "$DOWNLOADED_DEB" | cut -d ' ' -f 1)"
            if [[ "$LOCAL_SHA256" != "$RELEASE_SHA256" ]]; then
              echo "::error::Release $TAG already contains $LOCAL_NAME with different bytes"
              exit 1
            fi
            echo "Release $TAG already contains the byte-identical $LOCAL_NAME"
          else
            gh release upload "$TAG" "$LOCAL_DEB"
          fi

  publish-apt:
    name: Publish Signed APT Repository
    needs: [prepare, build-deb]
    if: inputs.apt
    permissions:
      contents: write
    uses: ./.github/workflows/publish-apt-repo.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: v${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.is_prerelease == 'true' && 'beta' || 'stable' }}
    secrets: inherit

  # ── Flatpak ────────────────────────────────────────────────────────────
  build-flatpak:
    name: Build x86_64 Flatpak Side-load Bundle
    needs: prepare
    if: inputs.flatpak
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    permissions:
      contents: write  # gh release upload
    steps:
      - name: Free disk space on hosted runner
        if: vars.HETZNER_FLEET_ONLINE == 'false'
        run: |
          set -euo pipefail
          echo "=== before ==="
          df -h /
          # error-policy:J6 optional hosted-runner toolchains are reclaimed on
          # a best-effort basis; package verification remains fail-closed.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== after ==="
          df -h /
          AVAILABLE_KB="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          MIN_FREE_KB=$((30 * 1024 * 1024))
          if (( AVAILABLE_KB < MIN_FREE_KB )); then
            echo "::error::Flatpak build requires at least 30 GiB free; found ${AVAILABLE_KB} KiB"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: v${{ needs.prepare.outputs.version }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release tag identity
        env:
          EXPECTED_TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "$EXPECTED_TAG^{commit}")"
          if [[ "$HEAD_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "::error::Checkout $HEAD_COMMIT does not match $EXPECTED_TAG at $TAG_COMMIT"
            exit 1
          fi
          test "$(git tag --points-at HEAD --list "$EXPECTED_TAG")" = "$EXPECTED_TAG"

      - name: Initialize isolated Flatpak environment
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          ISOLATION_ROOT="/tmp/elizaos-flatpak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test ! -e "$ISOLATION_ROOT"
          install -d -m 700 \
            "$ISOLATION_ROOT/home" \
            "$ISOLATION_ROOT/config" \
            "$ISOLATION_ROOT/cache" \
            "$ISOLATION_ROOT/data" \
            "$ISOLATION_ROOT/state" \
            "$ISOLATION_ROOT/runtime" \
            "$ISOLATION_ROOT/tmp" \
            "$ISOLATION_ROOT/verifier"
          {
            echo "FLATPAK_ISOLATION_ROOT=$ISOLATION_ROOT"
            echo "HOME=$ISOLATION_ROOT/home"
            echo "XDG_CONFIG_HOME=$ISOLATION_ROOT/config"
            echo "XDG_CACHE_HOME=$ISOLATION_ROOT/cache"
            echo "XDG_DATA_HOME=$ISOLATION_ROOT/data"
            echo "XDG_STATE_HOME=$ISOLATION_ROOT/state"
            echo "XDG_RUNTIME_DIR=$ISOLATION_ROOT/runtime"
            echo "TMPDIR=$ISOLATION_ROOT/tmp"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"
          check-latest: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "canary"

      - name: Install workspace dependencies
        run: bun run install:light

      - name: Verify release source version
        run: |
          set -euo pipefail
          EXPECTED="${{ needs.prepare.outputs.npm_version }}"
          ACTUAL="$(node -p "require('./packages/agent/package.json').version")"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build agent runtime closure
        run: >-
          node packages/scripts/run-turbo.mjs run build
          --filter=@elizaos/agent...
          --concurrency=8

      - name: Prepare packaged runtime
        run: >-
          node packages/scripts/prepare-packaged-runtime.mjs
          --source-root .
          --destination-root packages/app-core/packaging/flatpak/runtime
          --entry @elizaos/agent
          --stub @elizaos/plugin-vision
          --stub @elizaos/plugin-wallet
          --stub @elizaos/plugin-whatsapp
          --target-os linux
          --target-cpu x64

      - name: Generate runtime license inventory
        run: >-
          node packages/app-core/packaging/generate-license-inventory.mjs
          packages/app-core/packaging/flatpak/runtime

      - name: Reject bundled FFmpeg executables
        env:
          PACKAGED_RUNTIME: packages/app-core/packaging/flatpak/runtime
        run: |
          set -euo pipefail
          test -d "$PACKAGED_RUNTIME"
          mapfile -t bundled_media_bins < <(
            find "$PACKAGED_RUNTIME" \
              \( -type f -o -type l \) \
              \( -name ffmpeg -o -name ffmpeg.exe -o -name ffprobe -o -name ffprobe.exe \) \
              -print
          )
          if [[ "${#bundled_media_bins[@]}" -ne 0 ]]; then
            printf 'Packaged runtime must not redistribute FFmpeg executables:\n' >&2
            printf '  %s\n' "${bundled_media_bins[@]}" >&2
            exit 1
          fi

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          sudo flatpak remote-add --if-not-exists --system flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --system flathub org.freedesktop.Platform//24.08
          sudo flatpak install -y --system flathub org.freedesktop.Sdk//24.08
          sudo flatpak install -y --system flathub org.freedesktop.Platform.ffmpeg-full//24.08

      - name: Prepare Flatpak release manifest
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.npm_version }}"
          TODAY="$(date -u +%F)"
          METAINFO="packages/app-core/packaging/flatpak/ai.elizaos.App.metainfo.xml"

          sed -i -E \
            "s#<release version=\"[^\"]+\" date=\"[^\"]+\">#<release version=\"${VERSION}\" date=\"${TODAY}\">#" \
            "$METAINFO"

          grep -n "<release version" "$METAINFO" | head -1

      - name: Build Flatpak
        working-directory: packages/app-core/packaging/flatpak
        run: |
          flatpak-builder --repo=repo --force-clean build-dir ai.elizaos.App.yml
          flatpak build-bundle repo elizaos-app.flatpak ai.elizaos.App

      - name: Test Flatpak
        working-directory: packages/app-core/packaging/flatpak
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.npm_version }}
        run: |
          set -euo pipefail
          mapfile -t APP_REFS < <(
            ostree --repo=repo refs |
              grep '^app/ai\.elizaos\.App/'
          )
          if [[ "${#APP_REFS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one ai.elizaos.App ref in the release repository"
            exit 1
          fi
          EXPECTED_COMMIT="$(ostree --repo=repo rev-parse "${APP_REFS[0]}")"
          APP_CHECKOUT="$RUNNER_TEMP/elizaos-flatpak-payload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test ! -e "$APP_CHECKOUT"
          cleanup_app_checkout() {
            rm -rf -- "$APP_CHECKOUT"
          }
          trap cleanup_app_checkout EXIT
          ostree --repo=repo checkout "$EXPECTED_COMMIT" "$APP_CHECKOUT"
          test -d "$APP_CHECKOUT/files"
          mapfile -t bundled_media_bins < <(
            find "$APP_CHECKOUT/files" \
              \( -type f -o -type l \) \
              \( -iname ffmpeg -o -iname ffmpeg.exe -o -iname ffprobe -o -iname ffprobe.exe \) \
              -print
          )
          if [[ "${#bundled_media_bins[@]}" -ne 0 ]]; then
            printf 'Final Flatpak app payload must not redistribute FFmpeg executables:\n' >&2
            printf '  %s\n' "${bundled_media_bins[@]}" >&2
            exit 1
          fi
          rm -rf -- "$APP_CHECKOUT"
          trap - EXIT
          sudo flatpak --system install -y --reinstall elizaos-app.flatpak
          INSTALLED_COMMIT="$(sudo flatpak --system info --show-commit ai.elizaos.App)"
          if [[ "$INSTALLED_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::Installed Flatpak commit $INSTALLED_COMMIT does not match bundle commit $EXPECTED_COMMIT"
            exit 1
          fi
          sudo flatpak --system run --command=/bin/sh ai.elizaos.App -s <<'FLATPAK_MEDIA'
          set -eu
          NODE_LICENSE=/app/share/licenses/ai.elizaos.App/nodejs-LICENSE
          NODE_PROVENANCE=/app/share/licenses/ai.elizaos.App/nodejs-runtime-provenance.json
          test "$(/app/bin/node --version)" = v24.15.0
          test "$(/usr/bin/sha256sum /app/bin/node | /usr/bin/cut -d ' ' -f 1)" = d1de76d8edf2fededf6f8b30d244e2c0529ac607923a018283b77e9c74bd932c
          test "$(/usr/bin/sha256sum "$NODE_LICENSE" | /usr/bin/cut -d ' ' -f 1)" = 4573185d56580da2b890ba34a85a409257640f1c5632eade4300137266194d18
          test "$(/usr/bin/sha256sum "$NODE_PROVENANCE" | /usr/bin/cut -d ' ' -f 1)" = 7b8cd9c2ea24afdb7ad8b1a0ba29a205909181a82ca25c3f45bcea96b9a8cc5f
          PROJECT_LICENSE=/app/share/licenses/ai.elizaos.App/elizaos-LICENSE
          THIRD_PARTY_NOTICES=/app/share/licenses/ai.elizaos.App/third-party-notices.json
          test "$(/usr/bin/sha256sum "$PROJECT_LICENSE" | /usr/bin/cut -d ' ' -f 1)" = d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d
          /usr/bin/cmp "$PROJECT_LICENSE" /app/lib/elizaos-app/LICENSE
          /usr/bin/cmp "$THIRD_PARTY_NOTICES" /app/lib/elizaos-app/THIRD_PARTY_NOTICES.json
          /app/bin/node -e '
          const inventory = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
          if (
            inventory.schemaVersion !== 1 ||
            inventory.project.sha256 !== "d0590837a439c742e89c8226137dd4e902fa1e0df486347dbfc9b8ba68b5826d" ||
            inventory.packageCount !== inventory.packages.length ||
            inventory.packageCount < 1 ||
            inventory.licenseTextCount !== inventory.licenseTexts.length ||
            inventory.licenseTextCount < 1 ||
            inventory.packages.some((entry) => !entry.licenseDeclared)
          ) process.exit(1);
          ' "$THIRD_PARTY_NOTICES"
          test -n "$XDG_STATE_HOME"
          /usr/bin/mkdir -p "$XDG_STATE_HOME/eliza"
          : > "$XDG_STATE_HOME/eliza/flatpak-persistence-smoke"

          MEDIA_SMOKE="/tmp/elizaos-ffmpeg-smoke-$$.mp4"
          trap 'rm -f "$MEDIA_SMOKE"' 0
          /usr/bin/ffmpeg -hide_banner -loglevel error \
            -f lavfi -i color=c=black:s=16x16:d=0.04 \
            -c:v libx264 -pix_fmt yuv420p -y "$MEDIA_SMOKE"
          CODEC_NAME="$(
            /usr/bin/ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name \
              -of default=noprint_wrappers=1:nokey=1 "$MEDIA_SMOKE"
          )"
          test "$CODEC_NAME" = h264
          rm -f "$MEDIA_SMOKE"
          trap - 0
          FLATPAK_MEDIA
          node ../../../scripts/verify-packaged-cli.mjs \
            --expected "$EXPECTED_VERSION" \
            --health-url http://127.0.0.1:43139/api/health \
            --isolation-root "$FLATPAK_ISOLATION_ROOT/verifier" \
            --service-arg serve \
            -- flatpak --system run ai.elizaos.App
          sudo flatpak --system run --command=/bin/sh ai.elizaos.App -c \
            'test -f "$XDG_STATE_HOME/eliza/flatpak-persistence-smoke" && rm -f "$XDG_STATE_HOME/eliza/flatpak-persistence-smoke"'


      - name: Upload Flatpak bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flatpak-bundle
          path: packages/app-core/packaging/flatpak/elizaos-app.flatpak
          retention-days: 90

      - name: Attach Flatpak to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.prepare.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No GitHub release found for $TAG; cannot attach Flatpak artifact."
            exit 1
          fi
          LOCAL_BUNDLE="packages/app-core/packaging/flatpak/elizaos-app.flatpak"
          BUNDLE_NAME="$(basename "$LOCAL_BUNDLE")"
          EXISTING_BUNDLE_NAMES="$(
            gh release view "$TAG" --json assets \
              --jq '.assets[].name | select(. == "elizaos-app.flatpak")'
          )"
          existing_bundles=()
          if [[ -n "$EXISTING_BUNDLE_NAMES" ]]; then
            mapfile -t existing_bundles <<< "$EXISTING_BUNDLE_NAMES"
          fi
          if [[ "${#existing_bundles[@]}" -gt 1 ]]; then
            echo "::error::Release $TAG contains multiple $BUNDLE_NAME assets"
            exit 1
          fi
          if [[ "${#existing_bundles[@]}" -eq 1 ]]; then
            ASSET_CHECK_DIR="$RUNNER_TEMP/elizaos-flatpak-asset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
            test ! -e "$ASSET_CHECK_DIR"
            install -d -m 700 "$ASSET_CHECK_DIR"
            cleanup_asset_check_dir() {
              rm -rf -- "$ASSET_CHECK_DIR"
            }
            trap cleanup_asset_check_dir EXIT
            gh release download "$TAG" \
              --pattern "$BUNDLE_NAME" \
              --dir "$ASSET_CHECK_DIR"
            DOWNLOADED_BUNDLE="$ASSET_CHECK_DIR/$BUNDLE_NAME"
            test -f "$DOWNLOADED_BUNDLE"
            LOCAL_SHA256="$(sha256sum "$LOCAL_BUNDLE" | cut -d ' ' -f 1)"
            RELEASE_SHA256="$(sha256sum "$DOWNLOADED_BUNDLE" | cut -d ' ' -f 1)"
            if [[ "$LOCAL_SHA256" != "$RELEASE_SHA256" ]]; then
              echo "::error::Release $TAG already contains $BUNDLE_NAME with different bytes"
              exit 1
            fi
            echo "Release $TAG already contains the byte-identical $BUNDLE_NAME"
          else
            gh release upload "$TAG" "$LOCAL_BUNDLE"
          fi

  # ── Summary ────────────────────────────────────────────────────────────
  publish-summary:
    name: Publish Summary
    needs:
      [prepare, publish-pypi, publish-snap, build-deb, publish-apt, build-flatpak]
    if: always()
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    steps:
      - name: Summary
        run: |
          {
            echo "## Package Publishing Summary"
            echo ""
            echo "Version: **${{ needs.prepare.outputs.version }}**"
            echo ""
            echo "| Package | Status |"
            echo "|---------|--------|"
            echo "| PyPI (elizaos-app ${{ needs.prepare.outputs.pypi_version }}) | ${{ needs.publish-pypi.result || 'skipped' }} |"
            echo "| Homebrew | handled by update-homebrew.yml |"
            echo "| Snap | ${{ needs.publish-snap.result || 'skipped' }} |"
            echo "| Debian (.deb) | ${{ needs.build-deb.result || 'skipped' }} |"
            echo "| Signed APT repository | ${{ needs.publish-apt.result || 'skipped' }} |"
            echo "| Flatpak side-load bundle | ${{ needs.build-flatpak.result || 'skipped' }} |"
            echo ""
            echo "### Install commands"
            echo '```bash'
            echo "pip install elizaos-app==${{ needs.prepare.outputs.pypi_version }}"
            echo "brew install elizaos-app"
            echo "sudo snap install ffmpeg-2204"
            echo "sudo snap install elizaos-app"
            echo "sudo snap connect elizaos-app:ffmpeg-2204 ffmpeg-2204:ffmpeg-2204"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require enabled package publishers succeeded
        run: |
          failed=0
          require_result() {
            local label="$1"
            local enabled="$2"
            local result="$3"
            if [[ "$enabled" == "true" && "$result" != "success" ]]; then
              echo "::error::$label result was '$result', expected success"
              failed=1
            fi
          }

          require_result "PyPI" "${{ inputs.pypi }}" "${{ needs.publish-pypi.result }}"
          require_result "Snap" "${{ inputs.snap }}" "${{ needs.publish-snap.result }}"
          require_result "Debian package" "${{ inputs.apt }}" "${{ needs.build-deb.result }}"
          require_result "Signed APT repository" "${{ inputs.apt }}" "${{ needs.publish-apt.result }}"
          require_result "Flatpak" "${{ inputs.flatpak }}" "${{ needs.build-flatpak.result }}"

          exit "$failed"
