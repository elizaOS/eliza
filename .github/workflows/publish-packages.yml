name: Publish Packages

# Post-release package distribution. Called by release-orchestrator.yml or
# manually dispatched for retries / ad-hoc republish operations.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0.0-beta.0)"
        required: true
        type: string
      pypi:
        description: "Publish to PyPI"
        required: false
        type: boolean
        default: true
      snap:
        description: "Publish to Snap Store"
        required: false
        type: boolean
        default: true
      flatpak:
        description: "Publish Flatpak"
        required: false
        type: boolean
        default: true
      apt:
        description: "Build Debian package"
        required: false
        type: boolean
        default: true
    secrets:
      SNAP_STORE_CREDENTIALS:
        required: false
      APT_REPO_TOKEN:
        required: false
      PYPI_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0.0-beta.0)"
        required: true
        type: string
      pypi:
        description: "Publish to PyPI"
        type: boolean
        default: true
      snap:
        description: "Publish to Snap Store"
        type: boolean
        default: true
      flatpak:
        description: "Publish Flatpak"
        type: boolean
        default: true
      apt:
        description: "Build Debian package"
        type: boolean
        default: true

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      npm_version: ${{ steps.ver.outputs.npm_version }}
      pypi_version: ${{ steps.ver.outputs.pypi_version }}
      deb_version: ${{ steps.ver.outputs.deb_version }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
      snap_store_ready: ${{ steps.registry_credentials.outputs.snap_store_ready }}
      apt_repo_ready: ${{ steps.registry_credentials.outputs.apt_repo_ready }}
    steps:
      - name: Determine versions
        id: ver
        run: |
          VERSION="${{ inputs.version }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$VERSION" >> "$GITHUB_OUTPUT"

          # PEP 440 conversion: 2.0.0-beta.0 → 2.0.0b0
          PYPI_VERSION=$(echo "$VERSION" | sed -E 's/-beta\.?/b/; s/-rc\.?/rc/')
          echo "pypi_version=$PYPI_VERSION" >> "$GITHUB_OUTPUT"

          # Debian version: 2.0.0-beta.0 → 2.0.0~beta0-1
          DEB_VERSION=$(echo "$VERSION" | sed -E 's/-beta\./~beta/; s/-rc\./~rc/')
          echo "deb_version=${DEB_VERSION}-1" >> "$GITHUB_OUTPUT"

          # Pre-release detection
          if echo "$VERSION" | grep -qE '(beta|rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Version: $VERSION"
          echo "PyPI: $PYPI_VERSION"
          echo "Debian: ${DEB_VERSION}-1"
          echo "Pre-release: $(echo "$VERSION" | grep -qE '(beta|rc)' && echo true || echo false)"

      - name: Check registry credentials
        id: registry_credentials
        env:
          INPUT_SNAP: ${{ inputs.snap }}
          INPUT_APT: ${{ inputs.apt }}
          SNAP_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_CREDENTIALS }}
          APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: |
          # Downstream Snap / APT jobs gate on these readiness flags via `if:`.
          # We intentionally do NOT fail the whole publish job when these
          # secrets are missing: npm + PyPI publishing must keep working for
          # forks / staging environments that have no Snap Store or APT repo
          # access. The Snap/APT jobs themselves will skip cleanly when
          # ready=false; an explicit warning preserves the signal in logs.
          if [[ -n "$SNAP_STORE_CREDENTIALS" ]]; then
            echo "snap_store_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "snap_store_ready=false" >> "$GITHUB_OUTPUT"
            if [[ "$INPUT_SNAP" == "true" ]]; then
              echo "::warning::SNAP_STORE_CREDENTIALS missing — skipping Snap publish even though inputs.snap=true."
            fi
          fi

          if [[ -n "$APT_REPO_TOKEN" ]]; then
            echo "apt_repo_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "apt_repo_ready=false" >> "$GITHUB_OUTPUT"
            if [[ "$INPUT_APT" == "true" ]]; then
              echo "::warning::APT_REPO_TOKEN missing — skipping APT publish even though inputs.apt=true."
            fi
          fi

  # ── PyPI ───────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: prepare
    if: inputs.pypi
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    permissions:
      id-token: write  # OIDC trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/project/elizaos-app/${{ needs.prepare.outputs.pypi_version }}/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Update version in source
        working-directory: packages/app-core/packaging/pypi
        run: |
          PYPI_VERSION="${{ needs.prepare.outputs.pypi_version }}"
          sed -i "s/^version = .*/version = \"$PYPI_VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$PYPI_VERSION\"/" elizaos_app/__init__.py
          echo "Updated to version: $PYPI_VERSION"
          grep "version" pyproject.toml | head -1
          grep "__version__" elizaos_app/__init__.py

      - name: Build package
        working-directory: packages/app-core/packaging/pypi
        run: |
          pip install build
          python -m build
          echo "Built packages:"
          ls -lh dist/

      - name: Validate package
        working-directory: packages/app-core/packaging/pypi
        run: |
          pip install twine
          twine check dist/*

      - name: Test package installs
        working-directory: packages/app-core/packaging/pypi
        run: |
          pip install dist/*.whl
          python -c "import elizaos_app; print(f'elizaos_app {elizaos_app.__version__} loaded OK')"
          python -c "
          from elizaos_app.loader import _parse_version
          assert _parse_version('v22.12.0') == (22, 12, 0)
          print('Loader tests passed')
          "

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          packages-dir: packages/app-core/packaging/pypi/dist/
          # Falls back to API token when OIDC trusted publishing is not
          # configured (e.g. first publish before the project exists on PyPI).
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ── Homebrew ───────────────────────────────────────────────────────────
  # NOTE: Homebrew tap updates are handled by the standalone update-homebrew.yml
  # workflow, which triggers via repository_dispatch. Do not duplicate here.

  # ── Snap ───────────────────────────────────────────────────────────────
  publish-snap:
    name: Build & Publish Snap (${{ matrix.arch }})
    needs: prepare
    if: inputs.snap
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.50.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare snapcraft.yaml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          mkdir -p snap
          cp packages/app-core/packaging/snap/snapcraft.yaml snap/snapcraft.yaml
          test -n "$VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          case "$IS_PRERELEASE" in
            true) SNAP_GRADE=devel ;;
            false) SNAP_GRADE=stable ;;
            *) echo "Invalid prerelease state: $IS_PRERELEASE" >&2; exit 1 ;;
          esac
          sed -i "s/^version: .*/version: '${VERSION}'/" snap/snapcraft.yaml
          sed -i "s/^grade: .*/grade: ${SNAP_GRADE}/" snap/snapcraft.yaml
          grep -Fx "grade: ${SNAP_GRADE}" snap/snapcraft.yaml
          echo "Snap version: $VERSION"
          echo "Snap grade: $SNAP_GRADE for prerelease=$IS_PRERELEASE"

      - name: Normalize runner root ownership for snapd
        run: |
          set -euo pipefail
          ROOT_OWNER="$(stat -c '%u:%g' /)"
          echo "Runner root owner: ${ROOT_OWNER}"
          if [ "${ROOT_OWNER}" = "0:0" ]; then
            echo "Root is already 0:0 — snapd canonicalization OK"
            exit 0
          fi
          echo "Attempting to repair / ownership so snapd/systemd path canonicalization accepts this runner"
          if sudo -n chown root:root / 2>/dev/null; then
            echo "Chown succeeded; new owner: $(stat -c '%u:%g' /)"
          else
            echo "::warning::Unable to chown / to root:root (sudo unavailable or passwordless sudo disabled). snapd may fail downstream. Remediation: run this job on a standard ubuntu-latest / ubuntu-24.04 GitHub-hosted runner, or configure the container image so / is owned by 0:0."
          fi

      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79
        id: snapcraft
        with:
          path: .
          build-info: true
          snapcraft-channel: "8.x/stable"

      - name: Verify snap contents
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
          EVIDENCE_DIR: snap-evidence/${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -n "$SNAP_PATH"
          test -f "$SNAP_PATH"
          mkdir -p "$EVIDENCE_DIR"
          ls -lh "$SNAP_PATH"
          SNAP_SHA256="$(sha256sum "$SNAP_PATH" | awk '{ print $1 }')"
          printf '%s  %s\n' "$SNAP_SHA256" "$(basename "$SNAP_PATH")" | tee "$EVIDENCE_DIR/SHA256SUMS"
          unsquashfs -l "$SNAP_PATH" | tee "$EVIDENCE_DIR/squashfs-files.txt" | sed -n '1,50p'

      - name: Install and test snap
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EVIDENCE_DIR: snap-evidence/${{ matrix.arch }}/installed
        run: bash packages/app-core/packaging/snap/test-installed-snap.sh

      - name: Record builder and base provenance
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
          EVIDENCE_DIR: snap-evidence/${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -f "$SNAP_PATH"
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'snapcraft_action=%s\n' 'snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79'
            printf 'snapcraft_channel=%s\n' '8.x/stable'
            printf 'snapcraft_base=%s\n' 'core22'
            snap version
            snapcraft version
            snap list snapcraft
            snap list core22
          } | tee "$EVIDENCE_DIR/build-provenance.txt"
          unsquashfs -cat "$SNAP_PATH" meta/snap.yaml >"$EVIDENCE_DIR/installed-snap.yaml"
          unsquashfs -cat "$SNAP_PATH" snap/snapcraft.yaml >"$EVIDENCE_DIR/build-snapcraft.yaml"
          unsquashfs -cat "$SNAP_PATH" snap/manifest.yaml >"$EVIDENCE_DIR/build-manifest.yaml"

      - name: Extract snap filesystem for SBOM
        id: sbom-root
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        run: |
          set -euo pipefail
          test -f "$SNAP_PATH"
          SBOM_ROOT="$(mktemp -d "$RUNNER_TEMP/eliza-snap-sbom-${{ matrix.arch }}.XXXXXX")"
          unsquashfs -d "$SBOM_ROOT" "$SNAP_PATH" >/dev/null
          test -f "$SBOM_ROOT/meta/snap.yaml"
          test -f "$SBOM_ROOT/snap/manifest.yaml"
          echo "path=$SBOM_ROOT" >> "$GITHUB_OUTPUT"

      - name: Generate Snap SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ steps.sbom-root.outputs.path }}
          format: spdx-json
          output-file: snap-evidence/${{ matrix.arch }}/elizaos-app-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Snap build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ steps.snapcraft.outputs.snap }}

      - name: Upload Snap artifact and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-snap-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          path: |
            ${{ steps.snapcraft.outputs.snap }}
            snap-evidence/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 90

      - name: Publish to Snap Store
        if: success() && needs.prepare.outputs.snap_store_ready == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: ${{ needs.prepare.outputs.is_prerelease == 'true' && 'edge,beta' || 'stable,candidate' }}

      - name: Upload Snap diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-snap-${{ matrix.arch }}-failure-diagnostics
          path: snap-evidence/${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 30

  # ── Debian / apt ───────────────────────────────────────────────────────
  build-deb:
    name: Build Debian Package
    needs: prepare
    if: inputs.apt
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    permissions:
      contents: write  # gh release upload
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup Node.js and Debian build dependencies
        run: |
          set -euo pipefail
          # NodeSource installs a dpkg-owned Node 24 package, allowing
          # dpkg-checkbuilddeps to verify the declared build requirement.
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          for attempt in 1 2 3; do
            sudo apt-get update && \
            sudo apt-get install -y --no-install-recommends \
              build-essential ca-certificates curl debhelper devscripts fakeroot \
              file nodejs xz-utils && break
            if [ "$attempt" = 3 ]; then
              echo "Debian build dependency installation failed after 3 attempts" >&2
              exit 1
            fi
            echo "apt-get attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          node --version
          npm --version
          node -e 'const [major] = process.versions.node.split(".").map(Number); if (major !== 24) process.exit(1)'
          dpkg-query -W -f='${Version} ${Provides}\n' nodejs | grep -Eq '(^|, )npm(,|$)'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Prepare debian packaging
        run: |
          # Copy debian directory into project root
          cp -r packages/app-core/packaging/debian .

          # Update changelog version
          DEB_VERSION="${{ needs.prepare.outputs.deb_version }}"
          sed -i "1s/([^)]*)/($DEB_VERSION)/" debian/changelog
          sed -i "1s/UNRELEASED/unstable/" debian/changelog

          echo "Debian version: $DEB_VERSION"
          head -3 debian/changelog
          dpkg-checkbuilddeps debian/control

      - name: Build .deb package
        run: |
          set -euo pipefail
          dpkg-buildpackage -us -uc -b
          echo "Built packages:"
          ls -lh ../*.deb
          # Copy to workspace for artifact upload (upload-artifact doesn't allow ../)
          mkdir -p deb-output
          cp ../*.deb ../*.changes deb-output/ 2>/dev/null || cp ../*.deb deb-output/
          sha256sum deb-output/*.deb > deb-output/SHA256SUMS

      - name: Test .deb package
        run: |
          set -euo pipefail
          debs=(deb-output/*.deb)
          sudo dpkg -i "${debs[@]}" || sudo apt-get -f install -y
          which elizaos-app
          EXPECTED_VERSION="${{ needs.prepare.outputs.version }}"
          test "$(elizaos-app --version)" = "$EXPECTED_VERSION"
          test "$(/usr/lib/elizaos-app/node/bin/node --version)" = "v24.15.0"
          elizaos-app --help | tee /tmp/elizaos-debian-help.txt
          grep -q 'Usage:' /tmp/elizaos-debian-help.txt
          grep -q 'Commands:' /tmp/elizaos-debian-help.txt

      - name: Attest Debian build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: deb-output/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debian-package
          path: deb-output/
          retention-days: 90

      - name: Attach .deb to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No GitHub release found for $TAG; cannot attach .deb artifacts."
            exit 1
          fi
          for deb in deb-output/*.deb; do
            echo "Uploading $deb to release..."
            gh release upload "$TAG" "$deb" --clobber
          done

      - name: Trigger APT repository update
        if: success() && needs.prepare.outputs.apt_repo_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          DEB_FILE="$(find deb-output -maxdepth 1 -type f -name '*.deb' | sort | head -n 1)"
          if [[ -z "$DEB_FILE" ]]; then
            echo "::error::No .deb artifact found in deb-output."
            exit 1
          fi
          DEB_BASENAME="$(basename "$DEB_FILE")"

          TAG="v${VERSION}"

          DEB_URL="https://github.com/elizaOS/eliza/releases/download/${TAG}/${DEB_BASENAME}"

          echo "Dispatching APT update: version=$VERSION, deb_url=$DEB_URL"
          gh api repos/elizaOS/apt/dispatches \
            --method POST \
            -f event_type=update-apt \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[deb_url]=$DEB_URL"

  # ── Flatpak ────────────────────────────────────────────────────────────
  build-flatpak:
    name: Build Flatpak
    needs: prepare
    if: inputs.flatpak
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    permissions:
      contents: write  # gh release upload
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.freedesktop.Platform//24.08
          flatpak install -y --user flathub org.freedesktop.Sdk//24.08

      - name: Install frozen workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate Flatpak release metadata
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          METAINFO="packages/app-core/packaging/flatpak/ai.elizaos.App.metainfo.xml"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          grep -F "<release version=\"${VERSION}\"" "$METAINFO"

      - name: Build Flatpak
        run: bun run --cwd packages/app-core build:flatpak:direct

      - name: Test Flatpak
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${{ needs.prepare.outputs.version }}"
          export EXPECTED_VERSION
          flatpak --user install --reinstall -y dist-flatpak/elizaos-app.flatpak
          test "$(flatpak run ai.elizaos.App --version)" = "$EXPECTED_VERSION"
          test "$(flatpak run --command=node ai.elizaos.App --version)" = "v24.15.0"
          flatpak run ai.elizaos.App --help | tee /tmp/elizaos-flatpak-help.txt
          grep -q 'Usage:' /tmp/elizaos-flatpak-help.txt
          grep -q 'Commands:' /tmp/elizaos-flatpak-help.txt
          flatpak run --command=node ai.elizaos.App \
            --input-type=module \
            --eval 'await import("/app/lib/elizaos-app/node_modules/@elizaos/plugin-elizacloud/dist/node/index.node.js")'
          flatpak run --command=cat ai.elizaos.App \
            /app/lib/elizaos-app/flatpak-runtime.json > /tmp/flatpak-runtime.json
          node -e '
            const fs = require("node:fs");
            const metadata = JSON.parse(fs.readFileSync("/tmp/flatpak-runtime.json", "utf8"));
            if (metadata.version !== process.env.EXPECTED_VERSION) throw new Error("wrong staged version");
            if (metadata.runtimeNode !== "v24.15.0") throw new Error("wrong staged Node runtime");
            if (metadata.sourceDirty) throw new Error("release runtime came from a dirty checkout");
            if (metadata.sourceRevision !== process.env.GITHUB_SHA) throw new Error("wrong source revision");
          '

      - name: Checksum Flatpak bundle
        run: sha256sum dist-flatpak/elizaos-app.flatpak > dist-flatpak/elizaos-app.flatpak.sha256

      - name: Attest Flatpak build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist-flatpak/elizaos-app.flatpak

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flatpak-bundle
          path: |
            dist-flatpak/elizaos-app.flatpak
            dist-flatpak/elizaos-app.flatpak.sha256
            dist-flatpak/runtime/flatpak-runtime.json
          retention-days: 90

      - name: Attach Flatpak to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No GitHub release found for $TAG; cannot attach Flatpak artifact."
            exit 1
          fi
          gh release upload "$TAG" \
            dist-flatpak/elizaos-app.flatpak \
            dist-flatpak/elizaos-app.flatpak.sha256 \
            --clobber

  # ── Summary ────────────────────────────────────────────────────────────
  publish-summary:
    name: Publish Summary
    needs: [prepare, publish-pypi, publish-snap, build-deb, build-flatpak]
    if: always()
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    steps:
      - name: Summary
        run: |
          {
            echo "## Package Publishing Summary"
            echo ""
            echo "Version: **${{ needs.prepare.outputs.version }}**"
            echo ""
            echo "| Package | Status |"
            echo "|---------|--------|"
            echo "| PyPI (elizaos-app ${{ needs.prepare.outputs.pypi_version }}) | ${{ needs.publish-pypi.result || 'skipped' }} |"
            echo "| Homebrew | handled by update-homebrew.yml |"
            echo "| Snap | ${{ needs.publish-snap.result || 'skipped' }} |"
            echo "| Debian (.deb) | ${{ needs.build-deb.result || 'skipped' }} |"
            echo "| Flatpak | ${{ needs.build-flatpak.result || 'skipped' }} |"
            echo ""
            echo "### Install commands"
            echo '```bash'
            echo "pip install elizaos-app==${{ needs.prepare.outputs.pypi_version }}"
            echo "brew install elizaos-app"
            echo "sudo snap install elizaos-app --classic"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require enabled package publishers succeeded
        run: |
          failed=0
          require_result() {
            local label="$1"
            local enabled="$2"
            local result="$3"
            if [[ "$enabled" == "true" && "$result" != "success" ]]; then
              echo "::error::$label result was '$result', expected success"
              failed=1
            fi
          }

          require_result "PyPI" "${{ inputs.pypi }}" "${{ needs.publish-pypi.result }}"
          require_result "Snap" "${{ inputs.snap }}" "${{ needs.publish-snap.result }}"
          require_result "Debian/APT" "${{ inputs.apt }}" "${{ needs.build-deb.result }}"
          require_result "Flatpak" "${{ inputs.flatpak }}" "${{ needs.build-flatpak.result }}"

          exit "$failed"
