# Deploy the verified homepage artifact to its environment-owned Cloudflare Pages project.
#
# Deployment authority is intentionally singular:
#   - develop pushes deploy only to staging.eliza.app;
#   - production is workflow_dispatch/workflow_call only and is protected by
#     the production GitHub environment;
#   - repository code runs only in the credential-free GitHub-hosted build job;
#     the deploy job downloads inert dist bytes and never checks out source.
#
# Both the staging and production GitHub environments must provide their own
# CLOUDFLARE_PAGES_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and channel
# variables. VITE_* values are public build inputs, never secrets.

name: Deploy Homepage

concurrency:
  group: deploy-homepage-${{ github.event_name == 'push' && 'staging' || inputs.target || 'production' }}
  cancel-in-progress: false

on:
  push:
    branches: [develop]
    paths:
      - "packages/homepage/**"
      - "packages/shared/src/**"
      - "packages/ui/src/**"
      - "packages/app-core/scripts/write-homepage-release-data.mjs"
      - "packages/app-core/scripts/lib/asset-cdn.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-homepage.yml"
  workflow_call:
    inputs:
      target:
        description: "Deployment target"
        required: false
        default: "production"
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.target || 'production' }}
    outputs:
      target: ${{ steps.target.outputs.value }}
      project: ${{ steps.target.outputs.project }}
      branch: ${{ steps.target.outputs.branch }}
      url: ${{ steps.target.outputs.url }}
      available: ${{ steps.release_data_check.outputs.available }}
    steps:
      - name: Resolve and validate target
        id: target
        env:
          REQUESTED_TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.target || 'production' }}
        run: |
          case "$REQUESTED_TARGET" in
            staging)
              echo "value=staging" >> "$GITHUB_OUTPUT"
              echo "project=eliza-home-staging" >> "$GITHUB_OUTPUT"
              echo "branch=develop" >> "$GITHUB_OUTPUT"
              echo "url=https://staging.eliza.app/" >> "$GITHUB_OUTPUT"
              ;;
            production)
              if [ "${{ github.event_name }}" = "push" ]; then
                echo "::error::Push events can never select production."
                exit 1
              fi
              echo "value=production" >> "$GITHUB_OUTPUT"
              echo "project=eliza-app-home" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "url=https://eliza.app/" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown deployment target: $REQUESTED_TARGET"
              exit 1
              ;;
          esac

      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install frozen workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Refresh homepage release data
        working-directory: packages/homepage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../app-core/scripts/write-homepage-release-data.mjs

      - name: Check homepage release data
        id: release_data_check
        working-directory: packages/homepage
        run: |
          if bun run check:release-data; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "::error::Release-triggered homepage deploys require published release data."
            exit 1
          fi

          echo "::warning::No complete published release data is available; skipping homepage deploy."
          echo "available=false" >> "$GITHUB_OUTPUT"

      - name: Verify channel build config
        if: steps.release_data_check.outputs.available == 'true'
        working-directory: packages/homepage
        env:
          ELIZA_REQUIRE_CHANNEL_CONFIG: "1"
          VITE_TELEGRAM_BOT_ID: ${{ vars.VITE_TELEGRAM_BOT_ID }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
          VITE_WHATSAPP_PHONE_NUMBER: ${{ vars.VITE_WHATSAPP_PHONE_NUMBER }}
        run: node scripts/verify-channel-build-config.mjs

      - name: Verify and build homepage
        if: steps.release_data_check.outputs.available == 'true'
        working-directory: packages/homepage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELIZA_REQUIRE_CHANNEL_CONFIG: "1"
          VITE_TELEGRAM_BOT_ID: ${{ vars.VITE_TELEGRAM_BOT_ID }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
          VITE_WHATSAPP_PHONE_NUMBER: ${{ vars.VITE_WHATSAPP_PHONE_NUMBER }}
          VITE_ELIZACLOUD_API_URL: ${{ steps.target.outputs.value == 'production' && 'https://elizacloud.ai' || 'https://staging.elizacloud.ai' }}
        run: |
          bun run test
          bun run typecheck
          bun run lint:check
          bun run check:snapshot-inventory
          bun run build

      - name: Install homepage browser
        if: steps.release_data_check.outputs.available == 'true'
        run: PLAYWRIGHT_INSTALL_CWD=packages/homepage .github/scripts/install-playwright-browsers.sh chromium

      - name: Test homepage routes and visuals
        if: steps.release_data_check.outputs.available == 'true'
        working-directory: packages/homepage
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run test:e2e

      - name: Record deployment provenance
        if: steps.release_data_check.outputs.available == 'true'
        env:
          DEPLOY_TARGET: ${{ steps.target.outputs.value }}
        run: |
          printf '%s\n' \
            "commit=$GITHUB_SHA" \
            "target=$DEPLOY_TARGET" \
            > packages/homepage/dist/deployment-provenance.txt

      - name: Upload verified homepage artifact
        if: steps.release_data_check.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homepage-${{ steps.target.outputs.value }}-${{ github.sha }}
          path: packages/homepage/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.build.outputs.target }}
    steps:
      - name: Download verified homepage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: homepage-${{ needs.build.outputs.target }}-${{ github.sha }}
          path: dist

      - name: Verify artifact provenance
        env:
          DEPLOY_TARGET: ${{ needs.build.outputs.target }}
        run: |
          grep -Fx "commit=$GITHUB_SHA" dist/deployment-provenance.txt
          grep -Fx "target=$DEPLOY_TARGET" dist/deployment-provenance.txt

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Verify environment-owned Cloudflare credentials
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_PAGES_API_TOKEN" ] || { echo "::error::The selected GitHub environment must define CLOUDFLARE_PAGES_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::The selected GitHub environment must define CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy verified artifact to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ needs.build.outputs.project }}
          BRANCH: ${{ needs.build.outputs.branch }}
        run: |
          bunx wrangler@4.116.0 pages deploy dist \
            --project-name "$PROJECT" \
            --branch "$BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false

      - name: Verify target domain serves this artifact
        env:
          TARGET_URL: ${{ needs.build.outputs.url }}
        run: |
          mapfile -t EXPECTED_ASSETS < <(grep -oE 'assets/[A-Za-z0-9._-]+\.(js|css)' dist/index.html | sort -u)
          [ "${#EXPECTED_ASSETS[@]}" -gt 0 ] || { echo "::error::dist/index.html has no entry assets"; exit 1; }
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "$TARGET_URL" > deployed-index.html; then
              missing=0
              for asset in "${EXPECTED_ASSETS[@]}"; do
                grep -Fq "$asset" deployed-index.html || missing=1
              done
              if [ "$missing" -eq 0 ]; then
                echo "$TARGET_URL serves the exact $GITHUB_SHA entry assets."
                exit 0
              fi
            fi
            echo "attempt $attempt: target does not yet serve this artifact"
            sleep 6
          done
          echo "::error::$TARGET_URL did not serve the $GITHUB_SHA artifact"
          exit 1
