# Deploy the eliza.app waitlist to the eliza-app-home Cloudflare Pages project.
#
# CONTEXT (2026-08-04): eliza.app was switched to a graceful waitlist
# (deployment d562e1eb-9c39-4644-9b8b-4f53fea90257) because the previous
# packages/homepage Vite app exposed a stale phone/channel demo (hard-coded
# +14159611510, client-only mock OTP, dead download routes). This workflow now
# deploys the canonical waitlist source in packages/homepage/waitlist so a
# develop push can no longer resurrect the stale surface. See
# ELIZA-APP-WAITLIST-DEPLOY-RECEIPT-2026-08-04 (ops receipts) for the audit.
#
# The full Vite app remains in packages/homepage for the relaunch; restoring it
# to production is an explicit decision (revert this workflow), not a side
# effect of a push.
#
# What this does:
#   1. Runs the waitlist unit tests (Pages Function: validation, dedupe,
#      honeypot, rate limiting, origin checks).
#   2. Publishes packages/homepage/waitlist/site (static page) together with
#      the Pages Function in packages/homepage/waitlist/functions to
#      Cloudflare Pages as the production deployment serving eliza.app and
#      www.eliza.app.
#
# Required secrets on elizaOS/eliza:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Homepage

concurrency:
  group: deploy-homepage
  cancel-in-progress: true

on:
  push:
    branches: [develop]
    paths:
      - "packages/homepage/waitlist/**"
      - ".github/workflows/deploy-homepage.yml"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy the waitlist from (defaults to the calling workflow ref)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy the waitlist from"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Test waitlist function
        working-directory: packages/homepage/waitlist
        run: node --test tests/waitlist.test.mjs

      - name: Verify deploy artifact completeness
        working-directory: packages/homepage/waitlist
        run: |
          for f in site/index.html site/styles.css site/waitlist.js site/_redirects site/_headers functions/api/waitlist.js; do
            [ -s "$f" ] || { echo "::error::missing or empty deploy artifact: $f"; exit 1; }
          done
          # The stale demo surface must never ship from this pipeline.
          if grep -R "14159611510" site functions; then
            echo "::error::stale phone demo content detected in waitlist artifacts"; exit 1
          fi

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is required"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is required"; exit 1; }

      - name: Deploy production waitlist to Cloudflare Pages
        working-directory: packages/homepage/waitlist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler@4.116.0 pages deploy site \
            --project-name eliza-app-home \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true
