name: eliza.army

# Builds the contribution site from live elizaOS/eliza data, verifies the
# canonical skill and browser surface, and publishes only trusted develop or
# explicitly admitted production-candidate runs to Cloudflare Pages.

on:
  pull_request:
    branches: [develop]
    paths:
      - "packages/eliza-computer/**"
      - "packages/skills/skills/contribute-to-eliza/**"
      - "packages/skills/test/contribute-to-eliza.test.ts"
      - ".github/workflows/eliza-computer.yml"
  push:
    branches: [develop]
    paths:
      - "packages/eliza-computer/**"
      - "packages/skills/skills/contribute-to-eliza/**"
      - "packages/skills/test/contribute-to-eliza.test.ts"
      - ".github/workflows/eliza-computer.yml"
  schedule:
    # Offset from the hour so this refresh does not join the top-of-hour surge.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Run checks only, or promote this exact ref as a protected production candidate"
        required: true
        default: quality-only
        type: choice
        options:
          - quality-only
          - production-candidate
      candidate_pr:
        description: "Open same-repository PR number into develop (required for non-develop production candidates)"
        required: false
        default: ""
        type: string

concurrency:
  group: eliza-computer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  CI: "true"
  # Frozen-lockfile CI uses the repository contract in
  # .github/ci-bun-version.json; packageManager's unreleased pin is not
  # resolvable by setup-bun.
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

jobs:
  quality:
    name: Skill, data, build, and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Verify quality checkout
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Quality checkout $checked_out_sha does not match the event SHA $GITHUB_SHA."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install pinned skill validator dependency
        run: |
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' \
            > "$RUNNER_TEMP/eliza-computer-python-requirements.txt"
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement "$RUNNER_TEMP/eliza-computer-python-requirements.txt"

      - name: Validate canonical contribution skill
        run: |
          python packages/skills/skills/skill-creator/scripts/quick_validate.py \
            packages/skills/skills/contribute-to-eliza
          bun test packages/skills/test/contribute-to-eliza.test.ts

      - name: Generate live contribution data
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run --cwd packages/eliza-computer leaderboard:generate

      - name: Check types
        run: bun run --cwd packages/eliza-computer typecheck

      - name: Check formatting and lint
        run: |
          bun run --cwd packages/eliza-computer format:check
          bun run --cwd packages/eliza-computer lint:check

      - name: Run unit tests
        run: bun run --cwd packages/eliza-computer test

      - name: Build production site
        run: bun run --cwd packages/eliza-computer build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: bun run --cwd packages/eliza-computer test:e2e

      - name: Upload Cloudflare Pages bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eliza-computer-pages-${{ github.run_id }}
          path: packages/eliza-computer/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eliza-computer-browser-diagnostics-${{ github.run_id }}
          path: |
            packages/eliza-computer/playwright-report
            packages/eliza-computer/test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy admitted production bundle
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'production-candidate')
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: eliza-computer-production
      cancel-in-progress: false
    environment:
      name: eliza-army-production
      url: https://eliza.army
    steps:
      - name: Checkout exact deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify deployment checkout
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Deployment checkout $checked_out_sha does not match the verified workflow SHA $GITHUB_SHA."
            exit 1
          fi

      - name: Admit release authority
        env:
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            push|schedule)
              if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
                echo "::error::$GITHUB_EVENT_NAME production releases are restricted to develop."
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [ "$RELEASE_MODE" != "production-candidate" ]; then
                echo "::error::A manual production release requires release_mode=production-candidate."
                exit 1
              fi
              if [ "$GITHUB_REF_TYPE" != "branch" ]; then
                echo "::error::A production candidate must be dispatched from a branch, not $GITHUB_REF_TYPE."
                exit 1
              fi
              ;;
            *)
              echo "::error::$GITHUB_EVENT_NAME is not authorized to deploy eliza.army."
              exit 1
              ;;
          esac

          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            exit 0
          fi

          if ! [[ "$CANDIDATE_PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A non-develop production candidate requires a numeric candidate_pr input."
            exit 1
          fi

          response="$RUNNER_TEMP/eliza-computer-candidate-pr.json"
          status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$CANDIDATE_PR"
          )"
          if [ "$status" != "200" ]; then
            echo "::error::Candidate PR #$CANDIDATE_PR lookup failed with HTTP $status."
            exit 1
          fi

          node --input-type=module - \
            "$response" \
            "$GITHUB_SHA" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" <<'NODE'
          import { readFileSync } from "node:fs";

          const [responsePath, expectedSha, expectedBranch, expectedRepository] =
            process.argv.slice(2);
          const pullRequest = JSON.parse(readFileSync(responsePath, "utf8"));
          const failures = [];

          if (pullRequest.state !== "open") failures.push("state is not open");
          if (pullRequest.base?.ref !== "develop") failures.push("base is not develop");
          if (pullRequest.base?.repo?.full_name !== expectedRepository) {
            failures.push("base repository does not match this repository");
          }
          if (pullRequest.head?.repo?.full_name !== expectedRepository) {
            failures.push("head repository is not this repository");
          }
          if (pullRequest.head?.ref !== expectedBranch) {
            failures.push("head branch does not match the dispatched branch");
          }
          if (pullRequest.head?.sha !== expectedSha) {
            failures.push("head SHA does not match the quality-tested SHA");
          }

          if (failures.length > 0) {
            process.stderr.write(
              `::error::Candidate PR admission failed: ${failures.join("; ")}.\n`,
            );
            process.exit(1);
          }
          NODE

          git fetch --force --no-tags origin \
            develop:refs/remotes/origin/develop
          behind_count="$(
            git rev-list --count "$GITHUB_SHA..refs/remotes/origin/develop"
          )"
          if [ "$behind_count" != "0" ]; then
            echo "::error::Candidate $GITHUB_SHA is $behind_count commit(s) behind current origin/develop."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download verified Pages bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: eliza-computer-pages-${{ github.run_id }}
          path: packages/eliza-computer/dist

      - name: Require scoped Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::The eliza-army-production environment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/eliza-computer-pages-project.json"
          status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/eliza-computer"
          )"
          case "$status" in
            200)
              production_branch="$(
                node -e 'const value=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if (!value.result || typeof value.result.production_branch !== "string") throw new TypeError("Cloudflare project response omitted result.production_branch"); process.stdout.write(value.result.production_branch)' "$response"
              )"
              if [ "$production_branch" != "develop" ]; then
                echo "::error::The existing eliza-computer Pages project uses production branch '$production_branch'; expected 'develop'."
                exit 1
              fi
              ;;
            404)
              bunx wrangler@4.100.0 pages project create eliza-computer \
                --production-branch=develop
              ;;
            *)
              echo "::error::Cloudflare Pages project lookup failed with HTTP $status."
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Pages
        id: pages-deploy
        working-directory: packages/eliza-computer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler.toml owns pages_build_output_dir. A positional directory
        # bypasses that deployment contract and must not be added here.
        run: |
          set -euo pipefail
          printf '%s\n' "started_at=$(node -e 'process.stdout.write(Date.now().toString())')" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            if bunx wrangler@4.100.0 pages deploy \
              --project-name=eliza-computer \
              --branch=develop \
              --commit-hash="$GITHUB_SHA" \
              --commit-dirty=false; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Cloudflare Pages deploy failed after ${attempt} attempts."
              exit 1
            fi
            echo "::warning::Cloudflare Pages deploy attempt ${attempt} failed; retrying."
            sleep $((attempt * 10))
          done

      - name: Verify Cloudflare deployment commit metadata
        id: deployment-metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_NOT_BEFORE: ${{ steps.pages-deploy.outputs.started_at }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/eliza-computer-production-deployments.json"
          for attempt in $(seq 1 18); do
            status="$(
              curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$response" \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --header "Cache-Control: no-cache" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/eliza-computer/deployments?env=production&per_page=25"
            )"
            if [ "$status" = "200" ]; then
              if deployment="$(
                node packages/eliza-computer/scripts/select-pages-deployment.mjs \
                  "$response" "$GITHUB_SHA" "$DEPLOYMENT_NOT_BEFORE"
              )"; then
                IFS=$'\t' read -r deployment_id deployment_url deployment_created_on <<< "$deployment"
                printf '%s\n' "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
                printf '%s\n' "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
                echo "::notice::Cloudflare production deployment $deployment_id for $GITHUB_SHA is successful at $deployment_url"
                {
                  echo "Cloudflare deployment: \`$deployment_id\`"
                  echo
                  echo "URL: $deployment_url"
                  echo
                  echo "Created: $deployment_created_on"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              else
                selector_status="$?"
                if [ "$selector_status" != "2" ]; then
                  echo "::error::Cloudflare deployment metadata response was malformed."
                  exit "$selector_status"
                fi
              fi
            else
              echo "::warning::Cloudflare deployment metadata lookup returned HTTP $status."
            fi
            echo "::warning::Successful production metadata for $GITHUB_SHA is not visible yet (attempt $attempt/18)."
            sleep 5
          done
          echo "::error::Cloudflare did not report a new, successful, clean production deployment for commit $GITHUB_SHA."
          exit 1

      - name: Verify published skill and leaderboard
        run: |
          set -euo pipefail
          verify_download() {
            local remote_path="$1"
            local expected="$2"
            local artifact="$3"
            local received
            local attempt=1
            received="$RUNNER_TEMP/eliza-computer-${artifact//\//-}"
            while [ "$attempt" -le 12 ]; do
              if curl --fail --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --header "Cache-Control: no-cache" \
                --header "Pragma: no-cache" \
                "https://eliza.army${remote_path}?verify=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-$attempt" \
                --output "$received" &&
                cmp --silent "$expected" "$received"; then
                return 0
              fi
              echo "::warning::$artifact verification attempt $attempt did not match the verified build."
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "::error::Published $artifact did not match the verified build."
            return 1
          }
          verify_download / packages/eliza-computer/dist/index.html index.html
          verify_download /skill.md packages/eliza-computer/dist/skill.md skill.md
          verify_download /mission.md packages/eliza-computer/dist/mission.md mission.md
          verify_download /codex.md packages/eliza-computer/dist/codex.md codex.md
          verify_download /skill-manifest.json packages/eliza-computer/dist/skill-manifest.json skill-manifest.json
          verify_download /downloads/contribute-to-eliza.skill packages/eliza-computer/dist/downloads/contribute-to-eliza.skill downloads/contribute-to-eliza.skill
          verify_download /downloads/contribute-to-eliza.skill.sha256 packages/eliza-computer/dist/downloads/contribute-to-eliza.skill.sha256 downloads/contribute-to-eliza.skill.sha256
          verify_download /data/leaderboard.json packages/eliza-computer/dist/data/leaderboard.json data/leaderboard.json
