name: eliza.army

# Builds the contribution site from live elizaOS/eliza data, verifies the
# canonical skill and browser surface, and publishes only trusted develop
# revisions to Cloudflare Pages.

on:
  pull_request:
    branches: [develop]
    paths:
      - "packages/eliza-computer/**"
      - "packages/skills/skills/contribute-to-eliza/**"
      - "packages/skills/skills/skill-creator/scripts/package_skill.py"
      - "packages/skills/skills/skill-creator/scripts/quick_validate.py"
      - "packages/skills/test/contribute-to-eliza.test.ts"
      - "packages/shared/assets/favicons/**"
      - "packages/shared/assets/logos/**"
      - "packages/shared/assets/ogembeds/**"
      - "packages/shared/scripts/sync-to-public.mjs"
      - "packages/scripts/rm-path-recursive.mjs"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/eliza-computer.yml"
  push:
    branches: [develop]
    paths:
      - "packages/eliza-computer/**"
      - "packages/skills/skills/contribute-to-eliza/**"
      - "packages/skills/skills/skill-creator/scripts/package_skill.py"
      - "packages/skills/skills/skill-creator/scripts/quick_validate.py"
      - "packages/skills/test/contribute-to-eliza.test.ts"
      - "packages/shared/assets/favicons/**"
      - "packages/shared/assets/logos/**"
      - "packages/shared/assets/ogembeds/**"
      - "packages/shared/scripts/sync-to-public.mjs"
      - "packages/scripts/rm-path-recursive.mjs"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/eliza-computer.yml"
  schedule:
    # Offset from the hour so this refresh does not join the top-of-hour surge.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: eliza-computer-${{ github.event.pull_request.number || github.ref }}
  # Quality-only PR supersessions may cancel. A trusted develop release must
  # finish its deployment and byte verification before a newer run starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  CI: "true"
  # Frozen-lockfile CI uses the repository contract in
  # .github/ci-bun-version.json; packageManager's unreleased pin is not
  # resolvable by setup-bun.
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

jobs:
  quality:
    name: Skill, data, build, and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Verify quality checkout
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Quality checkout $checked_out_sha does not match the event SHA $GITHUB_SHA."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install pinned skill validator dependency
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          --requirement packages/skills/skills/skill-creator/requirements.txt

      - name: Validate canonical contribution skill
        run: |
          python packages/skills/skills/skill-creator/scripts/quick_validate.py \
            packages/skills/skills/contribute-to-eliza
          bun test packages/skills/test/contribute-to-eliza.test.ts

      - name: Generate live contribution data
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run --cwd packages/eliza-computer leaderboard:generate

      - name: Check types
        run: bun run --cwd packages/eliza-computer typecheck

      - name: Check formatting and lint
        run: |
          bun run --cwd packages/eliza-computer format:check
          bun run --cwd packages/eliza-computer lint:check

      - name: Run unit tests
        run: bun run --cwd packages/eliza-computer test

      - name: Build production site
        run: bun run --cwd packages/eliza-computer build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: bun run --cwd packages/eliza-computer test:e2e

      - name: Upload Cloudflare Pages bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eliza-computer-pages-${{ github.run_id }}
          path: packages/eliza-computer/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eliza-computer-browser-diagnostics-${{ github.run_id }}
          path: |
            packages/eliza-computer/playwright-report
            packages/eliza-computer/test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy trusted production bundle
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: eliza-computer-production
      cancel-in-progress: false
    environment:
      name: eliza-army-production
      url: https://eliza.army
    steps:
      - name: Checkout exact deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify deployment checkout
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Deployment checkout $checked_out_sha does not match the verified workflow SHA $GITHUB_SHA."
            exit 1
          fi

      - name: Verify trusted release authority
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push|schedule|workflow_dispatch) ;;
            *)
              echo "::error::$GITHUB_EVENT_NAME is not authorized to deploy eliza.army."
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::$GITHUB_EVENT_NAME production releases are restricted to refs/heads/develop."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked release tooling
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download verified Pages bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: eliza-computer-pages-${{ github.run_id }}
          path: packages/eliza-computer/dist

      - name: Require live release-input equivalence
        run: |
          set -euo pipefail
          live_develop="$(
            git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --refs \
              https://github.com/elizaOS/eliza.git refs/heads/develop |
              awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$live_develop" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not return a valid live develop SHA."
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" fetch --force --no-tags --depth=1 origin \
            "$live_develop:refs/remotes/origin/eliza-army-live-develop"
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$GITHUB_SHA" "$live_develop" -- \
            .github/workflows/eliza-computer.yml \
            bun.lock package.json \
            packages/eliza-computer \
            packages/skills/skills/contribute-to-eliza \
            packages/skills/skills/skill-creator/scripts/package_skill.py \
            packages/skills/skills/skill-creator/scripts/quick_validate.py \
            packages/skills/test/contribute-to-eliza.test.ts \
            packages/shared/assets/favicons \
            packages/shared/assets/logos \
            packages/shared/assets/ogembeds \
            packages/shared/scripts/sync-to-public.mjs \
            packages/scripts/rm-path-recursive.mjs; then
            echo "::error::Live develop changed an eliza.army release input after $GITHUB_SHA was tested."
            exit 1
          fi

      - name: Require scoped Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::The eliza-army-production environment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Ensure Pages project exists
        working-directory: packages/eliza-computer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/eliza-computer-pages-project.json"
          status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/eliza-computer"
          )"
          case "$status" in
            200)
              production_branch="$(
                node -e 'const value=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if (!value.result || typeof value.result.production_branch !== "string") throw new TypeError("Cloudflare project response omitted result.production_branch"); process.stdout.write(value.result.production_branch)' "$response"
              )"
              if [ "$production_branch" != "develop" ]; then
                echo "::error::The existing eliza-computer Pages project uses production branch '$production_branch'; expected 'develop'."
                exit 1
              fi
              ;;
            404)
              ./node_modules/.bin/wrangler pages project create eliza-computer \
                --production-branch=develop
              ;;
            *)
              echo "::error::Cloudflare Pages project lookup failed with HTTP $status."
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Pages
        id: pages-deploy
        working-directory: packages/eliza-computer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler.toml owns pages_build_output_dir. A positional directory
        # bypasses that deployment contract and must not be added here.
        run: |
          set -euo pipefail
          live_develop="$(
            git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --refs \
              https://github.com/elizaOS/eliza.git refs/heads/develop |
              awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$live_develop" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not return a valid live develop SHA before deployment."
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" fetch --force --no-tags --depth=1 origin \
            "$live_develop:refs/remotes/origin/eliza-army-live-develop"
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$GITHUB_SHA" "$live_develop" -- \
            .github/workflows/eliza-computer.yml \
            bun.lock package.json \
            packages/eliza-computer \
            packages/skills/skills/contribute-to-eliza \
            packages/skills/skills/skill-creator/scripts/package_skill.py \
            packages/skills/skills/skill-creator/scripts/quick_validate.py \
            packages/skills/test/contribute-to-eliza.test.ts \
            packages/shared/assets/favicons \
            packages/shared/assets/logos \
            packages/shared/assets/ogembeds \
            packages/shared/scripts/sync-to-public.mjs \
            packages/scripts/rm-path-recursive.mjs; then
            echo "::error::Live develop changed an eliza.army release input immediately before deployment."
            exit 1
          fi
          printf '%s\n' "started_at=$(node -e 'process.stdout.write(Date.now().toString())')" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            if ./node_modules/.bin/wrangler pages deploy \
              --project-name=eliza-computer \
              --branch=develop \
              --commit-hash="$GITHUB_SHA" \
              --commit-dirty=false; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Cloudflare Pages deploy failed after ${attempt} attempts."
              exit 1
            fi
            echo "::warning::Cloudflare Pages deploy attempt ${attempt} failed; retrying."
            sleep $((attempt * 10))
          done

      - name: Verify Cloudflare deployment commit metadata
        id: deployment-metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_NOT_BEFORE: ${{ steps.pages-deploy.outputs.started_at }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/eliza-computer-production-deployments.json"
          for attempt in $(seq 1 18); do
            status="$(
              curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$response" \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --header "Cache-Control: no-cache" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/eliza-computer/deployments?env=production&per_page=25"
            )"
            if [ "$status" = "200" ]; then
              if deployment="$(
                node packages/eliza-computer/scripts/select-pages-deployment.mjs \
                  "$response" "$GITHUB_SHA" "$DEPLOYMENT_NOT_BEFORE"
              )"; then
                IFS=$'\t' read -r deployment_id deployment_url deployment_created_on <<< "$deployment"
                printf '%s\n' "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
                printf '%s\n' "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
                echo "::notice::Cloudflare production deployment $deployment_id for $GITHUB_SHA is successful at $deployment_url"
                {
                  echo "Cloudflare deployment: \`$deployment_id\`"
                  echo
                  echo "URL: $deployment_url"
                  echo
                  echo "Created: $deployment_created_on"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              else
                selector_status="$?"
                if [ "$selector_status" != "2" ]; then
                  echo "::error::Cloudflare deployment metadata response was malformed."
                  exit "$selector_status"
                fi
              fi
            else
              echo "::warning::Cloudflare deployment metadata lookup returned HTTP $status."
            fi
            echo "::warning::Successful production metadata for $GITHUB_SHA is not visible yet (attempt $attempt/18)."
            sleep 5
          done
          echo "::error::Cloudflare did not report a new, successful, clean production deployment for commit $GITHUB_SHA."
          exit 1

      - name: Verify published skill and leaderboard
        run: |
          set -euo pipefail
          verify_download() {
            local remote_path="$1"
            local expected="$2"
            local artifact="$3"
            local received
            local attempt=1
            received="$RUNNER_TEMP/eliza-computer-${artifact//\//-}"
            while [ "$attempt" -le 3 ]; do
              if curl --fail --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --header "Cache-Control: no-cache" \
                --header "Pragma: no-cache" \
                "https://eliza.army${remote_path}?verify=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-$attempt" \
                --output "$received" &&
                cmp --silent "$expected" "$received"; then
                return 0
              fi
              echo "::warning::$artifact verification attempt $attempt did not match the verified build."
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "::error::Published $artifact did not match the verified build."
            return 1
          }
          node packages/eliza-computer/scripts/dist-manifest.mjs verify \
            packages/eliza-computer/dist \
            https://eliza.army \
            "$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
          # The inventory checks /index.html; this additional request proves the
          # public root route resolves to those same tested bytes.
          verify_download / packages/eliza-computer/dist/index.html index.html
