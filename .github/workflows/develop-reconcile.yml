# Reconciles effects only after exact source validation and opens a reviewed
# promotion request. Branch updates remain subject to repository protection.
name: Develop Effect Reconcile

run-name: Reconcile ${{ inputs.source_sha }} from Develop Full ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact fully verified source branch commit
        required: true
        type: string
      source_run_id:
        description: Exact successful Develop Full workflow run
        required: true
        type: string

concurrency:
  group: branch-effect-reconcile-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

permissions:
  actions: write
  contents: read
  deployments: write
  pull-requests: write

jobs:
  reconcile:
    name: Reconcile exact effects and promote next branch
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Validate source input shape
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "develop" || "$GITHUB_REF_NAME" == "staging" || "$GITHUB_REF_NAME" == "main" ]] || {
            echo "::error::Reconciliation requires develop, staging, or main"
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be a lowercase full commit SHA"
            exit 1
          }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::source_run_id must be a positive integer"
            exit 1
          }
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]] || {
            echo "::error::reconcile workflow head must equal source_sha"
            exit 1
          }

      - name: Checkout exact verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Wait for exact Develop Full success
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node packages/scripts/develop-effect-ledger.mjs await-source --source-sha "$SOURCE_SHA" --source-run-id "$SOURCE_RUN_ID" --source-branch "$GITHUB_REF_NAME"

      - name: Download exact validation manifest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: gh run download "$SOURCE_RUN_ID" --name "develop-full-manifest-$SOURCE_SHA" --dir .develop-evidence

      - name: Reconcile effects and fast-forward next branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node packages/scripts/develop-effect-ledger.mjs reconcile --source-sha "$SOURCE_SHA" --source-run-id "$SOURCE_RUN_ID" --source-branch "$GITHUB_REF_NAME" --expected .develop-evidence/expected.json --observed .develop-evidence/observed.json
