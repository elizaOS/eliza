name: App Real E2E (browser-driven)

# Gated, NON-blocking lane for the browser-driven REAL app e2e suite that lived
# in no workflow until now (it was dark): test/app/*.{real,live}.e2e.test.ts —
#   - qa-checklist.real.e2e.test.ts        (onboarding + doc upload + chat +
#                                            settings pages + voice + char switch)
#   - memory-relationships.real.e2e.test.ts(real /memories + /relationships views)
#   - streaming-visible-text.live.e2e.test.ts (real SSE token streaming)
#
# These drive a real renderer (puppeteer/playwright) against a real app-core
# runtime + a real model provider. Each self-skips (describeIf / CAN_RUN) unless
# ELIZA_LIVE_TEST=1 AND a provider is resolvable, so a key-less run is a clean
# no-op rather than a failure. The default vitest config EXCLUDES these files and
# only scans src/, so they need the dedicated vitest.app-real-e2e.config.ts +
# the test:app-real-e2e script (added alongside this workflow).
#
# Runs nightly + on-demand; never on pull_request.

on:
  schedule:
    # 09:00 UTC daily — after app-live-e2e (07:00) and voice-live-e2e (08:30).
    - cron: "0 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: app-real-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "24.15.0"
  BUN_VERSION: "1.3.14"
  ELIZA_LIVE_TEST: "1"
  # Provider keys (the suite picks the first resolvable via selectLiveProvider();
  # absent secrets => the suite self-skips, never fails).
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

jobs:
  app-real-e2e:
    name: Browser-driven real app e2e (nightly)
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 60
    # NOTE: `continue-on-error` intentionally lives on the e2e run step below, NOT
    # here at the job level. Job-level soft-fail resolves the whole run to
    # `success` even when the only job fails — a vacuous green that hid a real
    # browser-e2e failure (#16722). The lane stays advisory (a failed nightly
    # still ends green, exactly as before), but the true outcome is now surfaced
    # in the job summary + a warning annotation so `success` can't be misread.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser drivers
        run: |
          set -euo pipefail
          bunx playwright install --with-deps chromium

      - name: Run browser-driven real app e2e
        id: e2e
        # Step-level soft-fail keeps the nightly advisory (the job/run still ends
        # green on failure), while the report step below records the real result.
        continue-on-error: true
        run: |
          set -euo pipefail
          # streaming-visible-text.live.e2e launches a real browser via
          # playwright-core's chromium and honors ELIZA_CHROME_PATH, which
          # defaults to a macOS Google Chrome path that never exists on ubuntu —
          # so without this the live streaming suite self-skips forever. Point it
          # at the chromium the "Install browser drivers" step installed, resolved
          # from the same playwright-core the test imports.
          ELIZA_CHROME_PATH="$(cd packages/app-core && node -e "console.log(require('playwright-core').chromium.executablePath())")"
          test -x "$ELIZA_CHROME_PATH"
          echo "Using ELIZA_CHROME_PATH=$ELIZA_CHROME_PATH"
          export ELIZA_CHROME_PATH
          bun run --cwd packages/app-core test:app-real-e2e

      - name: Report real app e2e outcome
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## App Real E2E (browser-driven, nightly · advisory)"
            echo ""
            echo "- Suite: \`packages/app-core\` \`test:app-real-e2e\`"
            echo "- Trigger: \`${{ github.event_name }}\` · Ref: \`${{ github.ref }}\`"
            echo "- Real e2e step outcome: \`${E2E_OUTCOME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # This lane is advisory: the run stays green regardless, but a failed
          # e2e must be visible, not silently masked by the green checkmark.
          if [ "${E2E_OUTCOME}" = "failure" ]; then
            # Annotation to stdout (GitHub surfaces `::warning::` on the run);
            # human-readable line to the summary.
            echo "::warning title=App Real E2E failed (advisory)::The browser-driven real app e2e suite FAILED (advisory nightly; run stays green). Inspect the 'Run browser-driven real app e2e' step."
            echo "❌ **Real e2e FAILED** — advisory, so the run is green, but the suite did not pass." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${E2E_OUTCOME}" = "success" ]; then
            echo "✅ **Real e2e passed.**" >> "$GITHUB_STEP_SUMMARY"
          else
            # skipped / cancelled — surface it rather than implying a pass.
            echo "⚠️ **Real e2e did not run to a pass/fail** (outcome: \`${E2E_OUTCOME}\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
