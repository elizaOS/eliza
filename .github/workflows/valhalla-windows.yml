name: Valhalla Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/valhalla-android-companion-d28f
      - cursor/valhalla-ui-020-d28f
      - develop
    paths:
      - .github/workflows/valhalla-windows.yml
      - plugins/plugin-valhalla-copybot/install/**
      - plugins/plugin-valhalla-copybot/src/**
      - plugins/plugin-valhalla-copybot/public/**

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compile the desk outside the monorepo
        shell: bash
        run: |
          set -eu
          STAGE="plugins/plugin-valhalla-copybot/.windows-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/src" "$STAGE/public" "$STAGE/install/dist/public"
          cp -a plugins/plugin-valhalla-copybot/src/. "$STAGE/src/"
          cp -a plugins/plugin-valhalla-copybot/public/. "$STAGE/public/"
          cp -a plugins/plugin-valhalla-copybot/product.config.json "$STAGE/product.config.json"
          cp -a plugins/plugin-valhalla-copybot/install/valhalla.iss "$STAGE/install/valhalla.iss"
          cp -a plugins/plugin-valhalla-copybot/install/start-valhalla.bat "$STAGE/install/start-valhalla.bat"
          cp -a plugins/plugin-valhalla-copybot/install/valhalla.ico "$STAGE/install/valhalla.ico"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("plugins/plugin-valhalla-copybot/package.json","utf8")); delete p.devDependencies; delete p.peerDependencies; delete p.elizaos; p.dependencies=Object.fromEntries(Object.entries(p.dependencies||{}).filter(([,v])=>!String(v).startsWith("workspace:"))); fs.writeFileSync("plugins/plugin-valhalla-copybot/.windows-stage/package.json", JSON.stringify(p,null,2));'
          test -f "$STAGE/src/standalone.ts"
          bun --cwd "$STAGE" install --ignore-scripts
          bun --cwd "$STAGE" build --compile --target=bun src/standalone.ts --outfile install/dist/valhalla-desk.exe
          test -f "$STAGE/install/dist/valhalla-desk.exe"
          cp -a "$STAGE/public/." "$STAGE/install/dist/public/"
          echo "$STAGE" > "$RUNNER_TEMP/stage-path.txt"
      - name: Install installer tools
        run: choco install innosetup wixtoolset -y
      - name: Build exe and msi
        shell: bash
        run: |
          set -eu
          STAGE="$(cat "$RUNNER_TEMP/stage-path.txt")"
          cd "$STAGE/install"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" valhalla.iss
          mv Output/valhalla-setup.exe Output/Valhalla-Setup-x64.exe
          set +e
          WIX=$(find "/c/Program Files (x86)" -name heat.exe | head -1)
          WIXDIR=$(dirname "$WIX")
          "$WIXDIR/heat.exe" dir dist -cg DeskFiles -dr INSTALLFOLDER -gg -sfrag -srd -var var.DeskDir -out files.wxs
          cat > Product.wxs <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="Valhalla" Language="1033" Version="0.2.0.0" Manufacturer="TokenJunction LLC" UpgradeCode="7C3E9A10-4B2D-4F61-9C0A-202611030002">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perUser" />
              <MediaTemplate EmbedCab="yes" />
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="LocalAppDataFolder">
                  <Directory Id="INSTALLFOLDER" Name="Valhalla" />
                </Directory>
              </Directory>
              <Feature Id="Main" Title="Valhalla" Level="1">
                <ComponentGroupRef Id="DeskFiles" />
              </Feature>
            </Product>
          </Wix>
          EOF
          "$WIXDIR/candle.exe" Product.wxs files.wxs -dDeskDir=dist
          "$WIXDIR/light.exe" -out Output/Valhalla-Setup-x64.msi Product.wixobj files.wixobj
          set -e
          test -f Output/Valhalla-Setup-x64.exe
      - name: Publish the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          STAGE="$(cat "$RUNNER_TEMP/stage-path.txt")"
          cd "$STAGE/install/Output"
          curl -fsSL -o valhalla-phone.apk "https://github.com/TokenJunction/eliza-valhalla/releases/download/v0.1.1-phone/valhalla-phone.apk"
          EXT="$GITHUB_WORKSPACE/plugins/plugin-valhalla-copybot/extension"
          (cd "$EXT" && zip -r "$STAGE/install/Output/Valhalla-Chrome-Extension.zip" manifest.json popup.html popup.js background.js house-ads.json icons house)
          files="Valhalla-Setup-x64.exe valhalla-phone.apk Valhalla-Chrome-Extension.zip"
          if [ -f Valhalla-Setup-x64.msi ]; then files="$files Valhalla-Setup-x64.msi"; fi
          sha256sum $files > SHA256SUMS.txt
          node -e 'const fs=require("fs"); const rows=fs.readFileSync("SHA256SUMS.txt","utf8").trim().split(/\n/); const map={}; for (const row of rows){ const [hash,name]=row.split(/\s+/); map[name]=hash; } const version="0.2.0"; const base="https://github.com/TokenJunction/eliza-valhalla/releases/latest/download/"; const doc={version, notes:"Update ready, restart", windows: map["Valhalla-Setup-x64.exe"]?{url:base+"Valhalla-Setup-x64.exe", sha256:map["Valhalla-Setup-x64.exe"]}:undefined, android: map["valhalla-phone.apk"]?{url:base+"valhalla-phone.apk", sha256:map["valhalla-phone.apk"]}:undefined}; fs.writeFileSync("version.json", JSON.stringify(doc,null,2));'
          notes=$(cat <<'EOF'
          Download for Windows / Android

          Windows: https://github.com/TokenJunction/eliza-valhalla/releases/latest/download/Valhalla-Setup-x64.exe
          Windows MSI: https://github.com/TokenJunction/eliza-valhalla/releases/latest/download/Valhalla-Setup-x64.msi
          Android: https://github.com/TokenJunction/eliza-valhalla/releases/latest/download/valhalla-phone.apk
          Chrome steps: https://valhalla-app.xyz/extension/
          Chrome folder: https://github.com/TokenJunction/eliza-valhalla/releases/latest/download/Valhalla-Chrome-Extension.zip

          Windows may say the publisher is unknown while this file is unsigned. Choose More info, then Run anyway.

          Chrome does not install this zip when you click it. Open the three pictured steps, unzip the folder, turn on Developer mode, then Load unpacked. One-click Add to Chrome waits on the Chrome Web Store. Chrome on Android cannot install extensions.

          TokenJunction LLC publishes Valhalla. The desk stays read-only until you arm live on the PC. There is no send or withdraw.
          EOF
          )
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release edit v0.2.0 --title "Valhalla 0.2.0" --notes "$notes" --latest --prerelease=false
          else
            gh release create v0.2.0 --title "Valhalla 0.2.0" --notes "$notes" --latest
          fi
          gh release upload v0.2.0 $files version.json SHA256SUMS.txt --clobber
