name: Valhalla Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/valhalla-android-companion-d28f
    paths:
      - .github/workflows/valhalla-windows.yml
      - plugins/plugin-valhalla-copybot/install/**
      - plugins/plugin-valhalla-copybot/src/**
      - plugins/plugin-valhalla-copybot/public/**

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compile the desk outside the monorepo
        shell: bash
        run: |
          set -eu
          STAGE="$RUNNER_TEMP/valhalla-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/src" "$STAGE/public" "$STAGE/install"
          cp -r plugins/plugin-valhalla-copybot/src/. "$STAGE/src/"
          cp -r plugins/plugin-valhalla-copybot/public/. "$STAGE/public/"
          cp plugins/plugin-valhalla-copybot/product.config.json "$STAGE/product.config.json"
          cp plugins/plugin-valhalla-copybot/package.json "$STAGE/package.json"
          cp plugins/plugin-valhalla-copybot/install/valhalla.iss "$STAGE/install/valhalla.iss"
          cp plugins/plugin-valhalla-copybot/install/start-valhalla.bat "$STAGE/install/start-valhalla.bat"
          cp plugins/plugin-valhalla-copybot/install/valhalla.ico "$STAGE/install/valhalla.ico"
          cd "$STAGE"
          bun install --ignore-scripts
          mkdir -p install/dist/public
          bun build --compile --target=bun src/standalone.ts --outfile install/dist/valhalla-desk.exe
          cp -r public/. install/dist/public/
          echo "$STAGE" > "$RUNNER_TEMP/stage-path.txt"
      - name: Install installer tools
        run: choco install innosetup wixtoolset -y
      - name: Build exe and msi
        shell: bash
        run: |
          set -eu
          STAGE="$(cat "$RUNNER_TEMP/stage-path.txt")"
          cd "$STAGE/install"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" valhalla.iss
          mv Output/valhalla-setup.exe Output/Valhalla-Setup-x64.exe
          cat > Product.wxs <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="Valhalla" Language="1033" Version="0.1.2.0" Manufacturer="TokenJunction LLC" UpgradeCode="7C3E9A10-4B2D-4F61-9C0A-202611030002">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perUser" />
              <MediaTemplate EmbedCab="yes" />
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="LocalAppDataFolder">
                  <Directory Id="INSTALLFOLDER" Name="Valhalla" />
                </Directory>
              </Directory>
              <Feature Id="Main" Title="Valhalla" Level="1">
                <ComponentGroupRef Id="DeskFiles" />
              </Feature>
            </Product>
          </Wix>
          EOF
          heat dir dist -cg DeskFiles -dr INSTALLFOLDER -gg -sfrag -srd -var var.DeskDir -out files.wxs
          candle Product.wxs files.wxs -dDeskDir=dist
          light -out Output/Valhalla-Setup-x64.msi Product.wixobj files.wixobj
      - name: Publish the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          STAGE="$(cat "$RUNNER_TEMP/stage-path.txt")"
          cd "$STAGE/install/Output"
          curl -fsSL -o valhalla-phone.apk "https://github.com/TokenJunction/eliza-valhalla/releases/download/v0.1.1-phone/valhalla-phone.apk"
          EXT="$GITHUB_WORKSPACE/plugins/plugin-valhalla-copybot/extension"
          (cd "$EXT" && zip -r "$STAGE/install/Output/Valhalla-Chrome-Extension.zip" manifest.json popup.html popup.js icons)
          sha256sum Valhalla-Setup-x64.exe Valhalla-Setup-x64.msi valhalla-phone.apk Valhalla-Chrome-Extension.zip > SHA256SUMS.txt
          notes=$(cat <<'EOF'
          Download for Windows / Android

          Windows: https://github.com/TokenJunction/eliza-valhalla/releases/latest/download/Valhalla-Setup-x64.exe
          Windows MSI: https://github.com/TokenJunction/eliza-valhalla/releases/latest/download/Valhalla-Setup-x64.msi
          Android: https://github.com/TokenJunction/eliza-valhalla/releases/latest/download/valhalla-phone.apk
          Chrome: https://github.com/TokenJunction/eliza-valhalla/releases/latest/download/Valhalla-Chrome-Extension.zip

          Windows may say the publisher is unknown while this file is unsigned. Choose More info, then Run anyway.

          Chrome on a computer: unzip the file, open chrome://extensions, turn on Developer mode, then Load unpacked. Chrome on Android cannot install extensions.

          TokenJunction LLC publishes Valhalla. The desk stays read-only until you arm live on the PC. There is no send or withdraw.
          EOF
          )
          if gh release view v0.1.2 >/dev/null 2>&1; then
            gh release edit v0.1.2 --title "Valhalla 0.1.2" --notes "$notes" --latest --prerelease=false
          else
            gh release create v0.1.2 --title "Valhalla 0.1.2" --notes "$notes" --latest
          fi
          gh release upload v0.1.2 Valhalla-Setup-x64.exe Valhalla-Setup-x64.msi valhalla-phone.apk Valhalla-Chrome-Extension.zip SHA256SUMS.txt --clobber
