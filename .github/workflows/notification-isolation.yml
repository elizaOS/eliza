name: Notification isolation regression tests
on:
  push:
    branches: [develop]
    paths: ['src/services/emailNotifier*', 'scripts/autonomousOverseer.ts', '.github/workflows/notification-isolation.yml']
  pull_request:
    paths: ['src/services/emailNotifier*', 'scripts/autonomousOverseer.ts', '.github/workflows/notification-isolation.yml']
permissions:
  contents: read
jobs:
  notification-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/services/emailNotifierCore.mjs
      - run: node --test src/services/emailNotifierCore.test.mjs
