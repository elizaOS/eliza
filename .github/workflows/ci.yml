name: Qualify the combined Android and provider fixture patch
on:
  push:
    branches: [codex/qualify-combined-os-agent-fixtures-1123]
permissions:
  contents: read
jobs:
  affected-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: verify
          verification: 'false'
          cache-verification: 'false'
      - name: Exercise all Android packaging and staging assertions on the combined candidate
        working-directory: packages/os
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          pnpm exec vitest run test/build-android.test.vibe test/image.test.vibe --reporter=json --outputFile="$RUNNER_TEMP/combined-os.json"
          jq -e '.numPassedTests == 14 and .numFailedTests == 0 and .numPendingTests == 0' "$RUNNER_TEMP/combined-os.json"
      - name: Lint the four changed fixture files
        run: |
          pnpm exec eslint packages/agent/test/model-providers.test.vibe packages/os/test/drivers/jvm-adapter.ts packages/os/test/build-android.test.vibe packages/os/test/image.test.vibe
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-fixture-qualification
          path: ${{ runner.temp }}/combined-os.json
          if-no-files-found: warn
          retention-days: 5
