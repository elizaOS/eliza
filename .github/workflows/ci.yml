name: Qualify native shard publication from the historical aggregate-only transfer
on:
  push:
    branches: [codex/qualify-legacy-shard-245-1123]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e47318e1f99876f59bdbea98efbbcfdc0f5317bc
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: simulations-2
          run-id: 45191526997
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/actual-shard2-export
      - uses: ./.github/actions/setup
        with:
          job: simulate-2
          cache-verification: 'false'
      - name: Recreate the historical aggregate-only handoff in a new project
        run: |
          destination="$RUNNER_TEMP/legacy-project"
          mkdir -p "$destination"
          cp -R spec package.json "$destination"
          ln -s "$GITHUB_WORKSPACE/vibestack" "$destination/vibestack"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$destination/node_modules"
          cp -R "$RUNNER_TEMP/actual-shard2-export" "$destination/.spec-cache"
          python3 - <<'PYTHON'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          before=sorted(f.name for f in (p/'legacy-project'/'.spec-cache').iterdir() if f.is_file())
          assert len(before)==109 and all(n.startswith('simulate-') for n in before)
          (p/'original-broad-names.json').write_text(json.dumps(before))
          (p/'initial.json').write_text(json.dumps({'same':len(before),'broadFiles':len(before),'artifact':14830535899,'type':'historical-aggregate-only'}))
          PYTHON
      - id: original
        env:
          SHARD: '2'
          SHARDS: '4'
          CACHE_PREFIX: 'qualification-'
          RESTORED_KEY: ''
        working-directory: ${{ runner.temp }}/legacy-project
        run: |
          node --input-type=module <<'JS'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { prepareSimulationReceipts, readSpecs } from "./vibestack/formal.ts";
          const aggregate = (name) => /^simulate-[a-f0-9]{24}\.json\.(?:zst|gz)$/.test(name);
          const simulations = () => fs.globSync("simulate-*.json.*", { cwd: ".spec-cache" })
            .filter((name) => aggregate(name) && fs.lstatSync(path.join(".spec-cache", name)).isFile());
          const digest = (file) => createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const restored = new Map();
          for (const name of simulations()) {
            try { restored.set(name, digest(path.join(".spec-cache", name))); } catch { }
          }
          const specs = readSpecs(process.cwd());
          const inShard = ({ file }) => parseInt(createHash("sha256").update(file).digest("hex").slice(0, 8), 16) % Number(process.env.SHARDS) === Number(process.env.SHARD) - 1;
          const names = specs.filter(inShard).map(({ name }) => name);
          const { results, seedDirectory, partialDirectory } = await prepareSimulationReceipts(process.cwd(), specs, names, process.env.RUNNER_TEMP);
          const checkpoint = seedDirectory ?? partialDirectory;
          let transfer = checkpoint ?? fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "simulation-delta-"));
          if (!checkpoint) {
            for (const name of simulations()) if (!restored.has(name)) {
              fs.copyFileSync(path.join(".spec-cache", name), path.join(transfer, name));
            }
          } else {
            const contents = fs.readdirSync(checkpoint).sort().map((name) => [name, digest(path.join(checkpoint, name))]);
            if (contents.some(([name, hash]) => aggregate(name) && restored.get(name) !== hash)) {
              const fingerprint = createHash("sha256").update(JSON.stringify(contents)).digest("hex");
              const prefix = `${process.env.CACHE_PREFIX}${fingerprint}-`;
              if (!process.env.RESTORED_KEY.startsWith(prefix)) {
                const key = `${prefix}${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
                const directory = path.join(process.env.RUNNER_TEMP, "cached-simulation-receipts");
                try {
                  fs.rmSync(directory, { recursive: true, force: true });
                  fs.renameSync(checkpoint, directory);
                  transfer = directory;
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `cache-key=${key}\n`);
                } catch (error) {
                  console.log(`::warning::Could not stage the simulation cache: ${error.message}`);
                }
              }
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `directory=${transfer}\n`);
          const failed = results.filter(({ ok }) => !ok);
          for (const { stage, summary, detail, where } of failed) console.log(`✗ ${stage} ${where ?? ""}: ${summary}\n${detail}`);
          const kind = seedDirectory ? "complete seed" : partialDirectory ? "partial seed" : "new aggregate";
          console.log(`shard ${process.env.SHARD} of ${process.env.SHARDS}: ${names.length} specs, ${results.length} results, ${fs.readdirSync(transfer).length} ${kind} entries, ${failed.length} failed`);
          process.exitCode = failed.length ? 1 : 0;
          JS
      - name: Inspect the actual transferred certificate
        env:
          RECEIPTS: ${{ steps.original.outputs.directory }}
          CACHE_KEY: ${{ steps.original.outputs.cache-key }}
        run: |
          python3 - <<'PYTHON'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP']);before=set(json.loads((p/'original-broad-names.json').read_text()))
          names=sorted(f.name for f in pathlib.Path(os.environ['RECEIPTS']).iterdir());types=[x for x in names if x.startswith('action-')];sim=[x for x in names if x.startswith('simulate-')]
          oldkeys={x.rsplit('.',1)[0] for x in before};missing=[x for x in types if x.rsplit('.',1)[0] not in oldkeys]
          j={**json.loads((p/'initial.json').read_text()),'selectedTypechecks':len(types),'selectedAggregates':len(sim),'typechecksMissingFromBroad':len(missing),'missingActionNames':missing,'publishedShardKey':bool(os.environ['CACHE_KEY'])}
          print({k:v for k,v in j.items() if k!='missingActionNames'});assert len(sim)==109 and len(types)==161 and len(missing)==161 and not os.environ['CACHE_KEY']; assert not list((p/'legacy-project'/'gen'/'traces').glob('*'))
          (p/'legacy-shard-evidence.json').write_text(json.dumps(j,indent=2)+'\n')
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: legacy-shard-evidence
          path: ${{ runner.temp }}/legacy-shard-evidence.json
          if-no-files-found: error
          retention-days: 5
