name: Measure official Eliza model verification and guard examples
on:
  push:
    branches: [codex/qualify-current-guided-models-1123]
permissions:
  contents: read
jobs:
  vibestack-precompute-simulations:
    name: ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        model: [journey, triggers, billing, notifications, launch]
    env:
      SUBJECT: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: simulate-2
          cache-verification: 'false'
      - name: Run the ordinary model with a new project and action cache for each arm
        run: |
          mkdir -p "$RUNNER_TEMP/core-journey-record"
          case "$SUBJECT" in
            journey) area=spec/core/journey.md; printf '%s' '' | base64 -d > "$RUNNER_TEMP/guided-model"; ;;
            triggers) area=spec/agent/schedule/triggers.md; printf '%s' '' | base64 -d > "$RUNNER_TEMP/guided-model"; ;;
            billing) area=spec/cloud/billing/subscriptionCommands.md; printf '%s' '' | base64 -d > "$RUNNER_TEMP/guided-model"; ;;
            notifications) area=spec/core/notifications/recovery.md; printf '%s' '' | base64 -d > "$RUNNER_TEMP/guided-model"; ;;
            launch) area=spec/os/agentService/config.md; ;;
          esac
          cat > .qualify-current-model.mjs <<'NODE'
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {zstdDecompressSync,gunzipSync} from 'node:zlib';
          import {prepareSimulationReceipts,readSpecs,withFormalCache} from './vibestack/formal.ts';
          const [tag,area] = process.argv.slice(2);
          const tmp=process.env.RUNNER_TEMP;
          const root=path.join(tmp,'model-'+tag);
          const cache=path.join(tmp,'actions-'+tag);
          const evidence=path.join(tmp,'core-journey-record');
          fs.mkdirSync(evidence,{recursive:true});
          fs.mkdirSync(cache);
          assert.equal(fs.readdirSync(cache).length,0);
          fs.cpSync('spec',path.join(root,'spec'),{recursive:true});
          if(tag.includes('guide'))execFileSync('git',['apply',path.join(tmp,'guided-model')],{cwd:root});
          const specs=readSpecs(root);
          const target=specs.find(s=>s.file===area);
          const sha=data=>createHash('sha256').update(data).digest('hex');
          const closure=new Map();
          const include=s=>{if(closure.has(s.name))return;closure.set(s.name,sha(s.tangled));for(const k of s.imports)include(specs.find(r=>r.name===k));};
          include(target);
          const timer=performance.now();
          const preparation=await withFormalCache(cache,()=>prepareSimulationReceipts(root,specs,[target.name],tmp));
          const seconds=(performance.now()-timer)/1000;
          fs.writeFileSync(path.join(evidence,tag+'-verdicts.json'),JSON.stringify(preparation.results,null,2));
          if(tag==='official-launch'){console.log(JSON.stringify(preparation.results));assert.ok(preparation.results.every(r=>r.ok));process.exit(0);}
          assert.ok(preparation.seedDirectory);
          assert.ok(preparation.results.every(r=>r.ok));

          const files=fs.readdirSync(preparation.seedDirectory).sort();
          const receipt=files.find(f=>f.startsWith('simulate-'));
          assert.ok(receipt);
          const bytes=fs.readFileSync(path.join(preparation.seedDirectory,receipt));
          const r=JSON.parse(receipt.endsWith('.zst')?zstdDecompressSync(bytes):gunzipSync(bytes));
          const tested=r.result.tested;
          const summarize=t=>({count:t?.length,sha:sha(JSON.stringify(t??null))});
          const actions={};
          for(const f of r.used) {
            if(!fs.existsSync(path.join(cache,f)))continue;
            const b=fs.readFileSync(path.join(cache,f));
            const v=JSON.parse(f.endsWith('.zst')?zstdDecompressSync(b):gunzipSync(b));
            const names=Object.keys(v.files??{});
            actions[f]={files:names, out:(v.out??'').slice(0,250),stderr:(v.stderr??'').slice(0,50)};
          }
          const result={tag,area,pid:process.pid,seconds,closure:Object.fromEntries(closure),rows:preparation.results,actions,used:r.used,testing:tested?{events:summarize(tested.events),journeys:summarize(tested.journeys),traces:summarize(tested.traces)}:undefined,nativeFiles:fs.readdirSync(cache).length,seed:fs.readdirSync(preparation.seedDirectory).length};
          fs.writeFileSync(path.join(evidence,tag+'.json'),JSON.stringify(result,null,2));
          console.log(tag,JSON.stringify({seconds,results:result.rows.length,nativeFiles:result.nativeFiles,usedCount:r.used.length,testing:result.testing}));
          NODE
          node .qualify-current-model.mjs warmup spec/core/queryDrain.md
          if [[ $SUBJECT == launch ]]; then
            /usr/bin/time -p -o "$RUNNER_TEMP/core-journey-record/official-launch.time" node .qualify-current-model.mjs official-launch "$area"
          else
            for arm in stock-1 guide-1 guide-2 stock-2; do
              /usr/bin/time -p -o "$RUNNER_TEMP/core-journey-record/$arm.time" node .qualify-current-model.mjs "$arm" "$area"
            done
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-${{ matrix.model }}
          path: ${{ runner.temp }}/core-journey-record
          if-no-files-found: error
          retention-days: 7
