name: Qualify native Android adapter outputs across JDKs and measure warm reuse
on:
  push:
    branches: [codex/measure-native-compiler-identity-1123]
permissions:
  contents: read
env:
  BASE: 0d743619956147f3296becd7769c1b14ad48a8d3
  CANDIDATE: c3307164a2355e5ce9efe4e858bf0e6d3b76ab57
jobs:
  real-android-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Locate the real JDK and Android platform
        run: |
          test -x "$JAVA_HOME_21_X64/bin/javac"
          echo "SECOND_COMPILER=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Compile both source revisions and exercise actual adapter output
        run: |
          cat > .qualify-jvm.mjs <<'NATIVE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import path from 'node:path'
          import crypto from 'node:crypto'
          import {execFileSync} from 'node:child_process'
          import {compileAdapters,orgJsonAdapterClasspath} from './packages/os/test/drivers/jvm-adapter.ts'
          import {androidTools} from './packages/os/test/support/android-tools.ts'
          const tools=androidTools();assert.equal(tools.kind,'present')
          const cases = Array.from(new Set(Array.from(fs.readFileSync('packages/os/test/media-native.test.vibe','utf8').matchAll(/try checked\("([^"]+)"\)/g), m=>m[1])));assert.equal(cases.length,10)
          const s=performance.now(),c=process.cpuUsage()
          const digest=crypto.createHash('sha256');let classes=0
          const verdicts=[]
          for(const name of cases){
           const main='ai.eliza.plugins.media.'+name;const cp=await orgJsonAdapterClasspath(main)
           const dir=cp.split(path.delimiter)[0]
           for(const file of fs.globSync('**/*.class',{cwd:dir}).sort()){digest.update(file);digest.update(fs.readFileSync(path.join(dir,file)));classes++}
           const output=execFileSync(path.join(process.env.JAVA_HOME,'bin/java'),['-cp',cp,main],{encoding:'utf8'}).trim();const count=/^(\d+) [\w ]*passed|checks: (\d+)/m.exec(output);assert.ok(count && Number(count[1]??count[2])>0)
           verdicts.push([name,output])
          }
          const elapsed=performance.now()-s,cpu=process.cpuUsage(c)
          console.log(JSON.stringify({elapsed_ms:elapsed,parentCPU_ms:(cpu.user+cpu.system)/1000,compiled:cases.length,classes,digest:digest.digest('hex'),verdict:JSON.stringify(verdicts),androidJarSize:fs.statSync(tools.androidJar).size}))
          NATIVE
          python3 - <<'BENCHMARK'
          import json,os,pathlib,resource,shutil,subprocess,time
          r=pathlib.Path.cwd();p=pathlib.Path(os.environ['RUNNER_TEMP'])/'jvm-evidence';p.mkdir(exist_ok=True)
          f='packages/os/test/drivers/jvm-adapter.ts';base=os.environ['BASE'];candidate=os.environ['CANDIDATE'];rows=[]
          for i in range(6):
           for tag,sha in ([('before',base),('after',candidate)] if i%2==0 else [('after',candidate),('before',base)]):
            (r/f).write_bytes(subprocess.check_output(['git','show',sha+':'+f]))
            cache=r/'packages/os/.cache/jvm'; saved=p/('cache-'+tag)
            if cache.exists(): shutil.rmtree(cache)
            if saved.exists(): cache.parent.mkdir(parents=True,exist_ok=True);saved.rename(cache)
            c=resource.getrusage(resource.RUSAGE_CHILDREN);start=time.perf_counter()
            o=subprocess.run(['node','.qualify-jvm.mjs'],capture_output=True,text=True)
            if o.returncode: print(o.stderr[-4000:],flush=True);raise RuntimeError(o.returncode)
            d=json.loads(o.stdout.strip().splitlines()[-1]);cc=resource.getrusage(resource.RUSAGE_CHILDREN)
            row={**d,'tag':tag,'iteration':i,'wall':time.perf_counter()-start,'cpu':cc.ru_utime+cc.ru_stime-c.ru_utime-c.ru_stime}
            cache.rename(saved)
            rows.append(row);(p/'jvm.json').write_text(json.dumps(rows,indent=2));print(row,flush=True)
          assert len({(a['classes'],a['digest'],a['verdict']) for a in rows})==1
          BENCHMARK
      - name: Record all existing native adapter diagnostics at both revisions
        run: |
          mkdir -p "$RUNNER_TEMP/jvm-evidence"
          for revision in "$BASE" "$CANDIDATE"; do
            git show "$revision:packages/os/test/drivers/jvm-adapter.ts" > packages/os/test/drivers/jvm-adapter.ts
            node --input-type=module - "$revision" <<'JAVAC'
          import fs from "node:fs";
          import {compileAdapters} from "./packages/os/test/drivers/jvm-adapter.ts";
          const result=await compileAdapters();
          fs.writeFileSync(process.env.RUNNER_TEMP + "/jvm-evidence/full-" + process.argv[2] + ".json",JSON.stringify(result));
          console.log(result.compiled.length,result.failed.map(s=>s.split(String.fromCharCode(10))[0]));
          JAVAC
          done
          python3 - <<'DATA'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'jvm-evidence'
          a,b=[json.loads((p/('full-'+os.environ[k]+'.json')).read_text()) for k in ['BASE','CANDIDATE']]
          assert len(a['compiled'])==len(b['compiled'])
          assert sorted(s.splitlines()[0] for s in a['failed'])==sorted(s.splitlines()[0] for s in b['failed'])
          DATA
      - name: Compare native outputs after a compiler switch with independent cold builds
        run: |
          cat > .qualify-compiler.mjs <<'NATIVE'
          import assert from "node:assert/strict";
          import path from "node:path";
          import fs from "node:fs";
          import {createHash} from "node:crypto";
          import {execFileSync} from "node:child_process";
          import {orgJsonAdapterClasspath} from "./packages/os/test/drivers/jvm-adapter.ts";
          const main="ai.eliza.plugins.media.PhotoLibraryAccessTest";
          const cp=await orgJsonAdapterClasspath(main);const classes=cp.split(path.delimiter)[0];
          const files=Object.fromEntries(fs.globSync("**/*.class",{cwd:classes}).sort().map(f=>[f,createHash("sha256").update(fs.readFileSync(path.join(classes,f))).digest("hex")]));
          const java=process.env.JAVA_HOME?path.join(process.env.JAVA_HOME,"bin/java"):"java";
          const result=execFileSync(java,["-cp",cp,main],{encoding:"utf8"}).trim();assert.match(result,/1079 photo library access checks passed/);
          console.log(JSON.stringify({key:path.basename(classes),files,result}));
          NATIVE
          python3 - <<'CONTROL'
          import json,os,pathlib,shutil,subprocess
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'jvm-evidence';f='packages/os/test/drivers/jvm-adapter.ts';cache=pathlib.Path('packages/os/.cache/jvm');rows={}
          def invoke(home,via):
           e=dict(os.environ);e['PATH']=home+'/bin:'+e['PATH']
           if via=='PATH':e.pop('JAVA_HOME',None)
           else:e['JAVA_HOME']=home
           data=json.loads(subprocess.check_output(['node','.qualify-compiler.mjs'],env=e))
           data['version']=subprocess.check_output([home+'/bin/javac','-version'],env=e,text=True).strip()
           return data
          for tag in ['BASE','CANDIDATE']:
           pathlib.Path(f).write_bytes(subprocess.check_output(['git','show',os.environ[tag]+':'+f]))
           if cache.exists():shutil.rmtree(cache)
           one=invoke(os.environ['JAVA_HOME_21_X64'],'home');cross=invoke(os.environ['SECOND_COMPILER'],'PATH')
           shutil.rmtree(cache);cold=invoke(os.environ['SECOND_COMPILER'],'home');warm=invoke(os.environ['SECOND_COMPILER'],'PATH')
           rows[tag]=dict(initial=one,switched=cross,cold=cold,warm=warm);(p/'compiler-comparison.json').write_text(json.dumps(rows,indent=2))
           print(tag,one['version'],cross['version'],[k for k in cold['files'] if cross['files'][k]!=cold['files'][k]],flush=True)
           assert one['result']==cold['result']==cross['result']==warm['result'] and warm['files']==cold['files'] and cold['key']==warm['key']
           if tag=='CANDIDATE':assert one['key']!=cross['key'] and cross['key']==cold['key'] and cross['files']==cold['files']
           else:assert one['key']==cross['key'] and cross['files']==one['files']
          CONTROL
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jvm-journeys
          path: ${{ runner.temp }}/jvm-evidence/*.json
          if-no-files-found: ignore
          retention-days: 5
