name: Check packed Core installation isolation
on:
  push:
    branches: [codex/measure-core-fixture-isolation-1123]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TURBO_CACHE: local:rw
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: db085c717fff3dd9672271f44337c93d70cc1064
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: verify
          cache-verification: "false"
      - name: Run the real packed Core consumer with both install modes
        shell: bash
        run: |
          set -euo pipefail
          export RESULTS="$RUNNER_TEMP/core-isolation"
          mkdir -p "$RESULTS"
          git rev-parse HEAD > "$RESULTS/candidate-sha"
          git rev-parse HEAD^ > "$RESULTS/base-sha"
          git diff HEAD^ HEAD --stat > "$RESULTS/change"
          node --version > "$RESULTS/node"
          pnpm --version > "$RESULTS/pnpm"
          pnpm config get package-import-method > "$RESULTS/default-method"
          getconf _NPROCESSORS_ONLN > "$RESULTS/processors"
          lscpu > "$RESULTS/cpu"
          cat > "$RESULTS/state.py" <<'PY'
          from pathlib import Path
          import hashlib,json,os
          from time import time_ns
          root=Path.cwd()
          paths=sorted(set(x for pat in ['node_modules/.pnpm/protobufjs@*/node_modules/@types/node/package.json','node_modules/.pnpm/zod@*/node_modules/zod/package.json'] for x in root.glob(pat)))
          assert len(paths)>=2,paths
          def describe(p):
              s=p.stat()
              return {'dev':s.st_dev,'ino':s.st_ino,'nlink':s.st_nlink,'bytes':s.st_size,'mtime':s.st_mtime_ns,'ctime':s.st_ctime_ns,'digest':hashlib.sha256(p.read_bytes()).hexdigest()}
          print(json.dumps({'at':time_ns(),'files':{str(p.relative_to(root)):describe(p) for p in paths}},sort_keys=True))
          PY
          for mode in base candidate; do
            dest="$RESULTS/$mode"
            mkdir -p "$dest"
            if [[ "$mode" == base ]]; then
              git show HEAD^:packages/core/test/support/child.ts > packages/core/test/support/child.ts
            else
              git restore --source HEAD --worktree -- packages/core/test/support/child.ts
            fi
            git hash-object packages/core/test/support/child.ts > "$dest/helper-blob"
            python3 "$RESULTS/state.py" > "$dest/before.json"
            set +e
            /usr/bin/time -v -o "$dest/time.txt" pnpm --filter @elizaos/core run test test/core.test.vibe -t '^the packed tarball installs, imports, compiles and shares state across copies' --maxWorkers 1 --reporter=verbose > "$dest/product.log" 2>&1
            status=$?
            set -e
            echo "$status" > "$dest/exit"
            python3 "$RESULTS/state.py" > "$dest/after.json"
            tail -15 "$dest/product.log"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packed-core-isolation
          path: ${{ runner.temp }}/core-isolation
      - name: Check both journeys and real source file identities
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'core-isolation'
          for mode in ['base','candidate']:
              folder=root/mode
              a,b=[json.loads((folder/(k+'.json')).read_text())['files'] for k in ['before','after']]
              assert a.keys()==b.keys() and len(a)>=2
              assert all(all(a[k][f]==b[k][f] for f in ['dev','ino','bytes','mtime','digest']) for k in a)
              changes=[k for k in a if a[k]!=b[k]]
              print(mode,'watched',len(a),'changed metadata',changes)
              assert bool(changes)==(mode=='base')
              log=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',(folder/'product.log').read_text())
              assert (folder/'exit').read_text().strip()=='0' and re.search(r'Tests\s+1 passed',log)
          PY
