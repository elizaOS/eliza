name: Qualify provider database and JVM fixtures against ordinary journeys
on:
  push:
    branches: [codex/measure-source-journey-fixtures-1123]
permissions:
  contents: read
env:
  BASE: 7a8ad3ce4da1ff4576e5d5b44954552f551ccf8b
  CANDIDATE: 37359a279e524150431ef6d7b0dd2585c5af1485
jobs:
  native-provider-and-maps-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      TURBO_CACHE: local:rw
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: ./.github/actions/setup
        with:
          job: verify
      - name: Build the current consumer dependencies
        run: pnpm exec turbo run build --filter=@elizaos/core --filter=@elizaos/cloud --filter=@elizaos/agent --continue=dependencies-successful
      - name: Verify the current Maps journey and alternate original and candidate provider files
        run: |
          python3 - <<'BENCHMARK'
          import json, os, pathlib, resource, statistics, subprocess, time
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'journey-evidence';p.mkdir(exist_ok=True)
          root=pathlib.Path.cwd();src='packages/agent/test/model-providers.test.vibe';base=os.environ['BASE'];cand=os.environ['CANDIDATE']
          hook=p/'count.cjs';hook.write_text("""const fs=require('node:fs'); const fp=require('node:fs/promises'); const orig=fp.mkdtemp; fp.mkdtemp=async function(prefix,...args){const out=await orig.call(this,prefix,...args); if(String(prefix).endsWith('/model-providers-'))fs.appendFileSync(process.env.DB_COUNTER,out+'\\n');return out};require('node:module').syncBuiltinESMExports()""")
          results=[]
          def run(tag,package,test,args,count=False,n=0):
           f=p/(tag+'-'+package+'-'+str(n)); report=f.with_suffix('.json');counter=f.with_suffix('.counter')
           env=dict(os.environ); env.pop('NODE_OPTIONS',None)
           if count:env.update(NODE_OPTIONS='--require='+str(hook),DB_COUNTER=str(counter))
           cmd=['pnpm','exec','vitest','run',test,*args,'--reporter=json','--outputFile='+str(report)]
           w=time.perf_counter();c=resource.getrusage(resource.RUSAGE_CHILDREN)
           with f.with_suffix('.log').open('wb') as out:r=subprocess.run(cmd,cwd=root/'packages'/package,stdout=out,stderr=subprocess.STDOUT,env=env)
           cc=resource.getrusage(resource.RUSAGE_CHILDREN);elapsed=time.perf_counter()-w
           if not report.exists(): print(f.with_suffix('.log').read_text()[-5000:],flush=True);raise RuntimeError('no native test report')
           d=json.loads(report.read_text());cases=[(a['title'],a['status'],a.get('duration')) for g in d['testResults'] for a in g['assertionResults'] if a['status']!='pending']
           row={'tag':tag,'package':package,'n':n,'wall':elapsed,'cpu':cc.ru_utime+cc.ru_stime-c.ru_utime-c.ru_stime,'exit':r.returncode,'cases':cases,'stores':counter.read_text().splitlines() if counter.exists() else None}
           results.append(row);(p/'native-journeys.json').write_text(json.dumps(results,indent=2))
           print(tag,package,n,r.returncode,len(cases),round(elapsed,2),None if row['stores'] is None else len(row['stores']),flush=True)
           if r.returncode!=0 or not cases or any(a[1]!='passed' for a in cases):
            print(f.with_suffix('.log').read_text()[-2500:],flush=True);print(str(d['testResults'])[-4000:],flush=True);raise RuntimeError('native journey failed')
           return row
          # Verify the current officially merged Maps readiness journey before alternating.
          run('current','plugin-maps','test/maps.test.vibe',['-t','Keep one location watch and clean up stale callbacks and handles'])
          def use(ref): (root/src).write_bytes(subprocess.check_output(['git','show',ref+':'+src]))
          for i in range(6):
           for tag,ref in ([('before',base),('after',cand)] if i%2==0 else [('after',cand),('before',base)]):
            use(ref);row=run(tag,'agent','test/model-providers.test.vibe',[],i==0,i)
            assert len(row['cases'])==7
            if i==0:
             assert row['stores'] and len(row['stores'])==len(set(row['stores']))==(11 if tag=='before' else 7)
             assert all(not pathlib.Path(a).exists() for a in row['stores'])
          # Same normal test processes can run independently with isolated state.
          use(cand)
          f=open(p/'parallel.log','wb')
          other=subprocess.Popen(['pnpm','exec','vitest','run','test/model-providers.test.vibe','--reporter=json','--outputFile='+str(p/'parallel.json')],cwd=root/'packages/agent',stdout=f,stderr=f)
          row=run('concurrent','agent','test/model-providers.test.vibe',[],True,100)
          assert other.wait()==0 and len(row['stores'])==7;f.close()
          q=json.loads((p/'parallel.json').read_text());assert q['numPassedTests']==7
          BENCHMARK
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-journeys
          path: |
            ${{ runner.temp }}/journey-evidence/*.json
            ${{ runner.temp }}/journey-evidence/*.log
          if-no-files-found: ignore
          retention-days: 5
  real-android-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Locate the real JDK and Android platform
        run: |
          test -x "$JAVA_HOME_21_X64/bin/javac"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Compile both source revisions and exercise actual adapter output
        run: |
          cat > .qualify-jvm.mjs <<'NATIVE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import path from 'node:path'
          import crypto from 'node:crypto'
          import {execFileSync} from 'node:child_process'
          import {compileAdapters,orgJsonAdapterClasspath} from './packages/os/test/drivers/jvm-adapter.ts'
          import {androidTools} from './packages/os/test/support/android-tools.ts'
          const tools=androidTools();assert.equal(tools.kind,'present')
          const start=performance.now(),c=process.cpuUsage()
          const result=await compileAdapters();const elapsed=performance.now()-start,cpu=process.cpuUsage(c)
          assert.deepEqual(result.failed,[]);assert.ok(result.compiled.length>=20)
          const digest=crypto.createHash('sha256')
          let classes=0
          for(const dir of result.compiled) for(const f of fs.globSync('**/*.class',{cwd:dir}).sort()){digest.update(f);digest.update(fs.readFileSync(path.join(dir,f)));classes++}
          const main='ai.eliza.plugins.media.PhotoCropTest',cp=await orgJsonAdapterClasspath(main)
          const verdict=execFileSync(path.join(process.env.JAVA_HOME,'bin/java'),['-cp',cp,main],{encoding:'utf8'}).trim()
          assert.match(verdict,/\d+ assertions passed/)
          console.log(JSON.stringify({elapsed_ms:elapsed,parentCPU_ms:(cpu.user+cpu.system)/1000,compiled:result.compiled.length,classes,digest:digest.digest('hex'),verdict,androidJarSize:fs.statSync(tools.androidJar).size}))
          NATIVE
          python3 - <<'BENCHMARK'
          import json,os,pathlib,resource,shutil,subprocess,time
          r=pathlib.Path.cwd();p=pathlib.Path(os.environ['RUNNER_TEMP'])/'jvm-evidence';p.mkdir(exist_ok=True)
          f='packages/os/test/drivers/jvm-adapter.ts';base=os.environ['BASE'];candidate=os.environ['CANDIDATE'];rows=[]
          for i in range(6):
           for tag,sha in ([('before',base),('after',candidate)] if i%2==0 else [('after',candidate),('before',base)]):
            (r/f).write_bytes(subprocess.check_output(['git','show',sha+':'+f]))
            cache=r/'packages/os/.cache/jvm'; saved=p/('cache-'+tag)
            if cache.exists(): shutil.rmtree(cache)
            if saved.exists(): cache.parent.mkdir(parents=True,exist_ok=True);saved.rename(cache)
            c=resource.getrusage(resource.RUSAGE_CHILDREN);start=time.perf_counter()
            o=subprocess.run(['node','.qualify-jvm.mjs'],capture_output=True,text=True)
            if o.returncode: print(o.stderr[-4000:],flush=True);raise RuntimeError(o.returncode)
            d=json.loads(o.stdout.strip().splitlines()[-1]);cc=resource.getrusage(resource.RUSAGE_CHILDREN)
            row={**d,'tag':tag,'iteration':i,'wall':time.perf_counter()-start,'cpu':cc.ru_utime+cc.ru_stime-c.ru_utime-c.ru_stime}
            cache.rename(saved)
            rows.append(row);(p/'jvm.json').write_text(json.dumps(rows,indent=2));print(row,flush=True)
          assert len({(a['classes'],a['digest'],a['verdict']) for a in rows})==1
          BENCHMARK
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jvm-journeys
          path: ${{ runner.temp }}/jvm-evidence/jvm.json
          if-no-files-found: ignore
          retention-days: 5
