# This workflow is the sole pull-request and branch-health validation entry
# point. It keeps one stable required status while path classification limits
# expensive tests to the surfaces changed by a pull request.
name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]
  merge_group:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      plugins: ${{ steps.filter.outputs.plugins }}
      desktop: ${{ steps.filter.outputs.desktop }}
      zero_key: ${{ steps.filter.outputs.zero_key }}
      cloud: ${{ steps.filter.outputs.cloud }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Classify affected test surfaces
        id: filter
        shell: bash
        env:
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          node packages/scripts/ci-path-gate.mjs \
            --config test \
            --event "${GITHUB_EVENT_NAME}" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --labels "$PR_LABELS" \
            --output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Repository verification
        run: bun run verify

      - name: Formatting
        run: bun run format:check

      - name: Build core contract
        run: bun run build:core

  tests:
    name: Tests
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Generate runtime contracts
        run: node packages/shared/scripts/generate-keywords.mjs

      - name: Script contract tests
        env:
          E2E_COVERAGE_GATE_ENFORCE: "1"
        run: bun run test:scripts

      - name: Build view and plugin bundles
        if: needs.changes.outputs.server == 'true'
        run: bun run build:views

      - name: Server tests
        if: needs.changes.outputs.server == 'true'
        run: bun run test:server

      - name: Client tests
        if: needs.changes.outputs.client == 'true'
        run: bun run test:client

      - name: Plugin tests
        if: needs.changes.outputs.plugins == 'true'
        run: bun run test:plugins

      - name: No affected unit-test lane
        if: needs.changes.outputs.server != 'true' && needs.changes.outputs.client != 'true' && needs.changes.outputs.plugins != 'true'
        run: echo "No server, client, or plugin test lane is affected."

  smoke:
    name: Smoke
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - uses: ./.github/actions/setup-bun-workspace
        if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.zero_key == 'true' || needs.changes.outputs.cloud == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Build shared runtime prerequisites
        if: needs.changes.outputs.desktop == 'true'
        run: bun run build:core

      - name: Desktop startup smoke
        if: needs.changes.outputs.desktop == 'true'
        run: bun run test:dev-startup

      - name: Install Chromium for deterministic end-to-end smoke
        if: needs.changes.outputs.zero_key == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Deterministic core-shell browser smoke
        if: needs.changes.outputs.zero_key == 'true'
        run: >-
          bun run --cwd packages/app test:e2e --
          --project=chromium
          test/ui-smoke/ui-smoke.spec.ts

      - name: Cloud tests
        if: needs.changes.outputs.cloud == 'true'
        run: bun run test:cloud

      - name: No affected smoke lane
        if: needs.changes.outputs.desktop != 'true' && needs.changes.outputs.zero_key != 'true' && needs.changes.outputs.cloud != 'true'
        run: echo "No desktop, deterministic E2E, or cloud smoke lane is affected."

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan changed commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="-1 ${HEAD_SHA}"
          fi
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --redact \
            --no-banner \
            --log-opts "$range"

  required:
    name: Required
    if: always()
    needs: [changes, quality, tests, smoke, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            quality=${{ needs.quality.result }}
            tests=${{ needs.tests.result }}
            smoke=${{ needs.smoke.result }}
            secrets=${{ needs.secrets.result }}
        run: |
          set -euo pipefail
          for pair in $RESULTS; do
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::$pair"
              exit 1
            fi
          done
