name: Qualify immutable receipts arriving at ordinary simulation queue admission
on:
  push:
    branches: [codex/qualify-native-queued-receipts-1123]
permissions:
  contents: read
jobs:
  vibestack-precompute-simulations:
    name: Native queued work (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, queued]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - if: matrix.variant == 'stock'
        name: Restore native pre-change source
        run: git checkout HEAD^ -- vibestack/cache.ts vibestack/simulate.ts
      - uses: ./.github/actions/setup
        with:
          job: simulate-2
          cache-verification: 'false'
      - name: Time real ordinary cold, unchanged, warm, late, partial and changed-input work
        run: |
          cat > .queue-bench.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { zstdDecompressSync } from 'node:zlib';
          import { readSpecs, prepareSimulationReceipts, withFormalCache } from './vibestack/formal.ts';
          const [phase, sample] = process.argv.slice(2);
          const folder = process.env.RUNNER_TEMP;
          const runs = path.join(folder, 'out');
          const source = path.join(folder, 'candidate-seed');
          const root = path.join(folder, 'case-'+phase+sample);
          const cache = path.join(root,'.spec-cache');
          const targets = ['todos/index','core/index','notes/trash','sqlite/index','core/grammar','inbox/failures','files/images','maps/routing','inbox/outgoing','inbox/display','calendar/actions','inbox/handoff','files/library','browser/control','nativeMedia/index','workflow/notices','files/workspace','reminders/index','notes/organize','knowledge/index','os/android/bridge','scheduling/index','nativeCamera/index','core/occurrenceWindow'].map(x=>'spec/'+x+'.md');
          fs.mkdirSync(runs,{recursive:true});fs.mkdirSync(root);fs.cpSync('spec',path.join(root,'spec'),{recursive:true});fs.copyFileSync('package.json',path.join(root,'package.json'));fs.symlinkSync(fs.realpathSync('node_modules'),path.join(root,'node_modules'),'dir');fs.mkdirSync(cache);
          if (phase==='changed') {
           const file=path.join(root,'spec/files/images.md');
           const src=fs.readFileSync(file,'utf8'),old='imageBytes > maxImageBytes implies not(admitsImageBytes(supported, imageBytes))';
           assert.equal(src.split(old).length,2);fs.writeFileSync(file,src.replace(old,'imageBytes < 0'));
          }
          const baseline=fs.existsSync(source) ? fs.readdirSync(source).sort() : [];
          for (const f of baseline.filter(f=>f.startsWith('action-') || (phase==='warm' && f.startsWith('simulate-')))) fs.copyFileSync(path.join(source,f),path.join(cache,f));
          const read = fs.readFileSync.bind(fs);
          const matches = /^simulate-[a-f0-9]{24}\.json\.zst$/;
          const expected=baseline.filter(f=>matches.test(f));
          const initial=new Set(),native=new Set(),hits=new Set();
          let published=null;
          const publish=()=>{
           const sent=phase==='partial'?expected.filter((_,i)=>i%2===0):expected;
           let linked=0;
           for (const name of sent) {
             const to=path.join(cache,name);
             try { fs.linkSync(path.join(source,name),to); linked++; } catch(e) {if(e.code!=='EEXIST')throw e;}
           }
           published={linked,planned:sent.length,initial:initial.size,native:native.size,at:performance.now()};
          };
          fs.readFileSync=function(file,...args){
           const basename=typeof file==='string'?path.basename(file):'';
           const observed=typeof file==='string' && file.startsWith(cache+'/') && matches.test(basename);
           try {const bytes=read(file,...args);if(observed)hits.add(basename);return bytes;}
           catch(err){if(observed && err.code==='ENOENT'){
             initial.add(basename);
             if(['late','partial','changed'].includes(phase) && published===null && initial.size===expected.length) {
              published='pending';setImmediate(publish);
             }
           }throw err;}
          };
          const write=fs.renameSync.bind(fs);fs.renameSync=function(from,to){const answer=write(from,to);if(typeof to==='string'&&to.startsWith(cache+'/')&&matches.test(path.basename(to)))native.add(path.basename(to));return answer};
          const start=performance.now();
          const specs=readSpecs(root);const names=specs.filter(s=>phase==='prime'?s.file==='spec/core/queryDrain.md':targets.includes(s.file)).map(s=>s.name);assert.equal(names.length,phase==='prime'?1:targets.length);
          const result=await withFormalCache(cache,()=>prepareSimulationReceipts(root,specs,names,folder));
          fs.readFileSync=read;fs.renameSync=write;
          const selected=result.seedDirectory??result.partialDirectory;assert.ok(selected);
          const all=fs.readdirSync(selected).sort(),sims=all.filter(f=>matches.test(f));
          const outputs=sims.map(f=>{const row=JSON.parse(zstdDecompressSync(read(path.join(selected,f))));return {file:row.result.said[0].where,output:row.result,used:row.used.toSorted()} }).sort((a,b)=>a.file.localeCompare(b.file));
          if (phase==='seed') fs.cpSync(selected,source,{recursive:true});
          const fingerprint=x=>createHash('sha256').update(JSON.stringify(x)).digest('hex');
          const evidence={phase,sample,seconds:(performance.now()-start)/1000,targets:names.length,receipts:sims.length,rows:result.results.length,failed:result.results.filter(r=>!r.ok),complete:!!result.seedDirectory,published,native:[...native].sort(),warmHits:hits.size,initialMisses:initial.size,physicalActions:fs.readdirSync(cache).filter(s=>s.startsWith('action-')).length-all.filter(s=>s.startsWith('action-')).length,validity:outputs.map(x=>[x.file,fingerprint(x.output),fingerprint(x.used)])};
          fs.writeFileSync(path.join(runs,phase+'-'+sample+'.json'),JSON.stringify(evidence));console.log(JSON.stringify({...evidence,validity:undefined,native:native.size,failed:evidence.failed.length}));
          JS
          cat > "$RUNNER_TEMP/check.py" <<'PYCODE'
          from pathlib import Path
          import json,os
          d=Path(os.environ['RUNNER_TEMP'])/'out';variant=os.environ['VARIANT']
          def load(phase,n=0):return json.loads((d/(phase+'-'+str(n)+'.json')).read_text())
          base=load('seed');assert not base['failed'] and base['complete'] and base['targets']==base['receipts']==24
          reports=[]
          for phase,n in [('cold',0),('warm',0),('late',0),('partial',0),('changed',0),('late',1),('warm',1),('cold',1)]:
           r=load(phase,n);times=(d/(phase+'-'+str(n)+'.time')).read_text();r['time']={l.split()[0]:float(l.split()[1]) for l in times.splitlines() if l.split()[0] in ('real','user','sys')};own=len(r['native']);print(phase,n,own,r['published'],r['time'],r['physicalActions'],flush=True)
           if phase=='changed':
            assert r['failed'] and all(x['where']=='spec/files/images.md' for x in r['failed']) and not r['complete'],r['failed']
            assert [x for x in base['validity'] if x[0]!='spec/files/images.md']==[x for x in r['validity'] if x[0]!='spec/files/images.md']
           else:assert r['complete'] and not r['failed'] and r['validity']==base['validity'] and r['rows']==base['rows']
           if phase in ('changed','late','partial'):
            assert r['published']['initial']==r['targets'],r
            if variant=='queued':
             assert 0<own<24,(phase,own)
             if phase=='partial':assert own>=12
            else:assert own==24,(phase,own)
           elif phase=='cold':assert own==24
           else:assert own==0 and r['initialMisses']==0
           reports.append({k:v if k!='native' else len(v) for k,v in r.items() if k not in ('validity','failed')})
          (d/'result.json').write_text(json.dumps({'variant':variant,'controls':reports},indent=2))
          PYCODE
          mkdir -p "$RUNNER_TEMP/out"
          cpus=$(python3 -c 'import os; print(",".join(map(str,sorted(os.sched_getaffinity(0))[:2])))')
          run() {
            taskset --cpu-list "$cpus" /usr/bin/time -p -o "$RUNNER_TEMP/out/$1-$2.time" node .queue-bench.mjs "$1" "$2"
          }
          run prime 0
          run seed 0
          run cold 0
          run warm 0
          run late 0
          run partial 0
          run changed 0
          run late 1
          run warm 1
          run cold 1
          python3 "$RUNNER_TEMP/check.py"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: queue-evidence-${{ matrix.variant }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 7
