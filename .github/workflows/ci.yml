name: Qualify an exact Eliza simulation receipt receiver
on:
  push:
    branches: [codex/qualify-eliza-simulation-receive-40311]
permissions:
  contents: read
  actions: read
env:
  TURBO_TELEMETRY_DISABLED: "1"
jobs:
  vibestack-precompute-simulations:
    name: Receive PR 40311 simulation receipts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm the exact sources in the shallow checkout
        run: |
          test "$(git cat-file -p HEAD | sed -n '2s/^parent //p')" = 8d09af2d4f07cc31de9115e5fed61498fa522709
          test "$(git hash-object .github/actions/setup/action.yml)" = 8e84ccfaca351bd173a256bde7b8de5863667a27
          test "$(git hash-object spec/core/queryDrain.md)" = 69834d61d07b0bb0cad63b3176c69fa876cb3226
          test "$(git hash-object spec/core/identityGroups.md)" = b460be669c90b0a362886810d71269816718c96c
          test "$(git hash-object vibestack/simulate.ts)" = 90bbfa3e05aa449da28c9d3b50fe4b678c2fdb41
          test "$(git hash-object vibestack/units.ts)" = b9a45ec81d8af474d7e9107c1b8beb73da21d251
          test "$(git hash-object vibestack/cache.ts)" = 3a8d36437520378b88116d24b36c1eab66157293
      - uses: ./.github/actions/setup
        with:
          job: simulate-2
          cache-verification: "false"
      - name: Confirm the isolated receiver has no old model receipts or traces
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const cache = fs.existsSync(".spec-cache") ? fs.readdirSync(".spec-cache") : [];
          assert(!cache.some((name) => /^(action|simulate)-/.test(name)));
          assert(!fs.existsSync("gen/traces"));
          JS
      - name: Download only the four authentic simulation shards
        uses: actions/download-artifact@v8
        with:
          artifact-ids: "14837235598,14835283598,14836311043,14835577756"
          run-id: 45202619442
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/simulation-receipts
      - name: Verify the four received artifact directories
        env:
          SIMULATION_RECEIPTS: ${{ runner.temp }}/simulation-receipts
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const source = process.env.SIMULATION_RECEIPTS;
          const entries = fs.readdirSync(source, { withFileTypes: true });
          assert(entries.every((entry) => entry.isDirectory()));
          assert.deepEqual(entries.map(({ name }) => name).sort(), ["simulations-1", "simulations-2", "simulations-3", "simulations-4"]);
          JS
      - name: Import the checked-in workflow's exact simulation receipts
        env:
          SIMULATION_RECEIPTS: ${{ runner.temp }}/simulation-receipts
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          const source = process.env.SIMULATION_RECEIPTS;
          const cache = ".spec-cache";
          const candidates = fs.globSync(["*", "simulations-*/*"], { cwd: source })
            .filter((file) => /^(?:simulations-\d+\/)?(?:action|simulate)-[a-f0-9]{24}\.json\.(?:zst|gz)$/.test(file) && fs.lstatSync(path.join(source, file)).isFile());
          fs.mkdirSync(cache, { recursive: true });
          let imported = 0;
          for (const [key, files] of Map.groupBy(candidates, (file) => path.basename(file, path.extname(file)))) {
            if (["zst", "gz"].some((codec) => fs.lstatSync(path.join(cache, `${key}.${codec}`), { throwIfNoEntry: false }))) continue;
            const name = path.basename(files[0]);
            const bytes = fs.readFileSync(path.join(source, files[0]));
            if (files.slice(1).some((file) => path.basename(file) !== name || !bytes.equals(fs.readFileSync(path.join(source, file))))) {
              console.log(`::warning::Shards disagree on ${key}; the ordinary check will recompute it.`);
              continue;
            }
            fs.writeFileSync(path.join(cache, name), bytes, { flag: "wx" });
            imported++;
          }
          console.log(`Imported ${imported} simulation and typecheck receipts.`);
          JS
      - name: Prepare and verify the same two checked Core models
        env:
          MODE: receiver
        run: |
          mkdir -p "$RUNNER_TEMP/simulation-install-evidence"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { createRequire } from "node:module";
          import { zstdDecompressSync, gunzipSync } from "node:zlib";
          import { prepareSimulationReceipts, readSpecs } from "./vibestack/formal.ts";
          import { installedProgram } from "./vibestack/cache.ts";
          import { evaluatorIdentity } from "./vibestack/installed.ts";
          const root = process.cwd();
          const require = createRequire(path.join(root, "package.json"));
          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const mode = process.env.MODE;
          const quint = installedProgram(root, "quint");
          const evaluator = evaluatorIdentity(root);
          assert(quint?.id && quint.isolated && evaluator, "expected certified installed Quint and evaluator");
          const manager = require("@informalsystems/quint/dist/src/rust/binaryManager.js");
          const evaluatorFile = path.join(process.env.QUINT_HOME ?? path.join(os.homedir(), ".quint"),
            `rust-evaluator-${manager.QUINT_EVALUATOR_VERSION}`, "quint_evaluator");
          const evaluatorDigest = sha256(fs.readFileSync(evaluatorFile));
          assert.equal(evaluator, evaluatorDigest);
          let vibelang = null;
          if (fs.existsSync(path.join(root, "node_modules", "vibelang"))) {
            const { findBinary } = await import("vibelang/binary");
            const file = findBinary();
            fs.accessSync(file, fs.constants.X_OK);
            vibelang = { version: JSON.parse(fs.readFileSync(path.join(root, "node_modules/vibelang/package.json"), "utf8")).version, binarySha256: sha256(fs.readFileSync(file)) };
          }
          const cache = path.join(root, ".spec-cache");
          const cachedNames = () => fs.existsSync(cache) ? fs.readdirSync(cache) : [];
          const expectedReceipts = {"action-13201e611c038903ba470c45.json.zst":{"bytes":6571,"sha256":"bf1901b18f94f8b1b5d51db46101244b03f604708c45a76946b5b63ccf00f169","decodedSha256":"9165958aaeaf39898fac9c1e8cf900586b8613459499f6c327735ed10473ca49"},"action-60bf66de113e14ef2af9231b.json.zst":{"bytes":42060,"sha256":"4c5293414b486047ee50bab7b28315271a4cc4d5e5d911457025c8c0609dab32","decodedSha256":"128cc3f972187ad663ffd65a141ffd885faf6c3bca7cca6ecd236369e1171bb9"},"simulate-0fe8cf089b249370a6a949f6.json.zst":{"bytes":3783,"sha256":"4f982084a0d67ae00c764352576f99304145faa30a3d6b8c55a10ee8d4d724a9","decodedSha256":"c96aa5f7ee259d53d4138dad9b24132f7f6a3c5218c98e9fbb6757ff7804b8a0"},"simulate-cf31285be37be12b0185e976.json.zst":{"bytes":9444,"sha256":"69bb0662a884ce6569142a1ac14014c8a43e3b320675144f559b61c5e37096d7","decodedSha256":"008ad4ee753281d1459fdbef211a44048249b0e9fc3534b66318fb1d093ff60e"}};
          const snapshot = new Map(cachedNames().filter((name) => /^(action|simulate)-/.test(name))
            .map((name) => [name, sha256(fs.readFileSync(path.join(cache, name)))]));
          const relevant = Object.fromEntries(Object.keys(expectedReceipts).map((name) => [name, snapshot.get(name) ?? null]));
          const expectedNative = {"quint":"e8d724d4fb1782728f55afd301be9698a3b9592fe530ffda6a509d69619ee7f9","evaluator":"1764f11e8c1a9f644af5c934e9a71645b313f82f8db1284965866a2f417da9aa","evaluatorRelease":"v0.7.1"};
          assert(snapshot.size > 0, "expected the stock importer to write authentic donor receipts");
          const targets = ["core__queryDrain", "core__identityGroups"];
          const specs = readSpecs(root);
          assert(targets.every((name) => specs.some((spec) => spec.name === name)));
          const start = performance.now();
          const cpuBefore = process.cpuUsage();
          const prepared = await prepareSimulationReceipts(root, specs, targets, process.env.RUNNER_TEMP);
          const cpu = process.cpuUsage(cpuBefore);
          const elapsedMs = performance.now() - start;
          const receipts = {};
          const transfer = prepared.seedDirectory ?? prepared.partialDirectory;
          if (transfer) for (const name of fs.readdirSync(transfer).sort()) {
            const bytes = fs.readFileSync(path.join(transfer, name));
            const decoded = name.endsWith(".zst") ? zstdDecompressSync(bytes) : gunzipSync(bytes);
            receipts[name] = { bytes: bytes.length, sha256: sha256(bytes), decodedSha256: sha256(decoded) };
          }
          const traceRoot = path.join(root, "gen", "traces");
          const traceDirectories = fs.existsSync(traceRoot) ? fs.readdirSync(traceRoot).sort() : [];
          const evidence = {
            mode, source: "8d09af2d4f07cc31de9115e5fed61498fa522709", workflowHead: process.env.GITHUB_SHA,
            platform: process.platform, arch: process.arch, node: process.version,
            typescript: require("typescript/package.json").version, vibelang,
            native: { quint: quint.id, evaluator, evaluatorRelease: manager.QUINT_EVALUATOR_VERSION },
            snapshots: fs.readdirSync("node_modules/.pnpm", { withFileTypes: true }).filter((file) => file.isDirectory() && file.name !== "node_modules").length,
            targets, specs: specs.length, elapsedMs, wrapperCpuMs: (cpu.user + cpu.system) / 1000,
            results: prepared.results, rowsSha256: sha256(JSON.stringify(prepared.results)), receipts, complete: !!prepared.seedDirectory, traceDirectories,
            donorRun: 45202619442, donorHead: "e1ee5cbc3e8a8774e70aecaaf23461d5b37a4114", donorArtifacts: [14837235598,14835283598,14836311043,14835577756],
            importedReceipts: snapshot.size, relevant,
            previouslyPresent: Object.keys(receipts).filter((name) => snapshot.has(name)),
            unchangedFromImporter: Object.keys(receipts).filter((name) => snapshot.get(name) === receipts[name].sha256),
          };
          const output = path.join(process.env.RUNNER_TEMP, "simulation-install-evidence", "result.json");
          fs.writeFileSync(output, JSON.stringify(evidence, null, 2) + "\n");
          console.log(JSON.stringify(evidence));
          assert.equal(prepared.results.length, 8);
          assert(prepared.results.every(({ ok }) => ok));
          assert(prepared.seedDirectory, "expected a certified complete simulation seed");
          assert.equal(Object.keys(receipts).filter((name) => name.startsWith("simulate-")).length, 2);
          assert.equal(evidence.rowsSha256, "3bb142fbd7daa91e532a58c58e59e0fc2f8c5727e67ef60f38c6eca27fc04f92", "expected the previously qualified cold rows");
          assert.deepEqual(evidence.native, expectedNative);
          assert.deepEqual(receipts, expectedReceipts);
          const exactAggregatesPresent = Object.keys(expectedReceipts).filter((name) => name.startsWith("simulate-"))
            .every((name) => snapshot.get(name) === expectedReceipts[name].sha256);
          if (exactAggregatesPresent) assert.equal(traceDirectories.length, 0, "certified aggregate receipts should avoid native simulator traces");
          JS
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-receiver-evidence
          path: ${{ runner.temp }}/simulation-install-evidence/
          if-no-files-found: ignore
          retention-days: 5
