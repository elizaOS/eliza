name: CI
on:
  workflow_call: null
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
env:
  CI: "true"
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24.15.0
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "true"
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
      - name: Build core contract
        run: bun run build:core
      - name: Repository verification
        env:
          RUN_TURBO_CONCURRENCY: "4"
        run: bun run verify
      - name: Formatting
        run: bun run format:check
      - name: Check maintained Markdown link targets
        run: node packages/scripts/check-markdown-links.mjs
      - name: Prompt secret scan
        run: node packages/scripts/check-prompt-secrets.mjs
      - name: Validate CI Bun version pin contract
        run: node packages/scripts/ci-bun-version-contract.mjs --inventory "$RUNNER_TEMP/bun-runtime-inventory.json"
      - name: Upload Bun runtime resolution inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-runtime-inventory
          path: ${{ runner.temp }}/bun-runtime-inventory.json
          retention-days: 7
  frontend-build:
    name: Consolidated Frontend Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build frontend workspace dependencies
        run: |
          bun run build:core
          bun run --cwd packages/ui build
      - name: Build the only deployable frontend
        working-directory: packages/app
        run: bun run build:web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    env:
      BUN_VERSION: 1.3.14
      NODE_VERSION: 24.15.0
  e2e:
    uses: ./.github/workflows/e2e.yml
  required:
    name: All Tests Passed
    if: ${{ always() && !cancelled() }}
    needs: [quality, frontend-build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require source, build, and full E2E success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'length > 0 and all(.[]; .result == "success")'
