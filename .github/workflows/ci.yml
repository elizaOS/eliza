name: Qualify BrowserPage sampling and generated Agent contracts
on:
  push:
    branches: [codex/qualify-page-property-arms-1123]
permissions:
  contents: read
jobs:
  property-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: verify
          verification: 'false'
          cache-verification: 'false'
      - name: Build the real Core export prerequisite
        run: |
          node vibestack/spec.ts tasks @elizaos/core#build
          mkdir -p "$RUNNER_TEMP/property-results"
          git fetch --no-tags --depth=1 origin 0d743619956147f3296becd7769c1b14ad48a8d3
      - name: Compare baseline and candidate schemas with the same corpus and native arbitrary
        run: |
          cat > "$RUNNER_TEMP/control.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {Arbitrary,Effect,Schema} from 'effect';
          import {BrowserPage} from './src/conversation/turn-context.schema.vibe';
          const side=process.env.ARM;
          const stem={tabId:"tab-1",revision:"7",title:"Browser page",capturedAt:0};
          const read={...stem,text:"Example",truncated:false};
          const withheld={...stem,withheld:"sensitive-page"};
          const cases=[
           ["https://example.org/",true],["https://example.org:8443/a?q=x",true],["https://127.0.0.1/",true],["https://[::1]/a",true],["https://example.org/%20",true],["https://example.org/"+'a'.repeat(2028),true],
           ["http://example.org/",false],["https://user:pass@example.org/",false],["https://example.org/#fragment",false],["https://EXAMPLE.org/",false],["https://example.org",false],["relative",false],["https://example.org/"+'a'.repeat(2048),false]
          ];
          const controls=cases.map(([url,valid])=>[url.length<100?url:url.length,valid,[read,withheld].map(p=>Schema.is(BrowserPage)({...p,url}))]);
          for(const [,expected,pair] of controls)assert.deepEqual(pair,[expected,expected]);
          const result=Effect.runSync(Effect.result(Arbitrary.sampleEffect(Arbitrary.schema(BrowserPage),{seed:1,count:side==="before"?1:1000})));
          const summary={side,controls};
          if(side==="before") {
           assert.equal(result._tag,'Failure');assert.equal(result.failure.generated,0);summary.failure=result.failure;
          } else {
           assert.equal(result._tag,'Success');
           const values=result.success, urls=values.flatMap(p=>[p.url,...(p.links??[]).map(l=>l.url)]).map(s=>new URL(s));
           const variants={read:0,sensitive:0,unreadable:0};
           for(const item of values){assert(Schema.is(BrowserPage)(item));if(item.withheld==="sensitive-page")variants.sensitive++;else if(item.withheld==="unreadable")variants.unreadable++;else variants.read++;}
           const counts={samples:values.length,unique:new Set(values.map(v=>JSON.stringify(v))).size,variants,links:urls.length-values.length,ports:urls.filter(u=>u.port).length,ip:urls.filter(u=>u.hostname==="127.0.0.1"||u.hostname==="[::1]").length,query:urls.filter(u=>u.search).length,withPath:urls.filter(u=>u.pathname!=="/").length};
           assert.equal(counts.samples,1000);assert(Object.values(variants).every(n=>n>0));assert(counts.links>0);summary.counts=counts;
          }
          writeFileSync(join(process.env.RUNNER_TEMP,'property-results',side+'-control.json'),JSON.stringify(summary,null,2));console.log(JSON.stringify(summary));
          JS
          target=packages/agent/src/conversation/turn-context.schema.vibe
          for arm in before after; do
            if [[ "$arm" == before ]]; then git show "0d743619956147f3296becd7769c1b14ad48a8d3:$target" > "$target"; else git restore "$target"; fi
            node vibestack/spec.ts tests packages/agent
            cp packages/agent/.cache/generated/tests/manifest.json "$RUNNER_TEMP/property-results/$arm-manifest.json"
            (cd packages/agent && ARM="$arm" node --import vibelang/register --input-type=module - < "$RUNNER_TEMP/control.mjs")
          done
      - name: Exercise all generated Agent properties and the authored browser-context journey
        working-directory: packages/agent
        run: |
          pnpm exec vitest run .cache/generated/tests test/turn-context.test.vibe --reporter=json --outputFile="$RUNNER_TEMP/property-results/vitest.json"
          jq -e '.numPassedTests == 103 and .numFailedTests == 0 and .numPendingTests == 0' "$RUNNER_TEMP/property-results/vitest.json"
          jq -e '[.testResults[].assertionResults[].title|select(startswith("BrowserPage:"))]|length==2' "$RUNNER_TEMP/property-results/vitest.json"
      - name: Lint the changed release source
        run: pnpm exec eslint vibestack/units.ts packages/agent/src/conversation/turn-context.schema.vibe
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eliza-browser-page-properties
          path: ${{ runner.temp }}/property-results
          if-no-files-found: warn
          retention-days: 5
