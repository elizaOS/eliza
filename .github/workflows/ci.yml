name: Measure bounded replay during native Eliza simulation
on:
  push:
    branches: [codex/qualify-overlapping-formal-replay-1123]
permissions:
  contents: read
  actions: read
jobs:
  vibestack-precompute-simulations:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: simulate-2
          cache-verification: 'false'
      - name: Read the published base shard from the reviewed push
        uses: actions/download-artifact@v8
        with:
          name: simulations-${{ matrix.shard }}
          path: ${{ runner.temp }}/published
          run-id: 45229003796
          github-token: ${{ github.token }}
      - name: Exercise ordinary overlap, incomplete fallback and native child cleanup
        run: |
          cat > .race-worker.mjs <<'JS'
          import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';import {prepareSimulationReceipts,readSpecs,withFormalCache} from './vibestack/formal.ts';
          const [tag,scope,kind]=process.argv.slice(2);const tmp=process.env.RUNNER_TEMP,record=path.join(tmp,'race-evidence'),root=path.join(tmp,'work-'+tag),cache=path.join(root,'.spec-cache'),base=path.join(tmp,'published');
          fs.mkdirSync(root,{recursive:true});fs.cpSync('spec',path.join(root,'spec'),{recursive:true});fs.copyFileSync('package.json',path.join(root,'package.json'));fs.symlinkSync(fs.realpathSync('node_modules'),path.join(root,'node_modules'),'dir');
          if(kind==='cold')fs.mkdirSync(cache);else fs.cpSync(base,cache,{recursive:true});
          const known=new Set(fs.readdirSync(cache));const sha=x=>createHash('sha256').update(x).digest('hex');
          if(kind==='missing'){for(const f of known)if(f.startsWith('simulate-')){fs.unlinkSync(path.join(cache,f));known.delete(f)}}
          const specs=readSpecs(root),shard=Number(process.env.SHARD);
          const names=scope==='warmup'?specs.filter(s=>s.file==='spec/core/queryDrain.md').map(s=>s.name):specs.filter(s=>createHash('sha256').update(s.file).digest().readUInt32BE(0)%4===shard-1).map(s=>s.name);
          fs.writeFileSync(path.join(record,tag+'.pid'),String(process.pid));const start=performance.now();
          const result=await withFormalCache(cache,()=>prepareSimulationReceipts(root,specs,names,tmp));
          const returned=result.seedDirectory??result.partialDirectory,actual=returned?fs.readdirSync(returned).sort():[];
          const evidence={tag,kind,scope,names:names.length,seconds:(performance.now()-start)/1000,rows:result.results,files:actual.length,failed:result.results.filter(r=>!r.ok),manifestMatch:actual.length===known.size&&actual.every(f=>known.has(f)&&fs.readFileSync(path.join(base,f)).equals(fs.readFileSync(path.join(returned,f)))),complete:!!result.seedDirectory};
          fs.writeFileSync(path.join(record,tag+'.json'),JSON.stringify(evidence));console.log(tag,JSON.stringify({rows:evidence.rows.length,failed:evidence.failed.length,files:actual.length,seconds:evidence.seconds,manifestMatch:evidence.manifestMatch}));
          JS
          cat > "$RUNNER_TEMP/control.py" <<'PYCODE'
          from pathlib import Path
          import hashlib,json,os,signal,subprocess,time
          tmp=Path(os.environ['RUNNER_TEMP']);rec=tmp/'race-evidence';rec.mkdir(exist_ok=True);idx=int(os.environ['SHARD'])
          def boot(tag,scope,kind):
           f=(rec/(tag+'.log')).open('w')
           p=subprocess.Popen(['/usr/bin/time','-p','-o',str(rec/(tag+'.time')),'node','.race-worker.mjs',tag,scope,kind],stdout=f,stderr=f,start_new_session=True);p.log=f;return p
          def wait(p,t=65):assert p.wait(timeout=t)==0,(p.args,p.returncode)
          def res(tag):return json.loads((rec/(tag+'.json')).read_text())
          def procs():
           table={}
           for f in Path('/proc').glob('[0-9]*/stat'):
            try:
             data=f.read_text();pid=int(f.parent.name);fields=data[data.rindex(')')+2:].split();table[pid]={'ppid':int(fields[1]),'pgid':int(fields[2]),'birth':int(fields[19]),'state':fields[0]}
            except (OSError,ValueError,IndexError):pass
           return table
          def children(pid,table):
           owned={pid}
           while True:
            nxt=owned|{p for p,v in table.items() if v['ppid'] in owned}
            if nxt==owned:return {p:table[p] for p in owned if p in table}
            owned=nxt
          def readpid(tag,t):
           end=time.monotonic()+t
           while time.monotonic()<end:
            f=rec/(tag+'.pid')
            if f.is_file() and f.read_text():return int(f.read_text())
            time.sleep(.05)
           raise RuntimeError('missing pid for '+tag)
          def stop(p,tag):
           if p.poll() is not None:return {'observed':0,'leaked':0}
           pid=readpid(tag,5);tree=children(pid,procs());os.kill(pid,signal.SIGTERM)
           try:p.wait(timeout=5)
           except subprocess.TimeoutExpired:os.kill(pid,signal.SIGKILL);p.wait(timeout=2)
           time.sleep(.3);left=procs();leaks={k:v for k,v in tree.items() if k in left and left[k]['birth']==v['birth'] and left[k]['state']!='Z'}
           for k in leaks:
            try:os.kill(k,signal.SIGKILL)
            except ProcessLookupError:pass
           return {'observed':len(tree),'separateGroups':len({v['pgid'] for v in tree.values()}),'leaked':len(leaks)}
          def consume(tag):
           # The verifier's complete/partial directory must provide every object delivered by the immutable trusted input.
           r=res(tag);assert r['manifestMatch'] and r['rows'] and all(bool(x['ok']) for x in r['rows'])==(idx!=3)
           if idx==3:assert r['failed']==[x for x in r['rows'] if not x['ok']] and len(r['failed'])==1 and 'never_sometimesStreamDelivering' in r['failed'][0]['detail']
           return r
          t0=time.monotonic();wait(boot('hydrate','warmup','cold'));wait(boot('warm-before','shard','seed'));pre=consume('warm-before')
          primary=boot('ongoing','shard','cold');pid=readpid('ongoing',10);deadline=time.monotonic()+8
          while time.monotonic()<deadline:
           if any((tmp/'work-ongoing'/'.spec-cache').glob('action-*')) or len(children(pid,procs()))>2:break
           time.sleep(.1)
          before=children(pid,procs());raceTime=time.monotonic()
          shadow=boot('race-warm','shard','seed')
          wait(shadow,45);win=consume('race-warm');assert pre['rows']==win['rows'];active=primary.poll() is None
          cleanup=stop(primary,'ongoing');assert active
          wait(boot('warm-after','shard','seed'));post=consume('warm-after');assert post['rows']==win['rows']
          # Simulate an unusable publication under pressure without delaying a locally warm normal result.
          normal=boot('primary-warm','shard','seed');readpid('primary-warm',12);spec=boot('incomplete','shard','missing')
          wait(normal,45);original=consume('primary-warm');assert original['rows']==win['rows']
          badClean=stop(spec,'incomplete');assert badClean['leaked']==cleanup['leaked']==0,(badClean,cleanup)
          times={}
          for t in ['warm-before','race-warm','ongoing','warm-after','primary-warm','incomplete']:
           f=rec/(t+'.time');raw=f.read_text() if f.exists() else '';times[t]={s.split()[0]:float(s.split()[1]) for s in raw.splitlines() if s.split() and s.split()[0] in ('real','user','sys')}
          report={'shard':idx,'beforeRows':len(pre['rows']),'failed':len(pre['failed']),'coldActive':active,'processesBefore':len(before),'cleanup':cleanup,'incompleteCleanup':badClean,'expected':pre['files'],'times':times,'total':time.monotonic()-t0}
          (rec/'result.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          PYCODE
          python3 "$RUNNER_TEMP/control.py"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: overlap-measurement-${{ matrix.shard }}
          path: ${{ runner.temp }}/race-evidence
          if-no-files-found: error
          retention-days: 7
