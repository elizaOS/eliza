name: ci

# Every run is the tasks of `pnpm verify`, the tools' own self-test included,
# split over four jobs that run side by side: the self-test of the tools in
# three, everything else in one. Turborepo and spec skip what the change does
# not reach, from the cache of the last run. The fixed normal profile is the
# same locally and in CI. The self-test also installs and checks each
# standalone example.
on:
  pull_request:
    branches: [vibestack, develop, main]
  push:
    branches: [vibestack, develop, main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  android-node-lock:
    name: Verify published Android Node lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/ci.yml
            packages/os/aosp/runtime/node.lock.json
            packages/os/android/android-runtime-inventory.mjs
      - id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git fetch --no-tags --depth=1 origin "$BASE_SHA" &&
            git diff --quiet "$BASE_SHA" HEAD -- .github/workflows/ci.yml packages/os/aosp/runtime/node.lock.json packages/os/android/android-runtime-inventory.mjs; then
            exit 0
          fi
          echo 'verify=true' >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.verify == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '26'
      - if: steps.changed.outputs.verify == 'true'
        name: Verify the two released ABI archives and producer manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdtempSync, readFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { isAndroidExecutableForAbi } from './packages/os/android/android-runtime-inventory.mjs';

          const lock = JSON.parse(readFileSync('packages/os/aosp/runtime/node.lock.json', 'utf8'));
          const { version, ndk, apiLevel, buildCommit, sourceSha256, entries } = lock;
          const sha256 = /^[0-9a-f]{64}$/;
          assert.ok(Array.isArray(entries) && entries.length === 2, 'Pin both released Android Node ABIs');
          assert.match(version, /^26\.\d+\.\d+$/);
          assert.match(ndk, /^\d+\.\d+\.\d+$/);
          assert.ok(Number.isSafeInteger(apiLevel) && apiLevel > 0, 'Invalid Android API level');
          assert.match(buildCommit, /^[0-9a-f]{40}$/);
          assert.match(sourceSha256, sha256);
          assert.deepEqual(entries.map(entry => entry.abi).sort(), ['arm64-v8a', 'x86_64']);

          const repo = 'elizaOS/eliza';
          const tag = `android-node-v${version}-ndk-${ndk}`;
          const assetName = abi => `node-v${version}-android-${abi}.zip`;
          for (const entry of entries) {
            assert.match(entry.sha256, sha256);
            assert.match(entry.archiveSha256, sha256);
            assert.equal(entry.url, `https://github.com/${repo}/releases/download/${tag}/${assetName(entry.abi)}`);
          }
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const archiveDir = mkdtempSync(join(tmpdir(), 'android-node-lock-'));
          try {
            for (const { abi, sha256, archiveSha256 } of entries) {
              const name = assetName(abi);
              execFileSync('gh', ['release', 'download', tag, '--repo', repo, '--pattern', name, '--dir', archiveDir], { stdio: 'inherit' });
              const archive = join(archiveDir, name);
              assert.equal(hash(readFileSync(archive)), archiveSha256, `${abi} archive digest does not match the lock`);
              const manifest = JSON.parse(execFileSync('unzip', ['-p', archive, 'manifest.json'], { encoding: 'utf8', maxBuffer: 64 * 1024 }));
              assert.deepEqual({
                schema: manifest.schema, abi: manifest.abi, version: manifest.version, ndk: manifest.ndk,
                apiLevel: manifest.apiLevel, buildCommit: manifest.buildCommit, sourceSha256: manifest.sourceSha256, sha256: manifest.sha256,
              }, { schema: 1, abi, version, ndk, apiLevel, buildCommit, sourceSha256, sha256 });
              const binary = execFileSync('unzip', ['-p', archive, 'libeliza_node.so'], { maxBuffer: 512 * 1024 * 1024 });
              assert.ok(isAndroidExecutableForAbi(binary, abi), `${abi} archive contains the wrong executable`);
              assert.equal(hash(binary), sha256, `${abi} executable digest does not match the lock`);
            }
          } finally { rmSync(archiveDir, { recursive: true, force: true }); }
          console.log('Both released Android Node ABIs match the runtime lock.');
          JS

  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: verify
            tasks: build typecheck test test:browser check //#lint:js //#lint:css //#analyze //#selftest:docs //#selftest:examples
    env: &cache-env
      TURBO_CACHE: local:rw
    steps: &verification-steps
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with:
          job: ${{ matrix.name }}
      - id: verify-tasks
        run: node vibestack/spec.ts tasks ${{ matrix.tasks }} ${{ startsWith(matrix.name, 'selftest-') && '--only' || '' }} --continue=dependencies-successful --summarize ${{ matrix.name == 'verify' && '--log-order=stream' || '' }}
      - name: Report Turbo task timings
        id: task-timings
        if: ${{ !cancelled() }}
        env:
          RESTORED_FIXTURE_EVALUATOR: ${{ steps.setup.outputs.spec-evaluator-restored == 'true' && steps.verify-tasks.outcome == 'success' }}
          TASK: ${{ matrix.tasks }}
        run: |
          for report in .turbo/runs/*.json; do
            [[ -f "$report" ]] || continue
            jq -r '
              select(.version == "1" and (.tasks | type == "array"))
              | .execution as $run
              | select([$run.startTime, $run.endTime, $run.cached, $run.attempted] | all(type == "number"))
              | "### Turbo task timings", "",
                "Wall time \(($run.endTime - $run.startTime) / 1000) s. Cache hits \($run.cached) of \($run.attempted) attempted tasks.",
                "",
                "| Task | Wall time (s) | Cache | Exit code |",
                "| --- | ---: | --- | ---: |",
                ([.tasks[]
                  | select([.execution.startTime, .execution.endTime] | all(type == "number"))
                  | {id: .taskId, elapsed: ((.execution.endTime - .execution.startTime) / 1000), cache: .cache.status, exit: .execution.exitCode}]
                  | sort_by(-.elapsed) | .[]
                  | "| \(.id) | \(.elapsed) | \(.cache // "-") | \(.exit // "-") |"),
                ""
            ' "$report" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not read the Turbo run summary"
          done
          [[ $RESTORED_FIXTURE_EVALUATOR == true ]] || exit 0
          shopt -s nullglob
          reports=(.turbo/runs/*.json)
          (( ${#reports[@]} )) || exit 0
          jq -es --arg task "$TASK" '
            map(select(.version == "1" and any(.tasks[]?; .taskId == $task)))
            | length == 1 and
              (.[0] | .execution.exitCode == 0 and .execution.attempted == 1 and .execution.cached == 1 and
                (.tasks | length == 1 and (.[0] | .taskId == $task and .cache.status == "HIT" and
                  .execution.exitCode == 0 and .resolvedTaskDefinition.outputs == [])))
          ' "${reports[@]}" >/dev/null || exit 0
          echo 'skip-spec-cache=true' >> "$GITHUB_OUTPUT"
          echo 'Skipping the spec cache upload after a full fixture replay.'
      - id: superseded-spec-cache
        if: >-
          cancelled() && matrix.name == 'verify' && steps.verify-tasks.conclusion == 'cancelled' &&
          steps.setup.outputs.spec-cache-key != '' &&
          github.event_name == 'push' && github.run_attempt == '1' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          current=$(GIT_TERMINAL_PROMPT=0 timeout 4s git ls-remote --refs --exit-code origin "$GITHUB_REF") || exit 0
          [[ $current != *$'\n'* ]] || exit 0
          IFS=$'\t' read -r tip ref <<< "$current"
          [[ $tip =~ ^[0-9a-f]{40}$ && $ref == "$GITHUB_REF" && $tip != "$GITHUB_SHA" ]] || exit 0
          echo 'skip=true' >> "$GITHUB_OUTPUT"
          echo "Skipping the spec cache upload for superseded commit $GITHUB_SHA."
      - id: closed-pr-cache
        if: >-
          always() && github.event_name == 'pull_request' && github.run_attempt == '1' &&
          (steps.setup.outputs.spec-cache-key != '' || steps.setup.outputs.turbo-cache-key != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n $GH_TOKEN && $GITHUB_REF =~ ^refs/pull/([1-9][0-9]*)/merge$ ]] || exit 0
          number=${BASH_REMATCH[1]}
          pull=$(curl --fail --silent --max-time 4 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$number") || exit 0
          jq -e --argjson number "$number" '
            .number == $number and .state == "closed" and (.closed_at | type == "string")
          ' <<< "$pull" >/dev/null 2>&1 || exit 0
          echo 'skip=true' >> "$GITHUB_OUTPUT"
          echo "Skipping verification cache uploads for closed PR #$number."
      - if: >-
          always() && steps.setup.outputs.spec-cache-key != '' &&
          steps.superseded-spec-cache.outputs.skip != 'true' && steps.task-timings.outputs.skip-spec-cache != 'true' &&
          steps.closed-pr-cache.outputs.skip != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.spec-cache-path }}
          key: ${{ steps.setup.outputs.spec-cache-key }}
      - id: prune-turbo-cache
        if: always() && steps.setup.outputs.turbo-cache-key != '' && steps.closed-pr-cache.outputs.skip != 'true'
        run: |
          [[ -d .turbo/cache ]] || exit 0
          cat .turbo/runs/*.json 2>/dev/null | jq -r '.tasks[] | select(.cache.status == "HIT") | .hash' | while read -r hash; do find .turbo/cache -name "$hash*" -exec touch {} +; done
          find .turbo/cache -type f -mtime +7 -delete
          for archive in .turbo/cache/*.tar.zst; do
            metadata="${archive%.tar.zst}-meta.json"
            [[ -f "$archive" && -s "$archive" && -f "$metadata" && -s "$metadata" ]] || continue
            echo "populated=true" >> "$GITHUB_OUTPUT"
            break
          done
      - if: always() && steps.prune-turbo-cache.outputs.populated == 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-${{ matrix.name }}
          path: |
            gen/proof/
            vibestack/studio/gen/proof/
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failures-${{ matrix.name }}
          path: |
            test/counterexamples/
            test/__traces__/
            apps/*/test/counterexamples/
            apps/*/test/__traces__/
            packages/*/test/counterexamples/
            packages/*/test/__traces__/
            apps/*/.cache/vitest/attachments/
            packages/*/.cache/vitest/attachments/
            vibestack/studio/test/counterexamples/
            vibestack/studio/test/__traces__/
            vibestack/examples/*/test/counterexamples/
            vibestack/examples/*/test/__traces__/
          if-no-files-found: ignore
          include-hidden-files: true

  vibestack-fixture-selftests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: selftest-a
            tasks: //#selftest:tools:a
          - name: selftest-b
            tasks: //#selftest:tools:b
          - name: selftest-rest
            tasks: //#selftest:tools:rest
    env: *cache-env
    steps: *verification-steps
