name: ci

# Every run is `pnpm verify`, the tools' own self-test included; Turborepo and
# spec skip what the change does not reach, from the cache of the last run.
# The fixed normal profile is the same locally and in CI. The self-test also
# installs and checks each standalone example.
on:
  pull_request:
    branches: [vibestack]
  push:
    branches: [vibestack]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE: local:rw
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm verify --continue
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof
          path: |
            gen/proof/
            vibestack/studio/gen/proof/
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failures
          path: |
            **/test/counterexamples/
            **/test/__traces__/
            !**/node_modules/**
          if-no-files-found: ignore
