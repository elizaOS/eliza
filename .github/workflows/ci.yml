name: Qualify Eliza simulation-only dependency installation
on:
  push:
    branches: [codex/qualify-eliza-simulation-install-1123]
permissions:
  contents: read
  actions: read
jobs:
  vibestack-precompute-simulations:
    name: Install and replay (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [whole, production]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: simulations-2
          run-id: 45131678339
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/historic-2
      - if: matrix.mode == 'production'
        run: cp .github/actions/setup/qualification-production.yml .github/actions/setup/action.yml
      - uses: ./.github/actions/setup
        with:
          job: simulate-2
          cache-verification: 'false'
      - name: Reproduce all 688 rows from the historical Eliza shard
        run: |
          cat > .qualify-install.mjs <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { zstdDecompressSync } from 'node:zlib';
          import { prepareSimulationReceipts, precomputeSimulations, readSpecs } from './vibestack/formal.ts';
          const base=process.env.RUNNER_TEMP;
          const parent=path.join(base,'simulation-handoff-cost');
          const evidence=path.join(base,'simulation-handoff-evidence');
          const historic=path.join(base,'historic-2');
          fs.mkdirSync(parent,{recursive:true});fs.mkdirSync(evidence,{recursive:true});
          const historicNames=fs.readdirSync(historic).sort();
          const digest=(v)=>createHash('sha256').update(v).digest('hex');
          const orderedRows=(a)=>a.map(r=>JSON.stringify(r)).sort().join('\n');
          const expected=historicNames.flatMap(f=>JSON.parse(zstdDecompressSync(fs.readFileSync(path.join(historic,f)))).result.said);
          assert.equal(historicNames.length,109);assert.equal(expected.length,688);assert(expected.every(r=>r.ok));
          const expectedRows=digest(orderedRows(expected));
          const checks=[];const result={artifact:14801636223,run:45131678339,selected:109,expectedRows,checks};
          const save=()=>fs.writeFileSync(path.join(evidence,'results.json'),JSON.stringify(result,null,2)+'\n');
          const snapshot=(dir)=>Object.fromEntries(fs.readdirSync(dir).sort().map(n=>{const b=fs.readFileSync(path.join(dir,n));return[n,[b.byteLength,digest(b)]]}));
          const old=snapshot(historic);
          function init(dir,source){
           fs.mkdirSync(dir,{recursive:true});fs.cpSync('spec',path.join(dir,'spec'),{recursive:true});fs.copyFileSync('package.json',path.join(dir,'package.json'));fs.symlinkSync(fs.realpathSync('node_modules'),path.join(dir,'node_modules'),'dir');fs.cpSync(source,path.join(dir,'.spec-cache'),{recursive:true});
          }
          const shard=(root)=>{const specs=readSpecs(root);assert.equal(specs.length,439);const names=specs.filter(({file})=>parseInt(digest(file).slice(0,8),16)%4===1).map(s=>s.name);assert.equal(names.length,109);return [specs,names]};
          let compact;
          async function observe(tag,dir,capture){
           const [specs,names]=shard(dir);const start=performance.now(),cpu=process.cpuUsage();const prepared=capture?await prepareSimulationReceipts(dir,specs,names,parent):{results:await precomputeSimulations(dir,specs,names)};
           const elapsed=performance.now()-start,load=process.cpuUsage(cpu),rows=prepared.results;
           const row={tag,elapsed_ms:elapsed,wrapper_cpu_ms:(load.user+load.system)/1000,rows:rows.length,failures:rows.filter(r=>!r.ok).length,rowsHash:digest(orderedRows(rows)),nativeTraceDirs:fs.existsSync(path.join(dir,'gen/traces'))?fs.readdirSync(path.join(dir,'gen/traces')).length:0};checks.push(row);save();
           assert.equal(row.rowsHash,expectedRows);assert.equal(row.nativeTraceDirs,0);assert.equal(row.failures,0);
           if(capture){assert(prepared.seedDirectory);const files=snapshot(prepared.seedDirectory);for(const [k,v] of Object.entries(old))assert.deepEqual(files[k],v);
           const actionNames=Object.keys(files).filter(k=>/^action-/.test(k));assert(actionNames.length>=109);assert.equal(Object.keys(files).length,109+actionNames.length);
           if(!compact){compact=prepared.seedDirectory;result.compact={files:Object.keys(files).length,simulations:109,actions:actionNames.length,bytes:Object.values(files).reduce((n,[b])=>n+b,0),aggregateBytes:Object.values(old).reduce((n,[b])=>n+b,0),sha256:digest(JSON.stringify(files))}}
           else assert.deepEqual(files,snapshot(compact));}
           save();console.log(JSON.stringify(row));
          }
          const producer=path.join(parent,'worker');init(producer,historic);await observe('historical-aggregates-only',producer,false);
          await observe('compact-producer',producer,true);
          const receiver=path.join(parent,'receiver');init(receiver,compact);await observe('receiver-with-only-compact',receiver,false);
          result.install=fs.readFileSync(path.join(base,'pnpm-install.time'),'utf8').trim();
          result.snapshots=fs.readdirSync('node_modules/.pnpm',{withFileTypes:true}).filter(d=>d.isDirectory()&&d.name!=='node_modules').length;
          result.node=process.version;result.completed=true;save();
          JAVASCRIPT
          node .qualify-install.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-install-${{ matrix.mode }}
          path: ${{ runner.temp }}/simulation-handoff-evidence/
          if-no-files-found: warn
          retention-days: 5
