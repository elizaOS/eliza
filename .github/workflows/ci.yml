name: CI
on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      base_sha:
        description: Previously reviewed commit; blank scans the full repository history
        type: string
        required: false
        default: ''
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
env:
  CI: "true"
  BUN_VERSION: 1.4.2
  NODE_VERSION: 24.15.0
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  secret-scan:
    uses: ./.github/workflows/gitleaks.yml
    with:
      base_sha: ${{ github.event.before || inputs.base_sha || '' }}
      head_sha: ${{ github.sha }}
  os:
    if: needs.preflight.outputs.os == 'true'
    name: OS verification
    needs: preflight
    uses: ./.github/workflows/os.yml
  quality:
    name: Quality
    if: needs.preflight.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TURBO_SCM_BASE: ${{ needs.preflight.outputs.base }}
      RUN_TURBO_AFFECTED: ${{ needs.preflight.outputs.full == 'false' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "true"
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
      - name: Build core contract
        run: bun run build:core
      - name: Repository verification
        env:
          # Root verification gives each Node task an 8 GB heap on a 16 GB runner.
          RUN_TURBO_CONCURRENCY: "1"
        run: bun run verify
      - name: Formatting
        run: bun run format:check
      - name: Prompt secret scan
        run: node packages/scripts/check-prompt-secrets.ts
      - name: Validate CI Bun version pin contract
        run: node packages/scripts/ci-bun-version-contract.ts --inventory "$RUNNER_TEMP/bun-runtime-inventory.json"
      - name: Upload Bun runtime resolution inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-runtime-inventory
          path: ${{ runner.temp }}/bun-runtime-inventory.json
          retention-days: 7
    needs: preflight
  tests_auth_integration:
    if: needs.preflight.outputs.auth == 'true'
    name: Login browser and PostgreSQL integration
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: login_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOGIN_TEST_DATABASE_URL: postgres://postgres:login_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
      - name: Build core dependency graph
        run: bun run build:core
      - name: Install browser for login contracts
        run: bunx playwright install --with-deps chromium
      - name: Browser and required PostgreSQL contracts
        run: bun run --cwd packages/auth test:integration
  required:
    name: All Tests Passed
    if: ${{ always() && !cancelled() }}
    needs:
      - secret-scan
      - os
      - quality
      - tests_auth_integration
      - preflight
      - remote-capabilities
      - agent-integration
      - zero-key-scenario-runner
      - zero-key-model-provider-e2e
      - local-runtime-integration
      - app-accounts-ui
      - frontend-build
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: |-
            secret-scan=${{ needs.secret-scan.result }}:true
            os=${{ needs.os.result }}:${{ needs.preflight.outputs.os }}
            quality=${{ needs.quality.result }}:${{ needs.preflight.outputs.source }}
            tests_auth_integration=${{ needs.tests_auth_integration.result }}:${{ needs.preflight.outputs.auth }}
            preflight=${{ needs.preflight.result }}:true
            remote-capabilities=${{ needs.remote-capabilities.result }}:${{ needs.preflight.outputs.runtime }}
            agent-integration=${{ needs.agent-integration.result }}:${{ needs.preflight.outputs.runtime }}
            zero-key-scenario-runner=${{ needs.zero-key-scenario-runner.result }}:${{ needs.preflight.outputs.scenarios }}
            zero-key-model-provider-e2e=${{ needs.zero-key-model-provider-e2e.result }}:${{ needs.preflight.outputs.providers }}
            local-runtime-integration=${{ needs.local-runtime-integration.result }}:${{ needs.preflight.outputs.app }}
            app-accounts-ui=${{ needs.app-accounts-ui.result }}:${{ needs.preflight.outputs.app }}
            frontend-build=${{ needs.frontend-build.result }}:${{ needs.preflight.outputs.app }}
        run: |
          set -euo pipefail
          if [ -z "$RESULTS" ]; then echo "::error::Missing required job results"; exit 1; fi
          for pair in $RESULTS; do
            name="${pair%%=*}"
            value="${pair#*=}"
            result="${value%%:*}"
            planned="${value#*:}"
            expected=success
            if [ "$planned" = "false" ]; then expected=skipped; fi
            if [ "$planned" != "true" ] && [ "$planned" != "false" ]; then
              echo "::error::Missing affected plan for $name"; exit 1
            fi
            if [ "$result" != "$expected" ]; then
              echo "::error title=CI aggregate::$name finished with $result"
              exit 1
            fi
          done
  preflight:
    name: Select affected validation
    outputs:
      full: ${{ steps.affected.outputs.full }}
      base: ${{ steps.affected.outputs.base }}
      source: ${{ steps.affected.outputs.source }}
      auth: ${{ steps.affected.outputs.auth }}
      runtime: ${{ steps.affected.outputs.runtime }}
      scenarios: ${{ steps.affected.outputs.scenarios }}
      providers: ${{ steps.affected.outputs.providers }}
      provider_matrix: ${{ steps.affected.outputs.provider_matrix }}
      app: ${{ steps.affected.outputs.app }}
      os: ${{ steps.affected.outputs.os }}
      cloud: ${{ steps.affected.outputs.cloud }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
      - name: Reject unresolved merge-conflict markers
        run: |
          set -euo pipefail
          status=0
          git grep -n -E '^(<{7}|>{7})( |$)' -- . || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Unresolved git merge-conflict marker(s) in the tracked files listed above. Finish or abort the merge before landing."
            exit 1
          elif [ "$status" -gt 1 ]; then
            echo "::error::merge-conflict marker scan failed (git grep exit $status)"
            exit 1
          fi
          echo "No unresolved merge-conflict markers in tracked files."
      - name: Check source whitespace
        run: git show --format= --check HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check maintained Markdown link targets
        run: node packages/scripts/check-markdown-links.ts
      - name: Select affected integration lanes
        id: affected
        env:
          BASE_SHA: ${{ inputs.base_sha || '' }}
        run: node packages/scripts/ci-affected.ts "$BASE_SHA"
  agent-integration:
    if: needs.preflight.outputs.runtime == 'true'
    name: Agent transport and persistence integration
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 90
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build runtime dependencies
        run: bun run build:core
      - name: Agent transport and persistence integration
        run: bun run --cwd packages/agent test:integration
  remote-capabilities:
    if: needs.preflight.outputs.runtime == 'true'
    name: Remote capability integration contracts
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 60
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build view bundles
        run: bun run build:views
      - name: Remote capability plugin surface audit
        run: bun packages/agent/scripts/audit-capability-router-plugin-surface.ts
      - name: Device-action HTTP and database lifecycle
        run: bun run --cwd plugins/plugin-assistant test:device-actions
      - name: Run synthetic-world transaction tests
        run: bun run --cwd packages/testing test:synthetic-world
  zero-key-scenario-runner:
    if: needs.preflight.outputs.scenarios == 'true'
    name: Zero-Key scenario runner
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 30
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      TEST_LANE: pr
      ELIZA_LIVE_TEST: "0"
      SCENARIO_USE_DETERMINISTIC_MODEL: "1"
      CEREBRAS_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      XAI_API_KEY: ""
      NVIDIA_API_KEY: ""
      ELIZAOS_CLOUD_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build workspace packages for scenario resolution
        run: bunx turbo run build --filter=@elizaos/testing...
      - name: Zero-cost scenario e2e
        run: bun run --cwd packages/testing test:pr:e2e
      - name: Upload deterministic E2E reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-zero-key-e2e-report
          path: |
            test-results/scenario-runner/pr-deterministic/
            test-results/scenario-runner/pr-deterministic-corpus/
            test-results/scenario-runner/pr-deterministic-orchestrator/
            test-results/scenario-runner/pr-deterministic-lifeops/
            test-results/scenario-runner/catalog-inventory/
          if-no-files-found: ignore
          retention-days: 3
      - name: Prune deterministic E2E scratch output
        if: always()
        run: node packages/scripts/rm-path-recursive.ts test-results/scenario-runner/pr-deterministic test-results/scenario-runner/pr-deterministic-corpus test-results/scenario-runner/pr-deterministic-orchestrator test-results/scenario-runner/pr-deterministic-lifeops test-results/scenario-runner/catalog-inventory packages/app/playwright-report test-results/app
      - name: E2E coverage matrix report
        if: always()
        run: bun --conditions=eliza-source packages/scripts/e2e-coverage/write-coverage-matrix-report.ts --report-dir reports/coverage
  zero-key-model-provider-e2e:
    if: needs.preflight.outputs.providers == 'true'
    name: Provider integration (${{ matrix.provider }})
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.preflight.outputs.provider_matrix) }}
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 30
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      TEST_LANE: pr
      ELIZA_LIVE_TEST: "0"
      SCENARIO_USE_DETERMINISTIC_MODEL: "1"
      CEREBRAS_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      XAI_API_KEY: ""
      NVIDIA_API_KEY: ""
      ELIZAOS_CLOUD_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          setup-python: "true"
          install-protoc: "true"
      - name: Per-plugin deterministic model-provider runtime adoption proofs
        run: bun run --cwd plugins/plugin-${{ matrix.provider }} test:integration
  local-runtime-integration:
    if: needs.preflight.outputs.app == 'true'
    name: Local provisioning and chat contracts
    needs: preflight
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build core exports for real API harness
        run: bun run --cwd packages/core build
      - name: Real local agent provisioning (no model, no secret)
        run: bun run --cwd packages/app test:local-provisioning
      - name: Real local chat pipeline (no model key, no llama)
        run: bun run --cwd packages/app test:local-chat
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_OPTIONS: --max-old-space-size=4096
      TEST_LANE: pr
      ELIZA_LIVE_TEST: "0"
      SCENARIO_USE_DETERMINISTIC_MODEL: "1"
      CEREBRAS_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      XAI_API_KEY: ""
      NVIDIA_API_KEY: ""
      ELIZAOS_CLOUD_API_KEY: ""
  app-accounts-ui:
    if: needs.preflight.outputs.app == 'true'
    name: Zero-Key accounts UI e2e (real API + pool + disk)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build core exports for real API harness
        run: bun run --cwd packages/core build
      - name: Install Playwright browsers (Chromium)
        run: packages/scripts/github/install-playwright-browsers.sh chromium
      - name: Accounts UI browser e2e — real AccountList + real accounts routes + real AccountPool
        env:
          ELIZA_VAULT_PASSPHRASE: accounts-ui-e2e-headless-only
        run: bun run --cwd packages/app test:e2e:accounts-ui
      - name: Upload accounts-ui evidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scenario-pr-app-accounts-ui
          path: test-results/evidence/10722-accounts-ui-e2e/
          if-no-files-found: warn
          retention-days: 3
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_OPTIONS: --max-old-space-size=4096
      TEST_LANE: pr
      ELIZA_LIVE_TEST: "0"
      SCENARIO_USE_DETERMINISTIC_MODEL: "1"
      CEREBRAS_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      XAI_API_KEY: ""
      NVIDIA_API_KEY: ""
      ELIZAOS_CLOUD_API_KEY: ""
  frontend-build:
    if: needs.preflight.outputs.app == 'true'
    name: Consolidated Frontend Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build frontend workspace dependencies
        run: |
          bun run build:core
          bun run --cwd packages/ui build
      - name: Build the only deployable frontend
        working-directory: packages/app
        run: bun run build:web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    env:
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
    needs: preflight
