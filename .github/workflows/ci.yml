name: Verify real hosted spec archive path selection
on:
  push:
    branches: [codex/measure-portable-spec-cache-1123]
permissions:
  contents: read
jobs:
  compare-native-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Read the exact original and proposed setup action path outputs
        id: paths
        run: |
          python3 - <<'PY'
          import subprocess,os,re,pathlib
          for name,sha,job in [('old','0d743619956147f3296becd7769c1b14ad48a8d3','verify'),('portable','d88aa603f605d1d9fd84fc41ae969f861a939ef9','verify'),('sim','d88aa603f605d1d9fd84fc41ae969f861a939ef9','simulate-3'),('fixture','d88aa603f605d1d9fd84fc41ae969f861a939ef9','selftest-a'),('oldfixture','0d743619956147f3296becd7769c1b14ad48a8d3','selftest-a')]:
           text=subprocess.check_output(['git','show',sha+':.github/actions/setup/action.yml'],text=True)
           script=text.split('echo "path<<EOF"',1)[1].split('echo "EOF"',1)[0]
           paths=subprocess.check_output(['bash','-eu','-c',script],env={**os.environ,'JOB':job},text=True).strip()
           with open(os.environ['GITHUB_OUTPUT'],'a') as o:o.write(name+'<<PATHS\n'+paths+'\nPATHS\n')
           pathlib.Path(os.environ['RUNNER_TEMP'],name+'.paths').write_text(paths)
          assert pathlib.Path(os.environ['RUNNER_TEMP'],'portable.paths').read_bytes()==pathlib.Path(os.environ['RUNNER_TEMP'],'sim.paths').read_bytes()
          assert pathlib.Path(os.environ['RUNNER_TEMP'],'fixture.paths').read_bytes()==pathlib.Path(os.environ['RUNNER_TEMP'],'oldfixture.paths').read_bytes()
          PY
          cat > "$RUNNER_TEMP/receipt-audit.py" <<'PY'
          import collections,glob,hashlib,json,os,pathlib,shutil,sys
          P=pathlib.Path
          tmp=P(os.environ['RUNNER_TEMP'])/'receipt-selection'
          tmp.mkdir(exist_ok=True)
          root=P.cwd()
          patterns=['.spec-cache','apps/*/.spec-cache','packages/*/.spec-cache','vibestack/studio/.spec-cache','vibestack/examples/*/.spec-cache']
          def roots():
           return [p for pattern in patterns for p in sorted(root.glob(pattern)) if p.is_dir()]+([P.home()/'.quint'] if (P.home()/'.quint').is_dir() else [])
          def snap(paths):
           entries={}
           for base in paths:
            for p in base.rglob('*'):
             if p.is_symlink():digest='symlink:'+os.readlink(p);size=len(digest)
             elif p.is_file():size=p.stat().st_size;digest=hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
             elif p.is_dir():continue
             else:raise ValueError(p)
             name=p.relative_to(root).as_posix() if p.is_relative_to(root) else '~/.quint/'+p.relative_to(P.home()/'.quint').as_posix()
             entries[name]=[size,digest,'evaluator' if base==P.home()/'.quint' else ('receipt' if p.parent==base and p.name.endswith(('.json.zst','.json.gz')) else 'process-or-other')]
           return entries
          def record(name,entries):
           (tmp/(name+'.json')).write_text(json.dumps(entries,sort_keys=True))
           counts=collections.Counter(x[2] for x in entries.values())
           sizes=collections.Counter()
           for x in entries.values():sizes[x[2]]+=x[0]
           print(name,dict(counts),dict(sizes),flush=True)
          def move_out(phase):
           for i,p in enumerate(roots()):
            dest=tmp/phase/str(i);dest.parent.mkdir(exist_ok=True);shutil.move(p,dest)
          step=sys.argv[1]
          if step=='source':
           live=snap(roots());record('source',live);assert any(x[2]=='receipt' for x in live.values())
           assert any('quint_evaluator' in name for name in live)
           # Disposable non-receipts represent the on-disk names written by lockProject, staging, and writeWhole.
           for i,base in enumerate([root/'.spec-cache',root/'apps/portable-probe/.spec-cache',root/'packages/portable-probe/.spec-cache',root/'vibestack/studio/.spec-cache',root/'vibestack/examples/portable-probe/.spec-cache']):
            base.mkdir(parents=True,exist_ok=True)
            for n in ['lock.9301.stale','precompute-private/nested.json','run-private/generated.ts','simulate-000000000000000000000000.json.zst.9301.test.tmp']:
             p=base/n;p.parent.mkdir(parents=True,exist_ok=True);assert not p.exists();p.write_text('probe:'+str(i))
            if not (base/'lock').exists():(base/'lock').write_text(str(os.getpid())+'\n')
           record('published',snap(roots()))
          elif step=='clear':move_out(sys.argv[2])
          elif step in ('old','portable'):
           actual=snap(roots());record(step,actual);published=json.loads((tmp/'published.json').read_text())
           expected=published if step=='old' else {k:v for k,v in published.items() if v[2]!='process-or-other'}
           assert actual==expected,{'missing':sorted(expected.keys()-actual.keys())[:20],'added':sorted(actual.keys()-expected.keys())[:20],'changed':[k for k in actual.keys()&expected.keys() if actual[k]!=expected[k]][:20]}
          elif step=='fixture':
           fs=snap([root/'.cache/selftest/.spec-cache',P.home()/'.quint']);record('fixture',fs)
           assert fs and any('/.spec-cache/' in name for name in fs) and any('quint_evaluator' in name for name in fs)
          PY
      - name: Restore real current official broad verify archive
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.paths.outputs.old }}
          key: spec-Linux-X64-verify-46b745cad7d74ac550c03615c3b39dd273347211fc3e36492628a902caf1fd74-0d743619956147f3296becd7769c1b14ad48a8d3-1
          fail-on-cache-miss: true
      - name: Inventory the real restored files and add isolated process-state controls
        run: python3 "$RUNNER_TEMP/receipt-audit.py" source
      - name: Publish baseline archive with native directory selection
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.paths.outputs.old }}
          key: receipt-path-evidence-old-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish portable archive with native receipt selection
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.paths.outputs.portable }}
          key: receipt-path-evidence-portable-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Move source files out of the runner cache directories
        run: python3 "$RUNNER_TEMP/receipt-audit.py" clear original
      - name: Restore baseline comparison from the cache service
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.paths.outputs.old }}
          key: receipt-path-evidence-old-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Check all original and process-only files in the native baseline round trip
        run: python3 "$RUNNER_TEMP/receipt-audit.py" old
      - name: Move baseline files away for an independent portable receiver
        run: python3 "$RUNNER_TEMP/receipt-audit.py" clear baseline
      - name: Restore portable comparison from the cache service
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.paths.outputs.portable }}
          key: receipt-path-evidence-portable-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Check every reusable receipt and evaluator byte and every process-state exclusion
        run: python3 "$RUNNER_TEMP/receipt-audit.py" portable
      - name: Start a separate native fixture receiver
        run: python3 "$RUNNER_TEMP/receipt-audit.py" clear current
      - name: Restore the existing official selftest A archive with the proposed path output
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.paths.outputs.fixture }}
          key: spec-Linux-X64-selftest-a-46b745cad7d74ac550c03615c3b39dd273347211fc3e36492628a902caf1fd74-0d743619956147f3296becd7769c1b14ad48a8d3-1
          fail-on-cache-miss: true
      - name: Verify physical fixture data and pinned native evaluator presence
        run: python3 "$RUNNER_TEMP/receipt-audit.py" fixture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: archive-selection
          path: |
            ${{ runner.temp }}/receipt-selection/*.json
            ${{ runner.temp }}/*.paths
          if-no-files-found: error
          retention-days: 5
