name: Measure real Android test signing fixtures
on:
  push:
    branches: [codex/measure-android-signing-fixtures-1123]
permissions:
  contents: read
jobs:
  qualify-apk-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      CANDIDATE: e1ee5cbc3e8a8774e70aecaaf23461d5b37a4114
    steps:
      - uses: actions/checkout@v7
      - name: Obtain the two existing candidate test files
        run: git fetch --no-tags --depth=1 origin "$CANDIDATE"
      - uses: ./.github/actions/setup
        with:
          job: verify
          verification: 'false'
          cache-verification: 'false'
      - name: Exercise both journeys with a real JDK and Android build tools
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          nproc
          uptime
          cat > "$RUNNER_TEMP/count-apk-tools.cjs" <<'OBSERVER'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const path=require('node:path');
          const real=cp.execFileSync;
          cp.execFileSync=function (file,args,...options) {
           const value=real.call(this,file,args,...options);
           const name=path.basename(file);
           if (['keytool','apksigner','aapt2','zipalign'].includes(name)) fs.appendFileSync(process.env.APK_TOOL_COUNTS,JSON.stringify([name,args[0]])+'\n');
           return value;
          };
          require('node:module').syncBuiltinESMExports();
          OBSERVER
          python3 -u - <<'BENCH'
          import collections,json,os,pathlib,shutil,subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          report=tmp/'apk-fixtures'
          report.mkdir()
          pkg=root/'packages/os'
          files=['test/build-android.test.vibe','test/image.test.vibe']
          sources={case:{file:subprocess.check_output(['git','show',revision+':packages/os/'+file],cwd=root) for file in files} for case,revision in [('baseline','HEAD'),('candidate',os.environ['CANDIDATE'])]}
          assert all(sources['baseline'][f]!=sources['candidate'][f] for f in files)
          results=[]
          titles=None
          for i,case in enumerate(['baseline','candidate']+['baseline','candidate','candidate','baseline','baseline','candidate','candidate','baseline','baseline','candidate']):
           for file,content in sources[case].items(): (pkg/file).write_bytes(content)
           env=os.environ.copy()
           label=f'{i}-{case}'
           tf=report/(label+'-time.txt'); raw=report/(label+'-vitest.json')
           if i<2:
            env['APK_TOOL_COUNTS']=str(tmp/(label+'-tools.jsonl'))
            env['NODE_OPTIONS']=(env.get('NODE_OPTIONS','')+' --require='+str(tmp/'count-apk-tools.cjs')).strip()
           cmd=['/usr/bin/time','-f','%e %U %S %M','-o',str(tf),'pnpm','exec','vitest','run',*files,'--reporter=json','--outputFile='+str(raw)]
           proc=subprocess.run(cmd,env=env,cwd=pkg,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
           (report/(label+'.log')).write_text(proc.stdout)
           if not raw.exists():raise RuntimeError(proc.stdout[-3000:])
           data=json.loads(raw.read_text())
           assertions=sorted([a['fullName'],a['status']] for test in data['testResults'] for a in test['assertionResults'])
           counts=collections.Counter(a[1] for a in assertions)
           summary={'case':case,'instrumented':i<2,'exit':proc.returncode,'assertions':assertions,'time':tf.read_text().strip(),'counts':dict(counts)}
           if i<2:
            acc=collections.Counter(tuple(json.loads(l)) for l in pathlib.Path(env['APK_TOOL_COUNTS']).read_text().splitlines())
            summary['tools']={':'.join(k):v for k,v in acc.items()}
           results.append(summary);(report/'summary.json').write_text(json.dumps(results,indent=2))
           print(label,summary['time'],dict(counts),summary.get('tools',''),flush=True)
           assert proc.returncode==0 and set(counts)=={'passed'} and len(assertions)>=10,(proc.stdout[-2500:],assertions)
           assert titles is None or assertions==titles
           titles=assertions
          BENCH
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-signing-fixture-comparison
          path: ${{ runner.temp }}/apk-fixtures/
          if-no-files-found: warn
          retention-days: 5
