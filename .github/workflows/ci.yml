name: CI
on:
  workflow_call: null
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
env:
  CI: "true"
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24.15.0
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
      - name: Validate Windows command coverage contract
        run: node packages/scripts/ci-windows-command-coverage-contract.mjs
      - name: Build core contract
        run: bun run build:core
      - name: Repository verification
        env:
          RUN_TURBO_CONCURRENCY: "4"
        run: bun run verify
      - name: Formatting
        run: bun run format:check
      - name: Run CLAUDE/AGENTS guide parity self-test
        run: node --test scripts/assert-agents-claude-identical.test.mjs
      - name: Check maintained Markdown link targets
        run: node scripts/check-markdown-links.mjs
      - name: Run type-duplication finder self-test
        run: bun run audit:type-duplication:self-test
      - name: Prompt secret scan
        run: cd packages/prompts && bun run check:secrets
      - name: Anti-larp test gate self-test
        run: bun run audit:focused-tests:self-test
      - name: Validate brand-env alias-read guard self-test
        run: node packages/scripts/alias-read-guard.mjs --self-test
      - name: Validate CI Bun version pin contract
        run: node packages/scripts/ci-bun-version-contract.mjs --inventory "$RUNNER_TEMP/bun-runtime-inventory.json"
      - name: Upload Bun runtime resolution inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-runtime-inventory
          path: ${{ runner.temp }}/bun-runtime-inventory.json
          retention-days: 7
    needs: preflight
  tests:
    name: Tests (scripts)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
      - name: Build core contract for script tests
        run: bun run build:core
      - name: Script contract tests
        env:
          E2E_COVERAGE_GATE_ENFORCE: "1"
        run: bun run test:scripts
      - name: Upload script-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: script-tests-linux
          path: reports/script-tests/
          if-no-files-found: error
          retention-days: 7
  tests_server:
    name: Tests (server, ${{ matrix.partition }})
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: agent
            filter: ^@elizaos/agent \(packages/agent\)#test$
          - partition: remaining
            filter: ^(?!@elizaos/agent \(packages/agent\)#test$)
    env:
      TEST_PACKAGE_FILTER: ${{ matrix.filter }}
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
      - name: Server tests
        run: bun run test:server
  tests_client:
    name: Tests (client)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
      - name: Install browser for client integration tests
        run: bunx playwright install --with-deps chromium
      - name: Client tests
        run: bun run test:client
      - name: Remote capability UI smoke
        run: bun run test:remote-capabilities:ui
  tests_plugins:
    name: Plugin Tests (${{ matrix.shard }}/4)
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      CI: "true"
      BUN_VERSION: 1.3.14
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      TEST_SHARD: ${{ matrix.shard }}/4
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-shared-target
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          setup-python: "true"
          install-protoc: "true"
      - name: Cache cargo registry and shared target dir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cargo-shared-target
          key: ${{ runner.os }}-cargo-plugin-tests-${{ hashFiles('plugins/*/rust/Cargo.lock', 'plugins/*/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-plugin-tests-
      - name: Build view bundles
        run: bun run build:views
      - name: Initialize pinned native sources for provenance tests
        run: git submodule update --init --depth 1 plugins/plugin-local-inference/native/llama.cpp
      - name: Run plugin tests
        timeout-minutes: 85
        run: bun run test:plugins
      - name: Prune cargo cache payload
        if: always()
        run: |
          node packages/scripts/rm-path-recursive.mjs \
            "${CARGO_TARGET_DIR}/debug/incremental" \
            "${CARGO_TARGET_DIR}/debug/.fingerprint" \
            "${CARGO_TARGET_DIR}/debug/build" \
            "${CARGO_TARGET_DIR}/debug/examples" \
            "${CARGO_TARGET_DIR}/release/incremental" \
            "${CARGO_TARGET_DIR}/release/.fingerprint" \
            "${CARGO_TARGET_DIR}/release/build" \
            "${CARGO_TARGET_DIR}/release/examples"
          find "${CARGO_TARGET_DIR}" -type f \( -name '*.d' -o -name '*.rlib' -o -name '*.rmeta' \) -delete 2>/dev/null || true
  smoke:
    name: Smoke
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
      - name: Install Playwright browsers
        run: PLAYWRIGHT_INSTALL_CWD=packages/app .github/scripts/install-playwright-browsers.sh chromium webkit
      - name: Deterministic end-to-end smoke
        env:
          CI: "true"
          BUN_VERSION: 1.3.14
          NODE_VERSION: 24.15.0
          NODE_OPTIONS: --max-old-space-size=4096
          TEST_LANE: pr
          ELIZA_LIVE_TEST: "0"
          SCENARIO_USE_DETERMINISTIC_MODEL: "1"
          CEREBRAS_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          GOOGLE_GENERATIVE_AI_API_KEY: ""
          XAI_API_KEY: ""
          NVIDIA_API_KEY: ""
          ELIZAOS_CLOUD_API_KEY: ""
          ELIZA_UI_SMOKE_SHARD: ${{ matrix.shard }}/6
          PLAYWRIGHT_WEBKIT: "1"
        run: bun run --cwd packages/app test:e2e
  smoke_lanes:
    name: Smoke lanes
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
      - name: Build core contract
        run: bun run build:core
      - name: Desktop startup smoke
        run: bun run test:dev-startup
      - name: Install Playwright browsers
        run: PLAYWRIGHT_INSTALL_CWD=packages/ui .github/scripts/install-playwright-browsers.sh chromium
      - name: Deterministic end-to-end smoke (unshardable tasks)
        run: bun run test:e2e --filter='^(?!.*packages/app\)#test:e2e)'
    env:
      PGLITE_WASM_MODE: node
  android_aab:
    name: Android release AAB
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          run-postinstall: "true"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          setup-python: "false"
      - name: Build mobile package dependencies
        run: |
          bun run --cwd packages/prompts build:package
          bun run build:core
          bun run --cwd packages/ui build
          bun run --cwd packages/vault build
          bun run --cwd packages/agent build:mobile
      - name: Verify mobile bundle initialization is synchronous
        shell: bash
        run: |
          set -euo pipefail
          bundle="packages/agent/dist-mobile/agent-bundle.js"
          test -s "$bundle"
          if grep -qE 'var init_eliza\b[^=]*= __esm\(async ' "$bundle"; then
            echo "::error::init_eliza re-emitted as async __esm"
            exit 1
          fi
      - name: Build and audit canonical Android Cloud release AAB
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          bun run --cwd packages/app build:android:cloud 2>&1 \
            | tee "$RUNNER_TEMP/android-cloud-release-aab-audit.log"
      - name: Verify release AAB audit evidence
        id: release-aab-evidence
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="packages/app-core/platforms/android/app/build/outputs/bundle/release/app-release.aab"
          AUDIT_LOG="$RUNNER_TEMP/android-cloud-release-aab-audit.log"
          ATTESTATION="$RUNNER_TEMP/android-cloud-release-attestation.json"
          SHA256="$RUNNER_TEMP/android-cloud-release-aab.sha256"
          test -s "$AAB_PATH"
          test -s "$AUDIT_LOG"
          node - "$AUDIT_LOG" "$ATTESTATION" "$AAB_PATH" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const [logPath, outputPath, aabPath] = process.argv.slice(2);
          const prefix = "[mobile-build] android-cloud AAB attestation ";
          const line = fs
            .readFileSync(logPath, "utf8")
            .split(/\r?\n/)
            .filter((candidate) => candidate.startsWith(prefix))
            .at(-1);
          if (!line) throw new Error("release AAB attestation was not emitted");
          const attestation = JSON.parse(line.slice(prefix.length));
          if (attestation.bundletool?.version !== "1.18.3") {
            throw new Error("release AAB attestation has the wrong bundletool version");
          }
          const bytes = fs.readFileSync(aabPath);
          const digest = crypto.createHash("sha256").update(bytes).digest("hex");
          if (
            attestation.artifact?.sha256 !== digest ||
            attestation.artifact?.sizeBytes !== bytes.byteLength
          ) {
            throw new Error("release AAB attestation does not match the artifact");
          }
          fs.writeFileSync(outputPath, `${JSON.stringify(attestation, null, 2)}\n`);
          NODE
          sha256sum "$AAB_PATH" | tee "$SHA256"
          test -s "$ATTESTATION"
          test -s "$SHA256"
      - name: Upload verified release AAB evidence
        if: ${{ always() && !cancelled() && steps.release-aab-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-cloud-release-aab-audit
          path: |
            packages/app-core/platforms/android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/android-cloud-release-aab-audit.log
            ${{ runner.temp }}/android-cloud-release-aab.sha256
            ${{ runner.temp }}/android-cloud-release-attestation.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload Android failure diagnostics
        if: ${{ always() && !cancelled() && steps.release-aab-evidence.outcome != 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-cloud-release-aab-failure-diagnostics
          path: ${{ runner.temp }}/android-cloud-release-aab-audit.log
          retention-days: 3
          if-no-files-found: warn
  browser_bridge_windows_security:
    name: Browser bridge Windows security
    uses: ./.github/workflows/browser-bridge-windows-security.yml
    needs: preflight
  required:
    name: All Tests Passed
    if: ${{ always() && !cancelled() }}
    needs:
      - quality
      - tests
      - tests_server
      - tests_client
      - tests_plugins
      - smoke
      - smoke_lanes
      - android_aab
      - browser_bridge_windows_security
      - preflight
      - remote-capabilities
      - desktop-contract
      - zero-key-diagnostics
      - zero-key-scenario-runner
      - zero-key-model-provider-e2e
      - scenario-unit-coverage
      - app-accounts-ui
      - app-walkthrough-mock
      - app-workflow-runtime
      - frontend-build
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: |-
            quality=${{ needs.quality.result }}
            tests=${{ needs.tests.result }}
            tests_server=${{ needs.tests_server.result }}
            tests_client=${{ needs.tests_client.result }}
            tests_plugins=${{ needs.tests_plugins.result }}
            smoke=${{ needs.smoke.result }}
            smoke_lanes=${{ needs.smoke_lanes.result }}
            android_aab=${{ needs.android_aab.result }}
            browser_bridge_windows_security=${{ needs.browser_bridge_windows_security.result }}
            preflight=${{ needs.preflight.result }}
            remote-capabilities=${{ needs.remote-capabilities.result }}
            desktop-contract=${{ needs.desktop-contract.result }}
            zero-key-diagnostics=${{ needs.zero-key-diagnostics.result }}
            zero-key-scenario-runner=${{ needs.zero-key-scenario-runner.result }}
            zero-key-model-provider-e2e=${{ needs.zero-key-model-provider-e2e.result }}
            scenario-unit-coverage=${{ needs.scenario-unit-coverage.result }}
            app-accounts-ui=${{ needs.app-accounts-ui.result }}
            app-walkthrough-mock=${{ needs.app-walkthrough-mock.result }}
            app-workflow-runtime=${{ needs.app-workflow-runtime.result }}
            frontend-build=${{ needs.frontend-build.result }}
        run: |
          set -euo pipefail
          if [ -z "$RESULTS" ]; then echo "::error::Missing required job results"; exit 1; fi
          for pair in $RESULTS; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "::error title=CI aggregate::$name finished with $result"
              exit 1
            fi
          done
  preflight:
    name: Validate source before fan-out
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
      - name: Reject unresolved merge-conflict markers
        run: |
          set -euo pipefail
          status=0
          git grep -n -E '^(<{7}|>{7})( |$)' -- . || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Unresolved git merge-conflict marker(s) in the tracked files listed above. Finish or abort the merge before landing."
            exit 1
          elif [ "$status" -gt 1 ]; then
            echo "::error::merge-conflict marker scan failed (git grep exit $status)"
            exit 1
          fi
          echo "No unresolved merge-conflict markers in tracked files."
      - name: Check source whitespace
        run: git show --format= --check HEAD
  remote-capabilities:
    name: Remote capability integration contracts
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 60
    env:
      CI: "true"
      BUN_VERSION: 1.3.14
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build view bundles
        run: bun run build:views
      - name: Views system tests
        run: bunx vitest run packages/agent/src/__tests__/views-system-smoke.test.ts
      - name: Remote capability router tests
        run: bun run test:remote-capabilities
      - name: Remote capability plugin surface audit
        run: bun run test:remote-capabilities:surface-audit
      - name: Remote capability naming audit
        run: bun run test:remote-capabilities:naming-audit
      - name: Remote capability naming audit self-test
        run: bun run test:remote-capabilities:naming-audit:self-test
      - name: Remote capability live CI audit self-test
        run: bun run test:remote-capabilities:live-ci-audit:self-test
      - name: Remote capability source-build smoke
        run: bun run test:remote-capabilities:source-build
      - name: Remote capability fixture server smoke
        run: bun run test:remote-capabilities:fixture-server
      - name: Remote capability live report validator self-test
        run: bun run test:remote-capabilities:validate-live-reports:self-test
      - name: Remote capability GitHub live evidence self-test
        run: bun run test:remote-capabilities:github-live-evidence:self-test
      - name: Remote capability GitHub live artifact self-test
        run: bun run test:remote-capabilities:github-live-artifacts:self-test
      - name: Check Docker container-start health
        id: docker-health
        run: |
          set -euo pipefail
          timeout 300 docker pull node:24-alpine
          timeout 90 docker run --rm node:24-alpine true
          echo "healthy=true" >> "$GITHUB_OUTPUT"
      - name: Remote capability Docker smoke
        if: steps.docker-health.outputs.healthy == 'true'
        run: bun run test:remote-capabilities:docker
      - name: Run synthetic-world transaction tests
        run: bun run --cwd packages/synthetic-world test
  desktop-contract:
    name: Electrobun Desktop Contract
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          setup-fused-inference: "true"
          setup-python: "true"
          install-protoc: "true"
      - name: Build workspace packages for Vitest resolution
        run: bun run build:core
      - name: Run Electrobun contract tests
        working-directory: packages/app-core/platforms/electrobun
        run: bun run test
    env:
      CI: "true"
      BUN_VERSION: 1.3.14
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
