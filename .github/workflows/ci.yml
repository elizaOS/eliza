name: Qualify provider database and JVM fixtures against ordinary journeys
on:
  push:
    branches: [codex/measure-qualified-native-media-1123]
permissions:
  contents: read
env:
  BASE: 7a8ad3ce4da1ff4576e5d5b44954552f551ccf8b
  CANDIDATE: 37359a279e524150431ef6d7b0dd2585c5af1485
jobs:
  real-android-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Locate the real JDK and Android platform
        run: |
          test -x "$JAVA_HOME_21_X64/bin/javac"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Compile both source revisions and exercise actual adapter output
        run: |
          cat > .qualify-jvm.mjs <<'NATIVE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import path from 'node:path'
          import crypto from 'node:crypto'
          import {execFileSync} from 'node:child_process'
          import {compileAdapters,orgJsonAdapterClasspath} from './packages/os/test/drivers/jvm-adapter.ts'
          import {androidTools} from './packages/os/test/support/android-tools.ts'
          const tools=androidTools();assert.equal(tools.kind,'present')
          const cases = Array.from(new Set(Array.from(fs.readFileSync('packages/os/test/media-native.test.vibe','utf8').matchAll(/try checked\("([^"]+)"\)/g), m=>m[1])));assert.equal(cases.length,10)
          const s=performance.now(),c=process.cpuUsage()
          const digest=crypto.createHash('sha256');let classes=0
          const verdicts=[]
          for(const name of cases){
           const main='ai.eliza.plugins.media.'+name;const cp=await orgJsonAdapterClasspath(main)
           const dir=cp.split(path.delimiter)[0]
           for(const file of fs.globSync('**/*.class',{cwd:dir}).sort()){digest.update(file);digest.update(fs.readFileSync(path.join(dir,file)));classes++}
           const output=execFileSync(path.join(process.env.JAVA_HOME,'bin/java'),['-cp',cp,main],{encoding:'utf8'}).trim();const count=/^(\d+) [\w ]*passed|checks: (\d+)/m.exec(output);assert.ok(count && Number(count[1]??count[2])>0)
           verdicts.push([name,output])
          }
          const elapsed=performance.now()-s,cpu=process.cpuUsage(c)
          console.log(JSON.stringify({elapsed_ms:elapsed,parentCPU_ms:(cpu.user+cpu.system)/1000,compiled:cases.length,classes,digest:digest.digest('hex'),verdict:JSON.stringify(verdicts),androidJarSize:fs.statSync(tools.androidJar).size}))
          NATIVE
          python3 - <<'BENCHMARK'
          import json,os,pathlib,resource,shutil,subprocess,time
          r=pathlib.Path.cwd();p=pathlib.Path(os.environ['RUNNER_TEMP'])/'jvm-evidence';p.mkdir(exist_ok=True)
          f='packages/os/test/drivers/jvm-adapter.ts';base=os.environ['BASE'];candidate=os.environ['CANDIDATE'];rows=[]
          for i in range(6):
           for tag,sha in ([('before',base),('after',candidate)] if i%2==0 else [('after',candidate),('before',base)]):
            (r/f).write_bytes(subprocess.check_output(['git','show',sha+':'+f]))
            cache=r/'packages/os/.cache/jvm'; saved=p/('cache-'+tag)
            if cache.exists(): shutil.rmtree(cache)
            if saved.exists(): cache.parent.mkdir(parents=True,exist_ok=True);saved.rename(cache)
            c=resource.getrusage(resource.RUSAGE_CHILDREN);start=time.perf_counter()
            o=subprocess.run(['node','.qualify-jvm.mjs'],capture_output=True,text=True)
            if o.returncode: print(o.stderr[-4000:],flush=True);raise RuntimeError(o.returncode)
            d=json.loads(o.stdout.strip().splitlines()[-1]);cc=resource.getrusage(resource.RUSAGE_CHILDREN)
            row={**d,'tag':tag,'iteration':i,'wall':time.perf_counter()-start,'cpu':cc.ru_utime+cc.ru_stime-c.ru_utime-c.ru_stime}
            cache.rename(saved)
            rows.append(row);(p/'jvm.json').write_text(json.dumps(rows,indent=2));print(row,flush=True)
          assert len({(a['classes'],a['digest'],a['verdict']) for a in rows})==1
          BENCHMARK
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jvm-journeys
          path: ${{ runner.temp }}/jvm-evidence/*.json
          if-no-files-found: ignore
          retention-days: 5
