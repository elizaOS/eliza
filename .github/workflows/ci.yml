name: Full smoke transport diagnostic (nonmerge probe)
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: full-smoke-transport-${{ github.run_id }}
  cancel-in-progress: false
env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  smoke_lanes:
    name: Smoke lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
      - name: Build core contract
        run: bun run build:core
      - name: Initialize external process observation
        run: |
          mkdir -p "$RUNNER_TEMP/transport-observation"
          python3 .github/scripts/transport-process-observer.py "$PPID" > "$RUNNER_TEMP/transport-observation/process-observer.log" 2>&1 &
      - name: Desktop startup smoke
        env:
          NODE_OPTIONS: --max-old-space-size=8192 --import=${{ github.workspace }}/.github/scripts/transport-lifecycle-observer.mjs
        run: node packages/app-core/scripts/dev-startup-smoke.mjs
      - name: Install Playwright browsers
        run: PLAYWRIGHT_INSTALL_CWD=packages/ui .github/scripts/install-playwright-browsers.sh chromium
      - name: Deterministic end-to-end smoke (unshardable tasks)
        env:
          NODE_OPTIONS: --max-old-space-size=8192 --import=${{ github.workspace }}/.github/scripts/transport-lifecycle-observer.mjs
        run: |
          bun run test:e2e --filter='^(?!.*packages/app\)#test:e2e)' 2>&1 | tee "$RUNNER_TEMP/transport-observation/full-smoke.log"
      - name: Finish owned process observation
        if: always()
        run: |
          touch "$RUNNER_TEMP/transport-observation/stop"
          sleep 2
      - name: Preserve external diagnostic records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-smoke-transport-diagnostic
          path: ${{ runner.temp }}/transport-observation
          retention-days: 3
          if-no-files-found: warn
    env:
      PGLITE_WASM_MODE: node
