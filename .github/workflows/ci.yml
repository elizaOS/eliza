name: Qualify current Eliza simulation-only dependency installation
on:
  push:
    branches: [codex/qualify-current-eliza-worker-install-1123-v2]
permissions:
  contents: read
  actions: read
jobs:
  vibestack-precompute-simulations:
    name: Install and replay (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [whole, production]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: matrix.mode == 'production'
        run: cp .github/actions/setup/qualification-production.yml .github/actions/setup/action.yml
      - uses: ./.github/actions/setup
        with:
          job: simulate-2
          cache-verification: 'false'
      - name: Run both ordinary Eliza models cold and capture their native receipts
        run: |
          cat > .qualify-install.mjs <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { prepareSimulationReceipts, readSpecs } from './vibestack/formal.ts';
          const temp=process.env.RUNNER_TEMP;
          const evidence=path.join(temp,'simulation-handoff-evidence');
          fs.mkdirSync(evidence,{recursive:true});
          const specs=readSpecs(process.cwd());
          const files=['spec/core/queryDrain.md','spec/core/identityGroups.md'];
          const names=specs.filter(s=>files.includes(s.file)).map(s=>s.name);
          assert.equal(names.length,2);
          const cache='.spec-cache';
          const before=fs.existsSync(cache)?fs.readdirSync(cache).filter(k=>/^(?:action|simulate)-/.test(k)):[];
          assert.equal(before.length,0);
          const result={install:fs.readFileSync(path.join(temp,'pnpm-install.time'),'utf8').trim(),snapshots:fs.readdirSync('node_modules/.pnpm',{withFileTypes:true}).filter(d=>d.isDirectory()&&d.name!=='node_modules').length,node:process.version,cpus:os.availableParallelism(),names,totalModels:specs.length};
          const write=()=>fs.writeFileSync(path.join(evidence,'results.json'),JSON.stringify(result,null,2));
          write();
          const t=performance.now();
          const output=await prepareSimulationReceipts(process.cwd(),specs,names,temp);
          result.simulationMs=performance.now()-t;
          result.rows=output.results;
          assert.equal(result.rows.length,8);
          assert(result.rows.every(r=>r.ok));
          assert(output.seedDirectory);
          const dir=output.seedDirectory;
          result.members=Object.fromEntries(fs.readdirSync(dir).sort().map(k=>[k,createHash('sha256').update(fs.readFileSync(path.join(dir,k))).digest('hex')]));
          result.completed=true;write();console.log(JSON.stringify(result));
          JAVASCRIPT
          node .qualify-install.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-install-${{ matrix.mode }}
          path: ${{ runner.temp }}/simulation-handoff-evidence/
          if-no-files-found: warn
          retention-days: 5
