name: Measure package test-stage citation and owner reads
on:
  push:
    branches: [codex/measure-native-test-stage-visits-1123]
permissions:
  contents: read
jobs:
  real-package-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: verify
          verification: 'true'
          cache-verification: 'false'
      - name: Build runtime packages imported by the tested projects
        run: pnpm exec turbo run build --filter=@elizaos/agent --filter=@elizaos/cloud --filter=@elizaos/core --continue=dependencies-successful
      - name: Run the package test stage on genuine receipts and edited source and owner mappings
        run: |
          cat > "$RUNNER_TEMP/arms.py" <<'PY'
          from pathlib import Path
          import sys
          def arm(source,mode):
           def replace(a,b):
            nonlocal source
            assert source.count(a)==1,(mode,a,source.count(a));source=source.replace(a,b)
           if mode in ('citations','both'):
            replace('    const dangling = danglingCitations(checking, specs, dir);','    const cited = citations(checking, [dir]);\n    const dangling = missingHeadings(specs, cited);')
            replace('    said.push(...testRules(checking, dir, specs));','    said.push(...testRules(checking, dir, specs, cited));')
            replace('export function danglingCitations(root: string, specs: Spec[], dir = ""): string[] {','export function danglingCitations(root: string, specs: Spec[], dir = ""): string[] {\n  return missingHeadings(specs, citations(root, [dir]));\n}\n\nfunction missingHeadings(specs: Spec[], cited: Citation[]): string[] {')
            replace('  return citations(root, [dir]).filter((c) => !specs.some(', '  return cited.filter((c) => !specs.some(')
            replace('function testRules(checking: string, dir: string, specs: Spec[]): Reported<"tests">[] {','function testRules(checking: string, dir: string, specs: Spec[], cited: Citation[]): Reported<"tests">[] {')
            replace('const checked = new Set(citations(checking, [dir]).filter(', 'const checked = new Set(cited.filter(')
           if mode in ('owners','both'):
            replace('    const unchecked = specs.filter((s) => s.stories.length && !isStd(s.file) && (owner(checking, s.file) ?? "") === dir.slice(0, -1) && !checked.has(s.file)', '''    const owned = new Map<string, boolean>();
              const belongs = (file: string) => {
                const area = file.match(/^spec\\/[^/]*\\//)?.[0] ?? "";
                if (!owned.has(area)) owned.set(area, (owner(checking, file) ?? "") === dir.slice(0, -1));
                return owned.get(area);
              };
              const unchecked = specs.filter((s) => s.stories.length && !isStd(s.file) && belongs(s.file) && !checked.has(s.file)''')
           return source
          if __name__=='__main__':
           src=Path(sys.argv[1]);out=Path(sys.argv[2]);out.mkdir(parents=True,exist_ok=True)
           for name in ['base','citations','owners','both']:(out/('util-bench-'+name+'.ts')).write_text(arm(src.read_text(),name))
          PY
          python3 "$RUNNER_TEMP/arms.py" vibestack/util.ts vibestack
          cat > .test-stage-bench.mjs <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {syncBuiltinESMExports} from 'node:module';
          import {readSpecs} from './vibestack/parse.ts';
          import {entry, remembered} from './vibestack/cache.ts';
          const root=process.cwd(), ops=['base','citations','owners','both'];
          const dirs=['packages/plugin-maps/','packages/plugin-notes/'];
          const arms=Object.fromEntries(await Promise.all(ops.map(async n=>[n,await import('./vibestack/util-bench-'+n+'.ts')])));
          const specs=readSpecs(root);
          const report={node:process.version,cpus:process.env.RUNNER_ARCH,specs:specs.length,dirs,prime:[],profiles:[],samples:[],changed:[],ownership:[]};
          const destination=path.join(process.env.RUNNER_TEMP,'test-stage.json');
          const save=()=>fs.writeFileSync(destination,JSON.stringify(report,null,2));
          function digest(rows){return createHash('sha256').update(JSON.stringify(rows)).digest('hex')}
          async function run(n,dir,{fresh=false,profile=false}={}){
           const counts={manifest:0,source:0,tests:0,read:0,listing:0,exists:0};
           const orig=new Map();
           if(profile){
            for(const [name,field] of [['readFileSync','read'],['readdirSync','listing'],['existsSync','exists']]){
             const old=fs[name];orig.set(name,old);
             fs[name]=function(file,...args){
              counts[field]++;
              if(typeof file==='string'&&name==='readFileSync'){
               if(file===path.join(root,'package.json'))counts.manifest++;
               if(file.startsWith(path.join(root,dir,'src')+path.sep))counts.source++;
               if(file.startsWith(path.join(root,dir,'test')+path.sep))counts.tests++;
              }
              return old.call(this,file,...args);
             };
            }
            syncBuiltinESMExports();
           }
           let launches=0;
           const before=performance.now(), cpu=process.cpuUsage();
           try{
            const memory={root,fresh,used:new Set()};
            const rows=await arms[n].tests(root,dir,specs,
             (key,task,keep)=>remembered(memory,entry(root,'tests',[dir,key]),async()=>{launches++;return task()},keep),'normal',fresh);
            const wall=performance.now()-before,used=process.cpuUsage(cpu);
            return {n,dir,rows,hash:digest(rows),launches,wall,cpu:(used.user+used.system)/1000,counts};
           } finally {
            for(const [name,old] of orig)fs[name]=old;
            if(profile)syncBuiltinESMExports();
           }
          }
          const warm=new Map();
          function checkWarm(v){
           assert.equal(v.rows.at(-1)[2],'pass: the test runner recorded success for these inputs',JSON.stringify(v.rows));
           assert.equal(v.launches,0);
           if(warm.has(v.dir))assert.equal(v.hash,warm.get(v.dir));
           else warm.set(v.dir,v.hash);
          }
          try {
           for(const dir of dirs){
            const first=await run('base',dir,{fresh:true});report.prime.push(first);save();
            assert.equal(first.rows.at(-1)[2],'pass',JSON.stringify(first.rows));assert.equal(first.launches,1);
            assert.ok(fs.existsSync(arms.base.testReceipt(path.join(root,dir),'normal')));
            for(const n of ops){const v=await run(n,dir,{profile:true});report.profiles.push(v);save();checkWarm(v);}
           }
           for(let round=0;round<8;round++){
            for(let j=0;j<dirs.length;j++){
             const dir=dirs[(round+j)%dirs.length];
             for(let k=0;k<ops.length;k++){
              const n=ops[(round+k)%ops.length];
              const v=await run(n,dir);checkWarm(v);
              report.samples.push({round,dir,n,wall:v.wall,cpu:v.cpu,hash:v.hash,launches:v.launches});
             }
            }
            save();
           }
           const maps=dirs[0], source=path.join(root,maps,'src/plugin.vibe'),original=fs.readFileSync(source,'utf8');
           try{
            for(const [i,[leader,follower]] of [['base','both'],['both','base']].entries()){
             const tag='Test stage benchmark absent heading '+i, changed=original.replace(/(spec\/[^,"\n]+, ")[^"\n]+"/,(_,p)=>p+tag+'"');
             assert.notEqual(changed,original);fs.writeFileSync(source,changed);
             const a=await run(leader,maps);report.changed.push(a);save();
             const b=await run(follower,maps);report.changed.push(b);save();
             assert.equal(a.launches,1);assert.equal(a.rows.at(-1)[2],'pass');
             assert.equal(b.launches,0);assert.match(b.rows.at(-1)[2],/recorded success/);
             assert.deepEqual(a.rows.slice(0,-1),b.rows.slice(0,-1));
             assert.ok(a.rows.some(row=>!row[0]&&row[3]?.includes(tag)));
            }
           }finally{fs.writeFileSync(source,original)}
           const manifest=path.join(root,'package.json'), originalManifest=fs.readFileSync(manifest,'utf8'), data=JSON.parse(originalManifest);
           try{
            [data.specOwners.notes,data.specOwners.maps]=[data.specOwners.maps,data.specOwners.notes];
            fs.writeFileSync(manifest,JSON.stringify(data,null,2)+'\n');
            const a=await run('base',maps);report.ownership.push(a);save();
            const b=await run('both',maps);report.ownership.push(b);save();
            assert.deepEqual(a.rows.slice(0,-1),b.rows.slice(0,-1));
            assert.ok(b.rows.some(row=>row[2]?.includes('no test or driver checks')&&row[2]?.includes('spec/notes/')));
            data.specOwners.maps=data.specOwners.notes;
            fs.writeFileSync(manifest,JSON.stringify(data,null,2)+'\n');
            const a2=await run('base',maps),b2=await run('both',maps);
            report.ownership.push(a2,b2);save();assert.deepEqual(a2.rows,b2.rows);
            assert.ok(b2.rows.some(row=>!row[0]&&row[2]?.includes('more than one spec area')));
           }finally{fs.writeFileSync(manifest,originalManifest)}
           report.completed=true;save();
          }catch(e){report.error=String(e?.stack??e);save();throw e}
          JS
          node .test-stage-bench.mjs
      - name: Run the ordinary OS package suite with Chromium installed
        if: always()
        run: pnpm --filter @elizaos/os run test --reporter=json --outputFile="$RUNNER_TEMP/os-browser-equipped.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-package-stage
          path: |
            ${{ runner.temp }}/test-stage.json
            ${{ runner.temp }}/os-browser-equipped.json
          if-no-files-found: error
          retention-days: 5
