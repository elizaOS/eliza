name: Compare concurrency on the complete Eliza product graph
on:
  push:
    branches: [codex/characterize-product-concurrency-1123]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: product-${{ matrix.arm }}-${{ matrix.replicate }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        arm: [standard, four]
        replicate: [1, 2]
    env:
      TURBO_CACHE: local:rw
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0d743619956147f3296becd7769c1b14ad48a8d3
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: verify
          cache-verification: 'false'
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45229003796
          pattern: simulations-*
          path: ${{ runner.temp }}/simulation-receipts
      - name: Import the same official formal receipts as the product check
        env:
          SIMULATION_RECEIPTS: ${{ runner.temp }}/simulation-receipts
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          const source = process.env.SIMULATION_RECEIPTS;
          const cache = ".spec-cache";
          const candidates = fs.globSync(["*", "simulations-*/*"], { cwd: source })
            .filter((file) => /^(?:simulations-\d+\/)?(?:action|simulate)-[a-f0-9]{24}\.json\.(?:zst|gz)$/.test(file) && fs.lstatSync(path.join(source, file)).isFile());
          fs.mkdirSync(cache, { recursive: true });
          let imported = 0;
          for (const [key, files] of Map.groupBy(candidates, (file) => path.basename(file, path.extname(file)))) {
            if (["zst", "gz"].some((codec) => fs.lstatSync(path.join(cache, `${key}.${codec}`), { throwIfNoEntry: false }))) continue;
            const name = path.basename(files[0]);
            const bytes = fs.readFileSync(path.join(source, files[0]));
            if (files.slice(1).some((file) => path.basename(file) !== name || !bytes.equals(fs.readFileSync(path.join(source, file))))) {
              console.log(`::warning::Shards disagree on ${key}; the ordinary check will recompute it.`);
              continue;
            }
            fs.writeFileSync(path.join(cache, name), bytes, { flag: "wx" });
            imported++;
          }
          console.log(`Imported ${imported} simulation and typecheck receipts.`);
          JS
      - name: Run the normal full product task set and capture its outcomes
        env:
          ARM: ${{ matrix.arm }}
          REPEAT: ${{ matrix.replicate }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/measurement"
          cd "$GITHUB_WORKSPACE"
          nproc > "$RUNNER_TEMP/measurement/cpus.txt"
          lscpu > "$RUNNER_TEMP/measurement/lscpu.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/measurement/source.txt"
          find "$RUNNER_TEMP/simulation-receipts" -type f -printf '%f %s\n' | sort | sha256sum > "$RUNNER_TEMP/measurement/seed.txt"
          find .turbo/cache -maxdepth 1 -name '*.tar.zst' -printf '%f\n' | sort > "$RUNNER_TEMP/measurement/starting-turbo.txt"
          args=(build typecheck test test:browser check '//#lint:js' '//#lint:css' '//#analyze' '//#selftest:docs' '//#selftest:examples' --continue=dependencies-successful --summarize --log-order=stream)
          if [[ "$ARM" == four ]]; then args+=(--concurrency=4); fi
          set +e
          /usr/bin/time -f '{"wall":%e,"user":%U,"system":%S,"rssKiB":%M,"status":%x}' -o "$RUNNER_TEMP/measurement/time.txt" node vibestack/spec.ts tasks "${args[@]}" > "$RUNNER_TEMP/product.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$RUNNER_TEMP/measurement/exit.txt"
          tail -12 "$RUNNER_TEMP/product.log"
          python3 - <<'PYDATA'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']);out=p/'measurement';docs=[]
          for f in Path('.turbo/runs').glob('*.json'):
           r=json.loads(f.read_bytes()); ts=r.get('tasks',[])
           if len(ts)>100:docs.append((len(ts),f,r))
          assert docs, 'missing complete Turbo run summary'
          _,file,r=max(docs,key=lambda x:x[0]); tasks=r['tasks']; serial=[{k:t.get(k) for k in ('taskId','hash','cache','execution')} for t in tasks]
          text=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',(p/'product.log').read_text(errors='replace'));lines=text.splitlines()
          summary={ 'arm':os.environ['ARM'],'replicate':os.environ['REPEAT'],'summary':file.name,'execution':r['execution'],'tasks':serial,'verdictLines':[l for l in lines if 'Tasks:    ' in l or 'Failed:    ' in l or 'Test timed out in' in l or 'Failed to start' in l], 'studio':[l for l in lines if l.startswith('vibestack-studio:test:') and any(t in l for t in ('Test Files','Duration','Tests  ','  × ','test/studio.test.vibe (7'))]}
          (out/'result.json').write_text(json.dumps(summary,indent=2));assert any(t['taskId']=='vibestack-studio#test' for t in tasks)
          print(summary['verdictLines'][-3:]);print(summary['studio'][-3:]);print((out/'time.txt').read_text())
          PYDATA
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: product-${{ matrix.arm }}-${{ matrix.replicate }}
          path: ${{ runner.temp }}/measurement
          retention-days: 5
          if-no-files-found: error
