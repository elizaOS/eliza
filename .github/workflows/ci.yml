name: Smithers Linux drain diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: '1.3.14'
          node-version: '24.15.0'
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: 'false'
          skip-avatar-clone: 'true'
          no-vision-deps: 'true'
      - name: Observe original runtime with strengthened real subprocess regression
        shell: bash
        run: |
          set -euo pipefail
          red_status=0
          bun test --isolate plugins/plugin-workflow/__tests__/unit/smithers-worker-lifecycle.test.ts -t 'preserves a terminal result|terminates a worker|oversized inherited stdout' > "$RUNNER_TEMP/smithers-red.log" 2>&1 || red_status=$?
          cat "$RUNNER_TEMP/smithers-red.log"
          echo "ORIGINAL_RUNTIME_EXIT=$red_status"
      - name: Apply reviewed runtime candidate
        shell: python
        run: |
          import base64, pathlib
          pathlib.Path('plugins/plugin-workflow/src/services/smithers-runtime.ts').write_bytes(base64.b64decode(''))
      - name: Validate repaired workflow package
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd plugins/plugin-workflow test
          bun run --cwd plugins/plugin-workflow typecheck
          bun run --cwd plugins/plugin-workflow lint:check
