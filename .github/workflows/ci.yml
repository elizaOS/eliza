name: Calendar CAS source-health supplement
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: calendar-cas-supplement-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  source-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      BUN_VERSION: 1.3.14
      NODE_VERSION: 24.15.0
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      RUN_TURBO_CONCURRENCY: "1"
      GOMAXPROCS: "1"
      PRODUCT_SHA: ce19b58081a247c1e522537ba09f4c613aeb7927
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ce19b58081a247c1e522537ba09f4c613aeb7927
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Bind product and workflow revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          export EVIDENCE_DIR="$RUNNER_TEMP/calendar-source-health"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          git status --porcelain > "$EVIDENCE_DIR/status-before.txt"
          test ! -s "$EVIDENCE_DIR/status-before.txt"
          git ls-files -s > "$EVIDENCE_DIR/product-index.txt"
          printf '%s\n' "$PRODUCT_SHA" > "$EVIDENCE_DIR/product-sha.txt"
          printf '%s\n' "$WORKFLOW_SHA" > "$EVIDENCE_DIR/workflow-sha.txt"
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: 1.3.14
          node-version: 24.15.0
          install-command: bun install --frozen-lockfile
          setup-fused-inference: "false"
          install-native-deps: "false"
          setup-python: "true"
          install-protoc: "true"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          publish-caches: "false"
          publish-bun-install-cache: "false"
      - name: Build existing core dependency contract
        shell: bash
        run: |
          set -euo pipefail
          bun run build:core 2>&1 | tee "$EVIDENCE_DIR/dependency-build.log"
      - name: Run exact noncredential PGlite supplement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, subprocess, hashlib, pathlib, shutil, time
          root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['EVIDENCE_DIR'])
          node=shutil.which('node'); bun=shutil.which('bun')
          assert subprocess.check_output([node,'--version'],text=True).strip()=='v24.15.0'
          assert subprocess.check_output([bun,'--version'],text=True).strip()=='1.3.14'
          files=['bun.lock','plugins/plugin-calendar/package.json','plugins/plugin-calendar/vitest.config.ts','plugins/plugin-calendar/test/calendar-source-health.real.test.ts','plugins/plugin-calendar/src/service/linked-calendar-sync.ts','node_modules/vitest/package.json','node_modules/@electric-sql/pglite/package.json']
          def inventory():
              return {f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files}
          before=inventory()
          env={k:os.environ[k] for k in ['HOME','PATH','LANG','TMPDIR'] if k in os.environ}
          env.update(CI='true',NODE_ENV='test',TZ='UTC',GOMAXPROCS='1',VITEST_LANE='post-merge',ELIZA_LIVE_TEST='0',ELIZA_RUN_LIVE_TESTS='0',RUN_LIVE_TESTS='0',LIVE_TESTS_ENABLED='0',GOOGLE_CALENDAR_LIVE_TEST='0')
          command=['/usr/bin/nice','-n','15',node,str(root/'node_modules/vitest/vitest.mjs'),'run','--config','vitest.config.ts','test/calendar-source-health.real.test.ts','--maxWorkers=1','--no-file-parallelism','--retry=0','--reporter=default','--reporter=json','--outputFile='+str(out/'results.json')]
          started=time.time()
          with (out/'run.log').open('w') as log:
              result=subprocess.run(command,cwd=root/'plugins/plugin-calendar',env=env,stdout=log,stderr=subprocess.STDOUT)
          after=inventory()
          receipt={'workflowSha':os.environ['WORKFLOW_SHA'],'productSha':os.environ['PRODUCT_SHA'],'command':command,'environment':env,'before':before,'after':after,'sourceUnchanged':before==after,'exit':result.returncode,'seconds':time.time()-started,'logSha256':hashlib.sha256((out/'run.log').read_bytes()).hexdigest()}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print((out/'run.log').read_text())
          assert before==after
          assert result.returncode==0
          report=json.loads((out/'results.json').read_text())
          assert report['numPassedTests']==12 and report['numFailedTests']==0 and report['numPendingTests']==0
          PY
      - name: Verify product checkout remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          git status --porcelain > "$EVIDENCE_DIR/status-after.txt"
          test ! -s "$EVIDENCE_DIR/status-after.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: calendar-source-health-ce19-${{ github.run_id }}
          path: ${{ runner.temp }}/calendar-source-health/
          if-no-files-found: error
          retention-days: 14
