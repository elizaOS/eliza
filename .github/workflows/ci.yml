name: Terminal frame Linux diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect sparse video pixels with runner FFmpeg
        shell: python
        run: |
          import subprocess, json, pathlib
          p=pathlib.Path('/tmp/keyframe-diagnostic'); p.mkdir()
          def run(args):
           return subprocess.run(args,check=True,capture_output=True).stdout
          print(run(['ffmpeg','-version']).decode().splitlines()[0])
          video=str(p/'sparse.mp4')
          run(['ffmpeg','-hide_banner','-loglevel','error','-f','lavfi','-i','color=c=red:s=64x64:r=10:d=0.1','-f','lavfi','-i','color=c=lime:s=64x64:r=10:d=0.1','-filter_complex','[0:v][1:v]concat=n=2:v=1,setpts=N*5/TB[v]','-map','[v]','-fps_mode','vfr','-pix_fmt','yuv420p',video])
          print(run(['ffprobe','-v','error','-show_frames','-select_streams','v','-show_entries','frame=pts_time,pkt_duration_time','-of','json',video]).decode())
          def pixels(args):
           raw=run(['ffmpeg','-hide_banner','-loglevel','error',*args,'-fps_mode','passthrough','-f','rawvideo','-pix_fmt','rgb24','pipe:1'])
           return [list(raw[i:i+3]) for i in range(0,len(raw),64*64*3)]
          print('source_pixels',pixels(['-i',video]))
          for seek in [True,False]:
           target=str(p/('seek.png' if seek else 'full.png'))
           run(['ffmpeg','-hide_banner','-loglevel','error',*(['-sseof','-1'] if seek else []),'-i',video,'-fps_mode','passthrough','-update','1',target])
           print('seek' if seek else 'full',pixels(['-i',target]) if pathlib.Path(target).exists() else 'missing')
