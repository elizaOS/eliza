# Temporary qualification harness; never merge this branch into develop.
# Product source is pinned independently of this workflow-only commit.
name: Script Windows Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      RUN_TURBO_CONCURRENCY: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long checkout paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 48f92a10c959d332fc3c82b0dc6bc8eecece5796
          persist-credentials: false
          submodules: false
      - name: Verify product revision
        run: |
          if ((git rev-parse HEAD) -ne '48f92a10c959d332fc3c82b0dc6bc8eecece5796') { throw 'Wrong source revision' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Verify ancestor traversal contracts on Windows
        run: pwsh -NoProfile -NonInteractive -File packages/app-core/platforms/electrobun/scripts/test-windows-smoke-ancestors.ps1
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Exercise avatar preparation layout and failure contracts
        run: node --test packages/scripts/__tests__/avatar-preparation.test.mjs
      - name: Build Windows desktop with canonical command
        run: node packages/app-core/scripts/desktop-build.mjs build --env=canary
      - name: Exercise real Windows secure identity contracts
        run: node packages/scripts/run-vitest.mjs run --config packages/agent/vitest.config.ts packages/agent/src/runtime/runtime-installation-id.windows.test.ts
      - name: Exercise canonical API and renderer development entry
        env:
          ELIZA_UI_PORT: '22138'
          ELIZA_API_PORT: '22137'
          ELIZA_STATE_DIR: ${{ runner.temp }}\script-dev-state
          PGLITE_DATA_DIR: ${{ runner.temp }}\script-dev-pglite
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'script-dev.stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'script-dev.stderr.log'
          $child = Start-Process bun -ArgumentList @('--no-install', '--conditions=eliza-source', 'packages/app-core/scripts/dev-ui.mjs', '--cloud-target=offline') -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $deadline = (Get-Date).AddMinutes(10)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              $child.Refresh()
              if ($child.HasExited) { throw "Development process exited: $($child.ExitCode)" }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:22138/' -TimeoutSec 5
                if ($response.StatusCode -eq 200 -and $response.Content -match '/@vite/client') {
                  $health = Invoke-RestMethod 'http://127.0.0.1:22137/api/health' -TimeoutSec 5
                  if ($health.ready -eq $true) { $ready = $true; break }
                }
              } catch { Write-Host 'Waiting for development API and renderer' }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'Development API and renderer never became ready' }
            Write-Host 'Canonical Windows development entry served real Vite HTML and ready API health'
          } finally {
            taskkill /PID $child.Id /T /F
            Get-Content $out
            Get-Content $err
          }
      - name: Install pinned browser
        run: bunx playwright install chromium
      - name: Exercise packaged Windows launch and health
        timeout-minutes: 20
        env:
          ELIZA_DISABLE_LOCAL_EMBEDDINGS: '1'
          ELIZA_TEST_WINDOWS_INSTALL_DIR: ${{ runner.temp }}\el
          ELIZA_TEST_WINDOWS_LAUNCHER_DIR: ${{ runner.temp }}\eliza-script-launcher
          ELIZA_TEST_WINDOWS_LAUNCHER_PATH_FILE: ${{ runner.temp }}\eliza-script-launcher.txt
        run: |
          Get-Command node, bun, pwsh | Select-Object Name, Source | Format-Table
          node --version
          bun --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          $out = Join-Path $env:RUNNER_TEMP 'script-packaged.stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'script-packaged.stderr.log'
          $processLog = Join-Path $env:RUNNER_TEMP 'script-packaged.processes.jsonl'
          $child = Start-Process bun -ArgumentList @('run', '--cwd', 'packages/app', 'test:desktop:packaged:windows') -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $deadline = (Get-Date).AddMinutes(15)
          try {
            do {
              $child.Refresh()
              $all = @(Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name)
              $owned = [System.Collections.Generic.HashSet[int]]::new()
              [void]$owned.Add($child.Id)
              do {
                $added = $false
                foreach ($process in $all) {
                  if ($owned.Contains([int]$process.ParentProcessId) -and $owned.Add([int]$process.ProcessId)) { $added = $true }
                }
              } while ($added)
              $snapshot = @{ at = (Get-Date).ToUniversalTime().ToString('o'); rootPid = $child.Id; hasExited = $child.HasExited; processes = @($all | Where-Object { $owned.Contains([int]$_.ProcessId) }) } | ConvertTo-Json -Depth 4 -Compress
              Add-Content $processLog $snapshot
              Write-Host $snapshot
              if (Test-Path $out) { Get-Content $out -Tail 30 }
              if (Test-Path $err) { Get-Content $err -Tail 10 }
              if ($child.HasExited) { break }
              Start-Sleep -Seconds 15
            } while ((Get-Date) -lt $deadline)
            $child.Refresh()
            if (-not $child.HasExited) { throw 'Packaged diagnostic observation expired; qualification failed' }
            if ($child.ExitCode -ne 0) { throw "Packaged smoke exited $($child.ExitCode)" }
          } finally {
            $child.Refresh()
            if (-not $child.HasExited) { taskkill /PID $child.Id /T /F }
            Get-Content $out
            Get-Content $err
          }
      - name: Save diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: script-windows-ancestor-48f92a1
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
            ${{ runner.temp }}/script-dev.*.log
            ${{ runner.temp }}/script-packaged.*.log
            ${{ runner.temp }}/script-packaged.processes.jsonl
            ${{ runner.temp }}/eliza-windows-smoke-*.state.json
            ${{ runner.temp }}/eliza-windows-smoke-*.events.jsonl
          if-no-files-found: ignore
      - name: Preserve generated Windows installer for repeatable diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installer-48f92a1
          path: packages/app-core/platforms/electrobun/build/canary-win-x64/*Setup*.zip
          compression-level: 0
          if-no-files-found: warn
