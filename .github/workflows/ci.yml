name: Capture the OS package test and JVM preparation entrypoints
on:
  push:
    branches: [codex/measure-os-updater-entrypoints-1123]
permissions:
  contents: read
jobs:
  compare-package-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: verify
          verification: 'false'
          cache-verification: 'false'
      - name: Capture standard package verification and native preparation independently
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess,time
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'entrypoints';p.mkdir()
          status={}
          def capture(name,args):
           with (p/(name+'.log')).open('w') as log:
            t=time.monotonic();result=subprocess.run(args,stdout=log,stderr=subprocess.STDOUT)
           status[name]={'command':args,'exit':result.returncode,'elapsedSeconds':time.monotonic()-t}
           (p/'status.json').write_text(json.dumps(status,indent=2));print(name,status[name],flush=True)
          capture('dependency-build',['pnpm','exec','turbo','run','build','--filter=@elizaos/agent','--continue=dependencies-successful'])
          capture('package-vitest',['pnpm','--filter','@elizaos/os','run','test','--reporter=json','--outputFile='+str(p/'vitest.json')])
          capture('jvm-prepare',['pnpm','--filter','@elizaos/os','run','jvm:prepare'])
          log=(p/'jvm-prepare.log').read_text()
          status['prepareFailures']=sorted(set(re.findall(r'javac could not compile ([^:\s]+):',log)))
          q=p/'vitest.json'
          if q.exists():
           results=json.loads(q.read_text());status['vitestSummary']={k:results.get(k) for k in ['numTotalTests','numPassedTests','numFailedTests','numPendingTests','numTotalTestSuites','numFailedTestSuites']}
           status['failedSuites']=[r['name'] for r in results['testResults'] if r['status']=='failed']
           status['updaterImageJourneys']=[{'title':c['title'],'status':c['status']} for r in results['testResults'] if r['name'].endswith('/image-product.test.vibe') for c in r['assertionResults']]
          (p/'status.json').write_text(json.dumps(status,indent=2));print(json.dumps(status,indent=2),flush=True)
          assert q.exists() and len(status['prepareFailures'])==3
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-os-entrypoints
          path: ${{ runner.temp }}/entrypoints
          if-no-files-found: error
          retention-days: 5
