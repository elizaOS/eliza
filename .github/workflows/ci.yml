name: Billing 55eef PostgreSQL and root verification supplement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: billing-55eef-supplement
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CI: "true"
      GOMAXPROCS: "1"
      RUN_TURBO_CONCURRENCY: "1"
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 55eef1a4b7d51ecf982307236a9d2a5f3b6298bb
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.15.0"
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Start owned PostgreSQL16 on loopback
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/billing-55eef-supplement"
          mkdir -p "$evidence"
          container="billing-55eef-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$container" > "$evidence/container-name.txt"
          docker run --detach --name "$container" \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:5432:5432 postgres:16-alpine
          docker inspect --format '{{.Image}}' "$container" > "$evidence/postgres-image.txt"
          ready=false
          for attempt in $(seq 1 60); do
            echo "PostgreSQL readiness attempt $attempt"
            if docker exec "$container" pg_isready -h 127.0.0.1 -U postgres; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec "$container" psql -U postgres -Atc 'SELECT version()' > "$evidence/postgres-version.txt"
      - name: Serial exact-source qualification
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """Run exact-source hosted qualification with an explicit child environment."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          HEAD = '55eef1a4b7d51ecf982307236a9d2a5f3b6298bb'
          ROOT = Path.cwd()
          OUT = Path(os.environ['RUNNER_TEMP']) / 'billing-55eef-supplement'
          OUT.mkdir(exist_ok=True)
          keys = ['PATH', 'HOME', 'TMPDIR', 'USER', 'LANG', 'LC_ALL', 'RUNNER_TEMP',
                  'GITHUB_ACTIONS', 'GITHUB_WORKSPACE', 'GITHUB_SHA', 'GITHUB_REF',
                  'GITHUB_EVENT_NAME', 'GITHUB_EVENT_PATH', 'GITHUB_REPOSITORY',
                  'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH']
          env = {key: os.environ[key] for key in keys if key in os.environ}
          env.update(CI='true', NODE_ENV='test', ELIZA_SKIP_FUSED_INFERENCE_SETUP='1',
                     GOMAXPROCS='1', RUN_TURBO_CONCURRENCY='1', FORCE_COLOR='0',
                     NODE_OPTIONS='--max-old-space-size=4096',
                     SUBSCRIPTION_AUTHORITY_POSTGRES_URL='postgresql://postgres@127.0.0.1:5432/postgres')
          # GITHUB_SHA describes the helper workflow. The actual product identity is HEAD
          # and is independently asserted below; it is never relabeled as the helper SHA.
          results = []

          def run(name, command, expected=None):
              started = time.time()
              with (OUT / f'{name}.log').open('w') as log:
                  process = subprocess.Popen(command, cwd=ROOT, env=env, stdout=subprocess.PIPE,
                                             stderr=subprocess.STDOUT, text=True)
                  for line in process.stdout:
                      log.write(line)
                      log.flush()
                      sys.stdout.write(line)
                  code = process.wait()
              raw = (OUT / f'{name}.log').read_bytes()
              row = {'name': name, 'command': command, 'processExitCode': code,
                     'durationSeconds': time.time() - started,
                     'logSha256': hashlib.sha256(raw).hexdigest()}
              if expected and code == 0:
                  clean = re.sub(r'\x1b\[[0-9;]*m', '', raw.decode())
                  row['expectedCountsPresent'] = all(re.search(pattern, clean) for pattern in expected)
                  if not row['expectedCountsPresent']:
                      code = 1
                      row['acceptanceFailure'] = 'Expected executed test counts absent; inspect raw output'
              row['acceptanceExitCode'] = code
              results.append(row)
              (OUT / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
              if code:
                  raise SystemExit(code)

          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == HEAD, (actual, HEAD)
          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          assert status == '', status
          manifest = json.loads((ROOT / 'package.json').read_text())
          assert subprocess.check_output(['bun', '--version'], text=True).strip() == '1.3.14'
          assert subprocess.check_output(['node', '--version'], text=True).strip() == 'v24.15.0'
          paths = ['package.json', 'bun.lock', 'packages/scripts/run-turbo.mjs',
                   'packages/cloud/shared/scripts/run-bun-tests.mjs',
                   'packages/cloud/shared/scripts/run-bun-tests-helpers.mjs',
                   'packages/cloud/shared/src/db/repositories/subscription-paid-renewal-recovery.postgres.integration.test.ts',
                   'packages/cloud/shared/src/db/repositories/test-support/subscription-paid-renewal-recovery-test-fixture.ts']
          binding = {'productHead': actual, 'workflowHead': os.environ.get('GITHUB_SHA'),
                     'runId': os.environ.get('GITHUB_RUN_ID'), 'environmentKeys': sorted(env),
                     'sourceHashes': {p: hashlib.sha256((ROOT / p).read_bytes()).hexdigest() for p in paths},
                     'limits': ['Native fused inference intentionally opted out.',
                                'PostgreSQL and Stripe SDK loopback fixtures only, no live provider proof.',
                                'Dependencies may download; no egress firewall claim.']}
          (OUT / 'source-binding.json').write_text(json.dumps(binding, indent=2) + '\n')
          run('normal-install', ['bun', 'install', '--frozen-lockfile', '--no-save'])
          run('lockfile-unchanged', ['git', 'diff', '--exit-code', '--', 'bun.lock'])
          run('build-core', ['bun', 'run', 'build:core'])
          run('postgres-renewal-23', ['bun', 'run', '--cwd', 'packages/cloud/shared', 'test',
              'src/db/repositories/subscription-paid-renewal-recovery.postgres.integration.test.ts',
              '--max-concurrency=1'], [r'\b23 pass\b', r'\b0 fail\b'])
          run('root-verify', ['bun', 'run', 'verify'])
          run('final-source-clean', ['git', 'diff', '--exit-code'])
          final_status = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          (OUT / 'final-status.txt').write_text(final_status)
          assert final_status == '', final_status
          assert all(hashlib.sha256((ROOT / p).read_bytes()).hexdigest() == h
                     for p, h in binding['sourceHashes'].items())
          PYTHON
      - name: Preserve database cleanup and logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/billing-55eef-supplement"
          mkdir -p "$evidence"
          container="billing-55eef-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker inspect "$container" >/dev/null 2>&1; then
            docker logs "$container" > "$evidence/postgres.log" 2>&1
            schema_status=0
            docker exec "$container" psql -U postgres -Atc \
              "SELECT schema_name FROM information_schema.schemata WHERE schema_name LIKE 'renewal_recovery_%'" \
              > "$evidence/remaining-test-schemas.txt" || schema_status=$?
            docker stop "$container" > "$evidence/postgres-stop.txt"
            docker rm "$container" > "$evidence/postgres-remove.txt"
            test "$schema_status" -eq 0
            test ! -s "$evidence/remaining-test-schemas.txt"
          fi
      - name: Upload complete supplement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: billing-55eef-supplement-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/billing-55eef-supplement/
          if-no-files-found: error
          retention-days: 14
