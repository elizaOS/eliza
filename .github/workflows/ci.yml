# Temporary qualification harness; never merge this branch into develop.
# Product source is pinned independently of this workflow-only commit.
name: Script Windows Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable long checkout paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e06d1469d7bfc02727bb55e69ed8de0d3a91dd91
          persist-credentials: false
          submodules: false
      - name: Verify product revision
        run: |
          if ((git rev-parse HEAD) -ne 'e06d1469d7bfc02727bb55e69ed8de0d3a91dd91') { throw 'Wrong source revision' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install workspace
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply repository installation patches
        run: bun run postinstall
      - name: Build Windows desktop with canonical command
        run: node packages/app-core/scripts/desktop-build.mjs build
      - name: Exercise canonical development renderer entry
        env:
          ELIZA_UI_PORT: '22138'
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'script-dev.stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'script-dev.stderr.log'
          $child = Start-Process bun -ArgumentList @('packages/app-core/scripts/dev-ui.mjs', '--ui-only') -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $deadline = (Get-Date).AddMinutes(4)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              $child.Refresh()
              if ($child.HasExited) { throw "Development process exited: $($child.ExitCode)" }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:22138/' -TimeoutSec 5
                if ($response.StatusCode -eq 200 -and $response.Content -match '/@vite/client') { $ready = $true; break }
              } catch { Write-Host 'Waiting for development renderer' }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'Development renderer never served Vite HTML' }
            Write-Host 'Canonical Windows development entry served real Vite HTML'
          } finally {
            taskkill /PID $child.Id /T /F
            Get-Content $out
            Get-Content $err
          }
      - name: Install pinned browser
        run: bunx playwright install chromium
      - name: Exercise packaged Windows launch and health
        env:
          ELIZA_DISABLE_LOCAL_EMBEDDINGS: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELIZA_TEST_WINDOWS_INSTALL_DIR: ${{ runner.temp }}\el
          ELIZA_TEST_WINDOWS_LAUNCHER_DIR: ${{ runner.temp }}\eliza-script-launcher
          ELIZA_TEST_WINDOWS_LAUNCHER_PATH_FILE: ${{ runner.temp }}\eliza-script-launcher.txt
        run: bun run --cwd packages/app test:desktop:packaged:windows
      - name: Save diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: script-windows-e06d
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
            ${{ runner.temp }}/script-dev.*.log
          if-no-files-found: ignore
