# Temporary diagnostic harness; never merge into develop.
name: Script Windows Startup Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0a8df75ae4a7f6fa615420ea3dff17f94b5bba8c
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Instrument ancestor discovery only
        run: |
          $script = 'packages/app-core/platforms/electrobun/scripts/smoke-test-windows.ps1'
          $source = Get-Content -Raw $script
          $source = $source.Replace('$ErrorActionPreference = "Stop"', '$ErrorActionPreference = "Stop"' + "`nWrite-Host 'DIAGNOSTIC script entered'`n")
          $source = $source.Replace('while ($currentPid -gt 0) {', 'while ($currentPid -gt 0) {' + "`n" + '    Write-Host "DIAGNOSTIC ancestor query pid=$currentPid"')
          $source = $source.Replace('if (-not $proc -or', 'Write-Host "DIAGNOSTIC ancestor result pid=$($proc.ProcessId) parent=$($proc.ParentProcessId)"' + "`n    if (-not `$proc -or")
          $source = $source.Replace('Write-Host "Artifacts dir: $resolvedArtifactsDir"', 'throw "DIAGNOSTIC completed pre-launch discovery; no packaged app supplied"')
          Set-Content -Path $script -Value $source
          New-Item -ItemType Directory -Force packages/app-core/platforms/electrobun/artifacts, packages/app-core/platforms/electrobun/build | Out-Null
          git diff --stat
      - name: Exercise canonical parent chain with bounded diagnostic observation
        timeout-minutes: 2
        run: bun run --cwd packages/app test:desktop:packaged:windows
