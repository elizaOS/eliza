name: CI
on:
  workflow_call: null
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
env:
  CI: "true"
  BUN_VERSION: 1.4.2
  NODE_VERSION: 24.15.0
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "true"
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
      - name: Validate Windows command coverage contract
        run: node packages/scripts/ci-windows-command-coverage-contract.mjs
      - name: Build core contract
        run: bun run build:core
      - name: Repository verification
        env:
          RUN_TURBO_CONCURRENCY: "2"
        run: bun run verify
      - name: Formatting
        run: bun run format:check
      - name: Check maintained Markdown link targets
        run: node packages/scripts/check-markdown-links.mjs
      - name: Prompt secret scan
        run: node packages/scripts/check-prompt-secrets.mjs
      - name: Validate CI Bun version pin contract
        run: node packages/scripts/ci-bun-version-contract.mjs --inventory "$RUNNER_TEMP/bun-runtime-inventory.json"
      - name: Upload Bun runtime resolution inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-runtime-inventory
          path: ${{ runner.temp }}/bun-runtime-inventory.json
          retention-days: 7
    needs: preflight
  tests:
    name: Tests (scripts)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
      - name: Build core contract for script tests
        run: bun run build:core
      - name: Script contract tests
        env:
          E2E_COVERAGE_GATE_ENFORCE: "1"
        run: bun run test:scripts
      - name: Upload script-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: script-tests-linux
          path: reports/script-tests/
          if-no-files-found: error
          retention-days: 7
  tests_server:
    name: Tests (server, ${{ matrix.partition }})
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: agent
            filter: ^@elizaos/agent \(packages/agent\)#test$
          - partition: remaining
            filter: ^(?!@elizaos/agent \(packages/agent\)#test$)
    env:
      TEST_PACKAGE_FILTER: ${{ matrix.filter }}
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
      - name: Server tests
        run: bun run test:server
  tests_client:
    name: Tests (client)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
      - name: Install browser for client integration tests
        run: bunx playwright install --with-deps chromium
      - name: Client tests
        # The plugin matrix owns the same personal-assistant test command.
        run: bun run test:client --filter='^(?!@elizaos/plugin-personal-assistant )'
  tests_plugins:
    name: Plugin Tests (${{ matrix.shard }}/4)
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      TEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          publish-caches: ${{ matrix.shard == 1 }}
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          setup-python: "true"
          install-protoc: "true"
      - name: Build view bundles
        run: bun run build:views
      - name: Initialize pinned native sources for provenance tests
        run: git submodule update --init --depth 1 plugins/plugin-local-inference/native/llama.cpp
      - name: Run plugin tests
        timeout-minutes: 85
        run: bun run test:plugins
  required:
    name: All Tests Passed
    if: ${{ always() && !cancelled() }}
    needs:
      - quality
      - tests
      - tests_server
      - tests_client
      - tests_plugins
      - preflight
      - remote-capabilities
      - desktop-contract
      - zero-key-scenario-runner
      - zero-key-model-provider-e2e
      - scenario-unit-coverage
      - app-accounts-ui
      - app-workflow-runtime
      - frontend-build
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: |-
            quality=${{ needs.quality.result }}
            tests=${{ needs.tests.result }}
            tests_server=${{ needs.tests_server.result }}
            tests_client=${{ needs.tests_client.result }}
            tests_plugins=${{ needs.tests_plugins.result }}
            preflight=${{ needs.preflight.result }}
            remote-capabilities=${{ needs.remote-capabilities.result }}
            desktop-contract=${{ needs.desktop-contract.result }}
            zero-key-scenario-runner=${{ needs.zero-key-scenario-runner.result }}
            zero-key-model-provider-e2e=${{ needs.zero-key-model-provider-e2e.result }}
            scenario-unit-coverage=${{ needs.scenario-unit-coverage.result }}
            app-accounts-ui=${{ needs.app-accounts-ui.result }}
            app-workflow-runtime=${{ needs.app-workflow-runtime.result }}
            frontend-build=${{ needs.frontend-build.result }}
        run: |
          set -euo pipefail
          if [ -z "$RESULTS" ]; then echo "::error::Missing required job results"; exit 1; fi
          for pair in $RESULTS; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "::error title=CI aggregate::$name finished with $result"
              exit 1
            fi
          done
  preflight:
    name: Validate source before fan-out
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: false
      - name: Reject unresolved merge-conflict markers
        run: |
          set -euo pipefail
          status=0
          git grep -n -E '^(<{7}|>{7})( |$)' -- . || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Unresolved git merge-conflict marker(s) in the tracked files listed above. Finish or abort the merge before landing."
            exit 1
          elif [ "$status" -gt 1 ]; then
            echo "::error::merge-conflict marker scan failed (git grep exit $status)"
            exit 1
          fi
          echo "No unresolved merge-conflict markers in tracked files."
      - name: Check source whitespace
        run: git show --format= --check HEAD
  remote-capabilities:
    name: Remote capability integration contracts
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 60
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build view bundles
        run: bun run build:views
      - name: Remote capability plugin surface audit
        run: bun packages/agent/scripts/audit-capability-router-plugin-surface.ts
      - name: Run synthetic-world transaction tests
        run: bun run --cwd packages/testing test:synthetic-world
  desktop-contract:
    name: Electrobun Desktop Contract
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          setup-fused-inference: "true"
          setup-python: "true"
          install-protoc: "true"
      - name: Build workspace packages for Vitest resolution
        run: bun run build:core
      - name: Run Electrobun contract tests
        working-directory: packages/app/platforms/electrobun
        run: bun run test
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
  zero-key-scenario-runner:
    name: Zero-Key scenario runner
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 30
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      TEST_LANE: pr
      ELIZA_LIVE_TEST: "0"
      SCENARIO_USE_DETERMINISTIC_MODEL: "1"
      CEREBRAS_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      XAI_API_KEY: ""
      NVIDIA_API_KEY: ""
      ELIZAOS_CLOUD_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build workspace packages for scenario resolution
        run: bunx turbo run build --filter=@elizaos/testing...
      - name: Zero-cost scenario e2e
        run: bun run --cwd packages/testing test:pr:e2e
      - name: Upload deterministic E2E reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-zero-key-e2e-report
          path: |
            reports/scenarios/pr-deterministic/
            reports/scenarios/pr-deterministic-corpus/
            reports/scenarios/pr-deterministic-orchestrator/
            reports/scenarios/pr-deterministic-lifeops/
            reports/scenarios/catalog-inventory/
          if-no-files-found: ignore
          retention-days: 3
      - name: Prune deterministic E2E scratch output
        if: always()
        run: node packages/scripts/rm-path-recursive.mjs reports/scenarios/pr-deterministic reports/scenarios/pr-deterministic-corpus reports/scenarios/pr-deterministic-orchestrator reports/scenarios/pr-deterministic-lifeops reports/scenarios/catalog-inventory packages/app/playwright-report test-results/app
      - name: E2E coverage matrix report
        if: always()
        run: bun --conditions=eliza-source packages/scripts/e2e-coverage/write-coverage-matrix-report.ts --report-dir reports/coverage
  zero-key-model-provider-e2e:
    name: Zero-Key harness E2E
    needs: preflight
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 30
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      TEST_LANE: pr
      ELIZA_LIVE_TEST: "0"
      SCENARIO_USE_DETERMINISTIC_MODEL: "1"
      CEREBRAS_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      XAI_API_KEY: ""
      NVIDIA_API_KEY: ""
      ELIZAOS_CLOUD_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          setup-python: "true"
          install-protoc: "true"
      - name: Per-plugin deterministic model-provider runtime adoption proofs
        run: |
          bun run --cwd plugins/plugin-anthropic test:real-runtime
          bun run --cwd plugins/plugin-discord test:real-runtime
  scenario-unit-coverage:
    name: Local provisioning and chat contracts
    needs: preflight
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build core exports for real API harness
        run: bun run --cwd packages/core build
      - name: Real local agent provisioning (no model, no secret)
        run: bun run --cwd packages/app test:local-provisioning
      - name: Real local chat pipeline (no model key, no llama)
        run: bun run --cwd packages/app test:local-chat
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_OPTIONS: --max-old-space-size=4096
      TEST_LANE: pr
      ELIZA_LIVE_TEST: "0"
      SCENARIO_USE_DETERMINISTIC_MODEL: "1"
      CEREBRAS_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      XAI_API_KEY: ""
      NVIDIA_API_KEY: ""
      ELIZAOS_CLOUD_API_KEY: ""
  app-accounts-ui:
    name: Zero-Key accounts UI e2e (real API + pool + disk)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build core exports for real API harness
        run: bun run --cwd packages/core build
      - name: Install Playwright browsers (Chromium)
        run: packages/scripts/github/install-playwright-browsers.sh chromium
      - name: Accounts UI browser e2e — real AccountList + real accounts routes + real AccountPool
        env:
          ELIZA_VAULT_PASSPHRASE: accounts-ui-e2e-headless-only
        run: bun run --cwd packages/app test:e2e:accounts-ui
      - name: Upload accounts-ui evidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scenario-pr-app-accounts-ui
          path: test-results/evidence/10722-accounts-ui-e2e/
          if-no-files-found: warn
          retention-days: 3
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_OPTIONS: --max-old-space-size=4096
      TEST_LANE: pr
      ELIZA_LIVE_TEST: "0"
      SCENARIO_USE_DETERMINISTIC_MODEL: "1"
      CEREBRAS_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      XAI_API_KEY: ""
      NVIDIA_API_KEY: ""
      ELIZAOS_CLOUD_API_KEY: ""
  app-workflow-runtime:
    name: Browser workflow with real local runtime
    needs: preflight
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Install Playwright browsers
        run: packages/scripts/github/install-playwright-browsers.sh chromium
      - name: Native workflow browser-to-runtime coverage
        run: ELIZA_UI_SMOKE_REAL_LOCAL_STACK=1 ELIZA_UI_SMOKE_WORKFLOW_JOURNEY=1 ELIZA_UI_SMOKE_DISABLE_VIDEO=1 bun run --cwd packages/app test:e2e test/ui-smoke/workflow-real-local.spec.ts --project=chromium
      - name: Upload app browser extended artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scenario-pr-app-browser-extended
          path: |
            packages/app/playwright-report/
            test-results/app/
          if-no-files-found: ignore
          retention-days: 3
    env:
      CI: "true"
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
      NODE_OPTIONS: --max-old-space-size=4096
      TEST_LANE: pr
      ELIZA_LIVE_TEST: "0"
      SCENARIO_USE_DETERMINISTIC_MODEL: "1"
      CEREBRAS_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      XAI_API_KEY: ""
      NVIDIA_API_KEY: ""
      ELIZAOS_CLOUD_API_KEY: ""
  frontend-build:
    name: Consolidated Frontend Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          install-protoc: "false"
          setup-python: "false"
          setup-node: "false"
      - name: Build frontend workspace dependencies
        run: |
          bun run build:core
          bun run --cwd packages/ui build
      - name: Build the only deployable frontend
        working-directory: packages/app
        run: bun run build:web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    env:
      BUN_VERSION: 1.4.2
      NODE_VERSION: 24.15.0
    needs: preflight
