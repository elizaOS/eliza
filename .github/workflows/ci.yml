name: Inventory real property generator coverage on the reconciled release
on:
  push:
    branches: [codex/qualify-eliza-property-inputs-1123]
permissions:
  contents: read
jobs:
  property-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: verify
          verification: 'false'
          cache-verification: 'false'
      - name: Collect every production schema and contract through the normal generator twice
        shell: bash
        run: |
          python3 - <<'PY'
          import collections,hashlib,json,os,pathlib,re,subprocess,time
          root=pathlib.Path.cwd(); destination=pathlib.Path(os.environ["RUNNER_TEMP"])/"eliza-property-inventory.json"
          matches=[s for s in subprocess.check_output(["git","ls-files"],text=True).splitlines() if re.fullmatch(r"(?:apps|packages)/[^/]+/src/.+\.(?:schema|contract)\.(?:ts|vibe)",s)]
          groups=collections.defaultdict(set)
          for source in matches:
              folder,source=source.split("/src/",1);groups[folder].add("src/"+source)
          data={"source":subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip() if pathlib.Path(".git/shallow").exists()==False else "0d743619956147f3296becd7769c1b14ad48a8d3","modules":len(matches),"packages":{}}
          for folder,expected in sorted(groups.items()):
              recent=None;receipts=[]
              for trial in range(2):
                  start=time.monotonic()
                  run=subprocess.run(["node","vibestack/spec.ts","tests",folder],capture_output=True,text=True)
                  print(folder,trial,run.returncode,run.stdout[-1200:],run.stderr[-750:],flush=True)
                  manifest=root/folder/".cache/generated/tests/manifest.json";raw=manifest.read_bytes() if manifest.exists() else None
                  report=json.loads(raw) if raw else {"files":{},"skipped":[]}
                  assert trial==0 or recent==raw
                  recent=raw
                  files=report["files"];skipped=report["skipped"];observed={f["source"] for f in files.values()}|{f["file"] for f in skipped}
                  receipts.append({"exit":run.returncode,"seconds":time.monotonic()-start,"manifestSha256":hashlib.sha256(raw).hexdigest() if raw else None,"stdout":run.stdout[-3000:],"stderr":run.stderr[-3000:],"absentSources":sorted(expected-observed),"unexpectedSources":sorted(observed-expected)})
              data["packages"][folder]={"expected":sorted(expected),"generated":len(files),"checks":sum(f["tests"] for f in files.values()),"skipped":skipped,"trials":receipts}
              destination.write_text(json.dumps(data,indent=2)+"\n")
          assert all(not row["absentSources"] and not row["unexpectedSources"] for p in data["packages"].values() for row in p["trials"])
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eliza-property-inventory
          path: ${{ runner.temp }}/eliza-property-inventory.json
          retention-days: 5
