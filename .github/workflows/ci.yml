name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance-group-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0d3ea5b53b18eb84a57f2c6c2651c46e04d9ace3
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - uses: elizaOS/eliza/.github/actions/setup-benchmark-quint-python@375cf878dc65fba46f8d582a32edc81608ae55a5
        with:
          shard: '2'
      - name: Verify the exact release source and failed conformance
        run: |
          test "$(git rev-parse HEAD)" = "0d3ea5b53b18eb84a57f2c6c2651c46e04d9ace3"
          test -n "$BENCHMARK_TEST_PYTHON"
          node packages/benchmarks/quint/check-acceptance-group-signal.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: exact-release-acceptance-group-conformance
          path: test-results/quint-acceptance-group-signal/
