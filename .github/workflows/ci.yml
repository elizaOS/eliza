name: Final renderer audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPECTED_SOURCE_SHA: '742b4b3f02e1e79a58c80f4b341d2b55225a371d'
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: false
      - name: Verify source equivalence to the final candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_SHA"
          git diff --exit-code HEAD^ HEAD -- . ':(exclude).github/workflows/ci.yml'
          audit_dir="$RUNNER_TEMP/final-app-audit"
          echo "ELIZA_AUDIT_APP_DIR=$audit_dir" >> "$GITHUB_ENV"
          mkdir -p "$audit_dir"
          git rev-parse HEAD HEAD^ > "$RUNNER_TEMP/source-commits.txt"
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: '1.3.14'
          node-version: '24.15.0'
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: 'false'
          install-protoc: 'false'
          setup-python: 'false'
          skip-avatar-clone: 'true'
          no-vision-deps: 'true'
      - name: Install browsers
        run: PLAYWRIGHT_INSTALL_CWD=packages/app .github/scripts/install-playwright-browsers.sh chromium webkit
      - name: Capture affected desktop and mobile states
        working-directory: packages/app
        run: node scripts/run-ui-playwright.mjs --config playwright.ui-smoke.config.ts --project=audit-app --grep '(builtin-(chat|settings|vault|workflow-studio)|plugin-(finances|goals|health)-gui) (desktop-landscape|mobile-portrait)'
      - name: Verify captured pixels with OCR
        working-directory: packages/app
        run: bun scripts/ocr-triage.ts --audit-dir "$ELIZA_AUDIT_APP_DIR"
      - name: Record current control interactions
        working-directory: packages/app
        env:
          E2E_RECORD: '1'
        run: node scripts/run-ui-playwright.mjs --config playwright.ui-smoke.config.ts --project=chromium --grep 'scroll, sheet open/close, and drag hold a smooth frame budget|Goals agent bridge filters the rendered goal list|first trigger saves and refreshes an unsaved workflow'
      - name: Verify builds preserved tracked source
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: final-renderer-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/final-app-audit
            ${{ runner.temp }}/source-commits.txt
            e2e-recordings/app/test-results
