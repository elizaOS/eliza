name: Cloud transport diagnostic (nonmerge probe)
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: cloud-transport-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  PGLITE_WASM_MODE: node
jobs:
  original-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "false"
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
      - name: Build core contract
        run: bun run build:core
      - name: Observe original cloud sequence through Group E once
        env:
          NODE_ENV: test
          CLOUD_E2E: "1"
          MOCK_REDIS: "1"
          ELIZA_KMS_BACKEND: memory
          WRANGLER_SEND_METRICS: "false"
          E2E_ONLY: agent-token-flow.test.ts,fixture-sandbox-state.test.ts,group-a-auth.test.ts,group-b-account-billing.test.ts,group-c-agents.test.ts,group-d-ai-media.test.ts,group-e-agent-admin.test.ts
        run: |
          mkdir -p "$RUNNER_TEMP/transport-observation"
          export TEST_PGLITE_DATA_DIR="$RUNNER_TEMP/transport-pglite"
          export DEV_CLOUD_WRANGLER_PERSIST_TO="$RUNNER_TEMP/transport-wrangler"
          export NODE_OPTIONS="--max-old-space-size=8192 --import=$GITHUB_WORKSPACE/.github/scripts/transport-lifecycle-observer.mjs"
          cd packages/cloud/api
          node test/e2e/run-e2e-batches.mjs --preload "$GITHUB_WORKSPACE/.github/scripts/transport-request-observer.ts" 2>&1 | tee "$RUNNER_TEMP/transport-observation/sequence.log"
      - name: Retain complete diagnostic receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloud-transport-diagnostic
          path: ${{ runner.temp }}/transport-observation
          if-no-files-found: warn
          retention-days: 3
