name: Replay the normal Cloud browser package and Android SDK test activation
on:
  push:
    branches: [codex/measure-cloud-browser-and-os-sdk-1123]
permissions:
  contents: read
jobs:
  package-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: verify
          verification: 'true'
          cache-verification: 'false'
      - name: Build real dependency packages
        run: pnpm exec turbo run build --filter=@elizaos/agent --filter=@elizaos/cloud --continue=dependencies-successful
      - name: Replay unchanged Cloud browser tasks and test SDK visibility through Turbo
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,time,os,re
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'package-controls';out.mkdir();status={}
          def run(name,args):
           with (out/(name+'.log')).open('w') as fp:
            then=time.monotonic();result=subprocess.run(args,stdout=fp,stderr=subprocess.STDOUT)
           txt=re.sub(r'\x1b\[[;0-9]*m','',(out/(name+'.log')).read_text(errors='replace'))
           status[name]={'code':result.returncode,'wall':time.monotonic()-then,'taskHashes':re.findall(r'cache (?:miss, executing|bypass, force executing) ([a-f0-9]{16})',txt),'summaries':[line.strip() for line in txt.splitlines() if re.search(r'(Test Files|\sTests\s+.*passed|Browser failed to connect)',line)]}
           (out/'result.json').write_text(json.dumps(status,indent=2)); print(name,status[name],flush=True)
          for i in range(2):
           run('cloud-'+str(i+1),['pnpm','exec','turbo','run','@elizaos/cloud#test:browser','--only','--force','--summarize'])
          inputs=['test/build-android.test.vibe','test/image.test.vibe']
          config=root/'turbo.json';before=config.read_bytes();tool=['pnpm','exec','turbo','run','@elizaos/os#test','--only','--force','--summarize','--',*inputs,'--reporter=json']
          try:
           run('os-stock',tool+['--outputFile='+str(out/'stock-vitest.json')])
           doc=json.loads(before);doc['tasks']['test']['env']+=['ANDROID_HOME','ANDROID_SDK_ROOT']
           config.write_text(json.dumps(doc,indent=2)+'\n')
           run('os-sdk',tool+['--outputFile='+str(out/'sdk-vitest.json')])
          finally:config.write_bytes(before)
          for label in ('stock','sdk'):
           data=json.loads((out/(label+'-vitest.json')).read_text())
           status[label+'Counts']={k:data[k] for k in ['numPassedTests','numFailedTests','numPendingTests','numTotalTests']}
           status[label+'Titles']=[{'status':t['status'],'title':t['title']} for s in data['testResults'] for t in s['assertionResults']]
          status['envPresent']={v:bool(os.environ.get(v)) for v in ['ANDROID_HOME','ANDROID_SDK_ROOT']}
          (out/'result.json').write_text(json.dumps(status,indent=2));assert all(status[k]['code']==0 for k in ['cloud-1','cloud-2','os-stock','os-sdk'])
          assert status['stockCounts']['numTotalTests']==status['sdkCounts']['numTotalTests']==14
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-controls
          path: ${{ runner.temp }}/package-controls/
          if-no-files-found: error
          retention-days: 5
