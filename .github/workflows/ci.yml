name: Bun cache fallback qualification (nonmerge probe)
on:
  workflow_dispatch:
    inputs:
      fallback_family:
        description: Family selection with canonical CI absent
        required: true
        type: choice
        options: [ui-and-stories, stories-only]
permissions:
  contents: read
concurrency:
  group: cache-fallback-probe-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_canonical: 'false'
      run_ui_core: ${{ steps.selection.outputs.run_ui_core }}
      run_ui_stories: 'true'
    steps:
      - id: selection
        env:
          FAMILY: ${{ inputs.fallback_family }}
        run: |
          case "$FAMILY" in
            ui-and-stories) echo 'run_ui_core=true' >> "$GITHUB_OUTPUT" ;;
            stories-only) echo 'run_ui_core=false' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
  ui-core:
    needs: plan
    if: needs.plan.outputs.run_ui_core == 'true'
    uses: ./.github/workflows/ui-e2e-gate.yml
    with:
      publish_bun_install_cache: ${{ needs.plan.outputs.run_canonical != 'true' }}
      concurrency_scope: fallback-probe-${{ github.run_id }}
  ui-stories:
    needs: plan
    if: needs.plan.outputs.run_ui_stories == 'true'
    uses: ./.github/workflows/ui-story-gate.yml
    with:
      publish_bun_install_cache: ${{ needs.plan.outputs.run_canonical != 'true' && needs.plan.outputs.run_ui_core != 'true' }}
