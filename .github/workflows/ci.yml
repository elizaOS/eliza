name: Measure generation owner resolution on real Eliza output
on:
  push:
    branches: [codex/measure-generation-owner-groups-1123]
permissions:
  contents: read
jobs:
  mirror-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: verify
          verification: 'false'
          cache-verification: 'false'
      - name: Measure normal whole graph and verify scoped regeneration
        run: |
          cat > "$RUNNER_TEMP/mirror.patch" <<'PATCH'
          diff --git a/vibestack/units.ts b/vibestack/units.ts
          index b9a45ec8..56197f97 100644
          --- a/vibestack/units.ts
          +++ b/vibestack/units.ts
          @@ -165,10 +165,13 @@ export function mirrorGen(root: string, specs: Spec[], scope?: { scratch: string
             };
             const from = path.join(output, "gen");
             sweep(from);
          -  for (const dir of scope ? [scope.ownerDir] : codeDirs(root).filter(Boolean)) {
          +  const rootsByOwner = new Map<string, string[]>();
          +  for (const dir of scope ? [scope.ownerDir] : codeDirs(root).filter(Boolean)) rootsByOwner.set(dir, []);
          +  if (rootsByOwner.size) for (const spec of specs) rootsByOwner.get(`${owner(root, spec.file)}/`)?.push(spec.name);
          +  for (const [dir, roots] of rootsByOwner) {
               const needed = new Set<string>();
               const need = (name: string) => { if (!needed.has(name)) { needed.add(name); specs.find((s) => s.name === name)?.imports.forEach(need); } };
          -    for (const spec of specs) if (`${owner(root, spec.file)}/` === dir) need(spec.name);
          +    for (const name of roots) need(name);
               const to = path.join(root, dir, "gen");
               const files = fs.existsSync(from) ? fs.readdirSync(from).filter((f) => needed.has(f.match(/^(\w+)\.(?:ts|conformance\.ts)$/)?.[1] ?? "")) : [];
               if (files.length) {
          PATCH
          python3 -u - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import resource
          import statistics
          import subprocess
          import time

          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'mirror-results'
          out.mkdir(exist_ok=True)
          file = root / 'vibestack/units.ts'
          old = file.read_bytes()
          subprocess.run(['git','apply',str(out.parent/'mirror.patch')],check=True)
          new = file.read_bytes()
          file.write_bytes(old)
          assert old != new
          summary = {'base':'0d743619956147f3296becd7769c1b14ad48a8d3','cpus':os.cpu_count(),'load':os.getloadavg(),'rows':[]}
          def save():
              (out/'results.json').write_text(json.dumps(summary,indent=2)+'\n')
          def outputs():
              files = {}
              for folder in [root/'gen', *root.glob('apps/*/gen'), *root.glob('packages/*/gen')]:
                  for p in folder.rglob('*'):
                      if p.is_file(): files[p.relative_to(root).as_posix()] = [p.stat().st_mode & 0o777,hashlib.sha256(p.read_bytes()).hexdigest()]
              return files
          preload = out.parent/'mirror-read-count.mjs'
          preload.write_text('''import fs from "node:fs";
          import path from "node:path";
          let reads=0;const samples=[];const read=fs.readFileSync;const manifest=path.join(process.cwd(),"package.json");
          fs.readFileSync=function(file,...args){if(file===manifest){reads++;if(reads<=4||[100,500,1000,5000].includes(reads))samples.push([reads,new Error().stack]);}return read.call(this,file,...args)};
          process.on("exit",()=>fs.writeFileSync(process.env.MIRROR_COUNTS,JSON.stringify({reads,samples})));''')
          def run(kind, group, trial, args=None):
              file.write_bytes(old if kind=='before' else new)
              args = args or []
              ctl = group=='counts'
              count_path=out/(kind+'-instrumented.json')
              cmd = ['node',*(['--import',str(preload)] if ctl else []),'vibestack/spec.ts','gen',*args]
              start = time.monotonic()
              prev = resource.getrusage(resource.RUSAGE_CHILDREN)
              proc = subprocess.run(cmd,text=True,capture_output=True,env={**os.environ,'MIRROR_COUNTS':str(count_path)})
              after = resource.getrusage(resource.RUSAGE_CHILDREN)
              row={'side':kind,'group':group,'trial':trial,'wall':time.monotonic()-start,'cpu':after.ru_utime+after.ru_stime-prev.ru_utime-prev.ru_stime,'exit':proc.returncode}
              (out/f'{group}-{trial}-{kind}.log').write_text(proc.stdout+proc.stderr)
              print(row,flush=True)
              summary['rows'].append(row); save()
              assert proc.returncode==0,(proc.stdout[-1200:],proc.stderr[-1200:])
              if ctl:row['reads']=json.loads(count_path.read_bytes())['reads']
              return outputs()
          try:
              expected=run('before','prime',0)
              assert len(expected)>3000, len(expected)
              summary['files']=len(expected);summary['owners']=sorted({p.split('/gen/')[0] for p in expected if '/gen/' in p})
              summary['digest']=hashlib.sha256(json.dumps(expected,sort_keys=True).encode()).hexdigest();save()
              for side in ('before','after'):assert run(side,'counts',0)==expected
              for i in range(5):
                  for side in (('before','after') if i%2==0 else ('after','before')):
                      assert run(side,'ordinary',i)==expected
              for side in ('before','after'):
                  stale=root/'packages/core/gen/obsolete-mirror-test.ts';stale.write_text('stale')
                  control=next(root.glob('packages/core/gen/*.conformance.ts'));control.unlink()
                  assert run(side,'scoped',0,['--owner','core'])==expected
              summary['complete']=True;save()
          finally:
              file.write_bytes(old)
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mirror-owner-comparison
          path: ${{ runner.temp }}/mirror-results
          retention-days: 5
      - name: Build the declared Core prerequisite and collect Agent properties
        if: always()
        run: |
          node vibestack/spec.ts tasks @elizaos/core#build
          node vibestack/spec.ts tests packages/agent
          cp packages/agent/.cache/generated/tests/manifest.json "$RUNNER_TEMP/agent-properties.json"
          jq -e '.skipped == []' "$RUNNER_TEMP/agent-properties.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-properties-after-core-build
          path: ${{ runner.temp }}/agent-properties.json
          if-no-files-found: warn
          retention-days: 5
