name: Exact staging keep-warm verification
on:
  push:
    branches: [codex/verify-staging-pricing-20261102]
permissions:
  contents: read
jobs:
  held-keepwarm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
      CACHE_BACKEND: memory
      CACHE_ENABLED: "true"
      DATABASE_URL: pglite://memory
      TEST_DATABASE_URL: pglite://memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e3baa46412e267eed5f07a4b33c443954096a588
          persist-credentials: false
          submodules: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = e3baa46412e267eed5f07a4b33c443954096a588
      - uses: ./.github/actions/cloud-setup-test-env
      - name: Verify held pricing and paid-proxy contracts in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd packages/cloud/api test voice-pricing-keepwarm.pglite.test.ts
          bun run --cwd packages/cloud/api test agent-pricing-prewarm.pglite.test.ts
          bun run --cwd packages/cloud/api test paid-proxy-gate-warming.test.ts
