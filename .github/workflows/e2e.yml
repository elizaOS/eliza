# Full application paths share one dependency installation and no provider secrets.
name: Full E2E
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact release source when called by a release workflow
        type: string
        required: false
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
  NODE_OPTIONS: --max-old-space-size=8192
  RUN_TURBO_CONCURRENCY: "1"
jobs:
  e2e:
    name: Full E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          node-version: "24.15.0"
          publish-bun-install-cache: "false"
          install-command: bun install --frozen-lockfile --ignore-scripts
          run-postinstall: "false"
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
      - name: Install Chromium
        run: packages/scripts/github/install-playwright-browsers.sh chromium
      - name: Apply dependency compatibility patches
        run: |
          bun packages/scripts/patch-punycode-deprecation.mjs
          bun packages/scripts/patch-llama-cpp-capacitor.mjs
          bun packages/scripts/patch-electrobun-linux-cef-profile.mjs
      - name: Build runtime dependencies
        run: bun run build:core
      - name: Assistant persistence and voice through the perfect-result provider
        run: bun test --conditions eliza-source packages/testing/e2e/perfect-result-runtime.e2e.test.ts
      - name: Browser authentication through the real API and database
        run: bun run --cwd packages/auth test:browser
