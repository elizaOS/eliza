name: Cloud staging mint grant codes

# Staging-only minting of subscription grant codes. Plaintext codes go straight
# from the mint script into an RSA-OAEP/AES-GCM envelope sealed to the
# operator's public key; only that ciphertext is uploaded, with one-day
# retention. Neither logs nor artifacts ever hold a plaintext code. Requires
# migration 0542_subscription_grant_codes on staging. See
# packages/cloud/scripts/README.md.

on:
  workflow_dispatch:
    inputs:
      expected_cloud_commit:
        description: Exact 40-character staging commit to run
        required: true
        type: string
      recipient_public_key:
        description: Base64 SPKI DER RSA (>=3072-bit) public key from recipient-envelope.ts keygen
        required: true
        type: string
      single_use_count:
        description: Number of single-use codes
        required: true
        default: "5"
        type: string
      single_use_label:
        description: Label for the single-use codes
        required: true
        default: alpha-staging-qa
        type: string
      shared_max_redemptions:
        description: Redemptions for the one shared code (0 skips it)
        required: true
        default: "50"
        type: string
      shared_label:
        description: Label for the shared code
        required: true
        default: alpha-staging-shared
        type: string
      family:
        description: Grant family (campaign) the codes belong to
        required: false
        default: alpha_phone
        type: choice
        options:
          - alpha_phone
          - grace_pilot
      plan:
        description: Plan each redemption grants
        required: false
        default: plus_monthly
        type: choice
        options:
          - plus_monthly
          - pro_monthly
      duration_days:
        description: Plan days each redemption grants (1-731; 183 when this and duration_months are empty)
        required: false
        default: ""
        type: string
      duration_months:
        description: UTC calendar months each redemption grants (1-24); leave duration_days empty
        required: false
        default: ""
        type: string
      requires_no_paid_plan:
        description: Refuse redemption while the organization has an open paid plan
        required: false
        default: false
        type: boolean
      expires_at:
        description: Optional last redemption time, YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ (UTC), in the future
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject untrusted source and malformed inputs
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_cloud_commit }}
          CHECKED_OUT_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SINGLE_USE_COUNT: ${{ inputs.single_use_count }}
          SHARED_MAX: ${{ inputs.shared_max_redemptions }}
          FAMILY: ${{ inputs.family }}
          PLAN: ${{ inputs.plan }}
          DURATION_DAYS: ${{ inputs.duration_days }}
          DURATION_MONTHS: ${{ inputs.duration_months }}
          REQUIRES_NO_PAID_PLAN: ${{ inputs.requires_no_paid_plan }}
          EXPIRES_AT: ${{ inputs.expires_at }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" != "refs/heads/staging" ]]; then
            echo "::error::staging grant-code minting requires the trusted staging source"
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_COMMIT" != "$CHECKED_OUT_COMMIT" ]]; then
            echo "::error::staging grant-code minting requires the exact checked-out commit"
            exit 1
          fi
          for value in "$SINGLE_USE_COUNT" "$SHARED_MAX"; do
            [[ "$value" =~ ^[0-9]{1,4}$ ]] || { echo "::error::counts must be small integers"; exit 1; }
          done
          (( SINGLE_USE_COUNT <= 100 && SHARED_MAX <= 1000 )) || { echo "::error::staging batch is capped at 100 single-use codes and 1000 shared redemptions"; exit 1; }
          case "$FAMILY" in
            alpha_phone | grace_pilot) ;;
            *) echo "::error::family must be alpha_phone or grace_pilot"; exit 1 ;;
          esac
          case "$PLAN" in
            plus_monthly | pro_monthly) ;;
            *) echo "::error::plan must be plus_monthly or pro_monthly"; exit 1 ;;
          esac
          if [[ -n "$DURATION_DAYS" && -n "$DURATION_MONTHS" ]]; then
            echo "::error::duration_days and duration_months are mutually exclusive"
            exit 1
          fi
          if [[ -n "$DURATION_DAYS" ]]; then
            [[ "$DURATION_DAYS" =~ ^[0-9]{1,3}$ ]] && (( 10#$DURATION_DAYS >= 1 && 10#$DURATION_DAYS <= 731 )) || { echo "::error::duration_days must be an integer from 1 to 731"; exit 1; }
          fi
          if [[ -n "$DURATION_MONTHS" ]]; then
            [[ "$DURATION_MONTHS" =~ ^[0-9]{1,2}$ ]] && (( 10#$DURATION_MONTHS >= 1 && 10#$DURATION_MONTHS <= 24 )) || { echo "::error::duration_months must be an integer from 1 to 24"; exit 1; }
          fi
          [[ "$REQUIRES_NO_PAID_PLAN" == "true" || "$REQUIRES_NO_PAID_PLAN" == "false" ]] || { echo "::error::requires_no_paid_plan must be true or false"; exit 1; }
          if [[ -n "$EXPIRES_AT" ]]; then
            [[ "$EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)?$ ]] || { echo "::error::expires_at must be YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ"; exit 1; }
            # GNU date normalizes impossible dates (2027-02-30), so require a round trip.
            expires_epoch=$(date -u -d "${EXPIRES_AT/T/ }" +%s 2>/dev/null) || { echo "::error::expires_at is not a real UTC time"; exit 1; }
            if [[ "$EXPIRES_AT" == *T* ]]; then round_trip=$(date -u -d "@$expires_epoch" +%Y-%m-%dT%H:%M:%SZ); else round_trip=$(date -u -d "@$expires_epoch" +%Y-%m-%d); fi
            [[ "$round_trip" == "$EXPIRES_AT" ]] || { echo "::error::expires_at is not a real UTC time"; exit 1; }
            (( expires_epoch > $(date -u +%s) )) || { echo "::error::expires_at must be in the future"; exit 1; }
          fi

  mint:
    needs: admission
    if: needs.admission.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: cloud-staging-mint-grant-codes
      cancel-in-progress: false
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: 1.4.2
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          run-postinstall: "false"

      - name: Build required linked runtime
        run: bun run build:core

      - name: Check the pinned staging database identity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ELIZA_OPERATOR_ENVIRONMENT: staging
        run: bun run packages/cloud/scripts/admin/staging-database-identity-pin.ts

      - name: Mint and seal codes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ELIZA_SUBSCRIPTION_GRANT_CODE_PEPPER: ${{ secrets.ELIZA_SUBSCRIPTION_GRANT_CODE_PEPPER }}
          ELIZA_ENVELOPE_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          SINGLE_USE_COUNT: ${{ inputs.single_use_count }}
          SINGLE_USE_LABEL: ${{ inputs.single_use_label }}
          SHARED_MAX: ${{ inputs.shared_max_redemptions }}
          SHARED_LABEL: ${{ inputs.shared_label }}
          FAMILY: ${{ inputs.family }}
          PLAN: ${{ inputs.plan }}
          DURATION_DAYS: ${{ inputs.duration_days }}
          DURATION_MONTHS: ${{ inputs.duration_months }}
          REQUIRES_NO_PAID_PLAN: ${{ inputs.requires_no_paid_plan }}
          EXPIRES_AT: ${{ inputs.expires_at }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p test-results/cloud-staging-mint
          envelope=test-results/cloud-staging-mint/grant-codes.envelope.json
          # Validate the recipient before minting so a bad key cannot strand codes.
          printf 'probe' | bun run packages/cloud/scripts/admin/recipient-envelope.ts seal > /dev/null
          # Inputs were validated by the admission job; they reach the mint
          # script only as quoted array elements, never as script text.
          grant=(--family "$FAMILY" --plan "$PLAN")
          if [[ -n "$DURATION_MONTHS" ]]; then
            grant+=(--duration-months "$DURATION_MONTHS")
            term="$DURATION_MONTHS calendar months"
          else
            DURATION_DAYS="${DURATION_DAYS:-183}"
            grant+=(--duration-days "$DURATION_DAYS")
            term="$DURATION_DAYS days"
          fi
          if [[ "$REQUIRES_NO_PAID_PLAN" == "true" ]]; then
            grant+=(--requires-no-paid-plan)
          fi
          if [[ -n "$EXPIRES_AT" ]]; then
            grant+=(--expires-at "$EXPIRES_AT")
          fi
          mint() {
            bun --conditions=eliza-source packages/cloud/scripts/admin/mint-subscription-grant-codes.ts "${grant[@]}" "$@"
          }
          # stdout of the mint script (the plaintext codes) is piped only into
          # the sealer; nothing in this block writes codes to the job log.
          {
            printf '# %s: %s single-use code(s), %s\n' "$SINGLE_USE_LABEL" "$SINGLE_USE_COUNT" "$term"
            if (( SINGLE_USE_COUNT > 0 )); then
              mint --count "$SINGLE_USE_COUNT" --max-redemptions 1 --label "$SINGLE_USE_LABEL"
            fi
            if (( SHARED_MAX > 0 )); then
              printf '# %s: 1 code, %s redemptions, %s\n' "$SHARED_LABEL" "$SHARED_MAX" "$term"
              mint --count 1 --max-redemptions "$SHARED_MAX" --label "$SHARED_LABEL"
            fi
          } | bun run packages/cloud/scripts/admin/recipient-envelope.ts seal > "$envelope"

      - name: Upload sealed codes only
        # Also after a partial failure, so any committed codes are recoverable.
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-grant-codes-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/cloud-staging-mint/grant-codes.envelope.json
          if-no-files-found: ignore
          retention-days: 1
