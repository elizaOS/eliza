name: Cloud staging mint grant codes

# Staging-only minting of subscription grant codes. Plaintext codes go straight
# from the mint script into an RSA-OAEP/AES-GCM envelope sealed to the
# operator's public key; only that ciphertext is uploaded, with one-day
# retention. Neither logs nor artifacts ever hold a plaintext code. Requires
# migration 0542_subscription_grant_codes on staging. See
# packages/cloud/scripts/README.md.

on:
  workflow_dispatch:
    inputs:
      expected_cloud_commit:
        description: Exact 40-character staging commit to run
        required: true
        type: string
      recipient_public_key:
        description: Base64 SPKI DER RSA (>=3072-bit) public key from recipient-envelope.ts keygen
        required: true
        type: string
      single_use_count:
        description: Number of single-use codes
        required: true
        default: "5"
        type: string
      single_use_label:
        description: Label for the single-use codes
        required: true
        default: alpha-staging-qa
        type: string
      shared_max_redemptions:
        description: Redemptions for the one shared code (0 skips it)
        required: true
        default: "50"
        type: string
      shared_label:
        description: Label for the shared code
        required: true
        default: alpha-staging-shared
        type: string
      duration_days:
        description: Plan days each redemption grants
        required: true
        default: "183"
        type: string

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject untrusted source and malformed inputs
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_cloud_commit }}
          CHECKED_OUT_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SINGLE_USE_COUNT: ${{ inputs.single_use_count }}
          SHARED_MAX: ${{ inputs.shared_max_redemptions }}
          DURATION_DAYS: ${{ inputs.duration_days }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" != "refs/heads/staging" ]]; then
            echo "::error::staging grant-code minting requires the trusted staging source"
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_COMMIT" != "$CHECKED_OUT_COMMIT" ]]; then
            echo "::error::staging grant-code minting requires the exact checked-out commit"
            exit 1
          fi
          for value in "$SINGLE_USE_COUNT" "$SHARED_MAX" "$DURATION_DAYS"; do
            [[ "$value" =~ ^[0-9]{1,4}$ ]] || { echo "::error::counts and days must be small integers"; exit 1; }
          done
          (( SINGLE_USE_COUNT <= 100 && SHARED_MAX <= 1000 )) || { echo "::error::staging batch is capped at 100 single-use codes and 1000 shared redemptions"; exit 1; }

  mint:
    needs: admission
    if: needs.admission.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: cloud-staging-mint-grant-codes
      cancel-in-progress: false
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: 1.4.2
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          run-postinstall: "false"

      - name: Build required linked runtime
        run: bun run build:core

      - name: Check the pinned staging database identity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ELIZA_OPERATOR_ENVIRONMENT: staging
        run: bun run packages/cloud/scripts/admin/staging-database-identity-pin.ts

      - name: Mint and seal codes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ELIZA_SUBSCRIPTION_GRANT_CODE_PEPPER: ${{ secrets.ELIZA_SUBSCRIPTION_GRANT_CODE_PEPPER }}
          ELIZA_ENVELOPE_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          SINGLE_USE_COUNT: ${{ inputs.single_use_count }}
          SINGLE_USE_LABEL: ${{ inputs.single_use_label }}
          SHARED_MAX: ${{ inputs.shared_max_redemptions }}
          SHARED_LABEL: ${{ inputs.shared_label }}
          DURATION_DAYS: ${{ inputs.duration_days }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p test-results/cloud-staging-mint
          envelope=test-results/cloud-staging-mint/grant-codes.envelope.json
          # Validate the recipient before minting so a bad key cannot strand codes.
          printf 'probe' | bun run packages/cloud/scripts/admin/recipient-envelope.ts seal > /dev/null
          mint() {
            bun --conditions=eliza-source packages/cloud/scripts/admin/mint-subscription-grant-codes.ts "$@"
          }
          # stdout of the mint script (the plaintext codes) is piped only into
          # the sealer; nothing in this block writes codes to the job log.
          {
            printf '# %s: %s single-use code(s), %s days\n' "$SINGLE_USE_LABEL" "$SINGLE_USE_COUNT" "$DURATION_DAYS"
            if (( SINGLE_USE_COUNT > 0 )); then
              mint --count "$SINGLE_USE_COUNT" --max-redemptions 1 --duration-days "$DURATION_DAYS" --label "$SINGLE_USE_LABEL"
            fi
            if (( SHARED_MAX > 0 )); then
              printf '# %s: 1 code, %s redemptions, %s days\n' "$SHARED_LABEL" "$SHARED_MAX" "$DURATION_DAYS"
              mint --count 1 --max-redemptions "$SHARED_MAX" --duration-days "$DURATION_DAYS" --label "$SHARED_LABEL"
            fi
          } | bun run packages/cloud/scripts/admin/recipient-envelope.ts seal > "$envelope"

      - name: Upload sealed codes only
        # Also after a partial failure, so any committed codes are recoverable.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-grant-codes-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/cloud-staging-mint/grant-codes.envelope.json
          if-no-files-found: ignore
          retention-days: 1
