name: Cloud Catalog Diagnostic
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected environment for a read-only catalog probe
        type: choice
        required: true
        options: [staging, production]
permissions:
  contents: read
concurrency:
  group: cloud-catalog-diagnostic-${{ inputs.target_environment }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact admin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.1.0
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Read-only catalog diagnosis
        env:
          ELIZA_OPERATOR_ENVIRONMENT: ${{ inputs.target_environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun packages/scripts/cloud/admin/diagnose-subscription-catalog.ts
