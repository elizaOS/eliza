name: Cloud Catalog Diagnostic
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected environment for a read-only catalog probe
        type: choice
        required: true
        options: [staging, production]
      checkout_readback:
        description: Read the selected staging test checkout and validate its captured invoice
        type: boolean
        default: false
      reconcile_checkout:
        description: Reconcile the selected already-paid Stripe test checkout on staging
        type: boolean
        default: false
      checkout_tail:
        description: Observe safe checkout failure markers for five minutes on staging
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloud-catalog-diagnostic-${{ inputs.target_environment }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact admin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.1.0
        with:
          node-version: "24.15.0"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Require one diagnostic mode
        if: ${{ (inputs.checkout_readback && inputs.checkout_tail) || (inputs.reconcile_checkout && !inputs.checkout_readback) }}
        run: exit 1
      - name: Read-only catalog diagnosis
        if: ${{ !inputs.checkout_readback && !inputs.checkout_tail }}
        env:
          ELIZA_OPERATOR_ENVIRONMENT: ${{ inputs.target_environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun packages/scripts/cloud/admin/diagnose-subscription-catalog.ts
      - name: Read-only staging checkout tail
        if: ${{ inputs.checkout_tail }}
        env:
          ELIZA_OPERATOR_ENVIRONMENT: ${{ inputs.target_environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun packages/scripts/cloud/admin/diagnose-subscription-catalog.ts --checkout-tail
      - name: Read-only staging checkout diagnosis
        if: ${{ inputs.checkout_readback }}
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          ENVIRONMENT: staging
          APP_BILLING_ENVIRONMENT: test
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CHECKOUT_SESSION_ID: ${{ secrets.STRIPE_DIAGNOSTIC_CHECKOUT_SESSION_ID }}
          RECONCILE_CHECKOUT: ${{ inputs.reconcile_checkout == true && '1' || '0' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_IDENTITY_EXPECTED_CLUSTER_SHA256: ${{ vars.DATABASE_IDENTITY_EXPECTED_CLUSTER_SHA256 }}
          DATABASE_IDENTITY_EXPECTED_AUTHORITY_SHA256: ${{ vars.DATABASE_IDENTITY_EXPECTED_AUTHORITY_SHA256 }}
        run: |
          bun --conditions=eliza-source - <<'BUN'
          import { requireStripe } from './packages/cloud/shared/src/lib/stripe.ts';
          import { initialInvoiceSchema } from './packages/cloud/shared/src/lib/services/stripe-settled-invoice-schema.ts';
          import { Client } from 'pg';
          import { execFileSync } from 'node:child_process';
          import { enforceTlsForRemote } from './packages/cloud/shared/src/db/client.ts';
          import { readDatabaseIdentityConfig, runDatabaseIdentityPreflight } from './packages/cloud/scripts/admin/preflight-database-identity.ts';
          if (process.env.TARGET_ENVIRONMENT !== 'staging' ||
              !/^(sk|rk)_test_/.test(process.env.STRIPE_SECRET_KEY ?? '') ||
              !/^cs_test_[A-Za-z0-9]+$/.test(process.env.CHECKOUT_SESSION_ID ?? '')) {
            throw new Error('A selected staging test checkout is required');
          }
          const stripe = requireStripe();
          const reference = value => typeof value === 'string' ? value : value?.id ?? null;
          const sourceFrames = error => {
            if (typeof error?.stack !== 'string' || typeof error?.name !== 'string' || typeof error?.message !== 'string') return [];
            const heading = error.message ? `${error.name}: ${error.message}` : error.name;
            if (!error.stack.startsWith(heading)) return [];
            return error.stack.slice(heading.length).split('\n').flatMap(frame => {
              if (!/^\s+at /.test(frame)) return [];
              const match = /((?:packages|plugins)\/[A-Za-z0-9_./-]+\.[cm]?[jt]sx?):([1-9]\d*):([1-9]\d*)\)?$/.exec(frame);
              if (!match) return [];
              const line = Number(match[2]);
              const column = Number(match[3]);
              if (!Number.isSafeInteger(line) || !Number.isSafeInteger(column)) return [];
              try { if (execFileSync('git', ['ls-files', '--error-unmatch', '--', match[1]], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }).trimEnd() !== match[1]) return []; }
              catch { return []; }
              return [`${match[1]}:${line}:${column}`];
            });
          };
          const failure = (stage, error) => {
            const safe = value => typeof value === 'string' && /^[A-Za-z0-9_-]{1,100}$/.test(value) ? value : undefined;
            const code = safe(error?.code);
            console.log(JSON.stringify({ failure: {
              stage, name: safe(error?.name), type: safe(error?.type), code,
              sqlstate: code && /^[0-9A-Z]{5}$/.test(code) ? code : undefined,
              reason: safe(error?.context?.reason),
              sourceFrames: sourceFrames(error),
              statusCode: typeof error?.statusCode === 'number' ? error.statusCode : undefined,
            }}));
            process.exitCode = 1;
          };
          const observe = async (stage, read) => {
            try { return await read(); } catch (error) { failure(stage, error); return null; }
          };
          let stage = 'webhooks';
          try {
            const matchingWebhooks = [];
            for await (const endpoint of stripe.webhookEndpoints.list({ limit: 100 })) {
              if (endpoint.url === 'https://api-staging.eliza.app/api/stripe/webhook') {
                matchingWebhooks.push({
                  status: endpoint.status, apiVersion: endpoint.api_version,
                  livemode: endpoint.livemode, enabledEvents: endpoint.enabled_events,
                });
              }
            }
            console.log(JSON.stringify({ webhook: {
              matchingCount: matchingWebhooks.length, endpoints: matchingWebhooks,
            }}));
            stage = 'checkout';
            const session = await stripe.checkout.sessions.retrieve(process.env.CHECKOUT_SESSION_ID);
            if (session.livemode || session.mode !== 'subscription' ||
                session.metadata?.app !== 'eliza-cloud') throw new Error('Unexpected checkout authority');
            console.log(JSON.stringify({ checkout: {
              status: session.status, paymentStatus: session.payment_status, livemode: session.livemode,
              hasCommand: Boolean(session.metadata?.command_id),
              hasOrganization: Boolean(session.metadata?.organization_id),
              clientReferenceMatchesCommand: session.client_reference_id === session.metadata?.command_id,
            }}));
            const account = await observe('account', () => stripe.accounts.retrieve(null));
            if (account) console.log(JSON.stringify({ account: {
              idPresent: Boolean(account.id), chargesEnabled: account.charges_enabled,
              detailsSubmitted: account.details_submitted,
            }}));
            const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
            if (!uuid.test(session.metadata?.organization_id ?? '') ||
                !uuid.test(session.metadata?.command_id ?? '')) throw new Error('Checkout database identity missing');
            let database;
            let databaseIdentityVerified = false;
            let databaseStage = 'database_configuration';
            try {
              if (!process.env.DATABASE_URL) throw new Error('Database connection missing');
              const identity = readDatabaseIdentityConfig({
                ...process.env, DATABASE_IDENTITY_GATE_MODE: 'enforce',
                DATABASE_IDENTITY_ENVIRONMENT: 'staging',
              });
              const { url, ssl } = enforceTlsForRemote(process.env.DATABASE_URL);
              database = new Client({ connectionString: url, ...(ssl ? { ssl } : {}), connectionTimeoutMillis: 10000, statement_timeout: 10000 });
              databaseStage = 'database_connect';
              await database.connect();
              await database.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
              databaseStage = 'database_identity';
              await runDatabaseIdentityPreflight(identity, database);
              databaseStage = 'database_snapshot';
              const snapshot = await database.query(`
                WITH selected_subscription AS (
                  SELECT id,status,plan_key FROM billing_subscriptions
                  WHERE organization_id=$1::uuid AND provider='stripe' AND provider_environment='test'
                    AND billing_scope_id IS NULL AND stripe_subscription_id=$3
                )
                SELECT
                  (SELECT jsonb_agg(jsonb_build_object('status',status,'kind',kind,'planKey',target_plan_key,
                    'hasContract',checkout_contract IS NOT NULL,'hasResult',result_subscription_id IS NOT NULL,
                    'applied',applied_at IS NOT NULL,'completed',completed_at IS NOT NULL,
                    'leaseActive',lease_expires_at > now(),
                    'providerAccountMatches',CASE WHEN $5::text IS NULL THEN NULL ELSE checkout_contract->'payload'->>'accountId'=$5 END,
                    'customerMatches',checkout_contract->'payload'->'params'->>'customer'=$6,
                    'errorCode',CASE WHEN error_code ~ '^[A-Z][A-Z0-9_]{0,99}$' THEN error_code ELSE NULL END))
                    FROM billing_subscription_commands WHERE organization_id=$1::uuid AND id=$2::uuid
                    AND billing_scope_id IS NULL AND app_id IS NULL) AS commands,
                  (SELECT jsonb_agg(jsonb_build_object('status',status,'planKey',plan_key)) FROM selected_subscription) AS subscriptions,
                  (SELECT jsonb_agg(jsonb_build_object('state',state,'planKey',plan_key,'grantSource',grant_source))
                    FROM subscription_allowance_periods WHERE organization_id=$1::uuid AND provider='stripe'
                    AND provider_environment='test' AND billing_scope_id IS NULL AND stripe_invoice_id=$4) AS allowances,
                  (SELECT jsonb_agg(jsonb_build_object('state',state,'planKey',plan_key,'access',access,
                    'effective',entitlement_effective,'hasGrant',source_grant_id IS NOT NULL,
                    'sourceMatchesSubscription',source_subscription_id IN (SELECT id FROM selected_subscription)))
                    FROM organization_entitlements WHERE organization_id=$1::uuid AND billing_scope_id IS NULL) AS entitlements,
                  (SELECT jsonb_agg(jsonb_build_object('state',state,
                    'sourceMatchesSubscription',subscription_id IN (SELECT id FROM selected_subscription)))
                    FROM organization_subscription_authorities WHERE organization_id=$1::uuid) AS authorities,
                  (SELECT jsonb_agg(jsonb_build_object('enabled',enabled,'rateEnabled',rate_enabled))
                    FROM inference_policy_authorities WHERE organization_id=$1::uuid) AS "policyAuthorities",
                  jsonb_build_object(
                    'balanceRevisionSequencePresent',to_regclass('public.organization_balance_revision_seq') IS NOT NULL,
                    'balanceRevisionSequenceUsable',COALESCE(has_sequence_privilege(to_regclass('public.organization_balance_revision_seq'),'USAGE'),false),
                    'policyAuditPresent',to_regclass('public.organization_policy_audit') IS NOT NULL,
                    'allowanceRevisionTriggerPresent',EXISTS(SELECT 1 FROM pg_trigger
                      WHERE tgrelid=to_regclass('public.subscription_allowance_transactions')
                      AND tgname='subscription_allowance_transactions_balance_revision_trigger' AND NOT tgisinternal AND tgenabled IN ('O','A')),
                    'policyGuardTriggerPresent',EXISTS(SELECT 1 FROM pg_trigger
                      WHERE tgrelid=to_regclass('public.organization_entitlements')
                      AND tgname='inference_policy_guard' AND NOT tgisinternal AND tgenabled IN ('O','A'))
                  ) AS dependencies
              `, [session.metadata.organization_id, session.metadata.command_id,
                  reference(session.subscription), reference(session.invoice), account?.id ?? null, reference(session.customer)]);
              if (snapshot.rows.length !== 1) throw new Error('Database snapshot missing');
              databaseIdentityVerified = true;
              console.log(JSON.stringify({ database: { identityVerified: true, readOnly: true, ...snapshot.rows[0] } }));
            } catch (error) { failure(databaseStage, error); }
            finally {
              if (database) {
                try { await database.query('ROLLBACK'); } catch (error) { failure('database_rollback', error); }
                try { await database.end(); } catch (error) { failure('database_close', error); }
              }
            }
            stage = 'invoice';
            if (typeof session.invoice !== 'string') throw new Error('Captured invoice missing');
            const invoice = await stripe.invoices.retrieve(session.invoice);
            const parsed = initialInvoiceSchema.safeParse(invoice);
            console.log(JSON.stringify({ invoice: {
              status: invoice.status, paid: invoice.paid, livemode: invoice.livemode,
              customerMatchesSession: reference(invoice.customer) === reference(session.customer),
              subscriptionMatchesSession: reference(invoice.subscription) === reference(session.subscription),
              schemaValid: parsed.success,
              issues: parsed.success ? [] : parsed.error.issues.map(issue => ({ path: issue.path, code: issue.code })),
            }}));
            const subscription = await observe('subscription', async () => {
              if (typeof session.subscription !== 'string') throw new Error('Subscription missing');
              return stripe.subscriptions.retrieve(session.subscription);
            });
            if (subscription) console.log(JSON.stringify({ subscription: {
              status: subscription.status, livemode: subscription.livemode,
              cancelAtPeriodEnd: subscription.cancel_at_period_end,
              idMatchesSession: subscription.id === reference(session.subscription),
              customerMatchesSession: reference(subscription.customer) === reference(session.customer),
            }}));
            const customer = await observe('customer', async () => {
              if (typeof session.customer !== 'string') throw new Error('Customer missing');
              return stripe.customers.retrieve(session.customer);
            });
            if (customer) console.log(JSON.stringify({ customer: {
              deleted: customer.deleted === true, livemode: customer.livemode,
              idMatchesSession: customer.id === reference(session.customer),
            }}));
            if (parsed.success) {
              const paymentIntent = await observe('payment_intent', () => stripe.paymentIntents.retrieve(parsed.data.payment_intent));
              if (paymentIntent) console.log(JSON.stringify({ paymentIntent: {
                status: paymentIntent.status, livemode: paymentIntent.livemode,
                idMatchesInvoice: paymentIntent.id === parsed.data.payment_intent,
                customerMatchesSession: reference(paymentIntent.customer) === reference(session.customer),
                latestChargeMatchesInvoice: reference(paymentIntent.latest_charge) === parsed.data.charge,
              }}));
              const charge = await observe('charge', () => stripe.charges.retrieve(parsed.data.charge));
              if (charge) console.log(JSON.stringify({ charge: {
                status: charge.status, paid: charge.paid, captured: charge.captured,
                refunded: charge.refunded, livemode: charge.livemode,
                idMatchesInvoice: charge.id === parsed.data.charge,
                customerMatchesSession: reference(charge.customer) === reference(session.customer),
                paymentIntentMatchesInvoice: reference(charge.payment_intent) === parsed.data.payment_intent,
              }}));
            }
            if (process.env.RECONCILE_CHECKOUT === '1') {
              if (!databaseIdentityVerified || session.status !== 'complete' || session.payment_status !== 'paid' ||
                  !parsed.success || invoice.livemode !== false || !subscription || subscription.livemode !== false) {
                throw new Error('Selected paid test checkout is not verified');
              }
              stage = 'load_checkout_reconciliation';
              const { reconcileSubscriptionCheckout } = await import('./packages/cloud/shared/src/lib/services/subscription-checkout.ts');
              stage = 'reconcile_existing_paid_test_checkout';
              await reconcileSubscriptionCheckout(session.id, session.metadata.organization_id);
              console.log(JSON.stringify({ reconciliation: { completed: true, existingPaidTestCheckout: true } }));
            }
          } catch (error) {
            failure(stage, error);
          }
          BUN
