name: Cloud Tests

# Runs cloud's lint/typecheck/unit/integration/playwright suite when cloud-* packages or tests change.
# Source: cloud/.github/workflows/tests.yml in the original elizaOS/cloud repo.

on:
  workflow_call:
  workflow_dispatch:

# Develop Full owns latest-tip cancellation for called runs.
concurrency:
  group: cloud-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
  TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
  CACHE_BACKEND: wadis
  CACHE_ENABLED: "false"
  NODE_OPTIONS: --max-old-space-size=4096

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cloud-setup-test-env
      - name: Managed provider contract inventory
        run: bun run audit:provider-contracts
      - name: Lint and typecheck cloud workspaces
        run: bun run verify:cloud

      - name: Tenant-scope gate (no unscoped pk-only reads of apps data-plane) (#9853)
        run: bun run --cwd packages/cloud/shared check:tenant-scope

  # NOTE: the Worker bundle stub-drift gate (#14422) runs inside
  # `lint-and-types` above — packages/cloud/api chains `check:worker-bundle`
  # (wrangler deploy --dry-run) into its `typecheck`, so `verify:cloud` covers
  # it. Do not re-add a standalone dry-run job: #14474 + #14504 briefly ran it
  # twice per PR on the saturated runner fleet.

  unit-tests:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    # Cloud unit tests can run past 25m on saturated self-hosted runners while still passing.
    timeout-minutes: 40
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cloud-setup-test-env
      # Guards the batch runner's output-flush contract: a failing batch must
      # surface its diagnostic instead of being swallowed by a process.exit()
      # that truncates buffered stdout (the #16062 silent exit-1 regression).
      - name: Batch runner flush-integrity self-test
        run: node packages/scripts/test-cloud-run-flush.self-test.mjs
      - name: Batch runner helper self-test
        run: node packages/scripts/test-cloud-run-helpers.self-test.mjs
      - name: Batch runner unit tests
        run: bun test packages/scripts/__tests__/test-cloud-run.test.mjs
      # Guards the wall-clock watchdog (#17245): a wedged child and its
      # descendants must be terminated without stalling the remaining batches.
      - name: Batch runner process-tree watchdog self-test
        run: node packages/scripts/test-cloud-run-watchdog.self-test.mjs
      # Guards the clean-install preflight (#16187): `bun run test:cloud` must
      # build the missing @elizaos/core dist / generated keyword modules itself
      # instead of dying in `Cannot find module` cascades after a frozen
      # install that skipped lifecycle scripts.
      - name: Batch runner clean-install preflight self-test
        run: node packages/scripts/test-cloud-run-preflight.self-test.mjs
      - name: Run cloud unit tests
        run: bun run test:cloud

      # The bun `test:cloud` lane skips suites that need the Vitest-only module
      # mock API (`vi.mock` + `vi.importActual`) — see `SUPPORTS_VITEST_MOCK_API`.
      # Run those under Vitest here so the direct-wallet payer/state-machine proof
      # (33 tests, in-process PGlite) actually executes instead of vacuously
      # skipping. Uses pglite://memory — no DB service required.
      - name: Run cloud vitest-only suites
        run: bun run --cwd packages/cloud/shared test:vitest

  integration-tests:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cloud-setup-test-env
        with:
          setup-db: "true"
          db-backend: "pglite"
      - name: Run cloud integration tests
        run: bun run test:cloud:integration

  e2e-tests:
    # This lane starts a real pgvector container. Generic fleet labels do not
    # attest Docker-daemon access, so use GitHub's Docker-capable image.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [lint-and-types]
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cloud-setup-test-env
        with:
          setup-db: "true"
          db-backend: "postgres"
      - name: Run PostgreSQL migration fencing and contention tests
        env:
          RUN_REAL_POSTGRES_MIGRATION_TESTS: "1"
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: >-
          bun test --config=/dev/null --isolate
          packages/cloud/scripts/admin/migrate-with-diagnostics.postgres.test.ts
      - name: Run PostgreSQL lifecycle barrier tests
        env:
          APPS_TENANT_DB_TEST_DSN: postgresql://postgres@127.0.0.1:5432/postgres
        run: >-
          bun test --config=/dev/null --isolate
          packages/cloud/shared/src/db/repositories/__tests__/agent-sandboxes-stuck-provisioning-lock.integration.test.ts
      - name: Run PostgreSQL agent billing lease precision tests
        env:
          APPS_TENANT_DB_TEST_DSN: postgresql://postgres@127.0.0.1:5432/postgres
        run: >-
          bun test --config=/dev/null --isolate
          packages/cloud/shared/src/db/repositories/__tests__/agent-billing-runs-postgres.integration.test.ts
      - name: Run cloud e2e tests
        run: bun run test:cloud:e2e

  # Full-stack Playwright lane (#18474). packages/cloud/e2e boots the real
  # mock-backed cloud stack (PGlite TCP bridge, Hetzner mock, container
  # control plane, cloud-api Worker, app frontend) and drives real flows.
  # The complete suite takes ~12 minutes plus the linked-workspace build, so
  # this per-push gate runs the explicit shared-to-dedicated funnel subset
  # (onboarding -> handoff -> provisioning -> upgrade); the remaining specs run
  # nightly in .github/workflows/monetized-loop-nightly.yml, which executes the
  # full suite on a schedule. Failures propagate — no continue-on-error.
  stack-e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [lint-and-types]
    env:
      NODE_ENV: test
      CI: "true"
      CLOUD_E2E: "1"
      MOCK_REDIS: "1"
      MOCK_HETZNER_LATENCY: "0"
      MOCK_HETZNER_ACTION_MS: "30"
      CONTROL_PLANE_TICK_MS: "50"
      DATABASE_URL: pglite://./.eliza-ci/.pgdata
      HCLOUD_TOKEN: test-token
      CONTAINER_CONTROL_PLANE_TOKEN: test-token
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cloud-setup-test-env
      - name: Install Playwright browsers
        run: .github/scripts/install-playwright-browsers.sh chromium
      - name: Run shared-to-dedicated funnel specs
        run: >-
          bun run cloud:e2e --
          'app-client-onboarding\.spec\.ts$'
          'app-client-handoff-success\.spec\.ts$'
          '(^|/)provision\.spec\.ts$'
          'onboarding-reprovision\.spec\.ts$'
          'shared-to-dedicated-upgrade\.spec\.ts$'
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloud-stack-e2e-${{ github.run_attempt }}
          path: |
            packages/cloud/e2e/test-results
            packages/cloud/e2e/.logs
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
