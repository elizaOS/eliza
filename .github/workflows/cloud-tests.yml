name: Cloud Tests

# Cloud owns deterministic database, service and browser contracts.
# Full branch callers delegate duplicate source checks to canonical CI.

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: false
        default: ''
      source_checks_in_canonical_ci:
        description: The caller also requires canonical CI, which owns full workspace lint/typecheck
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      profile_startup_only:
        description: Build and profile Worker startup without deployment
        type: boolean
        default: false

# Develop Full owns latest-tip cancellation for called runs.
concurrency:
  group: cloud-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
  TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
  CACHE_BACKEND: wadis
  CACHE_ENABLED: "false"
  NODE_OPTIONS: --max-old-space-size=4096

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  changes:
    if: ${{ !inputs.profile_startup_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.affected.outputs.cloud }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - id: affected
        env:
          BASE_SHA: ${{ inputs.base_sha || '' }}
        run: node packages/scripts/ci-affected.ts "$BASE_SHA"
  polyglot-services:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/cloud/services/tunnel-proxy/go.mod
          cache-dependency-path: packages/cloud/services/tunnel-proxy/go.sum
      - name: Tunnel routing and tenant isolation
        working-directory: packages/cloud/services/tunnel-proxy
        run: go test -race ./...
      - name: Python and shell syntax
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import ast
          import pathlib
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "packages/cloud"], text=True).splitlines()
          for name in files:
              path = pathlib.Path(name)
              if path.suffix == ".py":
                  ast.parse(path.read_text(), filename=name)
              elif path.suffix == ".sh":
                  subprocess.run(["bash", "-n", name], check=True)
          PYTHON

  lint-and-types:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 90
    services:
      quint-postgres:
        image: ${{ !inputs.source_checks_in_canonical_ci && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: qa_quint
          POSTGRES_DB: quint_protocol
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U qa_quint -d quint_protocol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Match canonical source checks: one compiler fits the hosted runner,
      # including the cloud API's larger declaration graph.
      NODE_OPTIONS: --max-old-space-size=8192
      RUN_TURBO_CONCURRENCY: "1"
      INFERENCE_POLICY_TEST_POSTGRES_URL: postgresql://qa_quint@127.0.0.1:5432/quint_protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cloud-setup-test-env
      - name: Setup Java for Quint verification
        if: ${{ !inputs.source_checks_in_canonical_ci }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "21"
      - name: Install local Redis for protocol conformance
        if: ${{ !inputs.source_checks_in_canonical_ci }}
        run: |
          if ! command -v redis-server >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
          redis-server --version
      - name: Lint and typecheck cloud workspaces
        if: ${{ !inputs.source_checks_in_canonical_ci }}
        env:
          # Embedded suites use PGlite; lock checks use the separate qa_* fixture.
          DATABASE_URL: pglite://memory
          TEST_DATABASE_URL: pglite://memory
        run: bun run verify:cloud

      - name: Tenant-scope gate (no unscoped pk-only reads of apps data-plane) (#9853)
        run: bun run --cwd packages/cloud/shared check:tenant-scope
      - name: Staging admission Worker source contract
        run: bun packages/cloud/admission-worker/verify-staging-contract.ts
      - name: Staging speech host Worker source contract
        run: bun packages/cloud/speech-worker/verify-staging-contract.ts
      # The speech host exists to keep the first-touch isolate small. Bundle it
      # without uploading and record its size beside the contract result.
      - name: Staging speech host Worker bundle (dry run)
        working-directory: packages/cloud/api
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/speech-worker-candidate"
          bunx wrangler deploy --config ../speech-worker/wrangler.toml --dry-run --outdir "$out"
          du -b "$out"/*.js | sort -n | tail -3

  # NOTE: the Worker bundle stub-drift gate (#14422) runs inside
  # `lint-and-types` above — packages/cloud/api chains `check:worker-bundle`
  # (wrangler deploy --dry-run) into its `typecheck`, so `verify:cloud` covers
  # it. Do not re-add a standalone dry-run job: #14474 + #14504 briefly ran it
  # twice per PR on the saturated runner fleet.

  integration-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cloud-setup-test-env
      # The harness owns a uniquely leased PGlite bridge and data directory;
      # starting the action's fixed :5432 service would reintroduce cross-job state.
      - name: Run cloud integration tests
        run: bun run test:cloud:integration

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # This lane starts a real pgvector container. Generic fleet labels do not
    # attest Docker-daemon access, so use GitHub's Docker-capable image.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cloud-setup-test-env
        with:
          setup-db: "true"
          db-backend: "postgres"
      - name: Run PostgreSQL migration fencing and contention tests
        env:
          RUN_REAL_POSTGRES_MIGRATION_TESTS: "1"
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: >-
          bun test --config=/dev/null --isolate
          packages/cloud/scripts/admin/migrate-with-diagnostics.postgres.test.ts
      - name: Run generic app subscription PostgreSQL contracts
        env:
          APP_BILLING_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
          APP_FUNDING_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
          APP_DELIVERY_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: >-
          bun test --config=/dev/null --isolate
          packages/cloud/shared/src/db/repositories/app-subscription-authority.pglite.test.ts
          packages/cloud/shared/src/db/repositories/app-billing-command.postgres.integration.test.ts
          packages/cloud/shared/src/lib/services/generic-billing-runtime.postgres.integration.test.ts
          packages/cloud/shared/src/lib/services/generic-billing-membership.postgres.integration.test.ts
          packages/cloud/shared/src/lib/services/generic-billing-application-slot.postgres.integration.test.ts
          packages/cloud/shared/src/lib/services/native-application-inference.postgres.integration.test.ts
          packages/cloud/shared/src/lib/services/generic-billing-import.postgres.integration.test.ts
          packages/cloud/shared/src/lib/services/app-billing-delivery.postgres.integration.test.ts
          packages/cloud/shared/src/lib/services/app-inference-funding.postgres.integration.test.ts
          'packages/cloud/api/v1/apps/[id]/billing/admin/route.postgres.integration.test.ts'
          'packages/cloud/api/v1/apps/[id]/billing/records.postgres.integration.test.ts'
          'packages/cloud/api/v1/apps/[id]/billing/administrators.postgres.integration.test.ts'
          'packages/cloud/api/v1/billing/application-slots/[slotKey]/route.postgres.integration.test.ts'
      - name: Run PostgreSQL replacement-attempt lock tests
        env:
          APPS_TENANT_DB_TEST_DSN: postgresql://postgres@127.0.0.1:5432/postgres
          REQUIRE_REAL_POSTGRES_REPLACEMENT_LOCK_TESTS: "1"
        run: >-
          bun test --config=/dev/null --isolate
          packages/cloud/shared/src/db/repositories/__tests__/agent-sandbox-replacement-account-deletion-locks.integration.test.ts
      - name: Run PostgreSQL backup admission migration tests
        env:
          APPS_TENANT_DB_TEST_DSN: postgresql://postgres@127.0.0.1:5432/postgres
          REQUIRE_REAL_POSTGRES_BACKUP_ADMISSION_TESTS: "1"
        run: |
          bun test --config=/dev/null --isolate \
            packages/cloud/shared/src/db/agent-backup-admission-claim-authority.postgres.integration.test.ts
          bun test --config=/dev/null --isolate \
            packages/cloud/shared/src/db/agent-backup-admission-source-stamps.postgres.integration.test.ts
          bun test --config=/dev/null --isolate \
            packages/cloud/shared/src/db/agent-backup-admission-gc-authority.postgres.integration.test.ts
          bun test --config=/dev/null --isolate \
            packages/cloud/scripts/admin/migrate-with-diagnostics.concurrent-index-mode.postgres.test.ts
      - name: Run PostgreSQL account deletion lock-order tests
        env:
          APPS_TENANT_DB_TEST_DSN: postgresql://postgres@127.0.0.1:5432/postgres
          REQUIRE_REAL_POSTGRES_ACCOUNT_DELETION_LOCK_TESTS: "1"
        run: >-
          bun test --config=/dev/null --isolate
          packages/cloud/shared/src/db/repositories/__tests__/account-deletion-cancel-expiry-postgres.integration.test.ts
      - name: Run PostgreSQL container admission tests
        env:
          APPS_TENANT_DB_TEST_DSN: postgresql://postgres@127.0.0.1:5432/postgres
        run: >-
          test -n "${APPS_TENANT_DB_TEST_DSN:-}" &&
          bun test --config=/dev/null --isolate
          packages/cloud/shared/src/db/repositories/__tests__/containers-project-intent-postgres.integration.test.ts
      - name: Run cloud e2e tests
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/cloud-api-e2e-wrangler
          WRANGLER_LOG_SANITIZE: "true"
        run: bun run test:cloud:e2e
      - name: Retain cloud API Worker diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cloud-api-e2e-wrangler-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-api-e2e-wrangler
          retention-days: 7
          if-no-files-found: warn

  # Full-stack Playwright lane (#18474). packages/cloud/e2e boots the real
  # mock-backed cloud stack (PGlite TCP bridge, Hetzner mock, container
  # control plane, cloud-api Worker, app frontend) and drives real flows.
  # The complete suite takes ~12 minutes plus the linked-workspace build, so
  # this per-push gate runs the explicit shared-to-dedicated funnel subset
  # (onboarding -> handoff -> provisioning -> upgrade) plus the once-only
  # billing settlement replay contract. The remaining specs are available from
  # .github/workflows/monetized-loop-nightly.yml. Failures propagate — no
  # continue-on-error.
  stack-e2e-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: test
      CI: "true"
      CLOUD_E2E: "1"
      MOCK_REDIS: "1"
      MOCK_HETZNER_LATENCY: "0"
      MOCK_HETZNER_ACTION_MS: "30"
      CONTROL_PLANE_TICK_MS: "50"
      DATABASE_URL: pglite://./.eliza-ci/.pgdata
      HCLOUD_TOKEN: test-token
      CONTAINER_CONTROL_PLANE_TOKEN: test-token
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/cloud-setup-test-env
      - name: Install Playwright browsers
        run: packages/scripts/github/install-playwright-browsers.sh chromium
      - name: Run blocking cloud stack specs
        run: >-
          bun run --cwd packages/cloud/e2e test --
          'app-client-onboarding\.spec\.ts$'
          'app-client-handoff-success\.spec\.ts$'
          '(^|/)provision\.spec\.ts$'
          'onboarding-reprovision\.spec\.ts$'
          'shared-to-dedicated-upgrade\.spec\.ts$'
          'billing-payment-replay\.spec\.ts$'
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cloud-stack-e2e-${{ github.run_attempt }}
          path: |
            test-results/cloud-e2e
            packages/cloud/e2e/.logs
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  agent-stability:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/cloud-stability.yml
    with:
      real_model: false

  startup-profile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_startup_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build linked workspaces
        run: bun run build:core
      - name: Verify speech transport and retirement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/cloud-startup
          for test_file in \
            packages/cloud/api/src/speech-retirement-coordinator.test.ts \
            packages/cloud/api/src/speech-retirement-composition.test.ts \
            packages/cloud/api/__tests__/speech-relay-worker.test.ts; do
            bun test "./$test_file" 2>&1 | tee -a test-results/cloud-startup/speech-tests.log
          done
      - name: Profile local Worker startup
        working-directory: packages/cloud/api
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/test-results/cloud-startup"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/source.txt"
          bunx --no-install wrangler deploy --env staging --dry-run \
            --outfile "$output/worker.bundle" 2>&1 | tee "$output/bundle.log"
          bunx --no-install wrangler check startup --worker "$output/worker.bundle" \
            --outfile "$output/worker.cpuprofile" 2>&1 | tee "$output/profile.log"
      - name: Upload startup profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cloud-local-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/cloud-startup
          if-no-files-found: warn
          retention-days: 7
