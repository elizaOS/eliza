name: Paradee native stream contract
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
      - name: Detect native stream contract changes
        id: changes
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          git diff --name-only "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/paradee-changed.txt"
          if grep -Eq '^(plugins/plugin-local-inference/native/android/|packages/app/platforms/android/paradee-voice/|packages/app/platforms/android/app/src/main/elizavoice-jni/|packages/app/platforms/android/app/src/main/java/ai/elizaos/app/ElizaVoiceNative.java$|packages/app/scripts/paradee-voice/(stream|plugin|speech-pipeline)-contract|packages/app/scripts/paradee-voice/speech-pipeline/|packages/app/scripts/voice-quality/wer\.ts$|plugins/plugin-local-inference/native/llama.cpp$|\.github/workflows/(paradee-stream-contract|pr-validation)\.yml$)' "$RUNNER_TEMP/paradee-changed.txt"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      # Before the JVM contracts: they compile Android-facing classes against android-36.
      - name: Setup Android SDK platform 36
        if: steps.changes.outputs.run == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platforms;android-36
      - name: Exercise actual Java wrapper with a controlled native boundary
        if: steps.changes.outputs.run == 'true'
        run: node --test packages/app/scripts/paradee-voice/stream-contract.test.mjs
      - name: Check plugin rules and device WER parity on the JVM
        if: steps.changes.outputs.run == 'true'
        run: node --test packages/app/scripts/paradee-voice/plugin-contract.test.mjs
      # The speech pipeline contract compiles its JSON-carrying classes against the pinned org.json.
      - name: Fetch pinned org.json
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/json-20250517.jar"
          curl -fsSL --retry 3 -o "$jar" https://repo1.maven.org/maven2/org/json/json/20250517/json-20250517.jar
          echo "3ea61b2a06e31edf1c91134fe9106b0ebb16628be169f3db75bc7a2b06b45796  $jar" | sha256sum -c -
          echo "ELIZA_JSON_JAR=$jar" >> "$GITHUB_ENV"
      - name: Fetch pinned native speech compile dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          dependencies="$RUNNER_TEMP/speech-compile-deps"
          mkdir -p "$dependencies"
          fetch() {
            local artifact="$1" checksum="$2" file="$3"
            curl -fsSL --retry 3 -o "$dependencies/$file" "https://repo1.maven.org/maven2/$artifact"
            echo "$checksum  $dependencies/$file" | sha256sum -c -
          }
          fetch com/squareup/okhttp3/okhttp-android/5.3.2/okhttp-android-5.3.2.aar \
            f1a78812ebeef4d45eee0dbeb4f27347210f564d2b8ee411f012ce8573b0a658 okhttp-release.aar
          fetch com/squareup/okio/okio-jvm/3.16.4/okio-jvm-3.16.4.jar \
            2196b993cd34dbbd919e7e01f57a4781b58bee80f86106163e287c20343a96a7 okio-jvm-3.16.4.jar
          fetch org/jetbrains/kotlin/kotlin-stdlib/2.2.21/kotlin-stdlib-2.2.21.jar \
            6558a3d233da56a20934b32159f9db5f86ed5816ef098f78a2c223dc6abb79dd kotlin-stdlib-2.2.21.jar
          echo "ELIZA_SPEECH_COMPILE_DEPS_DIR=$dependencies" >> "$GITHUB_ENV"
      - name: Check the shared speech pipeline (recognizer probe, VAD, playback) on the JVM
        if: steps.changes.outputs.run == 'true'
        run: node --test packages/app/scripts/paradee-voice/speech-pipeline-contract.test.mjs
      - name: Load exact native headers
        if: steps.changes.outputs.run == 'true'
        run: git submodule update --init --depth 1 plugins/plugin-local-inference/native/llama.cpp
      - name: Install fixed Android compiler
        if: steps.changes.outputs.run == 'true'
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Compile both native registration surfaces and ABIs
        if: steps.changes.outputs.run == 'true'
        run: |
          compiler="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for abi in aarch64 x86_64; do
            for full in 0 1; do
              "$compiler/$abi-linux-android23-clang++" -std=c++17 -fsyntax-only -DELIZA_VOICE_JNI_FULL=$full \
                -Iplugins/plugin-local-inference/native/llama.cpp/tools/omnivoice/include \
                packages/app/platforms/android/app/src/main/elizavoice-jni/elizavoice-jni.cpp
            done
          done

      - name: Install native build tools
        if: steps.changes.outputs.run == 'true'
        run: bash "$GITHUB_WORKSPACE/packages/scripts/github/install-apt-packages.sh" --no-install-recommends cmake ninja-build
      - name: Build ABI 19 engines and link both JNI surfaces
        if: steps.changes.outputs.run == 'true'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          set -euo pipefail
          output="$(node --input-type=module -e 'import { testOutputPath } from "./packages/scripts/lib/test-output.ts"; console.log(testOutputPath("native-stream-contract"));')"
          compiler="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for abi in arm64-v8a x86_64; do
            node packages/app/scripts/stage-elizavoice-lib.ts --abi "$abi" --out "$output/$abi" --espeak-dir "$RUNNER_TEMP/paradee-espeak"
            target=aarch64
            if [ "$abi" = x86_64 ]; then target=x86_64; fi
            for full in 0 1; do
              "$compiler/$target-linux-android23-clang++" -shared -fPIC -std=c++17 -DELIZA_VOICE_JNI_FULL=$full \
                -Iplugins/plugin-local-inference/native/llama.cpp/tools/omnivoice/include \
                packages/app/platforms/android/app/src/main/elizavoice-jni/elizavoice-jni.cpp \
                -L"$output/$abi" -lelizainference -llog -Wl,--no-undefined,-z,max-page-size=16384 \
                -o "$output/$abi/libelizavoicejni-contract-$full.so"
            done
          done
      - name: Retain native build and link evidence
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-stream-contract-${{ inputs.head_sha || github.sha }}
          path: test-results/native-stream-contract/
          if-no-files-found: error
