name: Valhalla Brain API

on:
  pull_request:
    paths:
      - packages/valhalla-brain-api/**
      - packages/valhalla-brain-sdk/**
      - .github/workflows/valhalla-brain-api.yml
  push:
    branches:
      - cursor/valhalla-brain-api-d28f
      - develop
    paths:
      - packages/valhalla-brain-api/**
      - packages/valhalla-brain-sdk/**
      - .github/workflows/valhalla-brain-api.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Test
        run: bun test packages/valhalla-brain-api/src/score.test.ts packages/valhalla-brain-api/src/portal.test.ts && bun packages/valhalla-brain-api/scripts/forbid-portal-sign.ts
