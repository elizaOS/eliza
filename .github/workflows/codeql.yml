name: CodeQL On Demand

# CodeQL is deliberately an off-PR lane. The repository's fast CI remains the
# only pull-request build/test path; this scan runs by explicit operator request
# and therefore cannot add a check to ordinary PR updates.
on:
  workflow_dispatch:

concurrency:
  group: codeql-on-demand-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.shard }})
# Use an always-provisionable hosted lane so analysis cannot stall
    # behind offline fleet capacity. Production-boundary shards keep every query
    # below the hosted job limit while distinct categories preserve every upload.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: runtime
            paths:
              - 'packages/agent/**'
              - 'packages/auth/**'
              - 'packages/core/**'
              - 'packages/auth/**'
              - 'packages/core/**'
          - shard: product
            paths:
              - 'packages/app/**'
              - 'packages/app/**'
              - 'packages/ui/**'
          - shard: cloud
            paths:
              - 'packages/cloud/**'
          - shard: platform-ops
            paths:
              - 'packages/testing/**'
              - 'packages/testing/scenario-runner/**'
              - 'packages/scripts/**'
              - 'packages/testing/synthetic-world/**'
              - 'packages/training/**'
              - 'plugins/*.ts'
          - shard: plugins-a-f
            paths:
              - 'plugins/plugin-agent-orchestrator/**'
              - 'plugins/plugin-anthropic/**'
              - 'plugins/plugin-assistant/**'
              - 'plugins/plugin-blocker/**'
              - 'plugins/plugin-browser/**'
              - 'plugins/plugin-calendar/**'
              - 'plugins/plugin-native-inference/**'
              - 'plugins/plugin-coding-tools/**'
              - 'plugins/plugin-computeruse/**'
              - 'plugins/plugin-native-contacts/**'
              - 'plugins/plugin-discord/**'
              - 'plugins/plugin-knowledge/**'
              - 'plugins/plugin-elizacloud/**'
              - 'plugins/plugin-embeddings/**'
              - 'plugins/plugin-form/**'
          - shard: plugins-g-n
            paths:
              - 'plugins/plugin-github/**'
              - 'plugins/plugin-goals/**'
              - 'plugins/plugin-google-workspace/**'
              - 'plugins/plugin-health/**'
              - 'plugins/plugin-imessage/**'
              - 'plugins/plugin-inbox/**'
              - 'plugins/plugin-sqlite/**'
              - 'plugins/plugin-local-inference/**'
              - 'plugins/plugin-maps/**'
              - 'plugins/plugin-mcp/**'
              - 'plugins/plugin-meetings/**'
              - 'plugins/plugin-native-messages/**'
              - 'plugins/plugin-native-activity-tracker/**'
              - 'plugins/plugin-native-agent/**'
              - 'plugins/plugin-native-appblocker/**'
              - 'plugins/plugin-native-browser-surface/**'
              - 'plugins/plugin-native-bun-runtime/**'
              - 'plugins/plugin-native-calendar/**'
              - 'plugins/plugin-native-camera/**'
              - 'plugins/plugin-native-canvas/**'
              - 'plugins/plugin-native-contacts/**'
              - 'plugins/plugin-native-desktop/**'
              - 'plugins/plugin-native-eliza-tasks/**'
              - 'plugins/plugin-native-filesystem/**'
              - 'plugins/plugin-native-gateway/**'
              - 'plugins/plugin-native-location/**'
              - 'plugins/plugin-native-messages/**'
              - 'plugins/plugin-native-mobile-signals/**'
              - 'plugins/plugin-native-network-policy/**'
              - 'plugins/plugin-native-phone/**'
              - 'plugins/plugin-native-reminders/**'
              - 'plugins/plugin-native-secure-store/**'
              - 'plugins/plugin-native-settings/**'
              - 'plugins/plugin-native-shared-types/**'
              - 'plugins/plugin-native-swabble/**'
              - 'plugins/plugin-native-system/**'
              - 'plugins/plugin-native-talkmode/**'
              - 'plugins/plugin-native-websiteblocker/**'
              - 'plugins/plugin-native-wifi/**'
              - 'plugins/plugin-notes/**'
          - shard: plugins-o-z
            paths:
              - 'plugins/plugin-openai/**'
              - 'plugins/plugin-pdf/**'
              - 'plugins/plugin-personal-assistant/**'
              - 'plugins/plugin-native-phone/**'
              - 'plugins/plugin-pty/**'
              - 'plugins/plugin-relationships/**'
              - 'plugins/plugin-reminders/**'
              - 'plugins/plugin-scheduling/**'
              - 'plugins/plugin-slack/**'
              - 'plugins/plugin-sql/**'
              - 'plugins/plugin-sqlite/**'
              - 'plugins/plugin-telegram/**'
              - 'plugins/plugin-todos/**'
              - 'plugins/plugin-trajectory-logger/**'
              - 'plugins/plugin-video/**'
              - 'plugins/plugin-vision/**'
              - 'plugins/plugin-wallet/**'
              - 'plugins/plugin-web-search/**'
              - 'plugins/plugin-native-wifi/**'
              - 'plugins/plugin-workflow/**'
              - 'plugins/plugin-x/**'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
    env:
      CODEQL_PATHS_IGNORE_JSON: >-
        ["**/node_modules/**", "**/dist/**", "**/build/**", "**/.next/**", "**/.next-build-*/**", "**/.turbo/**", "**/coverage/**", "**/out/**", "**/.venv/**", "**/venv/**", "**/site-packages/**", "**/storybook-static/**", "**/dist-mobile/**", "**/dist-mobile-ios/**", "**/playwright-report/**", "**/ios/App/App/public/**", "**/android/app/src/main/assets/public/**", "**/platforms/android/app/src/main/assets/public/**", "**/platforms/*/tmp/**", "**/*.min.js", "**/__tests__/**", "**/__e2e__/**", "**/test/**", "**/tests/**", "**/testing/**", "**/test-utils/**", "**/fixture/**", "**/fixtures/**", "**/mocks/**", "**/stories/**", "**/*.test.ts", "**/*.test.tsx", "**/*.test.js", "**/*.test.jsx", "**/*.spec.ts", "**/*.spec.tsx", "**/*.spec.js", "**/*.spec.jsx", "**/*.bench.ts", "**/*.bench.tsx", "**/*.stories.ts", "**/*.stories.tsx", "**/aesthetic-audit-output-*/**", "packages/testing/**", "packages/app/scripts/bun-riscv64/**", "packages/scripts/test-console/**"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Report disk before CodeQL
        shell: bash
        run: |
          df -h
          du -sh "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Write shard CodeQL configuration
        shell: bash
        env:
          CODEQL_SHARD: ${{ matrix.shard }}
          CODEQL_PATHS_JSON: ${{ toJson(matrix.paths) }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const config = {
            name: `elizaOS CodeQL ${process.env.CODEQL_SHARD}`,
            paths: JSON.parse(process.env.CODEQL_PATHS_JSON),
            "paths-ignore": JSON.parse(process.env.CODEQL_PATHS_IGNORE_JSON),
          };
          writeFileSync(
            ".github/codeql-generated-config.yml",
            `${JSON.stringify(config)}\n`,
          );
          NODE

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: javascript-typescript
          build-mode: none
          # Generate one job-local config so multiline matrix JSON cannot become
          # malformed YAML and the seven shard definitions cannot drift.
          config-file: ./.github/codeql-generated-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          category: /language:javascript-typescript/shard:${{ matrix.shard }}
