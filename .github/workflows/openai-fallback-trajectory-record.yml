name: openai fallback regression check

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install workspace dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun packages/scripts/ensure-workspace-symlinks.ts
      - name: Run OpenRouter fallback tests
        working-directory: plugins/plugin-openai
        run: bunx vitest run __tests__/openrouter-fallback.wire.test.ts