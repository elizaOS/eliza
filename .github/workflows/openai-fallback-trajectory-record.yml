name: openai fallback trajectory record

on:
  push:
    branches:
      - "fix/openai-rate-limit-trajectory-record"
  pull_request:
    branches:
      - develop

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install workspace dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun packages/scripts/ensure-workspace-symlinks.ts
      - name: Run the OpenRouter fallback wire test
        working-directory: plugins/plugin-openai
        run: |
          cat > vitest.config.focus.ts <<'FOCUS'
          import path from "node:path";
          import base from "./vitest.config";

          const elizaRoot = path.resolve(import.meta.dirname, "../..");

          export default {
            ...base,
            resolve: {
              ...base.resolve,
              alias: [
                ...(base.resolve?.alias ?? []),
                {
                  find: /^@elizaos\/host\/(.*)$/,
                  replacement: path.join(elizaRoot, "packages/host/src/$1.ts"),
                },
                {
                  find: /^@elizaos\/core\/(.*)$/,
                  replacement: path.join(elizaRoot, "packages/core/src/$1.ts"),
                },
              ],
            },
          };
          FOCUS
          bunx vitest run --config ./vitest.config.focus.ts __tests__/openrouter-fallback.wire.test.ts
