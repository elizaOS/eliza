name: Android chat UDS proof

on:
  push:
    branches: [fix/android-chat-uds-proof-30785]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-chat-uds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-uds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --experimental-sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Record source and runtime identity
        run: |
          mkdir -p evidence/30785
          git rev-parse HEAD > evidence/30785/source-sha.txt
          git ls-tree HEAD plugins/plugin-local-inference/native/llama.cpp > evidence/30785/native-gitlink.txt
          node --version > evidence/30785/node-version.txt
          bun --version > evidence/30785/bun-version.txt
          sha256sum \
            plugins/plugin-local-inference/tsconfig.json \
            plugins/plugin-local-inference/vitest.config.ts \
            plugins/plugin-capacitor-bridge/tsup.config.ts \
            plugins/plugin-local-inference/src/services/bionic-host-loader.ts \
            plugins/plugin-local-inference/src/services/bionic-host-loader.test.ts \
            plugins/plugin-local-inference/src/services/active-model.ts \
            plugins/plugin-local-inference/src/services/runtime-services.ts \
            plugins/plugin-local-inference/src/runtime/ensure-local-inference-handler.ts \
            plugins/plugin-local-inference/src/runtime/ensure-local-inference-handler.test.ts \
            plugins/plugin-capacitor-bridge/src/bionic-chat-messages.ts \
            plugins/plugin-capacitor-bridge/src/mobile-device-bridge-bootstrap.ts \
            > evidence/30785/source-files.sha256
      - name: Install JavaScript contract dependencies
        run: bun install --frozen-lockfile --ignore-scripts 2>&1 | tee evidence/30785/install.log
      - name: Validate combined source inventory exclusions
        run: node --test packages/ui/scripts/find-duplicate-components.test.mjs 2>&1 | tee evidence/30785/source-inventory-tests.log
      - name: Exercise registered loader and real Linux abstract sockets
        working-directory: plugins/plugin-local-inference
        run: |
          bunx vitest run \
            src/runtime/device-bridge-service-ownership.test.ts \
            src/runtime/ensure-local-inference-handler.test.ts \
            src/services/runtime-services.test.ts \
            src/services/bionic-host-loader.test.ts \
            --reporter=default --reporter=json \
            --outputFile=../../evidence/30785/linux-tests.json \
            2>&1 | tee ../../evidence/30785/linux-tests.log
      - name: Reject skipped or empty proof
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('evidence/30785/linux-tests.json', 'utf8'));
          assert.equal(report.success, true);
          assert.ok(report.numTotalTests > 0);
          assert.equal(report.numFailedTests, 0);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numPassedTests, report.numTotalTests);
          fs.writeFileSync('evidence/30785/scope.json', JSON.stringify({
            source: process.env.GITHUB_SHA,
            platform: process.platform,
            node: process.version,
            tests: report.numTotalTests,
            scope: 'Registered loader forwarding and real Linux abstract-UDS framing; native responses supplied by the test host. Native model and Android app acceptance are separate evidence.'
          }, null, 2));
          JS
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-chat-uds-${{ github.sha }}
          path: evidence/30785/
          if-no-files-found: error
          retention-days: 30
