# Live Scenario Runner (nightly)
#
# Executes the executive-assistant, connector certification, plugin-health, and
# app-control scenarios against a live LLM runtime with real connector
# credentials and uploads the JSON report. Scheduled runs are enforcing: once the
# runner reaches scenario execution, any scenario failure or aggregate LLM-judge
# score below LIFEOPS_JUDGE_THRESHOLD fails the lane. Manual dispatch can still opt
# into report-only mode while debugging by leaving `enforce_gate` false. Missing
# setup prerequisites fail loudly and still upload a placeholder report artifact.
#
# Required repo secrets (self-documented):
#   LLM provider (at least one):
#     OPENAI_API_KEY
#     OPENROUTER_API_KEY
#     ANTHROPIC_API_KEY
#     GOOGLE_GENERATIVE_AI_API_KEY or GOOGLE_API_KEY
#     GROQ_API_KEY
#   Independent LLM judge (judge-independence, #9310):
#     CEREBRAS_API_KEY — grades judgeRubric/responseJudge checks on Cerebras
#     instead of the model under test. SCENARIO_JUDGE_REQUIRE_INDEPENDENT=1 is
#     set below, so runs without this secret FAIL their judged scenarios
#     (visible judge-availability gap) rather than silently self-grading.
#   Connector credentials (presence gates the relevant scenarios):
#     GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_OAUTH_REFRESH_TOKEN
#     GMAIL_TEST_ACCOUNT_EMAIL, GMAIL_TEST_ACCOUNT_REFRESH_TOKEN
#     CALENDLY_API_TOKEN
#     TELEGRAM_BOT_TOKEN, TELEGRAM_TEST_CHAT_ID, TELEGRAM_API_ID, TELEGRAM_API_HASH
#     DISCORD_BOT_TOKEN, DISCORD_TEST_GUILD_ID, DISCORD_TEST_CHANNEL_ID
#     SIGNAL_CLI_URL, SIGNAL_TEST_NUMBER
#     IMESSAGE_BRIDGE_URL, IMESSAGE_TEST_HANDLE
#     WHATSAPP_TOKEN, WHATSAPP_PHONE_ID, WHATSAPP_TEST_CONTACT
#     TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER, TWILIO_TEST_TO_NUMBER
#     X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET, X_TEST_DM_HANDLE
#     NOTIFICATION_RELAY_URL, NOTIFICATION_RELAY_TOKEN
#     TRAVEL_BOOKING_API_KEY
# Optional:
#   LIFEOPS_JUDGE_THRESHOLD (workflow input, default 0.8)
#   SCENARIO_FILTER        (comma-separated scenario ids, default all)
#   SCENARIO_ENFORCE_GATE  (schedule: enforced; manual input default false)
#   SKIP_REASON            (required if SCENARIO_SKIP is set)
#
# 1Password vault: this workflow's plain `*_API_KEY` secrets are sourced from the
# `eliza-e2e` 1Password vault. The vault must exist in 1Password and the
# corresponding GitHub Actions secrets must be configured on the
# `elizaOS/eliza` repo before this workflow can run successfully. See
# scenario-matrix.yml for the structured `ELIZA_E2E_*` connector secrets.

name: Live Scenarios

on:
  schedule:
    # 08:30 UTC daily — after upstream nightly at 04:00 UTC settles.
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      scenario_filter:
        description: "Comma-separated scenario ids (empty = all)"
        required: false
        type: string
        default: ""
      judge_threshold:
        description: "LLM-judge minimum pass score (0.0 - 1.0)"
        required: false
        type: string
        default: "0.8"
      skip_reason:
        description: "If you plan to skip any scenario, document why"
        required: false
        type: string
        default: ""
      enforce_gate:
        description: "Fail the workflow when live scenarios fail"
        required: false
        type: boolean
        default: false

concurrency:
  group: live-scenarios-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "canary"
  NODE_VERSION: "24.15.0"
  ELIZA_LIVE_TEST: "1"

permissions:
  contents: read
  actions: read

jobs:
  live-scenarios:
    name: Live scenarios (EA + connectors + health + app-control)
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --ignore-scripts --no-frozen-lockfile

      - name: Verify scenario-runner CLI present
        run: |
          test -f packages/scenario-runner/src/cli.ts || \
            { echo "scenario-runner CLI missing"; exit 1; }

      - name: Prepare live scenario report placeholder
        run: |
          mkdir -p artifacts/scenario-runs/live
          node - <<'NODE'
          const fs = require("node:fs");
          const report = {
            schema: "eliza_live_scenario_setup_v1",
            status: "setup_not_completed",
            generatedAt: new Date().toISOString(),
            note:
              "Placeholder written before build/setup. If this file is uploaded unchanged, the workflow failed before scenario execution and no live model trajectory was produced.",
            scenarios: [],
            totalCount: 0,
            passedCount: 0,
            failedCount: 0
          };
          fs.writeFileSync(
            "artifacts/lifeops-scenario-report.json",
            `${JSON.stringify(report, null, 2)}\n`,
          );
          NODE

      - name: Build live scenario runtime packages
        id: build
        # The live runner executes TypeScript sources directly, but its workspace
        # dependencies export dist/* entry points. Building the Turbo dependency
        # closure keeps those transitive exports available after the deliberately
        # script-free install without duplicating the package graph here.
        run: |
          node packages/scripts/run-turbo.mjs run build --filter=@elizaos/scenario-runner... --concurrency=8

      - name: Run EA + connector live scenarios
        id: run
        env:
          # The scenario runner executes workspace TypeScript directly. Keep
          # transitive workspace imports on source exports; the build step above
          # remains responsible only for generated and native artifacts.
          NODE_OPTIONS: "--conditions=eliza-source"
          # LLM providers
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Independent LLM judge (#9310): judge on Cerebras, never the model
          # under test. Strict mode fails self-graded scenarios so a missing
          # key is a visible judge-availability gap, not silent self-grading.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          # Google Workspace
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GMAIL_TEST_ACCOUNT_EMAIL: ${{ secrets.GMAIL_TEST_ACCOUNT_EMAIL }}
          GMAIL_TEST_ACCOUNT_REFRESH_TOKEN: ${{ secrets.GMAIL_TEST_ACCOUNT_REFRESH_TOKEN }}
          # Calendly
          CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN }}
          # Messaging
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TEST_GUILD_ID: ${{ secrets.DISCORD_TEST_GUILD_ID }}
          DISCORD_TEST_CHANNEL_ID: ${{ secrets.DISCORD_TEST_CHANNEL_ID }}
          SIGNAL_CLI_URL: ${{ secrets.SIGNAL_CLI_URL }}
          SIGNAL_TEST_NUMBER: ${{ secrets.SIGNAL_TEST_NUMBER }}
          IMESSAGE_BRIDGE_URL: ${{ secrets.IMESSAGE_BRIDGE_URL }}
          IMESSAGE_TEST_HANDLE: ${{ secrets.IMESSAGE_TEST_HANDLE }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TEST_CONTACT: ${{ secrets.WHATSAPP_TEST_CONTACT }}
          # Twilio SMS/Voice
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TEST_TO_NUMBER: ${{ secrets.TWILIO_TEST_TO_NUMBER }}
          # X / DM
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_TEST_DM_HANDLE: ${{ secrets.X_TEST_DM_HANDLE }}
          # Push notifications + travel
          NOTIFICATION_RELAY_URL: ${{ secrets.NOTIFICATION_RELAY_URL }}
          NOTIFICATION_RELAY_TOKEN: ${{ secrets.NOTIFICATION_RELAY_TOKEN }}
          TRAVEL_BOOKING_API_KEY: ${{ secrets.TRAVEL_BOOKING_API_KEY }}
          # Run controls
          SCENARIO_FILTER: ${{ inputs.scenario_filter }}
          LIFEOPS_JUDGE_THRESHOLD: ${{ inputs.judge_threshold || '0.8' }}
          SCENARIO_ENFORCE_GATE: ${{ github.event_name == 'schedule' && '1' || (inputs.enforce_gate && '1' || '0') }}
          SKIP_REASON: ${{ inputs.skip_reason }}
          REPORT_PATH: artifacts/lifeops-scenario-report.json
          RUN_DIR: artifacts/scenario-runs/live
        run: node packages/scripts/run-live-scenarios.mjs

      - name: Run plugin-health live scenarios
        id: run-health
        env:
          NODE_OPTIONS: "--conditions=eliza-source"
          # LLM providers
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Independent LLM judge (#9310): judge on Cerebras, never the model
          # under test.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          # Run controls
          SCENARIO_ROOT: plugins/plugin-health/test/scenarios
          SCENARIO_FILTER: ${{ inputs.scenario_filter }}
          LIFEOPS_JUDGE_THRESHOLD: ${{ inputs.judge_threshold || '0.8' }}
          SCENARIO_ENFORCE_GATE: ${{ github.event_name == 'schedule' && '1' || (inputs.enforce_gate && '1' || '0') }}
          SKIP_REASON: ${{ inputs.skip_reason }}
          REPORT_PATH: artifacts/plugin-health-scenario-report.json
          RUN_DIR: artifacts/scenario-runs/plugin-health
          EXPORT_NATIVE_PATH: artifacts/scenario-runs/plugin-health/native.jsonl
        run: node packages/scripts/run-live-scenarios.mjs --lane live-only

      - name: Run app-control live scenarios
        id: run-app-control
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NODE_OPTIONS: "--conditions=eliza-source"
          # LLM providers
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Independent LLM judge (#9310): judge on Cerebras, never the model
          # under test.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          # Run controls
          SCENARIO_ROOT: plugins/plugin-app-control/test/scenarios
          SCENARIO_FILTER: ${{ inputs.scenario_filter }}
          SCENARIO_TURN_TIMEOUT_MS: "240000"
          LIFEOPS_JUDGE_THRESHOLD: ${{ inputs.judge_threshold || '0.8' }}
          SCENARIO_ENFORCE_GATE: ${{ github.event_name == 'schedule' && '1' || (inputs.enforce_gate && '1' || '0') }}
          SKIP_REASON: ${{ inputs.skip_reason }}
          REPORT_PATH: artifacts/app-control-scenario-report.json
          RUN_DIR: artifacts/scenario-runs/app-control
          EXPORT_NATIVE_PATH: artifacts/scenario-runs/app-control/native.jsonl
        run: node packages/scripts/run-live-scenarios.mjs --lane live-only

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lifeops-scenario-report
          path: |
            artifacts/lifeops-scenario-report.json
            artifacts/plugin-health-scenario-report.json
            artifacts/app-control-scenario-report.json
            artifacts/scenario-runs/live/
            artifacts/scenario-runs/plugin-health/
            artifacts/scenario-runs/app-control/
          if-no-files-found: warn
          retention-days: 30
