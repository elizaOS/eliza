# Live Scenario Runner (nightly)
#
# Executes the executive-assistant, connector certification, plugin-health,
# app-control, and scenario-runner view-chat scenarios against a live LLM
# runtime with real credentials. Scheduled runs are enforcing: once the runner
# reaches scenario execution, any scenario failure or aggregate LLM-judge score
# below LIFEOPS_JUDGE_THRESHOLD fails the lane. Manual dispatch can select one
# named shard and filter inside that shard; it can also opt into report-only mode
# while debugging by leaving `enforce_gate` false. Missing setup prerequisites
# fail loudly and still upload a placeholder report artifact.
#
# Required repo secrets (self-documented):
#   LLM provider (at least one):
#     OPENAI_API_KEY
#     OPENROUTER_API_KEY
#     ANTHROPIC_API_KEY
#     GOOGLE_GENERATIVE_AI_API_KEY or GOOGLE_API_KEY
#     GROQ_API_KEY
#   Independent LLM judge (judge-independence, #9310):
#     CEREBRAS_API_KEY — grades judgeRubric/responseJudge checks on Cerebras
#     instead of the model under test. SCENARIO_JUDGE_REQUIRE_INDEPENDENT=1 is
#     set below, so runs without this secret FAIL their judged scenarios
#     (visible judge-availability gap) rather than silently self-grading.
#   Connector credentials (presence gates the relevant scenarios):
#     GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_OAUTH_REFRESH_TOKEN
#     GMAIL_TEST_ACCOUNT_EMAIL, GMAIL_TEST_ACCOUNT_REFRESH_TOKEN
#     CALENDLY_API_TOKEN
#     TELEGRAM_BOT_TOKEN, TELEGRAM_TEST_CHAT_ID, TELEGRAM_API_ID, TELEGRAM_API_HASH
#     DISCORD_BOT_TOKEN, DISCORD_TEST_GUILD_ID, DISCORD_TEST_CHANNEL_ID
#     SIGNAL_CLI_URL, SIGNAL_TEST_NUMBER
#     IMESSAGE_BRIDGE_URL, IMESSAGE_TEST_HANDLE
#     WHATSAPP_TOKEN, WHATSAPP_PHONE_ID, WHATSAPP_TEST_CONTACT
#     TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER, TWILIO_TEST_TO_NUMBER
#     X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET, X_TEST_DM_HANDLE
#     NOTIFICATION_RELAY_URL, NOTIFICATION_RELAY_TOKEN
#     TRAVEL_BOOKING_API_KEY
# Optional:
#   LIFEOPS_JUDGE_THRESHOLD (workflow input, default 0.8)
#   SCENARIO_SHARD         (manual choice; scheduled runs execute all shards)
#   SCENARIO_FILTER        (comma-separated ids inside one selected manual shard)
#   SCENARIO_ENFORCE_GATE  (schedule: enforced; manual input default false)
#   SKIP_REASON            (required if SCENARIO_SKIP is set)
#
# 1Password vault: this workflow's plain `*_API_KEY` secrets are sourced from the
# `eliza-e2e` 1Password vault. The vault must exist in 1Password and the
# corresponding GitHub Actions secrets must be configured on the
# `elizaOS/eliza` repo before this workflow can run successfully. Structured
# per-account `ELIZA_E2E_*` coverage is tracked in #16448; this authority
# exposes only the canonical runtime credentials listed above.

name: Live Scenarios

on:
  schedule:
    # 08:30 UTC daily — after upstream nightly at 04:00 UTC settles.
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      scenario_filter:
        description: "Scenario ids inside scenario_shard (empty = shard default)"
        required: false
        type: string
        default: ""
      scenario_shard:
        description: "Named shard to run (filters require a single named shard)"
        required: true
        type: choice
        default: "lifeops-connectors"
        options:
          - all
          - lifeops-connectors
          - plugin-health
          - app-control
          - scenario-runner-view-chat
      judge_threshold:
        description: "LLM-judge minimum pass score (0.0 - 1.0)"
        required: false
        type: string
        default: "0.8"
      skip_reason:
        description: "If you plan to skip any scenario, document why"
        required: false
        type: string
        default: ""
      enforce_gate:
        description: "Fail the workflow when live scenarios fail"
        required: false
        type: boolean
        default: false

concurrency:
  group: live-scenarios-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "canary"
  NODE_VERSION: "24.15.0"
  ELIZA_LIVE_TEST: "1"

permissions:
  contents: read
  actions: read

jobs:
  live-scenarios:
    name: Live scenarios (EA + connectors + health + app-control + view-chat)
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --ignore-scripts --no-frozen-lockfile

      - name: Verify scenario-runner CLI present
        run: |
          test -f packages/scenario-runner/src/cli.ts || \
            { echo "scenario-runner CLI missing"; exit 1; }

      - name: Prepare live scenario report placeholder
        run: |
          mkdir -p \
            artifacts/scenario-runs/live \
            artifacts/scenario-runs/plugin-health \
            artifacts/scenario-runs/app-control \
            artifacts/scenario-runs/scenario-runner-view-chat
          node - <<'NODE'
          const fs = require("node:fs");
          for (const [shard, output] of [
            ["lifeops-connectors", "artifacts/lifeops-scenario-report.json"],
            ["plugin-health", "artifacts/plugin-health-scenario-report.json"],
            ["app-control", "artifacts/app-control-scenario-report.json"],
            ["scenario-runner-view-chat", "artifacts/scenario-runner-view-chat-report.json"],
          ]) {
            const report = {
              schema: "eliza_live_scenario_setup_v1",
              shard,
              status: "setup_not_completed",
              generatedAt: new Date().toISOString(),
              note:
                "Placeholder written before build/setup. If this file is uploaded unchanged, the workflow failed before scenario execution and no live model trajectory was produced.",
              scenarios: [],
              totalCount: 0,
              passedCount: 0,
              failedCount: 0
            };
            fs.writeFileSync(output, `${JSON.stringify(report, null, 2)}\n`);
          }
          NODE

      - name: Resolve manual shard selection
        id: selection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SCENARIO_FILTER: ${{ inputs.scenario_filter }}
          SCENARIO_SHARD: ${{ inputs.scenario_shard }}
        run: |
          selected="${SCENARIO_SHARD:-lifeops-connectors}"
          # A workflow_dispatch request is validated against the default-branch
          # input schema. The prefix lets an exact-head run select a new shard
          # before this workflow revision itself reaches the default branch.
          case "$SCENARIO_FILTER" in
            lifeops-connectors:*) selected="lifeops-connectors" ;;
            plugin-health:*) selected="plugin-health" ;;
            app-control:*) selected="app-control" ;;
            scenario-runner-view-chat:*) selected="scenario-runner-view-chat" ;;
          esac

          case "$selected" in
            all|lifeops-connectors|plugin-health|app-control|scenario-runner-view-chat) ;;
            *)
              echo "unknown scenario_shard: $selected" >&2
              exit 2
              ;;
          esac

          if [ -n "$SCENARIO_FILTER" ] && [ "$selected" = "all" ]; then
            echo "scenario_filter requires one named scenario_shard; 'all' is ambiguous" >&2
            exit 2
          fi
          echo "shard=$selected" >> "$GITHUB_OUTPUT"

      - name: Validate authoritative shard prerequisites
        id: preflight
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          status=0
          for shard in lifeops-connectors plugin-health app-control scenario-runner-view-chat; do
            node packages/scripts/live-scenario-contract.mjs preflight "$shard" || status=$?
          done
          exit "$status"

      - name: Build live scenario runtime packages
        id: build
        if: ${{ steps.preflight.outcome == 'success' }}
        # The live runner executes TypeScript sources directly, but several
        # workspace packages intentionally export dist/* entry points. Because
        # dependency installation ignores postinstall scripts, build only the
        # packages that the live scenario runtime imports through those exports.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "::group::Build packages/core"
          bun run --cwd packages/core build
          echo "::endgroup::"

          echo "::group::Build packages/shared"
          # plugin-agent-skills (and others) consume @elizaos/shared via dist
          # exports (RouteRequestContext, ReadJsonBodyOptions, route schemas).
          # Must build before any plugin that imports from it.
          bun run --cwd packages/shared build
          echo "::endgroup::"

          echo "::group::Build packages/skills"
          # plugin-agent-skills imports @elizaos/skills via its dist exports
          # (getSkillsDir, loadSkills, formatSkillsForPrompt). Must build
          # before plugin-agent-skills typechecks its declaration emit.
          bun run --cwd packages/skills build
          echo "::endgroup::"

          echo "::group::Build packages/cloud/sdk"
          bun run --cwd packages/cloud/sdk build
          echo "::endgroup::"

          echo "::group::Build plugins/plugin-commands"
          # plugin-telegram's command-registration.ts imports @elizaos/plugin-commands
          # via its dist exports (ConnectorCommand, getConnectorCommands,
          # resolveCommand, …). Because installs run with --ignore-scripts this
          # workspace dependency is never built implicitly, so plugin-telegram's
          # `tsc` declaration emit fails with TS2307 "Cannot find module
          # '@elizaos/plugin-commands'". Build it before the connector loop below.
          bun run --cwd plugins/plugin-commands build
          echo "::endgroup::"

          provider_package=""
          if [ -n "${GROQ_API_KEY:-}" ]; then
            provider_package="plugins/plugin-groq"
          elif [ -n "${OPENAI_API_KEY:-}" ]; then
            provider_package="plugins/plugin-openai"
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            provider_package="plugins/plugin-anthropic"
          elif [ -n "${GOOGLE_GENERATIVE_AI_API_KEY:-}" ] || [ -n "${GOOGLE_API_KEY:-}" ]; then
            provider_package="plugins/plugin-google-genai"
          elif [ -n "${OPENROUTER_API_KEY:-}" ]; then
            provider_package="plugins/plugin-openrouter"
          fi

          package_dirs=(
            plugins/plugin-sql
            plugins/plugin-blocker
            plugins/plugin-browser
            plugins/plugin-native-calendar
            plugins/plugin-native-activity-tracker
            plugins/plugin-native-mobile-signals
            plugins/plugin-native-reminders
            plugins/plugin-scheduling
            plugins/plugin-calendar
            plugins/plugin-finances
            plugins/plugin-goals
            plugins/plugin-inbox
            plugins/plugin-reminders
            plugins/plugin-calendly
            plugins/plugin-discord
            plugins/plugin-elizacloud
            plugins/plugin-google
            plugins/plugin-phone
            plugins/plugin-remote-desktop
            plugins/plugin-x
            plugins/plugin-local-inference
            plugins/plugin-app-control
            plugins/plugin-agent-skills
            plugins/plugin-health
            plugins/plugin-wallet
            plugins/plugin-pdf
            plugins/plugin-form
            plugins/plugin-personal-assistant
            plugins/plugin-telegram
            plugins/plugin-whatsapp
            plugins/plugin-signal
            plugins/plugin-imessage
          )
          if [ -n "$provider_package" ]; then
            package_dirs+=("$provider_package")
          fi

          for package_dir in "${package_dirs[@]}"; do
            echo "::group::Build ${package_dir}"
            bun run --cwd "$package_dir" build
            echo "::endgroup::"
          done

      - name: Run EA + connector live scenarios
        id: run
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name == 'schedule' || steps.selection.outputs.shard == 'all' || steps.selection.outputs.shard == 'lifeops-connectors') }}
        continue-on-error: true
        env:
          # The runner and ordinary workspace dependencies stay on checkout
          # sources; generated/native and dist-only artifacts come from the
          # dependency-closure build above.
          NODE_OPTIONS: "--conditions=eliza-source"
          # LLM providers
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Independent LLM judge (#9310): judge on Cerebras, never the model
          # under test. Strict mode fails self-graded scenarios so a missing
          # key is a visible judge-availability gap, not silent self-grading.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          # Google Workspace
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GMAIL_TEST_ACCOUNT_EMAIL: ${{ secrets.GMAIL_TEST_ACCOUNT_EMAIL }}
          GMAIL_TEST_ACCOUNT_REFRESH_TOKEN: ${{ secrets.GMAIL_TEST_ACCOUNT_REFRESH_TOKEN }}
          # Calendly
          CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN }}
          # Messaging
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TEST_GUILD_ID: ${{ secrets.DISCORD_TEST_GUILD_ID }}
          DISCORD_TEST_CHANNEL_ID: ${{ secrets.DISCORD_TEST_CHANNEL_ID }}
          SIGNAL_CLI_URL: ${{ secrets.SIGNAL_CLI_URL }}
          SIGNAL_TEST_NUMBER: ${{ secrets.SIGNAL_TEST_NUMBER }}
          IMESSAGE_BRIDGE_URL: ${{ secrets.IMESSAGE_BRIDGE_URL }}
          IMESSAGE_TEST_HANDLE: ${{ secrets.IMESSAGE_TEST_HANDLE }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TEST_CONTACT: ${{ secrets.WHATSAPP_TEST_CONTACT }}
          # Twilio SMS/Voice
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TEST_TO_NUMBER: ${{ secrets.TWILIO_TEST_TO_NUMBER }}
          # X / DM
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_TEST_DM_HANDLE: ${{ secrets.X_TEST_DM_HANDLE }}
          # Push notifications + travel
          NOTIFICATION_RELAY_URL: ${{ secrets.NOTIFICATION_RELAY_URL }}
          NOTIFICATION_RELAY_TOKEN: ${{ secrets.NOTIFICATION_RELAY_TOKEN }}
          TRAVEL_BOOKING_API_KEY: ${{ secrets.TRAVEL_BOOKING_API_KEY }}
          # Run controls
          SCENARIO_SHARD: lifeops-connectors
          SCENARIO_FILTER: ${{ inputs.scenario_filter }}
          LIFEOPS_JUDGE_THRESHOLD: ${{ inputs.judge_threshold || '0.8' }}
          SCENARIO_ENFORCE_GATE: ${{ github.event_name == 'schedule' && '1' || (inputs.enforce_gate && '1' || '0') }}
          SKIP_REASON: ${{ inputs.skip_reason }}
          REPORT_PATH: artifacts/lifeops-scenario-report.json
          RUN_DIR: artifacts/scenario-runs/live
        run: |
          set -o pipefail
          mkdir -p artifacts/scenario-runs/live
          node packages/scripts/run-live-scenarios.mjs 2>&1 | tee artifacts/scenario-runs/live/runner.log

      - name: Run plugin-health live scenarios
        id: run-health
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name == 'schedule' || steps.selection.outputs.shard == 'all' || steps.selection.outputs.shard == 'plugin-health') }}
        continue-on-error: true
        env:
          NODE_OPTIONS: "--conditions=eliza-source"
          # LLM providers
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Independent LLM judge (#9310): judge on Cerebras, never the model
          # under test.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          # Run controls
          SCENARIO_ROOT: plugins/plugin-health/test/scenarios
          SCENARIO_SHARD: plugin-health
          SCENARIO_FILTER: ${{ inputs.scenario_filter }}
          LIFEOPS_JUDGE_THRESHOLD: ${{ inputs.judge_threshold || '0.8' }}
          SCENARIO_ENFORCE_GATE: ${{ github.event_name == 'schedule' && '1' || (inputs.enforce_gate && '1' || '0') }}
          SKIP_REASON: ${{ inputs.skip_reason }}
          REPORT_PATH: artifacts/plugin-health-scenario-report.json
          RUN_DIR: artifacts/scenario-runs/plugin-health
          EXPORT_NATIVE_PATH: artifacts/scenario-runs/plugin-health/native.jsonl
        run: |
          set -o pipefail
          mkdir -p artifacts/scenario-runs/plugin-health
          node packages/scripts/run-live-scenarios.mjs --lane live-only 2>&1 | tee artifacts/scenario-runs/plugin-health/runner.log

      - name: Run app-control live scenarios
        id: run-app-control
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name == 'schedule' || steps.selection.outputs.shard == 'all' || steps.selection.outputs.shard == 'app-control') }}
        continue-on-error: true
        env:
          NODE_OPTIONS: "--conditions=eliza-source"
          # LLM providers
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Independent LLM judge (#9310): judge on Cerebras, never the model
          # under test.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          # Run controls
          SCENARIO_ROOT: plugins/plugin-app-control/test/scenarios
          SCENARIO_SHARD: app-control
          SCENARIO_FILTER: ${{ inputs.scenario_filter }}
          LIFEOPS_JUDGE_THRESHOLD: ${{ inputs.judge_threshold || '0.8' }}
          SCENARIO_ENFORCE_GATE: ${{ github.event_name == 'schedule' && '1' || (inputs.enforce_gate && '1' || '0') }}
          SKIP_REASON: ${{ inputs.skip_reason }}
          REPORT_PATH: artifacts/app-control-scenario-report.json
          RUN_DIR: artifacts/scenario-runs/app-control
          EXPORT_NATIVE_PATH: artifacts/scenario-runs/app-control/native.jsonl
        run: |
          set -o pipefail
          mkdir -p artifacts/scenario-runs/app-control
          node packages/scripts/run-live-scenarios.mjs --lane live-only 2>&1 | tee artifacts/scenario-runs/app-control/runner.log

      - name: Run scenario-runner view-chat live scenarios
        id: run-view-chat
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name == 'schedule' || steps.selection.outputs.shard == 'all' || steps.selection.outputs.shard == 'scenario-runner-view-chat') }}
        continue-on-error: true
        env:
          NODE_OPTIONS: "--conditions=eliza-source"
          # LLM providers
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Independent LLM judge (#9310): judge on Cerebras, never the model
          # under test.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          # This shard deliberately owns a bounded subset of the runner's
          # mixed-purpose live catalog. A selected manual filter may narrow it
          # further; scheduled/all runs execute the declared shard default.
          SCENARIO_ROOT: packages/scenario-runner/test/scenarios
          SCENARIO_SHARD: scenario-runner-view-chat
          SCENARIO_FILTER: ${{ inputs.scenario_filter || 'live-document-delete' }}
          LIFEOPS_JUDGE_THRESHOLD: ${{ inputs.judge_threshold || '0.8' }}
          SCENARIO_ENFORCE_GATE: ${{ github.event_name == 'schedule' && '1' || (inputs.enforce_gate && '1' || '0') }}
          SKIP_REASON: ${{ inputs.skip_reason }}
          REPORT_PATH: artifacts/scenario-runner-view-chat-report.json
          RUN_DIR: artifacts/scenario-runs/scenario-runner-view-chat
          EXPORT_NATIVE_PATH: artifacts/scenario-runs/scenario-runner-view-chat/native.jsonl
        run: |
          set -o pipefail
          mkdir -p artifacts/scenario-runs/scenario-runner-view-chat
          node packages/scripts/run-live-scenarios.mjs --lane live-only 2>&1 | tee artifacts/scenario-runs/scenario-runner-view-chat/runner.log

      - name: Verify every requested shard published its evidence contract
        id: verify-evidence
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          SCENARIO_SHARD: ${{ github.event_name == 'schedule' && 'all' || steps.selection.outputs.shard }}
        run: |
          for shard in lifeops-connectors plugin-health app-control scenario-runner-view-chat; do
            if [ "$SCENARIO_SHARD" = "all" ] || [ "$SCENARIO_SHARD" = "$shard" ]; then
              node packages/scripts/live-scenario-contract.mjs verify "$shard"
            fi
          done

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lifeops-scenario-report
          path: |
            artifacts/lifeops-scenario-report.json
            artifacts/plugin-health-scenario-report.json
            artifacts/app-control-scenario-report.json
            artifacts/scenario-runner-view-chat-report.json
            artifacts/scenario-runs/live/
            artifacts/scenario-runs/plugin-health/
            artifacts/scenario-runs/app-control/
            artifacts/scenario-runs/scenario-runner-view-chat/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce aggregate shard result
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LIFEOPS_OUTCOME: ${{ steps.run.outcome }}
          HEALTH_OUTCOME: ${{ steps.run-health.outcome }}
          APP_CONTROL_OUTCOME: ${{ steps.run-app-control.outcome }}
          VIEW_CHAT_OUTCOME: ${{ steps.run-view-chat.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.verify-evidence.outcome }}
          SCENARIO_SHARD: ${{ github.event_name == 'schedule' && 'all' || steps.selection.outputs.shard }}
        run: |
          node - <<'NODE'
          const required = ["PREFLIGHT_OUTCOME", "BUILD_OUTCOME", "EVIDENCE_OUTCOME"];
          const shardOutcome = {
            "lifeops-connectors": "LIFEOPS_OUTCOME",
            "plugin-health": "HEALTH_OUTCOME",
            "app-control": "APP_CONTROL_OUTCOME",
            "scenario-runner-view-chat": "VIEW_CHAT_OUTCOME",
          };
          const selected = process.env.SCENARIO_SHARD || "all";
          if (selected === "all") {
            required.push(...Object.values(shardOutcome));
          } else {
            const outcome = shardOutcome[selected];
            if (!outcome) {
              console.error(`Unknown live scenario shard: ${selected}`);
              process.exit(2);
            }
            required.push(outcome);
          }
          const failures = required.filter((name) => process.env[name] !== "success");
          if (failures.length) {
            console.error(`Live scenario authority failed: ${failures.map((name) => `${name}=${process.env[name] || "missing"}`).join(", ")}`);
            process.exit(1);
          }
          console.log(`All requested live scenario shards and evidence contracts succeeded: ${required.join(", ")}`);
          NODE
