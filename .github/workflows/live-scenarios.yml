# Credentialed live scenario authority.
#
# Scheduled runs execute every runnable shard in
# packages/scripts/live-scenario-shards.json against a live model and real
# connector credentials. Manual dispatch may select one shard for focused
# evidence; a scenario-id filter is accepted only with that explicit shard so
# every other matrix leg cannot masquerade as a successful empty run.
#
# The manifest deliberately excludes platform-gated catalogs that have no
# provisioned runner. packages/scripts/check-scenario-workflow-coverage.mjs
# classifies those separately and fails when any other live-only scenario falls
# outside this authority. Every shard exports its report, viewer trajectories,
# and native JSONL even when execution fails.

name: Live Scenarios

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Scenario shard to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - executive-connectors
          - messaging
          - todos-reminders
          - calendar
          - relationships
          - browser-social
          - personality-payments
          - cross-cutting-gateway
          - lifeops-app
          - plugin-health
          - app-control
      scenario_filter:
        description: "Comma-separated scenario ids (requires one selected shard)"
        required: false
        type: string
        default: ""
      judge_threshold:
        description: "LLM-judge minimum pass score (0.0 - 1.0)"
        required: false
        type: string
        default: "0.8"
      skip_reason:
        description: "Concrete reason for an intentional scenario skip"
        required: false
        type: string
        default: ""
      enforce_gate:
        description: "Fail the workflow when live scenarios fail"
        required: false
        type: boolean
        default: false

concurrency:
  group: live-scenarios-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "canary"
  NODE_VERSION: "24.15.0"
  ELIZA_LIVE_TEST: "1"
  ELIZA_LIVE_SCENARIO_TEST: "1"

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Resolve live scenario shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          submodules: false

      - name: Select canonical shard matrix
        id: matrix
        env:
          SELECTED_SHARD: ${{ inputs.shard || 'all' }}
          SCENARIO_FILTER_INPUT: ${{ inputs.scenario_filter }}
        run: |
          set -euo pipefail
          if [ -n "$SCENARIO_FILTER_INPUT" ] && [ "$SELECTED_SHARD" = "all" ]; then
            echo "scenario_filter requires one explicit shard" >&2
            exit 1
          fi
          node packages/scripts/live-scenario-matrix.mjs \
            --shard "$SELECTED_SHARD" \
            --github-output

  live-scenarios:
    name: Live scenario · ${{ matrix.shard.name }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 120
    env:
      NODE_OPTIONS: "--max-old-space-size=8192 --conditions=eliza-source"

      # Provider names used by the runtime.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.ELIZA_E2E_OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.ELIZA_E2E_OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ELIZA_E2E_ANTHROPIC_API_KEY }} # gitleaks:allow - secret references, not credential values.
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.ELIZA_E2E_GOOGLE_GENERATIVE_AI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.ELIZA_E2E_GROQ_API_KEY }} # gitleaks:allow - secret references, not credential values.
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"

      # Runtime connector names retained by the original live authority.
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GMAIL_TEST_ACCOUNT_EMAIL: ${{ secrets.GMAIL_TEST_ACCOUNT_EMAIL }}
      GMAIL_TEST_ACCOUNT_REFRESH_TOKEN: ${{ secrets.GMAIL_TEST_ACCOUNT_REFRESH_TOKEN }}
      CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN || secrets.ELIZA_E2E_CALENDLY_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.ELIZA_E2E_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || secrets.ELIZA_E2E_TELEGRAM_CHAT_ID }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || secrets.ELIZA_E2E_TELEGRAM_APP_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || secrets.ELIZA_E2E_TELEGRAM_APP_HASH }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.ELIZA_E2E_DISCORD_BOT_TOKEN }}
      DISCORD_TEST_GUILD_ID: ${{ secrets.DISCORD_TEST_GUILD_ID || secrets.ELIZA_E2E_DISCORD_QA_GUILD_ID }}
      DISCORD_TEST_CHANNEL_ID: ${{ secrets.DISCORD_TEST_CHANNEL_ID || secrets.ELIZA_E2E_DISCORD_QA_CHANNEL_ID }}
      SIGNAL_CLI_URL: ${{ secrets.SIGNAL_CLI_URL }}
      SIGNAL_TEST_NUMBER: ${{ secrets.SIGNAL_TEST_NUMBER || secrets.ELIZA_E2E_SIGNAL_PHONE_NUMBER }}
      IMESSAGE_BRIDGE_URL: ${{ secrets.IMESSAGE_BRIDGE_URL }}
      IMESSAGE_TEST_HANDLE: ${{ secrets.IMESSAGE_TEST_HANDLE }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN || secrets.ELIZA_E2E_WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID || secrets.ELIZA_E2E_WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TEST_CONTACT: ${{ secrets.WHATSAPP_TEST_CONTACT || secrets.ELIZA_E2E_WHATSAPP_RECIPIENT_PHONE_NUMBER }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID || secrets.ELIZA_E2E_TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER || secrets.ELIZA_E2E_TWILIO_VOICE_FROM }} # gitleaks:allow - secret references, not credential values.
      TWILIO_TEST_TO_NUMBER: ${{ secrets.TWILIO_TEST_TO_NUMBER || secrets.ELIZA_E2E_TWILIO_RECIPIENT }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_TEST_DM_HANDLE: ${{ secrets.X_TEST_DM_HANDLE || secrets.ELIZA_E2E_TWITTER_FRIEND_HANDLE }}
      NOTIFICATION_RELAY_URL: ${{ secrets.NOTIFICATION_RELAY_URL }}
      NOTIFICATION_RELAY_TOKEN: ${{ secrets.NOTIFICATION_RELAY_TOKEN }}
      TRAVEL_BOOKING_API_KEY: ${{ secrets.TRAVEL_BOOKING_API_KEY }}

      # Structured eliza-e2e vault names consumed by connector-specific paths.
      ELIZA_E2E_GROQ_API_KEY: ${{ secrets.ELIZA_E2E_GROQ_API_KEY || secrets.GROQ_API_KEY }}
      ELIZA_E2E_OPENAI_API_KEY: ${{ secrets.ELIZA_E2E_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      ELIZA_E2E_ANTHROPIC_API_KEY: ${{ secrets.ELIZA_E2E_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
      ELIZA_E2E_GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.ELIZA_E2E_GOOGLE_GENERATIVE_AI_API_KEY || secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.GOOGLE_API_KEY }}
      ELIZA_E2E_OPENROUTER_API_KEY: ${{ secrets.ELIZA_E2E_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      ELIZA_E2E_GMAIL_TESTOWNER_CLIENT_ID: ${{ secrets.ELIZA_E2E_GMAIL_TESTOWNER_CLIENT_ID }}
      ELIZA_E2E_GMAIL_TESTOWNER_CLIENT_SECRET: ${{ secrets.ELIZA_E2E_GMAIL_TESTOWNER_CLIENT_SECRET }}
      ELIZA_E2E_GMAIL_TESTOWNER_REFRESH_TOKEN: ${{ secrets.ELIZA_E2E_GMAIL_TESTOWNER_REFRESH_TOKEN }}
      ELIZA_E2E_GMAIL_TESTOWNER_ADDRESS: ${{ secrets.ELIZA_E2E_GMAIL_TESTOWNER_ADDRESS }}
      ELIZA_E2E_GMAIL_TESTAGENT_CLIENT_ID: ${{ secrets.ELIZA_E2E_GMAIL_TESTAGENT_CLIENT_ID }}
      ELIZA_E2E_GMAIL_TESTAGENT_CLIENT_SECRET: ${{ secrets.ELIZA_E2E_GMAIL_TESTAGENT_CLIENT_SECRET }}
      ELIZA_E2E_GMAIL_TESTAGENT_REFRESH_TOKEN: ${{ secrets.ELIZA_E2E_GMAIL_TESTAGENT_REFRESH_TOKEN }}
      ELIZA_E2E_GMAIL_TESTAGENT_ADDRESS: ${{ secrets.ELIZA_E2E_GMAIL_TESTAGENT_ADDRESS }}
      ELIZA_E2E_CALENDLY_ACCESS_TOKEN: ${{ secrets.ELIZA_E2E_CALENDLY_ACCESS_TOKEN }}
      ELIZA_E2E_CALENDLY_HOST_URI: ${{ secrets.ELIZA_E2E_CALENDLY_HOST_URI }}
      ELIZA_E2E_CALENDLY_EVENT_TYPE_URI: ${{ secrets.ELIZA_E2E_CALENDLY_EVENT_TYPE_URI }}
      ELIZA_E2E_DISCORD_BOT_TOKEN: ${{ secrets.ELIZA_E2E_DISCORD_BOT_TOKEN }}
      ELIZA_E2E_DISCORD_CLIENT_ID: ${{ secrets.ELIZA_E2E_DISCORD_CLIENT_ID }}
      ELIZA_E2E_DISCORD_CLIENT_SECRET: ${{ secrets.ELIZA_E2E_DISCORD_CLIENT_SECRET }}
      ELIZA_E2E_DISCORD_QA_GUILD_ID: ${{ secrets.ELIZA_E2E_DISCORD_QA_GUILD_ID }}
      ELIZA_E2E_DISCORD_QA_CHANNEL_ID: ${{ secrets.ELIZA_E2E_DISCORD_QA_CHANNEL_ID }}
      ELIZA_E2E_DISCORD_USER_RELAY_TOKEN: ${{ secrets.ELIZA_E2E_DISCORD_USER_RELAY_TOKEN }}
      ELIZA_E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.ELIZA_E2E_TELEGRAM_BOT_TOKEN }}
      ELIZA_E2E_TELEGRAM_APP_ID: ${{ secrets.ELIZA_E2E_TELEGRAM_APP_ID }}
      ELIZA_E2E_TELEGRAM_APP_HASH: ${{ secrets.ELIZA_E2E_TELEGRAM_APP_HASH }}
      ELIZA_E2E_TELEGRAM_USERBOT_PHONE_NUMBER: ${{ secrets.ELIZA_E2E_TELEGRAM_USERBOT_PHONE_NUMBER }}
      ELIZA_E2E_TELEGRAM_USERBOT_SESSION_STRING: ${{ secrets.ELIZA_E2E_TELEGRAM_USERBOT_SESSION_STRING }}
      ELIZA_E2E_TELEGRAM_CHAT_ID: ${{ secrets.ELIZA_E2E_TELEGRAM_CHAT_ID }}
      ELIZA_E2E_TWITTER_CLIENT_ID: ${{ secrets.ELIZA_E2E_TWITTER_CLIENT_ID }}
      ELIZA_E2E_TWITTER_CLIENT_SECRET: ${{ secrets.ELIZA_E2E_TWITTER_CLIENT_SECRET }}
      ELIZA_E2E_TWITTER_USER_REFRESH_TOKEN: ${{ secrets.ELIZA_E2E_TWITTER_USER_REFRESH_TOKEN }}
      ELIZA_E2E_TWITTER_FRIEND_REFRESH_TOKEN: ${{ secrets.ELIZA_E2E_TWITTER_FRIEND_REFRESH_TOKEN }}
      ELIZA_E2E_TWITTER_USER_HANDLE: ${{ secrets.ELIZA_E2E_TWITTER_USER_HANDLE }}
      ELIZA_E2E_TWITTER_FRIEND_HANDLE: ${{ secrets.ELIZA_E2E_TWITTER_FRIEND_HANDLE }}
      ELIZA_E2E_SIGNAL_PHONE_NUMBER: ${{ secrets.ELIZA_E2E_SIGNAL_PHONE_NUMBER }}
      ELIZA_E2E_SIGNAL_RECIPIENT_PHONE_NUMBER: ${{ secrets.ELIZA_E2E_SIGNAL_RECIPIENT_PHONE_NUMBER }}
      ELIZA_E2E_SIGNAL_DATA_DIR: ${{ secrets.ELIZA_E2E_SIGNAL_DATA_DIR }}
      ELIZA_E2E_WHATSAPP_ACCESS_TOKEN: ${{ secrets.ELIZA_E2E_WHATSAPP_ACCESS_TOKEN }}
      ELIZA_E2E_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.ELIZA_E2E_WHATSAPP_PHONE_NUMBER_ID }}
      ELIZA_E2E_WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.ELIZA_E2E_WHATSAPP_BUSINESS_ACCOUNT_ID }}
      ELIZA_E2E_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.ELIZA_E2E_WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
      ELIZA_E2E_WHATSAPP_RECIPIENT_PHONE_NUMBER: ${{ secrets.ELIZA_E2E_WHATSAPP_RECIPIENT_PHONE_NUMBER }}
      ELIZA_E2E_TWILIO_ACCOUNT_SID: ${{ secrets.ELIZA_E2E_TWILIO_ACCOUNT_SID }}
      ELIZA_E2E_TWILIO_API_KEY_SID: ${{ secrets.ELIZA_E2E_TWILIO_API_KEY_SID }}
      ELIZA_E2E_TWILIO_API_KEY_SECRET: ${{ secrets.ELIZA_E2E_TWILIO_API_KEY_SECRET }}
      ELIZA_E2E_TWILIO_SMS_FROM: ${{ secrets.ELIZA_E2E_TWILIO_SMS_FROM }}
      ELIZA_E2E_TWILIO_VOICE_FROM: ${{ secrets.ELIZA_E2E_TWILIO_VOICE_FROM }}
      ELIZA_E2E_TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.ELIZA_E2E_TWILIO_MESSAGING_SERVICE_SID }}
      ELIZA_E2E_TWILIO_RECIPIENT: ${{ secrets.ELIZA_E2E_TWILIO_RECIPIENT }}
      ELIZA_E2E_BLUEBUBBLES_SERVER_URL: ${{ secrets.ELIZA_E2E_BLUEBUBBLES_SERVER_URL }}
      ELIZA_E2E_BLUEBUBBLES_PASSWORD: ${{ secrets.ELIZA_E2E_BLUEBUBBLES_PASSWORD }}
      ELIZA_E2E_BLUEBUBBLES_RECIPIENT_HANDLE: ${{ secrets.ELIZA_E2E_BLUEBUBBLES_RECIPIENT_HANDLE }}
      ELIZA_E2E_GITHUB_USER_PAT: ${{ secrets.ELIZA_E2E_GITHUB_USER_PAT }}
      ELIZA_E2E_GITHUB_AGENT_PAT: ${{ secrets.ELIZA_E2E_GITHUB_AGENT_PAT }}
      ELIZA_E2E_GITHUB_ORG: ${{ secrets.ELIZA_E2E_GITHUB_ORG }}
      ELIZA_E2E_GITHUB_TEMPLATE_REPO: ${{ secrets.ELIZA_E2E_GITHUB_TEMPLATE_REPO }}
      ELIZA_E2E_ONEPASS_SA_TOKEN: ${{ secrets.ELIZA_E2E_ONEPASS_SA_TOKEN }}
      ELIZA_E2E_ONEPASS_VAULT_ID: ${{ secrets.ELIZA_E2E_ONEPASS_VAULT_ID }}
      ELIZA_E2E_ELIZACLOUD_API_KEY: ${{ secrets.ELIZA_E2E_ELIZACLOUD_API_KEY }}
      ELIZA_E2E_ELIZACLOUD_BASE_URL: ${{ secrets.ELIZA_E2E_ELIZACLOUD_BASE_URL }}
      ELIZA_E2E_APPLE_TEAM_ID: ${{ secrets.ELIZA_E2E_APPLE_TEAM_ID }}
      ELIZA_E2E_APPLE_APNS_KEY_ID: ${{ secrets.ELIZA_E2E_APPLE_APNS_KEY_ID }}
      ELIZA_E2E_APPLE_APNS_KEY_P8: ${{ secrets.ELIZA_E2E_APPLE_APNS_KEY_P8 }}
      ELIZA_E2E_APPLE_APNS_TOPIC: ${{ secrets.ELIZA_E2E_APPLE_APNS_TOPIC }}

      SCENARIO_ROOT: ${{ matrix.shard.root }}
      SCENARIO_FILE_GLOBS: ${{ join(matrix.shard.globs, ' ') }}
      SCENARIO_FILTER: ${{ inputs.scenario_filter }}
      LIFEOPS_JUDGE_THRESHOLD: ${{ inputs.judge_threshold || '0.8' }}
      SCENARIO_ENFORCE_GATE: ${{ github.event_name == 'schedule' && '1' || (inputs.enforce_gate && '1' || '0') }}
      SKIP_REASON: ${{ inputs.skip_reason }}
      REPORT_PATH: artifacts/scenario-runs/${{ matrix.shard.name }}/report.json
      RUN_DIR: artifacts/scenario-runs/${{ matrix.shard.name }}/run
      EXPORT_NATIVE_PATH: artifacts/scenario-runs/${{ matrix.shard.name }}/native.jsonl
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --ignore-scripts --no-frozen-lockfile

      - name: Verify scenario runner inputs
        run: |
          set -euo pipefail
          test -f packages/scenario-runner/src/cli.ts
          test -d "$SCENARIO_ROOT"
          test -n "$SCENARIO_FILE_GLOBS"

      - name: Prepare fail-observable report
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REPORT_PATH")"
          node --input-type=module - <<'NODE'
          import { writeFileSync } from "node:fs";
          const report = {
            schema: "eliza_live_scenario_setup_v1",
            status: "setup_not_completed",
            generatedAt: new Date().toISOString(),
            shard: process.env.SCENARIO_ROOT,
            note: "Scenario execution did not replace this setup report.",
            scenarios: [],
            totalCount: 0,
            passedCount: 0,
            failedCount: 0
          };
          writeFileSync(
            process.env.REPORT_PATH,
            `${JSON.stringify(report, null, 2)}\n`,
          );
          NODE

      - name: Build live scenario runtime packages
        id: build
        run: |
          set -euo pipefail
          bun run --cwd packages/core build
          bun run --cwd packages/shared build
          bun run --cwd packages/skills build
          bun run --cwd packages/cloud/sdk build
          bun run --cwd plugins/plugin-commands build

          provider_package=""
          if [ -n "${GROQ_API_KEY:-}" ]; then
            provider_package="plugins/plugin-groq"
          elif [ -n "${OPENAI_API_KEY:-}" ]; then
            provider_package="plugins/plugin-openai"
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            provider_package="plugins/plugin-anthropic"
          elif [ -n "${GOOGLE_GENERATIVE_AI_API_KEY:-}" ] || [ -n "${GOOGLE_API_KEY:-}" ]; then
            provider_package="plugins/plugin-google-genai"
          elif [ -n "${OPENROUTER_API_KEY:-}" ]; then
            provider_package="plugins/plugin-openrouter"
          fi

          package_dirs=(
            plugins/plugin-sql
            plugins/plugin-blocker
            plugins/plugin-browser
            plugins/plugin-native-calendar
            plugins/plugin-native-activity-tracker
            plugins/plugin-native-mobile-signals
            plugins/plugin-native-reminders
            plugins/plugin-scheduling
            plugins/plugin-calendar
            plugins/plugin-finances
            plugins/plugin-goals
            plugins/plugin-inbox
            plugins/plugin-reminders
            plugins/plugin-calendly
            plugins/plugin-discord
            plugins/plugin-elizacloud
            plugins/plugin-google
            plugins/plugin-phone
            plugins/plugin-remote-desktop
            plugins/plugin-x
            plugins/plugin-local-inference
            plugins/plugin-app-control
            plugins/plugin-agent-skills
            plugins/plugin-health
            plugins/plugin-wallet
            plugins/plugin-pdf
            plugins/plugin-form
            plugins/plugin-personal-assistant
            plugins/plugin-telegram
            plugins/plugin-whatsapp
            plugins/plugin-signal
            plugins/plugin-imessage
          )
          if [ -n "$provider_package" ]; then
            package_dirs+=("$provider_package")
          fi

          for package_dir in "${package_dirs[@]}"; do
            echo "::group::Build ${package_dir}"
            bun run --cwd "$package_dir" build
            echo "::endgroup::"
          done

      - name: Run live scenario shard
        id: run
        run: |
          set -euo pipefail
          read -r -a scenario_globs <<< "$SCENARIO_FILE_GLOBS"
          test "${#scenario_globs[@]}" -gt 0
          node packages/scripts/run-live-scenarios.mjs \
            --lane live-only \
            "${scenario_globs[@]}"

      - name: Upload live trajectories and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-scenario-${{ matrix.shard.name }}
          path: artifacts/scenario-runs/${{ matrix.shard.name }}/
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Live scenario summary
    needs: live-scenarios
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          submodules: false

      - name: Download shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: live-scenario-*
          path: artifacts/scenario-runs/all
          merge-multiple: false

      - name: Stage one canonical matrix report per shard
        run: |
          set -euo pipefail
          matrix_dir="artifacts/scenario-runs/matrices"
          mkdir -p "$matrix_dir"
          while IFS= read -r -d '' matrix_report; do
            artifact_name="$(basename "$(dirname "$(dirname "$matrix_report")")")"
            cp "$matrix_report" "$matrix_dir/${artifact_name}.json"
          done < <(find artifacts/scenario-runs/all -type f -name matrix.json -print0)
          test "$(find "$matrix_dir" -type f -name '*.json' | wc -l)" -gt 0

      - name: Aggregate live scenario reports
        run: node packages/scripts/aggregate-scenario-reports.mjs artifacts/scenario-runs/matrices >> "$GITHUB_STEP_SUMMARY"
