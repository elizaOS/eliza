# Live Scenario Runner (nightly)
#
# Executes the executive-assistant, connector certification, plugin-health,
# app-control, and scenario-runner view-chat scenarios against a live LLM
# runtime with real credentials. Each shard is one job in a matrix fanned out
# from packages/scripts/live-scenario-shards.json, and a terminal aggregate gate
# re-reads every shard's outcome artifact, so the lane's wall clock is its
# slowest shard and a shard that fails or is cancelled cannot read as a pass.
# Scheduled runs are enforcing: once the runner reaches scenario execution, any
# scenario failure or aggregate LLM-judge score below LIFEOPS_JUDGE_THRESHOLD
# fails the lane. Manual dispatch can select one
# named shard and filter inside that shard; it can also opt into report-only mode
# while debugging by leaving `enforce_gate` false. Missing setup prerequisites
# fail loudly and still upload a placeholder report artifact.
#
# Required repo secrets (self-documented):
#   LLM provider (at least one):
#     OPENAI_API_KEY
#     OPENROUTER_API_KEY
#     ANTHROPIC_API_KEY
#     GOOGLE_GENERATIVE_AI_API_KEY or GOOGLE_API_KEY
#     GROQ_API_KEY
#   Independent LLM judge (judge-independence, #9310):
#     CEREBRAS_API_KEY — grades judgeRubric/responseJudge checks on Cerebras
#     instead of the model under test. SCENARIO_JUDGE_REQUIRE_INDEPENDENT=1 is
#     set below, so runs without this secret FAIL their judged scenarios
#     (visible judge-availability gap) rather than silently self-grading.
#   Connector credentials (presence gates the relevant scenarios):
#     GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_OAUTH_REFRESH_TOKEN
#     GMAIL_TEST_ACCOUNT_EMAIL, GMAIL_TEST_ACCOUNT_REFRESH_TOKEN
#     CALENDLY_API_TOKEN
#     TELEGRAM_BOT_TOKEN, TELEGRAM_TEST_CHAT_ID, TELEGRAM_API_ID, TELEGRAM_API_HASH
#     DISCORD_BOT_TOKEN, DISCORD_TEST_GUILD_ID, DISCORD_TEST_CHANNEL_ID
#     SIGNAL_CLI_URL, SIGNAL_TEST_NUMBER
#     IMESSAGE_BRIDGE_URL, IMESSAGE_TEST_HANDLE
#     WHATSAPP_TOKEN, WHATSAPP_PHONE_ID, WHATSAPP_TEST_CONTACT
#     TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER, TWILIO_TEST_TO_NUMBER
#     X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET, X_TEST_DM_HANDLE
#     NOTIFICATION_RELAY_URL, NOTIFICATION_RELAY_TOKEN
#     TRAVEL_BOOKING_API_KEY
# Optional:
#   LIFEOPS_JUDGE_THRESHOLD (workflow input, default 0.8)
#   SCENARIO_SHARD         (manual choice; scheduled runs execute all shards)
#   SCENARIO_FILTER        (comma-separated ids inside one selected manual shard)
#   SCENARIO_ENFORCE_GATE  (schedule: enforced; manual input default false)
#   SKIP_REASON            (required if SCENARIO_SKIP is set)
#
# 1Password vault: this workflow's plain `*_API_KEY` secrets are sourced from the
# `eliza-e2e` 1Password vault. The vault must exist in 1Password and the
# corresponding GitHub Actions secrets must be configured on the
# `elizaOS/eliza` repo before this workflow can run successfully. Structured
# per-account `ELIZA_E2E_*` coverage is tracked in #16448; this authority
# exposes only the canonical runtime credentials listed above.

name: Live Scenarios

on:
  schedule:
    # 08:30 UTC daily — after upstream nightly at 04:00 UTC settles.
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      scenario_filter:
        description: "Scenario ids inside scenario_shard (empty = shard default)"
        required: false
        type: string
        default: ""
      scenario_shard:
        description: "Named shard to run (filters require a single named shard)"
        required: true
        type: choice
        default: "lifeops-connectors"
        options:
          - all
          - lifeops-connectors
          - plugin-health
          - app-control
          - scenario-runner-view-chat
      judge_threshold:
        description: "LLM-judge minimum pass score (0.0 - 1.0)"
        required: false
        type: string
        default: "0.8"
      skip_reason:
        description: "If you plan to skip any scenario, document why"
        required: false
        type: string
        default: ""
      enforce_gate:
        description: "Fail the workflow when live scenarios fail"
        required: false
        type: boolean
        default: false

concurrency:
  group: live-scenarios-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "canary"
  NODE_VERSION: "24.15.0"
  ELIZA_LIVE_TEST: "1"

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Resolve requested shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          filter: blob:none
          submodules: false

      - name: Resolve shard matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCENARIO_SHARD: ${{ inputs.scenario_shard }}
          SCENARIO_FILTER: ${{ inputs.scenario_filter }}
        run: node packages/scripts/live-scenario-contract.mjs matrix

  shard:
    name: Live scenarios (${{ matrix.shard }})
    needs: plan
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    # Shards run as independent jobs because a GitHub-hosted runner caps a
    # single job at six hours: the four shards run serially exceed that ceiling,
    # so no workflow-level timeout could ever let the serial lane finish. Each
    # shard's ceiling comes from the manifest and stays inside the hosted cap.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      # One failing shard must not cancel the others: this lane's product is
      # live evidence, and a sibling's failure is not a reason to discard it.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --ignore-scripts --no-frozen-lockfile

      - name: Verify scenario-runner CLI present
        run: |
          test -f packages/scenario-runner/src/cli.ts || \
            { echo "scenario-runner CLI missing"; exit 1; }

      - name: Prepare live scenario report placeholder
        env:
          SCENARIO_SHARD: ${{ matrix.shard }}
          REPORT_PATH: ${{ matrix.report }}
          RUN_DIR: ${{ matrix.run_dir }}
        run: |
          mkdir -p "$RUN_DIR"
          node - <<'NODE'
          const fs = require("node:fs");
          const report = {
            schema: "eliza_live_scenario_setup_v1",
            shard: process.env.SCENARIO_SHARD,
            status: "setup_not_completed",
            generatedAt: new Date().toISOString(),
            note:
              "Placeholder written before build/setup. If this file is uploaded unchanged, the workflow failed before scenario execution and no live model trajectory was produced.",
            scenarios: [],
            totalCount: 0,
            passedCount: 0,
            failedCount: 0
          };
          fs.writeFileSync(process.env.REPORT_PATH, `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Validate authoritative shard prerequisites
        id: preflight
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: node packages/scripts/live-scenario-contract.mjs preflight "${{ matrix.shard }}"

      - name: Build live scenario runtime packages
        id: build
        if: ${{ steps.preflight.outcome == 'success' }}
        # The live runner executes TypeScript sources directly, but several
        # workspace packages intentionally export dist/* entry points. Because
        # dependency installation ignores postinstall scripts, build only the
        # packages that the live scenario runtime imports through those exports.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "::group::Build packages/core"
          bun run --cwd packages/core build
          echo "::endgroup::"

          echo "::group::Build packages/shared"
          # plugin-agent-skills (and others) consume @elizaos/shared via dist
          # exports (RouteRequestContext, ReadJsonBodyOptions, route schemas).
          # Must build before any plugin that imports from it.
          bun run --cwd packages/shared build
          echo "::endgroup::"

          echo "::group::Build packages/skills"
          # plugin-agent-skills imports @elizaos/skills via its dist exports
          # (getSkillsDir, loadSkills, formatSkillsForPrompt). Must build
          # before plugin-agent-skills typechecks its declaration emit.
          bun run --cwd packages/skills build
          echo "::endgroup::"

          echo "::group::Build packages/cloud/sdk"
          bun run --cwd packages/cloud/sdk build
          echo "::endgroup::"

          echo "::group::Build plugins/plugin-commands"
          # plugin-telegram's command-registration.ts imports @elizaos/plugin-commands
          # via its dist exports (ConnectorCommand, getConnectorCommands,
          # resolveCommand, …). Because installs run with --ignore-scripts this
          # workspace dependency is never built implicitly, so plugin-telegram's
          # `tsc` declaration emit fails with TS2307 "Cannot find module
          # '@elizaos/plugin-commands'". Build it before the connector loop below.
          bun run --cwd plugins/plugin-commands build
          echo "::endgroup::"

          provider_package=""
          if [ -n "${GROQ_API_KEY:-}" ]; then
            provider_package="plugins/plugin-groq"
          elif [ -n "${OPENAI_API_KEY:-}" ]; then
            provider_package="plugins/plugin-openai"
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            provider_package="plugins/plugin-anthropic"
          elif [ -n "${GOOGLE_GENERATIVE_AI_API_KEY:-}" ] || [ -n "${GOOGLE_API_KEY:-}" ]; then
            provider_package="plugins/plugin-google-genai"
          elif [ -n "${OPENROUTER_API_KEY:-}" ]; then
            provider_package="plugins/plugin-openrouter"
          fi

          package_dirs=(
            plugins/plugin-sql
            plugins/plugin-blocker
            plugins/plugin-browser
            plugins/plugin-native-calendar
            plugins/plugin-native-activity-tracker
            plugins/plugin-native-mobile-signals
            plugins/plugin-native-reminders
            plugins/plugin-scheduling
            plugins/plugin-calendar
            plugins/plugin-finances
            plugins/plugin-goals
            plugins/plugin-inbox
            plugins/plugin-reminders
            plugins/plugin-calendly
            plugins/plugin-discord
            plugins/plugin-elizacloud
            plugins/plugin-google-workspace
            plugins/plugin-phone
            plugins/plugin-remote-desktop
            plugins/plugin-x
            plugins/plugin-local-inference
            plugins/plugin-app-control
            plugins/plugin-agent-skills
            plugins/plugin-health
            plugins/plugin-wallet
            plugins/plugin-pdf
            plugins/plugin-form
            plugins/plugin-personal-assistant
            plugins/plugin-telegram
            plugins/plugin-whatsapp
            plugins/plugin-signal
            plugins/plugin-imessage
          )
          if [ -n "$provider_package" ]; then
            package_dirs+=("$provider_package")
          fi

          for package_dir in "${package_dirs[@]}"; do
            echo "::group::Build ${package_dir}"
            bun run --cwd "$package_dir" build
            echo "::endgroup::"
          done

      - name: Run live scenarios
        id: run
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          # The runner and ordinary workspace dependencies stay on checkout
          # sources; generated/native and dist-only artifacts come from the
          # dependency-closure build above.
          NODE_OPTIONS: "--conditions=eliza-source"
          # LLM providers
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Independent LLM judge (#9310): judge on Cerebras, never the model
          # under test. Strict mode fails self-graded scenarios so a missing
          # key is a visible judge-availability gap, not silent self-grading.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SCENARIO_JUDGE_REQUIRE_INDEPENDENT: "1"
          # Google Workspace
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GMAIL_TEST_ACCOUNT_EMAIL: ${{ secrets.GMAIL_TEST_ACCOUNT_EMAIL }}
          GMAIL_TEST_ACCOUNT_REFRESH_TOKEN: ${{ secrets.GMAIL_TEST_ACCOUNT_REFRESH_TOKEN }}
          # Calendly
          CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN }}
          # Messaging
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TEST_GUILD_ID: ${{ secrets.DISCORD_TEST_GUILD_ID }}
          DISCORD_TEST_CHANNEL_ID: ${{ secrets.DISCORD_TEST_CHANNEL_ID }}
          SIGNAL_CLI_URL: ${{ secrets.SIGNAL_CLI_URL }}
          SIGNAL_TEST_NUMBER: ${{ secrets.SIGNAL_TEST_NUMBER }}
          IMESSAGE_BRIDGE_URL: ${{ secrets.IMESSAGE_BRIDGE_URL }}
          IMESSAGE_TEST_HANDLE: ${{ secrets.IMESSAGE_TEST_HANDLE }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TEST_CONTACT: ${{ secrets.WHATSAPP_TEST_CONTACT }}
          # Twilio SMS/Voice
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TEST_TO_NUMBER: ${{ secrets.TWILIO_TEST_TO_NUMBER }}
          # X / DM
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_TEST_DM_HANDLE: ${{ secrets.X_TEST_DM_HANDLE }}
          # Push notifications + travel
          NOTIFICATION_RELAY_URL: ${{ secrets.NOTIFICATION_RELAY_URL }}
          NOTIFICATION_RELAY_TOKEN: ${{ secrets.NOTIFICATION_RELAY_TOKEN }}
          TRAVEL_BOOKING_API_KEY: ${{ secrets.TRAVEL_BOOKING_API_KEY }}
          # Run controls
          SCENARIO_ROOT: ${{ matrix.root }}
          SCENARIO_SHARD: ${{ matrix.shard }}
          SCENARIO_FILTER: ${{ matrix.scenario_filter }}
          LANE_ARGS: ${{ matrix.lane_args }}
          LIFEOPS_JUDGE_THRESHOLD: ${{ inputs.judge_threshold || '0.8' }}
          SCENARIO_ENFORCE_GATE: ${{ github.event_name == 'schedule' && '1' || (inputs.enforce_gate && '1' || '0') }}
          SKIP_REASON: ${{ inputs.skip_reason }}
          REPORT_PATH: ${{ matrix.report }}
          RUN_DIR: ${{ matrix.run_dir }}
        run: |
          set -o pipefail
          mkdir -p "$RUN_DIR"
          # shellcheck disable=SC2086 # LANE_ARGS is a controlled manifest value
          node packages/scripts/run-live-scenarios.mjs $LANE_ARGS 2>&1 | tee "$RUN_DIR/runner.log"

      - name: Verify this shard published its evidence contract
        id: verify-evidence
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.build.outcome == 'success' }}
        run: node packages/scripts/live-scenario-contract.mjs verify "${{ matrix.shard }}"

      - name: Record shard outcome
        if: always()
        env:
          SCENARIO_SHARD: ${{ matrix.shard }}
          RUN_DIR: ${{ matrix.run_dir }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.verify-evidence.outcome }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const steps = {
            preflight: process.env.PREFLIGHT_OUTCOME,
            build: process.env.BUILD_OUTCOME,
            run: process.env.RUN_OUTCOME,
            evidence: process.env.EVIDENCE_OUTCOME,
          };
          const failures = Object.entries(steps).filter(([, value]) => value !== "success");
          const outcome = {
            schema: "eliza_live_scenario_shard_outcome_v1",
            shard: process.env.SCENARIO_SHARD,
            status: failures.length === 0 ? "success" : "failure",
            steps,
            generatedAt: new Date().toISOString(),
          };
          fs.mkdirSync(process.env.RUN_DIR, { recursive: true });
          fs.writeFileSync(`${process.env.RUN_DIR}/shard-outcome.json`, `${JSON.stringify(outcome, null, 2)}\n`);
          if (failures.length) {
            console.error(`Live scenario shard failed: ${failures.map(([name, value]) => `${name}=${value || "missing"}`).join(", ")}`);
            process.exit(1);
          }
          console.log(`Live scenario shard ${outcome.shard} passed: ${Object.keys(steps).join(", ")}`);
          NODE

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-scenario-report-${{ matrix.shard }}
          path: |
            ${{ matrix.report }}
            ${{ matrix.run_dir }}/
          if-no-files-found: error
          retention-days: 30

  live-scenarios:
    name: Live scenarios aggregate gate
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          filter: blob:none
          submodules: false

      - name: Download shard outcomes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: live-scenario-report-*
          path: artifacts/shard-outcomes

      - name: Enforce aggregate shard result
        env:
          EXPECTED_SHARDS: ${{ needs.plan.outputs.shards }}
          ARTIFACT_DIR: artifacts/shard-outcomes
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ] || [ "$SHARD_RESULT" != "success" ]; then
            echo "Live scenario authority failed: plan=$PLAN_RESULT shard=$SHARD_RESULT" >&2
            exit 1
          fi
          node packages/scripts/live-scenario-contract.mjs gate
