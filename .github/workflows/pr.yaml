name: PR Title Check

# Cancel previous runs for the same PR
concurrency:
  group: pr-title-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # Dependabot PRs need a base-controlled, narrowly authorized body normalizer.
  # All validation still runs on pull_request with read-only permissions.
  pull_request_target:
    types: [opened, synchronize, reopened]

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  check-pr-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A full-history checkout is required for the merge-base evidence diff and
    # regularly approaches five minutes in this large monorepo.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # Full history so the merge-base of the PR base and head resolves — the
          # evidence diff must reflect only THIS PR's changes, not whatever landed
          # on the base branch after the PR's branch point (#16125).
          fetch-depth: 0

      - name: Verify trusted policy validators from the PR base
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          HEAD_SHA=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"

          validator_dir="$GITHUB_WORKSPACE/scripts"
          trusted_blob_dir="$RUNNER_TEMP/pr-policy-base-blobs"
          mkdir -p "$trusted_blob_dir"
          test_manifest="$RUNNER_TEMP/pr-policy-base-tests.txt"
          : > "$test_manifest"
          has_pr_attribution_validator=false
          validator_sources=(
            scripts/check-pr-evidence.mjs
            scripts/check-pr-evidence.test.mjs
            scripts/check-pr-agent-attribution.mjs
            scripts/check-pr-agent-attribution.test.mjs
            scripts/check-agent-comment-attribution.mjs
            scripts/check-agent-comment-attribution.test.mjs
            scripts/audit-ai-workflow-output.mjs
            scripts/audit-ai-workflow-output.test.mjs
          )
          for source in "${validator_sources[@]}"; do
            if ! git cat-file -e "$BASE_SHA:$source"; then
              echo "::notice::validator is new in this PR and remains disabled until it lands on the base branch: $source"
              continue
            fi
            trusted_blob="$trusted_blob_dir/${source##*/}"
            git show "$BASE_SHA:$source" > "$trusted_blob"
            if ! cmp --silent "$trusted_blob" "$GITHUB_WORKSPACE/$source"; then
              echo "::error::checked-out validator does not match the PR base: $source"
              exit 1
            fi
            if [[ "$source" == *.test.mjs ]]; then
              echo "$GITHUB_WORKSPACE/$source" >> "$test_manifest"
            fi
            if [[ "$source" == "scripts/check-pr-agent-attribution.mjs" ]]; then
              has_pr_attribution_validator=true
            fi
          done
          echo "PR_VALIDATOR_DIR=$validator_dir" >> "$GITHUB_ENV"
          echo "PR_VALIDATOR_TEST_MANIFEST=$test_manifest" >> "$GITHUB_ENV"
          echo "HAS_PR_ATTRIBUTION_VALIDATOR=$has_pr_attribution_validator" >> "$GITHUB_ENV"

      - name: Test contribution policy validators
        run: |
          mapfile -t validator_tests < "$PR_VALIDATOR_TEST_MANIFEST"
          if (( ${#validator_tests[@]} == 0 )); then
            echo "::error::the PR base did not provide any policy validator tests"
            exit 1
          fi
          node --test "${validator_tests[@]}"

      - name: Validate PR evidence rows
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.md"
          PR_LABELS=$(jq -r '.pull_request.labels | map(.name) | join(",")' "$GITHUB_EVENT_PATH")
          BASE_SHA=$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          HEAD_SHA=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          # Three-dot: diff the merge-base..head, i.e. only what THIS PR changed,
          # not files the base branch advanced past the branch point (#16125).
          git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr-changed-files.txt"
          git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr-added-files.txt"
          node "$PR_VALIDATOR_DIR/check-pr-evidence.mjs" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --labels "$PR_LABELS" \
            --changed-files-file "$RUNNER_TEMP/pr-changed-files.txt" \
            --added-files-file "$RUNNER_TEMP/pr-added-files.txt"

      - name: Validate contribution model attribution
        if: env.HAS_PR_ATTRIBUTION_VALIDATOR == 'true'
        run: node "$PR_VALIDATOR_DIR/check-pr-agent-attribution.mjs" --body-file "$RUNNER_TEMP/pr-body.md"

  normalize-dependabot-body:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Verify exact Dependabot PR identity and patch its visible body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request_target" ||
                "$EVENT_ACTOR" != "dependabot[bot]" ||
                "$PR_AUTHOR" != "dependabot[bot]" ||
                "$BASE_REF" != "develop" ||
                "$BASE_REPO" != "$REPOSITORY" ||
                "$HEAD_REPO" != "$REPOSITORY" ||
                ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ||
                "$HEAD_REF" == *".."* ]]; then
            echo "::error::refusing to mutate a PR body without exact Dependabot identity"
            exit 1
          fi
          case "$HEAD_REF" in
            dependabot/npm_and_yarn/*|dependabot/github_actions/*|dependabot/pip/*) ;;
            *)
              echo "::error::unexpected Dependabot ecosystem ref: $HEAD_REF"
              exit 1
              ;;
          esac

          node <<'NODE'
          const fs = require("node:fs");
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const existing = typeof event.pull_request.body === "string" ? event.pull_request.body : "";
          const managedPattern = /<!-- dependabot-policy:v1:start -->[\s\S]*?<!-- dependabot-policy:v1:end -->/g;
          const unmanaged = existing.replace(managedPattern, "").trimEnd();
          const hasCustomPolicy =
            /<!--\s*(?:contribution-attribution:v1|attribution-row:|evidence-row:)/i.test(unmanaged);
          const policyBlock = `<!-- dependabot-policy:v1:start -->
          ## Automated dependency-update policy

          This visible block records deterministic Dependabot provenance and the evidence categories applicable to a dependency metadata proposal. Runtime verification remains reviewer-owned before merge.

          ## Evidence Gate

          <!-- evidence-row:before-screenshots -->
          - [x] N/A - Dependabot changes dependency metadata and does not directly edit a rendered UI source surface.
          <!-- evidence-row:after-screenshots -->
          - [x] N/A - the dependency proposal captures no application pixels and visual regression remains reviewer-owned.
          <!-- evidence-row:walkthrough-video -->
          - [x] N/A - Dependabot proposes a non-interactive dependency diff rather than an executable user flow.
          <!-- evidence-row:backend-logs -->
          - [x] N/A - the dependency bot does not execute an application backend request path while composing this PR.
          <!-- evidence-row:frontend-logs -->
          - [x] N/A - the dependency bot does not execute frontend console or network behavior while composing this PR.
          <!-- evidence-row:llm-trajectory -->
          - [x] N/A - deterministic Dependabot automation invokes no language model or contribution agent.
          <!-- evidence-row:domain-artifacts -->
          - [x] N/A - the dependency lockfile and manifest changes are the reviewed source diff and create no runtime domain state.

          ## Contribution provenance

          <!-- contribution-attribution:v1 -->
          <!-- attribution-row:ai-assistance -->
          - AI assistance: no - deterministic dependency bot
          <!-- attribution-row:models -->
          - Model(s) used: None - deterministic dependency bot
          <!-- attribution-row:client -->
          - Client / agent tooling: None - deterministic dependency bot
          <!-- attribution-row:skill-revision -->
          - Skill revision: N/A - Dependabot does not invoke a contribution skill
          <!-- attribution-row:status -->
          - Attribution status: self-reported

          <!-- dependabot-policy:v1:end -->`;
          const output = hasCustomPolicy
            ? unmanaged
            : `${unmanaged}${unmanaged ? "\n\n" : ""}${policyBlock}`;
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/dependabot-body.json`,
            JSON.stringify({ body: output }),
          );
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/dependabot-body.md`, output);
          NODE

          current_body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          normalized_body="$(cat "$RUNNER_TEMP/dependabot-body.md")"
          if [[ "$current_body" == "$normalized_body" ]]; then
            echo "Dependabot policy body is already current."
            exit 0
          fi
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --input "$RUNNER_TEMP/dependabot-body.json" \
            >/dev/null

  check-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    # The failure-path `gh pr comment` (GraphQL addComment) needs PR write;
    # the workflow-level default grants only contents: read, which made the
    # reporting step crash with "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate PR title
        id: validate
        run: |
          PR_TITLE=$(jq -r .pull_request.title "$GITHUB_EVENT_PATH")
          echo "PR Title: $PR_TITLE"
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|release)(\([a-zA-Z0-9-]+\))?:\ .+ ]]; then
            echo "PR title does not match the required pattern."
            exit 1
          fi

      - name: Set status
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "❌ PR title does not match the required pattern. Please use one of these formats:
          - 'type: description' (e.g., 'feat: add new feature')
          - 'type(scope): description' (e.g., 'chore(core): update dependencies')
          Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, release"
