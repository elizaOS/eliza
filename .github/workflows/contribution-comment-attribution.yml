name: Contribution comment attribution

# Audits new or edited claim comments and any comment/review that declares AI
# provenance. Ordinary human discussion is deliberately outside this syntax.
on:
  issue_comment:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  validate:
    name: Validate claim and review provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout validation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: Validate event body
        run: node scripts/check-agent-comment-attribution.mjs --event-file "$GITHUB_EVENT_PATH"
