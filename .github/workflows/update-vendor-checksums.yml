name: Update vendor checksums

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/os

concurrency:
  group: update-vendor-checksums
  cancel-in-progress: false

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  update-checksums:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download and hash platform-tools
        run: |
          set -euo pipefail

          CHECKSUMS_FILE="setup/vendor/checksums.json"
          work_dir="$(mktemp -d)"
          trap 'rm -rf -- "$work_dir"' EXIT

          download_and_hash() {
            local platform="$1"
            local url="$2"
            local tmp_file
            tmp_file="$work_dir/$platform.zip"

            echo "Downloading platform-tools for $platform…"
            curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 5 -o "$tmp_file" "$url"

            local sha256
            sha256="$(sha256sum "$tmp_file" | awk '{print $1}')"
            echo "$platform: $sha256"

            # Inject sha256 into checksums.json using jq
            jq --arg platform "$platform" \
               --arg sha256 "$sha256" \
               --arg url "$url" \
               '.["platform-tools"][$platform].sha256 = $sha256 | .["platform-tools"][$platform].url = $url' \
               "$CHECKSUMS_FILE" > "${CHECKSUMS_FILE}.tmp"
            mv "${CHECKSUMS_FILE}.tmp" "$CHECKSUMS_FILE"

            rm -f "$tmp_file"
          }

          download_and_hash "darwin" "https://dl.google.com/android/repository/platform-tools-latest-darwin.zip"
          download_and_hash "linux"  "https://dl.google.com/android/repository/platform-tools-latest-linux.zip"
          download_and_hash "win32"  "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"

          if git diff --quiet "$CHECKSUMS_FILE"; then
            echo "No platform-tools checksum or URL changes."
          else
            # Update the timestamp only when pinned vendor content changes.
            jq --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
               '."last-updated" = $ts' \
               "$CHECKSUMS_FILE" > "${CHECKSUMS_FILE}.tmp"
            mv "${CHECKSUMS_FILE}.tmp" "$CHECKSUMS_FILE"
          fi

          echo "Updated checksums.json:"
          cat "$CHECKSUMS_FILE"

      - name: Create PR if checksums changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CHECKSUMS_FILE="setup/vendor/checksums.json"

          if git diff --quiet "$CHECKSUMS_FILE"; then
            echo "No changes to checksums — skipping PR."
            exit 0
          fi

          BRANCH="chore/update-vendor-checksums-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$CHECKSUMS_FILE"
          git commit -m "chore: update vendor checksums $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"

          body_file="$(mktemp)"
          trap 'rm -f -- "$body_file"' EXIT
          cat > "$body_file" <<'EOF'
          ## Automated vendor checksum update

          Operator-requested update of SHA-256 hashes for Android Platform Tools in
          `packages/os/setup/vendor/checksums.json`.

          - macOS platform-tools
          - Linux platform-tools
          - Windows platform-tools

          Sideloader is fetched at install time from the GitHub releases API
          and is not pinned here.

          ## Evidence Gate

          <!-- evidence-row:before-screenshots -->
          - [x] N/A - the deterministic checksum JSON update has no rendered UI surface.
          <!-- evidence-row:after-screenshots -->
          - [x] N/A - the changed vendor metadata does not alter application pixels.
          <!-- evidence-row:walkthrough-video -->
          - [x] N/A - the non-interactive download and hashing transaction is recorded by the workflow.
          <!-- evidence-row:backend-logs -->
          - [x] N/A - the checksum updater downloads and hashes vendor archives but executes no application backend path.
          <!-- evidence-row:frontend-logs -->
          - [x] N/A - no frontend client request, response, console, or state transition is involved.
          <!-- evidence-row:llm-trajectory -->
          - [x] N/A - this deterministic workflow invokes no model and changes no agent, prompt, provider, or inference behavior.
          <!-- evidence-row:domain-artifacts -->
          - [x] N/A - the checksum JSON is the reviewed source diff and the workflow mutates no runtime domain store.

          ## Contribution provenance

          <!-- contribution-attribution:v1 -->
          <!-- attribution-row:ai-assistance -->
          - AI assistance: no - deterministic workflow
          <!-- attribution-row:models -->
          - Model(s) used: None - deterministic workflow
          <!-- attribution-row:client -->
          - Client / agent tooling: None - deterministic workflow
          <!-- attribution-row:skill-revision -->
          - Skill revision: N/A - checksum updater does not invoke a contribution skill
          <!-- attribution-row:status -->
          - Attribution status: self-reported

          > Generated by the `update-vendor-checksums` workflow.
          EOF

          label_args=()
          for label in dependencies automated; do
            if gh label list --limit 100 --json name --jq '.[].name' | grep -Fxq "$label"; then
              label_args+=(--label "$label")
            else
              echo "::notice::Optional label ${label} is not configured; creating the PR without it."
            fi
          done

          set +e
          pr_output="$(gh pr create \
            --title "chore: update vendor checksums $(date -u +%Y-%m-%d)" \
            --body-file "$body_file" \
            --base develop \
            --head "$BRANCH" \
            "${label_args[@]}" 2>&1)"
          pr_status=$?
          set -e

          echo "$pr_output"
          if [ "$pr_status" -ne 0 ]; then
            if grep -q "GitHub Actions is not permitted to create or approve pull requests" <<<"$pr_output"; then
              echo "::error::GitHub repository policy blocked the required updater PR. Enable Actions pull-request creation or open a PR from $BRANCH."
            fi
            exit "$pr_status"
          fi
