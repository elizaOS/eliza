name: Focused Shared controls e550 validation
on:
  push:
    branches: [codex/validate-shared-controls-e550e1f]
permissions:
  contents: read
concurrency:
  group: focused-shared-controls-e550
  cancel-in-progress: false
jobs:
  exact-public-owning-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      BUN_VERSION: "1.4.2"
      NODE_VERSION: "24.15.0"
      WRANGLER_SEND_METRICS: "false"
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      RUN_TURBO_CONCURRENCY: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout exact reviewed public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6eefe82931b7d51f5788879da3677c0cfbee891c
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Assert source and runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6eefe82931b7d51f5788879da3677c0cfbee891c
          command -v timeout
          command -v unshare
          command -v ip
          sudo -n true
          free -b
          nproc
          test "$(awk '/MemTotal:/ {print $2}' /proc/meminfo)" -ge 12582912
          sudo -n unshare --net -- bash -c 'set -euo pipefail; ip link set lo up; test "$(ip -o link show | wc -l)" -eq 1; ip -o link show | grep -Eq "^[0-9]+: lo:"; test -z "$(ip route show)"'
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.4.2"
          node-version: "24.15.0"
          install-command: bun install --frozen-lockfile --ignore-scripts
          run-postinstall: "false"
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          setup-fused-inference: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          init-submodules: "false"
          publish-caches: "false"
          publish-bun-install-cache: "false"
      - name: Build only the real Core prerequisite closure
        shell: bash
        run: |
          set -euo pipefail
          node packages/scripts/ensure-workspace-symlinks.ts
          timeout --kill-after=10s 600s bun packages/scripts/run-turbo.ts run build --filter=@elizaos/core
          # Official TS/catalog build only: no native engine compilation or model download.
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-native-inference build
          test -f plugins/plugin-native-inference/dist/model-catalog/bge-input.js
          test -f plugins/plugin-native-inference/dist/model-catalog/bge/tokenizer.json
          timeout --kill-after=10s 120s bun run --cwd packages/contracts build
          timeout --kill-after=10s 120s bun run --cwd packages/auth build
          timeout --kill-after=10s 120s bun run --cwd packages/host build
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-sql build
          test -f packages/contracts/dist/index.js
          test -f packages/auth/dist/kms/index.js
          test -f packages/host/dist/index.js
          test -f plugins/plugin-sql/dist/index.js
          test -f plugins/plugin-sql/dist/schema.js
          timeout --kill-after=10s 120s bun run --cwd packages/cloud/sdk build
          test -f packages/cloud/sdk/dist/browser-contracts/index.js
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-scheduling build:js
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-todos build:js
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-assistant build
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-web-search build
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-sqlite build
          test -f plugins/plugin-scheduling/dist/index.js
          test -f plugins/plugin-todos/dist/index.js
          test -f plugins/plugin-assistant/dist/index.js
          test -f plugins/plugin-web-search/dist/index.js
          test -f plugins/plugin-sqlite/dist/portable.js
          # Official backend artifact builders only; no native engines, UI view bundles or providers.
          timeout --kill-after=10s 120s bun run --cwd packages/voice build
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-mcp build
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-google-workspace build
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-wallet build.ts
          timeout --kill-after=10s 120s bun run --cwd plugins/plugin-elizacloud build.ts
          test -f plugins/plugin-mcp/dist/protocol-utils/json.js
          test -f plugins/plugin-google-workspace/dist/gmail-attachments.js
          test -f plugins/plugin-wallet/dist/lib/market-overview.js
          test -f plugins/plugin-elizacloud/dist/cloud-config/domain-contract.js
          test "$(git rev-parse HEAD)" = 6eefe82931b7d51f5788879da3677c0cfbee891c
          git diff --quiet HEAD
      - name: Test exact five owning files in a loopback-only namespace
        shell: bash
        run: |
          set -euo pipefail
          task_runner_path="$PATH"
          task_runner_home="$HOME"
          task_workspace="$GITHUB_WORKSPACE"
          task_script="$RUNNER_TEMP/focused-shared-controls.sh"
          cat > "$task_script" <<'SCRIPT'
          set -euo pipefail
          cd "$TASK_WORKSPACE"
          trap 'printf "::error::Focused launcher guard stopped at line %s\n" "$LINENO"' ERR
          task_source_head="$(git rev-parse HEAD)"
          task_bun_version="$(bun --version)"
          task_node_version="$(node --version)"
          task_biome_version="$(node_modules/.bin/biome --version)"
          printf 'Focused source=%s bun=%s node=%s biome=%s\n' "$task_source_head" "$task_bun_version" "$task_node_version" "$task_biome_version"
          test "$task_source_head" = 6eefe82931b7d51f5788879da3677c0cfbee891c
          test "$task_bun_version" = 1.4.2
          test "$task_node_version" = v24.15.0
          test "$task_biome_version" = "Version: 2.5.14"
          mkdir -p "$TASK_EVIDENCE"
          node_modules/.bin/biome check --vcs-enabled=false \
            packages/cloud/shared/src/lib/providers/language-model.ts \
            packages/cloud/shared/src/lib/providers/language-model-interactive-cerebras-failover.test.ts \
            packages/cloud/shared/src/lib/providers/language-model-fallback-policy.test.ts \
            packages/cloud/shared/src/lib/services/shared-runtime/shared-eliza-runtime.ts \
            packages/cloud/shared/src/lib/services/shared-runtime/shared-runtime-errors.ts \
            packages/cloud/shared/src/lib/services/shared-runtime/shared-runtime-chat.ts \
            packages/cloud/shared/src/lib/services/shared-runtime/shared-rest-adapter.ts \
            packages/cloud/api/src/shared-runtime-conversation.ts \
            packages/cloud/api/internal/eliza-app/personal-shared/messages/route.ts \
            packages/cloud/api/__tests__/shared-runtime-failure-diagnostics.test.ts \
            packages/cloud/api/__tests__/shared-runtime-diagnostic-transport-trace.test.ts \
            packages/cloud/api/__tests__/shared-eliza-runtime.miniflare.test.ts \
            packages/cloud/api/test/fixtures/shared-eliza-runtime-worker.ts \
            packages/cloud/api/__tests__/incoming-request-disconnect.miniflare.test.ts \
            packages/cloud/api/__tests__/request-signal-config.test.ts \
            packages/cloud/api/__tests__/shared-rest-request-signal.test.ts \
            packages/cloud/api/v1/eliza/agents/[agentId]/api/conversations/[conversationId]/messages/route.ts
          run_one() {
            task_name="$1"; task_cwd="$2"; shift 2
            task_limit=60
            if [[ "$task_name" == real-workerd* ]]; then task_limit=180; fi
            if timeout --kill-after=10s "${task_limit}s" bash -c 'cd "$1"; shift; exec bun test "$@"' _ "$task_cwd" "$@" > "$TASK_EVIDENCE/$task_name.log" 2>&1; then
              task_exit=0
            else
              task_exit=$?
            fi
            test "$(wc -c < "$TASK_EVIDENCE/$task_name.log")" -le 2097152
            if [ "$task_exit" -ne 0 ]; then
              printf '::error::Owning suite %s failed with exit %s\n' "$task_name" "$task_exit"
              tail -100 "$TASK_EVIDENCE/$task_name.log"
              return "$task_exit"
            fi
            test "$(wc -c < "$TASK_EVIDENCE/$task_name.log")" -le 2097152
            grep -Eq '^[[:space:]]*[1-9][0-9]* pass[[:space:]]*$' "$TASK_EVIDENCE/$task_name.log"
            grep -Eq '^[[:space:]]*0 fail[[:space:]]*$' "$TASK_EVIDENCE/$task_name.log"
            grep -Eq '^Ran [1-9][0-9]* tests? across ' "$TASK_EVIDENCE/$task_name.log"
            case "$task_name" in
              sdk-cerebras) grep -E '\(pass\).*fourth Core hint' "$TASK_EVIDENCE/$task_name.log" > /dev/null; grep -E '\(pass\).*cancellation retains the primary SDK error before routing policy' "$TASK_EVIDENCE/$task_name.log" > /dev/null ;;
              sdk-routing) grep -E '\(pass\).*does not consult fallback policy after abort' "$TASK_EVIDENCE/$task_name.log" > /dev/null ;;
              closed-diagnostics) grep -E '\(pass\).*SDK zero with unknown provider detail' "$TASK_EVIDENCE/$task_name.log" > /dev/null ;;
              rest-coordinator) grep -E '\(pass\).*without moving account state or server trace' "$TASK_EVIDENCE/$task_name.log" > /dev/null; grep -E '\(pass\).*already-aborted caller' "$TASK_EVIDENCE/$task_name.log" > /dev/null ;;
              real-workerd) grep -E '\(pass\).*/cancel-before-model' "$TASK_EVIDENCE/$task_name.log" > /dev/null; grep -E '\(pass\).*/cancel-at-dispatch' "$TASK_EVIDENCE/$task_name.log" > /dev/null ;;
            esac
            tail -8 "$TASK_EVIDENCE/$task_name.log"
          }
          run_one sdk-cerebras packages/cloud/shared src/lib/providers/language-model-interactive-cerebras-failover.test.ts --timeout 60000
          run_one sdk-routing packages/cloud/shared src/lib/providers/language-model-fallback-policy.test.ts --timeout 60000
          run_one closed-diagnostics packages/cloud/api __tests__/shared-runtime-failure-diagnostics.test.ts --timeout 60000
          run_one rest-coordinator packages/cloud/api __tests__/shared-runtime-diagnostic-transport-trace.test.ts --timeout 60000
          run_one real-workerd packages/cloud/api __tests__/shared-eliza-runtime.miniflare.test.ts --test-name-pattern '/cancel-before-model|/cancel-at-dispatch|runs the production Shared adapter through the genuine runtime|retains canonical failure brands' --timeout 120000
          grep -Eq '^Ran 4 tests across 1 file' "$TASK_EVIDENCE/real-workerd.log"
          run_one real-workerd-provider packages/cloud/api __tests__/shared-eliza-runtime.miniflare.test.ts --test-name-pattern 'synthetic failure without committing' --timeout 120000
          run_one generic-rest packages/cloud/api __tests__/shared-rest-request-signal.test.ts --timeout 60000
          run_one request-signal-config packages/cloud/api __tests__/request-signal-config.test.ts --timeout 60000
          if timeout --kill-after=10s 60s node --experimental-strip-types --test --test-reporter=tap packages/cloud/api/__tests__/incoming-request-disconnect.miniflare.test.ts > "$TASK_EVIDENCE/incoming-http.log" 2>&1; then
            grep -Eq '^# pass 1$' "$TASK_EVIDENCE/incoming-http.log"
            grep -Eq '^# fail 0$' "$TASK_EVIDENCE/incoming-http.log"
          else
            task_exit=$?
            test "$(wc -c < "$TASK_EVIDENCE/incoming-http.log")" -le 2097152
            tail -100 "$TASK_EVIDENCE/incoming-http.log"
            exit "$task_exit"
          fi
          tail -8 "$TASK_EVIDENCE/incoming-http.log"
          test "$(git rev-parse HEAD)" = 6eefe82931b7d51f5788879da3677c0cfbee891c
          git diff --quiet HEAD
          SCRIPT
          # No fallback to the host network when namespace creation is unavailable.
          sudo -n unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            ip -o link show | grep -Eq "^[0-9]+: lo:"
            test -z "$(ip route show)"
            exec env -i PATH="$1" HOME="$2" CI=true NODE_ENV=test \
              WRANGLER_SEND_METRICS=false TURBO_TELEMETRY_DISABLED=1 DO_NOT_TRACK=1 \
              NODE_OPTIONS=--max-old-space-size=8192 RUN_TURBO_CONCURRENCY=1 \
              TASK_WORKSPACE="$3" TASK_EVIDENCE="$4" bash "$5"
          ' _ "$task_runner_path" "$task_runner_home" "$task_workspace" "$RUNNER_TEMP/focused-shared-controls" "$task_script"
      - name: Public types and whole Worker build in loopback-only namespace
        shell: bash
        run: |
          set -euo pipefail
          task_runner_path="$PATH"
          task_runner_home="$HOME"
          task_script="$RUNNER_TEMP/public-types-build.sh"
          cat > "$task_script" <<'SCRIPT'
          set -euo pipefail
          cd "$TASK_WORKSPACE"
          test "$(git rev-parse HEAD)" = 6eefe82931b7d51f5788879da3677c0cfbee891c
          check() {
            task_name="$1"; shift
            if timeout --kill-after=10s 120s "$@" > "$TASK_EVIDENCE/$task_name.log" 2>&1; then
              printf '%s: passed\n' "$task_name"
            else
              task_exit=$?
              test "$(wc -c < "$TASK_EVIDENCE/$task_name.log")" -le 2097152
              tail -100 "$TASK_EVIDENCE/$task_name.log"
              exit "$task_exit"
            fi
          }
          check public-api-types bun x --no-install tsc --project packages/cloud/api/tsconfig.json --noEmit --pretty false
          check public-shared-types bun x --no-install tsc --project packages/cloud/shared/tsconfig.json --noEmit --pretty false
          cd packages/cloud/api
          check public-worker-build bun x --no-install wrangler deploy --env production --dry-run --outdir "$TASK_EVIDENCE/public-worker"
          test -s "$TASK_EVIDENCE/public-worker/index.js"
          cd "$TASK_WORKSPACE"
          git diff --quiet HEAD
          SCRIPT
          sudo -n unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            test -z "$(ip route show)"
            exec env -i PATH="$1" HOME="$2" CI=true NODE_ENV=test \
              WRANGLER_SEND_METRICS=false TURBO_TELEMETRY_DISABLED=1 DO_NOT_TRACK=1 \
              NODE_OPTIONS=--max-old-space-size=8192 TASK_WORKSPACE="$3" TASK_EVIDENCE="$4" bash "$5"
          ' _ "$task_runner_path" "$task_runner_home" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/focused-shared-controls" "$task_script"
