name: Build Android Node runtime

on:
  workflow_call:
    inputs:
      publish-compiler-cache:
        type: boolean
        required: true

env:
  NODE_VERSION: "26.13.1"
  NODE_SOURCE_SHA256: a7f6204ff63b6a2cd274d48903285abb86ed53a99070e532d4c2fd787457d9e6
  NDK_VERSION: "29.0.14206865"
  ANDROID_API_LEVEL: "29"

jobs:
  runtime:
    name: Node 26 for ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            node_arch: arm64
            target: aarch64-linux-android
            machine: AArch64
          - abi: x86_64
            node_arch: x64
            target: x86_64-linux-android
            machine: Advanced Micro Devices X86-64
    env:
      ABI: ${{ matrix.abi }}
      NODE_ARCH: ${{ matrix.node_arch }}
      NDK_TARGET: ${{ matrix.target }}
      ELF_MACHINE: ${{ matrix.machine }}
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/android-node-build.yml
            .github/patches/node-26.13.1-android-host.patch
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Restore compiler objects for this recipe
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache-android-node
          key: android-node-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('.github/workflows/android-node-build.yml', '.github/patches/node-26.13.1-android-host.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-node-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('.github/workflows/android-node-build.yml', '.github/patches/node-26.13.1-android-host.patch') }}-
            android-node-${{ runner.os }}-${{ matrix.abi }}-

      - name: Configure compiler cache
        id: compiler-cache
        shell: bash
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ccache
          fi
          export CCACHE_DIR="$RUNNER_TEMP/ccache-android-node"
          printf 'CCACHE_DIR=%s\n' "$CCACHE_DIR" >> "$GITHUB_ENV"
          ccache --max-size=1250M

      - name: Install pinned Android compiler
        shell: bash
        run: |
          sdk=${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is required}}
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          ndk_bin="$sdk/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndk_bin/$NDK_TARGET$ANDROID_API_LEVEL-clang" --version
          "$ndk_bin/$NDK_TARGET$ANDROID_API_LEVEL-clang++" --version
          printf 'NDK_BIN=%s\n' "$ndk_bin" >> "$GITHUB_ENV"

      - name: Verify and extract the official Node sources
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          archive="node-v$NODE_VERSION.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://nodejs.org/dist/v$NODE_VERSION/$archive" --output "$archive"
          printf '%s  %s\n' "$NODE_SOURCE_SHA256" "$archive" | sha256sum --check --strict
          tar -xf "$archive"
          (cd "node-v$NODE_VERSION" && git apply "$GITHUB_WORKSPACE/.github/patches/node-26.13.1-android-host.patch")
          mkdir -p android-node

      - name: Build the Android executable
        shell: bash
        run: |
          cd "$RUNNER_TEMP/node-v$NODE_VERSION"
          ndk=${NDK_BIN%/toolchains/llvm/prebuilt/linux-x86_64/bin}
          target="$NDK_BIN/$NDK_TARGET$ANDROID_API_LEVEL"
          export CC="ccache $target-clang" CXX="ccache $target-clang++"
          export CC_host="ccache /usr/bin/gcc" CXX_host="ccache /usr/bin/g++"
          export GYP_DEFINES="target_arch=$NODE_ARCH v8_target_arch=$NODE_ARCH android_target_arch=$NODE_ARCH host_os=linux OS=android android_ndk_path=$ndk"
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(stat -c %Y configure.py)
          log="$RUNNER_TEMP/android-node/build.log"
          ./configure --dest-cpu="$NODE_ARCH" --dest-os=android --cross-compiling \
            --openssl-no-asm --shared-zlib --v8-disable-temporal-support \
            --without-node-snapshot 2>&1 | tee "$log"
          python3 - <<'PY'
          import ast, os
          from pathlib import Path
          assert ast.literal_eval(Path("config.gypi").read_text())["variables"]["host_arch"] == "x64"
          makefiles = Path("out/tools/v8_gypfiles")
          host = (makefiles / "v8_base_without_compiler.host.mk").read_text()
          android = (makefiles / "v8_base_without_compiler.target.mk").read_text()
          handlers = ["handler-inside-posix.o", "handler-outside-posix.o"]
          if os.environ["NODE_ARCH"] == "arm64":
              handlers.append("handler-outside-simulator.o")
          for handler in handlers:
              assert f"/trap-handler/{handler}" in host and f"/trap-handler/{handler}" not in android, handler
          PY
          timeout --signal=TERM --kill-after=30s 210m make -j "$(nproc)" CC.host="$CC_host" CXX.host="$CXX_host" AR.host=/usr/bin/ar \
            AR.target="$NDK_BIN/llvm-ar" \
            'LDFLAGS.target=-static-libstdc++ -Wl,-z,max-page-size=16384' \
            2>&1 | tee -a "$log"
          test -x out/Release/node
          "$NDK_BIN/llvm-strip" --strip-debug out/Release/node \
            -o "$RUNNER_TEMP/android-node/libeliza_node.so"
          cp LICENSE "$RUNNER_TEMP/android-node/LICENSE"

      - name: Verify ABI, Android interpreter and dependency closure
        shell: bash
        run: |
          cd "$RUNNER_TEMP/android-node"
          chmod 755 libeliza_node.so
          "$NDK_BIN/llvm-readelf" --file-header --program-headers --dynamic libeliza_node.so > elf.txt
          grep -F "$ELF_MACHINE" elf.txt
          grep -F 'Requesting program interpreter: /system/bin/linker64' elf.txt
          grep -E '^ *Type: +DYN' elf.txt
          if grep -E 'Shared library: \[(libc\+\+_shared\.so|libstdc\+\+\.so\.6|libgcc_s\.so\.1)\]' elf.txt; then
            exit 1
          fi
          sha256sum libeliza_node.so > SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          elf = Path("elf.txt").read_text()
          allowed = {"libandroid.so", "libc.so", "libdl.so", "liblog.so", "libm.so", "libz.so"}
          needed = set(re.findall(r"Shared library: \[([^\]]+)\]", elf))
          loads = [line.split() for line in elf.splitlines() if line.strip().startswith("LOAD ")]
          if not needed or needed - allowed or not loads or any(int(line[-1], 16) < 16 * 1024 for line in loads):
              raise SystemExit("Android executable has unexpected dependencies or page alignment")
          with Path("libeliza_node.so").open("rb") as binary:
              digest = hashlib.file_digest(binary, "sha256").hexdigest()
          manifest = {
              "schema": 1,
              "abi": os.environ["ABI"],
              "version": os.environ["NODE_VERSION"],
              "ndk": os.environ["NDK_VERSION"],
              "apiLevel": int(os.environ["ANDROID_API_LEVEL"]),
              "sha256": digest,
              "sourceSha256": os.environ["NODE_SOURCE_SHA256"],
              "sourceUrl": f"https://nodejs.org/dist/v{os.environ['NODE_VERSION']}/node-v{os.environ['NODE_VERSION']}.tar.xz",
              "buildCommit": os.environ["GITHUB_SHA"],
              "systemLibraries": sorted(needed),
          }
          Path("manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload verified Android runtime
        uses: actions/upload-artifact@v7
        with:
          name: node-${{ env.NODE_VERSION }}-android-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/android-node/libeliza_node.so
            ${{ runner.temp }}/android-node/manifest.json
            ${{ runner.temp }}/android-node/SHA256SUMS
            ${{ runner.temp }}/android-node/elf.txt
            ${{ runner.temp }}/android-node/LICENSE
          if-no-files-found: error

      - name: Save compiler objects for a future build
        if: ${{ always() && inputs.publish-compiler-cache && steps.compiler-cache.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache-android-node
          key: android-node-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('.github/workflows/android-node-build.yml', '.github/patches/node-26.13.1-android-host.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: node-${{ env.NODE_VERSION }}-android-${{ matrix.abi }}-log
          path: ${{ runner.temp }}/android-node/build.log
          if-no-files-found: ignore
