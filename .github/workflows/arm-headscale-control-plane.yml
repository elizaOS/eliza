name: Arm Headscale Control Plane

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment to converge
        required: true
        type: choice
        options:
          - staging
          - production
      operation:
        description: Inspect, converge, or retire the reviewed staging legacy vhost while converging
        required: true
        type: choice
        default: converge
        options:
          - inspect-legacy-vhost
          - converge
          - retire-legacy-vhost-and-converge
      reviewed_legacy_vhost_sha256:
        description: Exact SHA-256 printed by the reviewed staging inspection (retirement only)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: arm-headscale-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  arm:
    name: Arm Headscale (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      TARGET_OPERATION: ${{ inputs.operation }}
      TARGET_REVIEWED_LEGACY_VHOST_SHA256: ${{ inputs.reviewed_legacy_vhost_sha256 }}
      DEPLOY_HOST: ${{ secrets.ELIZA_PROVISIONING_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.ELIZA_PROVISIONING_SSH_KNOWN_HOSTS }}
      HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
      HEADSCALE_PUBLIC_URL: ${{ vars.HEADSCALE_PUBLIC_URL }}
      AGENT_TOKEN_PRIVATE_KEY_PEM: ${{ secrets.AGENT_TOKEN_PRIVATE_KEY_PEM }}
      ELIZA_LOCAL_ROOT_KEY: ${{ secrets.ELIZA_LOCAL_ROOT_KEY }}
    steps:
      - name: Validate protected deploy source
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            staging) expected_ref="refs/heads/develop" ;;
            production) expected_ref="refs/heads/main" ;;
            *)
              echo "::error::Unsupported Headscale target environment"
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "::error::$TARGET_ENVIRONMENT Headscale deploys must run from $expected_ref"
            exit 1
          fi
          case "$TARGET_OPERATION" in
            converge)
              if [ -n "$TARGET_REVIEWED_LEGACY_VHOST_SHA256" ]; then
                echo "::error::reviewed_legacy_vhost_sha256 is accepted only for retirement"
                exit 1
              fi
              ;;
            inspect-legacy-vhost)
              if [ "$TARGET_ENVIRONMENT" != "staging" ]; then
                echo "::error::$TARGET_OPERATION is registered only for the reviewed staging legacy vhost"
                exit 1
              fi
              if [ -n "$TARGET_REVIEWED_LEGACY_VHOST_SHA256" ]; then
                echo "::error::reviewed_legacy_vhost_sha256 is accepted only for retirement"
                exit 1
              fi
              ;;
            retire-legacy-vhost-and-converge)
              if [ "$TARGET_ENVIRONMENT" != "staging" ]; then
                echo "::error::$TARGET_OPERATION is registered only for the reviewed staging legacy vhost"
                exit 1
              fi
              if ! [[ "$TARGET_REVIEWED_LEGACY_VHOST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::retirement requires the exact lowercase SHA-256 printed by the reviewed inspection"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported Headscale operation"
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Validate canonical control-plane inputs
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS HEADSCALE_API_KEY HEADSCALE_PUBLIC_URL; do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required protected setting name(s): ${missing[*]}"
            exit 1
          fi

          case "$TARGET_ENVIRONMENT" in
            production)
              expected_public_url="https://headscale.eliza.app"
              expected_legacy_public_url="https://headscale.elizacloud.ai"
              ;;
            staging)
              expected_public_url="https://headscale-staging.eliza.app"
              expected_legacy_public_url="https://headscale-staging.elizacloud.ai"
              ;;
            *)
              echo "::error::Unsupported Headscale target environment"
              exit 1
              ;;
          esac
          if [ "$HEADSCALE_PUBLIC_URL" != "$expected_public_url" ]; then
            echo "::error::HEADSCALE_PUBLIC_URL does not match the canonical $TARGET_ENVIRONMENT contract"
            exit 1
          fi

          echo "resolved_legacy_public_url=$expected_legacy_public_url" >> "$GITHUB_ENV"

      - name: Install deploy SSH identity
        id: key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/headscale-deploy-key"
          known_hosts_path="$RUNNER_TEMP/headscale-known-hosts"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_path"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known_hosts_path"
          if ! ssh-keygen -F "$DEPLOY_HOST" -f "$known_hosts_path" >/dev/null; then
            echo "::error::Protected known_hosts inventory has no entry for the control-plane host"
            exit 1
          fi
          echo "path=$key_path" >> "$GITHUB_OUTPUT"
          echo "known_hosts_path=$known_hosts_path" >> "$GITHUB_OUTPUT"

      - name: Inspect or converge Headscale control plane
        shell: bash
        env:
          DEPLOY_SSH_KEY_PATH: ${{ steps.key.outputs.path }}
        run: |
          set -euo pipefail
          args=(
            node packages/cloud/scripts/admin/arm-headscale-control-plane.mjs
            --host "$DEPLOY_HOST"
            --ssh-key "$DEPLOY_SSH_KEY_PATH"
            --ssh-known-hosts "${{ steps.key.outputs.known_hosts_path }}"
            --headscale-public-url "$HEADSCALE_PUBLIC_URL"
            --headscale-legacy-public-url "$resolved_legacy_public_url"
          )
          case "$TARGET_OPERATION" in
            inspect-legacy-vhost)
              args+=(--inspect-retirable-legacy-vhost)
              ;;
            retire-legacy-vhost-and-converge)
              args+=(
                --retire-retirable-legacy-vhost
                --retirable-legacy-vhost-sha256 "$TARGET_REVIEWED_LEGACY_VHOST_SHA256"
              )
              ;;
          esac
          "${args[@]}"

      - name: Verify dual-SAN public identity and health
        if: inputs.operation != 'inspect-legacy-vhost'
        shell: bash
        run: |
          set -euo pipefail
          for public_url in "$HEADSCALE_PUBLIC_URL" "$resolved_legacy_public_url"; do
            healthy=false
            for _ in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 10 \
                "$public_url/health" >/dev/null; then
                healthy=true
                break
              fi
              sleep 5
            done
            if [ "$healthy" != "true" ]; then
              echo "::error::Headscale health did not become ready at $public_url"
              exit 1
            fi
          done

          leaf_has_exact_san() {
            local leaf_pem="$1"
            local required_hostname="$2"
            printf '%s\n' "$leaf_pem" \
              | openssl x509 -noout -ext subjectAltName \
              | tr ',' '\n' \
              | sed -n 's/^[[:space:]]*DNS://p' \
              | grep -Fx -- "$required_hostname" >/dev/null
          }

          expected_fingerprint=""
          for public_url in "$HEADSCALE_PUBLIC_URL" "$resolved_legacy_public_url"; do
            host="${public_url#https://}"
            leaf_pem="$(
              openssl s_client \
                -connect "$host:443" \
                -servername "$host" \
                -verify_hostname "$host" \
                -verify_return_error \
                -showcerts </dev/null 2>/dev/null \
                | openssl x509 -outform PEM
            )"
            for required_hostname in \
              "${HEADSCALE_PUBLIC_URL#https://}" \
              "${resolved_legacy_public_url#https://}"; do
              if ! leaf_has_exact_san "$leaf_pem" "$required_hostname"; then
                echo "::error::$host did not serve a leaf with exact SAN $required_hostname"
                exit 1
              fi
            done
            fingerprint="$(
              printf '%s\n' "$leaf_pem" \
                | openssl x509 -outform DER \
                | openssl dgst -sha256 -r \
                | awk '{print $1}'
            )"
            if [ -z "$expected_fingerprint" ]; then
              expected_fingerprint="$fingerprint"
            elif [ "$fingerprint" != "$expected_fingerprint" ]; then
              echo "::error::Canonical and legacy SNI names served different certificate leaves"
              exit 1
            fi
          done
          echo "Both Headscale SNI names served the same exact dual-SAN certificate leaf"

      - name: Remove deploy SSH identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "$RUNNER_TEMP/headscale-deploy-key" \
            "$RUNNER_TEMP/headscale-known-hosts"; do
            if [ -f "$path" ]; then
              shred -u "$path"
            fi
          done
