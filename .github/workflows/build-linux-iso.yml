name: Build elizaOS Linux ISO

# One canonical live distro at packages/os/linux. Tails' live-build fork is
# amd64-only, so this workflow publishes only the architecture it can build and
# boot-test. Non-amd64 package experiments remain static development contracts;
# they are not advertised as ISO artifacts.

on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [nightly, beta, stable]
        default: nightly
      publish:
        description: Upload to GitHub Release
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 300
    permissions:
      # contents: write covers softprops/action-gh-release (release upload)
      #   and anchore/sbom-action (artifact attachment). The workflow-level
      #   default is read; override here at the job level so the privilege
      #   is scoped as tightly as possible.
      # id-token + attestations are required by
      #   actions/attest-build-provenance@v4 to mint a Sigstore-signed
      #   SLSA build provenance for the ISO via GitHub OIDC.
      contents: write
      id-token: write
      attestations: write
    env:
      CHANNEL: ${{ inputs.channel || (github.event_name == 'release' && 'stable') || 'nightly' }}
      LINUX_DIR: packages/os/linux
      # The inherited Tails live-build fork rejects every other architecture.
      ELIZAOS_ARCH: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve available Tails APT snapshots
        run: |
          set -euo pipefail
          SNAPSHOTS=$(node "${LINUX_DIR}/scripts/resolve-apt-snapshots.mjs")
          echo "APT_SNAPSHOTS_SERIALS=${SNAPSHOTS}" >> "$GITHUB_ENV"
          echo "::notice::Using verified Tails APT snapshots ${SNAPSHOTS}"

      - name: Restore live-build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LINUX_DIR }}/cache
          key: elizaos-iso-${{ env.ELIZAOS_ARCH }}-${{ hashFiles('packages/os/linux/tails/auto/config', 'packages/os/linux/tails/config/chroot_local-packageslists/**', 'packages/os/linux/tails/config/binary_local-hooks/**', 'packages/os/linux/patches/**', 'packages/os/linux/Dockerfile') }}
          restore-keys: elizaos-iso-${{ env.ELIZAOS_ARCH }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Install just + ripgrep
        # ripgrep (rg) is a hard dependency of packages/os/linux/scripts/static-smoke.sh
        # (the static cross-architecture contract step). It is not guaranteed on
        # every runner image, so install it explicitly before the smoke check.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends just ripgrep

      - name: Resolve Bun version from package metadata
        id: bun-version
        run: |
          set -euo pipefail
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager")
          case "$PACKAGE_MANAGER" in
            bun@*) VERSION="${PACKAGE_MANAGER#bun@}" ;;
            *)
              echo "::error::packageManager must pin Bun, got ${PACKAGE_MANAGER}"
              exit 1
              ;;
          esac
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::packageManager must use an exact Bun version, got ${PACKAGE_MANAGER}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install workspace dependencies from frozen lockfile
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- package.json bun.lock

      - name: Verify non-amd64 static contracts
        run: |
          set -euo pipefail
          bash scripts/verify-riscv64-buildpaths.sh
          cd "${LINUX_DIR}"
          ELIZAOS_STATIC_SOURCE_ONLY=1 ./scripts/static-smoke.sh

      - name: Build ISO (amd64)
        working-directory: ${{ env.LINUX_DIR }}
        # ELIZAOS_BUILD_APP=1 lets `just elizaos-app` compile the Electrobun
        # desktop artifact in CI when no pre-staged ${ELIZAOS_APP_ARTIFACT} is
        # provided. The host smoke starts that exact staged runtime before the
        # long live-build phase, retaining actionable startup output and
        # preventing an unstartable application from being sealed into an ISO.
        #
        # NODE_OPTIONS lifts the V8 heap so the Vite renderer build can
        # bundle the full elizaOS plugin graph; the default 4 GB heap
        # OOMs on the renderer step (observed locally on a 30 GB host).
        env:
          ELIZAOS_BUILD_APP: 1
          ELIZAOS_DOCKER_BUILDX_GHA_CACHE: 1
          ELIZAOS_DOCKER_BUILDX_CACHE_SCOPE: elizaos-linux-iso-${{ env.ELIZAOS_ARCH }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -euo pipefail
          just elizaos-app
          just runtime-smoke
          just build
          git diff --exit-code -- package.json bun.lock
        timeout-minutes: 180

      - name: Locate and rename ISO
        id: iso
        env:
          # Fail closed if the ISO exceeds this budget. Current amd64 builds
          # land around 1.9 GB, so 3 GiB leaves ~50% headroom without letting
          # a silent regression bloat the image. Override via env if a build
          # intentionally needs more room.
          ISO_MAX_BYTES: ${{ env.ELIZAOS_ISO_MAX_BYTES || '3221225472' }}
        run: |
          set -euo pipefail
          ISO=$(find "${LINUX_DIR}/out" \( -name "binary.iso" -o -name "tails-${ELIZAOS_ARCH}-*.iso" -o -name "elizaos-live-${ELIZAOS_ARCH}-*.iso" -o -name "elizaos-linux-${ELIZAOS_ARCH}-*.iso" \) | sort | tail -1)
          if [ -z "$ISO" ]; then
            echo "ERROR: ISO not found after build"
            exit 1
          fi
          DATE=$(date +%Y.%m.%d)
          DEST="elizaos-live-${CHANNEL}-${DATE}-${ELIZAOS_ARCH}.iso"
          cp "$ISO" "$DEST"
          SIZE=$(stat --format=%s "$DEST")
          if [ "$SIZE" -gt "$ISO_MAX_BYTES" ]; then
            echo "::error::ISO above size budget: ${SIZE} bytes > ${ISO_MAX_BYTES} bytes. Set ELIZAOS_ISO_MAX_BYTES if the increase is intentional."
            exit 1
          fi
          sha256sum "$DEST" > "$DEST.sha256"
          {
            echo "path=$DEST"
            echo "filename=$DEST"
            echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test ISO through SeaBIOS and OVMF
        timeout-minutes: 40
        env:
          ELIZAOS_ISO_SMOKE_TIMEOUT_SECONDS: 900
          # The bundled standard x64 Bun runtime requires AVX2; QEMU's implicit
          # qemu64 model predates that contract and exits with SIGILL under TCG.
          ELIZAOS_ISO_SMOKE_CPU_MODEL: Haswell-v4
          ELIZAOS_ISO_SMOKE_LOG_DIR: ${{ runner.temp }}/elizaos-iso-smoke-logs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ovmf qemu-system-x86 seabios xorriso
          bash "${LINUX_DIR}/scripts/smoke-test-iso.sh" "${{ steps.iso.outputs.path }}"

      - name: Upload ISO boot diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-live-iso-boot-diagnostics-${{ env.CHANNEL }}-${{ env.ELIZAOS_ARCH }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/elizaos-iso-smoke-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Attest SLSA build provenance for ISO
        # Mints a Sigstore-signed in-toto/SLSA provenance attestation
        # tied to this repo + workflow + commit, via GitHub OIDC.
        # No long-lived secrets. Users verify with:
        #   gh attestation verify <iso-file> --owner elizaOS
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ steps.iso.outputs.path }}

      - name: Install squashfs-tools (for SBOM extraction)
        run: sudo apt-get install -y --no-install-recommends squashfs-tools

      - name: Extract full runtime root from ISO
        # Syft must see the complete mounted root: /var/lib/dpkg covers the OS,
        # while /opt/elizaos carries the bundled Bun/Electrobun app and its JS
        # dependency metadata.
        id: sbom-extract
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          SQ="${RUNNER_TEMP}/elizaos-iso-sbom-root"
          MOUNTED=0
          EXTRACTED=0
          cleanup_mount() {
            if [ "$MOUNTED" = "1" ]; then
              sudo umount "$MNT"
            fi
            if [ -d "$MNT" ]; then
              rmdir "$MNT"
            fi
            if [ "$EXTRACTED" = "0" ]; then
              node "$GITHUB_WORKSPACE/packages/scripts/rm-path-recursive.mjs" "$SQ"
            fi
          }
          trap cleanup_mount EXIT
          node "$GITHUB_WORKSPACE/packages/scripts/rm-path-recursive.mjs" "$SQ"
          sudo mount -o loop,ro "${{ steps.iso.outputs.path }}" "$MNT"
          MOUNTED=1
          # Parentheses group the -name alternation so -maxdepth applies to both.
          SQUASH=$(sudo find "$MNT" -maxdepth 4 \( -name 'filesystem.squashfs' -o -name '*.squashfs' \) 2>/dev/null | head -1)
          if [ -z "$SQUASH" ]; then
            echo "::error::No SquashFS runtime root found in ISO"
            exit 1
          fi
          sudo unsquashfs -d "$SQ" "$SQUASH" > /dev/null
          sudo umount "$MNT"
          MOUNTED=0
          rmdir "$MNT"
          sudo chown -R "$USER:$USER" "$SQ"
          if [ ! -s "$SQ/var/lib/dpkg/status" ]; then
            echo "::error::Extracted runtime root has no Debian package database"
            exit 1
          fi
          if [ ! -d "$SQ/opt/elizaos" ]; then
            echo "::error::Extracted runtime root has no bundled elizaOS app"
            exit 1
          fi
          JS_MANIFEST_COUNT=$(find "$SQ/opt/elizaos" -type f -name package.json -print 2>/dev/null | wc -l)
          if [ "$JS_MANIFEST_COUNT" -eq 0 ]; then
            echo "::error::Extracted runtime root has no bundled elizaOS JS package manifests"
            exit 1
          fi
          echo "root=$SQ" >> "$GITHUB_OUTPUT"
          echo "js-manifest-count=$JS_MANIFEST_COUNT" >> "$GITHUB_OUTPUT"
          EXTRACTED=1
          trap - EXIT

      - name: Generate ISO SBOM (SPDX 2.3 JSON)
        # anchore/sbom-action drives syft over the complete extracted root.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ steps.sbom-extract.outputs.root }}
          format: spdx-json
          output-file: ${{ steps.iso.outputs.filename }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate ISO SBOM coverage
        run: |
          set -euo pipefail
          SBOM="${{ steps.iso.outputs.filename }}.spdx.json"
          if [ ! -s "$SBOM" ]; then
            echo "::error::ISO SBOM is missing or empty"
            exit 1
          fi
          jq -e '
            .spdxVersion == "SPDX-2.3" and
            (.packages | type == "array" and length > 0)
          ' "$SBOM" > /dev/null
          COUNT=$(jq '.packages | length' "$SBOM")
          DEBIAN_COUNT=$(jq '
            [.packages[] |
              select(any(.externalRefs[]?;
                (.referenceLocator // "") | startswith("pkg:deb/")))] |
            length
          ' "$SBOM")
          JS_COUNT=$(jq '
            [.packages[] |
              select(any(.externalRefs[]?;
                (.referenceLocator // "") | startswith("pkg:npm/")))] |
            length
          ' "$SBOM")
          if [ "$DEBIAN_COUNT" -eq 0 ]; then
            echo "::error::ISO SBOM contains no Debian package inventory"
            exit 1
          fi
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "::error::ISO SBOM contains no bundled JS/app dependency inventory"
            exit 1
          fi
          echo "::notice::SBOM contains ${COUNT} packages (${DEBIAN_COUNT} Debian, ${JS_COUNT} JS; ${{ steps.sbom-extract.outputs.js-manifest-count }} bundled manifests scanned)"

      - name: Remove extracted SBOM root
        if: always() && steps.sbom-extract.outputs.root != ''
        run: node "$GITHUB_WORKSPACE/packages/scripts/rm-path-recursive.mjs" "${{ steps.sbom-extract.outputs.root }}"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-live-iso-${{ env.CHANNEL }}-${{ env.ELIZAOS_ARCH }}
          path: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.filename }}.sha256
            ${{ steps.iso.outputs.filename }}.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'workflow_call' && inputs.publish == true)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.filename }}.sha256
            ${{ steps.iso.outputs.filename }}.spdx.json
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write ISO metadata to summary
        run: |
          {
            echo "## elizaOS Live ISO (${ELIZAOS_ARCH})"
            echo "| Field | Value |"
            echo "| ----- | ----- |"
            echo "| File | \`${{ steps.iso.outputs.filename }}\` |"
            echo "| SHA-256 | \`${{ steps.iso.outputs.sha256 }}\` |"
            echo "| Size | ${{ steps.iso.outputs.size }} bytes |"
            echo "| Channel | ${CHANNEL} |"
          } >> "$GITHUB_STEP_SUMMARY"
