name: Native App Auth Database Migration

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected environment whose existing native registrations to migrate
        required: true
        type: choice
        options:
          - staging
          - production
      operation:
        description: Import existing registrations once, or verify the completed database registration
        required: true
        default: verify
        type: choice
        options:
          - verify
          - import
      callbacks_json:
        description: Optional reviewed callback snapshot if reading the live Pages configuration fails
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # Do not import while a release can change the deployed registration source.
  group: cloud-cf-release-v6-${{ inputs.target_environment }}
  cancel-in-progress: false
  queue: max

jobs:
  migrate:
    name: ${{ inputs.operation }} ${{ inputs.target_environment }} native registrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed migration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.1.0
        with:
          node-version: "24.15.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Import or verify existing native registrations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.target_environment }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_IDENTITY_EXPECTED_CLUSTER_SHA256: ${{ vars.DATABASE_IDENTITY_EXPECTED_CLUSTER_SHA256 }}
          DATABASE_IDENTITY_EXPECTED_AUTHORITY_SHA256: ${{ vars.DATABASE_IDENTITY_EXPECTED_AUTHORITY_SHA256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: eliza-app
          # These old inputs are read only for the one-time database migration.
          # Normal releases and runtime do not read them.
          ELIZA_MOBILE_APP_AUTH_ENABLED: ${{ vars.ELIZA_MOBILE_APP_AUTH_ENABLED }}
          ELIZA_MOBILE_APP_AUTH_APP_ID: ${{ secrets.ELIZA_MOBILE_APP_AUTH_APP_ID }}
          ELIZA_MOBILE_APP_AUTH_CLIENTS_JSON: ${{ secrets.ELIZA_MOBILE_APP_AUTH_CLIENTS_JSON }}
          ELIZA_ANDROID_ASSET_LINKS_JSON: ${{ vars.ELIZA_ANDROID_ASSET_LINKS_JSON || secrets.ELIZA_ANDROID_ASSET_LINKS_JSON }}
          ELIZA_NATIVE_AUTH_CALLBACKS_JSON: ${{ inputs.callbacks_json }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            import)
              bun --conditions=eliza-source packages/scripts/cloud/admin/migrate-native-app-auth.ts
              bun --conditions=eliza-source packages/scripts/cloud/admin/migrate-native-app-auth.ts --verify
              ;;
            verify) bun --conditions=eliza-source packages/scripts/cloud/admin/migrate-native-app-auth.ts --verify ;;
            *) echo "::error::Unknown native registration migration operation"; exit 1 ;;
          esac
