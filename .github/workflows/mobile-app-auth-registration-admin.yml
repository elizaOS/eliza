name: Mobile App Auth Registration Admin

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected GitHub Environment to inspect or repair
        required: true
        type: choice
        options:
          - staging
          - production
      operation:
        description: Diagnose is read-only; repair is idempotent and fail-closed
        required: true
        type: choice
        options:
          - diagnose
          - inventory
          - compare-primary
          - repair
      client:
        description: First-party native client whose apps registration to inspect or repair
        required: false
        default: ai.elizaos.app
        type: choice
        options:
          - ai.elizaos.app
          - ai.elizaresearch.alphaphone
          - ai.elizaresearch.seniorcare

permissions:
  contents: read

concurrency:
  group: mobile-app-auth-registration-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  registration:
    name: ${{ inputs.operation }} ${{ inputs.target_environment }} ${{ inputs.client }} registration
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact admin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.1.0
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Read-only mobile auth inventory or primary authority comparison
        if: inputs.operation == 'inventory' || inputs.operation == 'compare-primary'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ELIZA_MOBILE_APP_AUTH_INVENTORY_OPERATION: ${{ inputs.operation }}
          ELIZA_MOBILE_APP_AUTH_APP_ID: ${{ secrets.ELIZA_MOBILE_APP_AUTH_APP_ID }}
          DATABASE_IDENTITY_EXPECTED_CLUSTER_SHA256: ${{ vars.DATABASE_IDENTITY_EXPECTED_CLUSTER_SHA256 }}
          DATABASE_IDENTITY_EXPECTED_AUTHORITY_SHA256: ${{ vars.DATABASE_IDENTITY_EXPECTED_AUTHORITY_SHA256 }}
          ELIZA_MOBILE_APP_AUTH_ORGANIZATION_ID: ${{ secrets.ELIZA_MOBILE_APP_AUTH_ORGANIZATION_ID }}
          ELIZA_MOBILE_APP_AUTH_OWNER_USER_ID: ${{ secrets.ELIZA_MOBILE_APP_AUTH_OWNER_USER_ID }}
          ELIZA_MOBILE_APP_AUTH_ENVIRONMENT: ${{ inputs.target_environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun packages/scripts/cloud/admin/inventory-mobile-app-auth.ts
      - name: Diagnose or repair protected registration
        if: inputs.operation == 'diagnose' || inputs.operation == 'repair'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ELIZA_MOBILE_APP_AUTH_APP_ID: ${{ secrets.ELIZA_MOBILE_APP_AUTH_APP_ID }}
          ELIZA_MOBILE_APP_AUTH_ORGANIZATION_ID: ${{ secrets.ELIZA_MOBILE_APP_AUTH_ORGANIZATION_ID }}
          ELIZA_MOBILE_APP_AUTH_OWNER_USER_ID: ${{ secrets.ELIZA_MOBILE_APP_AUTH_OWNER_USER_ID }}
          # Additional clients (Alpha Phone, Senior Care) resolve their app UUID from the
          # same registry the Worker reads, bound to this environment.
          ELIZA_MOBILE_APP_AUTH_CLIENTS_JSON: ${{ secrets.ELIZA_MOBILE_APP_AUTH_CLIENTS_JSON }}
          ELIZA_MOBILE_APP_AUTH_TARGET_CLIENT_ID: ${{ inputs.client }}
          ELIZA_MOBILE_APP_AUTH_ENVIRONMENT: ${{ inputs.target_environment }}
        run: node packages/scripts/cloud/admin/repair-mobile-app-auth-registration.ts "${{ inputs.operation }}"
