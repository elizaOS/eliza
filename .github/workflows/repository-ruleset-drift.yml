# Performs semantic readback of the active repository ruleset manifest. The
# disabled develop candidate stays source-validated and cannot enter this live
# readback until a reviewed source transition makes it active and applyable.
name: Repository Ruleset Drift

on:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [repository_ruleset_drift]

concurrency:
  group: repository-ruleset-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readback:
    name: Ruleset readback
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: repository-ruleset-readback
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - .github/rulesets/required-main.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Require the Administration-read credential
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_RULESET_READ_ENV_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::REPOSITORY_RULESET_READ_ENV_TOKEN is required from the repository-ruleset-readback Environment with repository Administration: read permission"
            exit 1
          fi

      - name: Compare live ruleset with the reviewed manifest
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_RULESET_READ_ENV_TOKEN }}
        run: >-
          ./scripts/security/apply-branch-protection.sh
          --manifest "${{ matrix.manifest }}"
          --check
          --repo "$GITHUB_REPOSITORY"
