name: Merge Candidate Biome

# Full-tree Biome diagnostics remain available on demand. PR and merge events
# are owned exclusively by pr-static-smoke.yml.
on:
  workflow_dispatch:

concurrency:
  group: merge-candidate-biome-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate-tree:
    name: Candidate tree
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          submodules: false

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Verify the repository-pinned Biome version
        run: bun run check:biome-version

      - name: Check candidate lint
        run: bun run lint:check

      - name: Check candidate formatting
        run: bun run format:check
