name: Deploy Eliza Provisioning Worker

run-name: Provisioning worker ${{ inputs.environment || 'staging' }} ${{ inputs.deployment_sha || github.sha }} ${{ inputs.effect_digest || 'manual' }}

# SSHes to the Hetzner provisioning host and deploys one immutable commit,
# installs the systemd unit shipped at packages/cloud/scripts/admin/eliza-provisioning-worker.service,
# and restarts the eliza-provisioning-worker daemon.
#
# First-time setup:
#   HCLOUD_TOKEN=... bun run packages/cloud/scripts/admin/bootstrap-provisioning-worker-host.mjs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (host + secrets resolved from this)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deployment_sha:
        description: 'Optional exact repository commit for protected staging acceptance'
        required: false
        type: string
      effect_digest:
        description: Exact reconciler input digest; empty for manual operation
        required: false
        default: ""
        type: string

# Per-run admission so two dispatches of the same SHA both reach
# determine-env (#18092). The deploy job is the SSH critical section.
concurrency:
  group: deploy-eliza-provisioning-worker-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}-${{ format('run-{0}', github.run_id) }}
  cancel-in-progress: false

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  determine-env:
    name: Determine environment
    runs-on: [self-hosted, Linux, X64]
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      branch: ${{ steps.env.outputs.branch }}
      deployment_sha: ${{ steps.snapshot.outputs.deployment_sha }}
    steps:
      - id: env
        run: |
          # Production is a protected release target. A manual dispatch from
          # any non-main ref must never be able to select production secrets or
          # deploy the current main snapshot while running unreviewed code.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ "${{ github.event.inputs.environment }}" = "production" ] \
            && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Production deployments must be dispatched from refs/heads/main"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            env="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            env="production"
          else
            env="staging"
          fi
          branch=$([ "$env" = "production" ] && echo "main" || echo "develop")
          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "branch=$branch"   >> "$GITHUB_OUTPUT"
          echo "Resolved: environment=$env branch=$branch"
      - id: snapshot
        env:
          BRANCH: ${{ steps.env.outputs.branch }}
          EFFECT_DIGEST: ${{ inputs.effect_digest }}
          PUSH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ github.event.inputs.deployment_sha }}
          TARGET_ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            deployment_sha="$PUSH_SHA"
          elif [ -n "$REQUESTED_SHA" ]; then
            [ "$TARGET_ENVIRONMENT" = "staging" ] || {
              echo "::error::An exact deployment_sha is permitted only for protected staging deployments"
              exit 1
            }
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::deployment_sha must be a lowercase 40-hex commit"
              exit 1
            }
            verify_dir=$(mktemp -d)
            trap 'rm -rf "$verify_dir"' EXIT
            git -C "$verify_dir" init --quiet
            git -C "$verify_dir" fetch --quiet --no-tags --depth=1 \
              "https://github.com/${GITHUB_REPOSITORY}.git" "$REQUESTED_SHA"
            deployment_sha=$(git -C "$verify_dir" rev-parse FETCH_HEAD)
            [ "$deployment_sha" = "$REQUESTED_SHA" ] || {
              echo "::error::Fetched commit does not match requested deployment_sha"
              exit 1
            }
          else
            deployment_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$BRANCH" | awk 'NR == 1 { print $1 }')
          fi
          [[ "$deployment_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve immutable deployment SHA for $BRANCH"; exit 1; }
          if [ -n "$EFFECT_DIGEST" ]; then
            [[ "$EFFECT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid reconciled effect digest"; exit 1; }
            [ -n "$REQUESTED_SHA" ] || { echo "::error::Reconciled deploy requires deployment_sha"; exit 1; }
            current_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$BRANCH" | awk 'NR == 1 { print $1 }')"
            [ "$current_sha" = "$deployment_sha" ] || {
              echo "::error::$BRANCH is $current_sha, not reconciled source $deployment_sha"
              exit 1
            }
          fi
          echo "deployment_sha=$deployment_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved immutable deployment snapshot: $deployment_sha"

  deploy:
    name: Deploy worker to Hetzner host (${{ needs.determine-env.outputs.environment }} @ ${{ needs.determine-env.outputs.deployment_sha }})
    runs-on: [self-hosted, Linux, X64]
    needs: determine-env
    concurrency:
      group: deploy-eliza-provisioning-worker-mutate-${{ needs.determine-env.outputs.environment }}-${{ format('run-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    environment: ${{ needs.determine-env.outputs.environment }}
    # Every pre-SSH step has its own fence (40m worst case total). The three
    # bounded remote phases (5m prerequisites, 40m deploy including a possible
    # wait for an orphaned prior SSH process, 25m identity-locked health) can
    # then each use their ceiling without the enclosing job becoming the first
    # timeout; the remaining fifteen minutes cover action startup and teardown.
    timeout-minutes: 125
    env:
      SYSTEMD_UNIT: eliza-provisioning-worker.service
      BACKUP_SYSTEMD_UNIT: eliza-backup-catalog-worker.service
      DEPLOY_BRANCH: ${{ needs.determine-env.outputs.branch }}
      DEPLOY_SHA: ${{ needs.determine-env.outputs.deployment_sha }}
      # Headscale wiring for the provisioning worker (the CONSUMER of the
      # control plane). These are reconciled into /opt/eliza/cloud/.env.local
      # on every deploy so the box can never silently drift to a stale,
      # hand-edited headscale URL/key again. The daemon API URL is derived from
      # the protected environment below and stays loopback-only; it is not an
      # operator variable that can redirect the protected bearer key.
      # Canonical per-environment routing is repository-owned, not an optional
      # environment variable. Keeping the value here also lets a deploy repair
      # a missing/stale host entry when the GitHub variable inventory is empty.
      HEADSCALE_PUBLIC_URL: ${{ needs.determine-env.outputs.environment == 'production' && 'https://headscale.eliza.app' || 'https://headscale-staging.eliza.app' }}
      # The container entrypoint may spend up to 120s completing `tailscale up`.
      # Keep the control-plane observer above that bound with margin. This must
      # be repository-owned: an old hand-set short host value made the worker
      # abandon pending joins before the entrypoint could finish.
      VPN_REGISTRATION_TIMEOUT_MS: "180000"
      # Base64 private key used by the daemon to reach dedicated-agent nodes.
      # Keep this in the protected environment instead of relying on a
      # hand-copied file that can drift or disappear when the CP host is rebuilt.
      # Sandbox-registry Redis (TCP redis:// proxy, sandbox-reachable — never a
      # *.railway.internal host) so provisioned sandboxes self-register and
      # Discord/Telegram inbound routing works (#8621 / #8756). Reconciled into
      # /opt/eliza/cloud/.env.local the same way as HEADSCALE_*. This integration
      # remains optional and skip-empty preserves a hand-set value when absent.
      # Cloud database DSN for the provisioning worker + agent router. Same
      # fallback chain as the migrator jobs (cloud-cf-deploy.yml /
      # cloud deployment) so the CP daemon always resolves the exact
      # DB the Worker schema is migrated against. Before this, DATABASE_URL
      # only lived hand-edited on the box: when staging moved Neon → Railway
      # the CP silently kept polling the abandoned Neon DB for 3 weeks
      # (#15160). The deploy preflight now rejects an absent value before SSH;
      # the host can no longer silently preserve a stale hand-set database.
      # Field-encryption root secret used to unwrap per-org DEKs for encrypted
      # agent environment variables. Must match the Cloudflare Worker secret:
      # the Worker writes encrypted env vars, and this provisioning worker
      # decrypts them while creating the agent container (#15385). Cloudflare
      # never reveals an existing value, so an absent GitHub secret preserves the
      # host value; the remote preflight verifies only that the name is populated.
      # Operator pin for the canonical managed-agent image
      # (containersEnv.defaultAgentImageOverride; falls back to
      # ghcr.io/elizaos/eliza:stable when unset everywhere). This pin decides
      # which image every NEW provision and warm-pool replenish boots — it is
      # exactly the knob the #15228 crash-loop rollout needed. Before this it
      # lived ONLY hand-set on the CP box (the same drift class as
      # DATABASE_URL/#15160, tracked in the #15401 ledger): a CP re-arm lost
      # it silently. Set the GitHub environment VARIABLE (not secret — an
      # image ref is auditable config) to roll the fleet pin via deploy;
      # leave it unset to preserve whatever is hand-set on the box.
      ELIZA_AGENT_IMAGE: ${{ vars.ELIZA_AGENT_IMAGE }}
      # Warm-pool daemon half (#16961). The replenish phase self-gates on
      # WARM_POOL_ENABLED, so daemon and Worker must agree. The protected GitHub
      # environment VARIABLE (not secret — a boolean flag is auditable config)
      # is authoritative; an absent variable resolves to the safe disabled
      # state instead of preserving unknown hand-set host state. Activation
      # remains gated by #16961: flip this variable and the matching committed
      # Worker flag only with the required staging evidence.
      WARM_POOL_ENABLED: ${{ vars.WARM_POOL_ENABLED || 'false' }}
      # The edge Worker forwards the original per-agent host to this daemon.
      # Keep the daemon's parser on the same environment-specific suffix or a
      # staging host (`<uuid>.cloud-staging.eliza.app`) is rejected as malformed.
      ELIZA_CLOUD_AGENT_BASE_DOMAIN: ${{ needs.determine-env.outputs.environment == 'production' && 'cloud.eliza.app' || 'cloud-staging.eliza.app' }}
      # Public hostname the edge Worker uses to reach this agent-router. The
      # host's nginx config predates the eliza.app consolidation and must accept
      # both this canonical name and the legacy elizacloud.ai name during the
      # compatibility window.
      AGENT_ROUTER_PUBLIC_HOST: ${{ needs.determine-env.outputs.environment == 'production' && 'eliza-production-1.eliza.app' || 'eliza-staging-1.eliza.app' }}
      LEGACY_AGENT_ROUTER_PUBLIC_HOST: ${{ needs.determine-env.outputs.environment == 'production' && 'eliza-production-1.elizacloud.ai' || 'eliza-staging-1.elizacloud.ai' }}
      # Non-secret backup catalogue inputs serve the deletion-only authority;
      # capture and scheduling remain independently forced off below. Provider
      # credentials are sourced only into the dedicated root-owned allowlist.
      AGENT_BACKUP_CATALOG_WORKER_ID: ${{ vars.AGENT_BACKUP_CATALOG_WORKER_ID }}
      AGENT_BACKUP_R2_ENDPOINT_ALIAS: ${{ vars.AGENT_BACKUP_R2_ENDPOINT_ALIAS }}
      AGENT_BACKUP_R2_ACCOUNT_ID: ${{ vars.AGENT_BACKUP_R2_ACCOUNT_ID }}
      AGENT_BACKUP_R2_ENDPOINT: ${{ vars.AGENT_BACKUP_R2_ENDPOINT }}
      AGENT_BACKUP_R2_BUCKET: ${{ vars.AGENT_BACKUP_R2_BUCKET }}
      AGENT_BACKUP_R2_REGION: ${{ vars.AGENT_BACKUP_R2_REGION }}
      AGENT_BACKUP_HETZNER_ENDPOINT_ALIAS: ${{ vars.AGENT_BACKUP_HETZNER_ENDPOINT_ALIAS }}
      AGENT_BACKUP_HETZNER_ACCOUNT_ID: ${{ vars.AGENT_BACKUP_HETZNER_ACCOUNT_ID }}
      AGENT_BACKUP_HETZNER_ENDPOINT: ${{ vars.AGENT_BACKUP_HETZNER_ENDPOINT }}
      AGENT_BACKUP_HETZNER_BUCKET: ${{ vars.AGENT_BACKUP_HETZNER_BUCKET }}
      AGENT_BACKUP_HETZNER_REGION: ${{ vars.AGENT_BACKUP_HETZNER_REGION }}
      AGENT_BACKUP_STEWARD_KMS_BASE_URL: ${{ vars.AGENT_BACKUP_STEWARD_KMS_BASE_URL }}
      AGENT_BACKUP_AGENT_SCHEMA_VERSION: ${{ vars.AGENT_BACKUP_AGENT_SCHEMA_VERSION }}
      AGENT_BACKUP_DATABASE_SCHEMA_VERSION: ${{ vars.AGENT_BACKUP_DATABASE_SCHEMA_VERSION }}
      AGENT_BACKUP_RUNTIME_PLUGINS_JSON: ${{ vars.AGENT_BACKUP_RUNTIME_PLUGINS_JSON }}
      AGENT_BACKUP_LEGACY_WRITER_DRAIN_DEPLOYMENT_ID: ${{ vars.AGENT_BACKUP_LEGACY_WRITER_DRAIN_DEPLOYMENT_ID }}
      AGENT_BACKUP_LEGACY_WRITER_DRAINED_AT: ${{ vars.AGENT_BACKUP_LEGACY_WRITER_DRAINED_AT }}
      AGENT_BACKUP_STORAGE_SCOPE: ${{ vars.AGENT_BACKUP_STORAGE_SCOPE }}
      AGENT_BACKUP_SPOOL_MAX_BYTES: ${{ vars.AGENT_BACKUP_SPOOL_MAX_BYTES }}
      AGENT_BACKUP_SPOOL_MIN_FREE_BYTES: ${{ vars.AGENT_BACKUP_SPOOL_MIN_FREE_BYTES }}
      AGENT_BACKUP_SPOOL_CLEANUP_BATCH_SIZE: ${{ vars.AGENT_BACKUP_SPOOL_CLEANUP_BATCH_SIZE }}
      AGENT_BACKUP_CAPTURE_DEADLINE_MS: ${{ vars.AGENT_BACKUP_CAPTURE_DEADLINE_MS }}
      AGENT_BACKUP_OBJECT_TRANSFER_DEADLINE_MS: ${{ vars.AGENT_BACKUP_OBJECT_TRANSFER_DEADLINE_MS }}
      AGENT_BACKUP_SCHEDULE_BATCH_SIZE: ${{ vars.AGENT_BACKUP_SCHEDULE_BATCH_SIZE }}
      AGENT_BACKUP_SCHEDULE_LEASE_MS: ${{ vars.AGENT_BACKUP_SCHEDULE_LEASE_MS }}
      AGENT_BACKUP_SCHEDULE_RETRY_MS: ${{ vars.AGENT_BACKUP_SCHEDULE_RETRY_MS }}
      AGENT_BACKUP_OPERATION_BATCH_SIZE: ${{ vars.AGENT_BACKUP_OPERATION_BATCH_SIZE }}
      AGENT_BACKUP_OPERATION_LEASE_MS: ${{ vars.AGENT_BACKUP_OPERATION_LEASE_MS }}
      AGENT_BACKUP_OPERATION_RETRY_BASE_MS: ${{ vars.AGENT_BACKUP_OPERATION_RETRY_BASE_MS }}
      AGENT_BACKUP_OPERATION_RETRY_MAX_MS: ${{ vars.AGENT_BACKUP_OPERATION_RETRY_MAX_MS }}
      AGENT_BACKUP_GC_BATCH_SIZE: ${{ vars.AGENT_BACKUP_GC_BATCH_SIZE }}
      AGENT_BACKUP_GC_LEASE_MS: ${{ vars.AGENT_BACKUP_GC_LEASE_MS }}
      AGENT_BACKUP_GC_RETRY_BASE_MS: ${{ vars.AGENT_BACKUP_GC_RETRY_BASE_MS }}
      AGENT_BACKUP_GC_RETRY_MAX_MS: ${{ vars.AGENT_BACKUP_GC_RETRY_MAX_MS }}
      AGENT_BACKUP_DELETION_BATCH_SIZE: ${{ vars.AGENT_BACKUP_DELETION_BATCH_SIZE }}
      AGENT_BACKUP_CATALOG_WORKER_INTERVAL_MS: ${{ vars.AGENT_BACKUP_CATALOG_WORKER_INTERVAL_MS }}
      AGENT_BACKUP_CATALOG_WORKER_RETRY_MS: ${{ vars.AGENT_BACKUP_CATALOG_WORKER_RETRY_MS }}
      AGENT_BACKUP_CATALOG_WORKER_SHUTDOWN_TIMEOUT_MS: ${{ vars.AGENT_BACKUP_CATALOG_WORKER_SHUTDOWN_TIMEOUT_MS }}
      DATABASE_SSL_NO_VERIFY: ${{ vars.DATABASE_SSL_NO_VERIFY }}
    steps:
      - name: Validate canonical deploy configuration and shared secrets
        id: deploy_config
        timeout-minutes: 2
        env:
          TARGET_ENVIRONMENT: ${{ needs.determine-env.outputs.environment }}
          DEPLOY_HOST: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.RAILWAY_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          STEWARD_API_URL: ${{ secrets.STEWARD_API_URL }}
          STEWARD_PLATFORM_KEYS: ${{ secrets.STEWARD_PLATFORM_KEYS }}
          AGENT_TOKEN_PRIVATE_KEY_PEM: ${{ secrets.AGENT_TOKEN_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail

          # Only settings GitHub authoritatively reconciles are required here.
          # Host-preserved secrets are checked by name after SSH, without values.
          required_deploy_settings=(
            DEPLOY_HOST
            DEPLOY_SSH_KEY
            HEADSCALE_PUBLIC_URL
            DATABASE_URL
            STEWARD_API_URL
            STEWARD_PLATFORM_KEYS
            AGENT_TOKEN_PRIVATE_KEY_PEM
          )
          missing=()
          for name in "${required_deploy_settings[@]}"; do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing required provisioning settings for GitHub environment $TARGET_ENVIRONMENT: ${missing[*]}"
            {
              echo "### Provisioning worker deploy blocked"
              echo ""
              echo "GitHub environment \`$TARGET_ENVIRONMENT\` is missing required setting name(s): \`${missing[*]}\`."
              echo "No protected values were printed. Configure the environment before retrying."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          require_exact() {
            local name="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "::error::$name does not match the canonical $TARGET_ENVIRONMENT environment contract"
              exit 1
            fi
          }

          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            require_exact DEPLOY_BRANCH "$DEPLOY_BRANCH" "main"
            require_exact HEADSCALE_PUBLIC_URL "$HEADSCALE_PUBLIC_URL" "https://headscale.eliza.app"
            require_exact ELIZA_CLOUD_AGENT_BASE_DOMAIN "$ELIZA_CLOUD_AGENT_BASE_DOMAIN" "cloud.eliza.app"
            resolved_headscale_api_url="http://127.0.0.1:8081"
          else
            require_exact DEPLOY_BRANCH "$DEPLOY_BRANCH" "develop"
            require_exact HEADSCALE_PUBLIC_URL "$HEADSCALE_PUBLIC_URL" "https://headscale-staging.eliza.app"
            require_exact ELIZA_CLOUD_AGENT_BASE_DOMAIN "$ELIZA_CLOUD_AGENT_BASE_DOMAIN" "cloud-staging.eliza.app"
            resolved_headscale_api_url="http://127.0.0.1:8080"
          fi

          encoded_agent_signing_key="$(printf '%s' "$AGENT_TOKEN_PRIVATE_KEY_PEM" | base64 | tr -d '\n')"
          [ -n "$encoded_agent_signing_key" ] || {
            echo "::error::Agent signing key transport encoding is empty"
            exit 1
          }
          echo "::add-mask::$encoded_agent_signing_key"
          printf 'AGENT_TOKEN_PRIVATE_KEY_PEM_BASE64=%s\n' \
            "$encoded_agent_signing_key" >> "$GITHUB_ENV"
          echo "HEADSCALE_API_URL=$resolved_headscale_api_url" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # This deploy workflow runs independently of Cloud CF. Bind every worker
      # activation to the canonical migration runner from the exact immutable
      # deployment snapshot before the first SSH mutation. A failed install,
      # missing protected DSN, invalid ledger, or failed migration stops here
      # while the currently running host checkout and daemons remain untouched.
      - name: Checkout exact deployment source for migration gate
        if: steps.deploy_config.outputs.configured == 'true'
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.determine-env.outputs.deployment_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact migration source
        if: steps.deploy_config.outputs.configured == 'true'
        timeout-minutes: 1
        env:
          EXPECTED_DEPLOY_SHA: ${{ needs.determine-env.outputs.deployment_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [ "$actual_sha" = "$EXPECTED_DEPLOY_SHA" ] || {
            echo "::error::Migration checkout resolved $actual_sha, expected $EXPECTED_DEPLOY_SHA"
            exit 1
          }
          # Self-hosted runners can retain files created after checkout's own
          # cleanup hook. Re-establish the exact immutable superproject tree
          # immediately before migrations; suppress removed paths so runner-
          # local names do not enter deployment logs. This daemon path never
          # initializes or consumes the native submodules, so retained dirt
          # inside those worktrees is outside this deployment boundary.
          git reset --hard --quiet "$EXPECTED_DEPLOY_SHA"
          git clean -ffdx -q
          [ -z "$(git status --porcelain --ignore-submodules=all)" ] || {
            echo "::error::Migration checkout is not clean"
            exit 1
          }
          helper_sha256=$(sha256sum \
            packages/cloud/scripts/admin/systemd-environment-line.mjs | awk '{print $1}')
          backup_unit_sha256=$(sha256sum \
            packages/cloud/scripts/admin/eliza-backup-catalog-worker.service | awk '{print $1}')
          [[ "$helper_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Could not hash the exact-SHA EnvironmentFile helper"
            exit 1
          }
          [[ "$backup_unit_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Could not hash the exact-SHA backup systemd unit"
            exit 1
          }
          {
            echo "SYSTEMD_ENVIRONMENT_HELPER_SHA256=$helper_sha256"
            echo "BACKUP_SYSTEMD_UNIT_SHA256=$backup_unit_sha256"
          } >> "$GITHUB_ENV"

      - name: Setup Node for migration gate
        if: steps.deploy_config.outputs.configured == 'true'
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Setup Bun for migration gate
        if: steps.deploy_config.outputs.configured == 'true'
        timeout-minutes: 5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install exact migration dependencies
        if: steps.deploy_config.outputs.configured == 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 3 ]; then
              bun install --frozen-lockfile --no-save --ignore-scripts --verbose && exit 0
            else
              bun install --frozen-lockfile --no-save --ignore-scripts && exit 0
            fi
            echo "bun install attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Fence current develop SHA before database mutation
        if: ${{ steps.deploy_config.outputs.configured == 'true' && inputs.effect_digest != '' }}
        timeout-minutes: 1
        env:
          EXPECTED_DEPLOY_SHA: ${{ needs.determine-env.outputs.deployment_sha }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin refs/heads/develop | awk 'NR == 1 { print $1 }')"
          [ "$current_sha" = "$EXPECTED_DEPLOY_SHA" ] || {
            echo "::error::Develop advanced before provisioning-worker migration"
            exit 1
          }

      - name: Run exact-SHA canonical database migrations
        if: steps.deploy_config.outputs.configured == 'true'
        timeout-minutes: 10
        env:
          # Resolve only from the already-selected protected environment. The
          # value is passed directly to the migrator and is never printed.
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.RAILWAY_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          DATABASE_IDENTITY_GATE_MODE: ${{ vars.DATABASE_IDENTITY_GATE_MODE || 'off' }}
          DATABASE_IDENTITY_ENVIRONMENT: ${{ needs.determine-env.outputs.environment }}
          DATABASE_IDENTITY_EXPECTED_CLUSTER_SHA256: ${{ vars.DATABASE_IDENTITY_EXPECTED_CLUSTER_SHA256 }}
          DATABASE_IDENTITY_EXPECTED_AUTHORITY_SHA256: ${{ vars.DATABASE_IDENTITY_EXPECTED_AUTHORITY_SHA256 }}
        run: |
          set -euo pipefail
          [ -n "${DATABASE_URL//[[:space:]]/}" ] || {
            echo "::error::Protected DATABASE_URL is required before provisioning-worker deploy"
            exit 1
          }
          node packages/shared/scripts/generate-keywords.mjs
          bun run db:cloud:migrate

      - name: Recheck current develop SHA before host deployment
        if: ${{ steps.deploy_config.outputs.configured == 'true' && inputs.effect_digest != '' }}
        timeout-minutes: 1
        env:
          EXPECTED_DEPLOY_SHA: ${{ needs.determine-env.outputs.deployment_sha }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin refs/heads/develop | awk 'NR == 1 { print $1 }')"
          [ "$current_sha" = "$EXPECTED_DEPLOY_SHA" ] || {
            echo "::error::Develop advanced before provisioning-worker host deploy"
            exit 1
          }

      - name: Ensure host prereqs (Node 24, swap, bunx symlink)
        if: steps.deploy_config.outputs.configured == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            # Idempotent safety net for hosts provisioned BEFORE the cloud-init
            # template that pre-installs these. Each block is a no-op if already
            # set up — runs on every deploy so any host drift self-heals.

            # Node 24: the systemd unit calls `tsx` which spawns a Node process.
            # New cloud-init template installs it via NodeSource; older hosts
            # (eliza-staging-1 from the first TF apply) lack it.
            if ! command -v node >/dev/null 2>&1; then
              echo "[host-prereqs] installing Node 24"
              curl -fsSL https://deb.nodesource.com/setup_24.x | sudo bash -
              sudo apt-get install -y nodejs
            fi

            # Swap: smaller shapes (cpx22, cax11) OOM during `turbo run build`.
            # 8 GB swap once and forever; harmless on bigger shapes.
            if [ ! -f /swapfile ]; then
              echo "[host-prereqs] adding 8GB swap"
              sudo fallocate -l 8G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
            fi

            # bunx symlink: the canary `bun.sh/install` tarball stopped shipping
            # bunx as a separate binary at some point; build scripts that call
            # `bunx tsc` etc. then fail with `bun: command not found: bunx`.
            # `bunx` is just `bun` reading argv[0] — a symlink is sufficient.
            if [ ! -e /home/deploy/.bun/bin/bunx ] && [ -e /home/deploy/.bun/bin/bun ]; then
              echo "[host-prereqs] creating bunx symlink"
              ln -sf bun /home/deploy/.bun/bin/bunx
            fi

      - name: Deploy and restart worker
        if: steps.deploy_config.outputs.configured == 'true'
        env:
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
          CONTAINERS_SSH_KEY: ${{ secrets.CONTAINERS_SSH_KEY }}
          SANDBOX_REGISTRY_REDIS_URL: ${{ secrets.SANDBOX_REGISTRY_REDIS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.RAILWAY_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          STEWARD_API_URL: ${{ secrets.STEWARD_API_URL }}
          STEWARD_PLATFORM_KEYS: ${{ secrets.STEWARD_PLATFORM_KEYS }}
          AGENT_TOKEN_PRIVATE_KEY_PEM_BASE64: ${{ env.AGENT_TOKEN_PRIVATE_KEY_PEM_BASE64 }}
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
          AGENT_BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.AGENT_BACKUP_R2_ACCESS_KEY_ID }}
          AGENT_BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.AGENT_BACKUP_R2_SECRET_ACCESS_KEY }}
          AGENT_BACKUP_HETZNER_ACCESS_KEY_ID: ${{ secrets.AGENT_BACKUP_HETZNER_ACCESS_KEY_ID }}
          AGENT_BACKUP_HETZNER_SECRET_ACCESS_KEY: ${{ secrets.AGENT_BACKUP_HETZNER_SECRET_ACCESS_KEY }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          # Preserve setup/build headroom plus one prior deploy's bounded lock
          # wait without weakening the preflight's own eight-minute fail-closed
          # fence near the end of this remote script.
          command_timeout: 40m
          envs: DEPLOY_BRANCH,DEPLOY_SHA,SYSTEMD_UNIT,BACKUP_SYSTEMD_UNIT,SYSTEMD_ENVIRONMENT_HELPER_SHA256,BACKUP_SYSTEMD_UNIT_SHA256,HEADSCALE_API_URL,HEADSCALE_PUBLIC_URL,HEADSCALE_API_KEY,VPN_REGISTRATION_TIMEOUT_MS,CONTAINERS_SSH_KEY,SANDBOX_REGISTRY_REDIS_URL,DATABASE_URL,STEWARD_API_URL,STEWARD_PLATFORM_KEYS,AGENT_TOKEN_PRIVATE_KEY_PEM_BASE64,DATABASE_SSL_NO_VERIFY,SECRETS_MASTER_KEY,ELIZA_AGENT_IMAGE,WARM_POOL_ENABLED,ELIZA_CLOUD_AGENT_BASE_DOMAIN,AGENT_ROUTER_PUBLIC_HOST,LEGACY_AGENT_ROUTER_PUBLIC_HOST,AGENT_BACKUP_CATALOG_WORKER_ID,AGENT_BACKUP_R2_ENDPOINT_ALIAS,AGENT_BACKUP_R2_ACCOUNT_ID,AGENT_BACKUP_R2_ENDPOINT,AGENT_BACKUP_R2_BUCKET,AGENT_BACKUP_R2_REGION,AGENT_BACKUP_R2_ACCESS_KEY_ID,AGENT_BACKUP_R2_SECRET_ACCESS_KEY,AGENT_BACKUP_HETZNER_ENDPOINT_ALIAS,AGENT_BACKUP_HETZNER_ACCOUNT_ID,AGENT_BACKUP_HETZNER_ENDPOINT,AGENT_BACKUP_HETZNER_BUCKET,AGENT_BACKUP_HETZNER_REGION,AGENT_BACKUP_HETZNER_ACCESS_KEY_ID,AGENT_BACKUP_HETZNER_SECRET_ACCESS_KEY,AGENT_BACKUP_STEWARD_KMS_BASE_URL,AGENT_BACKUP_AGENT_SCHEMA_VERSION,AGENT_BACKUP_RUNTIME_PLUGINS_JSON,AGENT_BACKUP_LEGACY_WRITER_DRAIN_DEPLOYMENT_ID,AGENT_BACKUP_LEGACY_WRITER_DRAINED_AT,AGENT_BACKUP_STORAGE_SCOPE,AGENT_BACKUP_SPOOL_MAX_BYTES,AGENT_BACKUP_SPOOL_MIN_FREE_BYTES,AGENT_BACKUP_SPOOL_CLEANUP_BATCH_SIZE,AGENT_BACKUP_CAPTURE_DEADLINE_MS,AGENT_BACKUP_OBJECT_TRANSFER_DEADLINE_MS,AGENT_BACKUP_SCHEDULE_BATCH_SIZE,AGENT_BACKUP_SCHEDULE_LEASE_MS,AGENT_BACKUP_SCHEDULE_RETRY_MS,AGENT_BACKUP_OPERATION_BATCH_SIZE,AGENT_BACKUP_OPERATION_LEASE_MS,AGENT_BACKUP_OPERATION_RETRY_BASE_MS,AGENT_BACKUP_OPERATION_RETRY_MAX_MS,AGENT_BACKUP_GC_BATCH_SIZE,AGENT_BACKUP_GC_LEASE_MS,AGENT_BACKUP_GC_RETRY_BASE_MS,AGENT_BACKUP_GC_RETRY_MAX_MS,AGENT_BACKUP_DELETION_BATCH_SIZE,AGENT_BACKUP_CATALOG_WORKER_INTERVAL_MS,AGENT_BACKUP_CATALOG_WORKER_RETRY_MS,AGENT_BACKUP_CATALOG_WORKER_SHUTDOWN_TIMEOUT_MS
          script: |
            set -euo pipefail

            # GitHub job concurrency serializes normal runs, but canceling an
            # appleboy SSH step can leave its remote shell alive after the
            # runner releases that concurrency slot. Serialize on the target
            # host as well so an orphaned build cannot race the next git clean
            # or checkout in the shared /opt/eliza tree.
            exec 9>/tmp/eliza-provisioning-worker-deploy.lock
            flock -w 1200 9 || {
              echo "Timed out waiting for the previous provisioning deploy"
              exit 1
            }

            echo "=== Deploying eliza-provisioning-worker (branch: $DEPLOY_BRANCH sha: $DEPLOY_SHA) ==="

            cd /opt/eliza
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=safe.directory
            export GIT_CONFIG_VALUE_0=/opt/eliza

            rm -f .git/index.lock

            # A prior operator or deploy may have run git/install/build as
            # root, leaving either Git metadata or tracked source files owned
            # by root. Git then cannot reset or check out the immutable target
            # as `deploy`. The checkout is exclusively managed by this service,
            # so normalize the whole tree before any mutating Git command.
            sudo chown -R deploy:deploy /opt/eliza

            # Discard local drift, preserve env files. Quote globs so the
            # remote shell doesn't expand them before git sees the pattern,
            # and fail loud if clean errors out — silently swallowing it is
            # what let stale build artifacts survive and block checkout below.
            git reset --hard HEAD
            git clean -fdx \
              -e .env \
              -e .env.local \
              -e '.env.*' \
              -e cloud/.env.local \
              -e 'cloud/.env.*' \
              -e node_modules

            # Build artifacts (*.d.ts / *.d.ts.map) sometimes land next to
            # sources from a prior deploy; if the new HEAD tracks the same
            # paths, `git checkout -B` aborts with "untracked working tree
            # files would be overwritten". Sweep them before checkout.
            find packages -type f \( -name '*.d.ts' -o -name '*.d.ts.map' \) \
              ! -path '*/node_modules/*' -delete

            # bun.lock became tracked at 4ae092dcda; the host's previous deploy
            # may have left an untracked copy from `bun install` that pre-dates
            # the tracking change. `git clean -fdx` *should* remove it but
            # occasionally races with bun's lockfile rewrite, so force a delete
            # before the fetch + branch-checkout below.
            rm -f bun.lock

            # Use a refspec so a single-branch / shallow clone still creates
            # the remote-tracking ref for $DEPLOY_BRANCH on first deploy.
            #
            # --no-recurse-submodules on both fetch + checkout: the provisioning
            # worker daemon and agent router are pure Node/tsx code and never
            # touch the llama.cpp / opencode submodules. If the
            # deploy host has `fetch.recurseSubmodules=on-demand` (the default
            # when submodules are present), recursing through a superproject
            # commit whose submodule SHA was never pushed to the fork kills the
            # whole deploy with `upload-pack: not our ref`. Skip submodule
            # traversal entirely on this path.
            git -c fetch.recurseSubmodules=no fetch --no-recurse-submodules origin "$DEPLOY_SHA"
            git -c submodule.recurse=false checkout --no-recurse-submodules \
              -B "$DEPLOY_BRANCH" "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

            # The `rm -f bun.lock` above deletes a TRACKED file; when bun.lock
            # is identical between the previous HEAD and the new tip, checkout
            # carries that deletion over as a local change and `bun install`
            # then resolves the whole tree fresh from package.json ranges —
            # newest-in-range @ai-sdk/* against the overridden provider-utils
            # pin took the worker down at boot (`does not provide an export
            # named 'secureJsonParse'`). Always restore the tracked lockfile so
            # installs are lockfile-pinned and deterministic.
            git checkout "$DEPLOY_SHA" -- bun.lock

            # Root must never execute a helper from the deploy-writable checkout.
            # The runner hashed both privileged artifacts from the already
            # verified immutable checkout. Copy through a root-only candidate,
            # verify that candidate, atomically rename it inside the same
            # root-owned directory, then verify the installed destination again.
            # TEST-ANCHOR: root-artifact-installer-begin
            install_root_verified_file() {
              local source_path="$1"
              local destination_path="$2"
              local expected_sha256="$3"
              local install_mode="$4"
              local destination_directory="${destination_path%/*}"
              local destination_name="${destination_path##*/}"
              local expected_stat_mode="${install_mode#0}"
              local candidate_path="${destination_directory}/.${destination_name}.candidate.${DEPLOY_SHA}.$$"
              local digest_output=""
              local actual_sha256=""
              local actual_stat=""

              if [[ ! "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::Refusing a root artifact without an exact-SHA digest"
                return 1
              fi
              case "$install_mode" in
                0555|0644) ;;
                *)
                  echo "::error::Refusing an unsupported root artifact mode"
                  return 1
                  ;;
              esac

              if ! digest_output=$(/usr/bin/sha256sum -- "$source_path"); then
                echo "::error::Could not hash a root artifact source"
                return 1
              fi
              actual_sha256="${digest_output%% *}"
              if [ "$actual_sha256" != "$expected_sha256" ]; then
                echo "::error::Root artifact source differs from the exact checkout"
                return 1
              fi

              if ! sudo /usr/bin/install -d -o root -g root -m 0755 \
                "$destination_directory"; then
                echo "::error::Could not prepare the root artifact directory"
                return 1
              fi
              actual_stat=$(sudo /usr/bin/stat -c '%U:%G:%a' \
                "$destination_directory") || return 1
              if [ "$actual_stat" != "root:root:755" ]; then
                echo "::error::Root artifact directory ownership or mode is invalid"
                return 1
              fi

              if ! sudo /usr/bin/install -o root -g root -m "$install_mode" -- \
                "$source_path" "$candidate_path"; then
                echo "::error::Could not stage a root artifact candidate"
                return 1
              fi
              if ! digest_output=$(sudo /usr/bin/sha256sum -- "$candidate_path"); then
                sudo /usr/bin/rm -f -- "$candidate_path" || true
                echo "::error::Could not hash a root artifact candidate"
                return 1
              fi
              actual_sha256="${digest_output%% *}"
              actual_stat=$(sudo /usr/bin/stat -c '%U:%G:%a' \
                "$candidate_path") || {
                sudo /usr/bin/rm -f -- "$candidate_path" || true
                return 1
              }
              if [ "$actual_sha256" != "$expected_sha256" ] \
                || [ "$actual_stat" != "root:root:$expected_stat_mode" ]; then
                sudo /usr/bin/rm -f -- "$candidate_path" || true
                echo "::error::Root artifact candidate failed integrity checks"
                return 1
              fi

              if ! sudo /usr/bin/mv -fT -- "$candidate_path" "$destination_path"; then
                sudo /usr/bin/rm -f -- "$candidate_path" || true
                echo "::error::Could not atomically install a root artifact"
                return 1
              fi
              digest_output=$(sudo /usr/bin/sha256sum -- "$destination_path") \
                || return 1
              actual_sha256="${digest_output%% *}"
              actual_stat=$(sudo /usr/bin/stat -c '%U:%G:%a' \
                "$destination_path") || return 1
              if [ "$actual_sha256" != "$expected_sha256" ] \
                || [ "$actual_stat" != "root:root:$expected_stat_mode" ]; then
                echo "::error::Installed root artifact failed integrity checks"
                return 1
              fi
            }
            # TEST-ANCHOR: root-artifact-installer-end

            NODE_BIN=/usr/bin/node
            if [ ! -x "$NODE_BIN" ] || [[ "$("$NODE_BIN" --version)" != v24.* ]]; then
              echo "::error::The canonical root-owned Node 24 binary is unavailable"
              exit 1
            fi
            ENV_SERIALIZER_SOURCE=/opt/eliza/packages/cloud/scripts/admin/systemd-environment-line.mjs
            ENV_SERIALIZER=/usr/local/lib/eliza-admin/systemd-environment-line.mjs
            install_root_verified_file \
              "$ENV_SERIALIZER_SOURCE" \
              "$ENV_SERIALIZER" \
              "$SYSTEMD_ENVIRONMENT_HELPER_SHA256" \
              0555

            # git clean removes these intentionally ignored modules. Generate
            # and assert them before install/build, while the healthy daemons
            # are still running, so generator failure cannot cause downtime.
            bash packages/cloud/scripts/admin/ensure-generated-keywords.sh

            # Install the canary (Rust) Bun on first install.
            if ! command -v bun >/dev/null 2>&1 || [ "$(bun --version)" != "1.3.14" ]; then
              curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
              export BUN_INSTALL="$HOME/.bun"
              export PATH="$BUN_INSTALL/bin:$PATH"
            fi

            cd /opt/eliza
            for attempt in 1 2 3; do
              if bun install --frozen-lockfile --no-save --ignore-scripts; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              echo "bun install attempt $attempt failed; retrying in 10s..."
              sleep 10
            done

            # The daemons run under Node/tsx rather than Bun. Node resolves
            # linked workspace packages through their built `node` exports, so
            # refresh linked package dist files after installing dependencies.
            #
            # The `git clean -fdx` above wipes `.turbo`, so every deploy does a
            # cold `build:core` (0 cached). Building the full graph includes
            # `@elizaos/plugin-local-inference`, whose tsc/bundler step exceeds
            # V8's default ~2 GB old-space and aborts the deploy with
            # `FATAL ERROR: ... JavaScript heap out of memory` (exit 134). Raise
            # the heap ceiling to match the repo's typecheck lane (8 GB).
            export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=8192"

            # The systemd daemons execute through Node/tsx as well as Bun.
            # `packages/core/src/prompts.ts` re-exports `@elizaos/prompts`, and
            # default-condition resolution therefore requires the prompts
            # package's dist entrypoint. The host deliberately preserves
            # node_modules between deploys, so an old real directory can also
            # mask the workspace link that `bun install` would normally create.
            # Reconcile this one declared workspace dependency explicitly;
            # `build:core` does not include the prompts package because its full
            # build has a deliberate reverse action-doc dependency on core.
            mkdir -p packages/core/node_modules/@elizaos
            rm -rf packages/core/node_modules/@elizaos/prompts
            ln -s ../../../prompts packages/core/node_modules/@elizaos/prompts
            test "$(realpath packages/core/node_modules/@elizaos/prompts)" = \
              /opt/eliza/packages/prompts
            bun run --cwd packages/prompts build:package
            test -f packages/core/node_modules/@elizaos/prompts/dist/index.js
            bun run build:core
            mkdir -p plugins/plugin-sql/node_modules/@elizaos
            rm -rf plugins/plugin-sql/node_modules/@elizaos/core
            ln -s ../../../../packages/core plugins/plugin-sql/node_modules/@elizaos/core
            bun run --cwd plugins/plugin-sql build

            # Defensive workspace symlinks: `bun install` should create these
            # automatically for any workspace package the root or a sibling
            # depends on, but the daemon (in packages/scripts/, which has NO
            # package.json and so is invisible to bun's workspace graph)
            # imports `@elizaos/cloud-shared` at runtime. On a fresh host the
            # symlink was missing — daemon then crashes with
            # `Cannot find package '@elizaos/cloud-shared'`. Recreate it here
            # idempotently after `bun install` is done.
            mkdir -p node_modules/@elizaos
            ln -sfn ../../packages/cloud/shared node_modules/@elizaos/cloud-shared

            # Reconcile control-plane secrets (HEADSCALE_API_URL /
            # HEADSCALE_PUBLIC_URL / HEADSCALE_API_KEY /
            # SANDBOX_REGISTRY_REDIS_URL / DATABASE_URL / SECRETS_MASTER_KEY)
            # into the systemd EnvironmentFile when the protected GitHub
            # environment supplies them. Older unrecoverable host values remain
            # intact when GitHub is blank. The daemon +
            # cloud-shared read these straight from process.env
            # (headscale-client.ts, headscale-integration.ts,
            # docker-sandbox-provider.ts, the DB client, and encrypted
            # environment-variable decrypt), fed by
            # EnvironmentFile=/opt/eliza/cloud/.env.local. The
            # deploy's `git clean -e cloud/.env.local` preserves that file
            # verbatim, so before this these keys were only ever hand-edited on
            # the box and could drift to a stale headscale (the CP-box outage)
            # or a stale database (#15160: the CP polled an abandoned Neon DB
            # for 3 weeks after staging moved to Railway). Only rewrite a key
            # when the CI value is non-empty — an unset GH var/secret must
            # never blank a working box (a blank HEADSCALE_API_KEY makes
            # docker-sandbox-provider throw "HEADSCALE_API_KEY is not
            # configured" when a route is required).
            ENV_FILE=/opt/eliza/cloud/.env.local
            BACKUP_ENV_FILE=/etc/eliza/backup-catalog-worker.env
            BUN_BIN=$(command -v bun)
            SAFE_CHILD_PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin
            # TEST-ANCHOR: atomic-environment-reconcile-begin
            RECONCILE_PLAN_DIR=$(mktemp -d)
            chmod 700 "$RECONCILE_PLAN_DIR"
            ENV_REPLACEMENTS="$RECONCILE_PLAN_DIR/host-replacements"
            ENV_ASSIGNMENTS="$RECONCILE_PLAN_DIR/host-assignments"
            BACKUP_REPLACEMENTS="$RECONCILE_PLAN_DIR/backup-replacements"
            BACKUP_ASSIGNMENTS="$RECONCILE_PLAN_DIR/backup-assignments"
            : > "$ENV_REPLACEMENTS"
            : > "$ENV_ASSIGNMENTS"
            : > "$BACKUP_REPLACEMENTS"
            : > "$BACKUP_ASSIGNMENTS"
            chmod 600 \
              "$ENV_REPLACEMENTS" \
              "$ENV_ASSIGNMENTS" \
              "$BACKUP_REPLACEMENTS" \
              "$BACKUP_ASSIGNMENTS"
            trap 'rm -rf -- "$RECONCILE_PLAN_DIR"' EXIT

            run_environment_helper() {
              /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
                "$NODE_BIN" "$ENV_SERIALIZER" "$@"
            }

            append_environment_setting() {
              local names_file="$1"
              local assignments_file="$2"
              local key="$3"
              local value="$4"
              printf '%s\n' "$key" >> "$names_file"
              # The value crosses the external-process boundary only on stdin.
              # argv and rejection diagnostics contain the non-secret key only.
              printf '%s' "$value" \
                | run_environment_helper serialize "$key" \
                >> "$assignments_file"
            }

            decode_agent_signing_key() {
              local decoded
              decoded="$(printf '%s' "$AGENT_TOKEN_PRIVATE_KEY_PEM_BASE64" | base64 --decode)" || {
                echo "::error::Agent signing key transport is not valid base64"
                exit 1
              }
              case "$decoded" in
                *"-----BEGIN PRIVATE KEY-----"*"-----END PRIVATE KEY-----"*) ;;
                *)
                  echo "::error::Agent signing key transport is not a PKCS8 PEM"
                  exit 1
                  ;;
              esac
              # EnvironmentFile values are deliberately single-line. The
              # token signer canonicalizes literal backslash-n sequences back
              # to PEM newlines before importing the key.
              AGENT_TOKEN_PRIVATE_KEY_PEM="${decoded//$'\n'/\\n}"
            }

            remove_environment_setting() {
              printf '%s\n' "$2" >> "$1"
            }

            require_environment_settings() {
              local file="$1"
              shift
              sudo /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
                "$NODE_BIN" "$ENV_SERIALIZER" nonempty "$file" "$@"
            }

            require_environment_setting_equals() {
              local file="$1"
              local key="$2"
              local expected="$3"
              printf '%s' "$expected" \
                | sudo /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
                    "$NODE_BIN" "$ENV_SERIALIZER" equals "$file" "$key"
            }

            # Pin this control-plane daemon to the AGENT lane. Unset, a single
            # daemon claims ALL job types (agent + apps); it would claim
            # APP_DEPLOY / CONTAINER_* jobs it can't run (no apps backend wired
            # here) and burn them down through retries. The dedicated apps
            # daemon (apps-provisioning-worker.ts) owns the apps lane. Reconciled
            # here so CI is the single source of truth and the box self-heals on
            # every deploy (same mechanism as the HEADSCALE_* keys below). This
            # value is constant — not a GH var — so it's reconciled directly,
            # never blanked.
            append_environment_setting \
              "$ENV_REPLACEMENTS" "$ENV_ASSIGNMENTS" \
              PROVISIONING_JOB_LANES agent
            # Headscale is the required dedicated-agent ingress. Bridge-host
            # fallback was a legacy escape hatch; if it remains hand-set on the
            # box, docker-sandbox-provider deliberately disables VPN injection
            # and fresh staging agents never receive a headscale_ip (#15347).
            remove_environment_setting \
              "$ENV_REPLACEMENTS" AGENT_ROUTER_ALLOW_BRIDGE_HOST_FALLBACK
            # Capture and scheduling remain dormant. Account deletion receives
            # an independent always-on backup/spool authority in the dedicated
            # allowlisted systemd environment assembled below.
            ACCOUNT_DELETION_BACKUP_AUTHORITY_GATE=1
            BACKUP_CATALOG_RUNTIME_GATE=0
            BACKUP_RPO_SCHEDULER_GATE=0
            BACKUP_SPOOL_STATE_DIRECTORY=/var/lib/eliza-backup-catalog/spool
            BACKUP_WORKER_HEALTH_FILE=/run/eliza-backup-catalog/health.json
            BACKUP_WORKER_INTERVAL_MS="${AGENT_BACKUP_CATALOG_WORKER_INTERVAL_MS:-60000}"
            BACKUP_WORKER_RETRY_MS="${AGENT_BACKUP_CATALOG_WORKER_RETRY_MS:-5000}"
            BACKUP_WORKER_SHUTDOWN_TIMEOUT_MS="${AGENT_BACKUP_CATALOG_WORKER_SHUTDOWN_TIMEOUT_MS:-25000}"
            append_environment_setting \
              "$ENV_REPLACEMENTS" "$ENV_ASSIGNMENTS" \
              ACCOUNT_DELETION_BACKUP_AUTHORITY_ENABLED 0
            append_environment_setting \
              "$ENV_REPLACEMENTS" "$ENV_ASSIGNMENTS" \
              AGENT_BACKUP_CATALOG_RUNTIME_ENABLED "$BACKUP_CATALOG_RUNTIME_GATE"
            append_environment_setting \
              "$ENV_REPLACEMENTS" "$ENV_ASSIGNMENTS" \
              AGENT_BACKUP_RPO_SCHEDULER_ENABLED "$BACKUP_RPO_SCHEDULER_GATE"
            append_environment_setting \
              "$ENV_REPLACEMENTS" "$ENV_ASSIGNMENTS" \
              AGENT_BACKUP_SPOOL_STATE_DIRECTORY "$BACKUP_SPOOL_STATE_DIRECTORY"
            append_environment_setting \
              "$ENV_REPLACEMENTS" "$ENV_ASSIGNMENTS" \
              AGENT_BACKUP_CATALOG_WORKER_HEALTH_FILE "$BACKUP_WORKER_HEALTH_FILE"
            # The provisioning worker and router still consume the shared file.
            # Delete every known backup-only authority/configuration left by an
            # older deployment so those processes inherit only the four inert
            # compatibility settings above. Names, never values, enter this plan.
            shared_backup_only_names=(
              AGENT_BACKUP_CATALOG_WORKER_ID
              AGENT_BACKUP_R2_ENDPOINT_ALIAS
              AGENT_BACKUP_R2_ACCOUNT_ID
              AGENT_BACKUP_R2_ENDPOINT
              AGENT_BACKUP_R2_BUCKET
              AGENT_BACKUP_R2_REGION
              AGENT_BACKUP_R2_ACCESS_KEY_ID
              AGENT_BACKUP_R2_SECRET_ACCESS_KEY
              AGENT_BACKUP_HETZNER_ENDPOINT_ALIAS
              AGENT_BACKUP_HETZNER_ACCOUNT_ID
              AGENT_BACKUP_HETZNER_ENDPOINT
              AGENT_BACKUP_HETZNER_BUCKET
              AGENT_BACKUP_HETZNER_REGION
              AGENT_BACKUP_HETZNER_ACCESS_KEY_ID
              AGENT_BACKUP_HETZNER_SECRET_ACCESS_KEY
              AGENT_BACKUP_STEWARD_KMS_BASE_URL
              AGENT_BACKUP_STEWARD_KMS_TOKEN
              AGENT_BACKUP_AGENT_SCHEMA_VERSION
              AGENT_BACKUP_DATABASE_SCHEMA_VERSION
              AGENT_BACKUP_RUNTIME_PLUGINS_JSON
              AGENT_BACKUP_LEGACY_WRITER_DRAIN_DEPLOYMENT_ID
              AGENT_BACKUP_LEGACY_WRITER_DRAINED_AT
              AGENT_BACKUP_STORAGE_SCOPE
              AGENT_BACKUP_SPOOL_MAX_BYTES
              AGENT_BACKUP_SPOOL_MIN_FREE_BYTES
              AGENT_BACKUP_SPOOL_CLEANUP_BATCH_SIZE
              AGENT_BACKUP_CAPTURE_DEADLINE_MS
              AGENT_BACKUP_OBJECT_TRANSFER_DEADLINE_MS
              AGENT_BACKUP_SCHEDULE_BATCH_SIZE
              AGENT_BACKUP_SCHEDULE_LEASE_MS
              AGENT_BACKUP_SCHEDULE_RETRY_MS
              AGENT_BACKUP_OPERATION_BATCH_SIZE
              AGENT_BACKUP_OPERATION_LEASE_MS
              AGENT_BACKUP_OPERATION_RETRY_BASE_MS
              AGENT_BACKUP_OPERATION_RETRY_MAX_MS
              AGENT_BACKUP_GC_BATCH_SIZE
              AGENT_BACKUP_GC_LEASE_MS
              AGENT_BACKUP_GC_RETRY_BASE_MS
              AGENT_BACKUP_GC_RETRY_MAX_MS
              AGENT_BACKUP_DELETION_BATCH_SIZE
              AGENT_BACKUP_CATALOG_WORKER_INTERVAL_MS
              AGENT_BACKUP_CATALOG_WORKER_RETRY_MS
              AGENT_BACKUP_CATALOG_WORKER_SHUTDOWN_TIMEOUT_MS
            )
            for name in "${shared_backup_only_names[@]}"; do
              remove_environment_setting "$ENV_REPLACEMENTS" "$name"
            done
            decode_agent_signing_key
            for kv in \
              "HEADSCALE_API_URL=$HEADSCALE_API_URL" \
              "HEADSCALE_PUBLIC_URL=$HEADSCALE_PUBLIC_URL" \
              "HEADSCALE_API_KEY=$HEADSCALE_API_KEY" \
              "VPN_REGISTRATION_TIMEOUT_MS=$VPN_REGISTRATION_TIMEOUT_MS" \
              "CONTAINERS_SSH_KEY=$CONTAINERS_SSH_KEY" \
              "SANDBOX_REGISTRY_REDIS_URL=$SANDBOX_REGISTRY_REDIS_URL" \
              "DATABASE_URL=$DATABASE_URL" \
              "STEWARD_API_URL=$STEWARD_API_URL" \
              "STEWARD_PLATFORM_KEYS=$STEWARD_PLATFORM_KEYS" \
              "AGENT_TOKEN_PRIVATE_KEY_PEM=$AGENT_TOKEN_PRIVATE_KEY_PEM" \
              "SECRETS_MASTER_KEY=$SECRETS_MASTER_KEY" \
              "ELIZA_AGENT_IMAGE=$ELIZA_AGENT_IMAGE" \
              "WARM_POOL_ENABLED=$WARM_POOL_ENABLED" \
              "ELIZA_CLOUD_AGENT_BASE_DOMAIN=$ELIZA_CLOUD_AGENT_BASE_DOMAIN" \
              "DATABASE_SSL_NO_VERIFY=$DATABASE_SSL_NO_VERIFY"; do
              key="${kv%%=*}"
              val="${kv#*=}"
              [ -n "$val" ] || continue
              case "$val" in
                *$'\n'*|*$'\r'*)
                  echo "::error::Refusing multiline setting for $key"
                  exit 1
                  ;;
              esac
              append_environment_setting \
                "$ENV_REPLACEMENTS" "$ENV_ASSIGNMENTS" "$key" "$val"
            done

            # The backup daemon receives a separate exact allowlist. Deletion
            # gets database, two-store, and spool authority; capture, scheduler,
            # KMS, SSH, Headscale, and provisioning authority remain excluded.
            append_environment_setting \
              "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" \
              ACCOUNT_DELETION_BACKUP_AUTHORITY_ENABLED "$ACCOUNT_DELETION_BACKUP_AUTHORITY_GATE"
            append_environment_setting \
              "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" \
              AGENT_BACKUP_CATALOG_RUNTIME_ENABLED "$BACKUP_CATALOG_RUNTIME_GATE"
            append_environment_setting \
              "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" \
              AGENT_BACKUP_RPO_SCHEDULER_ENABLED "$BACKUP_RPO_SCHEDULER_GATE"
            append_environment_setting \
              "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" \
              AGENT_BACKUP_CATALOG_WORKER_INTERVAL_MS "$BACKUP_WORKER_INTERVAL_MS"
            append_environment_setting \
              "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" \
              AGENT_BACKUP_CATALOG_WORKER_RETRY_MS "$BACKUP_WORKER_RETRY_MS"
            append_environment_setting \
              "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" \
              AGENT_BACKUP_CATALOG_WORKER_SHUTDOWN_TIMEOUT_MS "$BACKUP_WORKER_SHUTDOWN_TIMEOUT_MS"
            append_environment_setting \
              "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" \
              AGENT_BACKUP_SPOOL_STATE_DIRECTORY "$BACKUP_SPOOL_STATE_DIRECTORY"
            append_environment_setting \
              "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" \
              AGENT_BACKUP_CATALOG_WORKER_HEALTH_FILE "$BACKUP_WORKER_HEALTH_FILE"

            if [ "$ACCOUNT_DELETION_BACKUP_AUTHORITY_GATE" = "1" ] \
              || [ "$BACKUP_CATALOG_RUNTIME_GATE" = "1" ]; then
              authority_backup_names=(
                DATABASE_URL
                SECRETS_MASTER_KEY
                AGENT_BACKUP_R2_ENDPOINT_ALIAS
                AGENT_BACKUP_R2_ACCOUNT_ID
                AGENT_BACKUP_R2_ENDPOINT
                AGENT_BACKUP_R2_BUCKET
                AGENT_BACKUP_R2_REGION
                AGENT_BACKUP_R2_ACCESS_KEY_ID
                AGENT_BACKUP_R2_SECRET_ACCESS_KEY
                AGENT_BACKUP_HETZNER_ENDPOINT_ALIAS
                AGENT_BACKUP_HETZNER_ACCOUNT_ID
                AGENT_BACKUP_HETZNER_ENDPOINT
                AGENT_BACKUP_HETZNER_BUCKET
                AGENT_BACKUP_HETZNER_REGION
                AGENT_BACKUP_HETZNER_ACCESS_KEY_ID
                AGENT_BACKUP_HETZNER_SECRET_ACCESS_KEY
                AGENT_BACKUP_SPOOL_MAX_BYTES
                AGENT_BACKUP_SPOOL_MIN_FREE_BYTES
              )
              for name in "${authority_backup_names[@]}"; do
                val="${!name-}"
                if [ -z "$val" ]; then
                  echo "::error::Account deletion backup authority is missing required protected setting name: $name"
                  exit 1
                fi
                append_environment_setting \
                  "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" "$name" "$val"
                unset val
              done
            fi
            if [ "$BACKUP_CATALOG_RUNTIME_GATE" = "1" ]; then
              runtime_backup_names=(
                AGENT_BACKUP_CATALOG_WORKER_ID
                AGENT_BACKUP_STEWARD_KMS_BASE_URL
                AGENT_BACKUP_STEWARD_KMS_TOKEN
                AGENT_BACKUP_AGENT_SCHEMA_VERSION
                AGENT_BACKUP_DATABASE_SCHEMA_VERSION
                AGENT_BACKUP_RUNTIME_PLUGINS_JSON
                AGENT_BACKUP_LEGACY_WRITER_DRAIN_DEPLOYMENT_ID
                AGENT_BACKUP_LEGACY_WRITER_DRAINED_AT
                AGENT_BACKUP_STORAGE_SCOPE
                AGENT_BACKUP_SPOOL_CLEANUP_BATCH_SIZE
                AGENT_BACKUP_CAPTURE_DEADLINE_MS
                AGENT_BACKUP_OBJECT_TRANSFER_DEADLINE_MS
              )
              for name in "${runtime_backup_names[@]}"; do
                val="${!name-}"
                if [ -z "$val" ]; then
                  echo "::error::Backup catalogue activation input is missing required protected setting name: $name"
                  exit 1
                fi
                append_environment_setting \
                  "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" "$name" "$val"
                unset val
              done
              optional_enabled_backup_names=(
                DATABASE_SSL_NO_VERIFY
                AGENT_BACKUP_SCHEDULE_BATCH_SIZE
                AGENT_BACKUP_SCHEDULE_LEASE_MS
                AGENT_BACKUP_SCHEDULE_RETRY_MS
                AGENT_BACKUP_OPERATION_BATCH_SIZE
                AGENT_BACKUP_OPERATION_LEASE_MS
                AGENT_BACKUP_OPERATION_RETRY_BASE_MS
                AGENT_BACKUP_OPERATION_RETRY_MAX_MS
                AGENT_BACKUP_GC_BATCH_SIZE
                AGENT_BACKUP_GC_LEASE_MS
                AGENT_BACKUP_GC_RETRY_BASE_MS
                AGENT_BACKUP_GC_RETRY_MAX_MS
                AGENT_BACKUP_DELETION_BATCH_SIZE
              )
              for name in "${optional_enabled_backup_names[@]}"; do
                val="${!name-}"
                [ -n "$val" ] || continue
                append_environment_setting \
                  "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS" "$name" "$val"
                unset val
              done
            fi

            # An EnvironmentFile replacement cannot revoke authority already in
            # a running process. Disable and stop any previously installed unit
            # before even renaming the dedicated safe-off file. An interrupted
            # deployment therefore cannot leave that old process enabled with
            # its former environment. The verified unit is re-enabled only at
            # the final unit-install boundary below.
            BACKUP_OLD_LOAD_STATE=$(sudo systemctl show "$BACKUP_SYSTEMD_UNIT" \
              --property=LoadState --value 2>/dev/null || true)
            if [ "$BACKUP_OLD_LOAD_STATE" != "not-found" ]; then
              if [ -z "$BACKUP_OLD_LOAD_STATE" ]; then
                echo "::error::Could not determine the previous backup catalogue unit state"
                exit 1
              fi
              if ! sudo systemctl disable --now "$BACKUP_SYSTEMD_UNIT"; then
                # Reach and verify the same closed postcondition even when an
                # older unit's graceful stop fails. No fallback result is trusted.
                sudo systemctl kill --kill-whom=all --signal=KILL "$BACKUP_SYSTEMD_UNIT" || true
                sudo systemctl stop --no-block "$BACKUP_SYSTEMD_UNIT" || true
                sudo systemctl disable "$BACKUP_SYSTEMD_UNIT" || true
              fi
              BACKUP_OLD_ACTIVE_STATE=""
              BACKUP_OLD_MAIN_PID=""
              for _ in $(seq 1 50); do
                BACKUP_OLD_ACTIVE_STATE=$(sudo systemctl show "$BACKUP_SYSTEMD_UNIT" \
                  --property=ActiveState --value)
                BACKUP_OLD_MAIN_PID=$(sudo systemctl show "$BACKUP_SYSTEMD_UNIT" \
                  --property=MainPID --value)
                if { [ "$BACKUP_OLD_ACTIVE_STATE" = "inactive" ] || [ "$BACKUP_OLD_ACTIVE_STATE" = "failed" ]; } \
                  && [ "$BACKUP_OLD_MAIN_PID" = "0" ]; then
                  break
                fi
                sleep 0.1
              done
              if { [ "$BACKUP_OLD_ACTIVE_STATE" != "inactive" ] && [ "$BACKUP_OLD_ACTIVE_STATE" != "failed" ]; } \
                || [ "$BACKUP_OLD_MAIN_PID" != "0" ]; then
                echo "::error::Previous backup catalogue process remained live after the safe-off stop boundary"
                exit 1
              fi
              BACKUP_OLD_ENABLE_STATE=$(sudo systemctl is-enabled "$BACKUP_SYSTEMD_UNIT" 2>/dev/null || true)
              if [ "$BACKUP_OLD_ENABLE_STATE" != "disabled" ]; then
                echo "::error::Previous backup catalogue unit did not reach the disabled safe-off boundary"
                exit 1
              fi
            fi

            # Install the exact safe-off allowlist only after the old process is
            # disabled and gone. Helpers run with an empty inherited environment;
            # the plan files are the only input to the root process.
            sudo install -d -o root -g root -m 0755 "$(dirname "$BACKUP_ENV_FILE")"
            sudo flock -w 120 "$BACKUP_ENV_FILE.lock" \
              /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
              "$NODE_BIN" "$ENV_SERIALIZER" install \
              "$BACKUP_ENV_FILE" "$BACKUP_REPLACEMENTS" "$BACKUP_ASSIGNMENTS"
            if [ "$(sudo stat -c '%U:%G:%a' "$BACKUP_ENV_FILE")" != "root:root:600" ]; then
              echo "::error::Dedicated backup catalogue EnvironmentFile ownership or mode is invalid"
              exit 1
            fi
            require_environment_setting_equals \
              "$BACKUP_ENV_FILE" ACCOUNT_DELETION_BACKUP_AUTHORITY_ENABLED 1
            require_environment_setting_equals \
              "$BACKUP_ENV_FILE" AGENT_BACKUP_CATALOG_RUNTIME_ENABLED 0
            require_environment_setting_equals \
              "$BACKUP_ENV_FILE" AGENT_BACKUP_RPO_SCHEDULER_ENABLED 0

            # The shared file is reconciled only after the dormant worker has
            # been forced safe-off. Optimistic snapshot verification also
            # detects writers that do not cooperate with this lock and retries
            # from their latest contents instead of losing their update.
            sudo flock -w 120 "$ENV_FILE.lock" \
              /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
              "$NODE_BIN" "$ENV_SERIALIZER" reconcile \
              "$ENV_FILE" "$ENV_REPLACEMENTS" "$ENV_ASSIGNMENTS"
            # TEST-ANCHOR: atomic-environment-reconcile-end
            rm -rf -- "$RECONCILE_PLAN_DIR"
            trap - EXIT

            # Some live secrets predate GitHub environment inventory and cannot
            # be recovered from Cloudflare. Empty CI values deliberately preserve
            # their host entries above. Fail before restart unless every daemon-
            # required name has a nonblank value, while never printing a value.
            required_host_settings=(
              HEADSCALE_API_URL
              HEADSCALE_PUBLIC_URL
              HEADSCALE_API_KEY
              CONTAINERS_SSH_KEY
              DATABASE_URL
              STEWARD_API_URL
              STEWARD_PLATFORM_KEYS
              AGENT_TOKEN_PRIVATE_KEY_PEM
              SECRETS_MASTER_KEY
              ELIZA_CLOUD_AGENT_BASE_DOMAIN
            )
            missing_host_settings=()
            for name in "${required_host_settings[@]}"; do
              if ! require_environment_settings "$ENV_FILE" "$name"; then
                missing_host_settings+=("$name")
              fi
            done
            if [ "${#missing_host_settings[@]}" -gt 0 ]; then
              echo "::error::Provisioning host is missing required setting name(s): ${missing_host_settings[*]}"
              exit 1
            fi
            echo "Verified required provisioning-host setting names; values were not printed."

            case "$WARM_POOL_ENABLED" in
              true|false) ;;
              *)
                echo "::error::WARM_POOL_ENABLED must be exactly true or false"
                exit 1
                ;;
            esac
            if ! require_environment_setting_equals \
              "$ENV_FILE" WARM_POOL_ENABLED "$WARM_POOL_ENABLED"; then
              echo "::error::Provisioning host warm-pool state does not match the protected environment"
              exit 1
            fi
            echo "Verified provisioning-host warm-pool state: $WARM_POOL_ENABLED"

            # Capture and scheduling remain off in both files. Only the
            # dedicated daemon receives deletion backup authority.
            if ! require_environment_setting_equals \
              "$ENV_FILE" ACCOUNT_DELETION_BACKUP_AUTHORITY_ENABLED 0; then
              echo "::error::Shared provisioning environment must not receive deletion backup authority"
              exit 1
            fi
            if ! require_environment_setting_equals \
              "$BACKUP_ENV_FILE" ACCOUNT_DELETION_BACKUP_AUTHORITY_ENABLED 1; then
              echo "::error::Dedicated backup daemon deletion authority gate is invalid"
              exit 1
            fi
            for gate_name in AGENT_BACKUP_CATALOG_RUNTIME_ENABLED AGENT_BACKUP_RPO_SCHEDULER_ENABLED; do
              if ! require_environment_setting_equals "$ENV_FILE" "$gate_name" 0; then
                echo "::error::Backup catalogue merge-time gate contract is invalid for $gate_name"
                exit 1
              fi
              if ! require_environment_setting_equals "$BACKUP_ENV_FILE" "$gate_name" 0; then
                echo "::error::Dedicated backup catalogue gate contract is invalid for $gate_name"
                exit 1
              fi
            done
            if [ "$(sudo stat -c '%U:%G:%a' "$BACKUP_ENV_FILE")" != "root:root:600" ]; then
              echo "::error::Dedicated backup catalogue EnvironmentFile ownership or mode is invalid"
              exit 1
            fi
            if [ "$ACCOUNT_DELETION_BACKUP_AUTHORITY_GATE" = "1" ] \
              || [ "$BACKUP_CATALOG_RUNTIME_GATE" = "1" ]; then
              required_backup_settings=(
                DATABASE_URL
                SECRETS_MASTER_KEY
                AGENT_BACKUP_R2_ENDPOINT_ALIAS
                AGENT_BACKUP_R2_ACCOUNT_ID
                AGENT_BACKUP_R2_ENDPOINT
                AGENT_BACKUP_R2_BUCKET
                AGENT_BACKUP_R2_REGION
                AGENT_BACKUP_R2_ACCESS_KEY_ID
                AGENT_BACKUP_R2_SECRET_ACCESS_KEY
                AGENT_BACKUP_HETZNER_ENDPOINT_ALIAS
                AGENT_BACKUP_HETZNER_ACCOUNT_ID
                AGENT_BACKUP_HETZNER_ENDPOINT
                AGENT_BACKUP_HETZNER_BUCKET
                AGENT_BACKUP_HETZNER_REGION
                AGENT_BACKUP_HETZNER_ACCESS_KEY_ID
                AGENT_BACKUP_HETZNER_SECRET_ACCESS_KEY
                AGENT_BACKUP_SPOOL_STATE_DIRECTORY
                AGENT_BACKUP_SPOOL_MAX_BYTES
                AGENT_BACKUP_SPOOL_MIN_FREE_BYTES
              )
              if [ "$BACKUP_CATALOG_RUNTIME_GATE" = "1" ]; then
                required_backup_settings+=(
                AGENT_BACKUP_CATALOG_WORKER_ID
                AGENT_BACKUP_STEWARD_KMS_BASE_URL
                AGENT_BACKUP_STEWARD_KMS_TOKEN
                AGENT_BACKUP_AGENT_SCHEMA_VERSION
                AGENT_BACKUP_DATABASE_SCHEMA_VERSION
                AGENT_BACKUP_RUNTIME_PLUGINS_JSON
                AGENT_BACKUP_LEGACY_WRITER_DRAIN_DEPLOYMENT_ID
                AGENT_BACKUP_LEGACY_WRITER_DRAINED_AT
                AGENT_BACKUP_STORAGE_SCOPE
                AGENT_BACKUP_SPOOL_CLEANUP_BATCH_SIZE
                AGENT_BACKUP_CAPTURE_DEADLINE_MS
                AGENT_BACKUP_OBJECT_TRANSFER_DEADLINE_MS
                )
              fi
              missing_backup_settings=()
              for name in "${required_backup_settings[@]}"; do
                if ! require_environment_settings "$BACKUP_ENV_FILE" "$name"; then
                  missing_backup_settings+=("$name")
                fi
              done
              if [ "${#missing_backup_settings[@]}" -gt 0 ]; then
                echo "::error::Backup catalogue host is missing required setting name(s): ${missing_backup_settings[*]}"
                exit 1
              fi
            fi
            echo "Verified deletion-only backup authority and disabled capture/scheduler gates; values were not printed."

            /usr/bin/env -i \
              PATH="$SAFE_CHILD_PATH" \
              HOME=/home/deploy \
              ACCOUNT_DELETION_BACKUP_AUTHORITY_ENABLED=0 \
              AGENT_BACKUP_CATALOG_RUNTIME_ENABLED=0 \
              AGENT_BACKUP_RPO_SCHEDULER_ENABLED=0 \
              AGENT_BACKUP_SPOOL_STATE_DIRECTORY=/var/lib/eliza-backup-catalog/spool \
              AGENT_BACKUP_CATALOG_WORKER_HEALTH_FILE=/run/eliza-backup-catalog/health.json \
              /opt/eliza/node_modules/.bin/tsx \
              --tsconfig /opt/eliza/packages/cloud/shared/tsconfig.json \
              packages/cloud/scripts/admin/daemons/backup-catalog-worker-preflight.ts

            # This workflow can reach the restart independently of the cloud
            # deploy workflow's migrate-db job. Bind activation to the exact
            # catalog and migration hash instead of assuming another workflow
            # won the race. The bounded preflight leaves the currently healthy
            # daemons running when migration has not completed or drifted.
            if [ -z "$DATABASE_URL" ]; then
              echo "::error::DATABASE_URL is required for the job-interruption schema preflight."
              exit 1
            fi
            /usr/bin/env -i \
              PATH="$SAFE_CHILD_PATH" \
              HOME=/home/deploy \
              DATABASE_URL="$DATABASE_URL" \
              DATABASE_SSL_NO_VERIFY="$DATABASE_SSL_NO_VERIFY" \
              timeout --foreground --signal=TERM --kill-after=5s 8m \
              "$BUN_BIN" --conditions=eliza-source \
              packages/cloud/scripts/admin/preflight-job-execution-interruptions.ts

            # Prove that the host's real systemd manager consumes this
            # serializer's EnvironmentFile. The probe contains one public
            # literal only; no deployment authority is copied into its file,
            # command line, output, or transient unit. The exact-SHA backup unit
            # itself is installed and verified from its root-owned destination
            # at the final disabled-unit boundary below.
            SYSTEMD_PROBE_DIR=$(mktemp -d)
            chmod 700 "$SYSTEMD_PROBE_DIR"
            SYSTEMD_PROBE_SOURCE="$SYSTEMD_PROBE_DIR/environment"
            SYSTEMD_PROBE_ENV="/run/eliza-backup-environment-probe.$$.env"
            cleanup_systemd_probe() {
              sudo rm -f -- "$SYSTEMD_PROBE_ENV"
              rm -rf -- "$SYSTEMD_PROBE_DIR"
            }
            trap cleanup_systemd_probe EXIT
            printf '%s' expected-safe-literal \
              | run_environment_helper serialize SYSTEMD_ENVIRONMENT_PROBE \
              > "$SYSTEMD_PROBE_SOURCE"
            chmod 600 "$SYSTEMD_PROBE_SOURCE"
            sudo install -o root -g root -m 0600 \
              "$SYSTEMD_PROBE_SOURCE" "$SYSTEMD_PROBE_ENV"
            sudo /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
              systemd-run --wait --pipe --quiet --collect \
              --service-type=oneshot --uid=deploy \
              --property="EnvironmentFile=$SYSTEMD_PROBE_ENV" \
              /bin/sh -c '[ "${SYSTEMD_ENVIRONMENT_PROBE:-}" = expected-safe-literal ]'
            cleanup_systemd_probe
            trap - EXIT

            # Prove the host manager honors the exact exit-78 restart fence on
            # a main process. ExecStartPre exits are intentionally absent from
            # the shipped unit because RestartPreventExitStatus does not cover
            # them. This public transient probe must execute once and stop.
            RESTART_PROBE_UNIT="eliza-backup-exit78-probe-${DEPLOY_SHA:0:12}-$$.service"
            cleanup_restart_probe() {
              sudo systemctl stop "$RESTART_PROBE_UNIT" >/dev/null 2>&1 || true
              sudo systemctl reset-failed "$RESTART_PROBE_UNIT" >/dev/null 2>&1 || true
            }
            trap cleanup_restart_probe EXIT
            sudo /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
              systemd-run --quiet --unit="$RESTART_PROBE_UNIT" \
              --property=Restart=always \
              --property=RestartPreventExitStatus=78 \
              /bin/sh -c 'exit 78'
            RESTART_PROBE_STATE=""
            for _ in $(seq 1 50); do
              RESTART_PROBE_STATE=$(sudo systemctl show "$RESTART_PROBE_UNIT" \
                --property=ActiveState --value)
              if [ "$RESTART_PROBE_STATE" = "failed" ] || [ "$RESTART_PROBE_STATE" = "inactive" ]; then
                break
              fi
              sleep 0.1
            done
            RESTART_PROBE_STATUS=$(sudo systemctl show "$RESTART_PROBE_UNIT" \
              --property=ExecMainStatus --value)
            RESTART_PROBE_COUNT=$(sudo systemctl show "$RESTART_PROBE_UNIT" \
              --property=NRestarts --value)
            if { [ "$RESTART_PROBE_STATE" != "failed" ] && [ "$RESTART_PROBE_STATE" != "inactive" ]; } \
              || [ "$RESTART_PROBE_STATUS" != "78" ] \
              || [ "$RESTART_PROBE_COUNT" != "0" ]; then
              echo "::error::systemd did not honor the backup worker exit-78 restart fence"
              exit 1
            fi
            cleanup_restart_probe
            trap - EXIT

            # Install units only after both EnvironmentFiles, closed name/value
            # checks, disabled preflight, database schema preflight, and real
            # systemd consumption have succeeded. The backup unit is copied,
            # verified, reloaded, and inspected while it remains disabled.
            sudo install -m 0644 \
              packages/cloud/scripts/admin/eliza-provisioning-worker.service \
              "/etc/systemd/system/$SYSTEMD_UNIT"
            sudo install -m 0644 \
              packages/cloud/scripts/admin/eliza-agent-router.service \
              /etc/systemd/system/eliza-agent-router.service
            BACKUP_UNIT_SOURCE=/opt/eliza/packages/cloud/scripts/admin/eliza-backup-catalog-worker.service
            BACKUP_UNIT_DESTINATION="/etc/systemd/system/$BACKUP_SYSTEMD_UNIT"
            install_root_verified_file \
              "$BACKUP_UNIT_SOURCE" \
              "$BACKUP_UNIT_DESTINATION" \
              "$BACKUP_SYSTEMD_UNIT_SHA256" \
              0644
            sudo /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
              systemd-analyze verify "$BACKUP_UNIT_DESTINATION"
            sudo systemctl daemon-reload

            BACKUP_EFFECTIVE_DYNAMIC_USER=$(sudo systemctl show \
              "$BACKUP_SYSTEMD_UNIT" --property=DynamicUser --value)
            BACKUP_EFFECTIVE_USER=$(sudo systemctl show \
              "$BACKUP_SYSTEMD_UNIT" --property=User --value)
            BACKUP_EFFECTIVE_GROUP=$(sudo systemctl show \
              "$BACKUP_SYSTEMD_UNIT" --property=Group --value)
            BACKUP_EFFECTIVE_EXEC_START=$(sudo systemctl show \
              "$BACKUP_SYSTEMD_UNIT" --property=ExecStart --value)
            BACKUP_EFFECTIVE_FRAGMENT=$(sudo systemctl show \
              "$BACKUP_SYSTEMD_UNIT" --property=FragmentPath --value)
            BACKUP_EFFECTIVE_DROP_INS=$(sudo systemctl show \
              "$BACKUP_SYSTEMD_UNIT" --property=DropInPaths --value)
            BACKUP_EFFECTIVE_DIGEST_OUTPUT=$(sudo /usr/bin/sha256sum -- \
              "$BACKUP_UNIT_DESTINATION")
            BACKUP_EFFECTIVE_SHA256="${BACKUP_EFFECTIVE_DIGEST_OUTPUT%% *}"
            BACKUP_EXPECTED_EXECUTABLE=/opt/eliza/node_modules/.bin/tsx
            BACKUP_EXPECTED_EXEC_START="$BACKUP_EXPECTED_EXECUTABLE --tsconfig /opt/eliza/packages/cloud/shared/tsconfig.json /opt/eliza/packages/cloud/scripts/admin/daemons/backup-catalog-worker.ts"
            # With DynamicUser=yes and no explicit User=, systemd v255 exposes
            # the unit-derived dynamic identity through the effective User
            # property. Require that exact derivation, not an empty value.
            BACKUP_EXPECTED_DYNAMIC_USER="${BACKUP_SYSTEMD_UNIT%.service}"
            if [ "$BACKUP_EFFECTIVE_DYNAMIC_USER" != "yes" ] \
              || [ "$BACKUP_EFFECTIVE_USER" != "$BACKUP_EXPECTED_DYNAMIC_USER" ] \
              || [ "$BACKUP_EFFECTIVE_GROUP" != "$BACKUP_EXPECTED_DYNAMIC_USER" ] \
              || [ "$BACKUP_EFFECTIVE_FRAGMENT" != "$BACKUP_UNIT_DESTINATION" ] \
              || [ -n "$BACKUP_EFFECTIVE_DROP_INS" ] \
              || [ "$BACKUP_EFFECTIVE_SHA256" != "$BACKUP_SYSTEMD_UNIT_SHA256" ]; then
              echo "::error::Effective backup systemd identity or fragment integrity is invalid"
              exit 1
            fi
            case "$BACKUP_EFFECTIVE_EXEC_START" in
              *"path=$BACKUP_EXPECTED_EXECUTABLE ; argv[]=$BACKUP_EXPECTED_EXEC_START ;"*) ;;
              *)
                echo "::error::Effective backup systemd ExecStart is invalid"
                exit 1
                ;;
            esac
            sudo systemctl enable "$SYSTEMD_UNIT" eliza-agent-router.service "$BACKUP_SYSTEMD_UNIT"
            sudo systemctl restart "$SYSTEMD_UNIT"
            sudo systemctl restart eliza-agent-router.service
            sudo systemctl restart "$BACKUP_SYSTEMD_UNIT"
            echo "=== Restart issued for provisioning, router, and dormant backup daemons ==="

            # The canonical edge origin must terminate in the nginx vhost that
            # proxies the agent-router daemon. Without this alias, nginx
            # serves its default blank web shell with HTTP 200; lifecycle calls
            # then parse HTML as a snapshot and safe restarts wedge. Amend the
            # existing, operator-reviewed router vhost rather than creating a
            # second listener or certificate configuration.
            mapfile -t router_vhosts < <(
              sudo grep -RIl \
                'proxy_pass[[:space:]]\+http://127\.0\.0\.1:3458' \
                /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null \
                | xargs -r readlink -f \
                | sort -u
            )
            if [ "${#router_vhosts[@]}" -eq 0 ]; then
              echo "::error::No enabled nginx vhost proxies the agent-router upstream on 127.0.0.1:3458"
              exit 1
            fi
            for vhost in "${router_vhosts[@]}"; do
              if sudo grep -Eq "server_name[^;]*${AGENT_ROUTER_PUBLIC_HOST}([[:space:]]|;)" "$vhost"; then
                continue
              fi
              sudo sed -Ei \
                "/server_name[^;]*;/ s/[[:space:]]*;/ ${AGENT_ROUTER_PUBLIC_HOST};/" \
                "$vhost"
            done
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Health check
        if: steps.deploy_config.outputs.configured == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          username: deploy
          key: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          # A prior run may still own the same host deployment lock for its
          # bounded build. Wait through that lease, then verify whether this
          # run's immutable SHA is still deployed before certifying health.
          command_timeout: 25m
          envs: DEPLOY_SHA,SYSTEMD_UNIT,BACKUP_SYSTEMD_UNIT,SYSTEMD_ENVIRONMENT_HELPER_SHA256,ELIZA_CLOUD_AGENT_BASE_DOMAIN,AGENT_ROUTER_PUBLIC_HOST,WARM_POOL_ENABLED,VPN_REGISTRATION_TIMEOUT_MS
          script: |
            set -euo pipefail

            # Keep deployment identity serialized through health. A newer run
            # may acquire the host mutation lock between this run's deploy and
            # health SSH steps; in that ordering this run waits, then fails as
            # superseded instead of certifying the newer checkout.
            exec 9>/tmp/eliza-provisioning-worker-deploy.lock
            flock -w 1200 9 || {
              echo "::error::Timed out acquiring the provisioning health identity lease"
              exit 1
            }
            cd /opt/eliza
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=safe.directory
            export GIT_CONFIG_VALUE_0=/opt/eliza
            ACTUAL_DEPLOY_SHA=$(git rev-parse HEAD)
            if [ "$ACTUAL_DEPLOY_SHA" != "$DEPLOY_SHA" ]; then
              echo "::error::Provisioning deployment was superseded before health verification"
              exit 1
            fi

            ENV_FILE=/opt/eliza/cloud/.env.local
            ENV_SERIALIZER=/usr/local/lib/eliza-admin/systemd-environment-line.mjs
            NODE_BIN=/usr/bin/node
            SAFE_CHILD_PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin
            if [ ! -x "$NODE_BIN" ] || [[ "$("$NODE_BIN" --version)" != v24.* ]]; then
              echo "::error::The canonical root-owned Node 24 binary is unavailable"
              exit 1
            fi
            HEALTH_HELPER_DIGEST_OUTPUT=$(sudo /usr/bin/sha256sum -- \
              "$ENV_SERIALIZER") || {
              echo "::error::Could not hash the installed EnvironmentFile helper"
              exit 1
            }
            HEALTH_HELPER_SHA256="${HEALTH_HELPER_DIGEST_OUTPUT%% *}"
            if [[ ! "$SYSTEMD_ENVIRONMENT_HELPER_SHA256" =~ ^[0-9a-f]{64}$ ]] \
              || [ "$(sudo /usr/bin/stat -c '%U:%G:%a' "$ENV_SERIALIZER")" != "root:root:555" ] \
              || [ "$HEALTH_HELPER_SHA256" != "$SYSTEMD_ENVIRONMENT_HELPER_SHA256" ]; then
              echo "::error::Installed EnvironmentFile helper integrity is invalid"
              exit 1
            fi
            if ! printf '%s' "$ELIZA_CLOUD_AGENT_BASE_DOMAIN" \
              | sudo /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
                  "$NODE_BIN" "$ENV_SERIALIZER" equals \
                  "$ENV_FILE" ELIZA_CLOUD_AGENT_BASE_DOMAIN; then
              echo "::error::Agent router base-domain drift. Values were not printed."
              exit 1
            fi
            if ! printf '%s' "$WARM_POOL_ENABLED" \
              | sudo /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
                  "$NODE_BIN" "$ENV_SERIALIZER" equals \
                  "$ENV_FILE" WARM_POOL_ENABLED; then
              echo "::error::Provisioning host warm-pool drift. Values were not printed."
              exit 1
            fi
            if ! printf '%s' "$VPN_REGISTRATION_TIMEOUT_MS" \
              | sudo /usr/bin/env -i PATH="$SAFE_CHILD_PATH" \
                  "$NODE_BIN" "$ENV_SERIALIZER" equals \
                  "$ENV_FILE" VPN_REGISTRATION_TIMEOUT_MS; then
              echo "::error::Provisioning host VPN registration timeout drift. Values were not printed."
              exit 1
            fi
            # The worker logs to journald via systemd's stdout/stderr capture.
            # Info-level logs are filtered unless VERBOSE_LOGGING=true, so we
            # rely on systemd's own signals: process is active AND no fatal
            # error / restart-loop in the journal since deploy.
            HEALTH_SINCE_TS="$(date -u '+%Y-%m-%d %H:%M:%S')"
            STABLE_THRESHOLD_SEC=20
            FATAL_LOG_PATTERN="\[(provisioning-worker|agent-router|backup-catalog-worker)\] (fatal|unhandled rejection)|node:internal/.*Error:|Error \[ERR_|^[A-Za-z]+Error:"
            report_unit_diagnostic() {
              local category="$1"
              local label="$2"
              local unit="$3"
              local raw_load raw_active raw_result
              local load_class active_class result_class
              case "$label" in
                worker|router|backup|nginx) ;;
                *) label=unknown ;;
              esac
              raw_load=$(sudo systemctl show "$unit" --property=LoadState --value 2>/dev/null || true)
              raw_active=$(sudo systemctl show "$unit" --property=ActiveState --value 2>/dev/null || true)
              raw_result=$(sudo systemctl show "$unit" --property=Result --value 2>/dev/null || true)
              case "$raw_load" in
                loaded) load_class=loaded ;;
                masked) load_class=masked ;;
                not-found) load_class=missing ;;
                *) load_class=other ;;
              esac
              case "$raw_active" in
                active) active_class=active ;;
                failed) active_class=failed ;;
                inactive) active_class=inactive ;;
                activating|deactivating|reloading) active_class=transitioning ;;
                *) active_class=other ;;
              esac
              case "$raw_result" in
                "") result_class=none ;;
                success) result_class=success ;;
                exit-code|signal|core-dump|watchdog|timeout|start-limit-hit|oom-kill) result_class=failure ;;
                *) result_class=other ;;
              esac
              echo "::error::unit-state category=${category} component=${label} load=${load_class} active=${active_class} result=${result_class}"
            }
            report_public_route_failure() {
              local nginx_config_class=invalid
              if sudo nginx -t >/dev/null 2>&1; then
                nginx_config_class=valid
              fi
              echo "::error::nginx-config category=public-route verdict=${nginx_config_class}"
              report_unit_diagnostic public-route nginx nginx
              report_unit_diagnostic public-route router eliza-agent-router.service
            }
            validate_deletion_authority_backup_health() {
              # DynamicUser owns the mode-0700 RuntimeDirectory and mode-0600
              # snapshot. Validate it as root with a fixed path, bounded bytes,
              # empty inherited environment, and no stdout value channel.
              sudo /usr/bin/env -i PATH="$SAFE_CHILD_PATH" "$NODE_BIN" -e '
                const { readFileSync } = require("node:fs");
                try {
                  const bytes = readFileSync("/run/eliza-backup-catalog/health.json");
                  if (bytes.byteLength === 0 || bytes.byteLength > 65536) process.exit(1);
                  const raw = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
                  const parsed = JSON.parse(raw);
                  const valid =
                    parsed &&
                    parsed.format === "elizaos.agent-backup.catalog-worker-health.v1" &&
                    parsed.state === "idle" &&
                    parsed.enabled === true &&
                    Number.isSafeInteger(parsed.cycles) &&
                    parsed.cycles >= 1;
                  process.exit(valid ? 0 : 1);
                } catch {
                  // error-policy:J1 missing, malformed, or hostile health bytes
                  // become one closed non-success status without output.
                  process.exit(1);
                }
              '
            }
            # The router's health contract is a JSON object with boolean
            # ok === true. A substring grep would also accept HTML error
            # pages that merely contain the text, so parse for real.
            validate_public_health_payload() {
              /usr/bin/env -i PATH="$SAFE_CHILD_PATH" "$NODE_BIN" -e '
                let raw = "";
                process.stdin.on("data", (chunk) => { raw += chunk; });
                process.stdin.on("end", () => {
                  let parsed;
                  try {
                    parsed = JSON.parse(raw);
                  } catch {
                    process.exit(1);
                  }
                  const healthy =
                    typeof parsed === "object" &&
                    parsed !== null &&
                    !Array.isArray(parsed) &&
                    parsed.ok === true;
                  process.exit(healthy ? 0 : 1);
                });
              '
            }
            for attempt in $(seq 1 18); do
              if ! sudo systemctl is-active --quiet "$BACKUP_SYSTEMD_UNIT"; then
                echo "Health check attempt $attempt/18: deletion backup authority worker not active yet."
                sleep 5
                continue
              fi
              BACKUP_JOURNAL=$(sudo journalctl -u "$BACKUP_SYSTEMD_UNIT" --since "$HEALTH_SINCE_TS" --no-pager 2>/dev/null || true)
              if grep -qE "$FATAL_LOG_PATTERN" <<<"$BACKUP_JOURNAL"; then
                echo "::error::Backup catalogue worker logged a fatal error since deploy."
                report_unit_diagnostic fatal-log backup "$BACKUP_SYSTEMD_UNIT"
                exit 1
              fi
              if ! validate_deletion_authority_backup_health; then
                echo "Health check attempt $attempt/18: backup health is unavailable or has not completed an authority cycle yet."
                sleep 5
                continue
              fi
              if sudo systemctl is-active --quiet "$SYSTEMD_UNIT"; then
                JOURNAL=$(sudo journalctl -u "$SYSTEMD_UNIT" --since "$HEALTH_SINCE_TS" --no-pager 2>/dev/null || true)
                if grep -qE "$FATAL_LOG_PATTERN" <<<"$JOURNAL"; then
                  echo "::error::Worker logged a fatal error since deploy."
                  report_unit_diagnostic fatal-log worker "$SYSTEMD_UNIT"
                  exit 1
                fi
                # Active + uptime past the threshold = healthy. systemd's Restart=always
                # means a crashing process would resurrect; an uptime > threshold
                # therefore proves it stayed up across at least one poll cycle.
                UPTIME_SEC=$(systemctl show "$SYSTEMD_UNIT" --property=ActiveEnterTimestampMonotonic --value | awk '{ print int($1 / 1e6) }')
                NOW_SEC=$(awk '{print int($1)}' /proc/uptime)
                AGE=$(( NOW_SEC - UPTIME_SEC ))
                if [ "$AGE" -ge "$STABLE_THRESHOLD_SEC" ]; then
                  if ! sudo systemctl is-active --quiet eliza-agent-router.service; then
                    echo "Health check attempt $attempt/18: worker stable (${AGE}s), router not active yet."
                    sleep 5
                    continue
                  fi
                  ROUTER_JOURNAL=$(sudo journalctl -u eliza-agent-router.service --since "$HEALTH_SINCE_TS" --no-pager 2>/dev/null || true)
                  if grep -qE "$FATAL_LOG_PATTERN" <<<"$ROUTER_JOURNAL"; then
                    echo "::error::Agent router logged a fatal error since activation."
                    report_unit_diagnostic fatal-log router eliza-agent-router.service
                    exit 1
                  fi
                  ROUTER_UPTIME_SEC=$(systemctl show eliza-agent-router.service --property=ActiveEnterTimestampMonotonic --value | awk '{ print int($1 / 1e6) }')
                  ROUTER_AGE=$(( NOW_SEC - ROUTER_UPTIME_SEC ))
                  if [ "$ROUTER_AGE" -lt "$STABLE_THRESHOLD_SEC" ]; then
                    echo "Health check attempt $attempt/18: worker stable (${AGE}s), router only ${ROUTER_AGE}s old."
                    sleep 5
                    continue
                  fi
                  ROUTER_PORT=$(systemctl show eliza-agent-router.service --property=Environment --value | tr ' ' '\n' | awk -F= '$1=="AGENT_ROUTER_PORT" {print $2}')
                  : "${ROUTER_PORT:=3458}"
                  if curl -sf -m 3 "http://127.0.0.1:${ROUTER_PORT}/healthz" >/dev/null 2>&1 && \
                     curl -sf -m 3 "http://127.0.0.1:${ROUTER_PORT}/readyz" >/dev/null 2>&1; then
                    PUBLIC_HEALTH=""
                    PUBLIC_READINESS=""
                    public_route_ok=false
                    for public_attempt in 1 2 3; do
                      if PUBLIC_HEALTH=$(curl -fsS -m 5 "https://${AGENT_ROUTER_PUBLIC_HOST}/healthz" 2>/dev/null) && \
                         PUBLIC_READINESS=$(curl -fsS -m 5 "https://${AGENT_ROUTER_PUBLIC_HOST}/readyz" 2>/dev/null); then
                        public_route_ok=true
                        break
                      fi
                      echo "Canonical health/readiness attempt ${public_attempt}/3 failed; response suppressed; retrying in 2s."
                      sleep 2
                    done
                    if [ "$public_route_ok" != "true" ]; then
                      echo "::error::Canonical agent-router route failed after local readiness (category=public-route-transport)."
                      report_public_route_failure
                      exit 1
                    fi
                    if ! printf '%s' "$PUBLIC_HEALTH" | validate_public_health_payload; then
                      echo "::error::Canonical agent-router health contract failed (category=public-route-payload)."
                      report_public_route_failure
                      exit 1
                    fi
                    if ! printf '%s' "$PUBLIC_READINESS" | validate_public_health_payload; then
                      echo "::error::Canonical agent-router readiness contract failed (category=public-route-payload)."
                      report_public_route_failure
                      exit 1
                    fi
                    echo "Provisioning/router stable and backup worker disabled/healthy (worker ${AGE}s, router ${ROUTER_AGE}s) on attempt $attempt."
                    exit 0
                  fi
                  echo "Health check attempt $attempt/18: worker and router stable but local health/readiness not ready."
                  sleep 5
                  continue
                fi
                echo "Health check attempt $attempt/18: active but only ${AGE}s old, waiting for stability..."
              else
                echo "Health check attempt $attempt/18: not active yet."
              fi
              sleep 5
            done

            echo "::error::Provisioning health deadline exceeded (category=health-timeout)."
            report_unit_diagnostic health-timeout worker "$SYSTEMD_UNIT"
            report_unit_diagnostic health-timeout router eliza-agent-router.service
            report_unit_diagnostic health-timeout backup "$BACKUP_SYSTEMD_UNIT"
            exit 1

      - name: Notify Discord (Success)
        if: success() && steps.deploy_config.outputs.configured == 'true'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          ack_no_webhook: true
          title: "🚀 Eliza Provisioning Worker Deployed"
          nodetail: true
          description: |
            Branch: ${{ needs.determine-env.outputs.branch }}
            Commit: ${{ needs.determine-env.outputs.deployment_sha }}
          color: 0x00ff00

      - name: Notify Discord (Failure)
        if: failure() && steps.deploy_config.outputs.configured == 'true'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          ack_no_webhook: true
          title: "❌ Eliza Provisioning Worker Deploy Failed"
          nodetail: true
          description: |
            Branch: ${{ needs.determine-env.outputs.branch }}
            Commit: ${{ needs.determine-env.outputs.deployment_sha }}
          color: 0xff0000

