name: Browser bridge Windows security

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-security-contract:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        id: install
        shell: powershell
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Execute Windows PowerShell 5.1 security helpers
        shell: powershell
        run: .\packages/app/platforms/electrobun/scripts/test-browser-bridge-windows-security.ps1
      - name: Compile and probe staged Windows native host
        shell: powershell
        run: .\packages/app/platforms/electrobun/scripts/test-browser-bridge-windows-native-host.ps1
