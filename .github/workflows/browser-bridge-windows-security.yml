name: Browser bridge Windows security

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-security-contract:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        id: install
        shell: powershell
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Preserve Vitest installation before native probes
        if: ${{ always() && steps.install.outcome != 'skipped' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/vitest-install-evidence" | Out-Null
          node .github/scripts/capture-vitest-install.mjs after-install "$env:RUNNER_TEMP/vitest-install-evidence" "$env:RUNNER_TEMP/bun-install-cache"
      - name: Execute Windows PowerShell 5.1 security helpers
        shell: powershell
        run: .\packages/app-core/platforms/electrobun/scripts/test-browser-bridge-windows-security.ps1
      - name: Compile and probe staged Windows native host
        shell: powershell
        run: .\packages/app-core/platforms/electrobun/scripts/test-browser-bridge-windows-native-host.ps1
      - name: Preserve Vitest installation after native probes
        if: ${{ always() && steps.install.outcome == 'success' }}
        shell: powershell
        run: node .github/scripts/capture-vitest-install.mjs after-native "$env:RUNNER_TEMP/vitest-install-evidence" "$env:RUNNER_TEMP/bun-install-cache"
      - name: Run browser broker security contracts
        id: contracts
        shell: powershell
        working-directory: packages/app-core/platforms/electrobun
        run: bunx vitest run --config vitest.electrobun.config.ts src/native/browser-bridge-broker-secret.test.ts src/native/browser-bridge-broker-server.test.ts src/native/browser-bridge-registration.test.ts src/native/browser-bridge-unregister.test.ts src/native/browser-bridge-windows-native-host-proof.test.ts
      - name: Preserve Vitest installation after broker contracts
        if: ${{ always() && steps.install.outcome == 'success' }}
        shell: powershell
        run: node .github/scripts/capture-vitest-install.mjs after-contracts "$env:RUNNER_TEMP/vitest-install-evidence" "$env:RUNNER_TEMP/bun-install-cache"
      - name: Upload Vitest installation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-vitest-install-evidence
          path: ${{ runner.temp }}/vitest-install-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose broker test installation failure
        if: ${{ failure() && (steps.install.outcome == 'failure' || steps.contracts.outcome == 'failure') }}
        shell: powershell
        working-directory: packages/app-core/platforms/electrobun
        run: |
          Write-Output "Install outcome: ${{ steps.install.outcome }}; contracts outcome: ${{ steps.contracts.outcome }}"
          Get-Command node, bun | Select-Object Name, Source
          node --version
          bun --version
          $diagnostic = @'
          const fs = require("node:fs");
          const path = require("node:path");
          const packageJson = require.resolve("vitest/package.json");
          const packageRoot = path.dirname(packageJson);
          const cli = path.join(packageRoot, "dist", "cli.js");
          console.log(JSON.stringify({ runtime: process.version, executable: process.execPath, packageJson, version: JSON.parse(fs.readFileSync(packageJson, "utf8")).version, cli, cliExists: fs.existsSync(cli) }));
          if (fs.existsSync(cli)) {
            const source = fs.readFileSync(cli, "utf8");
            for (const match of source.matchAll(/['"](\.\/chunks\/[^'"]+)['"]/g)) {
              const chunk = path.resolve(path.dirname(cli), match[1]);
              console.log(JSON.stringify({ chunk, exists: fs.existsSync(chunk) }));
            }
          }
          '@
          $diagnostic | node --input-type=commonjs
