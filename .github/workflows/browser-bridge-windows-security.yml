name: Browser bridge Windows security

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-security-contract:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        id: install
        shell: powershell
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Execute Windows PowerShell 5.1 security helpers
        shell: powershell
        run: .\packages/app-core/platforms/electrobun/scripts/test-browser-bridge-windows-security.ps1
      - name: Compile and probe staged Windows native host
        shell: powershell
        run: .\packages/app-core/platforms/electrobun/scripts/test-browser-bridge-windows-native-host.ps1
      - name: Run browser broker security contracts
        id: contracts
        shell: powershell
        working-directory: packages/app-core/platforms/electrobun
        run: bunx vitest run --config vitest.electrobun.config.ts src/native/browser-bridge-broker-secret.test.ts src/native/browser-bridge-broker-server.test.ts src/native/browser-bridge-registration.test.ts src/native/browser-bridge-unregister.test.ts src/native/browser-bridge-windows-native-host-proof.test.ts
      - name: Diagnose broker test installation failure
        if: ${{ failure() && (steps.install.outcome == 'failure' || steps.contracts.outcome == 'failure') }}
        shell: powershell
        working-directory: packages/app-core/platforms/electrobun
        run: |
          Write-Output "Install outcome: ${{ steps.install.outcome }}; contracts outcome: ${{ steps.contracts.outcome }}"
          Get-Command node, bun | Select-Object Name, Source
          node --version
          bun --version
          $diagnostic = @'
          const fs = require("node:fs");
          const path = require("node:path");
          const packageJson = require.resolve("vitest/package.json");
          const packageRoot = path.dirname(packageJson);
          const cli = path.join(packageRoot, "dist", "cli.js");
          console.log(JSON.stringify({ runtime: process.version, executable: process.execPath, packageJson, version: JSON.parse(fs.readFileSync(packageJson, "utf8")).version, cli, cliExists: fs.existsSync(cli) }));
          if (fs.existsSync(cli)) {
            const source = fs.readFileSync(cli, "utf8");
            for (const match of source.matchAll(/['"](\.\/chunks\/[^'"]+)['"]/g)) {
              const chunk = path.resolve(path.dirname(cli), match[1]);
              console.log(JSON.stringify({ chunk, exists: fs.existsSync(chunk) }));
            }
          }
          '@
          $diagnostic | node --input-type=commonjs
