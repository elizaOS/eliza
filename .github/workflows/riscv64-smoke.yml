name: riscv64 cross-build smoke

# Explicit native cross-build and QEMU qualification; no physical hardware claim.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/os

concurrency:
  group: riscv64-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ELIZA_RISCV64_SMOKE: "1"
      ELIZAOS_ELIZA_ROOT: ${{ github.workspace }}/packages/os/.eliza-source
      # Keep the full shared-lib smoke on the same known-good linker as the
      # canonical AOSP/Cuttlefish build. Zig 0.14.x emits a non-PIC riscv64
      # compiler_rt archive and fails closed while linking libggml-base.so.
      ZIG_VERSION: "0.13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.15.0"

      - name: Resolve report path
        run: |
          report="$(node --input-type=module -e 'import { testOutputPath } from "../scripts/lib/test-output.ts"; console.log(testOutputPath("os-riscv64", "artifacts.json"));')"
          echo "RISCV_REPORT=$report" >> "$GITHUB_ENV"

      - name: Resolve pinned Eliza source
        id: eliza-source
        run: node scripts/read-eliza-source-lock.ts --github-output >> "$GITHUB_OUTPUT"

      - name: Checkout application native sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.eliza-source.outputs.repository }}
          ref: ${{ steps.eliza-source.outputs.commit }}
          path: packages/os/.eliza-source
          submodules: recursive

      - name: Install QEMU + base tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static binfmt-support \
            cmake build-essential file binutils python3 jq

      - name: Restore Zig toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/elizaos/zig-archives
          key: zig-archive-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}

      - name: Install pinned Zig
        run: scripts/provision-zig-linux-x64.sh "$ZIG_VERSION"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'packages/os/.eliza-source/bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Install workspace deps
        run: |
          (cd ../.. && bun install --frozen-lockfile --ignore-scripts)
          bun install --cwd .eliza-source --frozen-lockfile --ignore-scripts

      # Fingerprint the riscv64 build inputs from the git index (blob SHAs of
      # tracked native sources + submodule pins). Fast (no byte reads), and it
      # cannot self-pollute because build outputs land in gitignored build/
      # dirs that `git ls-files` never lists.
      - name: Compute riscv64 source fingerprint
        id: riscv64-fp
        run: |
          set -euo pipefail
          {
            git -C .eliza-source submodule status --recursive
            git -C .eliza-source ls-files -s \
              plugins/plugin-local-inference/native/plugins \
              packages/app/scripts/aosp/compile-libllama.ts
            git ls-files -s \
              scripts/build-riscv64-artifacts.sh \
              toolchains/cmake
          } | sha256sum | awk '{ print "hash=" $1 }' >> "$GITHUB_OUTPUT"

      # build-riscv64-artifacts.sh is idempotent via existence sentinels, but its
      # outputs never persist across runs. Restore them so an unchanged native
      # source tree replays from the sentinels instead of recompiling every
      # artifact (~30 min). EXACT-MATCH ONLY (no restore-keys): a stale prefix
      # restore would let should_build skip a needed rebuild and smoke a stale
      # artifact — a false green. A source/submodule change busts the key and
      # forces a full rebuild.
      - name: Cache riscv64 build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            packages/os/.eliza-source/plugins/plugin-local-inference/native/plugins/*/build/riscv64
            packages/os/.eliza-source/packages/app/platforms/android/app/src/main/assets/agent/riscv64
            ~/.cache/eliza-android-agent/seccomp-shim/riscv64
          key: riscv64-out-${{ runner.os }}-${{ steps.riscv64-fp.outputs.hash }}

      - name: Build every riscv64 artifact (linux only; android skipped)
        run: |
          bun run build:riscv64-artifacts --force

      - name: Print failed RISC-V build diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' log; do
            found=1
            echo "::group::$log"
            tail -n 250 "$log"
            echo "::endgroup::"
          done < <(
            find .eliza-source/plugins/plugin-local-inference/native .eliza-source/plugins/plugin-vision/native build \
              -type f -name '*.log' -print0 2>/dev/null
          )
          if [ "$found" -eq 0 ]; then
            echo "No RISC-V build logs were produced."
          fi

      - name: Upload RISC-V build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: riscv64-build-diagnostics
          path: |
            packages/os/.eliza-source/plugins/plugin-local-inference/native/*/build/*.log
            packages/os/.eliza-source/plugins/plugin-vision/native/*/build/*.log
            packages/os/.eliza-source/plugins/plugin-local-inference/native/*/build/**/*.log
            packages/os/.eliza-source/plugins/plugin-vision/native/*/build/**/*.log
            packages/os/build/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: QEMU smoke every riscv64 artifact
        run: |
          bun run check:riscv64-artifacts --require-complete --out "$RISCV_REPORT"

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: riscv64-artifacts-report
          path: ${{ env.RISCV_REPORT }}
          if-no-files-found: warn
          retention-days: 7

      - name: Print summary
        if: always()
        run: |
          if [ -f "$RISCV_REPORT" ]; then
            jq '.summary, .final_status' "$RISCV_REPORT"
          else
            echo "no report produced"
          fi
