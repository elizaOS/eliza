name: Headscale API Key Health

# The Headscale admin key expires independently of deploy cadence. Probe the
# daemon-local API from the control-plane host so an expired or rebuild-lost key
# turns the nightly red without copying the admin credential into GitHub Actions.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Control-plane environment to probe"
        type: choice
        default: staging
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: headscale-api-key-health-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  probe:
    name: Probe ${{ github.event.inputs.environment || 'staging' }} Headscale key
    runs-on: ubuntu-24.04
    environment: ${{ github.event.inputs.environment || 'staging' }}
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.ELIZA_PROVISIONING_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
    steps:
      - name: Check probe configuration
        run: |
          fail=0
          [ -n "$DEPLOY_HOST" ] || { echo "::error::missing secret ELIZA_PROVISIONING_HOST"; fail=1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::missing secret ELIZA_PROVISIONING_SSH_KEY"; fail=1; }
          [ "$fail" = 0 ] || exit 1

      - name: Probe daemon-local Headscale API
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: deploy
          key: ${{ env.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            ENV_FILE=/opt/eliza/cloud/.env.local
            RESPONSE_FILE=$(mktemp)
            trap 'rm -f "$RESPONSE_FILE"' EXIT

            read_env_value() {
              key="$1"
              line=$(sudo grep -m1 "^${key}=" "$ENV_FILE" || true)
              value="${line#*=}"
              if [ "${value#\"}" != "$value" ] && [ "${value%\"}" != "$value" ]; then
                value="${value#\"}"
                value="${value%\"}"
              fi
              printf '%s' "$value"
            }

            sudo test -r "$ENV_FILE" || {
              echo "::error::Headscale environment file is unreadable on the control-plane host"
              exit 1
            }

            HEADSCALE_API_URL=$(read_env_value HEADSCALE_API_URL)
            HEADSCALE_API_KEY=$(read_env_value HEADSCALE_API_KEY)
            [ -n "$HEADSCALE_API_URL" ] || {
              echo "::error::HEADSCALE_API_URL is missing from the control-plane environment"
              exit 1
            }
            [ -n "$HEADSCALE_API_KEY" ] || {
              echo "::error::HEADSCALE_API_KEY is missing from the control-plane environment"
              exit 1
            }

            endpoint="${HEADSCALE_API_URL%/}/api/v1/user"
            status=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
              --output "$RESPONSE_FILE" --write-out '%{http_code}' \
              --header "Authorization: Bearer $HEADSCALE_API_KEY" \
              "$endpoint") || {
                echo "::error::Headscale API probe could not reach the daemon-local endpoint"
                exit 1
              }

            case "$status" in
              200)
                node -e '
                  const fs = require("node:fs");
                  const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  if (!payload || !Array.isArray(payload.users)) process.exit(1);
                ' "$RESPONSE_FILE" || {
                  echo "::error::Headscale API returned HTTP 200 with an invalid user-list payload"
                  exit 1
                }
                echo "Headscale API key accepted by the daemon-local endpoint."
                ;;
              401|403)
                echo "::error::Headscale rejected the configured API key with HTTP $status; rotate it before provisioning fails"
                exit 1
                ;;
              *)
                echo "::error::Headscale API key probe returned unexpected HTTP $status"
                exit 1
                ;;
            esac

      - name: Inspect provisioning worker restart
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: deploy
          key: ${{ env.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            unit=eliza-provisioning-worker.service
            sudo systemctl is-active --quiet "$unit" || {
              echo "::error::Provisioning worker is not active"
              exit 1
            }
            sudo systemctl show "$unit" --no-pager \
              --property=ActiveState \
              --property=SubState \
              --property=Result \
              --property=NRestarts \
              --property=ExecMainCode \
              --property=ExecMainStatus \
              --property=ExecMainStartTimestamp \
              --property=ExecMainExitTimestamp \
              --property=ActiveEnterTimestamp \
              --property=MemoryCurrent \
              --property=MemoryPeak
            echo "Systemd manager events during the interrupted canary:"
            sudo journalctl -t systemd \
              --since "2026-07-24 04:09:20 UTC" \
              --until "2026-07-24 04:11:40 UTC" \
              --no-pager --output=short-iso-precise |
              grep -F "$unit" || echo "(no matching systemd manager event)"

      - name: Encrypt actor-bound provisioning log slice
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: deploy
          key: ${{ env.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            temp_dir="$(mktemp -d)"
            trap 'rm -rf "$temp_dir"' EXIT
            public_key="$temp_dir/public.pem"
            journal_file="$temp_dir/journal.log"
            matched_file="$temp_dir/matched.log"
            cat >"$public_key" <<'PEM'
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAkxjzt8ZcwLbsk9fvWfDp
            bXuPVS5o5WpsoP78NwEyD8aY3cm76Bzha/seCrghcBpaJA33a+gxLAL0ZHRj/8AD
            8GTm9aNsfxf5TBvXo+tZFLMDzQwgYplm7DxJ3X+RUN9I1luEhwkoMGFm9q0gJx4O
            OYeNf1X7zO1/gucgzsCN00MmT7+w/ZDbXn871/W/E3RdLBrb+eymsqGcEh+oiHxY
            0QiikXdNDJk3IMZ8wnpUTronWiCwJtHNIRcAqQCNlY5d9CaHczjhuvlWA1Oj9VBM
            r4rGSL+qTctzEXpT8urnWIMUEnU4tzqrwgiiLe4CMf6zevWo/bbcP4WKpJKVN+ez
            hkjjEUA6asrxQaIezHQ8eWDHFvR6qUDD43Pbiw8nsIm8+1Wse4UNcT0GHvrqnxNw
            W9GGq/zHynLnmr1qODZ0S4TJs78LZ8e0wzjGJbSsyRth5PCgNV/oKgZC/ImmHFsQ
            eON0B1dkZmwjpPyDnT6rCcg6QXwoDFPMQoL3pBeXhr9lpj8ZIjyMmj8iq8Eia62x
            bTd9IddrIEnvIpV1h1bxLrkSrndnyjIS2GED27hyLyBhHUfL+4H3X4/jCLbgVXu4
            C3hwGY5THu68n8rpijkzAJ7qW3tMZsyP7BvfAx2GQYX7PNkqh89/65X9JP3mbKFI
            bHwZPjE6iT9loZ2bxgSpu0cCAwEAAQ==
            -----END PUBLIC KEY-----
            PEM
            sudo journalctl -u eliza-provisioning-worker.service \
              --since "2026-07-24 03:56:00 UTC" \
              --until "2026-07-24 04:30:00 UTC" \
              --no-pager --output=short-iso-precise >"$journal_file"
            grep_status=0
            grep -E -B 2 -A 6 \
              -e "27273194-76bf-48ee-95f7-59c487afc129" \
              -e "889edf8a-b830-50ea-9e1b-ef40e0726578" \
              -e "747a415a-e1ac-4c32-a147-9ab8c5a69d99" \
              -e "node 2255" \
              -e "Backup created" \
              -e "Atomic swap" \
              -e "Fleet upgrade completed" \
              -e "replacement cleanup" \
              "$journal_file" >"$matched_file" || grep_status=$?
            case "$grep_status" in
              0) ;;
              1)
                echo "::error::Provisioning journal has no actor-bound canary record"
                exit 1
                ;;
              *)
                echo "::error::Provisioning journal actor-bound selection failed"
                exit 1
                ;;
            esac
            bytes="$(wc -c <"$matched_file" | tr -d ' ')"
            lines="$(wc -l <"$matched_file" | tr -d ' ')"
            printf 'actor_bound_log_bytes=%s\n' "$bytes"
            printf 'actor_bound_log_lines=%s\n' "$lines"
            [ "$bytes" -gt 0 ] || {
              echo "::error::Actor-bound provisioning log slice is empty"
              exit 1
            }
            [ "$bytes" -le 24000 ] || {
              echo "::error::Actor-bound provisioning log slice exceeds its encryption bound"
              exit 1
            }
            printf 'actor_bound_log_sha256=%s\n' \
              "$(sha256sum "$matched_file" | cut -d' ' -f1)"
            emit_count() {
              label="$1"
              pattern="$2"
              count="$(grep -Eic "$pattern" "$matched_file" || true)"
              printf '%s=%s\n' "$label" "$count"
            }
            emit_count headscale 'headscale|vpn registration|vpn ip|tunnel'
            emit_count runtime_readiness 'runtime readiness|health check|failed to become ready'
            emit_count image_pull 'pull|manifest|digest'
            emit_count cutover 'cutover|atomic audit'
            emit_count cleanup 'cleanup|retire|remove'
            emit_count timeout 'timeout|timed out|deadline'
            emit_count error 'error|failed|failure'
            split -b 300 -d -a 2 "$matched_file" "$temp_dir/chunk-"
            count=0
            for chunk in "$temp_dir"/chunk-*; do
              cipher_file="$temp_dir/cipher-$count.bin"
              openssl pkeyutl -encrypt -pubin -inkey "$public_key" \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -pkeyopt rsa_mgf1_md:sha256 \
                -in "$chunk" -out "$cipher_file"
              cipher_bytes="$(wc -c <"$cipher_file" | tr -d ' ')"
              [ "$cipher_bytes" -eq 512 ] || {
                echo "::error::Encrypted log chunk has an invalid RSA ciphertext size"
                exit 1
              }
              ciphertext="$(openssl base64 -A -in "$cipher_file")"
              [ "${#ciphertext}" -eq 684 ] || {
                echo "::error::Encrypted log chunk has an invalid base64 size"
                exit 1
              }
              printf 'actor_bound_log_ciphertext_%02d=%s\n' "$count" "$ciphertext"
              count=$((count + 1))
            done
            printf 'actor_bound_log_ciphertext_count=%s\n' "$count"

      - name: Read failed demo canary outcome
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' }}
        env:
          ELIZACLOUD_API_KEY: ${{ secrets.ELIZACLOUD_API_KEY }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          [ -n "$ELIZACLOUD_API_KEY" ] || {
            echo "::error::missing secret ELIZACLOUD_API_KEY"
            exit 1
          }
          echo "::add-mask::$ELIZACLOUD_API_KEY"

          status="$(
            curl --silent --show-error --connect-timeout 5 --max-time 20 \
              --output "$response_file" --write-out '%{http_code}' \
              --header "X-API-Key: $ELIZACLOUD_API_KEY" \
              "https://api.elizacloud.ai/api/v1/admin/agent-image-canary/jobs/27273194-76bf-48ee-95f7-59c487afc129"
          )"
          if [ "$status" != "200" ]; then
            echo "::error::Actor-bound canary job read returned HTTP $status"
            exit 1
          fi

          node - "$response_file" <<'NODE'
          const {
            constants,
            createHash,
            publicEncrypt,
          } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const diagnosticPublicKey = `-----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAkxjzt8ZcwLbsk9fvWfDp
          bXuPVS5o5WpsoP78NwEyD8aY3cm76Bzha/seCrghcBpaJA33a+gxLAL0ZHRj/8AD
          8GTm9aNsfxf5TBvXo+tZFLMDzQwgYplm7DxJ3X+RUN9I1luEhwkoMGFm9q0gJx4O
          OYeNf1X7zO1/gucgzsCN00MmT7+w/ZDbXn871/W/E3RdLBrb+eymsqGcEh+oiHxY
          0QiikXdNDJk3IMZ8wnpUTronWiCwJtHNIRcAqQCNlY5d9CaHczjhuvlWA1Oj9VBM
          r4rGSL+qTctzEXpT8urnWIMUEnU4tzqrwgiiLe4CMf6zevWo/bbcP4WKpJKVN+ez
          hkjjEUA6asrxQaIezHQ8eWDHFvR6qUDD43Pbiw8nsIm8+1Wse4UNcT0GHvrqnxNw
          W9GGq/zHynLnmr1qODZ0S4TJs78LZ8e0wzjGJbSsyRth5PCgNV/oKgZC/ImmHFsQ
          eON0B1dkZmwjpPyDnT6rCcg6QXwoDFPMQoL3pBeXhr9lpj8ZIjyMmj8iq8Eia62x
          bTd9IddrIEnvIpV1h1bxLrkSrndnyjIS2GED27hyLyBhHUfL+4H3X4/jCLbgVXu4
          C3hwGY5THu68n8rpijkzAJ7qW3tMZsyP7BvfAx2GQYX7PNkqh89/65X9JP3mbKFI
          bHwZPjE6iT9loZ2bxgSpu0cCAwEAAQ==
          -----END PUBLIC KEY-----`;
          const raw = readFileSync(process.argv[2], "utf8");
          const secret = process.env.ELIZACLOUD_API_KEY;
          if (!secret || raw.includes(secret)) {
            console.error("::error::Canary response failed the credential-leak guard.");
            process.exit(1);
          }

          let payload;
          try {
            payload = JSON.parse(raw);
          } catch {
            console.error("::error::Canary job endpoint returned invalid JSON.");
            process.exit(1);
          }

          const job = payload?.data;
          if (!job || job.id !== "27273194-76bf-48ee-95f7-59c487afc129") {
            console.error("::error::Canary job endpoint returned the wrong job.");
            process.exit(1);
          }

          const classify = (value) => {
            if (value == null) return null;
            if (typeof value !== "string") {
              console.error("::error::Canary error field has an invalid type.");
              process.exit(1);
            }
            const lower = value.toLowerCase();
            const signalPatterns = {
              authentication: ["unauthorized", "forbidden", "credential", "api key", "token"],
              billing: ["billing"],
              capacity: ["capacity", "reserve"],
              container: ["container", "docker", "sandbox", "image pull"],
              cutover: ["cutover", "atomic audit", "digest mismatch", "source image changed"],
              headscale_registration: ["headscale", "vpn registration", "vpn ip", "tunnel"],
              image_policy: ["image allow", "repository", "digest", "image pair"],
              network: ["network", "connection", "fetch failed", "econn", "dns"],
              post_cutover_cleanup: [
                "post-cutover",
                "post cutover",
                "cleanup remains pending",
                "replacement cleanup",
              ],
              pre_cutover_cleanup: [
                "pre-cutover",
                "pre cutover",
                "candidate retirement",
                "retire candidate",
              ],
              runtime_readiness: [
                "runtime readiness",
                "runtime ready",
                "health check",
                "healthcheck",
                "failed to become ready",
                "not healthy",
              ],
              snapshot: ["snapshot", "backup", "restore"],
              timeout: ["timeout", "timed out", "deadline"],
            };
            return {
              bytes: Buffer.byteLength(value, "utf8"),
              sha256: createHash("sha256").update(value).digest("hex"),
              signals: Object.entries(signalPatterns)
                .filter(([, patterns]) => patterns.some((pattern) => lower.includes(pattern)))
                .map(([signal]) => signal),
            };
          };

          const optionalBoolean = (value, field) => {
            if (value == null || typeof value === "boolean") return value ?? null;
            console.error(`::error::Canary ${field} field has an invalid type.`);
            process.exit(1);
          };
          const optionalTimestamp = (value, field) => {
            if (value == null) return null;
            if (typeof value !== "string" || !Number.isFinite(Date.parse(value))) {
              console.error(`::error::Canary ${field} field is not a timestamp.`);
              process.exit(1);
            }
            return new Date(value).toISOString();
          };

          if (job.status !== "failed") {
            console.error("::error::Canary job is not in the expected failed terminal state.");
            process.exit(1);
          }
          if (!Number.isSafeInteger(job.attempts) || job.attempts < 0) {
            console.error("::error::Canary attempts field is invalid.");
            process.exit(1);
          }
          if (job.result != null && (typeof job.result !== "object" || Array.isArray(job.result))) {
            console.error("::error::Canary result field has an invalid type.");
            process.exit(1);
          }
          const operation = job.result?.operation ?? null;
          if (operation !== null && operation !== "upgrade" && operation !== "rollback") {
            console.error("::error::Canary operation field is invalid.");
            process.exit(1);
          }

          const projection = {
            id: job.id,
            status: job.status,
            errorFingerprint: classify(job.error),
            resultSuccess: optionalBoolean(job.result?.success, "result success"),
            cleanupPending: optionalBoolean(job.result?.cleanupPending, "cleanup pending"),
            operation,
            resultErrorFingerprint: classify(job.result?.error),
            attempts: job.attempts,
            createdAt: optionalTimestamp(job.createdAt, "createdAt"),
            updatedAt: optionalTimestamp(job.updatedAt, "updatedAt"),
            completedAt: optionalTimestamp(job.completedAt, "completedAt"),
          };
          process.stdout.write(
            `Privacy-safe actor-bound canary outcome: ${JSON.stringify(projection)}\n`,
          );

          const confidential = Buffer.from(
            JSON.stringify({
              id: job.id,
              error: job.error ?? null,
              resultError: job.result?.error ?? null,
            }),
            "utf8",
          );
          if (confidential.byteLength > 400) {
            console.error("::error::Canary error envelope exceeds the one-time encryption bound.");
            process.exit(1);
          }
          const ciphertext = publicEncrypt(
            {
              key: diagnosticPublicKey,
              oaepHash: "sha256",
              padding: constants.RSA_PKCS1_OAEP_PADDING,
            },
            confidential,
          ).toString("base64");
          process.stdout.write(
            `Encrypted actor-bound canary outcome (RSA-OAEP-SHA256): ${ciphertext}\n`,
          );
          NODE
