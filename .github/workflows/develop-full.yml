name: Develop Full
run-name: Validate ${{ github.ref_name }} ${{ inputs.source_sha || github.sha }} ${{ inputs.effect_digest || 'push' }}
on:
  push:
    branches:
      - develop
      - staging
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact promoted staging commit
        required: true
        type: string
      effect_digest:
        description: Durable staging validation effect digest
        required: true
        type: string
concurrency:
  group: promotion-full-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  plan:
    if: ${{ github.event_name == 'push' || (contains(fromJSON('["develop","staging","main"]'), github.ref_name) && inputs.source_sha == github.sha && inputs.effect_digest != '') }}
    name: Exact-input impact plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.baseline.outputs.base_sha }}
      run_canonical: ${{ steps.resolve.outputs.run_canonical }}
      run_cloud: ${{ steps.resolve.outputs.run_cloud }}
      run_ui_core: ${{ steps.resolve.outputs.run_ui_core }}
    steps:
      - name: Validate promoted dispatch authority
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EFFECT_DIGEST: ${{ inputs.effect_digest }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == develop || "$GITHUB_REF_NAME" == staging || "$GITHUB_REF_NAME" == main ]]
          [ "$SOURCE_SHA" = "$GITHUB_SHA" ]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EFFECT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
      - name: Reject unresolved merge-conflict markers
        run: |
          set -euo pipefail
          status=0
          git grep -n -E '^(<{7}|>{7})( |$)' -- . || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Unresolved git merge-conflict marker(s) in the tracked files listed above. Finish or abort the merge before landing."
            exit 1
          elif [ "$status" -gt 1 ]; then
            echo "::error::merge-conflict marker scan failed (git grep exit $status)"
            exit 1
          fi
          echo "No unresolved merge-conflict markers in tracked files."
      - name: Check source whitespace
        run: git show --format= --check HEAD
      - name: Install pinned workflow linters
        run: packages/scripts/github/install-workflow-linters.sh "$RUNNER_TEMP/workflow-linters"
      - name: Validate workflow graph before fan-out
        run: '"$RUNNER_TEMP/workflow-linters/actionlint" -config-file .github/actionlint.yaml'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - name: Resolve last successfully validated ancestor
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = push ]; then
            if gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/develop-full.yml/runs" \
              -f "branch=$GITHUB_REF_NAME" -f status=success -f per_page=100 \
              --jq '.workflow_runs[].head_sha' > "$RUNNER_TEMP/validated-ancestors"; then
              while IFS= read -r candidate; do
                if [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"; then
                  base="$candidate"
                  break
                fi
              done < "$RUNNER_TEMP/validated-ancestors"
            else
              echo "::warning::Validation history unavailable; running full validation."
            fi
          fi
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - name: Compute exact input closures
        id: impact
        env:
          BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node packages/scripts/develop-impact-evidence.ts plan --base "$BASE_SHA" --head "$HEAD_SHA" --expected .develop-evidence/expected.json --github-output "$GITHUB_OUTPUT"
      - name: Select current-run validation
        id: resolve
        run: node packages/scripts/develop-impact-evidence.ts resolve --expected .develop-evidence/expected.json --evidence .develop-evidence/current --github-output "$GITHUB_OUTPUT"
  canonical:
    needs: plan
    if: needs.plan.outputs.run_canonical == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      base_sha: ${{ needs.plan.outputs.base_sha }}
    secrets: inherit
  cloud:
    needs: plan
    if: needs.plan.outputs.run_cloud == 'true'
    uses: ./.github/workflows/cloud-tests.yml
    with:
      base_sha: ${{ needs.plan.outputs.base_sha }}
      source_checks_in_canonical_ci: true
    secrets: inherit
  ui-core:
    needs: plan
    if: needs.plan.outputs.run_ui_core == 'true'
    uses: ./.github/workflows/ui-e2e-gate.yml
    with:
      base_sha: ${{ needs.plan.outputs.base_sha }}
      publish_bun_install_cache: ${{ needs.plan.outputs.run_canonical != 'true' }}
      concurrency_scope: promotion-full-${{ github.ref_name }}
    secrets: inherit
  complete:
    name: Complete manifest
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    needs:
      - plan
      - canonical
      - cloud
      - ui-core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SURFACE_RESULTS: '{"canonical":"${{ needs.canonical.result }}","cloud":"${{ needs.cloud.result }}","ui-core":"${{ needs.ui-core.result }}"}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - name: Preserve validation results
        if: ${{ always() && !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from "node:fs";
          mkdirSync(".develop-evidence", { recursive: true });
          writeFileSync(".develop-evidence/results.json", JSON.stringify({
            headSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            results: JSON.parse(process.env.SURFACE_RESULTS),
          }, null, 2) + "\n");
          JS
      - name: Recompute expected manifest
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node packages/scripts/develop-impact-evidence.ts plan --base "$BASE_SHA" --head "$HEAD_SHA" --expected .develop-evidence/expected.json
      - name: Require one current green row per surface
        run: node packages/scripts/develop-impact-evidence.ts record --expected .develop-evidence/expected.json --evidence .develop-evidence/current --observed .develop-evidence/observed.json --results-env SURFACE_RESULTS
      - name: Upload exact manifest evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: develop-full-manifest-${{ github.sha }}
          path: |
            .develop-evidence/expected.json
            .develop-evidence/observed.json
            .develop-evidence/results.json
          if-no-files-found: error
          retention-days: 14
  handoff-effects:
    name: Hand off exact green SHA for durable reconciliation
    needs: complete
    if: ${{ needs.complete.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch non-cancelable effect reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/develop-reconcile.yml/dispatches" \
              -f "ref=$GITHUB_REF_NAME" \
              -F return_run_details=true \
              -f "inputs[source_sha]=$SOURCE_SHA" \
              -f "inputs[source_run_id]=$SOURCE_RUN_ID"
          )"
          reconcile_run_id="$(jq -er '.workflow_run_id | select(type == "number" and . > 0)' <<< "$response")"
          echo "Handed $SOURCE_SHA to reconciliation run $reconcile_run_id"
