name: Production Admin Agent Image Canary

# Temporary branch-contained diagnostic for the terminal pre-cutover canary.
# It uses the repository-scoped canary credential for one actor-bound GET and
# never enters the protected production deployment environment.
on:
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    name: Read failed canary job diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANARY_JOB_ID: 771bc989-3244-41d7-bb03-c9ff565be8c6
      EXPECTED_REF: refs/heads/codex/canary-job-diagnostic-30183809168
    steps:
      - name: Require the exact contained diagnostic branch
        env:
          SOURCE_ACTOR: ${{ github.actor }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_ACTOR" != "NubsCarson" ]; then
            echo "::error::Diagnostic refused for an unexpected actor."
            exit 1
          fi
          if [ "$SOURCE_REF" != "$EXPECTED_REF" ]; then
            echo "::error::Diagnostic refused outside its exact contained branch."
            exit 1
          fi
          if [[ ! "$CANARY_JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "::error::Diagnostic job ID is invalid."
            exit 1
          fi

      - name: Read and sanitize the terminal canary failure
        env:
          ELIZACLOUD_API_KEY: ${{ secrets.ELIZACLOUD_API_KEY }}
        run: |
          set -euo pipefail
          response="$(mktemp "$RUNNER_TEMP/canary-job-response.XXXXXX")"
          sanitized="$(mktemp "$RUNNER_TEMP/canary-job-error.XXXXXX")"
          trap 'unlink "$response" 2>/dev/null || true; unlink "$sanitized" 2>/dev/null || true' EXIT
          chmod 600 "$response" "$sanitized"

          http_code="$(
            curl --silent --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$response" \
              --write-out '%{http_code}' \
              --header "X-API-Key: $ELIZACLOUD_API_KEY" \
              "https://api.elizacloud.ai/api/v1/admin/agent-image-canary/jobs/$CANARY_JOB_ID"
          )"
          if [ "$http_code" != "200" ]; then
            echo "::error::Actor-bound diagnostic GET failed with HTTP $http_code."
            exit 1
          fi
          if grep --fixed-strings --quiet "$ELIZACLOUD_API_KEY" "$response"; then
            echo "::error::Diagnostic response contained the Cloud credential."
            exit 1
          fi
          jq --exit-status '
            .success == true and
            .data.id == env.CANARY_JOB_ID and
            .data.type == "agent_admin_canary_image" and
            .data.status == "failed" and
            (.data.error | type == "string" and length > 0)
          ' "$response" >/dev/null

          jq --raw-output '.data.error' "$response" |
            tr '\r\n' '  ' |
            LC_ALL=C tr -cd '\40-\176' |
            sed -E \
              -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/<uuid>/g' \
              -e 's/sha256:[0-9a-f]{64}/sha256:<digest>/g' \
              -e 's#https?://[^[:space:]]+#<url>#g' \
              -e 's/[0-9a-f]{16,}/<hex>/g' \
              -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ipv4>/g' \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g' \
              -e 's/[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/<jwt>/g' \
              -e 's/(api[_-]?key|token|password|secret)[=:][^[:space:]]+/\1=<redacted>/Ig' \
              -e 's/[A-Za-z0-9+/_=-]{32,}/<opaque>/g' \
              -e 's/[<>&`]/_/g' \
              > "$sanitized"
          truncate --size=1200 "$sanitized"

          if [ ! -s "$sanitized" ]; then
            echo "::error::Sanitized diagnostic is empty."
            exit 1
          fi
          {
            echo "### Terminal canary diagnosis"
            echo
            echo '```text'
            cat "$sanitized"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'CANARY_DIAGNOSTIC=%s\n' "$(cat "$sanitized")"
