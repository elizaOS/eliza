name: Build Android

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Upload APK/AAB to latest GitHub release"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: packages/app
  ANDROID_DIR: packages/app-core/platforms/android
  NODE_VERSION: "24.15.0"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  build-android:
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # The elizavoice-jni gradle build validates that the staged
      # libelizainference.so's fused-voice ABI matches the omnivoice FFI header
      # in the llama.cpp fork submodule. That submodule is not checked out by
      # the default checkout, so init just that one path (shallow) rather than
      # pulling every submodule (opencode/electrobun aren't needed here).
      - name: Check out llama.cpp omnivoice headers
        run: |
          git submodule update --init --depth 1 \
            plugins/plugin-local-inference/native/llama.cpp
          test -f plugins/plugin-local-inference/native/llama.cpp/tools/omnivoice/include/eliza-inference-ffi.h \
            || { echo "::error::omnivoice FFI header still missing after submodule init"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: canary

      - name: Setup JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/app-core/platforms/android/**/*.gradle*', 'packages/app-core/platforms/android/gradle/wrapper/gradle-wrapper.properties', 'packages/app/capacitor.config.ts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      # The APK requires the fused inference lib: the :app:copyForkLlamaLib
      # gradle task hard-errors when arm64-v8a has neither a configured lib dir
      # nor a pre-staged jniLibs set — which is why this workflow was red on
      # every bare CI runner (#15540). Pull the newest green artifact from
      # build-llama-ffi-android (the canonical cross-compile of
      # libelizainference.so) and point the gradle task at it via
      # ELIZA_MTP_ANDROID_LIBDIR.
      - name: Resolve latest green libelizainference build
        id: ffi_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build-llama-ffi-android.yml --branch develop \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful build-llama-ffi-android run on develop — cannot stage libelizainference.so. Fix that workflow first (#15540)."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using libelizainference artifacts from run $run_id"

      - name: Download fused inference lib (arm64-v8a)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: libelizainference-android-arm64-vulkan-fused
          run-id: ${{ steps.ffi_run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ffi-libs/android-arm64-vulkan-fused

      - name: Stage fused inference lib for gradle
        run: |
          libdir="$GITHUB_WORKSPACE/ffi-libs/android-arm64-vulkan-fused/arm64-v8a"
          if [ ! -f "$libdir/libelizainference.so" ]; then
            echo "::error::Downloaded artifact lacks arm64-v8a/libelizainference.so (layout changed?)"
            find "$GITHUB_WORKSPACE/ffi-libs" -maxdepth 3 -type f | head -20
            exit 1
          fi
          echo "ELIZA_MTP_ANDROID_LIBDIR=$libdir" >> "$GITHUB_ENV"
          ls -la "$libdir"

      - name: Prepare Android platform
        working-directory: ${{ env.APP_DIR }}
        run: bun run build:android

      - name: Run Android developer-install preflight
        working-directory: ${{ env.APP_DIR }}
        run: bun run preflight:android:sideload

      - name: Override Gradle JDK path for CI
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          # Remove the hardcoded local JDK path so Gradle uses JAVA_HOME from setup-java
          sed -i '/org.gradle.java.home=/d' gradle.properties

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Compute versionCode from semver (major*10000 + minor*100 + patch)
          IFS='.-' read -r major minor patch _ <<< "$VERSION"
          VERSION_CODE=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          ELIZAOS_VERSION_NAME: ${{ steps.version.outputs.version }}
          ELIZAOS_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK & AAB
        if: github.event_name == 'release'
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          ELIZAOS_VERSION_NAME: ${{ steps.version.outputs.version }}
          ELIZAOS_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew assembleRelease --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Sign release APK
        if: github.event_name == 'release' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks

          UNSIGNED_APK="${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/eliza-${{ steps.version.outputs.version }}.apk"

          ${ANDROID_HOME}/build-tools/35.0.0/apksigner sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          rm /tmp/keystore.jks

      - name: Generate Android checksums
        if: github.event_name == 'release'
        run: |
          find "${{ env.ANDROID_DIR }}/app/build/outputs" \
            \( -name "*.apk" -o -name "*.aab" \) -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > "${{ env.ANDROID_DIR }}/app/build/outputs/SHA256SUMS.txt"
          cat "${{ env.ANDROID_DIR }}/app/build/outputs/SHA256SUMS.txt"

      - name: Upload debug APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eliza-android-debug
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eliza-android-release
          path: |
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.ANDROID_DIR }}/app/build/outputs/bundle/release/*.aab
            ${{ env.ANDROID_DIR }}/app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release)
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          files: |
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.ANDROID_DIR }}/app/build/outputs/bundle/release/*.aab
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.ANDROID_DIR }}/app/build/outputs/SHA256SUMS.txt
          fail_on_unmatched_files: false
