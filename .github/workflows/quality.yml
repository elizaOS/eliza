name: Quality (Extended)

# Additional quality gates layered on top of `ci.yml`. These are the
# eliza-derived checks that have no equivalent job in the canonical
# eliza CI: the consolidated web build (including homepage source) and a workspace-level
# typecheck/biome format gate.

on:
  workflow_call:
  workflow_dispatch:

# Develop Full owns cancellation of superseded tips. Manual runs stay isolated
# so an on-demand health read is not parked behind the develop queue.
concurrency:
  group: quality-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  consolidated-frontend-build:
    name: Consolidated Frontend Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Check consolidated frontend scope
        id: frontend-scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "${{ github.base_ref }}"
          if merge_base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"; then
            changed_files="$(git diff --name-only "${merge_base}" HEAD)"
          else
            echo "No merge base found with origin/${{ github.base_ref }}; falling back to direct base/head diff." >&2
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)"
          fi
          if grep -Eq '^(packages/homepage/|packages/shared/|packages/app/|packages/app-core/scripts/write-homepage-release-data\.mjs|\.github/workflows/(cloud-cf-deploy|release-electrobun|release-orchestrator)\.yml)' <<< "${changed_files}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip unrelated frontend build
        if: steps.frontend-scope.outputs.run != 'true'
        run: echo "Skipping consolidated frontend build; this PR does not touch its source or release surfaces."

      - name: Validate homepage source contracts
        if: steps.frontend-scope.outputs.run == 'true'
        working-directory: packages/homepage
        run: bun run typecheck && bun run lint:check && bun run test && bun run check:snapshot-inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The install above uses --ignore-scripts, so no workspace dist exists.
      # packages/app/vite.config.ts imports ../shared/src/runtime-env.ts, whose
      # barrels re-export from @elizaos/core, and Vite bundles the config with
      # esbuild under default export conditions -- it cannot see core's
      # eliza-source condition, so it needs core's real dist. cloud-cf-deploy.yml
      # builds core the same way before the same build:web.
      - name: Build linked elizaOS core workspace once
        if: steps.frontend-scope.outputs.run == 'true'
        run: bun run build:core

      - name: Build the only deployable frontend
        if: steps.frontend-scope.outputs.run == 'true'
        working-directory: packages/app
        run: bun run build:web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  comment-only-diff:
    name: Comment-only diff guard
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'comment-cleanup')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          setup-python: "false"
          install-protoc: "false"
          run-postinstall: "false"

      - name: Run comment-only guard self-test
        run: node scripts/assert-comment-only-diff.mjs --self-test

      - name: Check comment-only diff
        run: bun run check:comment-only origin/${{ github.base_ref }}

  format-check:
    name: Format
    # This short required gate should not spend its entire budget bootstrapping
    # or recovering an unhealthy general-fleet runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          # Biome only needs JS dependencies; skipping Python/protoc keeps this
          # 5-minute format gate away from apt mirrors and Rust build tooling.
          setup-python: "false"
          install-protoc: "false"
          run-postinstall: "false"

      - name: Run CLAUDE/AGENTS guide parity self-test
        run: node --test scripts/assert-agents-claude-identical.test.mjs

      - name: Run CLAUDE/AGENTS guide parity
        run: bun run check:agents-claude

      # The type-duplication finder is advisory (it never fails the build); only
      # its AST classifier is gated here so the candidate-report tooling stays
      # honest. The full scan + `--check` drift report is run on demand /
      # periodically, not on the hot path (#10195, #10201).
      - name: Run type-duplication finder self-test
        run: bun run audit:type-duplication:self-test

      - name: Run biome format check
        run: bun run format:check

  # Develop-gate extension (#10104): keep the prompt-secret scan and
  # UI-determinism gate explicit on the integrated branch.
  develop-static-gate:
    name: Develop Gate (secret scan + UI determinism)
    # Keep the required security/determinism checks independent of fleet
    # bootstrap stalls and runner-internal setup failures.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          clean: true

      - name: Enforce runner workspace hygiene
        run: |
          # Self-hosted runners reuse the _work checkout across workflows. Jobs
          # that check out submodules (nightly, build-android, publish-packages,
          # voice-live-e2e, ...) leave populated submodule trees behind, and
          # actions/checkout with `submodules: false` does not remove them.
          # Their vendored files can leak into later repo-wide commands unless
          # the reused checkout is cleaned explicitly.
          git submodule deinit -f --all >/dev/null
          git clean -ffdx --quiet
          status_output=$(git status --porcelain)
          if [ -n "$status_output" ]; then
            echo "::error::Runner workspace contaminated: git status is not clean after submodule deinit + clean. This is a stale-runner-workspace problem, not a branch regression."
            echo "$status_output"
            exit 1
          fi
          populated=$(git submodule status | grep -cv '^-' || true)
          if [ "$populated" != "0" ]; then
            echo "::error::Runner workspace contaminated: $populated submodule(s) still populated in a submodules:false job."
            git submodule status
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          # Both gates are static AST/text scans over source — no Python/protoc,
          # Rust, or postinstall artifacts needed (same lean install as the
          # format gate above).
          setup-python: "false"
          install-protoc: "false"
          run-postinstall: "false"

      - name: Prompt secret scan
        run: cd packages/prompts && bun run check:secrets

      # Self-test asserts the AST classifier before the gate relies on it.
      - name: UI determinism self-test
        run: bun run audit:ui-determinism:self-test

      - name: UI determinism gate
        run: bun run audit:ui-determinism

      # Develop PRs do not run the canonical `ci.yaml` main-branch quality job,
      # so keep the anti-larp gates enforced here too.
      - name: Anti-larp test gate self-test
        run: bun run audit:focused-tests:self-test

      - name: Anti-larp test gate
        run: bun run audit:focused-tests

  # `bun run lint:check` is intentionally separate from the static scans above: the
  # Turbo lint task depends on selected package builds, so it needs the normal
  # build-enabled workspace setup rather than the lean no-postinstall path.
  develop-lint-gate:
    name: Develop Gate (lint)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          # Full history so `turbo run lint:check --affected` can resolve the PR's
          # merge base (#12341); on a shallow clone turbo safely degrades to
          # linting the whole graph.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # PR lane: lint only the packages in the merge base's dependency cone; on
      # push/merge_group lint the whole graph (exhaustive + turbo cache seeding).
      # Turbo re-derives per-task hashes, so affected scoping never under-lints a
      # genuinely changed package (#12341).
      - name: Run lint check (affected — PR)
        if: github.event_name == 'pull_request'
        run: node packages/scripts/run-turbo.mjs run lint:check --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

      - name: Run lint check (full — push/merge_group)
        if: github.event_name != 'pull_request'
        run: bun run lint:check
