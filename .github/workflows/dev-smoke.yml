name: Dev Smoke
on:
  workflow_call:
    inputs:
      concurrency_scope:
        description: Caller-owned concurrency namespace
        required: false
        type: string
        default: standalone
  workflow_dispatch: null
concurrency:
  group: dev-smoke-${{ inputs.concurrency_scope || 'standalone' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
env:
  CI: "true"
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24.15.0
  NODE_NO_WARNINGS: "1"
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY }}
  ELIZA_VAULT_PASSPHRASE: dev-smoke-headless-vault-only
jobs:
  dev-smoke:
    name: default staging + local onboarding
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 35
    env:
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Free disk space for browser smoke
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true
          df -h /
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          cache-bun-install: "false"
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          setup-python: "false"
          install-protoc: "false"
      - name: Install Playwright Chromium
        run: .github/scripts/install-playwright-browsers.sh chromium
      - name: Generate shared i18n assets
        run: bun run --cwd packages/shared build:i18n
      - name: Build @elizaos/core browser bundle
        run: bunx turbo run build --filter=@elizaos/core --filter=@elizaos/shared
      - name: Run default staging dev smoke
        run: bun run --cwd packages/app test:dev-smoke
      - name: Run explicit local onboarding smoke
        run: bun run --cwd packages/app test:dev-smoke:local
      - name: Upload dev-smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dev-smoke-results
          path: |
            packages/app/playwright-report/
            packages/app/test-results/
          if-no-files-found: ignore
  hmr:
    name: Vite HMR dependency-level smoke
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 35
    env:
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - name: Free disk space for browser smoke
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true
          df -h /
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          cache-bun-install: "false"
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          setup-python: "false"
          install-protoc: "false"
      - name: Install Playwright Chromium
        run: .github/scripts/install-playwright-browsers.sh chromium
      - name: Generate shared i18n assets
        run: bun run --cwd packages/shared build:i18n
      - name: Build @elizaos/core browser bundle
        run: bunx turbo run build --filter=@elizaos/core --filter=@elizaos/shared
      - name: Run Vite HMR dependency-level smoke
        run: bun run test:hmr
      - name: Upload HMR artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hmr-results
          path: |
            packages/app/playwright-report/
            packages/app/test-results/hmr/
          if-no-files-found: ignore
