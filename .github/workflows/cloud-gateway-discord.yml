name: Cloud Gateway Discord

# CI for the gateway-discord service. The current Railway services are uploaded
# explicitly and have no connected repository source, so this workflow validates
# source and protected configuration but does not claim or perform a deployment.
#
# AWS EKS / Terraform / Helm deploy jobs were removed as part of the AWS
# retirement (see packages/cloud/infra/cloud/AWS_RETIREMENT.md).

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: cloud-gateway-discord-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/cloud/shared

env:
  BUN_VERSION: "1.3.14"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  trusted-config:
    name: Trusted configuration
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root dependencies
        run: bun install --frozen-lockfile --no-save && git diff --exit-code -- bun.lock

      - name: Enforce trusted messaging gateway configuration
        run: bun run preflight:messaging-gateways:strict -- --channels=shared,telegram,discord
        env:
          ELIZACLOUD_API_URL: ${{ secrets.ELIZACLOUD_API_URL }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ELIZA_APP_WEBHOOK_GATEWAY_URL: ${{ vars.ELIZA_APP_WEBHOOK_GATEWAY_URL }}
          ELIZA_APP_WEBHOOK_GATEWAY_SECRET: ${{ secrets.ELIZA_APP_WEBHOOK_GATEWAY_SECRET }}
          GATEWAY_INTERNAL_SECRET: ${{ secrets.GATEWAY_INTERNAL_SECRET }}
          ELIZA_APP_TELEGRAM_BOT_TOKEN: ${{ secrets.ELIZA_APP_TELEGRAM_BOT_TOKEN }}
          ELIZA_APP_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.ELIZA_APP_TELEGRAM_WEBHOOK_SECRET }}
          ELIZA_APP_DISCORD_APPLICATION_ID: ${{ secrets.ELIZA_APP_DISCORD_APPLICATION_ID }}
          ELIZA_APP_DISCORD_CLIENT_SECRET: ${{ secrets.ELIZA_APP_DISCORD_CLIENT_SECRET }}
          ELIZA_APP_DISCORD_BOT_TOKEN: ${{ secrets.ELIZA_APP_DISCORD_BOT_TOKEN }}

  test:
    name: Test
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root dependencies
        run: bun install --frozen-lockfile --no-save && git diff --exit-code -- bun.lock

      - name: Generate source keyword modules
        working-directory: .
        run: bun run --cwd packages/shared build:i18n

      - name: Run service tests
        working-directory: packages/cloud/services/gateway-discord
        # The gateway imports source-form workspace subpaths such as
        # @elizaos/shared/discord-dm-policy. Match the package-owned test
        # script's export condition so a clean runner never falls through to
        # an unbuilt dist/ entry.
        run: bun --conditions=eliza-source test tests/ --timeout 60000
        env:
          SKIP_SERVER_CHECK: "true"

      - name: Run lib tests
        # These tests traverse plugin/runtime source exports as part of the
        # routing contract, so they need the same clean-runner source condition.
        run: bun --conditions=eliza-source test src/lib/services/gateway-discord/__tests__ --timeout 60000
        env:
          SKIP_SERVER_CHECK: "true"
