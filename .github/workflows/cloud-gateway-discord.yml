name: Cloud Gateway Discord

# CI for the gateway-discord service. The service is deployed to Railway
# (see packages/cloud/services/gateway-discord/railway.toml); Railway auto-
# deploys on push to the watched branch, so this workflow only runs tests
# and a build sanity check.
#
# AWS EKS / Terraform / Helm deploy jobs were removed as part of the AWS
# retirement (see packages/cloud/infra/cloud/AWS_RETIREMENT.md).

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/cloud/services/gateway-discord/**"
      - "packages/cloud/shared/src/lib/services/gateway-discord/**"
      - "packages/cloud/shared/src/lib/auth/jwks.ts"
      - "packages/cloud/shared/src/lib/auth/jwt-internal.ts"
      - "packages/cloud/shared/src/lib/auth/internal-api.ts"
      - "packages/cloud/shared/scripts/messaging-gateway-preflight.mjs"
      - "packages/cloud/api/v1/discord/**"
      - "packages/cloud/api/internal/discord/**"
      - "packages/cloud/api/internal/auth/**"
      - "packages/cloud/api/.well-known/jwks.json/**"
      - "packages/cloud/shared/src/db/**/discord-connections.ts"
      - ".github/workflows/cloud-gateway-discord.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/cloud/services/gateway-discord/**"
      - "packages/cloud/shared/src/lib/services/gateway-discord/**"
      - "packages/cloud/shared/src/lib/auth/jwks.ts"
      - "packages/cloud/shared/src/lib/auth/jwt-internal.ts"
      - "packages/cloud/shared/src/lib/auth/internal-api.ts"
      - "packages/cloud/shared/scripts/messaging-gateway-preflight.mjs"
      - "packages/cloud/api/v1/discord/**"
      - "packages/cloud/api/internal/discord/**"
      - "packages/cloud/api/internal/auth/**"
      - "packages/cloud/api/.well-known/jwks.json/**"
      - "packages/cloud/shared/src/db/**/discord-connections.ts"
      - ".github/workflows/cloud-gateway-discord.yml"

concurrency:
  group: cloud-gateway-discord-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/cloud/shared

env:
  BUN_VERSION: "1.3.14"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Use the repository setup boundary so dependency downloads get its
      # isolated cache and bounded retry. A bare bun install here previously
      # failed the whole gateway lane on one ffmpeg-static ECONNRESET.
      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          install-command: bun install --frozen-lockfile --no-save --ignore-scripts

      - name: Verify dependency install preserved the lockfile
        working-directory: .
        run: git diff --exit-code -- bun.lock

      - name: Run fork-safe messaging gateway preflight
        if: github.event_name == 'pull_request'
        # Pull requests from forks cannot read repository configuration. Fixed
        # non-secret sentinels exercise the strict parser and channel contract
        # without turning missing fork credentials into a guaranteed red lane.
        run: bun run preflight:messaging-gateways:strict -- --channels=shared,telegram,discord
        env:
          ELIZACLOUD_API_URL: https://api.example.invalid
          CEREBRAS_API_KEY: ci-contract-value
          ELIZA_APP_WEBHOOK_GATEWAY_URL: https://gateway.example.invalid
          ELIZA_APP_WEBHOOK_GATEWAY_SECRET: ci-contract-value
          ELIZA_APP_TELEGRAM_BOT_TOKEN: ci-contract-value
          ELIZA_APP_TELEGRAM_WEBHOOK_SECRET: ci-contract-value
          ELIZA_APP_DISCORD_APPLICATION_ID: ci-contract-value
          ELIZA_APP_DISCORD_CLIENT_SECRET: ci-contract-value
          ELIZA_APP_DISCORD_BOT_TOKEN: ci-contract-value

      - name: Enforce trusted messaging gateway configuration
        if: github.event_name != 'pull_request'
        # Trusted branch runs enforce the repository's real deployment
        # configuration. The gateway URL is a repository variable in the
        # canonical Cloudflare deploy workflow; credentials remain secrets.
        run: bun run preflight:messaging-gateways:strict -- --channels=shared,telegram,discord
        env:
          ELIZACLOUD_API_URL: ${{ secrets.ELIZACLOUD_API_URL }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ELIZA_APP_WEBHOOK_GATEWAY_URL: ${{ vars.ELIZA_APP_WEBHOOK_GATEWAY_URL }}
          ELIZA_APP_WEBHOOK_GATEWAY_SECRET: ${{ secrets.ELIZA_APP_WEBHOOK_GATEWAY_SECRET }}
          ELIZA_APP_TELEGRAM_BOT_TOKEN: ${{ secrets.ELIZA_APP_TELEGRAM_BOT_TOKEN }}
          ELIZA_APP_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.ELIZA_APP_TELEGRAM_WEBHOOK_SECRET }}
          ELIZA_APP_DISCORD_APPLICATION_ID: ${{ secrets.ELIZA_APP_DISCORD_APPLICATION_ID }}
          ELIZA_APP_DISCORD_CLIENT_SECRET: ${{ secrets.ELIZA_APP_DISCORD_CLIENT_SECRET }}
          ELIZA_APP_DISCORD_BOT_TOKEN: ${{ secrets.ELIZA_APP_DISCORD_BOT_TOKEN }}

      - name: Run service tests
        working-directory: packages/cloud/services/gateway-discord
        run: bun test tests/ --timeout 60000
        env:
          SKIP_SERVER_CHECK: "true"

      - name: Run lib tests
        run: bun test src/lib/services/gateway-discord/__tests__ --timeout 60000
        env:
          SKIP_SERVER_CHECK: "true"
