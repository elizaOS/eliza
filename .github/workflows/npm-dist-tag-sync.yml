# Reconciles the npm `latest` dist-tag for prerelease-only cohort packages
# whose `latest` drifted onto an abandoned prerelease line (see
# packages/scripts/sync-latest-dist-tags.mjs for the exact policy). Manual
# and read-only by default: applying requires the explicit apply input.
name: NPM Dist-Tag Sync

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Actually retag (false = dry-run report only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-dist-tag-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Reconcile latest dist-tags
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install semver for the sync script
        run: npm install --no-save semver@7

      - name: Reconcile latest dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ inputs.apply && secrets.NPM_TOKEN || '' }}
        run: >-
          node packages/scripts/sync-latest-dist-tags.mjs
          ${{ inputs.apply && '--apply' || '' }}
