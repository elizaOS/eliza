name: Deterministic Model Provider E2E

# Issue #8801 — zero-cost E2E sweep. Routes connector model calls through the
# deterministic in-process model provider and recorded fixtures, and runs
# the corpus on EVERY pull request with NO API keys and NO secrets.
#
# `createDeterministicModelPlugin` in `@elizaos/core/testing` registers explicit,
# fixture-driven text and embedding handlers. The external API mocks in
# packages/scenario-runner/test/mocks serve recorded provider fixtures. The suites exercise
# both with zero credentials, so it is required-but-fast and never gated on a
# secret — every provider key below is explicitly blanked to prove the loops
# stay green without one.
#
# The required PR gate in `.github/workflows/test.yml` owns core provider tests
# plus the first adoption proofs. This lane owns the remaining connector proofs
# so the same command is not run twice on PRs.

on:
  # Reusable entry for the scheduled exhaustive develop lane (#12342).
  workflow_call:
    inputs:
      concurrency_scope:
        description: "Caller-owned concurrency namespace"
        required: false
        type: string
        default: standalone
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

# A reusable caller's scope separates it from the standalone ref domain. PRs
# still supersede obsolete work; exhaustive work always completes.
concurrency:
  group: keyless-model-provider-e2e-${{ inputs.concurrency_scope || 'standalone' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "canary"
  NODE_VERSION: "24"
  NODE_OPTIONS: "--max-old-space-size=4096"
  # Keyless guarantee: the deterministic runtime must pass with every provider
  # credential absent. Blanking them here proves the model calls never reach
  # a live provider.
  ELIZA_LIVE_TEST: "0"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GROQ_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GOOGLE_GENERATIVE_AI_API_KEY: ""
  XAI_API_KEY: ""
  NVIDIA_API_KEY: ""
  CEREBRAS_API_KEY: ""
  ELIZAOS_CLOUD_API_KEY: ""

jobs:
  model-provider-runtime:
    name: Deterministic model-provider connector loops (no secret)
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --ignore-scripts --no-frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Ensure generated shared i18n data
        run: node packages/app-core/scripts/ensure-shared-i18n-data.mjs

      - name: Remaining per-plugin deterministic model-provider runtime adoption proofs
        run: |
          bun run --cwd plugins/plugin-openai test:real-runtime
          bun run --cwd plugins/plugin-google-genai test:real-runtime
          bun run --cwd plugins/plugin-telegram test:real-runtime
