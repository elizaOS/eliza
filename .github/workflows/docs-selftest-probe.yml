name: docs-selftest-probe
on:
  push:
    branches: [codex/ci-docs-selftest-probe]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          job: docs-probe
          cache-verification: "false"
      - run: pnpm selftest:docs
