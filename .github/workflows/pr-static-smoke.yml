# Pull-request and merge-queue source validation plus the canonical full E2E suite.
name: PR Static Smoke

on:
  pull_request:
    branches: [develop, staging, main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: pr-static-smoke-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  source-smoke:
    name: Source validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false

      - name: Resolve and validate candidate diff
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"
          git merge-tree --write-tree "$BASE_SHA" "$HEAD_SHA" >/dev/null
          git diff --check "$merge_base"..."$HEAD_SHA"

          status=0
          git grep -n -E '^(<{7}|>{7})( |$)' "$HEAD_SHA" -- . || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Candidate source contains unresolved merge-conflict markers."
            exit 1
          fi
          if [ "$status" -gt 1 ]; then
            echo "::error::Merge-conflict marker scan failed with exit $status."
            exit 1
          fi

          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Install pinned workflow linters
        shell: bash
        run: packages/scripts/github/install-workflow-linters.sh "$RUNNER_TEMP/workflow-linters"

      - name: Lint changed workflows
        shell: bash
        env:
          MERGE_BASE: ${{ steps.diff.outputs.merge_base }}
          HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
        run: |
          set -euo pipefail
          workflows=()
          while IFS= read -r -d '' file; do
            workflows+=("$file")
          done < <(git diff --diff-filter=ACMRT --name-only -z "$MERGE_BASE"..."$HEAD_SHA" -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "No workflow definitions changed."
            exit 0
          fi
          "$RUNNER_TEMP/workflow-linters/actionlint" \
            -config-file .github/actionlint.yaml \
            "${workflows[@]}"

      - uses: ./.github/actions/setup-bun-workspace
        with:
          publish-bun-install-cache: "true"
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          run-postinstall: "false"
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Apply required dependency compatibility patches
        run: |
          bun packages/scripts/patch-punycode-deprecation.mjs
          bun packages/scripts/patch-llama-cpp-capacitor.mjs
          bun packages/scripts/patch-electrobun-linux-cef-profile.mjs

      - name: Validate CI Bun version pin contract
        run: node packages/scripts/ci-bun-version-contract.mjs --inventory "$RUNNER_TEMP/bun-runtime-inventory.json"

      - name: Upload Bun runtime resolution inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-runtime-inventory
          path: ${{ runner.temp }}/bun-runtime-inventory.json
          retention-days: 30
          if-no-files-found: error

      - name: Resolve broad core bootstrap
        id: core_scope
        env:
          MERGE_BASE: ${{ steps.diff.outputs.merge_base }}
        run: |
          if [[ -f packages/scripts/pr-core-build-scope.mjs ]]; then
            node packages/scripts/pr-core-build-scope.mjs "$MERGE_BASE" "$GITHUB_OUTPUT"
          else
            echo "Candidate predates scoped bootstrap; retaining the full core build."
            echo "core_bootstrap_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build core contract
        if: steps.core_scope.outputs.core_bootstrap_required == 'true'
        run: bun run build:core

      - name: Build affected workspace closure
        env:
          TURBO_SCM_BASE: ${{ steps.diff.outputs.merge_base }}
        run: node packages/scripts/run-turbo.mjs run build --concurrency=4 --affected --output-logs=errors-only

      - name: Lint affected workspace closure
        env:
          TURBO_SCM_BASE: ${{ steps.diff.outputs.merge_base }}
        run: node packages/scripts/run-turbo.mjs run lint:check --concurrency=4 --affected

      - name: Typecheck affected workspace closure
        env:
          TURBO_SCM_BASE: ${{ steps.diff.outputs.merge_base }}
        run: node packages/scripts/run-turbo.mjs run typecheck --concurrency=4 --affected

  e2e:
    uses: ./.github/workflows/e2e.yml

  static-smoke:
    name: All Tests Passed
    if: ${{ always() && !cancelled() }}
    needs: [source-smoke, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every admission lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'length > 0 and all(.[]; .result == "success")'
