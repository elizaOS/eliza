# This workflow is the sole pull-request and merge-candidate validation authority.
# It checks mergeability, changed secrets and workflow syntax, then builds and
# statically validates the affected workspace closure. A narrow, mock-backed
# billing replay E2E runs when its contract surface changes; provider, device,
# deployment, and destructive-effect lanes remain excluded.
name: PR Static Smoke

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: pr-static-smoke-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  NODE_NO_WARNINGS: "1"
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  source-smoke:
    name: Source static smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false

      - name: Resolve and validate candidate diff
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"
          git merge-tree --write-tree "$BASE_SHA" "$HEAD_SHA" >/dev/null
          git diff --check "$merge_base"..."$HEAD_SHA"

          status=0
          git grep -n -E '^(<{7}|>{7})( |$)' "$HEAD_SHA" -- . || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Candidate source contains unresolved merge-conflict markers."
            exit 1
          fi
          if [ "$status" -gt 1 ]; then
            echo "::error::Merge-conflict marker scan failed with exit $status."
            exit 1
          fi

          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          ./.github/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan candidate commits for secrets
        shell: bash
        env:
          MERGE_BASE: ${{ steps.diff.outputs.merge_base }}
          HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
        run: >-
          gitleaks detect
          --config .gitleaks.toml
          --source .
          --redact
          --no-banner
          --log-opts "${MERGE_BASE}..${HEAD_SHA}"

      - name: Install pinned workflow linters
        shell: bash
        run: .github/scripts/install-workflow-linters.sh "$RUNNER_TEMP/workflow-linters"

      - name: Lint changed workflows
        shell: bash
        env:
          MERGE_BASE: ${{ steps.diff.outputs.merge_base }}
          HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
        run: |
          set -euo pipefail
          workflows=()
          while IFS= read -r -d '' file; do
            workflows+=("$file")
          done < <(git diff --diff-filter=ACMRT --name-only -z "$MERGE_BASE"..."$HEAD_SHA" -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "No workflow definitions changed."
            exit 0
          fi
          "$RUNNER_TEMP/workflow-linters/actionlint" \
            -config-file .github/actionlint.yaml \
            "${workflows[@]}"

      - uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          setup-python: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Validate CI Bun version pin contract
        run: node packages/scripts/ci-bun-version-contract.mjs --inventory "$RUNNER_TEMP/bun-runtime-inventory.json"

      - name: Upload Bun runtime resolution inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-runtime-inventory
          path: ${{ runner.temp }}/bun-runtime-inventory.json
          retention-days: 30
          if-no-files-found: error

      - name: Build core contract
        run: bun run build:core

      - name: Lint affected workspace closure
        env:
          TURBO_SCM_BASE: ${{ steps.diff.outputs.merge_base }}
        run: node packages/scripts/run-turbo.mjs run lint:check --concurrency=4 --affected

      - name: Typecheck affected workspace closure
        env:
          TURBO_SCM_BASE: ${{ steps.diff.outputs.merge_base }}
        run: node packages/scripts/run-turbo.mjs run typecheck --concurrency=4 --affected

      - name: Build affected workspace closure
        env:
          TURBO_SCM_BASE: ${{ steps.diff.outputs.merge_base }}
        run: node packages/scripts/run-turbo.mjs run build --concurrency=4 --affected --output-logs=errors-only

  billing-payment-replay-e2e:
    name: Billing payment replay E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: test
      CLOUD_E2E: "1"
      MOCK_REDIS: "1"
      MOCK_HETZNER_LATENCY: "0"
      MOCK_HETZNER_ACTION_MS: "30"
      CONTROL_PLANE_TICK_MS: "50"
      DATABASE_URL: pglite://./.eliza-ci/.pgdata
      HCLOUD_TOKEN: test-token
      CONTAINER_CONTROL_PLANE_TOKEN: test-token
      CRON_SECRET: test-cron-secret
      # These are the workspace entry points actually executed by the keyless
      # stack. Detection below walks their runtime workspace dependencies, so a
      # shared/core/logger/plugin change cannot silently skip the replay proof.
      # packages/app carries a large native/desktop-only dependency graph, so
      # its browser source and app-core aliases stay explicit path inputs below.
      BILLING_REPLAY_WORKSPACE_SEEDS: >-
        packages/cloud/api
        packages/cloud/e2e
        packages/cloud/shared
        packages/ui
      BILLING_REPLAY_PATH_INPUTS: >-
        packages/cloud
        packages/app
        packages/app-core
        packages/scripts
        package.json
        bun.lock
        bunfig.toml
        turbo.json
        tsconfig.json
        tsconfig.base.json
        .github/actions/cloud-setup-test-env
        .github/scripts/install-playwright-browsers.sh
        .github/develop-surface-graph.json
        .github/workflows/develop-full.yml
        .github/workflows/pr-static-smoke.yml
        .github/workflows/cloud-tests.yml
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Detect billing replay contract changes
        id: billing-diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { appendFileSync } from "node:fs";
          import { listPackages } from "./packages/scripts/lib/workspaces.mjs";

          function requiredEnv(name) {
            const value = process.env[name]?.trim();
            if (!value) throw new Error(`Missing required environment variable: ${name}`);
            return value;
          }

          function git(args, allowedStatuses) {
            const result = spawnSync("git", args, { encoding: "utf8" });
            if (result.error) throw result.error;
            if (result.signal) throw new Error(`git ${args[0]} received ${result.signal}`);
            if (!allowedStatuses.includes(result.status)) {
              throw new Error(
                `git ${args[0]} exited ${result.status}: ${result.stderr.trim()}`,
              );
            }
            return result;
          }

          const baseSha = requiredEnv("BASE_SHA");
          const headSha = requiredEnv("HEAD_SHA");
          const mergeBase = git(["merge-base", baseSha, headSha], [0]).stdout.trim();
          if (!mergeBase) throw new Error("git merge-base returned no commit");

          const workspaces = listPackages();
          const byName = new Map(
            workspaces
              .filter(({ name }) => typeof name === "string" && name.length > 0)
              .map((workspace) => [workspace.name, workspace]),
          );
          const seedDirs = new Set(
            requiredEnv("BILLING_REPLAY_WORKSPACE_SEEDS").split(/\s+/),
          );
          const seeds = workspaces.filter(({ dir }) => seedDirs.has(dir));
          const resolvedSeedDirs = new Set(seeds.map(({ dir }) => dir));
          const missingSeeds = [...seedDirs].filter((dir) => !resolvedSeedDirs.has(dir));
          if (missingSeeds.length > 0) {
            throw new Error(`Unknown Billing replay workspace seed(s): ${missingSeeds.join(", ")}`);
          }

          const closureDirs = new Set();
          const pending = seeds.map(({ name }) => name);
          while (pending.length > 0) {
            const name = pending.pop();
            if (!name) continue;
            const workspace = byName.get(name);
            if (!workspace || closureDirs.has(workspace.dir)) continue;
            closureDirs.add(workspace.dir);
            const manifest = workspace.packageJson;
            for (const dependency of Object.keys({
              ...manifest.dependencies,
              ...manifest.optionalDependencies,
              ...manifest.peerDependencies,
            })) {
              if (byName.has(dependency)) pending.push(dependency);
            }
          }

          const pathspecs = [
            ...closureDirs,
            ...requiredEnv("BILLING_REPLAY_PATH_INPUTS").split(/\s+/),
          ].sort();
          const diff = git(
            ["diff", "--quiet", `${mergeBase}...${headSha}`, "--", ...pathspecs],
            [0, 1],
          );
          appendFileSync(requiredEnv("GITHUB_OUTPUT"), `run=${diff.status === 1}\n`);
          NODE
      - if: steps.billing-diff.outputs.run == 'true'
        uses: ./.github/actions/cloud-setup-test-env
      - name: Install Playwright browsers
        if: steps.billing-diff.outputs.run == 'true'
        run: .github/scripts/install-playwright-browsers.sh chromium
      - name: Run billing payment replay spec
        if: steps.billing-diff.outputs.run == 'true'
        run: >-
          bun run cloud:e2e --
          '(^|/)billing-payment-replay\.spec\.ts$'
      - name: Upload Playwright evidence
        if: failure() && steps.billing-diff.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: billing-payment-replay-e2e-${{ github.run_attempt }}
          path: |
            packages/cloud/e2e/test-results
            packages/cloud/e2e/.logs
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  browser-bridge-windows-security:
    name: Browser bridge Windows security
    uses: ./.github/workflows/browser-bridge-windows-security.yml

  static-smoke:
    name: All Tests Passed
    if: always()
    needs: [source-smoke, browser-bridge-windows-security, billing-payment-replay-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every admission lane
        env:
          RESULTS: >-
            source-smoke=${{ needs.source-smoke.result }}
            browser-bridge-windows-security=${{ needs.browser-bridge-windows-security.result }}
            billing-payment-replay-e2e=${{ needs.billing-payment-replay-e2e.result }}
        run: |
          set -euo pipefail
          for pair in $RESULTS; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "::error title=PR admission::$name finished with $result"
              exit 1
            fi
          done
