name: Snap Build & Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: snap-build-${{ github.ref }}
  cancel-in-progress: true

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  build-snap:
    name: Build Snap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Free disk space on runner
        # Snapcraft multipass + bun install of every workspace dependency
        # inside the sandbox consistently exhausts the default 14GB GHA
        # runner disk, producing `System.IO.IOException: No space left on
        # device` halfway through the build. Reclaim ~30GB up front by
        # dropping unused toolchains.
        run: |
          set -euo pipefail
          echo "=== before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== after ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Skip submodules entirely. The snap build uses the committed lock
          # with `bun install --frozen-lockfile --ignore-scripts` and
          # `SKIP_NATIVE_PLUGINS=1`, so it never reads from any of the
          # repo's git submodules (plugin-local-inference/native/llama.cpp,
          # vendor/opencode).
          # Fetching them only risks "not our ref" failures when upstream
          # branches are force-pushed and the pinned SHA is no longer
          # reachable on the remote. The runtime closure under plugins/*/src
          # ships from the main repo tree and is unaffected.
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.50.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare snapcraft.yaml
        run: |
          set -euo pipefail
          mkdir -p snap
          cp packages/app-core/packaging/snap/snapcraft.yaml snap/snapcraft.yaml

          VERSION="$(node -p 'require("./package.json").version')"
          test -n "$VERSION"
          sed -i "s/^version: .*/version: '${VERSION}'/" snap/snapcraft.yaml
          echo "Building snap version: $VERSION"

      - name: Normalize runner root ownership for snapd
        run: |
          set -euo pipefail
          ROOT_OWNER="$(stat -c '%u:%g' /)"
          echo "Runner root owner: ${ROOT_OWNER}"
          if [ "${ROOT_OWNER}" = "0:0" ]; then
            echo "Root is already 0:0 — snapd canonicalization OK"
            exit 0
          fi
          echo "Attempting to repair / ownership so snapd/systemd path canonicalization accepts this runner"
          if sudo -n chown root:root / 2>/dev/null; then
            echo "Chown succeeded; new owner: $(stat -c '%u:%g' /)"
          else
            echo "::warning::Unable to chown / to root:root (sudo unavailable or passwordless sudo disabled). snapd may fail downstream. Remediation: run this job on a standard ubuntu-latest / ubuntu-24.04 GitHub-hosted runner, or configure the container image so / is owned by 0:0."
          fi

      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79
        id: snapcraft
        with:
          path: .
          build-info: true
          # Snapcraft exposes immutable revisions only through the Snap Store,
          # not this action. Pin the major track and record the resolved
          # revision/version below so every artifact remains auditable.
          snapcraft-channel: "8.x/stable"

      - name: Verify snap contents
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
          EVIDENCE_DIR: snap-evidence/${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -n "$SNAP_PATH"
          test -f "$SNAP_PATH"
          mkdir -p "$EVIDENCE_DIR"
          echo "=== Snap file ==="
          ls -lh "$SNAP_PATH"
          SNAP_SHA256="$(sha256sum "$SNAP_PATH" | awk '{ print $1 }')"
          printf '%s  %s\n' "$SNAP_SHA256" "$(basename "$SNAP_PATH")" | tee "$EVIDENCE_DIR/SHA256SUMS"

          echo "=== Snap info ==="
          if snap info "$SNAP_PATH" >"$EVIDENCE_DIR/snap-info.stdout" 2>"$EVIDENCE_DIR/snap-info.stderr"; then
            cat "$EVIDENCE_DIR/snap-info.stdout"
          else
            cat "$EVIDENCE_DIR/snap-info.stderr" >&2
            unsquashfs -l "$SNAP_PATH" | tee "$EVIDENCE_DIR/squashfs-files.txt" | sed -n '1,50p'
          fi

      - name: Install and test snap
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EVIDENCE_DIR: snap-evidence/${{ matrix.arch }}/installed
        run: |
          set -euo pipefail
          test -n "$SNAP_PATH"
          test -f "$SNAP_PATH"
          EXPECTED_VERSION="$(node -p 'require("./package.json").version')"
          test -n "$EXPECTED_VERSION"
          export EXPECTED_VERSION
          bash packages/app-core/packaging/snap/test-installed-snap.sh

      - name: Record builder and base provenance
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
          EVIDENCE_DIR: snap-evidence/${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -f "$SNAP_PATH"
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'snapcraft_action=%s\n' 'snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79'
            printf 'snapcraft_channel=%s\n' '8.x/stable'
            printf 'snapcraft_base=%s\n' 'core22'
            snap version
            snapcraft version
            snap list snapcraft
            snap list core22
          } | tee "$EVIDENCE_DIR/build-provenance.txt"
          unsquashfs -cat "$SNAP_PATH" meta/snap.yaml >"$EVIDENCE_DIR/installed-snap.yaml"
          unsquashfs -cat "$SNAP_PATH" snap/snapcraft.yaml >"$EVIDENCE_DIR/build-snapcraft.yaml"
          unsquashfs -cat "$SNAP_PATH" snap/manifest.yaml >"$EVIDENCE_DIR/build-manifest.yaml"

      - name: Extract snap filesystem for SBOM
        id: sbom-root
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        run: |
          set -euo pipefail
          test -f "$SNAP_PATH"
          SBOM_ROOT="$(mktemp -d "$RUNNER_TEMP/eliza-snap-sbom-${{ matrix.arch }}.XXXXXX")"
          unsquashfs -d "$SBOM_ROOT" "$SNAP_PATH" >/dev/null
          test -f "$SBOM_ROOT/meta/snap.yaml"
          test -f "$SBOM_ROOT/snap/manifest.yaml"
          echo "path=$SBOM_ROOT" >> "$GITHUB_OUTPUT"

      - name: Generate Snap SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ steps.sbom-root.outputs.path }}
          format: spdx-json
          output-file: snap-evidence/${{ matrix.arch }}/elizaos-app-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Snap build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ steps.snapcraft.outputs.snap }}

      - name: Upload snap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snap-${{ matrix.arch }}
          path: |
            ${{ steps.snapcraft.outputs.snap }}
            snap-evidence/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Snap diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snap-${{ matrix.arch }}-failure-diagnostics
          path: snap-evidence/${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 30
