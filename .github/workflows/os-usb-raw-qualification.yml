name: OS USB raw-writer qualification

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/os
    shell: bash

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sector-size: [512, 4096]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.15.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - name: Install VM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          test -r /dev/kvm && test -w /dev/kvm
      - name: Resolve output and bundle the actual signed-image pipeline
        env:
          SECTOR_BYTES: ${{ matrix.sector-size }}
        run: |
          output="$(bun -e 'import { testOutputPath } from "../scripts/lib/test-output.ts"; console.log(testOutputPath("os-usb-raw", process.env.SECTOR_BYTES));')"
          echo "RAW_EVIDENCE=$output" >> "$GITHUB_ENV"
          bun build --target=node --format=esm usb-installer/native/qualify-raw-pipeline.ts \
            --outfile "$RUNNER_TEMP/qualify-raw-pipeline.mjs"
      - name: Download pinned VM base
        run: |
          curl --fail --location --retry 3 --max-time 300 \
            https://cloud.debian.org/images/cloud/trixie/20260914-2601/debian-13-generic-amd64-20260914-2601.qcow2 \
            -o "$RUNNER_TEMP/raw-writer-base.qcow2"
      - name: Qualify write, flush, and expanded-byte readback on disposable VM disks
        env:
          SECTOR_BYTES: ${{ matrix.sector-size }}
        run: |
          python3 usb-installer/native/qualify-raw-writer-vm.py \
            --base-image "$RUNNER_TEMP/raw-writer-base.qcow2" \
            --node "$(command -v node)" \
            --pipeline-bundle "$RUNNER_TEMP/qualify-raw-pipeline.mjs" \
            --output-dir "$RAW_EVIDENCE" --sector-size "$SECTOR_BYTES"
      - name: Retain VM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: usb-raw-writer-${{ matrix.sector-size }}
          path: |
            ${{ env.RAW_EVIDENCE }}/*.json
            ${{ env.RAW_EVIDENCE }}/*.log
            ${{ env.RAW_EVIDENCE }}/evidence/*.json
            ${{ env.RAW_EVIDENCE }}/evidence/*.log
          if-no-files-found: warn
