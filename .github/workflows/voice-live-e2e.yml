name: Voice Live E2E

# Provisioned REAL voice lane. The keyless PR lanes stub voice entirely
# (silent-WAV TTS, shimmed STT transcript), so live service coverage and native
# component compatibility evidence live in this model-heavy nightly /
# workflow_dispatch lane. Product-runtime ASR proof additionally requires the
# Gemma release-authority job below to pass.
#
# What it proves (no mocks at any stage):
#   - Live Railway voice contract: the free-cloud Kokoro TTS + Whisper STT
#     services (packages/cloud/services/voice-*) satisfy the exact request shapes
#     the cloud-api voice routes send, so a dead/drifted service is a red run.
#   - Pre-Gemma fused ASR compatibility: the provisioned libelizainference +
#     retired compatibility bundle transcribes real speech at the FFI boundary.
#     This is explicitly not product-runtime ASR evidence.
#   - Real fused Kokoro TTS: the provisioned libelizainference loads the
#     published Kokoro GGUF + voice .bin and synthesizes audible PCM.
#   - Optional mixed round-trip: when cloud voice/LLM keys are present, real
#     generated speech flows through fused local ASR, a live cloud LLM, and
#     live cloud TTS.
#
# The acoustic attribution matrix runs with pinned GGUFs and a fused
# libelizainference build. Its scripts run in require-real mode so a missing
# model/ABI/credential is a hard failure rather than green skip evidence.
#
# SELF-PROVISIONING (closes the #9454 ops gap, #16945): no runner needs
# hand-staged voice assets anymore. The `voice-fused-build` job compiles the
# fused libelizainference (CPU variant, GGML_CPU always on) from the in-repo
# llama.cpp fork on a GitHub-hosted runner — cached by fork commit, so it is a
# cache restore on most nights — and hands it to the self-hosted jobs as an
# artifact, guaranteeing the lib ABI matches the checked-out bindings. Each
# self-hosted job then stages the pinned eliza-1-2b voice bundle regions from
# Hugging Face (sha256-verified, cached in the host's
# ~/.eliza/local-inference/models/eliza-1-2b.bundle across nights) via
# .github/actions/stage-voice-real-assets. Any [self-hosted, Linux, X64,
# eliza] runner can take these jobs; VOICE_LIVE_RUNNER_LABELS (JSON array of
# labels) remains the single point of runner override, e.g. to move to a GPU
# box — the fused lib is CPU-built either way, so GPU is a speedup, never a
# requirement. nvcc/nvidia-smi/ffmpeg are NOT required by any step.
#
# Keyless by design (#9577): the owner/impostor/agent turns are synthesized
# with distinct fused Kokoro voice packs, so ELEVENLABS_API_KEY is optional —
# it only upgrades the human-turn rows to real ElevenLabs voices (CEREBRAS +
# ELEVENLABS together also unlock the mixed cloud round-trip step).
#
# Kokoro TTFA budget: the smoke's 700 ms default is the MOBILE product budget.
# These CPU-only CI hosts prove loadability + intelligibility (envelope-cv +
# round-trip WER), not mobile latency, so the workflow sets
# KOKORO_SMOKE_TTFA_BUDGET_MS=30000 — a desktop-CPU ceiling that still catches
# loader hangs (measured TTFA ≈4.5–8 s on a 24-core host).
#
# History note (#16945): the 2026-07-17..19 scheduled runs were CANCELLED, not
# failed — no online runner carried the `eliza` label during the fleet
# migration, so both self-hosted jobs sat queued until either the next night's
# run replaced them through this workflow's cancel-in-progress concurrency
# group (07-17 run, killed at 07-18 09:06:30 = the 07-18 start) or GitHub's
# 24 h queue limit expired them (07-19 run, killed exactly 24 h after queue).
# A cancelled scheduled run therefore means "no eliza-labelled runner online"
# — that is a fleet-capacity page, not a workflow bug. The 07-20..22 reds were
# the provisioning preflight hard-failing on unprovisioned robots; the
# self-provisioning above removes that failure class entirely.
#
# Runs nightly (offset from app-live-e2e) + on-demand; never on pull_request.

on:
  schedule:
    # 08:30 UTC daily — after app-live-e2e (07:00) settles, to avoid runner
    # contention on the shared GPU host.
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      run_railway_contract:
        description: "Run the Railway Kokoro/Whisper live contract lane"
        required: false
        default: true
        type: boolean
      run_web_live_railway:
        description: "Run the provisioned browser mic→agent→audio Railway lane"
        required: false
        default: false
        type: boolean
      run_macos_electrobun:
        description: "Attempt the macOS Electrobun live-voice matrix lane"
        required: false
        default: false
        type: boolean
      run_windows_electrobun:
        description: "Attempt the Windows Electrobun live-voice matrix lane"
        required: false
        default: false
        type: boolean
      run_ios:
        description: "Attempt the iOS simulator/device live-voice matrix lane"
        required: false
        default: false
        type: boolean
      run_android:
        description: "Attempt the Android device/emulator live-voice matrix lane"
        required: false
        default: false
        type: boolean

concurrency:
  group: voice-live-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "24.15.0"
  BUN_VERSION: "1.3.14"
  NODE_OPTIONS: "--experimental-sqlite"
jobs:
  # Product truth boundary (#17477): the native component smokes below still
  # exercise retired pre-Gemma assets directly through bun:ffi. They remain
  # useful ABI compatibility evidence, but the workflow must be red until the
  # active release publishes an immutable Gemma model/projector pair that the
  # product runtime can accept. This job never falls back to an older release.
  voice-product-asr-release:
    name: Product runtime Gemma ASR release authority
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Require immutable Gemma ASR model and projector
        run: bun packages/scripts/verify-voice-product-asr-release.mjs --github-annotations

  voice-platform-matrix-index:
    name: Canonical voice matrix index
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Emit matrix probe report
        run: |
          set -euo pipefail
          bun run voice:matrix -- --out "$RUNNER_TEMP/voice-platform-matrix"

      - name: Upload matrix probe report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voice-platform-matrix-index
          path: ${{ runner.temp }}/voice-platform-matrix
          if-no-files-found: error

  # Live contract against the two Railway voice services (Kokoro TTS + Whisper
  # STT). It runs the in-repo round-trip test (voice-kokoro-whisper-live.test.ts,
  # which was referenced by zero workflows) so a dead or drifted service pages as
  # a red run instead of a silent user report. Hits public HTTPS only, so it runs
  # on a cheap GitHub-hosted runner — no GPU/self-hosted staging. The service URLs
  # come from repo variables set at deploy time (see the two service READMEs under
  # packages/cloud/services/voice-*); the test falls back to its own defaults when
  # they are unset, so the lane still exercises the provisioned instances.
  voice-railway-contract:
    name: Railway Kokoro/Whisper live contract
    if: ${{ github.event_name == 'schedule' || inputs.run_railway_contract }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELIZA_VOICE_LIVE_RAILWAY: "1"
      KOKORO_TTS_URL: ${{ vars.ELIZA_VOICE_KOKORO_TTS_URL }}
      WHISPER_STT_URL: ${{ vars.ELIZA_VOICE_WHISPER_STT_URL }}
      WHISPER_STT_MODEL: ${{ vars.ELIZA_VOICE_WHISPER_STT_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run live Railway voice contract
        run: |
          set -euo pipefail
          bun test packages/cloud/api/__tests__/voice-kokoro-whisper-live.test.ts

  # The service contract above does not exercise the shipped browser surface.
  # This separately gated job runs the exact live matrix cell from #16937 only
  # when a runner has been provisioned with Railway voice endpoints and a real
  # model credential. The schedule stays opt-in through the repository variable
  # so an unprovisioned nightly cannot turn into a misleading red run.
  voice-web-live-railway:
    name: Web Railway live mic → agent → audible TTS
    if: ${{ (github.event_name == 'schedule' && vars.ELIZA_VOICE_WEB_LIVE_READY == '1') || (github.event_name == 'workflow_dispatch' && inputs.run_web_live_railway) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_RECORD: "1"
      ELIZA_UI_SMOKE_LIVE_STACK: "1"
      ELIZA_VOICE_LIVE_RAILWAY: "1"
      ELIZA_PROVIDER: "cerebras"
      KOKORO_TTS_URL: ${{ vars.ELIZA_VOICE_KOKORO_TTS_URL }}
      WHISPER_STT_URL: ${{ vars.ELIZA_VOICE_WHISPER_STT_URL }}
      WHISPER_STT_MODEL: ${{ vars.ELIZA_VOICE_WHISPER_STT_MODEL }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZACLOUD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false

      - name: Free disk space for browser recording
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true
          df -h /

      - name: Require live model and Cloud credentials
        run: |
          set -euo pipefail
          if [ -z "${CEREBRAS_API_KEY:-}" ]; then
            echo "::error::The web Railway voice lane requires the provisioned CEREBRAS_API_KEY live model credential."
            exit 1
          fi
          if [ -z "${ELIZAOS_CLOUD_API_KEY:-}" ]; then
            echo "::error::The web Railway voice lane requires ELIZACLOUD_API_KEY so the app's authenticated Cloud STT/TTS proxies can reach Railway."
            exit 1
          fi

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install Playwright Chromium
        run: .github/scripts/install-playwright-browsers.sh chromium

      - name: Install browser system-audio loopback
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils ffmpeg
          pulseaudio --start
          pactl load-module module-null-sink sink_name=eliza_voice_evidence sink_properties=device.description=eliza_voice_evidence
          pactl set-default-sink eliza_voice_evidence

      - name: Generate shared i18n assets
        run: bun run --cwd packages/shared build:i18n

      - name: Build browser bundles
        run: |
          set -euo pipefail
          bunx turbo run build --filter=@elizaos/core --filter=@elizaos/shared
          bun run --cwd packages/app build:web

      - name: Prove the live cell is explicit when ungated
        env:
          ELIZA_VOICE_LIVE_RAILWAY: ""
        run: |
          set -euo pipefail
          bun run voice:matrix -- \
            --platform web.live.railway-roundtrip \
            --out "$RUNNER_TEMP/voice-web-live-ungated"

      - name: Record visible mic, silence, and TTS-drop failure cells
        env:
          ELIZA_VOICE_LIVE_RAILWAY: ""
        run: |
          set -euo pipefail
          bun run voice:matrix -- \
            --run \
            --require-green \
            --platform web.failure-paths \
            --out "$RUNNER_TEMP/voice-web-failures-matrix"
          cp -R e2e-recordings/app/test-results "$RUNNER_TEMP/voice-web-failure-results"

      - name: Start real browser system-output capture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/voice-web-live"
          echo "VOICE_LOOPBACK_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          ffmpeg -y -v error \
            -f pulse -i eliza_voice_evidence.monitor \
            -ac 2 -ar 48000 \
            "$RUNNER_TEMP/voice-web-live/system-loopback.wav" &
          echo "VOICE_LOOPBACK_PID=$!" >> "$GITHUB_ENV"
          sleep 1
          if ! kill -0 "$!" 2>/dev/null; then
            echo "::error::Pulse monitor recorder exited before the browser lane started."
            exit 1
          fi

      - name: Run the provisioned live browser matrix cell
        env:
          ELIZA_UI_SMOKE_BACKEND_LOG_PATH: ${{ runner.temp }}/voice-web-live/backend.log
        run: |
          set -euo pipefail
          bun run voice:matrix -- \
            --run \
            --require-green \
            --platform web.live.railway-roundtrip \
            --out "$RUNNER_TEMP/voice-web-live-matrix"

      - name: Stop browser system-output capture
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${VOICE_LOOPBACK_PID:-}" ]; then
            kill -INT "$VOICE_LOOPBACK_PID" 2>/dev/null || true
            for _ in {1..50}; do
              kill -0 "$VOICE_LOOPBACK_PID" 2>/dev/null || break
              sleep 0.1
            done
            if kill -0 "$VOICE_LOOPBACK_PID" 2>/dev/null; then
              kill -KILL "$VOICE_LOOPBACK_PID" 2>/dev/null || true
              wait "$VOICE_LOOPBACK_PID" 2>/dev/null || true
              echo "::error::Browser loopback recorder required forced termination."
              exit 1
            fi
            wait "$VOICE_LOOPBACK_PID" 2>/dev/null || true
          fi
          jq -n \
            --argjson startedAtMs "$VOICE_LOOPBACK_STARTED_AT_MS" \
            --argjson finishedAtMs "$(date +%s%3N)" \
            '{source:"pulse-monitor",startedAtMs:$startedAtMs,finishedAtMs:$finishedAtMs}' \
            > "$RUNNER_TEMP/voice-web-live/system-loopback-clock.json"

      - name: Finalize and validate audible browser evidence
        env:
          ELIZA_VOICE_EVIDENCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          bun run --cwd packages/app voice:evidence -- web \
            --results e2e-recordings/app/test-results \
            --failures "$RUNNER_TEMP/voice-web-failure-results" \
            --loopback "$RUNNER_TEMP/voice-web-live/system-loopback.wav" \
            --loopback-clock "$RUNNER_TEMP/voice-web-live/system-loopback-clock.json" \
            --backend "$RUNNER_TEMP/voice-web-live/backend.log" \
            --matrix "$RUNNER_TEMP/voice-web-live-matrix/voice-matrix.json" \
            --out "$RUNNER_TEMP/voice-web-final"

      - name: Upload web Railway voice evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voice-web-live-railway
          path: |
            ${{ runner.temp }}/voice-web-live-ungated
            ${{ runner.temp }}/voice-web-live-matrix
            ${{ runner.temp }}/voice-web-live
            ${{ runner.temp }}/voice-web-final
            ${{ runner.temp }}/voice-web-failures-matrix
            ${{ runner.temp }}/voice-web-failure-results
            packages/app/playwright-report/
            packages/app/test-results/
            e2e-recordings/app/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Build the fused libelizainference from the in-repo llama.cpp fork so the
  # self-hosted jobs never depend on hand-staged native libs. CPU variant with
  # GGML_CPU always on; espeak-ng is intentionally NOT linked (the robots have
  # no libespeak-ng runtime) — the lib reports g2p=ascii and the TS Kokoro
  # runtime feeds espeak-ng-WASM IPA through kokoro_synthesize_ipa (#11776),
  # which is the exact configuration the local verification ran. Cached by the
  # fork submodule commit + build-script hash, so most nights restore in
  # seconds instead of compiling.
  voice-fused-build:
    name: Build fused libelizainference (linux-x64 cpu)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          show-progress: false

      - name: Resolve fork commit for the cache key
        id: fork
        run: echo "commit=$(git rev-parse HEAD:plugins/plugin-local-inference/native/llama.cpp)" >> "$GITHUB_OUTPUT"

      - name: Restore cached fused build
        id: fused-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: fused-lib
          key: voice-fused-cpu-v2-${{ steps.fork.outputs.commit }}-${{ hashFiles('packages/app-core/scripts/stage-desktop-fused-lib.mjs') }}

      - name: Setup Node.js
        if: steps.fused-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build deps
        if: steps.fused-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          APT_ARGS=(-o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o Acquire::http::Timeout=30)
          for attempt in 1 2 3; do
            if sudo apt-get "${APT_ARGS[@]}" update && \
               sudo apt-get "${APT_ARGS[@]}" install -y --fix-missing \
                 cmake ninja-build build-essential ccache git python3 curl libgomp1; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo "apt install failed"; exit 1; fi
            sleep $((attempt * 10))
          done
          cmake --version

      - name: Build + stage the fused libelizainference (CPU)
        if: steps.fused-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          node packages/app-core/scripts/stage-desktop-fused-lib.mjs \
            --variant cpu --portable-cpu --out "$GITHUB_WORKSPACE/fused-lib"

      - name: Verify the fused ABI surface
        run: |
          set -euo pipefail
          LIB="$GITHUB_WORKSPACE/fused-lib/libelizainference.so"
          test -f "$LIB" || { echo "missing $LIB after build/cache"; exit 1; }
          for sym in eliza_inference_kokoro_load eliza_inference_speaker_open eliza_inference_diariz_open eliza_inference_vad_open eliza_inference_asr_transcribe eliza_inference_tokenize; do
            if ! nm -D "$LIB" | grep -q "$sym"; then
              echo "fused lib does not export $sym"
              exit 1
            fi
          done
          file "$LIB"

      - name: Upload fused lib artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voice-fused-lib-linux-x64-cpu
          path: fused-lib
          if-no-files-found: error

  voice-roundtrip:
    name: Pre-Gemma ASR compatibility FFI + optional mixed round-trip (self-hosted)
    # Single point of runner config — override with repo var VOICE_LIVE_RUNNER_LABELS.
    runs-on: ${{ fromJSON(vars.VOICE_LIVE_RUNNER_LABELS || '["self-hosted","Linux","X64","eliza"]') }}
    needs: voice-fused-build
    timeout-minutes: 90
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    # Hard component lane: the fused ASR smoke always runs against the pinned
    # pre-Gemma compatibility assets. The independent product-release job keeps
    # the workflow red until the supported Gemma pair exists.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Native apt + protoc are disabled: these self-hosted
      # runners build no Rust plugins, the install is --ignore-scripts, and a
      # sudo apt-get would introduce a new failure mode on the fleet.
      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Prepare core generated sources
        run: bun run --cwd packages/core prebuild

      - name: Download fused libelizainference artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: voice-fused-lib-linux-x64-cpu
          path: ${{ runner.temp }}/fused-lib

      - name: Stage voice compatibility assets (fused lib + pinned bundle)
        uses: ./.github/actions/stage-voice-real-assets
        with:
          fused-lib-dir: ${{ runner.temp }}/fused-lib

      - name: Pre-Gemma ASR compatibility FFI smoke (bun:ffi)
        run: bun run --cwd plugins/plugin-local-inference test:asr:real

      # Designed key-gated step: the mixed round-trip crosses two external
      # paid services. Absence of the keys is surfaced loudly below instead of
      # a silent skip.
      - name: Optional mixed real round-trip test
        if: env.ELEVENLABS_API_KEY != '' && env.CEREBRAS_API_KEY != ''
        run: bun run --cwd plugins/plugin-local-inference roundtrip:real

      - name: Note skipped mixed round-trip (keys absent)
        if: env.ELEVENLABS_API_KEY == '' || env.CEREBRAS_API_KEY == ''
        run: |
          echo "::warning title=Mixed cloud round-trip skipped::ELEVENLABS_API_KEY and/or CEREBRAS_API_KEY are not configured, so the cloud-TTS → compatibility-ASR → cloud-LLM round-trip step did not run. The pre-Gemma FFI component smoke above is not product-runtime ASR proof."

  voice-acoustic-matrix:
    name: Real acoustic components + pre-Gemma ASR compatibility matrix (self-hosted)
    # Single point of runner config — override with repo var VOICE_LIVE_RUNNER_LABELS.
    runs-on: ${{ fromJSON(vars.VOICE_LIVE_RUNNER_LABELS || '["self-hosted","Linux","X64","eliza"]') }}
    needs: voice-fused-build
    # The 26-scenario workbench alone runs tens of minutes on a CPU-only host
    # (every turn is a real Kokoro synth + fused ASR decode), on top of the
    # first-night bundle staging — 120 was measured too tight end-to-end.
    timeout-minutes: 180
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      # Desktop-CPU TTFA ceiling — see the header note; the 700 ms default is
      # the mobile product budget and is orders of magnitude out of reach for
      # a CPU-only CI host. 30 s still catches loader hangs.
      KOKORO_SMOKE_TTFA_BUDGET_MS: "30000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          show-progress: false

      # Self-provisioning (#16945): the fused lib arrives as a build artifact
      # from voice-fused-build (ABI-matched to this checkout), and the pinned
      # eliza-1-2b bundle regions stage into the host cache via
      # stage-voice-real-assets. Any staging failure is a red job — this lane
      # never green-skips, and it no longer depends on hand-staged runner
      # assets (the old #9454 ops gap).
      - name: Prepare matrix output dir + environment probe
        run: |
          set -euo pipefail
          VOICE_REAL_MATRIX_OUT="$RUNNER_TEMP/voice-real-matrix"
          echo "VOICE_REAL_MATRIX_OUT=$VOICE_REAL_MATRIX_OUT" >> "$GITHUB_ENV"
          mkdir -p "$VOICE_REAL_MATRIX_OUT"
          {
            echo "runner=$(hostname)"
            echo "workspace=$GITHUB_WORKSPACE"
            echo "runnerTemp=$RUNNER_TEMP"
            # Keyless by design (#9577): the owner/impostor/agent corpus is
            # synthesized locally with distinct fused Kokoro voice packs, so no
            # ElevenLabs secret is required. The key only upgrades the
            # human-turn rows to real voices.
            if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
              echo "ELEVENLABS_API_KEY not set — keyless local-Kokoro corpus (#9577)"
            else
              echo "ELEVENLABS_API_KEY present — human-turn rows use real ElevenLabs voices"
            fi
          } 2>&1 | tee "$VOICE_REAL_MATRIX_OUT/probe.log"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      # --ignore-scripts skips core's generated sources; the voice scripts
      # import @elizaos/core straight from src, so generate them explicitly.
      - name: Prepare core generated sources
        run: bun run --cwd packages/core prebuild

      - name: Download fused libelizainference artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: voice-fused-lib-linux-x64-cpu
          path: ${{ runner.temp }}/fused-lib

      - name: Stage voice compatibility assets (fused lib + pinned bundle)
        uses: ./.github/actions/stage-voice-real-assets
        with:
          fused-lib-dir: ${{ runner.temp }}/fused-lib

      - name: Record provisioning evidence
        run: |
          set -euo pipefail
          {
            echo "bundle=$ELIZA_ASR_BUNDLE"
            echo "fusedLib=$ELIZA_INFERENCE_LIBRARY"
            find "$ELIZA_ASR_BUNDLE" -type f -printf '%P %s bytes\n' | sort
            sha256sum "$ELIZA_INFERENCE_LIBRARY"
          } | tee "$VOICE_REAL_MATRIX_OUT/provisioning.txt"

      - name: Real Kokoro GGUF synth smoke
        run: |
          set -euo pipefail
          bun run --cwd plugins/plugin-local-inference test:kokoro:real \
            2>&1 | tee "$VOICE_REAL_MATRIX_OUT/kokoro-real-smoke.log"

      - name: Real fused attribution smoke
        run: |
          set -euo pipefail
          bun packages/app-core/scripts/voice-attribution-smoke.ts \
            --models "$ELIZA_VOICE_REAL_MODEL_DIR" \
            --require-real \
            2>&1 | tee "$VOICE_REAL_MATRIX_OUT/voice-attribution-smoke.log"

      - name: Real plugin voice stack matrix
        run: |
          set -euo pipefail
          bun run --cwd plugins/plugin-local-inference voicestack:real \
            2>&1 | tee "$VOICE_REAL_MATRIX_OUT/voicestack-real.log"
          bun run --cwd plugins/plugin-local-inference agentvoice:real \
            2>&1 | tee "$VOICE_REAL_MATRIX_OUT/agentvoice-real.log"
          bun run --cwd plugins/plugin-local-inference robustness:real \
            2>&1 | tee "$VOICE_REAL_MATRIX_OUT/robustness-real.log"

      # Hard-real authority (#16972): the workbench consumes provider-produced
      # diarization boundaries across the full stream and fails closed when an
      # asserted signal has no samples. Product-quality failures stay red; this
      # job must never convert them into an omitted or warning-only matrix.
      - name: Real voice workbench scenario matrix
        run: |
          set -euo pipefail
          bun run --cwd plugins/plugin-local-inference voice:workbench --real \
            --out "$VOICE_REAL_MATRIX_OUT/voice-workbench-real" \
            2>&1 | tee "$VOICE_REAL_MATRIX_OUT/voice-workbench-real.log"

      # bun test, NOT vitest: these suites need bun:ffi, and vitest's node
      # workers make every one of them skip — a green-skip lie this lane bans.
      # Under `bun test` all 12 tests execute against the staged fused lib. The
      # ASR row is compatibility-only until the product release gate is green.
      - name: Fused component compatibility FFI test lanes (bun:ffi)
        run: |
          set -euo pipefail
          bun test \
            plugins/plugin-local-inference/src/services/voice/speaker/encoder-fused.real.test.ts \
            plugins/plugin-local-inference/src/services/voice/speaker/diarizer-fused.real.test.ts \
            plugins/plugin-local-inference/src/services/voice/asr-timed.real.test.ts \
            plugins/plugin-local-inference/src/services/voice/kokoro/__tests__/kokoro-engine-bridge.real.test.ts \
            2>&1 | tee "$VOICE_REAL_MATRIX_OUT/fused-real-bun-test.log"
          # Per-cell accounting: ANY nonzero skip count means some matrix cell
          # did not execute against the staged lib — a partial skip is as much
          # a green-skip lie as a full-lane skip, so it fails the same way.
          if grep -Eq "(^| )0 pass" "$VOICE_REAL_MATRIX_OUT/fused-real-bun-test.log" \
            || grep -Eq "(^| )[1-9][0-9]* skip" "$VOICE_REAL_MATRIX_OUT/fused-real-bun-test.log"; then
            echo "::error title=Fused FFI lanes skipped::one or more compatibility FFI suite cells did not execute — staging or bun:ffi is broken"
            exit 1
          fi

      - name: Upload real voice matrix logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voice-real-acoustic-matrix
          path: ${{ runner.temp }}/voice-real-matrix
          if-no-files-found: error

  voice-macos-electrobun-matrix:
    name: macOS Electrobun live-voice matrix
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_macos_electrobun) || vars.ELIZA_VOICE_MACOS_ELECTROBUN_READY == '1' }}
    # Physical microphone and speaker-loopback acceptance cannot run on a
    # GitHub-hosted VM. The ready gate is meaningful only on the owner-operated
    # hardware runner named by this label set. Device variables use ffmpeg's
    # avfoundation indices (`ffmpeg -f avfoundation -list_devices true -i ""`).
    runs-on: ${{ fromJSON(vars.ELIZA_VOICE_MACOS_RUNNER_LABELS || '["self-hosted","macOS","ARM64","eliza","voice-hardware"]') }}
    timeout-minutes: 90
    env:
      ELIZA_VOICE_MACOS_ELECTROBUN_READY: ${{ vars.ELIZA_VOICE_MACOS_ELECTROBUN_READY }}
      ELIZA_TEST_PACKAGED_LAUNCHER_PATH: ${{ vars.ELIZA_VOICE_MACOS_PACKAGED_LAUNCHER_PATH }}
      ELIZA_VOICE_DESKTOP_API_BASE: ${{ vars.ELIZA_VOICE_DESKTOP_API_BASE }}
      ELIZA_VOICE_HARDWARE_SCREEN_DEVICE: ${{ vars.ELIZA_VOICE_MACOS_SCREEN_DEVICE }}
      ELIZA_VOICE_HARDWARE_MIC_DEVICE: ${{ vars.ELIZA_VOICE_MACOS_MIC_DEVICE }}
      ELIZA_VOICE_HARDWARE_SPEAKER_LOOPBACK_DEVICE: ${{ vars.ELIZA_VOICE_MACOS_SPEAKER_LOOPBACK_DEVICE }}
      ELIZA_VOICE_BROWSER_MIC_DEVICE_ID: ${{ vars.ELIZA_VOICE_MACOS_BROWSER_MIC_DEVICE_ID }}
      ELIZA_VOICE_BROWSER_SPEAKER_DEVICE_ID: ${{ vars.ELIZA_VOICE_MACOS_BROWSER_SPEAKER_DEVICE_ID }}
      ELIZA_VOICE_DESKTOP_BACKEND_LOG: ${{ vars.ELIZA_VOICE_MACOS_BACKEND_LOG }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          install-protoc: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Run macOS Electrobun matrix inside synchronized hardware capture
        run: |
          set -euo pipefail
          bun run --cwd packages/app voice:evidence:desktop:capture -- \
            --platform darwin \
            --out "$RUNNER_TEMP/voice-macos-hardware-capture" \
            -- bun run voice:matrix -- --run --require-green --platform macos-electrobun --out "$RUNNER_TEMP/voice-macos-electrobun-matrix"

      - name: Finalize real macOS microphone and speaker evidence
        env:
          ELIZA_VOICE_EVIDENCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          CELL="$RUNNER_TEMP/voice-macos-electrobun-matrix/macos.electrobun.live-roundtrip"
          bun run --cwd packages/app voice:evidence -- desktop \
            --report "$CELL/voice-desktop-selftest-darwin.json" \
            --trajectory "$CELL/voice-desktop-selftest-darwin-trajectory.json" \
            --backend "$RUNNER_TEMP/voice-macos-hardware-capture/backend-session.log" \
            --screen "$RUNNER_TEMP/voice-macos-hardware-capture/screen.mp4" \
            --mic "$RUNNER_TEMP/voice-macos-hardware-capture/microphone.wav" \
            --speaker "$RUNNER_TEMP/voice-macos-hardware-capture/speaker-loopback.wav" \
            --microphone-payload "$CELL/voice-desktop-selftest-darwin-input.wav" \
            --reference-payload "$CELL/voice-desktop-selftest-darwin-reference.wav" \
            --tts-payload "$CELL/voice-desktop-selftest-darwin-tts.audio" \
            --capture-provenance "$RUNNER_TEMP/voice-macos-hardware-capture/capture-provenance.json" \
            --out "$RUNNER_TEMP/voice-macos-electrobun-final"

      - name: Upload macOS Electrobun matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voice-macos-electrobun-matrix
          path: |
            ${{ runner.temp }}/voice-macos-electrobun-matrix
            ${{ runner.temp }}/voice-macos-hardware-capture
            ${{ runner.temp }}/voice-macos-electrobun-final
          if-no-files-found: error

