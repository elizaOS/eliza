name: Test Flatpak Build

on:
  pull_request:
    branches: [develop]
    paths:
      - 'packages/app-core/packaging/flatpak/**'
      - 'packages/app-core/scripts/build-flatpak.mjs'
      - 'packages/app-core/scripts/copy-runtime-node-modules.ts'
      - 'packages/app-core/scripts/copy-runtime-node-modules.coverage.test.ts'
      - 'packages/agent/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/test-flatpak.yml'
  workflow_dispatch:

concurrency:
  group: test-flatpak-${{ github.ref }}
  cancel-in-progress: true

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Flatpak
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream-util desktop-file-utils file flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.freedesktop.Platform//24.08
          flatpak install -y --user flathub org.freedesktop.Sdk//24.08

      - name: Install frozen workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate AppStream metadata
        working-directory: packages/app-core/packaging/flatpak
        run: appstream-util validate-relax ai.elizaos.App.metainfo.xml

      - name: Validate desktop entry
        run: desktop-file-validate packages/app-core/packaging/flatpak/ai.elizaos.App.desktop

      - name: Build Flatpak
        run: bun run --cwd packages/app-core build:flatpak:direct

      - name: Install and test
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          export EXPECTED_VERSION
          flatpak --user install --reinstall -y dist-flatpak/elizaos-app.flatpak
          test "$(flatpak run ai.elizaos.App --version)" = "$EXPECTED_VERSION"
          test "$(flatpak run --command=node ai.elizaos.App --version)" = "v24.15.0"
          flatpak run ai.elizaos.App --help | tee /tmp/elizaos-flatpak-help.txt
          grep -q 'Usage:' /tmp/elizaos-flatpak-help.txt
          grep -q 'Commands:' /tmp/elizaos-flatpak-help.txt
          flatpak run --command=node ai.elizaos.App \
            --input-type=module \
            --eval 'await import("/app/lib/elizaos-app/node_modules/@elizaos/plugin-elizacloud/dist/node/index.node.js")'
          flatpak run --command=cat ai.elizaos.App \
            /app/lib/elizaos-app/flatpak-runtime.json > /tmp/flatpak-runtime.json
          node -e '
            const fs = require("node:fs");
            const metadata = JSON.parse(fs.readFileSync("/tmp/flatpak-runtime.json", "utf8"));
            if (metadata.version !== process.env.EXPECTED_VERSION) throw new Error("wrong staged version");
            if (metadata.runtimeNode !== "v24.15.0") throw new Error("wrong staged Node runtime");
            if (metadata.sourceDirty) throw new Error("release runtime came from a dirty checkout");
            if (metadata.sourceRevision !== process.env.GITHUB_SHA) throw new Error("wrong source revision");
          '

      - name: Checksum bundle
        run: sha256sum dist-flatpak/elizaos-app.flatpak > dist-flatpak/elizaos-app.flatpak.sha256

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flatpak-test-bundle
          path: |
            dist-flatpak/elizaos-app.flatpak
            dist-flatpak/elizaos-app.flatpak.sha256
            dist-flatpak/runtime/flatpak-runtime.json
          retention-days: 7
