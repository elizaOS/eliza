# certification-hosted — runs the certification chain on a GitHub-hosted
# runner, as the sanctioned fallback for certification-vast when the vast.ai
# path is unavailable (dead VAST_API_KEY, no offers). Thin caller of
# scripts/vast/local-certify.mjs, which runs the exact chain the vast onstart
# runs — packages/evidence bundle:create → certify:rollup → certify:sign —
# "same commands, same output; the gate cannot tell the difference (by design
# — the signature is what matters)".
#
# The gpu/full-tier vision analyzers resolve their backend from env
# (packages/evidence/src/vision-qa/config.ts): with ANTHROPIC_API_KEY present
# they use the Anthropic Messages API, so no local GPU is required. A rented
# GPU only ever served the local llama-server backend.
#
# Secrets discipline mirrors certification-vast: workflow_dispatch only (no
# pull_request trigger — PR-controlled code must never see the signing key),
# and both secrets are exposed only to the single step that runs the chain.
name: certification-hosted

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit sha to certify (default: the ref this workflow runs on)"
        required: false
        type: string
      tier:
        description: "Certification tier"
        required: false
        default: "full"
        type: choice
        options: [cpu, gpu, full]

concurrency:
  group: certification-hosted
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hosted-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Preflight secrets
        env:
          HAS_SIGNING_KEY: ${{ secrets.ELIZA_CERT_SIGNING_KEY != '' }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAS_SIGNING_KEY" = "true" ] || missing="$missing ELIZA_CERT_SIGNING_KEY"
          if [ "$TIER" != "cpu" ]; then
            [ "$HAS_ANTHROPIC_KEY" = "true" ] || missing="$missing ANTHROPIC_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=certification-hosted::missing repo secret(s):$missing"
            exit 1
          fi

      - name: Checkout commit to certify
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"

      - name: Generate shared i18n data
        run: node packages/app-core/scripts/ensure-shared-i18n-data.mjs

      # The bundle ingests evidence silos produced by real lanes on the
      # certified sha; a fresh runner has none, and certify:sign honestly
      # refuses an empty verdicts document (proven by hosted run
      # 31056825214). Run the same deterministic scenario lane the
      # develop-exhaustive matrix runs — real runtime, deterministic model,
      # keyless — which writes the reports/scenarios silo.
      - name: Produce evidence — deterministic scenario lane
        env:
          TZ: UTC
        run: bun run --cwd packages/scenario-runner test:pr:e2e

      # The orchestrated command is the complete chain — matrix → ingest →
      # analyze → vision-qa → rollup → reviewer merge → sign → self-verify.
      # The matrix is NOT skippable here: rollup scores lanes only from
      # lanes/<lane>/result.json, which only the matrix step records (run
      # 31059202533: --skip-matrix + no visual subjects → zero verdicts →
      # honest refusal). Certification therefore means: the repo test matrix
      # passes on the certified sha, recorded and signed.
      - name: Run certification (orchestrated certify)
        env:
          ELIZA_CERT_SIGNING_KEY: ${{ secrets.ELIZA_CERT_SIGNING_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          bun run --cwd packages/evidence certify --
          --tier "${{ inputs.tier }}"
          --reviewer-id "certification-hosted@github-actions"
          --reviewer-kind agent
          --cert-out "$GITHUB_WORKSPACE/certification.json"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          test -f certification.json
          bundle_dir=$(ls -dt evidence/runs/*/ | head -1)
          test -f "${bundle_dir}certification.json"
          mkdir -p "$RUNNER_TEMP/cert-out/evidence"
          cp certification.json "$RUNNER_TEMP/cert-out/certification.json"
          cp -R "$bundle_dir" "$RUNNER_TEMP/cert-out/evidence/bundle"
          echo "bundle: $bundle_dir"

      - name: Upload signed certification + bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certification-${{ inputs.sha != '' && inputs.sha || github.sha }}
          path: ${{ runner.temp }}/cert-out/
          if-no-files-found: error
          retention-days: 30
