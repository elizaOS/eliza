name: Valhalla Chrome extension

on:
  pull_request:
    paths:
      - plugins/plugin-valhalla-copybot/extension/**
      - .github/workflows/valhalla-extension.yml
  push:
    branches:
      - cursor/valhalla-android-companion-d28f
    paths:
      - plugins/plugin-valhalla-copybot/extension/**
      - .github/workflows/valhalla-extension.yml

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium
          mkdir -p "$GITHUB_WORKSPACE/plugins/plugin-valhalla-copybot/node_modules"
          ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright" "$GITHUB_WORKSPACE/plugins/plugin-valhalla-copybot/node_modules/playwright"
      - name: Load the unpacked extension
        working-directory: plugins/plugin-valhalla-copybot
        run: xvfb-run -a node scripts/check-extension.mjs
