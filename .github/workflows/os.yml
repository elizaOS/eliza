name: OS verification

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: os-verification-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/os

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.15.0"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore actionlint archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/elizaos/actionlint
          key: actionlint-v1.7.12-${{ runner.os }}-${{ runner.arch }}

      - name: Provision pinned actionlint
        run: scripts/provision-actionlint.sh

      - name: Lint GitHub Actions workflows
        run: actionlint ../../.github/workflows/os.yml

      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - name: Install native compilation prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc libc6-dev libssl-dev zstd
      - run: bun run verify
      - name: Validate Android compatibility wrappers
        run: android/installer/tests/run-tests.sh
      - name: Validate the checked-in release plan
        run: |
          set -euo pipefail
          manifest=release/v0.1.0-beta.1/manifest.json
          output="$(bun -e 'import { testOutputPath } from "../scripts/lib/test-output.ts"; console.log(testOutputPath("os-release-plan"));')"
          node scripts/validate-release-manifest.ts --manifest "$manifest"
          node scripts/assert-canonical-linux-release.ts --manifest "$manifest"
          node scripts/collect-release-evidence.ts --manifest "$manifest" \
            --evidence-dir "$output" --output "$output/ci-evidence.json"
      - name: Retain release plan validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: os-release-plan-validation
          path: test-results/os-release-plan/ci-evidence.json
          if-no-files-found: warn
      - name: Build installer frontends
        run: bun run build

  debian-packaging-validation:
    name: Validate Debian packaging source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install desktop metadata validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils dpkg-dev
      - name: Validate architecture and native-payload contract
        run: bash scripts/linux/verify-debian-packaging.sh

  installer-native-linux-qualification:
    name: Native installer accepted-peer qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.15.0"

      - name: Qualify cross-process AF_UNIX credentials and pidfd lifecycle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc libc6-dev libssl-dev
          linux/installer/native/test-qualify.sh

  linux-static-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELIZAOS_ELIZA_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.15.0"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision ripgrep for Linux static smoke
        shell: bash
        run: scripts/provision-ripgrep.sh

      - name: Install Linux verification prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-cryptography fdisk e2fsprogs

      - run: bun run verify:linux

  linux-usb-virtual-block:
    uses: ./.github/workflows/os-usb-raw-qualification.yml

  linux-restore-fd-vm:
    name: Restore retained-FD VM (${{ matrix.sector-size }} byte sectors)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sector-size: [512, 4096]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Resolve qualification output
        env:
          SECTOR_BYTES: ${{ matrix.sector-size }}
        run: |
          output="$(bun -e 'import { testOutputPath } from "../scripts/lib/test-output.ts"; console.log(testOutputPath("os-restore-fd", process.env.SECTOR_BYTES));')"
          echo "RESTORE_EVIDENCE=$output" >> "$GITHUB_ENV"

      - name: Qualify native child supervision without privileges
        run: |
          cc -std=c17 -O2 -Wall -Wextra -Werror -Wconversion -Wshadow -Wformat=2 \
            usb-installer/native/restore-tool-runner.test.c \
            -o "$RUNNER_TEMP/restore-tool-runner-test"
          "$RUNNER_TEMP/restore-tool-runner-test"
          python3 usb-installer/native/qualify-restore-vm.test.py

      - name: Install unprivileged VM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage fdisk

      - name: Download pinned qualification inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore-inputs"
          curl --fail --location --retry 3 --max-time 300 \
            https://cloud.debian.org/images/cloud/trixie/20260914-2601/debian-13-generic-amd64-20260914-2601.qcow2 \
            -o "$RUNNER_TEMP/restore-inputs/debian.qcow2"
          curl --fail --location --retry 3 --max-time 120 \
            https://codeload.github.com/exfatprogs/exfatprogs/tar.gz/3e87676349387a119cadacd68661d2966796b7fd \
            -o "$RUNNER_TEMP/restore-inputs/exfat.tar.gz"

      - name: Qualify only disposable VM disks
        shell: bash
        env:
          SECTOR_BYTES: ${{ matrix.sector-size }}
        run: |
          set -euo pipefail
          accelerator=tcg
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then accelerator=kvm; fi
          python3 usb-installer/native/qualify-restore-vm.py \
            --base-image "$RUNNER_TEMP/restore-inputs/debian.qcow2" \
            --source-archive "$RUNNER_TEMP/restore-inputs/exfat.tar.gz" \
            --output-dir "$RESTORE_EVIDENCE" \
            --sector-size "$SECTOR_BYTES" --accelerator "$accelerator"

      - name: Retain logs and exact-input qualification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: restore-fd-${{ matrix.sector-size }}
          path: |
            ${{ env.RESTORE_EVIDENCE }}/*.log
            ${{ env.RESTORE_EVIDENCE }}/qualification.json
            ${{ env.RESTORE_EVIDENCE }}/gpt-snapshot.bin
          if-no-files-found: warn

  android-powershell-safety:
    name: Android PowerShell safety refusals
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject unsafe execution before device access
        shell: pwsh
        run: android/installer/tests/wrapper-safety.ps1

  usb-browser:
    name: USB installer desktop and mobile browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.15.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - name: Restore Playwright Chromium cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Test desktop and mobile installer flows
        run: |
          bun usb-installer/node_modules/@playwright/test/cli.js install --with-deps chromium
          bun run --cwd usb-installer test:e2e
      - name: Retain browser test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: os-usb-browser
          path: test-results/os-usb-installer/
          if-no-files-found: warn
