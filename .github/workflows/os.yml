name: OS verification

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: os-verification-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

defaults:
  run:
    working-directory: packages/os

permissions:
  contents: read

env:
  ELIZA_APT_UBUNTU_ONLY: "true"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.15.0"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore actionlint archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/elizaos/actionlint
          key: actionlint-v1.7.12-${{ runner.os }}-${{ runner.arch }}

      - name: Provision pinned actionlint
        run: scripts/provision-actionlint.sh

      - name: Lint GitHub Actions workflows
        run: actionlint ../../.github/workflows/os.yml

      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - name: Install native compilation prerequisites
        run: |
          bash ../scripts/github/install-apt-packages.sh --no-install-recommends gcc g++ libc6-dev libssl-dev default-jdk-headless zstd e2fsprogs binutils python3-cryptography
      - name: Verify the OS package and release scripts
        # OTA publisher tests run once in the dedicated ota-publisher job.
        run: |
          bun run verify:portable
          bun run test:release
      - name: Build the browser component
        run: bun run build

  native-ota-trust:
    name: Native OTA trust compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/os/native/ota-trust/go.mod
          cache-dependency-path: packages/os/native/ota-trust/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: packages/os/native/ota-trust

  ota-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/os/native/ota-trust/go.mod
          cache-dependency-path: packages/os/native/ota-trust/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - name: Test durable OTA publication core
        run: node --test native/ota-publisher/test/*.test.mjs
