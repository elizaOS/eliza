name: Develop Lint Gate

# A fast, always-completing format/lint gate that fires on every push to
# `develop`. The canonical `ci.yaml` and `quality.yml` workflows use
# `cancel-in-progress: true` on push events, so a rapid series of develop
# pushes cancels their Quality / lint jobs mid-run — leaving lint/format
# reds invisible until a release pin or merged-base check surfaces them
# (#18326, #18338, #18360). This workflow has its own concurrency group
# with `cancel-in-progress: false`, so the develop tip's biome format +
# lint state is always known within seconds-scale minutes, regardless of
# push velocity.
#
# The gate runs `bun run format:check` (biome format check across all
# packages via Turbo) and `bun run lint:check` (biome lint check). Both
# are source-only checks that need no build output, no Python, no protoc,
# and no native deps — the leanest possible workspace setup.

on:
  push:
    branches: [develop]

concurrency:
  # Unique group so this workflow is never superseded by another push.
  # cancel-in-progress: false is the entire point — the gate must always
  # complete so develop lint state is always known.
  group: develop-lint-gate
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

jobs:
  develop-lint:
    name: Develop Lint + Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          # Biome format + lint are source-only AST checks; no Python,
          # protoc, or native compilation is needed.
          setup-python: "false"
          install-protoc: "false"
          run-postinstall: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Check formatting (biome)
        run: bun run format:check

      - name: Check lint (biome)
        run: bun run lint:check
