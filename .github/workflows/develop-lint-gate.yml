name: Develop Lint Gate

# A fast, always-completing format/lint gate that fires on every push to
# `develop`. The canonical `ci.yml` and `quality.yml` workflows use
# `cancel-in-progress: true` on push events, so a rapid series of develop
# pushes cancels their Quality / lint jobs mid-run — leaving lint/format
# reds invisible until a release pin or merged-base check surfaces them
# (#18326, #18338, #18360). This workflow uses a per-run concurrency group
# (`github.run_id`), so every push gets its own group and runs independently
# — no push can ever be superseded, queued, or canceled by another.
# The group prefix is unique repo-wide — distinct from the
# `develop-lint-gate` *job* in quality.yml (which IS cancellable).
#
# The gate runs `bun run format:check` (biome format check across all
# packages via Turbo) and `bun run lint:check` (biome lint check). Both
# are source-only checks that need no build output, no Python, no protoc,
# and no native deps — the leanest possible workspace setup.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  # Per-run group so EVERY develop push gets its own concurrency slot and
  # runs to completion. Unlike a static group (which queues), a unique
  # group per run_id means no push can ever be superseded, queued, or
  # canceled — every push completes independently in parallel. This is the
  # strongest guarantee for a read-only diagnostic gate.
  # Ref: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  group: develop-lint-gate-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

jobs:
  develop-lint:
    name: Develop Lint + Format
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile --ignore-scripts
          install-native-deps: "false"
          # Biome format + lint are source-only AST checks; no Python,
          # protoc, or native compilation is needed.
          setup-python: "false"
          install-protoc: "false"
          run-postinstall: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Check formatting (biome)
        run: bun run format:check

      - name: Check lint (biome)
        if: always()
        run: bun run lint:check
