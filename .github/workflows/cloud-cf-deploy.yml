name: Cloud CF Deploy

run-name: Cloud CF ${{ inputs.environment || 'staging' }} ${{ inputs.source_sha || github.sha }} ${{ inputs.effect_digest || 'manual' }}

# Cloudflare deployment for the consolidated Eliza frontend and Workers API.
#
# One packages/app build is deployed to the `eliza-app` Pages project. Host-aware
# routing serves the public homepage on eliza.app and the managed agent/cloud
# experience on cloud.eliza.app. Legacy elizacloud.ai hosts are Worker-owned
# redirect inputs and never receive a separately built frontend.
#
# Staging accepts exact-SHA reconciler dispatches after Develop Full; production
# remains an explicit protected-environment operation.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   - account-scoped token with Workers + Pages edit perms
#   CLOUDFLARE_ACCOUNT_ID  - matches account_id in packages/cloud/api/wrangler.toml
# Shared Worker/control-plane secrets are published only when the selected
# GitHub environment explicitly configures them. An absent GitHub value never
# deletes or overwrites an existing Worker binding; a post-deploy names-only
# inventory gate verifies the required bindings without reading their values.
# Provider secrets are published when configured (the Worker calls native
# providers directly and uses OpenRouter as the backup):
#   OPENROUTER_API_KEY, CEREBRAS_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY,
#   GROQ_API_KEY, FAL_KEY, ELEVENLABS_API_KEY,
#   CARTESIA_API_KEY, CARTESIA_VOICE_ID, FISH_AUDIO_API_KEY,
#   FISH_AUDIO_REFERENCE_ID, VAST_API_KEY, VAST_BASE_URL.
# Media/voice secrets, likewise published when configured (#13406):
#   FAL_API_KEY (the video provider registry reads FAL_KEY ?? FAL_API_KEY),
#   CARTESIA_API_KEY (secret) + CARTESIA_VOICE_ID (from
#   vars.ELIZA_VOICE_CARTESIA_VOICE_ID) for first-class Cartesia cloud TTS,
#   FISH_AUDIO_API_KEY + FISH_AUDIO_REFERENCE_ID for the independently gated
#   Fish Audio realtime primary (Cartesia remains its fallback),
#   ELIZA_VOICE_CATALOG_SIGNING_KEY_BASE64 + ELIZA_VOICE_CATALOG_PUBLIC_KEY_BASE64
#   (Ed25519 keypair for the signed voice-model catalog; the catalog route 503s
#   while the signing key is unset).
#
# Consolidated from the original standalone Cloud deployment workflow.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      force:
        # Bypass the deploy freshness guard (#14083). The guard SKIPS a deploy
        # when this run's SHA is an ancestor of the currently-served build (a
        # stale zombie run clobbering a newer bundle — #14082). Set force=true
        # for an INTENTIONAL rollback to an older ref.
        description: Bypass the freshness guard (intentional rollback to an older ref)
        required: false
        default: false
        type: boolean
      source_sha:
        description: Exact develop SHA supplied by the effect reconciler
        required: false
        default: ""
        type: string
      effect_digest:
        description: Exact reconciler input digest; empty for manual operation
        required: false
        default: ""
        type: string
      run_deployed_renderer_staging:
        description: Run the credentialed deployed-Pages renderer proof once after a staging release (uses real staging model credits)
        required: false
        default: false
        type: boolean

concurrency:
  # #18092: non-PR admission is unique per run so two dispatches/reruns of
  # the same SHA both create jobs and can reach approval. Pull requests
  # still supersede by number. Mutation is a single post-approval job lock
  # on `release` (see cloud-cf-release.yml). v6 retires the v5 per-SHA groups.
  group: cloud-cf-deploy-v6-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read
  actions: read

jobs:
  validate-deploy-source:
    name: Validate Canonical Deploy Source
    # Push and pull-request refs are constrained by the trigger itself. Only a
    # manual dispatch can select an invalid ref, so automatic releases should
    # not wait for a hosted runner merely to execute an unconditional exit 0.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject feature refs targeting canonical environments
        env:
          EFFECT_DIGEST: ${{ inputs.effect_digest }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            exit 0
          fi

          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            expected_ref="refs/heads/main"
          else
            expected_ref="refs/heads/develop"
          fi

          if [ "$SOURCE_REF" != "$expected_ref" ]; then
            echo "::error::Canonical $TARGET_ENVIRONMENT deploys must run from $expected_ref, not $SOURCE_REF. Use the pull-request Pages preview for feature refs."
            exit 1
          fi

          if [ -n "$EFFECT_DIGEST" ]; then
            [[ "$EFFECT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid reconciled effect digest"; exit 1; }
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid reconciled source SHA"; exit 1; }
            [ "$SOURCE_SHA" = "$GITHUB_SHA" ] || {
              echo "::error::Dispatch resolved $GITHUB_SHA instead of reconciled source $SOURCE_SHA"
              exit 1
            }
          fi

  admit-staging:
    name: Authorize and admit staging release
    needs: validate-deploy-source
    if: ${{ always() && (needs.validate-deploy-source.result == 'success' || needs.validate-deploy-source.result == 'skipped') && github.event_name != 'pull_request' && !((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    outputs:
      should_deploy: ${{ steps.admission.outputs.should_deploy }}
    # This environment contains only deployment policy. Runtime secrets remain
    # in `staging`, whose jobs are reached only after this gate and admission
    # check. Keeping approval outside every shared concurrency group prevents a
    # reviewer wait from owning a deployment lock.
    environment: staging-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject superseded staging SHA before work starts
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
          RUN_DEPLOYED_RENDERER_STAGING: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deployed_renderer_staging == true }}
        run: |
          set -euo pipefail

          latest_eligible_run_id=""
          if [ "$EVENT_NAME" = "push" ] \
            && [ "$TARGET_ENVIRONMENT" != "production" ] \
            && [ "$GITHUB_REF" != "refs/heads/main" ] \
            && [ "$FORCE" != "true" ] \
            && [ "$RUN_DEPLOYED_RENDERER_STAGING" != "true" ]; then
            latest_eligible_run_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/cloud-cf-deploy.yml/runs?branch=develop&event=push&per_page=1" \
                --jq '.workflow_runs[0].id'
            )"
          fi

          node packages/cloud/scripts/release-admission-cli.mjs \
            "--event=$EVENT_NAME" \
            "--environment=$TARGET_ENVIRONMENT" \
            "--ref=$GITHUB_REF" \
            "--force=$FORCE" \
            "--run-deployed-renderer-staging=$RUN_DEPLOYED_RENDERER_STAGING" \
            "--run-id=$GITHUB_RUN_ID" \
            "--latest-eligible-run-id=$latest_eligible_run_id"

          if [ "$EVENT_NAME" = "push" ] \
            && [ "$GITHUB_RUN_ID" != "$latest_eligible_run_id" ] \
            && [ -n "$latest_eligible_run_id" ]; then
            echo "Superseded staging release: run=$GITHUB_RUN_ID latest=$latest_eligible_run_id" >> "$GITHUB_STEP_SUMMARY"
          fi

  validate-staging-certification:
    name: Validate staging certification for production tree
    needs: validate-deploy-source
    if: ${{ always() && (needs.validate-deploy-source.result == 'success' || needs.validate-deploy-source.result == 'skipped') && github.event_name != 'pull_request' && ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      tree_sha: ${{ steps.identity.outputs.tree_sha }}
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      artifact_digest: ${{ steps.resolve.outputs.artifact_digest }}
      staging_run_id: ${{ steps.resolve.outputs.staging_run_id }}
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind production candidate to its Git tree
        id: identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [ "$actual_sha" = "$EXPECTED_SHA" ] || {
            echo "::error::Production certification checkout resolved ${actual_sha}, expected ${EXPECTED_SHA}"
            exit 1
          }
          [ -z "$(git status --porcelain)" ] || {
            echo "::error::Production certification checkout is not clean"
            exit 1
          }
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          artifact_name="cloud-staging-certification-v1-${tree_sha}"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable successful staging artifact
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.identity.outputs.artifact_name }}
        run: |
          set -euo pipefail
          candidates_file="${RUNNER_TEMP}/staging-certification-candidates.json"
          artifact_file="${RUNNER_TEMP}/staging-certification-artifact.json"
          run_file="${RUNNER_TEMP}/staging-certification-run.json"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            > "$candidates_file"

          selected=""
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            artifact_id="$(jq -r '.id' <<<"$candidate")"
            run_id="$(jq -r '.workflow_run.id // empty' <<<"$candidate")"
            [ -n "$artifact_id" ] && [ -n "$run_id" ] || continue

            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$run_file"; then
              continue
            fi
            if ! jq -e \
              --arg repo "$GITHUB_REPOSITORY" \
              '.status == "completed"
                and .conclusion == "success"
                and (.event == "push" or .event == "workflow_dispatch")
                and .head_branch == "develop"
                and .path == ".github/workflows/cloud-cf-deploy.yml"
                and .repository.full_name == $repo' \
              "$run_file" >/dev/null; then
              continue
            fi

            selected="$candidate"
            break
          done < <(
            jq -c \
              --arg name "$ARTIFACT_NAME" \
              '[.artifacts[]
                | select(.name == $name)
                | select(.expired == false)
                | select((.digest // "") | test("^sha256:[0-9a-f]{64}$"))]
               | sort_by(.created_at)
               | reverse[]' \
              "$candidates_file"
          )

          [ -n "$selected" ] || {
            echo "::error::No unexpired successful develop Cloud certification exists for production tree ${ARTIFACT_NAME#cloud-staging-certification-v1-}"
            exit 1
          }

          printf '%s\n' "$selected" > "$artifact_file"
          artifact_id="$(jq -r '.id' "$artifact_file")"
          artifact_digest="$(jq -r '.digest' "$artifact_file")"
          staging_run_id="$(jq -r '.workflow_run.id' "$artifact_file")"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "staging_run_id=$staging_run_id" >> "$GITHUB_OUTPUT"

      - name: Download selected certification artifact by id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_id }}
          path: ${{ runner.temp }}/staging-certification
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.staging_run_id }}
          digest-mismatch: error

      - name: Verify certification payload and GitHub ownership
        env:
          EXPECTED_TREE_SHA: ${{ steps.identity.outputs.tree_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.resolve.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.resolve.outputs.artifact_digest }}
          STAGING_RUN_ID: ${{ steps.resolve.outputs.staging_run_id }}
        run: |
          set -euo pipefail
          certification_dir="${RUNNER_TEMP}/staging-certification"
          mapfile -t files < <(find "$certification_dir" -type f -print)
          [ "${#files[@]}" -eq 1 ] \
            && [ "$(basename "${files[0]}")" = "staging-cloud-certification.json" ] || {
              echo "::error::Certification artifact must contain exactly staging-cloud-certification.json"
              exit 1
            }

          result="$(
            node packages/cloud/scripts/staging-release-certification.mjs verify \
              --cert "${files[0]}" \
              --run-json "${RUNNER_TEMP}/staging-certification-run.json" \
              --artifact-json "${RUNNER_TEMP}/staging-certification-artifact.json" \
              --expected-repository "$EXPECTED_REPOSITORY" \
              --expected-tree-sha "$EXPECTED_TREE_SHA" \
              --workflow-file .github/workflows/cloud-cf-deploy.yml
          )"
          jq -e \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg staging_run_id "$STAGING_RUN_ID" \
            '.artifactId == $artifact_id
              and .artifactDigest == $artifact_digest
              and .runId == $staging_run_id' \
            <<<"$result" >/dev/null
          echo "Staging certification admitted tree ${EXPECTED_TREE_SHA} from run ${STAGING_RUN_ID}, artifact ${ARTIFACT_ID} (${ARTIFACT_DIGEST})." >> "$GITHUB_STEP_SUMMARY"

  authorize-production:
    name: Authorize production environment
    needs: [validate-deploy-source, validate-staging-certification]
    if: ${{ always() && (needs.validate-deploy-source.result == 'success' || needs.validate-deploy-source.result == 'skipped') && needs.validate-staging-certification.result == 'success' && github.event_name != 'pull_request' && ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Approval only. This job must not share a mutation concurrency group, or
    # a waiting reviewer holds the release lock (#18092).
    environment: production
    steps:
      - name: Record production authorization
        run: echo "production environment authorized for this run"

  release:
    name: Mutate and verify Cloud CF release
    needs: [validate-deploy-source, admit-staging, validate-staging-certification, authorize-production]
    if: ${{ always() && github.event_name != 'pull_request' && (((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && (needs.validate-deploy-source.result == 'success' || needs.validate-deploy-source.result == 'skipped') && needs.validate-staging-certification.result == 'success' && needs.authorize-production.result == 'success' || !((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && needs.admit-staging.outputs.should_deploy == 'true') }}
    # One critical section for migrate + API + Pages + routing proof.
    # `queue: max` is GitHub's production-deploy contract: up to 100 approved
    # releases wait instead of the default one-pending eviction. FIFO is by
    # wait-start, not dispatch; ordering is not guaranteed. Incompatible with
    # cancel-in-progress: true (#18092).
    concurrency:
      group: cloud-cf-release-v6-${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }}
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/cloud-cf-release.yml
    secrets: inherit
    with:
      target_environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
      run_deployed_renderer_staging: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deployed_renderer_staging == true }}

  certify-staging-release:
    name: Certify successful staging Cloud tree
    needs: release
    # A superseded release ends neutrally without mutating anything, so its
    # tree was never actually deployed and must not receive a certification.
    # A canonical manual staging dispatch is equally authoritative after the
    # same release and routing checks; supporting it makes intentional pinned
    # releases certifiable when develop is moving faster than hosted runners.
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop' && needs.release.result == 'success' && needs.release.outputs.superseded != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact released staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create tree-bound staging certificate
        id: identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [ "$actual_sha" = "$EXPECTED_SHA" ] || {
            echo "::error::Staging certification checkout resolved ${actual_sha}, expected ${EXPECTED_SHA}"
            exit 1
          }
          [ -z "$(git status --porcelain)" ] || {
            echo "::error::Staging certification checkout is not clean"
            exit 1
          }
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          artifact_name="cloud-staging-certification-v1-${tree_sha}"
          node packages/cloud/scripts/staging-release-certification.mjs create \
            --out staging-cloud-certification.json \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --source-sha "$GITHUB_SHA" \
            --tree-sha "$tree_sha" \
            --artifact-name "$artifact_name" \
            --workflow-file .github/workflows/cloud-cf-deploy.yml
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload immutable staging certification
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: staging-cloud-certification.json
          if-no-files-found: error
          retention-days: 14

      - name: Record certification identity
        env:
          TREE_SHA: ${{ steps.identity.outputs.tree_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Certification upload did not return an artifact id"
            exit 1
          }
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Certification upload did not return a SHA-256 digest"
            exit 1
          }
          echo "Certified staging tree ${TREE_SHA} with artifact ${ARTIFACT_ID} (sha256:${ARTIFACT_DIGEST}) after all release and routing checks passed." >> "$GITHUB_STEP_SUMMARY"

  resolve-pages-preview-config:
    name: Resolve Pages preview configuration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      telegram_bot_id: ${{ steps.telegram.outputs.bot_id }}
      telegram_bot_username: ${{ steps.telegram.outputs.bot_username }}
      whatsapp_phone_number: ${{ steps.whatsapp.outputs.phone_number }}
    steps:
      - name: Resolve public preview defaults
        id: telegram
        env:
          TELEGRAM_BOT_ID: ${{ vars.VITE_TELEGRAM_BOT_ID }}
          TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_ID" && -z "$TELEGRAM_BOT_USERNAME" ]]; then
            TELEGRAM_BOT_ID=7684336618
            TELEGRAM_BOT_USERNAME=Elizav2_Bot
          elif [[ -z "$TELEGRAM_BOT_ID" || -z "$TELEGRAM_BOT_USERNAME" ]]; then
            echo "::error::VITE_TELEGRAM_BOT_ID and VITE_TELEGRAM_BOT_USERNAME must be configured together"
            exit 1
          fi
          [[ "$TELEGRAM_BOT_ID" =~ ^[0-9]+$ ]] || { echo "::error::VITE_TELEGRAM_BOT_ID must be numeric"; exit 1; }
          [[ "$TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z0-9_]+$ ]] || { echo "::error::VITE_TELEGRAM_BOT_USERNAME must be a Telegram username without @"; exit 1; }
          echo "bot_id=$TELEGRAM_BOT_ID" >> "$GITHUB_OUTPUT"
          echo "bot_username=$TELEGRAM_BOT_USERNAME" >> "$GITHUB_OUTPUT"

      - name: Resolve public WhatsApp configuration
        id: whatsapp
        env:
          WHATSAPP_PUBLIC_ENABLED: ${{ vars.WHATSAPP_PUBLIC_ENABLED }}
          WHATSAPP_PHONE_NUMBER: ${{ vars.VITE_WHATSAPP_PHONE_NUMBER }}
        run: |
          set -euo pipefail
          enabled="$(printf '%s' "$WHATSAPP_PUBLIC_ENABLED" | tr '[:upper:]' '[:lower:]')"
          case "$enabled" in
            ""|0|false|no|off)
              echo "phone_number=" >> "$GITHUB_OUTPUT"
              ;;
            1|true|yes|on)
              [[ "$WHATSAPP_PHONE_NUMBER" =~ ^\+[1-9][0-9]{7,14}$ ]] || { echo "::error::VITE_WHATSAPP_PHONE_NUMBER must be an E.164 number when WHATSAPP_PUBLIC_ENABLED is true"; exit 1; }
              case "$WHATSAPP_PHONE_NUMBER" in
                +14155238886|+15551649988|+14159611510)
                  echo "::error::The public WhatsApp CTA cannot use a shared sandbox, developer test, or unverified sender"
                  exit 1
                  ;;
              esac
              echo "phone_number=$WHATSAPP_PHONE_NUMBER" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::WHATSAPP_PUBLIC_ENABLED must be a boolean"
              exit 1
              ;;
          esac

  build-pages:
    name: Build Pages artifacts
    needs: [resolve-pages-preview-config]
    if: ${{ github.event_name == 'pull_request' && needs.resolve-pages-preview-config.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub preserves outputs from successful jobs when only failed jobs are
    # rerun. Consumers must therefore use the producer's attempt, not their own
    # newer github.run_attempt. A full rerun executes this job again and emits
    # the new attempt, so its deploy jobs consume the newly built artifacts.
    outputs:
      artifact_run_id: ${{ steps.pages-artifact.outputs.run_id }}
      artifact_run_attempt: ${{ steps.pages-artifact.outputs.run_attempt }}
      artifact_source_sha: ${{ steps.pages-artifact.outputs.source_sha }}
      telegram_bot_id: ${{ needs.resolve-pages-preview-config.outputs.telegram_bot_id }}
      telegram_bot_username: ${{ needs.resolve-pages-preview-config.outputs.telegram_bot_username }}
    steps:
      - name: Validate PR preview identity
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Pull-request Pages branch requires a valid immutable PR number"
            exit 1
          fi
          pages_branch="pr-${PR_NUMBER}"
          case "$pages_branch" in
            main|develop)
              echo "::error::Pull-request Pages branch may not target canonical branch $pages_branch"
              exit 1
              ;;
          esac
          echo "Pages artifacts are bound to trusted preview branch ${pages_branch}." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bind Pages artifacts to this producer attempt
        id: pages-artifact
        env:
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "run_id=$PRODUCER_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$PRODUCER_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$PRODUCER_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build linked elizaOS core workspace once
        run: bun run build:core

      - name: Build consolidated frontend artifact
        run: bun run --cwd packages/app build:web
        env:
          VITE_TELEGRAM_BOT_ID: ${{ needs.resolve-pages-preview-config.outputs.telegram_bot_id }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ needs.resolve-pages-preview-config.outputs.telegram_bot_username }}
          VITE_WHATSAPP_PHONE_NUMBER: ${{ needs.resolve-pages-preview-config.outputs.whatsapp_phone_number }}
          VITE_API_URL: https://api-staging.eliza.app
          NEXT_PUBLIC_API_URL: https://api-staging.eliza.app
          VITE_OIDC_ISSUER_URL: https://api-staging.eliza.app
          VITE_ELIZA_CLOUD_BASE: https://cloud-staging.eliza.app
          VITE_APP_URL: https://staging.eliza.app
          NEXT_PUBLIC_APP_URL: https://cloud-staging.eliza.app
          VITE_ELIZA_APP_URL: https://cloud-staging.eliza.app
          VITE_STEWARD_TENANT_ID: elizacloud-staging
          NEXT_PUBLIC_STEWARD_TENANT_ID: elizacloud-staging
          VITE_ENVIRONMENT: staging
          VITE_VOICE_REALTIME_WS: ${{ contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.VOICE_REALTIME_WS_ENABLED) && '1' || '0' }}
          VITE_VOICE_REALTIME_FORCE: "0"
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}

      - name: Verify frontend chunk safety
        run: bun run --cwd packages/app verify:chunks

      - name: Upload consolidated frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pages-app-${{ steps.pages-artifact.outputs.run_id }}-${{ steps.pages-artifact.outputs.run_attempt }}
          path: |
            packages/app/dist
            packages/app/functions
            packages/app/wrangler.toml
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Consolidated frontend — packages/app at eliza.app and cloud.eliza.app.
  # The same host-aware bundle serves marketing, auth, cloud management, and the
  # managed Eliza agent app from the single `eliza-app` Pages project.
  # ---------------------------------------------------------------------------
