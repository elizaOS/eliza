name: Cloud CF Deploy

# Cloudflare deployment for the consolidated Eliza frontend and Workers API.
#
# One packages/app build is deployed to the `eliza-app` Pages project. Host-aware
# routing serves the public homepage on eliza.app and the managed agent/cloud
# experience on cloud.eliza.app. Legacy elizacloud.ai hosts are Worker-owned
# redirect inputs and never receive a separately built frontend.
#
# Per environment:
# - push to develop  -> staging   (staging.eliza.app, cloud-staging.eliza.app,
#                                   api-staging.eliza.app)
# - push to main     -> production (eliza.app, cloud.eliza.app, api.eliza.app)
# - pull_request     -> build isolated Pages artifacts without credentials;
#                       `.github/workflows/cloud-cf-pr-preview-deploy.yml`
#                       performs the trusted `pr-<number>` deployment afterward.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   - account-scoped token with Workers + Pages edit perms
#   CLOUDFLARE_ACCOUNT_ID  - matches account_id in packages/cloud/api/wrangler.toml
# Shared Worker/control-plane secrets are published only when the selected
# GitHub environment explicitly configures them. An absent GitHub value never
# deletes or overwrites an existing Worker binding; a post-deploy names-only
# inventory gate verifies the required bindings without reading their values.
# Provider secrets are published when configured (the Worker calls native
# providers directly and uses OpenRouter as the backup):
#   OPENROUTER_API_KEY, CEREBRAS_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY,
#   GROQ_API_KEY, FAL_KEY, ELEVENLABS_API_KEY,
#   CARTESIA_API_KEY, CARTESIA_VOICE_ID, FISH_AUDIO_API_KEY,
#   FISH_AUDIO_REFERENCE_ID, VAST_API_KEY, VAST_BASE_URL.
# Media/voice secrets, likewise published when configured (#13406):
#   FAL_API_KEY (the video provider registry reads FAL_KEY ?? FAL_API_KEY),
#   CARTESIA_API_KEY (secret) + CARTESIA_VOICE_ID (from
#   vars.ELIZA_VOICE_CARTESIA_VOICE_ID) for first-class Cartesia cloud TTS,
#   FISH_AUDIO_API_KEY + FISH_AUDIO_REFERENCE_ID for the independently gated
#   Fish Audio realtime primary (Cartesia remains its fallback),
#   ELIZA_VOICE_CATALOG_SIGNING_KEY_BASE64 + ELIZA_VOICE_CATALOG_PUBLIC_KEY_BASE64
#   (Ed25519 keypair for the signed voice-model catalog; the catalog route 503s
#   while the signing key is unset).
#
# Consolidated from the original standalone Cloud deployment workflow.

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/cloud/api/**"
      - "packages/cloud/shared/**"
      - "packages/cloud/services/**"
      - "packages/cloud/sdk/**"
      - "packages/cloud/scripts/**"
      - "packages/app/**"
      - "packages/app-core/**"
      - "packages/homepage/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - ".github/workflows/cloud-cf-deploy.yml"
      - ".github/workflows/cloud-cf-pr-preview-deploy.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/cloud/api/**"
      - "packages/cloud/shared/**"
      - "packages/cloud/services/**"
      - "packages/cloud/sdk/**"
      - "packages/cloud/scripts/**"
      - "packages/app/**"
      - "packages/app-core/**"
      - "packages/homepage/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - ".github/workflows/cloud-cf-deploy.yml"
      - ".github/workflows/cloud-cf-pr-preview-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      force:
        # Bypass the deploy freshness guard (#14083). The guard SKIPS a deploy
        # when this run's SHA is an ancestor of the currently-served build (a
        # stale zombie run clobbering a newer bundle — #14082). Set force=true
        # for an INTENTIONAL rollback to an older ref.
        description: Bypass the freshness guard (intentional rollback to an older ref)
        required: false
        default: false
        type: boolean

concurrency:
  # Production releases remain a FIFO, queue-never-cancel stream. Staging
  # approval happens in a separate, non-secret environment before any shared
  # mutation lock is acquired, so each staging SHA gets an independent workflow
  # group and cannot head-of-line block a newer approval.
  # The v4 suffix retires the wedged v3 groups: a stale 2026-05-15 queued run
  # (25907128646) wedged v3-staging admission, so dispatched staging deploys sat
  # pending with zero jobs while cancel and force-cancel both returned HTTP 500.
  # Same retirement pattern as v2 -> v3; cancel stale deploys instead of
  # rejecting environment gates.
  group: cloud-cf-deploy-v4-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || format('staging-{0}', github.sha)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  validate-deploy-source:
    name: Validate Canonical Deploy Source
    # Push and pull-request refs are constrained by the trigger itself. Only a
    # manual dispatch can select an invalid ref, so automatic releases should
    # not wait for a hosted runner merely to execute an unconditional exit 0.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject feature refs targeting canonical environments
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            exit 0
          fi

          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            expected_ref="refs/heads/main"
          else
            expected_ref="refs/heads/develop"
          fi

          if [ "$SOURCE_REF" != "$expected_ref" ]; then
            echo "::error::Canonical $TARGET_ENVIRONMENT deploys must run from $expected_ref, not $SOURCE_REF. Use the pull-request Pages preview for feature refs."
            exit 1
          fi

  admit-staging:
    name: Authorize and admit staging release
    needs: validate-deploy-source
    if: ${{ always() && (needs.validate-deploy-source.result == 'success' || needs.validate-deploy-source.result == 'skipped') && github.event_name != 'pull_request' && !((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    outputs:
      should_deploy: ${{ steps.admission.outputs.should_deploy }}
    # This environment contains only deployment policy. Runtime secrets remain
    # in `staging`, whose jobs are reached only after this gate and admission
    # check. Keeping approval outside every shared concurrency group prevents a
    # reviewer wait from owning a deployment lock.
    environment: staging-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject superseded staging SHA before work starts
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          set -euo pipefail

          latest_eligible_run_id=""
          if [ "$EVENT_NAME" != "pull_request" ] \
            && [ "$TARGET_ENVIRONMENT" != "production" ] \
            && [ "$GITHUB_REF" != "refs/heads/main" ] \
            && [ "$FORCE" != "true" ]; then
            latest_eligible_run_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/cloud-cf-deploy.yml/runs?branch=develop&event=push&per_page=1" \
                --jq '.workflow_runs[0].id'
            )"
          fi

          node packages/cloud/scripts/release-admission-cli.mjs \
            "--event=$EVENT_NAME" \
            "--environment=$TARGET_ENVIRONMENT" \
            "--ref=$GITHUB_REF" \
            "--force=$FORCE" \
            "--run-id=$GITHUB_RUN_ID" \
            "--latest-eligible-run-id=$latest_eligible_run_id"

          if [ "$GITHUB_RUN_ID" != "$latest_eligible_run_id" ] \
            && [ -n "$latest_eligible_run_id" ]; then
            echo "Superseded staging release: run=$GITHUB_RUN_ID latest=$latest_eligible_run_id" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Database migrations — the schema gate for every deploy job below (#11208).
  #
  # Prod refreshes via a workflow_dispatch of THIS workflow, but migrate-db
  # is kept in this deployment authority so
  # a refresh shipped new Worker/Pages code against whatever schema prod
  # happened to have. Every deploy job below now `needs: migrate-db`, which
  # guarantees migrations run AND succeed before any new code serves traffic:
  #   - no pending migrations -> the journal-based migrator is a no-op that
  #     exits 0, so migration-free deploys still ship;
  #   - failed migration      -> migrate-db fails -> every deploy job is
  #     skipped (fail-closed; there is no path that deploys on failure);
  #   - pull_request          -> migrate-db is skipped; the Pages preview jobs
  #     explicitly allow that one case (previews are frontend-only builds
  #     pointed at the staging API and run without repo secrets anyway).
  # ---------------------------------------------------------------------------
  migrate-db:
    name: Run Database Migrations
    needs: [validate-deploy-source, admit-staging]
    if: ${{ always() && github.event_name != 'pull_request' && (((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && (needs.validate-deploy-source.result == 'success' || needs.validate-deploy-source.result == 'skipped') || (!((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && needs.admit-staging.outputs.should_deploy == 'true')) }}
    # Hosted unconditionally: CI must never contend with production
    # agent-placement nodes for disk or CPU (#17881).
    runs-on: ubuntu-latest
    # Job-level concurrency groups are repo-wide, so this also serializes
    # against an explicitly dispatched legacy cloud-deploy-backend migration.
    # The v2 suffix retires the un-versioned group: the same stale 2026-05-15
    # queued run (25907128646) that wedged the workflow-level v3 group also
    # pins cloud-db-migrate-staging, so migration jobs sat pending forever
    # while cancel/force-cancel returned HTTP 500 (see #16705).
    concurrency:
      group: cloud-db-migrate-v2-${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }}
      cancel-in-progress: false
    environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }}
    timeout-minutes: 10
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.RAILWAY_DATABASE_URL || secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Pin the canonical released toolchain: floating `latest` first calls
          # GitHub's tags API, making deploys fail before setup during an API
          # outage, while canary has also hung in the link phase (#10839).
          bun-version: "1.3.14"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 3 ]; then
              bun install --frozen-lockfile --no-save --ignore-scripts --verbose && exit 0
            else
              bun install --frozen-lockfile --no-save --ignore-scripts && exit 0
            fi

            echo "bun install attempt $attempt failed; retrying in 10s..."
            sleep 10
          done

          exit 1

      - name: Fail fast when database secret is missing
        if: ${{ env.MIGRATION_DATABASE_URL == '' }}
        run: |
          # A missing secret must fail the deploy, not silently skip the
          # migration — otherwise new code ships against a stale schema
          # (the exact #11208 landmine, and the pre-2026-05-20 silent-skip
          # regression in cloud-deploy-backend before it).
          echo "::error::DATABASE_URL / RAILWAY_DATABASE_URL / NEON_DATABASE_URL secret is missing on this environment. The schema cannot be migrated, so the Worker would deploy against a stale DB."
          echo "Add the secret in: Settings → Environments → Environment secrets."
          exit 1

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
        run: |
          # The migrate entry imports @elizaos/core, whose i18n barrel pulls in the
          # gitignored generated keyword data. Source-mode (eliza-source) migrate
          # never builds core, so generate the file first (mirrors core's prebuild).
          node packages/shared/scripts/generate-keywords.mjs
          bun run db:cloud:migrate

  # ---------------------------------------------------------------------------
  # API Worker
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API Worker
    # Scope the job to the same GitHub environment as migrate-db so its
    # production-environment secrets — notably STEWARD_PLATFORM_KEYS (#11461) —
    # are visible to the publish-secrets step. Without this the un-scoped job
    # only saw repo secrets, so `publish_secret` skipped the key and a redeploy
    # would silently recreate the #11461 tenant-isolation gap (#11937). Mirrors
    # the proven migrate-db declaration exactly (same protection semantics).
    environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }}
    # A production Worker deploy must never be cancelled mid-flight by a newer
    # main promote (#11640): the workflow-level group did not protect the
    # in-flight job, so rapid promotes cancelled every Worker deploy and prod
    # ran stale code. Job-level concurrency groups are repo-wide, so a per-env
    # group with cancel-in-progress:false serializes deploys ACROSS runs (queue,
    # never cancel) — same protection migrate-db already has.
    concurrency:
      group: cloud-cf-deploy-api-${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }}
      cancel-in-progress: false
    # Hosted unconditionally to preserve CI/placement workload separation.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Schema gate (#11208): the Worker talks to the database, so it only
    # deploys after migrate-db succeeded for this same commit. A failed or
    # cancelled migrate-db skips this job — fail-closed.
    needs: migrate-db
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.migrate-db.result == 'success' }}
    env:
      CHECKOUT_DIR: /tmp/eliza-checkout-${{ github.run_id }}-${{ github.run_attempt }}-deploy-api
      CHECKOUT_MATERIALIZE_TIMEOUT_SECONDS: ${{ vars.CLOUD_CF_CHECKOUT_MATERIALIZE_TIMEOUT_SECONDS || '600' }}
    steps:
      - name: Reclaim disk from leaked checkouts of prior runs
        continue-on-error: true
        run: |
          # Cancelled/killed deploy runs never reach the trailing "Clean temp
          # checkout" step, so their /tmp/eliza-checkout-* trees (a full ~46k-file
          # monorepo materialization) leak and pile up on this shared self-hosted
          # box until disk/inodes are exhausted and materialization times out —
          # freezing prod (elizaOS/eliza#10839). Reclaim leaked trees, but ONLY
          # ones idle >90 min: a real deploy job runs <~50 min and self-cleans, so
          # a dir untouched for 90 min is a definitively-dead leak.
          # CONCURRENCY-SAFE: API, console, and app jobs within one release still
          # materialize concurrently, and PR previews use independent groups. The
          # age filter never deletes an actively-written checkout (its mtime stays
          # fresh), and we also exclude this run's own dirs by name.
          # UNFAILABLE BY CONSTRUCTION: sibling runs execute this same step at the
          # same moment, so one sibling's rm -rf can race another's find into
          # ENOENT (exit 1) — under the job's default `bash -e` (plus the pipefail
          # this step previously set) that killed whole deploy jobs at step one.
          # set +e swallows every failure mode, exit 0 guarantees the step, and
          # continue-on-error guards future edits.
          set +e
          set +o pipefail
          find_stale_checkouts() {
            timeout 20s find /tmp -maxdepth 1 -type d \
              -name 'eliza-checkout-*' \
              -mmin +90 \
              ! -name "eliza-checkout-${{ github.run_id }}-*" \
              2>/dev/null || true
          }
          mapfile -t stale_dirs < <(find_stale_checkouts)
          stale=${#stale_dirs[@]}
          moved=0
          index=0
          for dir in "${stale_dirs[@]}"; do
            index=$((index + 1))
            stale_dir="/tmp/eliza-stale-checkout-${GITHUB_RUN_ID:-run}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-job}-${index}"
            if mv "$dir" "$stale_dir" 2>/dev/null; then
              moved=$((moved + 1))
              nohup bash -c 'timeout 180s rm -rf "$1" || true' _ "$stale_dir" >/dev/null 2>&1 &
            fi
          done
          echo "Scheduled background cleanup for ${moved}/${stale:-0} stale (idle >90min) leaked checkout dir(s)."
          df -h /tmp / 2>/dev/null | tail -2
          exit 0
      - name: Checkout repository
        timeout-minutes: 20
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        working-directory: /tmp
        run: |
          set -euo pipefail
          init_checkout_dir() {
            mkdir -p "$CHECKOUT_DIR"
            git init -q "$CHECKOUT_DIR"
            git -C "$CHECKOUT_DIR" remote set-url origin "https://x-access-token:${CHECKOUT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null \
              || git -C "$CHECKOUT_DIR" remote add origin "https://x-access-token:${CHECKOUT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          }
          init_checkout_dir
          # Shared, heavily-loaded self-hosted box (wrangler dev + PGlite + the full
          # Worker suite): a single shallow fetch can stall for minutes or wedge
          # entirely. Retry with a per-attempt timeout so a stuck fetch aborts and
          # retries instead of burning the whole step budget (the #10310 stuck-checkout).
          # http.version=HTTP/1.1: with 3 deploy jobs fetching this
          # large repo concurrently on one loaded box, HTTP/2 fetches die with
          # `RPC failed; curl 92 ... stream was not closed cleanly: CANCEL` /
          # `early EOF` / `fetch-pack: invalid index-pack output` (observed run
          # 28544777730, both attempts). HTTP/1.1 avoids the h2 stream-reset
          # path entirely at negligible cost for a single-stream shallow fetch.
          fetched=
          for attempt in 1 2 3; do
            if timeout 420s git -C "$CHECKOUT_DIR" -c protocol.version=2 -c http.version=HTTP/1.1 fetch --force --no-tags --depth=1 origin "$GITHUB_SHA"; then
              fetched=1
              break
            fi
            echo "::warning::checkout fetch attempt ${attempt} stalled or failed; retrying"
            if [ "$attempt" -lt 3 ]; then
              rm -rf "$CHECKOUT_DIR"
              sleep 10
              init_checkout_dir
            fi
          done
          [ -n "$fetched" ] || { echo "::error::git fetch failed after 3 attempts"; exit 1; }
          # checkout --force --detach fully materializes the working tree from the
          # fetched commit; the prior extra `git reset --hard` re-wrote the entire
          # tree a second time, doubling the slowest part on this large repo. Keep
          # this bounded, but give the large monorepo enough time on busy deploy
          # runners and let Git parallelize path materialization when supported.
          timeout "${CHECKOUT_MATERIALIZE_TIMEOUT_SECONDS}s" \
            git -C "$CHECKOUT_DIR" \
              -c checkout.workers=8 \
              -c checkout.thresholdForParallelism=100 \
              checkout --force --detach FETCH_HEAD \
            || { echo "::error::git checkout (working-tree materialization) timed out or failed after ${CHECKOUT_MATERIALIZE_TIMEOUT_SECONDS}s"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Pinned off `canary`: canary's link phase hangs on the self-hosted
          # runners (bun install resolves+extracts in ~2min then stalls past the
          # 900s cap, ×3 retries), stranding prod deploys — observed on runs
          # 28552075615 and 28569068598 (the money-integrity wave). A released
          # Bun 1.3.14 does not exhibit the hang and avoids the floating-tag API
          # lookup during setup. See elizaOS/eliza#10839.
          bun-version: "1.3.14"

      - name: Install API dependencies
        working-directory: ${{ env.CHECKOUT_DIR }}
        # The shared self-hosted deploy box can stall or kill a single bun
        # install mid-flight (contended cache/IO), which surfaced as a
        # "cancelled" install step failing an otherwise-green deploy while every
        # sibling deploy job on the same run succeeded. Retry with a per-attempt
        # timeout so a stuck/killed install aborts and retries instead of failing
        # the deploy — the same resilience the checkout step already uses (#10310).
        # The cap must exceed the box's real worst-case SLOW install, not just
        # catch hangs: healthy installs here run ~190-300s+ (run 28532809562's
        # first attempt already blew a 300s cap and only survived via retry),
        # and on 2026-07-01 run 28545551059 failed 3/3 attempts at a 300s cap
        # while making real progress — wedging prod for hours (#10839). 900s
        # matches CHECKOUT_MATERIALIZE_TIMEOUT_SECONDS; a true hang still aborts.
        run: |
          set -euo pipefail
          # Cache on LOCAL disk ($HOME), not under $PWD — the checkout dir lives
          # on the box's /tmp, whose contended/slow filesystem stalls bun's link
          # phase past the 900s cap and wedges deploys (bun itself logs "Slow
          # filesystem detected ... consider setting $BUN_INSTALL_CACHE_DIR to a
          # local folder"). This is the real fix; the earlier canary→latest pin
          # (#11235) did not address it — the hang recurs on a released bun too
          # (run 28572046433). Persistent across runs so the cache stays warm.
          install_cache="${HOME}/.bun-install-cache-deploy"
          install_timeout="${BUN_INSTALL_TIMEOUT_SECONDS:-2400}"
          for attempt in 1 2 3; do
            test -f package.json || { echo "::error::package.json missing from $PWD"; ls -la; exit 1; }
            mkdir -p "$install_cache"
            if timeout "${install_timeout}s" bun install --frozen-lockfile --no-save --ignore-scripts --cache-dir "$install_cache"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::bun install failed after ${attempt} attempts"
              exit 1
            fi
            echo "::warning::bun install attempt ${attempt} timed out (>${install_timeout}s) or failed; retrying"
            # Keep the download cache warm for the retry — the timeout bites in
            # the link phase, not download, and a cold cache makes the retry
            # SLOWER (more likely to time out again). Nuke it only before the
            # final attempt so a corrupted cache entry can't fail all three.
            rm -rf node_modules
            if [ "$attempt" -eq 2 ]; then rm -rf "$install_cache"; fi
          done
          git diff --exit-code -- bun.lock

      - name: Build linked elizaOS workspaces
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bun run build:core

      - name: Verify Worker
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bun run --cwd packages/cloud/api typecheck

      - name: Run Worker e2e
        # Hard deploy gate (#13618): Worker behavior regressions must fail the
        # deploy instead of shipping behind a green soft-failed e2e step.
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bun run --cwd packages/cloud/api test:e2e
        env:
          # The deploy runner is a shared self-hosted box running wrangler dev,
          # PGlite, and the full Worker suite. Keep release gating tolerant of
          # runner load without enabling live external Steward side effects.
          TEST_REQUEST_TIMEOUT_MS: "60000"
          RUN_STEWARD_WALLET_E2E: "0"

      - name: Build
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bun run --cwd packages/cloud/api build

      - name: Resolve deploy environment
        id: env
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" = "production" ]; then
            echo "wrangler_args=--env production" >> "$GITHUB_OUTPUT"
            echo "deploy_environment=production" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "wrangler_args=--env staging" >> "$GITHUB_OUTPUT"
            echo "deploy_environment=staging" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "wrangler_args=--env production" >> "$GITHUB_OUTPUT"
            echo "deploy_environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "wrangler_args=--env staging" >> "$GITHUB_OUTPUT"
            echo "deploy_environment=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Cloudflare credentials
        id: cf
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            MSG="CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID not configured. Add them at https://github.com/elizaOS/eliza/settings/secrets/actions."
            if [ "$EVENT_NAME" = "pull_request" ]; then
              # PRs from forks legitimately lack access to repo secrets.
              echo "::warning::$MSG Skipping Worker deploy (PR event)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$MSG Refusing to silently skip Worker deploy on $EVENT_NAME event." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$MSG Refusing to silently skip Worker deploy on $EVENT_NAME event."
              exit 1
            fi
          fi

      # Freshness must be resolved BEFORE any Worker secret mutation. A stale
      # zombie run is not allowed to toggle the currently served QA auth
      # surface even when its eventual code deploy would have been skipped.
      - name: Deploy freshness guard
        id: freshness
        if: steps.cf.outputs.configured == 'true'
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          SERVED_URL: ${{ steps.env.outputs.deploy_environment == 'production' && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          args=(--run-sha "$GITHUB_SHA" --served-url "$SERVED_URL" --served-path /api/health)
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          node packages/cloud/scripts/deploy-freshness-guard-cli.mjs "${args[@]}"

      - name: Validate canonical routing contract
        if: steps.cf.outputs.configured == 'true' && steps.freshness.outputs.should_deploy == 'true'
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          TARGET_ENVIRONMENT: ${{ steps.env.outputs.deploy_environment }}
          API_ORIGIN: ${{ steps.env.outputs.deploy_environment == 'production' && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
          MARKETING_ORIGIN: ${{ steps.env.outputs.deploy_environment == 'production' && 'https://eliza.app' || 'https://staging.eliza.app' }}
          CLOUD_APP_ORIGIN: ${{ steps.env.outputs.deploy_environment == 'production' && 'https://cloud.eliza.app' || 'https://cloud-staging.eliza.app' }}
          AGENT_BASE_DOMAIN: ${{ steps.env.outputs.deploy_environment == 'production' && 'cloud.eliza.app' || 'cloud-staging.eliza.app' }}
          HEADSCALE_ORIGIN: ${{ steps.env.outputs.deploy_environment == 'production' && 'https://headscale.eliza.app' || 'https://headscale-staging.eliza.app' }}
          RELAY_ORIGIN: ${{ steps.env.outputs.deploy_environment == 'production' && 'https://relay.eliza.app' || 'https://relay-staging.eliza.app' }}
        run: |
          set -euo pipefail

          require_exact() {
            local name="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$name does not match the canonical $TARGET_ENVIRONMENT routing contract"
              exit 1
            fi
          }

          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            require_exact API_ORIGIN "$API_ORIGIN" "https://api.eliza.app"
            require_exact MARKETING_ORIGIN "$MARKETING_ORIGIN" "https://eliza.app"
            require_exact CLOUD_APP_ORIGIN "$CLOUD_APP_ORIGIN" "https://cloud.eliza.app"
            require_exact AGENT_BASE_DOMAIN "$AGENT_BASE_DOMAIN" "cloud.eliza.app"
            require_exact HEADSCALE_ORIGIN "$HEADSCALE_ORIGIN" "https://headscale.eliza.app"
            require_exact RELAY_ORIGIN "$RELAY_ORIGIN" "https://relay.eliza.app"
          else
            require_exact API_ORIGIN "$API_ORIGIN" "https://api-staging.eliza.app"
            require_exact MARKETING_ORIGIN "$MARKETING_ORIGIN" "https://staging.eliza.app"
            require_exact CLOUD_APP_ORIGIN "$CLOUD_APP_ORIGIN" "https://cloud-staging.eliza.app"
            require_exact AGENT_BASE_DOMAIN "$AGENT_BASE_DOMAIN" "cloud-staging.eliza.app"
            require_exact HEADSCALE_ORIGIN "$HEADSCALE_ORIGIN" "https://headscale-staging.eliza.app"
            require_exact RELAY_ORIGIN "$RELAY_ORIGIN" "https://relay-staging.eliza.app"
          fi

      - name: Disable staging session exchange before cutover
        if: steps.cf.outputs.configured == 'true' && steps.freshness.outputs.should_deploy == 'true' && steps.env.outputs.deploy_environment == 'staging'
        working-directory: ${{ env.CHECKOUT_DIR }}/packages/cloud/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if output=$(bunx wrangler secret delete STAGING_SESSION_EXCHANGE_ENABLED --env staging 2>&1); then
              echo "Staging session exchange is off before config validation or deploy."
              exit 0
            fi
            if printf '%s' "$output" | grep -qi "not found"; then
              echo "Staging session exchange was already off before cutover."
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          echo "::error::Could not confirm staging session exchange is off before cutover"
          exit 1

      - name: Publish Worker AI secrets
        if: steps.cf.outputs.configured == 'true' && steps.freshness.outputs.should_deploy == 'true'
        working-directory: ${{ env.CHECKOUT_DIR }}/packages/cloud/api
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.RAILWAY_DATABASE_URL || secrets.NEON_DATABASE_URL }}
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
          CONTAINERS_SSH_KEY: ${{ secrets.CONTAINERS_SSH_KEY }}
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
          TUNNEL_HOSTNAME_SIGNING_SECRET: ${{ secrets.TUNNEL_HOSTNAME_SIGNING_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          # fal key under its alternate name: the video provider registry reads
          # FAL_KEY ?? FAL_API_KEY, and prod carries it as FAL_API_KEY (#13406).
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Deepgram is retained only for the explicitly selected prerecorded
          # STT path. Realtime voice uses Cartesia Ink; publishing this key alone
          # does not change the batch provider.
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          # Cartesia cloud TTS default route. Both are routing toggles:
          # CARTESIA_API_KEY presence makes default/unpinned TTS use Cartesia;
          # CARTESIA_VOICE_ID overrides the built-in safe UUID.
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID: ${{ vars.ELIZA_VOICE_CARTESIA_VOICE_ID }}
          # Fish is an independently gated realtime primary. Its credentials
          # are published only while both realtime voice and the Fish opt-in
          # are enabled; Cartesia remains required as the fallback.
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_REFERENCE_ID: ${{ secrets.FISH_AUDIO_REFERENCE_ID }}
          ELIZA_TTS_FISH_ENABLED: ${{ steps.env.outputs.deploy_environment != 'production' && contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.ELIZA_TTS_FISH_ENABLED) && 'true' || 'false' }}
          FISH_AUDIO_DATA_GOVERNANCE_APPROVED: ${{ steps.env.outputs.deploy_environment != 'production' && contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.FISH_AUDIO_DATA_GOVERNANCE_APPROVED) && 'true' || 'false' }}
          FISH_AUDIO_MODEL: ${{ vars.FISH_AUDIO_MODEL || 's2.1-pro' }}
          # The realtime downlink contract is PCM16 mono at exactly 16 kHz.
          FISH_AUDIO_SAMPLE_RATE: "16000"
          FISH_AUDIO_FIRST_AUDIO_TIMEOUT_MS: ${{ vars.FISH_AUDIO_FIRST_AUDIO_TIMEOUT_MS || '1500' }}
          # Self-hosted Whisper STT base URL (OpenAI-compatible
          # /v1/audio/transcriptions). When set, /api/v1/voice/stt uses free
          # Whisper instead of billed ElevenLabs Scribe. Sourced from the same
          # repo VARIABLE the voice-live-e2e workflow reads, so CI and the
          # deployed Worker always point at the same Whisper host. Without
          # this the Worker falls through to ElevenLabs, whose free-tier quota
          # block surfaces as a persistent 503 on STT (and 502 through the
          # agent's /api/asr/cloud proxy). Published via publish_toggle_secret:
          # unset DELETES the Worker secret (presence toggles the route).
          WHISPER_STT_URL: ${{ vars.ELIZA_VOICE_WHISPER_STT_URL }}
          # Optional model pin for the hosted Whisper service (defaults to
          # Systran/faster-whisper-small in code — #14511).
          WHISPER_STT_MODEL: ${{ vars.ELIZA_VOICE_WHISPER_STT_MODEL }}
          # Environment-scoped opt-in for prerecorded Deepgram STT. Production
          # remains on its existing provider while this variable is unset.
          VOICE_BATCH_STT_PROVIDER: ${{ vars.VOICE_BATCH_STT_PROVIDER }}
          # Ed25519 keypair for the signed voice-model catalog —
          # /v1/voice-models/catalog 503s while the signing key is unset
          # (#13406). publish_secret no-ops with a notice while these are
          # unset, so they publish on every redeploy once ops adds them.
          ELIZA_VOICE_CATALOG_SIGNING_KEY_BASE64: ${{ secrets.ELIZA_VOICE_CATALOG_SIGNING_KEY_BASE64 }}
          ELIZA_VOICE_CATALOG_PUBLIC_KEY_BASE64: ${{ secrets.ELIZA_VOICE_CATALOG_PUBLIC_KEY_BASE64 }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          VAST_BASE_URL: ${{ secrets.VAST_BASE_URL }}
          DEPLOY_ENVIRONMENT: ${{ steps.env.outputs.deploy_environment }}
          VOICE_REALTIME_WS_ENABLED: ${{ steps.env.outputs.deploy_environment != 'production' && contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.VOICE_REALTIME_WS_ENABLED) && 'true' || 'false' }}
          # Keep this mirror locked to wrangler.toml's env.production value.
          # The workflow contract test fails if they drift.
          PRODUCTION_REALTIME_WS_ENABLED: "false"
          # Production intentionally omits these runtime vars while realtime is
          # off. Their mirrors are also contract-locked to wrangler.toml so a
          # future enable cannot deploy a credential-complete but 503-only route.
          PRODUCTION_REALTIME_CARTESIA_VOICE_ID: ""
          PRODUCTION_REALTIME_ELIZA_ENDPOINT: ""
          VOICE_REALTIME_ELIZA_AUTHORIZATION: ${{ secrets.VOICE_REALTIME_ELIZA_AUTHORIZATION }}
          # Staging may use its existing Cloud key for the Worker-to-gateway
          # voice bridge. Production MUST use the dedicated authorization and
          # can never fall back to a repository-wide Cloud key.
          STAGING_ELIZACLOUD_API_KEY: ${{ steps.env.outputs.deploy_environment == 'staging' && secrets.ELIZACLOUD_API_KEY || '' }}
          # Disabled-by-default staging QA browser-session bridge. Desired
          # state is NOT published directly: the step first forces the live
          # gate off, publishes the versioned config, and activation happens
          # only after exact-commit deploy proof.
          STAGING_SESSION_EXCHANGE_DESIRED_ENABLED: ${{ steps.env.outputs.deploy_environment == 'staging' && contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.STAGING_SESSION_EXCHANGE_ENABLED) && 'true' || 'false' }}
          STAGING_SESSION_EXCHANGE_VERSION: "v1"
          STAGING_SESSION_EXCHANGE_SIGNING_SECRET: ${{ steps.env.outputs.deploy_environment == 'staging' && secrets.STAGING_SESSION_EXCHANGE_SIGNING_SECRET || '' }}
          # Value is used only for collision validation; this workflow does not
          # publish or mutate the pre-existing service bridge credential.
          ELIZA_SERVICE_JWT_SECRET: ${{ steps.env.outputs.deploy_environment == 'staging' && secrets.ELIZA_SERVICE_JWT_SECRET || '' }}
          STAGING_SESSION_EXCHANGE_SIGNING_KEY_ID: ${{ steps.env.outputs.deploy_environment == 'staging' && vars.STAGING_SESSION_EXCHANGE_SIGNING_KEY_ID || '' }}
          STAGING_SESSION_EXCHANGE_ALLOWED_API_KEY_IDS: ${{ steps.env.outputs.deploy_environment == 'staging' && vars.STAGING_SESSION_EXCHANGE_ALLOWED_API_KEY_IDS || '' }}
          STAGING_SESSION_EXCHANGE_ALLOWED_USER_IDS: ${{ steps.env.outputs.deploy_environment == 'staging' && vars.STAGING_SESSION_EXCHANGE_ALLOWED_USER_IDS || '' }}
          STAGING_SESSION_EXCHANGE_ALLOWED_ORGANIZATION_IDS: ${{ steps.env.outputs.deploy_environment == 'staging' && vars.STAGING_SESSION_EXCHANGE_ALLOWED_ORGANIZATION_IDS || '' }}
          # Core Steward/OIDC bindings are preserved when their protected
          # GitHub source is not yet backfilled, then names-only verified after
          # deploy. Once configured, this step converges them on every release.
          STEWARD_API_URL: ${{ secrets.STEWARD_API_URL }}
          STEWARD_JWT_SECRET: ${{ secrets.STEWARD_JWT_SECRET }}
          STEWARD_SESSION_SECRET: ${{ secrets.STEWARD_SESSION_SECRET }}
          STEWARD_REQUEST_SIGNING_SECRET: ${{ secrets.STEWARD_REQUEST_SIGNING_SECRET }}
          # Platform key the Worker forwards as X-Steward-Platform-Key so per-org
          # sandbox Steward tenants provision instead of collapsing onto the
          # shared default tenant (#11461). publish_secret no-ops with a notice
          # while unset, so this is safe before ops adds the GH env secret and
          # keeps it published on every redeploy once they do.
          STEWARD_PLATFORM_KEYS: ${{ secrets.STEWARD_PLATFORM_KEYS }}
          STEWARD_TENANT_API_KEY: ${{ secrets.STEWARD_TENANT_API_KEY }}
          OIDC_SIGNING_JWKS: ${{ secrets.OIDC_SIGNING_JWKS }}
          OIDC_CLIENTS: ${{ secrets.OIDC_CLIENTS }}
          ELIZA_APP_WEBHOOK_GATEWAY_URL: ${{ vars.ELIZA_APP_WEBHOOK_GATEWAY_URL }}
          ELIZA_APP_WEBHOOK_GATEWAY_SECRET: ${{ secrets.ELIZA_APP_WEBHOOK_GATEWAY_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          has_nonblank_value() {
            local value="${1:-}"
            [ -n "${value//[[:space:]]/}" ]
          }

          is_truthy() {
            case "${1,,}" in
              1|true|yes|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Construct the staging fallback only when the source key is real.
          # Never publish the invalid-but-nonempty string "Bearer ".
          if [ "$DEPLOY_ENVIRONMENT" = "staging" ] && \
             is_truthy "$VOICE_REALTIME_WS_ENABLED" && \
             ! has_nonblank_value "$VOICE_REALTIME_ELIZA_AUTHORIZATION" && \
             has_nonblank_value "$STAGING_ELIZACLOUD_API_KEY"; then
            VOICE_REALTIME_ELIZA_AUTHORIZATION="Bearer $STAGING_ELIZACLOUD_API_KEY"
            export VOICE_REALTIME_ELIZA_AUTHORIZATION
          fi

          # Production realtime is currently explicitly disabled. A stale
          # Worker secret may therefore remain stored but is unreachable. If a
          # future change enables the route, fail that deploy unless every
          # provider and the dedicated bridge authorization is configured; the
          # next publish then overwrites any legacy repository-key fallback.
          # Production never constructs the staging repository-key fallback.
          if [ "$DEPLOY_ENVIRONMENT" = "production" ] && \
             is_truthy "$PRODUCTION_REALTIME_WS_ENABLED"; then
            missing_voice_secrets=()
            for name in CARTESIA_API_KEY VOICE_REALTIME_ELIZA_AUTHORIZATION PRODUCTION_REALTIME_CARTESIA_VOICE_ID PRODUCTION_REALTIME_ELIZA_ENDPOINT; do
              if ! has_nonblank_value "${!name:-}"; then
                missing_voice_secrets+=("$name")
              fi
            done
            if [ "${#missing_voice_secrets[@]}" -gt 0 ]; then
              echo "::error::Production realtime voice is enabled but required dedicated/provider secrets are missing: ${missing_voice_secrets[*]}"
              exit 1
            fi
          fi

          # Staging advertises realtime only when the repository variable
          # VOICE_REALTIME_WS_ENABLED is explicitly truthy. Refuse that opt-in
          # unless every required provider and bridge credential is present; a
          # green deploy with a 503-only voice route is not honest availability.
          if [ "$DEPLOY_ENVIRONMENT" = "staging" ] && \
             is_truthy "$VOICE_REALTIME_WS_ENABLED"; then
            missing_voice_secrets=()
            for name in CARTESIA_API_KEY VOICE_REALTIME_ELIZA_AUTHORIZATION; do
              if ! has_nonblank_value "${!name:-}"; then
                missing_voice_secrets+=("$name")
              fi
            done
            if [ "${#missing_voice_secrets[@]}" -gt 0 ]; then
              echo "::error::Realtime voice is enabled for staging but required secrets are missing: ${missing_voice_secrets[*]}"
              exit 1
            fi
          fi

          # Value-safe validation: exact UUID allowlists, dedicated signing
          # key/kid, and the code/runtime version are all required before the
          # first QA-related Worker secret is touched.
          node ../scripts/validate-staging-session-cutover.mjs

          # Fish is a separate, default-off promotion within realtime voice.
          # Refuse to advertise it unless its own credentials and the exact
          # voice downlink format are deployable; Cartesia is still required
          # above because it handles pre-first-audio fallback.
          if is_truthy "$ELIZA_TTS_FISH_ENABLED"; then
            if ! is_truthy "$FISH_AUDIO_DATA_GOVERNANCE_APPROVED"; then
              echo "::error::Fish realtime TTS is unavailable until FISH_AUDIO_DATA_GOVERNANCE_APPROVED is explicitly set after owner policy attestation"
              exit 1
            fi
            missing_fish_secrets=()
            for name in FISH_AUDIO_API_KEY FISH_AUDIO_REFERENCE_ID; do
              if ! has_nonblank_value "${!name:-}"; then
                missing_fish_secrets+=("$name")
              fi
            done
            if [ "${#missing_fish_secrets[@]}" -gt 0 ]; then
              echo "::error::Fish realtime TTS is enabled but required secrets are missing: ${missing_fish_secrets[*]}"
              exit 1
            fi
            case "$FISH_AUDIO_MODEL" in
              s1|s2-pro|s2.1-pro|s2.1-pro-free) ;;
              *)
                echo "::error::Fish realtime TTS model is invalid: $FISH_AUDIO_MODEL"
                exit 1
                ;;
            esac
            if [ "$FISH_AUDIO_SAMPLE_RATE" != "16000" ]; then
              echo "::error::Fish realtime TTS must deploy at 16000 Hz"
              exit 1
            fi
          fi

          # The Worker is the gateway: it calls native providers directly and
          # uses OpenRouter (BYOK) as the backup. At least one provider key (the
          # OpenRouter backup, or a native key) must be configured.
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$CEREBRAS_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No model provider key configured. Set OPENROUTER_API_KEY (backup) and/or a native key (CEREBRAS/OPENAI/ANTHROPIC) at https://github.com/elizaOS/eliza/settings/secrets/actions."
            exit 1
          fi

          publish_secret() {
            local name="$1"
            local value="${!name:-}"
            case "$name" in
              CARTESIA_API_KEY|VOICE_REALTIME_ELIZA_AUTHORIZATION)
                if ! is_truthy "$VOICE_REALTIME_WS_ENABLED"; then
                  echo "::notice::$name is gated by VOICE_REALTIME_WS_ENABLED; skipping"
                  return 0
                fi
                ;;
              DEEPGRAM_API_KEY)
                if [ "${VOICE_BATCH_STT_PROVIDER,,}" != "deepgram" ]; then
                  echo "::notice::$name is gated by VOICE_BATCH_STT_PROVIDER=deepgram; skipping"
                  return 0
                fi
                ;;
              FISH_AUDIO_API_KEY|FISH_AUDIO_REFERENCE_ID)
                if ! is_truthy "$VOICE_REALTIME_WS_ENABLED" || \
                   ! is_truthy "$ELIZA_TTS_FISH_ENABLED" || \
                   ! is_truthy "$FISH_AUDIO_DATA_GOVERNANCE_APPROVED"; then
                  echo "::notice::$name is gated by realtime voice, Fish enablement, and data-governance approval; skipping"
                  return 0
                fi
                ;;
            esac
            if ! has_nonblank_value "$value"; then
              echo "::notice::$name is not configured; skipping"
              return 0
            fi
            for attempt in 1 2 3; do
              if printf '%s' "$value" | bunx wrangler secret put "$name" ${{ steps.env.outputs.wrangler_args }}; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::wrangler secret put $name failed on attempt $attempt; retrying in 10s"
                sleep 10
              fi
            done
            echo "::error::wrangler secret put $name failed after 3 attempts"
            return 1
          }

          # Like publish_secret, but for values that act as ROUTING TOGGLES
          # (code branches on presence, e.g. `env.WHISPER_STT_URL`). An unset
          # source must DELETE any previously published secret. A plain
          # skip would leave a stale toggle active on the Worker forever
          # (e.g. STT pinned to a dead Whisper host during an outage).
          publish_toggle_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              publish_secret "$name"
              return $?
            fi
            # Unset: delete so the Worker falls back to its default path.
            # Wrangler auto-confirms the prompt in non-interactive CI.
            # "Binding not found" is success (nothing was published). Any
            # other failure must FAIL after retries: deploying with a stale
            # routing toggle is exactly the outage this function prevents.
            local out
            for attempt in 1 2 3; do
              if out=$(bunx wrangler secret delete "$name" ${{ steps.env.outputs.wrangler_args }} 2>&1); then
                echo "::notice::$name is not configured; deleted any previously published value"
                return 0
              fi
              if printf '%s' "$out" | grep -qi "not found"; then
                echo "::notice::$name is not configured and not present on the Worker; nothing to do"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::wrangler secret delete $name failed on attempt $attempt; retrying in 10s"
                sleep 10
              fi
            done
            echo "::error::$name is unset but deleting the stale Worker secret failed after 3 attempts: $out"
            return 1
          }

          # QA cutover is OFF-FIRST. Secret mutations update the currently
          # served Worker immediately, so remove the activation bit before
          # changing any version, signer, or allowlist. If any later config or
          # code deploy fails, the served feature remains absent.
          STAGING_SESSION_EXCHANGE_ENABLED=""
          export STAGING_SESSION_EXCHANGE_ENABLED
          publish_toggle_secret STAGING_SESSION_EXCHANGE_ENABLED || exit 1

          staging_session_config_names=(
            STAGING_SESSION_EXCHANGE_VERSION
            STAGING_SESSION_EXCHANGE_SIGNING_SECRET
            STAGING_SESSION_EXCHANGE_SIGNING_KEY_ID
            STAGING_SESSION_EXCHANGE_ALLOWED_API_KEY_IDS
            STAGING_SESSION_EXCHANGE_ALLOWED_USER_IDS
            STAGING_SESSION_EXCHANGE_ALLOWED_ORGANIZATION_IDS
          )
          if [ "$DEPLOY_ENVIRONMENT" = "staging" ] && \
             is_truthy "$STAGING_SESSION_EXCHANGE_DESIRED_ENABLED"; then
            for name in "${staging_session_config_names[@]}"; do
              publish_toggle_secret "$name" || exit 1
            done
          else
            # Disabled/non-staging environments retain no stale QA signer or
            # allowlist. Deletion happens only after the gate is already off.
            for name in "${staging_session_config_names[@]}"; do
              printf -v "$name" '%s' ""
              export "${name?}"
              publish_toggle_secret "$name" || exit 1
            done
          fi

          # Publish only values explicitly configured in this protected GitHub
          # environment. publish_secret intentionally skips blank values, which
          # preserves an existing Cloudflare binding that GitHub cannot recover.
          managed_worker_provisioning_secrets=(
            DATABASE_URL
            HEADSCALE_API_KEY
            CONTAINERS_SSH_KEY
            SECRETS_MASTER_KEY
            TUNNEL_HOSTNAME_SIGNING_SECRET
          )
          for name in "${managed_worker_provisioning_secrets[@]}"; do
            publish_secret "$name" || exit 1
          done

          for name in \
            OPENROUTER_API_KEY \
            OPENAI_API_KEY \
            ANTHROPIC_API_KEY \
            CEREBRAS_API_KEY \
            GROQ_API_KEY \
            FAL_KEY \
            FAL_API_KEY \
            ELEVENLABS_API_KEY \
            DEEPGRAM_API_KEY \
            ELIZA_VOICE_CATALOG_SIGNING_KEY_BASE64 \
            ELIZA_VOICE_CATALOG_PUBLIC_KEY_BASE64 \
            VAST_API_KEY \
            VAST_BASE_URL \
            CARTESIA_API_KEY \
            FISH_AUDIO_API_KEY \
            FISH_AUDIO_REFERENCE_ID \
            VOICE_REALTIME_ELIZA_AUTHORIZATION \
            STEWARD_API_URL \
            STEWARD_JWT_SECRET \
            STEWARD_SESSION_SECRET \
            STEWARD_REQUEST_SIGNING_SECRET \
            STEWARD_PLATFORM_KEYS \
            STEWARD_TENANT_API_KEY \
            OIDC_SIGNING_JWKS \
            OIDC_CLIENTS \
            ELIZA_APP_WEBHOOK_GATEWAY_SECRET
          do
            publish_secret "$name"
          done

          # Routing toggles: presence changes code paths, so unset must delete.
          # A failed put must fail the step (never deploy with a half-applied
          # toggle), matching the publish_secret loop's set -e behavior.
          for name in \
            CARTESIA_API_KEY \
            CARTESIA_VOICE_ID \
            WHISPER_STT_URL \
            WHISPER_STT_MODEL \
            VOICE_BATCH_STT_PROVIDER \
            ELIZA_APP_WEBHOOK_GATEWAY_URL
          do
            publish_toggle_secret "$name" || exit 1
          done

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.configured == 'true' && steps.freshness.outputs.should_deploy == 'true'
        working-directory: ${{ env.CHECKOUT_DIR }}/packages/cloud/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENVIRONMENT: ${{ steps.env.outputs.deploy_environment }}
          STAGING_ONBOARDING_LOGIN_APP_URL: https://staging.eliza.app
          KOKORO_TTS_URL: ${{ vars.ELIZA_VOICE_KOKORO_TTS_URL }}
          VOICE_REALTIME_WS_ENABLED: ${{ steps.env.outputs.deploy_environment != 'production' && contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.VOICE_REALTIME_WS_ENABLED) && 'true' || 'false' }}
          ELIZA_TTS_FISH_ENABLED: ${{ steps.env.outputs.deploy_environment != 'production' && contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.ELIZA_TTS_FISH_ENABLED) && 'true' || 'false' }}
          FISH_AUDIO_DATA_GOVERNANCE_APPROVED: ${{ steps.env.outputs.deploy_environment != 'production' && contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.FISH_AUDIO_DATA_GOVERNANCE_APPROVED) && 'true' || 'false' }}
          FISH_AUDIO_MODEL: ${{ vars.FISH_AUDIO_MODEL || 's2.1-pro' }}
          FISH_AUDIO_SAMPLE_RATE: "16000"
          FISH_AUDIO_FIRST_AUDIO_TIMEOUT_MS: ${{ vars.FISH_AUDIO_FIRST_AUDIO_TIMEOUT_MS || '1500' }}
        run: |
          legacy_onboarding_secret_removed=false
          restore_legacy_onboarding_secrets() {
            if [ "$legacy_onboarding_secret_removed" != "true" ]; then
              return
            fi
            echo "::warning::Worker deploy failed after retiring legacy onboarding URL secrets; restoring the staging value."
            for name in ELIZA_ONBOARDING_LOGIN_APP_URL ELIZA_APP_ONBOARDING_LOGIN_APP_URL; do
              if ! printf '%s' "$STAGING_ONBOARDING_LOGIN_APP_URL" | bunx wrangler secret put "$name" --env staging; then
                echo "::error::Failed to restore legacy staging binding $name; staging onboarding CTA configuration requires operator repair."
              fi
            done
          }

          delete_legacy_onboarding_secret() {
            local name="$1"
            local output=""
            for attempt in 1 2 3; do
              if output=$(bunx wrangler secret delete "$name" --env staging 2>&1); then
                legacy_onboarding_secret_removed=true
                echo "Retired legacy staging secret binding $name."
                return 0
              fi
              if printf '%s' "$output" | grep -qi "not found"; then
                echo "Legacy staging secret binding $name is already absent."
                return 0
              fi
              [ "$attempt" -lt 3 ] && sleep 10
            done
            printf '%s\n' "$output" >&2
            echo "::error::Could not retire legacy staging secret binding $name."
            return 1
          }

          args=(${{ steps.env.outputs.wrangler_args }} --var ELIZA_DEPLOY_COMMIT:"$GITHUB_SHA" --var VOICE_REALTIME_WS_ENABLED:"$VOICE_REALTIME_WS_ENABLED" --var ELIZA_TTS_FISH_ENABLED:"$ELIZA_TTS_FISH_ENABLED" --var FISH_AUDIO_DATA_GOVERNANCE_APPROVED:"$FISH_AUDIO_DATA_GOVERNANCE_APPROVED" --var FISH_AUDIO_MODEL:"$FISH_AUDIO_MODEL" --var FISH_AUDIO_SAMPLE_RATE:"$FISH_AUDIO_SAMPLE_RATE" --var FISH_AUDIO_FIRST_AUDIO_TIMEOUT_MS:"$FISH_AUDIO_FIRST_AUDIO_TIMEOUT_MS")
          if [ -n "${KOKORO_TTS_URL:-}" ]; then
            args+=(--var KOKORO_TTS_URL:"$KOKORO_TTS_URL")
          else
            echo "::notice::ELIZA_VOICE_KOKORO_TTS_URL is not configured; deploying without KOKORO_TTS_URL"
          fi
          if [ "$DEPLOY_ENVIRONMENT" = "staging" ]; then
            trap restore_legacy_onboarding_secrets ERR
            delete_legacy_onboarding_secret ELIZA_ONBOARDING_LOGIN_APP_URL
            delete_legacy_onboarding_secret ELIZA_APP_ONBOARDING_LOGIN_APP_URL
          fi
          bunx wrangler deploy "${args[@]}"
          trap - ERR

      - name: Verify required Worker secret binding names
        if: steps.cf.outputs.configured == 'true' && steps.freshness.outputs.should_deploy == 'true'
        working-directory: ${{ env.CHECKOUT_DIR }}/packages/cloud/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secret_inventory="$(bunx wrangler@4.100.0 secret list ${{ steps.env.outputs.wrangler_args }} --format json)"
          printf '%s' "$secret_inventory" | node -e '
            const fs = require("node:fs");
            const parsed = JSON.parse(fs.readFileSync(0, "utf8"));
            const entries = Array.isArray(parsed)
              ? parsed
              : Array.isArray(parsed?.result)
                ? parsed.result
                : [];
            const present = new Set(entries.map((entry) => entry?.name).filter(Boolean));
            const required = [
              "DATABASE_URL",
              "HEADSCALE_API_KEY",
              "CONTAINERS_SSH_KEY",
              "SECRETS_MASTER_KEY",
              "TUNNEL_HOSTNAME_SIGNING_SECRET",
              "OIDC_CLIENTS",
              "OIDC_SIGNING_JWKS",
              "STEWARD_API_URL",
              "STEWARD_JWT_SECRET",
              "STEWARD_SESSION_SECRET",
              "STEWARD_REQUEST_SIGNING_SECRET",
              "STEWARD_PLATFORM_KEYS",
              "STEWARD_TENANT_API_KEY",
            ];
            const missing = required.filter((name) => !present.has(name));
            if (missing.length > 0) {
              console.error(`::error::Missing required Worker secret binding name(s): ${missing.join(" ")}`);
              process.exit(1);
            }
            console.log(`Verified ${required.length} required Worker secret binding names; values were not read.`);
          '

      - name: Verify deployed API commit
        if: steps.cf.outputs.configured == 'true' && steps.freshness.outputs.should_deploy == 'true'
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          API_URL: ${{ steps.env.outputs.deploy_environment == 'production' && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
          DEPLOY_ENVIRONMENT: ${{ steps.env.outputs.deploy_environment }}
        run: |
          set -euo pipefail
          expected_commit="$GITHUB_SHA"
          expected_environment="$DEPLOY_ENVIRONMENT"
          health_url="${API_URL%/}/api/health"
          for attempt in 1 2 3 4 5 6; do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' -m 20 "$health_url" || echo "000")"
            if [ "$code" = "200" ] && head -c 1 "$tmp" | grep -q '[{[]'; then
              observed_commit="$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(data.commit || '')" "$tmp")"
              observed_environment="$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(data.environment || '')" "$tmp")"
              if [ "$observed_commit" = "$expected_commit" ] && [ "$observed_environment" = "$expected_environment" ]; then
                echo "API health serves commit ${observed_commit} for ${observed_environment}."
                rm -f "$tmp"
                exit 0
              fi
              echo "API health attempt ${attempt}: commit=${observed_commit:-<missing>} environment=${observed_environment:-<missing>}, expected commit=${expected_commit} environment=${expected_environment}" >&2
            else
              echo "API health attempt ${attempt}: HTTP ${code} from ${health_url}" >&2
              head -c 300 "$tmp" >&2 2>/dev/null || true
              echo >&2
            fi
            rm -f "$tmp"
            [ "$attempt" -lt 6 ] && sleep 10
          done
          echo "::error::API health did not serve the deployed commit ${expected_commit} for ${expected_environment}."
          exit 1

      - name: Activate and verify staging session exchange after deploy proof
        if: steps.cf.outputs.configured == 'true' && steps.freshness.outputs.should_deploy == 'true' && steps.env.outputs.deploy_environment == 'staging'
        working-directory: ${{ env.CHECKOUT_DIR }}/packages/cloud/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_SESSION_EXCHANGE_DESIRED_ENABLED: ${{ contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.STAGING_SESSION_EXCHANGE_ENABLED) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          health_url="https://api-staging.eliza.app/api/health"
          expected_enabled="$STAGING_SESSION_EXCHANGE_DESIRED_ENABLED"

          rollback_gate() {
            local output
            for attempt in 1 2 3; do
              if output=$(bunx wrangler secret delete STAGING_SESSION_EXCHANGE_ENABLED --env staging 2>&1); then
                echo "Staging session exchange activation is off."
                return 0
              fi
              if printf '%s' "$output" | grep -qi "not found"; then
                echo "Staging session exchange activation was already off."
                return 0
              fi
              [ "$attempt" -lt 3 ] && sleep 10
            done
            return 1
          }

          # Keep an EXIT/interrupt rollback armed across the activation/proof
          # boundary. A secret-put can reach Cloudflare yet return an ambiguous
          # transport failure; the health beacon, not the CLI exit code, is the
          # authority, and every unproven exit returns the served gate to off.
          rollback_needed=true
          rollback_on_unproven_exit() {
            local status=$?
            if [ "$rollback_needed" = "true" ]; then
              if ! rollback_gate; then
                echo "::error::Unproven cutover exited and activation rollback could not be confirmed"
              fi
            fi
            return "$status"
          }
          trap rollback_on_unproven_exit EXIT
          trap 'exit 1' INT TERM

          if [ "$expected_enabled" = "true" ]; then
            activation_cli_confirmed=false
            for attempt in 1 2 3; do
              if printf '%s' 'true' | bunx wrangler secret put STAGING_SESSION_EXCHANGE_ENABLED --env staging; then
                activation_cli_confirmed=true
                break
              fi
              [ "$attempt" -lt 3 ] && sleep 10
            done
            if [ "$activation_cli_confirmed" != "true" ]; then
              echo "::warning::Activation CLI result was ambiguous; requiring served-state proof"
            fi
          else
            echo "Staging session exchange remains disabled pending served-state proof."
          fi

          for attempt in 1 2 3 4 5 6; do
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' -m 20 "$health_url" || echo '000')"
            if [ "$code" = "200" ] && node - "$tmp" "$GITHUB_SHA" "$expected_enabled" <<'NODE'
          const fs = require("fs");
          const [path, expectedCommit, expectedEnabled] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(path, "utf8"));
          const status = body.stagingSessionExchange;
          const enabled = status?.enabled === true;
          const expected = expectedEnabled === "true";
          if (
            body.commit !== expectedCommit ||
            body.environment !== "staging" ||
            enabled !== expected ||
            (expected && (status?.ready !== true || status?.version !== "v1")) ||
            (!expected && status?.ready !== false)
          ) {
            process.exit(1);
          }
          NODE
            then
              rm -f "$tmp"
              rollback_needed=false
              echo "Staging session exchange cutover matches the exact deployed commit and desired state."
              exit 0
            fi
            rm -f "$tmp"
            [ "$attempt" -lt 6 ] && sleep 10
          done

          # Any mismatch, including an unexpected enable while desired state is
          # off, is rolled back. Keep versioned config for diagnosis only.
          if rollback_gate; then
            rollback_needed=false
            echo "::warning::Cutover proof failed; staging session exchange was rolled back off"
          else
            echo "::error::Cutover proof failed and activation rollback could not be confirmed"
          fi
          echo "::error::Staging session exchange cutover proof failed"
          exit 1

      - name: Clean temp checkout
        if: always()
        working-directory: /tmp
        run: |
          set -uo pipefail
          if [ -e "$CHECKOUT_DIR" ]; then
            stale_dir="/tmp/eliza-stale-checkout-${GITHUB_RUN_ID:-run}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-job}-$(date +%s)"
            mv "$CHECKOUT_DIR" "$stale_dir" 2>/dev/null || stale_dir="$CHECKOUT_DIR"
            nohup bash -c 'timeout 30s rm -rf "$1" || true' _ "$stale_dir" >/dev/null 2>&1 &
            echo "Scheduled best-effort cleanup for ${stale_dir}."
          fi

  # ---------------------------------------------------------------------------
  # Pages build — one prepared workspace emits the host-aware frontend.
  # ---------------------------------------------------------------------------
  build-pages:
    name: Build Pages artifacts
    needs: migrate-db
    if: ${{ !cancelled() && (needs.migrate-db.result == 'success' || (github.event_name == 'pull_request' && needs.migrate-db.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Staging now stores VITE_TELEGRAM_BOT_ID on the GitHub environment.
    # Bind this producer so vars.VITE_TELEGRAM_BOT_ID resolves during Vite.
    environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }}
    # GitHub preserves outputs from successful jobs when only failed jobs are
    # rerun. Consumers must therefore use the producer's attempt, not their own
    # newer github.run_attempt. A full rerun executes this job again and emits
    # the new attempt, so its deploy jobs consume the newly built artifacts.
    outputs:
      artifact_run_id: ${{ steps.pages-artifact.outputs.run_id }}
      artifact_run_attempt: ${{ steps.pages-artifact.outputs.run_attempt }}
      artifact_source_sha: ${{ steps.pages-artifact.outputs.source_sha }}
    steps:
      - name: Validate PR preview identity
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Pull-request Pages branch requires a valid immutable PR number"
            exit 1
          fi
          pages_branch="pr-${PR_NUMBER}"
          case "$pages_branch" in
            main|develop)
              echo "::error::Pull-request Pages branch may not target canonical branch $pages_branch"
              exit 1
              ;;
          esac
          echo "Pages artifacts are bound to trusted preview branch ${pages_branch}." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bind Pages artifacts to this producer attempt
        id: pages-artifact
        env:
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "run_id=$PRODUCER_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$PRODUCER_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$PRODUCER_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build linked elizaOS core workspace once
        run: bun run build:core

      - name: Build consolidated frontend artifact
        run: bun run --cwd packages/app build:web
        env:
          VITE_API_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
          NEXT_PUBLIC_API_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
          VITE_OIDC_ISSUER_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
          VITE_ELIZA_CLOUD_BASE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://cloud.eliza.app' || 'https://cloud-staging.eliza.app' }}
          VITE_APP_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://eliza.app' || 'https://staging.eliza.app' }}
          NEXT_PUBLIC_APP_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://cloud.eliza.app' || 'https://cloud-staging.eliza.app' }}
          VITE_ELIZA_APP_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://cloud.eliza.app' || 'https://cloud-staging.eliza.app' }}
          VITE_STEWARD_TENANT_ID: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'elizacloud' || 'elizacloud-staging' }}
          NEXT_PUBLIC_STEWARD_TENANT_ID: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'elizacloud' || 'elizacloud-staging' }}
          VITE_ENVIRONMENT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }}
          VITE_VOICE_REALTIME_WS: ${{ !((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.VOICE_REALTIME_WS_ENABLED) && '1' || '0' }}
          VITE_VOICE_REALTIME_FORCE: "0"
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          VITE_TELEGRAM_BOT_ID: ${{ vars.VITE_TELEGRAM_BOT_ID }}

      - name: Verify frontend chunk safety
        run: bun run --cwd packages/app verify:chunks

      - name: Upload consolidated frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pages-app-${{ steps.pages-artifact.outputs.run_id }}-${{ steps.pages-artifact.outputs.run_attempt }}
          path: |
            packages/app/dist
            packages/app/functions
            packages/app/wrangler.toml
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Consolidated frontend — packages/app at eliza.app and cloud.eliza.app.
  # The same host-aware bundle serves marketing, auth, cloud management, and the
  # managed Eliza agent app from the single `eliza-app` Pages project.
  # ---------------------------------------------------------------------------
  deploy-app:
    name: Deploy consolidated frontend (Pages · eliza.app)
    # Per-env concurrency so a newer main promote queues behind the in-flight
    # prod Pages deploy instead of cancelling it (#11640).
    concurrency:
      group: cloud-cf-deploy-app-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging') }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Hosted unconditionally to preserve CI/placement workload separation.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Release gate (#11208/#18088): canonical Pages aliases wait for the matching
    # API deployment; pull-request artifacts
    # are consumed only by the separate trusted preview workflow.
    needs: [deploy-api, build-pages]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.deploy-api.result == 'success' && needs.build-pages.result == 'success' }}
    env:
      CHECKOUT_DIR: /tmp/eliza-checkout-${{ github.run_id }}-${{ github.run_attempt }}-deploy-app
      CHECKOUT_MATERIALIZE_TIMEOUT_SECONDS: ${{ vars.CLOUD_CF_CHECKOUT_MATERIALIZE_TIMEOUT_SECONDS || '600' }}
    steps:
      - name: Reclaim disk from leaked checkouts of prior runs
        continue-on-error: true
        run: |
          # Cancelled/killed deploy runs never reach the trailing "Clean temp
          # checkout" step, so their /tmp/eliza-checkout-* trees (a full ~46k-file
          # monorepo materialization) leak and pile up on this shared self-hosted
          # box until disk/inodes are exhausted and materialization times out —
          # freezing prod (elizaOS/eliza#10839). Reclaim leaked trees, but ONLY
          # ones idle >90 min: a real deploy job runs <~50 min and self-cleans, so
          # a dir untouched for 90 min is a definitively-dead leak.
          # CONCURRENCY-SAFE: API, console, and app jobs within one release still
          # materialize concurrently, and PR previews use independent groups. The
          # age filter never deletes an actively-written checkout (its mtime stays
          # fresh), and we also exclude this run's own dirs by name.
          # UNFAILABLE BY CONSTRUCTION: sibling runs execute this same step at the
          # same moment, so one sibling's rm -rf can race another's find into
          # ENOENT (exit 1) — under the job's default `bash -e` (plus the pipefail
          # this step previously set) that killed whole deploy jobs at step one.
          # set +e swallows every failure mode, exit 0 guarantees the step, and
          # continue-on-error guards future edits.
          set +e
          set +o pipefail
          find_stale_checkouts() {
            timeout 20s find /tmp -maxdepth 1 -type d \
              -name 'eliza-checkout-*' \
              -mmin +90 \
              ! -name "eliza-checkout-${{ github.run_id }}-*" \
              2>/dev/null || true
          }
          mapfile -t stale_dirs < <(find_stale_checkouts)
          stale=${#stale_dirs[@]}
          moved=0
          index=0
          for dir in "${stale_dirs[@]}"; do
            index=$((index + 1))
            stale_dir="/tmp/eliza-stale-checkout-${GITHUB_RUN_ID:-run}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-job}-${index}"
            if mv "$dir" "$stale_dir" 2>/dev/null; then
              moved=$((moved + 1))
              nohup bash -c 'timeout 180s rm -rf "$1" || true' _ "$stale_dir" >/dev/null 2>&1 &
            fi
          done
          echo "Scheduled background cleanup for ${moved}/${stale:-0} stale (idle >90min) leaked checkout dir(s)."
          df -h /tmp / 2>/dev/null | tail -2
          exit 0
      - name: Checkout repository
        timeout-minutes: 20
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        working-directory: /tmp
        run: |
          set -euo pipefail
          init_checkout_dir() {
            mkdir -p "$CHECKOUT_DIR"
            git init -q "$CHECKOUT_DIR"
            git -C "$CHECKOUT_DIR" remote set-url origin "https://x-access-token:${CHECKOUT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null \
              || git -C "$CHECKOUT_DIR" remote add origin "https://x-access-token:${CHECKOUT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          }
          init_checkout_dir
          # Shared, heavily-loaded self-hosted box (wrangler dev + PGlite + the full
          # Worker suite): a single shallow fetch can stall for minutes or wedge
          # entirely. Retry with a per-attempt timeout so a stuck fetch aborts and
          # retries instead of burning the whole step budget (the #10310 stuck-checkout).
          # http.version=HTTP/1.1: concurrent fetches of this large repo on the
          # loaded box die under HTTP/2 (`curl 92 ... CANCEL` / `early EOF` /
          # `invalid index-pack output`, observed run 28544777730); HTTP/1.1
          # avoids the h2 stream-reset path at negligible single-stream cost.
          fetched=
          for attempt in 1 2 3; do
            # Pages builds materialize packages/app + linked UI/core workspaces.
            # Blobless fetch pushes that cost into checkout as lazy hydration and
            # has repeatedly timed out on the deploy fleet, so use a normal
            # shallow fetch here.
            if timeout 420s git -C "$CHECKOUT_DIR" -c protocol.version=2 -c http.version=HTTP/1.1 fetch --force --no-tags --depth=1 origin "$GITHUB_SHA"; then
              fetched=1
              break
            fi
            echo "::warning::checkout fetch attempt ${attempt} stalled or failed; retrying"
            if [ "$attempt" -lt 3 ]; then
              rm -rf "$CHECKOUT_DIR"
              sleep 10
              init_checkout_dir
            fi
          done
          [ -n "$fetched" ] || { echo "::error::git fetch failed after 3 attempts"; exit 1; }
          # checkout --force --detach fully materializes the working tree from the
          # fetched commit; the prior extra `git reset --hard` re-wrote the entire
          # tree a second time, doubling the slowest part on this large repo. Keep
          # this bounded, but give the large monorepo enough time on busy deploy
          # runners and let Git parallelize path materialization when supported.
          timeout "${CHECKOUT_MATERIALIZE_TIMEOUT_SECONDS}s" \
            git -C "$CHECKOUT_DIR" \
              -c checkout.workers=8 \
              -c checkout.thresholdForParallelism=100 \
              checkout --force --detach FETCH_HEAD \
            || { echo "::error::git checkout (working-tree materialization) timed out or failed after ${CHECKOUT_MATERIALIZE_TIMEOUT_SECONDS}s"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Pinned off `canary`: canary's link phase hangs on the self-hosted
          # runners (bun install resolves+extracts in ~2min then stalls past the
          # 900s cap, ×3 retries), stranding prod deploys — observed on runs
          # 28552075615 and 28569068598 (the money-integrity wave). A released
          # Bun 1.3.14 does not exhibit the hang and avoids the floating-tag API
          # lookup during setup. See elizaOS/eliza#10839.
          bun-version: "1.3.14"

      - name: Resolve immutable app artifact
        id: pages-artifact
        env:
          PRODUCER_RUN_ID: ${{ needs.build-pages.outputs.artifact_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.build-pages.outputs.artifact_run_attempt }}
          PRODUCER_SOURCE_SHA: ${{ needs.build-pages.outputs.artifact_source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Pages producer run ID is missing or invalid"
            exit 1
          fi
          if ! [[ "$PRODUCER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Pages producer run attempt is missing or invalid"
            exit 1
          fi
          if [ "$PRODUCER_RUN_ID" != "$GITHUB_RUN_ID" ]; then
            echo "::error::Pages artifact run mismatch: producer=$PRODUCER_RUN_ID consumer=$GITHUB_RUN_ID"
            exit 1
          fi
          if [ "$PRODUCER_SOURCE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Pages artifact SHA mismatch: producer=$PRODUCER_SOURCE_SHA consumer=$GITHUB_SHA"
            exit 1
          fi
          echo "name=pages-app-${PRODUCER_RUN_ID}-${PRODUCER_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Download immutable app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: ${{ env.CHECKOUT_DIR }}/packages/app

      - name: Legacy inline fallback - install dependencies
        if: ${{ vars.CLOUD_CF_LEGACY_INLINE_BUILD == 'true' }}
        working-directory: ${{ env.CHECKOUT_DIR }}
        # The shared self-hosted deploy box can stall or kill a single bun
        # install mid-flight (contended cache/IO), which surfaced as a
        # "cancelled" install step failing an otherwise-green deploy while every
        # sibling deploy job on the same run succeeded. Retry with a per-attempt
        # timeout so a stuck/killed install aborts and retries instead of failing
        # the deploy — the same resilience the checkout step already uses (#10310).
        # The cap must exceed the box's real worst-case SLOW install, not just
        # catch hangs: healthy installs here run ~190-300s+ (run 28532809562's
        # first attempt already blew a 300s cap and only survived via retry),
        # and on 2026-07-01 run 28545551059 failed 3/3 attempts at a 300s cap
        # while making real progress — wedging prod for hours (#10839). 900s
        # matches CHECKOUT_MATERIALIZE_TIMEOUT_SECONDS; a true hang still aborts.
        run: |
          set -euo pipefail
          # Cache on LOCAL disk ($HOME), not under $PWD — the checkout dir lives
          # on the box's /tmp, whose contended/slow filesystem stalls bun's link
          # phase past the 900s cap and wedges deploys (bun itself logs "Slow
          # filesystem detected ... consider setting $BUN_INSTALL_CACHE_DIR to a
          # local folder"). This is the real fix; the earlier canary→latest pin
          # (#11235) did not address it — the hang recurs on a released bun too
          # (run 28572046433). Persistent across runs so the cache stays warm.
          install_cache="${HOME}/.bun-install-cache-deploy"
          install_timeout="${BUN_INSTALL_TIMEOUT_SECONDS:-2400}"
          for attempt in 1 2 3; do
            test -f package.json || { echo "::error::package.json missing from $PWD"; ls -la; exit 1; }
            mkdir -p "$install_cache"
            if timeout "${install_timeout}s" bun install --frozen-lockfile --no-save --ignore-scripts --cache-dir "$install_cache"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::bun install failed after ${attempt} attempts"
              exit 1
            fi
            echo "::warning::bun install attempt ${attempt} timed out (>${install_timeout}s) or failed; retrying"
            # Keep the download cache warm for the retry — the timeout bites in
            # the link phase, not download, and a cold cache makes the retry
            # SLOWER (more likely to time out again). Nuke it only before the
            # final attempt so a corrupted cache entry can't fail all three.
            rm -rf node_modules
            if [ "$attempt" -eq 2 ]; then rm -rf "$install_cache"; fi
          done
          git diff --exit-code -- bun.lock

      - name: Legacy inline fallback - build linked core
        if: ${{ vars.CLOUD_CF_LEGACY_INLINE_BUILD == 'true' }}
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bun run build:core

      # The Eliza agent app. The vite build is the gate (it resolves @elizaos/*
      # to source); typecheck is enforced by the separate verify workflow.
      - name: Legacy inline fallback - build app
        if: ${{ vars.CLOUD_CF_LEGACY_INLINE_BUILD == 'true' }}
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bun run --cwd packages/app build:web
        env:
          VITE_API_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
          NEXT_PUBLIC_API_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
          VITE_OIDC_ISSUER_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
          VITE_ELIZA_CLOUD_BASE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://cloud.eliza.app' || 'https://cloud-staging.eliza.app' }}
          VITE_APP_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://eliza.app' || 'https://staging.eliza.app' }}
          NEXT_PUBLIC_APP_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://cloud.eliza.app' || 'https://cloud-staging.eliza.app' }}
          VITE_ELIZA_APP_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://cloud.eliza.app' || 'https://cloud-staging.eliza.app' }}
          # Steward tenant pin (one identity bridged between the marketing and
          # managed cloud origins).
          # The SPA reads the VITE_* key; keep NEXT_PUBLIC_* for legacy/shared
          # callers that still run outside Vite's client env exposure.
          VITE_STEWARD_TENANT_ID: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'elizacloud' || 'elizacloud-staging' }}
          NEXT_PUBLIC_STEWARD_TENANT_ID: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'elizacloud' || 'elizacloud-staging' }}
          VITE_ENVIRONMENT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }}
          VITE_VOICE_REALTIME_WS: ${{ !((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && contains(fromJSON('["1","true","TRUE","True","yes","YES","Yes","on","ON","On"]'), vars.VOICE_REALTIME_WS_ENABLED) && '1' || '0' }}
          VITE_VOICE_REALTIME_FORCE: "0"
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          VITE_TELEGRAM_BOT_ID: ${{ vars.VITE_TELEGRAM_BOT_ID }}

      # Refuse to deploy a bundle where the bn.js/crypto graph folded into an
      # eager chunk (the "Class constructor cannot be invoked without 'new'"
      # Buffer.allocUnsafe module-init crash that blanks every route). This
      # regression has reached prod multiple times; fail the deploy instead.
      # HARD GATE: the chunking fold is fixed (#9150) — the `manualChunks` pin
      # now lives under `rollupOptions.output` (the key Vite reads) and folds
      # the crypto/wallet/solana graph into one lazy `vendor-crypto` chunk, so a
      # clean build passes and any future eager-chunk regression fails the deploy.
      - name: Legacy inline fallback - verify app chunks
        if: ${{ vars.CLOUD_CF_LEGACY_INLINE_BUILD == 'true' }}
        working-directory: ${{ env.CHECKOUT_DIR }}/packages/app
        run: bun run verify:chunks

      - name: Resolve Pages branch
        id: pages
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Pull-request Pages branch requires a valid immutable PR number"
              exit 1
            fi
            pages_branch="pr-${PR_NUMBER}"
            case "$pages_branch" in
              main|develop)
                echo "::error::Pull-request Pages branch may not target canonical branch $pages_branch"
                exit 1
                ;;
            esac
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TARGET_ENVIRONMENT" = "production" ]; then
            pages_branch="main"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pages_branch="develop"
          else
            pages_branch="${GITHUB_REF#refs/heads/}"
          fi
          echo "branch=$pages_branch" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare credentials
        id: cf
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            MSG="CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID not configured. Add them at https://github.com/elizaOS/eliza/settings/secrets/actions."
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::warning::$MSG Skipping Pages deploy (PR event)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$MSG Refusing to silently skip Pages deploy on $EVENT_NAME event." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$MSG Refusing to silently skip Pages deploy on $EVENT_NAME event."
              exit 1
            fi
          fi

      # Self-bootstrap the project so the first deploy on a fresh account works.
      # Idempotent: a "project already exists" error is expected and ignored.
      # Canonical custom domains are managed by the pages-domains Terraform
      # stack; this job only ensures the shared Pages project exists.
      - name: Ensure eliza-app Pages project exists
        if: steps.cf.outputs.configured == 'true'
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if output=$(bunx wrangler@4.100.0 pages project create eliza-app --production-branch=main 2>&1); then
            printf '%s\n' "$output"
            exit 0
          fi
          if printf '%s\n' "$output" | grep -Eqi 'already exists|project with (the )?name .?eliza-app.? exists'; then
            echo "::notice::Cloudflare Pages project eliza-app already exists"
            exit 0
          fi
          printf '%s\n' "$output" >&2
          echo "::error::Unable to create or confirm the eliza-app Pages project"
          exit 1

      # Freshness guard (#14083): skip a stale zombie run about to clobber a
      # newer served build. Fail-open on any ambiguous signal; force=true
      # bypasses for rollbacks. See the console job for the full rationale.
      - name: Deploy freshness guard
        id: freshness
        if: steps.cf.outputs.configured == 'true' && github.event_name != 'pull_request'
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          SERVED_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://cloud.eliza.app' || 'https://cloud-staging.eliza.app' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          args=(--run-sha "$GITHUB_SHA" --served-url "$SERVED_URL")
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          node packages/cloud/scripts/deploy-freshness-guard-cli.mjs "${args[@]}"

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true' && (github.event_name == 'pull_request' || steps.freshness.outputs.should_deploy == 'true')
        working-directory: ${{ env.CHECKOUT_DIR }}/packages/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_BRANCH: ${{ steps.pages.outputs.branch }}
          PAGES_PROJECT: eliza-app
        # Do NOT pass a positional `dist` argument: wrangler.toml already sets
        # `pages_build_output_dir = "./dist"`, and passing both makes wrangler
        # ignore wrangler.toml — which silently drops the `functions/` upload.
        run: |
          for attempt in 1 2 3; do
            if bunx wrangler@4.100.0 pages deploy --project-name="$PAGES_PROJECT" --branch="$PAGES_BRANCH"; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Cloudflare Pages deploy failed after ${attempt} attempts"
              exit 1
            fi
            echo "::warning::Cloudflare Pages deploy attempt ${attempt} failed; retrying"
            sleep $((attempt * 20))
          done

      - name: Verify Pages frontend freshness
        if: steps.cf.outputs.configured == 'true' && github.event_name != 'pull_request' && steps.freshness.outputs.should_deploy == 'true'
        working-directory: ${{ env.CHECKOUT_DIR }}
        env:
          DEPLOY_ENVIRONMENT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }}
          MARKETING_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://eliza.app' || 'https://staging.eliza.app' }}
          CLOUD_APP_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://cloud.eliza.app' || 'https://cloud-staging.eliza.app' }}
          API_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'https://api.eliza.app' || 'https://api-staging.eliza.app' }}
        run: |
          set -euo pipefail

          for served_url in "$MARKETING_URL" "$CLOUD_APP_URL"; do
            node packages/cloud/scripts/verify-pages-frontend-cli.mjs \
              --served-url "$served_url" \
              --dist packages/app/dist \
              --require-text "Signing in to your agent" \
              --require-text "This tab will continue automatically" \
              --require-text "Open this agent from Eliza Cloud"
          done

          verify_json_endpoint() {
            local endpoint="$1"
            local check="$2"
            local body
            body="$(mktemp)"
            local status
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' "$endpoint")"
            if [ "$status" != "200" ]; then
              echo "::error::$endpoint returned HTTP $status, expected 200"
              rm -f "$body"
              exit 1
            fi
            node -e '
              const fs = require("node:fs");
              const [path, check, expectedEnvironment, expectedIssuer] = process.argv.slice(1);
              const value = JSON.parse(fs.readFileSync(path, "utf8"));
              if (check === "health" && value.environment !== expectedEnvironment) {
                throw new Error(`environment beacon mismatch: expected ${expectedEnvironment}`);
              }
              if (check === "discovery" && value.issuer !== expectedIssuer) {
                throw new Error(`OIDC issuer mismatch: expected ${expectedIssuer}`);
              }
              if (check === "jwks" && !Array.isArray(value.keys)) {
                throw new Error("OIDC JWKS response has no keys array");
              }
            ' "$body" "$check" "$DEPLOY_ENVIRONMENT" "$API_URL"
            rm -f "$body"
          }

          verify_exact_api_route() {
            local endpoint="$1"
            local body headers status
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}' "$endpoint")"
            if ! [[ "$status" =~ ^[24][0-9][0-9]$ ]] || grep -Eqi '^content-type:.*text/html' "$headers"; then
              echo "::error::$endpoint did not reach the API Worker (HTTP $status)"
              rm -f "$body" "$headers"
              exit 1
            fi
            rm -f "$body" "$headers"
          }

          for served_url in "$MARKETING_URL" "$CLOUD_APP_URL"; do
            verify_json_endpoint "$served_url/api/health" health
            verify_exact_api_route "$served_url/api"
            verify_json_endpoint "$served_url/.well-known/openid-configuration" discovery
            verify_json_endpoint "$served_url/.well-known/oidc/jwks.json" jwks
            tenant_id="elizacloud"
            if [ "$DEPLOY_ENVIRONMENT" = "staging" ]; then
              tenant_id="elizacloud-staging"
            fi
            node packages/cloud/scripts/verify-steward-oauth-callbacks.mjs \
              --base-url "$served_url" \
              --callback-url "$served_url/login" \
              --tenant-id "$tenant_id"
          done

      - name: Clean temp checkout
        if: always()
        working-directory: /tmp
        run: |
          set -uo pipefail
          if [ -e "$CHECKOUT_DIR" ]; then
            stale_dir="/tmp/eliza-stale-checkout-${GITHUB_RUN_ID:-run}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-job}-$(date +%s)"
            mv "$CHECKOUT_DIR" "$stale_dir" 2>/dev/null || stale_dir="$CHECKOUT_DIR"
            nohup bash -c 'timeout 30s rm -rf "$1" || true' _ "$stale_dir" >/dev/null 2>&1 &
            echo "Scheduled best-effort cleanup for ${stale_dir}."
          fi

  # ---------------------------------------------------------------------------
  # Post-deploy routing verification (regression guard for "staging pointing at
  # prod CF"). After the Worker + consolidated Pages project deploy, probe the LIVE
  # custom domains of the just-deployed environment and assert each is served by
  # THAT environment -- not the other one leaking through the prod
  # legacy wildcard or a mis-mapped Pages custom domain. This does
  # NOT gate the deploy (it already happened); it surfaces a misroute as a red
  # check. Operators can also dispatch this workflow for an explicit recheck.
  # ---------------------------------------------------------------------------
  verify-routing:
    name: Verify ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || github.ref == 'refs/heads/main') && 'production' || 'staging' }} routing
    needs: [deploy-api, deploy-app]
    # Custom domains only exist for the real environments -- PR previews deploy to
    # a preview branch alias, so skip them. Require all three deploys to have
    # landed (the beacon is served by the API Worker; both frontend domains by
    # one Pages project), else there is nothing trustworthy to probe.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.deploy-api.result == 'success' && needs.deploy-app.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"

      - name: Resolve deployed environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" = "production" ]; then
            env=production
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            env=production
          else
            env=staging
          fi
          echo "environment=$env" >> "$GITHUB_OUTPUT"

      - name: Verify the just-deployed environment serves itself
        # This run built AND deployed the beacon-carrying Worker for this env, so
        # require the beacon: a beaconless answer means the deploy that was
        # supposed to carry it did not take. A genuine cross-wire is always fatal.
        run: |
          node packages/cloud/scripts/verify-environment-routing-cli.mjs \
            --environment "${{ steps.env.outputs.environment }}" \
            --require-beacon
