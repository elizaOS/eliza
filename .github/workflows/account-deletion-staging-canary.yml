name: Account deletion staging canary

on:
  workflow_dispatch:
    inputs:
      expected_cloud_commit:
        description: Exact 40-character commit currently served by staging
        required: true
        type: string
      expected_cluster_sha256:
        description: Reviewed staging PostgreSQL cluster receipt
        required: true
        type: string
      expected_authority_sha256:
        description: Reviewed staging PostgreSQL authority receipt
        required: true
        type: string
      confirmation:
        description: Type DELETE_DISPOSABLE_STAGING_ACCOUNTS
        required: true
        type: string

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    environment: staging
    concurrency:
      group: account-deletion-staging-canary
      cancel-in-progress: false
    env:
      ELIZA_ACCOUNT_DELETION_STAGING_CANARY: "1"
      ELIZA_ACCOUNT_DELETION_STAGING_CLOUD_BASE_URL: https://api-staging.eliza.app
      ELIZA_ACCOUNT_DELETION_STAGING_CLOUD_ORIGIN: https://cloud-staging.eliza.app
      ELIZA_ACCOUNT_DELETION_STAGING_STEWARD_BASE_URL: https://steward-api-staging.up.railway.app
      ELIZA_ACCOUNT_DELETION_STAGING_ALLOW_RAILWAY_SELF_SIGNED_TLS: "1"
      ELIZA_ACCOUNT_DELETION_STAGING_EXPECTED_CLOUD_COMMIT: ${{ inputs.expected_cloud_commit }}
      ELIZA_ACCOUNT_DELETION_STAGING_EXPECTED_CLUSTER_SHA256: ${{ inputs.expected_cluster_sha256 }}
      ELIZA_ACCOUNT_DELETION_STAGING_EXPECTED_AUTHORITY_SHA256: ${{ inputs.expected_authority_sha256 }}
      ELIZA_ACCOUNT_DELETION_STAGING_RUN_SUFFIX: r${{ github.run_id }}a${{ github.run_attempt }}
      ELIZA_ACCOUNT_DELETION_STAGING_EVIDENCE_PATH: reports/account-deletion-staging-canary.json
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STEWARD_PLATFORM_KEYS: ${{ secrets.STEWARD_PLATFORM_KEYS }}

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Require deliberate exact-commit staging authority
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COMMIT: ${{ inputs.expected_cloud_commit }}
          CHECKED_OUT_COMMIT: ${{ github.sha }}
        run: |
          bun -e '
            const expected = process.env.EXPECTED_COMMIT ?? "";
            const checkedOut = process.env.CHECKED_OUT_COMMIT ?? "";
            if (process.env.CONFIRMATION !== "DELETE_DISPOSABLE_STAGING_ACCOUNTS") process.exit(1);
            if (!/^[0-9a-f]{40}$/.test(expected)) process.exit(1);
            if (expected !== checkedOut) process.exit(1);
          '

      - name: Require protected staging authorities
        run: |
          bun -e '
            const required = [
              "DATABASE_URL",
              "STEWARD_PLATFORM_KEYS",
              "ELIZA_ACCOUNT_DELETION_STAGING_EXPECTED_CLUSTER_SHA256",
              "ELIZA_ACCOUNT_DELETION_STAGING_EXPECTED_AUTHORITY_SHA256",
            ];
            if (required.some((name) => !(process.env[name] ?? "").trim())) process.exit(1);
          '

      - name: Install deterministic dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate canary contracts
        run: >-
          bun test
          packages/cloud/scripts/admin/preflight-database-identity.test.ts
          packages/cloud/scripts/admin/account-deletion-staging-canary.test.ts
          packages/cloud/scripts/admin/account-deletion-staging-canary-workflow.test.ts

      - name: Run bounded disposable staging canary
        id: live
        continue-on-error: true
        run: bun run packages/cloud/scripts/admin/account-deletion-staging-canary.ts

      - name: Validate privacy-safe evidence
        id: privacy
        if: ${{ always() }}
        run: |
          bun -e '
            import { chmod, readFile } from "node:fs/promises";
            import { validateAccountDeletionStagingCanaryEvidence } from "./packages/cloud/scripts/admin/account-deletion-staging-canary.ts";
            const path = "reports/account-deletion-staging-canary.json";
            const artifact = JSON.parse(await readFile(path, "utf8"));
            if (!validateAccountDeletionStagingCanaryEvidence(artifact)) process.exit(1);
            await chmod(path, 0o600);
          '
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Upload identifier-free canary evidence
        if: ${{ always() && steps.privacy.outputs.validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: account-deletion-staging-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/account-deletion-staging-canary.json
          retention-days: 14
          if-no-files-found: error

      - name: Require successful lifecycle and cleanup
        if: ${{ always() }}
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          PRIVACY_VALIDATED: ${{ steps.privacy.outputs.validated }}
        run: |
          test "$LIVE_OUTCOME" = "success"
          test "$PRIVACY_VALIDATED" = "true"
