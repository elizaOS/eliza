name: UI Extended Fixture E2E

# Runs the complementary packages/ui browser fixtures that need WebKit or
# protect specialized settings, chat, permission, localization, and performance
# behavior. ui-e2e-gate.yml owns the core Chromium fixture set so no suite is
# repeated across the two parallel lanes.

on:
  # Reusable entry for the scheduled exhaustive develop lane (#12342).
  workflow_call:
    inputs:
      concurrency_scope:
        description: "Caller-owned concurrency namespace"
        required: false
        type: string
        default: standalone

# Develop pushes share a stable key so obsolete work is superseded. Reusable
# callers pass a distinct scope for exhaustive work.
concurrency:
  group: ui-fixture-e2e-${{ inputs.concurrency_scope || 'standalone' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

jobs:
  fixture-e2e:
    # WebKit needs host libraries that the generic Hetzner fleet does not
    # provision, and those runners do not grant the installer passwordless
    # sudo. Keep this cross-engine lane on a disposable, fully provisionable
    # host so a green result certifies WebKit actually launched.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --frozen-lockfile
          install-native-deps: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Install Playwright Chromium + WebKit
        run: PLAYWRIGHT_INSTALL_CWD=packages/ui .github/scripts/install-playwright-browsers.sh chromium webkit

      # The permission-priming fixture pulls @elizaos/shared, whose i18n module
      # loads generated keyword data that is gitignored. Generate it so the
      # esbuild bundle resolves (mirrors ui-e2e-gate.yml / chat-shell-gestures.yml).
      - name: Ensure generated shared i18n data
        run: node packages/app-core/scripts/ensure-shared-i18n-data.mjs

      # Settings page sections and persisted local state.
      - name: Settings page e2e
        run: bun run --cwd packages/ui test:settings-e2e

      # Infinite upward scroll (#13532): the REAL useLoadOlderOnScroll +
      # loadOlderConversationMessages — scroll-to-top fires a ?before= fetch,
      # older rows prepend, the viewport anchor stays put, plus the empty-history
      # (no fetch) and fetch-failure (no fabricated prepend, no retry storm) legs.
      # Both engines: scroll-anchor-on-prepend is engine-specific and was FLAKY
      # on WebKit until #14329 (double-rAF anchor expiry) — this lane guards it.
      - name: Chat infinite-scroll e2e (chromium)
        run: bun run --cwd packages/ui test:chat-infinite-scroll-e2e
      - name: Chat infinite-scroll e2e (webkit)
        run: ENGINE=webkit bun run --cwd packages/ui test:chat-infinite-scroll-e2e

      # Wallet widget default + held-balance display states.
      - name: Wallet widget e2e
        run: bun run --cwd packages/ui test:wallet-widget-e2e

      # Agent-activity surfaces (#13535): the REAL TurnStatus working indicator +
      # ToolCallEventLog inline row across thinking / tool-running / settled, after
      # the 900ms grace, desktop + mobile.
      - name: Activity feedback e2e
        run: bun run --cwd packages/ui test:activity-feedback-e2e

      # Inline task-activity pipeline (#13536): the grouped task → sub-agent →
      # step tree (nested sub-agents, in-place tool steps, live plan checklist,
      # workflow pipeline) renders on real store shapes with a clean console.
      - name: Task pipeline widget e2e
        run: bun run --cwd packages/ui test:task-pipeline-e2e

      # Onboarding permission-priming modal: the soft-ask gesture flow end to end
      # (Enable → OS request → advance, scripted denial → recovery callout →
      # Continue, final grant → primed), desktop + mobile.
      - name: Permission priming e2e
        run: bun run --cwd packages/ui test:permission-priming-e2e

      # Divider drag interaction stays within the perf budget under real layout.
      - name: Divider drag perf gate
        run: bun run --cwd packages/ui test:divider-drag-perf-gate

      # Locale-sensitive home shell labels render without falling back to keys.
      - name: Home locale e2e
        run: bun run --cwd packages/ui test:home-locale-e2e

      # Real-browser widget certification evidence layer.
      - name: Widget certification e2e
        run: bun run --cwd packages/ui test:widget-cert-e2e

      - name: Upload extended fixture e2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-extended-fixture-e2e-output
          path: |
            packages/ui/src/components/pages/__e2e__/output-infinite-scroll
            packages/ui/src/components/pages/__e2e__/output-settings
            packages/ui/src/components/chat/widgets/__e2e__/output
            packages/ui/src/components/chat/widgets/__e2e__/output-wallet
            packages/ui/src/components/chat/__e2e__/output-activity-feedback
            packages/ui/src/components/permissions/__e2e__/output-permission-priming
            packages/ui/src/components/composites/__e2e__/output-divider-perf
            packages/ui/tmp/home-locale-e2e
            packages/ui/src/testing/__e2e__/output-widget-cert
          retention-days: 14
          if-no-files-found: ignore
