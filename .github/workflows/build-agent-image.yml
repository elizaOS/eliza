name: Build Agent Image

run-name: Agent image ${{ inputs.source_sha || github.sha }} ${{ inputs.effect_digest || 'manual' }}

# Single source of truth for the cloud-agent container image used by the
# cloud sandbox provisioner. Manual dispatch remains available; Develop Full
# also dispatches it through the exact-SHA durable effect reconciler.
# The previous release-only workflow (image.yaml) duplicated this entire
# pre-build sequence; it's been deleted in favor of this consolidated build.

on:
  workflow_dispatch:
    inputs:
      publication_target:
        description: Immutable GHCR destination for this manual build
        required: true
        default: canonical
        type: choice
        options:
          - canonical
          - demo
      source_sha:
        description: Exact develop SHA supplied by the effect reconciler
        required: false
        default: ""
        type: string
      effect_digest:
        description: Exact reconciler input digest; empty for manual operation
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEMO_IMAGE_REPOSITORY: ghcr.io/elizaos/eliza-demo
  BUN_VERSION: "1.3.14"

# Default to least privilege. Override per-job where needed.
# Manual publications always finish because they publish operator-selected targets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: false
          show-progress: false

      - name: Validate reconciled source
        if: ${{ inputs.effect_digest != '' }}
        env:
          EFFECT_DIGEST: ${{ inputs.effect_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid reconciled source SHA"; exit 1; }
          [[ "$EFFECT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid reconciled effect digest"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || { echo "::error::Checkout does not match reconciled source"; exit 1; }

      - name: Ensure Docker daemon access
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            exit 0
          fi
          docker_socket=/var/run/docker.sock
          if [ ! -S "$docker_socket" ]; then
            echo "::error::Docker is installed, but its daemon socket is unavailable." >&2
            exit 1
          fi
          if ! command -v sudo >/dev/null 2>&1 || ! sudo -n true; then
            echo "::error::The runner cannot repair Docker socket access without passwordless sudo." >&2
            exit 1
          fi
          # Buildx invokes Docker as the runner account, so proving only that
          # `sudo docker` works would leave the publication step broken. Prefer
          # a per-user ACL; the ownership fallback is limited to dedicated
          # runners where the ACL utility is not installed.
          if command -v setfacl >/dev/null 2>&1; then
            sudo -n setfacl -m "u:$(id -u):rw" "$docker_socket"
          elif [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
            sudo -n chown "$(id -u):$(id -g)" "$docker_socket"
            sudo -n chmod u+rw "$docker_socket"
          else
            echo "::error::Docker socket ACL tooling is unavailable on this runner." >&2
            exit 1
          fi
          docker info

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -a -f || true

      - name: Install jq
        # Used by docker-ci-smoke's boot-KPI budget parser after the image is
        # built. Keep it explicit so the real boot gate reports the committed
        # budget instead of falling back to its baked-in default.
        run: sudo apt-get install -y --no-install-recommends jq

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
            bun-${{ runner.os }}-

      - name: Install dependencies
        # The image must be built from the reviewed dependency graph; lockfile
        # drift is a release failure rather than an input to resolve in CI.
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
        run: |
          bun install --frozen-lockfile

      - name: Cache Turbo build outputs
        # The turbo build below is the single biggest pre-docker cost (~5-6
        # min from cold). Nothing persisted turbo's local task cache between
        # runs, so every push rebuilt every filtered package from scratch.
        # Keying on the commit SHA (with a prefix restore-key) restores the
        # most recent cache and saves an updated one each run, so a typical
        # source commit only rebuilds the packages it actually touched.
        # The key prefix is workflow-specific: entries here are produced
        # under NODE_ENV=production, which turbo does not hash, so they must
        # not be replayed into other workflows' builds.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo/cache
          key: turbo-agent-image-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-agent-image-${{ runner.os }}-

      - name: Apply postinstall patches
        # Belt-and-suspenders for the postinstall path: even with
        # `bun install` (postinstall enabled), the silent fallback that
        # kicks in when frozen-lockfile drifts doesn't always re-run the
        # repo postinstall in CI. Explicitly run the patches the
        # per-plugin builds depend on:
        #   - ensure-type-package-aliases: materializes @types/* under
        #     node_modules/@types so `tsc --build` resolves them.
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
        run: |
          node packages/app-core/scripts/ensure-type-package-aliases.mjs

      - name: Build Docker workspace artifacts
        # Let Turbo derive the build order and reuse task cache instead of
        # hand-maintaining the core/package/plugin sequence. The explicit
        # filters include the app, the agent entrypoint, and every dynamically
        # loaded plugin whose dist must exist before Dockerfile.ci relinks the
        # local workspace packages into the image.
        env:
          NODE_ENV: production
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
        run: |
          node packages/scripts/run-turbo.mjs run build --concurrency=8 \
            --filter=@elizaos/app \
            --filter=@elizaos/agent \
            --filter=@elizaos/plugin-sql \
            --filter=@elizaos/plugin-video \
            --filter=@elizaos/plugin-agent-skills \
            --filter=@elizaos/plugin-pdf \
            --filter=@elizaos/plugin-browser \
            --filter=@elizaos/plugin-capacitor-bridge \
            --filter=@elizaos/plugin-coding-tools \
            --filter=@elizaos/plugin-native-filesystem \
            --filter=@elizaos/plugin-commands \
            --filter=@elizaos/plugin-computeruse \
            --filter=@elizaos/plugin-discord \
            --filter=@elizaos/plugin-elizacloud \
            --filter=@elizaos/plugin-imessage \
            --filter=@elizaos/plugin-local-inference \
            --filter=@elizaos/plugin-mcp \
            --filter=@elizaos/plugin-telegram \
            --filter=@elizaos/plugin-x \
            --filter=@elizaos/plugin-whatsapp \
            --filter=@elizaos/plugin-wallet \
            --filter=@elizaos/plugin-workflow

      - name: Prune stale Turbo cache entries
        # actions/cache restores + re-saves the whole cache dir, so without a
        # prune the tarball grows by every commit's changed-package outputs
        # forever. tar preserves mtimes, so age-based deletion bounds it:
        # entries untouched for two weeks are long since superseded.
        run: find .turbo/cache -type f -mtime +14 -delete 2>/dev/null || true

      - name: Normalize plugin dist for Node ESM
        # MUST run AFTER the Turbo build above. Some package builds still emit
        # extensionless or directory specifiers (`./actions/index`,
        # `./approvals`) in dist. The container loads those built `.js` files
        # via import(), and neither tsx nor plain `node` resolves them. Apply
        # the same rewrite the agent's own build uses to EVERY built plugin
        # dist, last, so the dist that actually ships is Node-ESM-resolvable.
        run: |
          shopt -s nullglob
          for dist in plugins/*/dist; do
            pkg="$(dirname "$dist")"
            node packages/scripts/rewrite-dist-relative-imports-node-esm.mjs "$pkg" || true
          done

      - name: Prepare CI dockerignore
        # The root .dockerignore is tuned for `bun install` runs (excludes
        # everything heavy). The Docker build needs a different policy:
        # keep root node_modules (Dockerfile.ci's pruner relink scripts
        # consume them) but strip per-package node_modules and the other
        # bulky CI-only inputs. Use the canonical CI dockerignore from
        # packages/app-core/deploy/.dockerignore.ci, mirroring what
        # docker-ci-smoke.sh does before its `docker build`.
        run: |
          cp packages/app-core/deploy/.dockerignore.ci .dockerignore

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=10485760
            env.BUILDKIT_STEP_LOG_MAX_SPEED=10485760

      # The demo repository is an operator-only canary boundary, not a
      # caller-supplied registry escape hatch. Keep the mapping in shell as a
      # second fail-closed check behind workflow_dispatch's choice input, and
      # force every non-manual event to the canonical repository.
      - name: Resolve publication repository
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_target || 'canonical' }}
        run: |
          set -euo pipefail
          canonical_repository="$(
            printf '%s/%s' "$REGISTRY" "$IMAGE_NAME" |
              tr '[:upper:]' '[:lower:]'
          )"
          case "$REQUESTED_TARGET" in
            canonical)
              destination_repository="$canonical_repository"
              ;;
            demo)
              if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
                echo "::error::The demo image repository is available only to workflow_dispatch." >&2
                exit 1
              fi
              destination_repository="$DEMO_IMAGE_REPOSITORY"
              ;;
            *)
              echo "::error::Unsupported publication target." >&2
              exit 1
              ;;
          esac
          # The image is always built, booted, and first published through the
          # canonical repository. Demo publication is a digest-preserving
          # server-side promotion below, so it cannot drift from those bytes.
          echo "name=$canonical_repository" >> "$GITHUB_OUTPUT"
          echo "metadata_name=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "destination_name=$destination_repository" >> "$GITHUB_OUTPUT"
          echo "publication_target=$REQUESTED_TARGET" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.image.outputs.metadata_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # develop push  → :develop + :sha-<short>
          # main push     → :stable + :latest + :sha-<short>
# Keeping :latest on main avoids breaking the four code sites that
          # still hardcode it (containers-env fallback, sandbox-provider
          # fallback, two test fixtures) until they migrate to :stable.
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      # Build the image into the local Docker daemon first (load, do NOT push).
      # The boot-verification step below runs the REAL agent entrypoint against
      # this exact image, and the push step ships these same loaded bytes by
      # retagging the local image. This is the gate that stops a container which
      # crashes on startup (missing runtime deps, broken entrypoint) from
      # reaching ghcr. `provenance: false` keeps the loaded image a single-
      # platform image so the retag-and-push below publishes the same content
      # that was verified (no second build, no "latest yt-dlp" drift between the
      # verified and published image).
      - id: build-local
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: packages/app-core/deploy/Dockerfile.ci
          push: false
          load: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:ci-boot-verify
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Registry-backed build cache (checked first), with the old GHA
          # cache kept as a read-only fallback. The GHA backend shares one
          # repo-wide 10GB budget with every other workflow; this image's
          # mode=max cache is multi-GB per run, so it was evicted before the
          # next develop push — recent runs show ZERO cached layers while
          # still spending 4+ min per run exporting a cache nothing ever
          # read (which is also why cache-to no longer writes to gha). The
          # ghcr :buildcache ref persists indefinitely and dedupes by blob
          # digest, so stable layers (apt/tailscale/yt-dlp/tsx base, and the
          # manifest-keyed runtime-deps npm closure) hit reliably and the
          # per-run cache export only uploads blobs ghcr doesn't already
          # have. image-manifest+oci-mediatypes make the cache manifest a
          # ghcr-compatible OCI artifact.
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Verify image boots (real agent entrypoint)
        # Runs the production entrypoint (node --import
        # /opt/tsx/node_modules/tsx/dist/loader.mjs packages/agent/dist/bin.js
        # start) inside the just-built image and fails RED if the agent crashes
        # on startup, exits non-zero, logs a known crash signature (Cannot find
        # package/module, Failed to start, crashed during init, ...), never
        # serves /api/health within the timeout, or crashes during the
        # post-health stability window. A failure here blocks the push below, so
        # a non-bootable image is never published.
        env:
          DOCKER_IMAGE: ${{ steps.image.outputs.name }}:ci-boot-verify
          BOOT_VERIFY_ONLY: "true"
          SMOKE_TIMEOUT_SEC: "180"
          BOOT_STABLE_WINDOW_SEC: "15"
          SMOKE_PORT: "32138"
          CONTAINER_PORT: "42138"
          # Enforce the boot-KPI cold-readyMs budget (#8812 item 5). The budget
          # (boot.coldReadyMs, 25000ms) carries ~5x headroom over the ~5s real
          # cold boot, and emit_boot_kpi downgrades a breach to a warning when the
          # runner is heavily contended, so this only fails on a genuine multi-x
          # boot-time regression — not on transient runner load.
          BOOT_KPI_ENFORCE: "1"
        run: bash packages/app-core/scripts/docker-ci-smoke.sh --boot-verify-only

      # Push the EXACT verified image. This runs only if the boot verification
      # above succeeded (steps run in order; a failed step fails the job). We
      # retag the locally-loaded :ci-boot-verify image to each computed tag and
      # `docker push` it, so the published bytes are byte-for-byte the image
      # that just booted cleanly. No rebuild means no chance of shipping a
      # different image than the one that was verified.
      - name: Fence current develop SHA before publication
        if: ${{ inputs.effect_digest != '' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin refs/heads/develop | awk 'NR == 1 { print $1 }')"
          [ "$current_sha" = "$SOURCE_SHA" ] || {
            echo "::error::Develop advanced from reconciled source $SOURCE_SHA to ${current_sha:-unresolved}; refusing publication"
            exit 1
          }

      - name: Push exact verified image
        id: push
        env:
          LOCAL_IMAGE: ${{ steps.image.outputs.name }}:ci-boot-verify
          PUBLISH_REPOSITORY: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          verified_image_id="$(docker image inspect --format '{{ .Id }}' "$LOCAL_IMAGE")"
          if [[ ! "$verified_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The boot-verified local image has no valid image ID." >&2
            exit 1
          fi
          first_tag=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            case "$tag" in
              "$PUBLISH_REPOSITORY":*) ;;
              *)
                echo "::error::Refusing to push a tag outside the selected publication repository." >&2
                exit 1
                ;;
            esac
            [ -z "$first_tag" ] && first_tag="$tag"
            echo "Tagging $LOCAL_IMAGE as $tag and pushing"
            docker tag "$LOCAL_IMAGE" "$tag"
            tagged_image_id="$(docker image inspect --format '{{ .Id }}' "$tag")"
            if [ "$tagged_image_id" != "$verified_image_id" ]; then
              echo "::error::The publication tag does not identify the boot-verified local image." >&2
              exit 1
            fi
            docker push "$tag"
          done <<< "$TAGS"
          if [ -z "$first_tag" ]; then
            echo "::error::No image tags were produced for publication." >&2
            exit 1
          fi
          # Resolve only a digest bound to the canonical publication source. A local
          # image can carry RepoDigests from multiple repositories, so taking
          # the first entry could attest the wrong subject.
          digest=""
          while IFS= read -r repo_digest; do
            case "$repo_digest" in
              "$PUBLISH_REPOSITORY"@sha256:*)
                digest="${repo_digest#*@}"
                break
                ;;
            esac
          done < <(docker inspect --format '{{ range .RepoDigests }}{{ println . }}{{ end }}' "$first_tag")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published image has no digest for the canonical repository." >&2
            exit 1
          fi
          immutable_tag=""
          while IFS= read -r tag; do
            case "$tag" in
              "$PUBLISH_REPOSITORY":sha-*)
                if [ -n "$immutable_tag" ]; then
                  echo "::error::More than one immutable SHA tag was produced." >&2
                  exit 1
                fi
                immutable_tag="$tag"
                ;;
            esac
          done <<< "$TAGS"
          if [ -z "$immutable_tag" ]; then
            echo "::error::No immutable SHA tag was produced for publication." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_id=$verified_image_id" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=$immutable_tag" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        if: ${{ steps.push.outputs.digest != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Setup digest-preserving image promotion
        if: ${{ steps.image.outputs.publication_target == 'demo' }}
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b
        with:
          version: v0.20.6

      - name: Promote exact canonical digest to demo
        if: ${{ steps.image.outputs.publication_target == 'demo' }}
        id: promote-demo
        env:
          DESTINATION_REPOSITORY: ${{ steps.image.outputs.destination_name }}
          SOURCE_DIGEST: ${{ steps.push.outputs.digest }}
          SOURCE_IMMUTABLE_TAG: ${{ steps.push.outputs.immutable_tag }}
          SOURCE_REPOSITORY: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_REPOSITORY" != "ghcr.io/elizaos/eliza" ]; then
            echo "::error::Demo promotion requires the canonical elizaOS source repository." >&2
            exit 1
          fi
          if [ "$DESTINATION_REPOSITORY" != "ghcr.io/elizaos/eliza-demo" ]; then
            echo "::error::Demo promotion destination is outside the closed allowlist." >&2
            exit 1
          fi
          case "$SOURCE_IMMUTABLE_TAG" in
            "$SOURCE_REPOSITORY":sha-*) tag_name="${SOURCE_IMMUTABLE_TAG#*:}" ;;
            *)
              echo "::error::Demo promotion requires the canonical immutable SHA tag." >&2
              exit 1
              ;;
          esac
          destination_tag="${DESTINATION_REPOSITORY}:${tag_name}"
          crane copy \
            "$SOURCE_REPOSITORY@$SOURCE_DIGEST" \
            "$destination_tag"
          destination_digest="$(crane digest "$destination_tag")"
          if [ "$destination_digest" != "$SOURCE_DIGEST" ]; then
            echo "::error::Demo promotion changed the canonical manifest digest." >&2
            exit 1
          fi
          echo "digest=$destination_digest" >> "$GITHUB_OUTPUT"
          echo "name=$DESTINATION_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Generate demo artifact attestation
        if: ${{ steps.image.outputs.publication_target == 'demo' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.promote-demo.outputs.name }}
          subject-digest: ${{ steps.promote-demo.outputs.digest }}
          push-to-registry: true

      - name: Verify canonical image is anonymously pullable
        if: ${{ steps.image.outputs.publication_target == 'canonical' }}
        env:
          EXPECTED_DIGEST: ${{ steps.push.outputs.digest }}
          EXPECTED_IMAGE_ID: ${{ steps.push.outputs.image_id }}
          GHCR_REPOSITORY: elizaos/eliza
        # Package visibility is an organization setting; GitHub's Packages
        # REST API exposes no visibility mutation. Prove the actual contract
        # after bounded propagation retries instead of trusting the historical
        # unsupported package-visibility request.
        run: |
          node packages/scripts/verify-ghcr-anonymous-manifest.mjs \
            --repository "$GHCR_REPOSITORY" \
            --digest "$EXPECTED_DIGEST" \
            --image-id "$EXPECTED_IMAGE_ID"

      - name: Verify demo image is anonymously pullable
        if: ${{ steps.image.outputs.publication_target == 'demo' }}
        env:
          EXPECTED_DIGEST: ${{ steps.promote-demo.outputs.digest }}
          EXPECTED_IMAGE_ID: ${{ steps.push.outputs.image_id }}
          GHCR_REPOSITORY: elizaos/eliza-demo
        run: |
          node packages/scripts/verify-ghcr-anonymous-manifest.mjs \
            --repository "$GHCR_REPOSITORY" \
            --digest "$EXPECTED_DIGEST" \
            --image-id "$EXPECTED_IMAGE_ID"
