name: Publish Flatpak Side-load Bundle

# Flathub submission is intentionally not implemented: the checked-in Flatpak
# manifests consume a generated, git-ignored runtime directory, so Flathub's
# network-isolated remote builder cannot reproduce the application. Until an
# immutable public runtime source exists, publication means building the
# x86_64 side-load bundle from the exact release tag, smoke-testing the
# installed app, and attaching the verified bytes to the GitHub release. That
# entire path lives in publish-packages.yml; this workflow only preserves the
# version/tag call contract for release-all.yml and manual dispatch.
on:
  workflow_call:
    inputs:
      version:
        description: Semver string e.g. 2.0.1
        required: true
        type: string
      tag:
        description: Git tag e.g. v2.0.1
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver string e.g. 2.0.1
        required: true
        type: string
      tag:
        description: Git tag e.g. v2.0.1
        required: true
        type: string

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  guard-tag-contract:
    name: Reject mismatched version/tag inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require tag to be v<version>
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$INPUT_TAG" != "v$INPUT_VERSION" ]; then
            echo "::error::Flatpak publication requires tag \"v$INPUT_VERSION\"; received \"$INPUT_TAG\". publish-packages.yml checks out and verifies v<version> exactly."
            exit 1
          fi

  build-side-load-bundle:
    name: Verified x86_64 side-load bundle
    needs: guard-tag-contract
    permissions:
      contents: write
    uses: ./.github/workflows/publish-packages.yml
    with:
      version: ${{ inputs.version }}
      pypi: false
      snap: false
      flatpak: true
      apt: false
    secrets: inherit
