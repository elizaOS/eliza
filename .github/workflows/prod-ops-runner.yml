# This manual doctor is the only bootstrap proof for the dedicated production
# operations runner. Runner-group workflow restrictions and the protected
# production environment must both admit the job before the host can execute it.
name: Prod Ops Runner

on:
  workflow_dispatch:

concurrency:
  group: prod-ops-runner-doctor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate canonical source
    runs-on:
      group: prod-ops
      labels: [self-hosted, Linux, X64, prod-ops]
    timeout-minutes: 2
    steps:
      - name: Require production main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$SOURCE_REF" = "refs/heads/main" ] || {
            echo "::error::Prod Ops Runner must run from refs/heads/main"
            exit 1
          }

  doctor:
    name: Verify protected prod-ops runner
    needs: validate-source
    runs-on:
      group: prod-ops
      labels: [self-hosted, Linux, X64, prod-ops]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify runner identity and workload isolation
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          [ "$RUNNER_OS" = "Linux" ]
          [ "$RUNNER_ARCH" = "X64" ]
          [[ "$RUNNER_NAME" == eliza-prod-ops-* ]]
          [ -f /etc/eliza/prod-ops-runner ]
          grep -qx 'role=github-actions-prod-ops' /etc/eliza/prod-ops-runner
          grep -qx 'runner_group=prod-ops' /etc/eliza/prod-ops-runner
          grep -qx 'public_pr_jobs=forbidden' /etc/eliza/prod-ops-runner

          for service in forgejo caddy eliza-provisioning-worker docker; do
            if systemctl is-active --quiet "$service"; then
              echo "::error::Forbidden co-located service is active: $service"
              exit 1
            fi
          done

          [ ! -e /var/lib/forgejo ]
          [ ! -e /opt/eliza/cloud ]
          available_kib=$(df --output=avail /opt/actions-runner | tail -1 | tr -d ' ')
          [ "$available_kib" -ge 10485760 ] || {
            echo "::error::prod-ops runner has less than 10 GiB free"
            exit 1
          }
          echo "Protected prod-ops runner identity, disk, and workload isolation verified."
