# Triggers the homebrew tap repo to update formula + cask
# when a new GitHub release is published.
#
# Required secret: HOMEBREW_TAP_TOKEN
#   A GitHub PAT with repo scope for elizaOS/homebrew-tap

name: Update Homebrew Tap

on:
  workflow_call:
    inputs:
      version:
        description: "Version to update to (e.g. 2.0.0-beta.0)"
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g. 2.0.0-beta.0)"
        required: true
        type: string

concurrency:
  group: update-homebrew
  cancel-in-progress: false

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  update-tap:
    name: Trigger Homebrew tap update
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    steps:
      - name: Require credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required for an enabled Homebrew update"
            exit 1
          fi

      - name: Determine version
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Homebrew updates require an exact stable semver version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Triggering Homebrew update for version: $VERSION"

      - name: Dispatch to homebrew-tap
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: elizaOS/homebrew-tap
          event-type: update-homebrew
          client-payload: '{"version": "${{ steps.meta.outputs.version }}"}'
