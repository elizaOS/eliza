name: Staging session exchange identity

# Resolves the non-secret fixture identity to compare with the three staging allowlists.
# The protected runner keeps the API key and database connection private.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-session-exchange-identity
  cancel-in-progress: false

jobs:
  identity:
    name: Resolve staging API key identity
    if: github.repository == 'elizaOS/eliza' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Check out exact staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up pinned Bun and workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: 1.4.2
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          run-postinstall: "false"
          install-command: bun install --frozen-lockfile --ignore-scripts

      - name: Build required linked runtime
        run: bun run build:core

      - name: Compare the exact active staging fixture with the allowlists
        env:
          ELIZA_OPERATOR_ENVIRONMENT: staging
          ELIZAOS_CLOUD_API_KEY: ${{ secrets.STAGING_SESSION_EXCHANGE_FIXTURE_API_KEY }}
          STAGING_SESSION_EXCHANGE_FIXTURE_SUBJECT: ${{ vars.STAGING_SESSION_EXCHANGE_FIXTURE_SUBJECT }}
          STAGING_SESSION_EXCHANGE_GRANT_READ_KEY: ${{ secrets.STAGING_SESSION_EXCHANGE_GRANT_READ_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOWED_API_KEY_IDS: ${{ vars.STAGING_SESSION_EXCHANGE_ALLOWED_API_KEY_IDS }}
          ALLOWED_USER_IDS: ${{ vars.STAGING_SESSION_EXCHANGE_ALLOWED_USER_IDS }}
          ALLOWED_ORGANIZATION_IDS: ${{ vars.STAGING_SESSION_EXCHANGE_ALLOWED_ORGANIZATION_IDS }}
        run: bun run packages/cloud/scripts/admin/staging-session-exchange-identity-report.ts
