name: Staging session exchange identity

# Resolves the non-secret fixture identity to compare with the three staging allowlists.
# The protected runner keeps the API key and database connection private.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-session-exchange-identity
  cancel-in-progress: false

jobs:
  identity:
    name: Resolve staging API key identity
    if: github.repository == 'elizaOS/eliza' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    outputs:
      fixture_digest: ${{ steps.fixture.outputs.fixture_digest }}
    steps:
      - name: Check out exact staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up pinned Bun and workspace dependencies
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: 1.4.2
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          run-postinstall: "false"
          install-command: bun install --frozen-lockfile --ignore-scripts

      - name: Build required linked runtime
        run: bun run build:core

      - name: Compare the exact active staging fixture with the allowlists
        id: fixture
        env:
          ELIZA_OPERATOR_ENVIRONMENT: staging
          ELIZAOS_CLOUD_API_KEY: ${{ secrets.STAGING_SESSION_EXCHANGE_FIXTURE_API_KEY }}
          STAGING_SESSION_EXCHANGE_FIXTURE_SUBJECT: ${{ vars.STAGING_SESSION_EXCHANGE_FIXTURE_SUBJECT }}
          STAGING_SESSION_EXCHANGE_GRANT_READ_KEY: ${{ secrets.STAGING_SESSION_EXCHANGE_GRANT_READ_KEY }}
          STAGING_SESSION_EXCHANGE_FIXTURE_EMAIL: ${{ secrets.STAGING_SESSION_EXCHANGE_FIXTURE_EMAIL }}
          STAGING_SESSION_EXCHANGE_FIXTURE_WALLET_ADDRESS: ${{ secrets.STAGING_SESSION_EXCHANGE_FIXTURE_WALLET_ADDRESS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOWED_API_KEY_IDS: ${{ vars.STAGING_SESSION_EXCHANGE_ALLOWED_API_KEY_IDS }}
          ALLOWED_USER_IDS: ${{ vars.STAGING_SESSION_EXCHANGE_ALLOWED_USER_IDS }}
          ALLOWED_ORGANIZATION_IDS: ${{ vars.STAGING_SESSION_EXCHANGE_ALLOWED_ORGANIZATION_IDS }}
        run: bun run packages/cloud/scripts/admin/staging-session-exchange-identity-report.ts

  operator:
    name: Check product operator read access
    needs: identity
    if: github.repository == 'elizaOS/eliza' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    environment: staging
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Read only the independently verified staging membership
        env:
          EXPECTED_DIGEST: ${{ needs.identity.outputs.fixture_digest }}
          FIXTURE_KEY: ${{ secrets.STAGING_SESSION_EXCHANGE_FIXTURE_API_KEY }}
          FIXTURE_EMAIL: ${{ secrets.STAGING_SESSION_EXCHANGE_FIXTURE_EMAIL }}
          FIXTURE_WALLET: ${{ secrets.STAGING_SESSION_EXCHANGE_FIXTURE_WALLET_ADDRESS }}
          FIXTURE_SUBJECT: ${{ vars.STAGING_SESSION_EXCHANGE_FIXTURE_SUBJECT }}
          STEWARD_PLATFORM_KEYS: ${{ secrets.STEWARD_PLATFORM_KEYS }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const { EXPECTED_DIGEST, FIXTURE_EMAIL, FIXTURE_KEY, FIXTURE_SUBJECT, FIXTURE_WALLET, STEWARD_PLATFORM_KEYS } = process.env;
          async function readMembership() {
            const email = FIXTURE_EMAIL?.trim().toLowerCase();
            const wallet = FIXTURE_WALLET?.trim().toLowerCase();
            const operator = STEWARD_PLATFORM_KEYS?.split(',', 1)[0]?.trim();
            if (!EXPECTED_DIGEST || (!email && !wallet) || !FIXTURE_KEY || !operator) return 'not requested';
            const get = (url, headers) => fetch(url, { headers, redirect: 'error', signal: AbortSignal.timeout(15000) });
            const cloud = await get('https://api-staging.eliza.app/api/v1/user', { Authorization: `Bearer ${FIXTURE_KEY}` });
            if (!cloud.ok) return 'fixture unavailable';
            const { data: user } = await cloud.json();
            const subject = user?.steward_user_id;
            const matchesPrincipal = wallet
              ? /^0x[0-9a-f]{40}$/.test(wallet) && user?.wallet_verified === true &&
                user.wallet_chain_type === 'ethereum' && user.wallet_address?.toLowerCase() === wallet
              : user?.email_verified === true && user.email?.trim().toLowerCase() === email;
            if (!matchesPrincipal || user.role !== 'owner' || user.is_active !== true || user.is_anonymous !== false ||
                user.organization?.is_active !== true || typeof subject !== 'string' ||
                !/^[\da-f]{8}-[\da-f]{4}-[\da-f]{4}-[\da-f]{4}-[\da-f]{12}$/i.test(subject) ||
                (FIXTURE_SUBJECT?.trim() && FIXTURE_SUBJECT.trim() !== subject)) return 'fixture mismatch';
            const digest = createHash('sha256').update(JSON.stringify([user.id, user.organization.id, subject])).digest('hex');
            if (digest !== EXPECTED_DIGEST) return 'fixture mismatch';
            const tenant = 'elizacloud-staging';
            const response = await get(`https://login-staging.eliza.app/platform/tenants/${tenant}/users/${subject}`,
              { 'X-Steward-Platform-Key': operator });
            if (response.status === 401 || response.status === 403) return 'denied';
            if (!response.ok) return 'unavailable';
            const profile = await response.json();
            return profile.ok === true && profile.data?.userId === subject && profile.data.tenantId === tenant
              ? 'verified' : 'unavailable';
          }
          const verdict = await readMembership().catch(() => 'unavailable');
          const summary = `Existing product operator read access to the exact staging membership: ${verdict}\n`;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          process.stdout.write(summary);
          JS
