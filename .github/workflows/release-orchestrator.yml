name: Release Orchestrator

# This is the only full-cohort npm and GitHub Release entry point. It passes one
# immutable source identity into the transactional npm workflow and does not
# fan out to any downstream distribution until that workflow has verified the
# registry cohort, exact tag, and GitHub Release through explicit outputs.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA of the prepared release candidate
        required: true
        type: string
      source_ref:
        description: Canonical branch ref whose exact tip was verified
        required: true
        type: string
      version:
        description: Exact canonical semver present in every cohort manifest
        required: true
        type: string
      channel:
        description: Public release channel
        required: true
        type: choice
        options:
          - beta
          - latest
      npm_publisher:
        description: Exact npm username represented by the protected token
        required: true
        type: string
      candidate_run_id:
        description: Prior candidate run to resume without rebuilding (0 creates one)
        required: false
        type: number
        default: 0
      publish_packages:
        description: Publish PyPI, Snap, and Flatpak distributions
        required: false
        type: boolean
        default: true
      publish_android:
        description: Publish Android distribution
        required: false
        type: boolean
        default: true
      publish_apple:
        description: Publish Apple distributions
        required: false
        type: boolean
        default: true
      publish_desktop:
        description: Publish desktop installers
        required: false
        type: boolean
        default: true
      update_homebrew:
        description: Update Homebrew for stable releases
        required: false
        type: boolean
        default: true
      deploy_homepage:
        description: Deploy homepage after artifact-producing distributions
        required: false
        type: boolean
        default: true

concurrency:
  group: public-release-orchestrator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    name: Transactional npm cohort
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yaml
    with:
      source_sha: ${{ inputs.source_sha }}
      source_ref: ${{ inputs.source_ref }}
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
      npm_publisher: ${{ inputs.npm_publisher }}
      candidate_run_id: ${{ inputs.candidate_run_id }}

  publish-packages:
    name: Package registries
    needs: publish-npm
    if: >-
      ${{
        needs.publish-npm.outputs.registry_verified == 'true' &&
        inputs.publish_packages
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-packages.yml
    with:
      version: ${{ needs.publish-npm.outputs.version }}
      pypi: true
      snap: true
      flatpak: true
    secrets: inherit

  publish-android:
    name: Android
    needs: publish-npm
    if: >-
      ${{
        needs.publish-npm.outputs.registry_verified == 'true' &&
        inputs.publish_android
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/android-release.yml
    with:
      version_name: ${{ needs.publish-npm.outputs.version }}
      track: ${{ needs.publish-npm.outputs.channel == 'beta' && 'internal' || 'production' }}
    secrets: inherit

  publish-apple:
    name: Apple Stores
    needs: publish-npm
    if: >-
      ${{
        needs.publish-npm.outputs.registry_verified == 'true' &&
        inputs.publish_apple
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/apple-store-release.yml
    with:
      platform: both
      track: ${{ needs.publish-npm.outputs.channel == 'beta' && 'testflight' || 'app-store' }}
      version: ${{ needs.publish-npm.outputs.version }}
    secrets: inherit

  publish-desktop:
    name: Desktop installers
    needs: publish-npm
    if: >-
      ${{
        needs.publish-npm.outputs.registry_verified == 'true' &&
        inputs.publish_desktop
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-electrobun.yml
    with:
      tag: v${{ needs.publish-npm.outputs.version }}
      draft: false
      publish_release: true
      platform: all
    secrets: inherit

  update-homebrew:
    name: Homebrew
    needs: publish-npm
    if: >-
      ${{
        needs.publish-npm.outputs.registry_verified == 'true' &&
        needs.publish-npm.outputs.channel == 'latest' &&
        inputs.update_homebrew
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/update-homebrew.yml
    with:
      version: ${{ needs.publish-npm.outputs.version }}
    secrets: inherit

  deploy-homepage:
    name: Homepage
    needs:
      - publish-npm
      - publish-packages
      - publish-android
      - publish-apple
      - publish-desktop
    if: >-
      ${{
        always() &&
        needs.publish-npm.result == 'success' &&
        needs.publish-npm.outputs.registry_verified == 'true' &&
        (!inputs.publish_packages || needs.publish-packages.result == 'success') &&
        (!inputs.publish_android || needs.publish-android.result == 'success') &&
        (!inputs.publish_apple || needs.publish-apple.result == 'success') &&
        (!inputs.publish_desktop || needs.publish-desktop.result == 'success') &&
        inputs.deploy_homepage
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-homepage.yml
    with:
      ref: v${{ needs.publish-npm.outputs.version }}
    secrets: inherit

  summary:
    name: Distribution summary
    needs:
      - publish-npm
      - publish-packages
      - publish-android
      - publish-apple
      - publish-desktop
      - update-homebrew
      - deploy-homepage
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record immutable release handoff
        env:
          ANDROID_RESULT: ${{ needs.publish-android.result }}
          APPLE_RESULT: ${{ needs.publish-apple.result }}
          CANDIDATE_ARTIFACT: ${{ needs.publish-npm.outputs.candidate_artifact }}
          COHORT_INTEGRITY: ${{ needs.publish-npm.outputs.cohort_integrity }}
          DESKTOP_RESULT: ${{ needs.publish-desktop.result }}
          HOMEBREW_RESULT: ${{ needs.update-homebrew.result }}
          HOMEPAGE_RESULT: ${{ needs.deploy-homepage.result }}
          NPM_RESULT: ${{ needs.publish-npm.result }}
          PACKAGE_RESULT: ${{ needs.publish-packages.result }}
          PLAN_INTEGRITY: ${{ needs.publish-npm.outputs.plan_integrity }}
          REGISTRY_VERIFIED: ${{ needs.publish-npm.outputs.registry_verified }}
          RELEASE_CHANNEL: ${{ needs.publish-npm.outputs.channel }}
          RELEASE_SOURCE_REF: ${{ needs.publish-npm.outputs.source_ref }}
          RELEASE_SOURCE_SHA: ${{ needs.publish-npm.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.publish-npm.outputs.version }}
        run: |
          {
            echo "## Explicit release handoff"
            echo
            echo "- Source: \`$RELEASE_SOURCE_SHA\`"
            echo "- Source ref: \`$RELEASE_SOURCE_REF\`"
            echo "- Version/channel: \`$RELEASE_VERSION\` / \`$RELEASE_CHANNEL\`"
            echo "- Plan integrity: \`$PLAN_INTEGRITY\`"
            echo "- Cohort integrity: \`$COHORT_INTEGRITY\`"
            echo "- Registry verified: \`$REGISTRY_VERIFIED\`"
            echo "- Candidate artifact: \`$CANDIDATE_ARTIFACT\`"
            echo
            echo "| Target | Result |"
            echo "|--------|--------|"
            echo "| Transactional npm | $NPM_RESULT |"
            echo "| Package registries | $PACKAGE_RESULT |"
            echo "| Android | $ANDROID_RESULT |"
            echo "| Apple Stores | $APPLE_RESULT |"
            echo "| Desktop installers | $DESKTOP_RESULT |"
            echo "| Homebrew | $HOMEBREW_RESULT |"
            echo "| Homepage | $HOMEPAGE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require npm gate and every enabled distribution
        env:
          ANDROID_RESULT: ${{ needs.publish-android.result }}
          APPLE_RESULT: ${{ needs.publish-apple.result }}
          DESKTOP_RESULT: ${{ needs.publish-desktop.result }}
          HOMEBREW_RESULT: ${{ needs.update-homebrew.result }}
          HOMEPAGE_RESULT: ${{ needs.deploy-homepage.result }}
          NPM_RESULT: ${{ needs.publish-npm.result }}
          PACKAGE_RESULT: ${{ needs.publish-packages.result }}
          REGISTRY_VERIFIED: ${{ needs.publish-npm.outputs.registry_verified }}
        run: |
          set -euo pipefail
          if [ "$NPM_RESULT" != "success" ] || [ "$REGISTRY_VERIFIED" != "true" ]; then
            echo "::error::Transactional npm gate was result=$NPM_RESULT registry_verified=$REGISTRY_VERIFIED."
            exit 1
          fi

          failed=0
          require_result() {
            local label="$1"
            local enabled="$2"
            local result="$3"
            if [ "$enabled" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$label distribution result was '$result', expected success."
              failed=1
            fi
          }

          require_result "Package registries" "${{ inputs.publish_packages }}" "$PACKAGE_RESULT"
          require_result "Android" "${{ inputs.publish_android }}" "$ANDROID_RESULT"
          require_result "Apple Stores" "${{ inputs.publish_apple }}" "$APPLE_RESULT"
          require_result "Desktop installers" "${{ inputs.publish_desktop }}" "$DESKTOP_RESULT"
          require_result "Homebrew" "${{ inputs.update_homebrew && inputs.channel == 'latest' }}" "$HOMEBREW_RESULT"
          require_result "Homepage" "${{ inputs.deploy_homepage }}" "$HOMEPAGE_RESULT"
          exit "$failed"
