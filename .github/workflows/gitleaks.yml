name: gitleaks

# SOC2 CC7.1 — automated secret scanning on every protected-branch push. Pull
# requests are scanned by the canonical CI workflow so forks do not create a
# second approval-gated workflow run. Configuration: .gitleaks.toml at repo root.

on:
  push:
    branches: ["main", "develop"]

# CI fan-out fix: the PR-scoped concurrency from #14069 fell back to
# github.run_id on push, so every develop push got a unique group and
# nothing ever superseded. A 37-merge wave queued thousands of push runs
# and starved the self-hosted fleet. Fall back to github.ref (all develop
# pushes share a group) and cancel superseded push runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE != 'true' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so gitleaks can scan the protected-branch push range.
          fetch-depth: 0

      - name: Restore gitleaks archive
        # actions/cache@v4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/gitleaks-download-cache
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_LINUX_X64_SHA256 }}

      - name: Install gitleaks (OSS binary — no license required)
        id: gitleaks-install
        # gitleaks/gitleaks-action@v2 requires a paid license for org repos.
        # We download the OSS CLI directly so the scan remains free and
        # honors our .gitleaks.toml allowlist + custom rules.
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/gitleaks-download-cache"
          archive="$cache_dir/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$cache_dir"

          verify_archive() {
            printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          }

          if [[ -f "$archive" ]] && ! verify_archive; then
            echo "gitleaks: cached archive failed SHA-256 verification; downloading a clean copy" >&2
            rm -f "$archive"
          fi

          if [[ ! -f "$archive" ]]; then
            download="$(mktemp "$cache_dir/.gitleaks-download.XXXXXX")"
            trap 'rm -f "$download"' EXIT
            curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 300 --retry-max-time 300 \
              --output "$download" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            if ! printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$download" | sha256sum --check --status; then
              echo "gitleaks: downloaded archive failed SHA-256 verification" >&2
              exit 1
            fi
            mv "$download" "$archive"
            trap - EXIT
          fi

          verify_archive
          extract_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-install.XXXXXX")"
          tar -xzf "$archive" -C "$extract_dir" gitleaks
          gitleaks_bin="$extract_dir/gitleaks"
          chmod 0755 "$gitleaks_bin"
          installed_version="$("$gitleaks_bin" version)"
          if [[ "$installed_version" != "$GITLEAKS_VERSION" ]]; then
            echo "gitleaks: expected version $GITLEAKS_VERSION, got $installed_version" >&2
            exit 1
          fi
          # Export the exact verified, per-job binary. Never copy it through the
          # shared runner account's HOME or resolve it from PATH: another job can
          # mutate those locations between this check and the scan.
          printf 'binary=%s\n' "$gitleaks_bin" >> "$GITHUB_OUTPUT"
          echo "gitleaks: verified version $installed_version"

      - name: Run gitleaks
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks-install.outputs.binary }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RANGE_ARGS=()
          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            RANGE_ARGS=(--log-opts "${BEFORE_SHA}..${CURRENT_SHA}")
          elif ! git rev-parse -q --verify "${CURRENT_SHA}^" >/dev/null 2>&1; then
            # Orphan/root tip commit: a squashed "clean baseline" release cut with
            # no parent (the release process resets main/develop to a fresh root
            # commit). `-1 <sha>` would diff it against the empty tree and re-flag
            # every token-like string in the entire monorepo — generated docs
            # dumps, benchmark fixtures, public chain addresses — the same
            # full-history re-scan the tip-commit branch below exists to avoid, in
            # its degenerate form. The baseline's content is a squash of develop
            # commits each already scanned incrementally on their PR/push, so a
            # full re-scan adds no coverage and only produces false-positive noise.
            echo "gitleaks: tip ${CURRENT_SHA} is an orphan/root baseline commit (no parent);"
            echo "its content was already scanned incrementally on develop. Skipping full-tree re-scan."
            exit 0
          else
            # Push with no usable before-SHA (force-push, branch (re)creation, or
            # an unknown range — common on main when it is reset/force-pushed).
            # Scan only the tip commit, NOT the whole history: a full-history
            # scan re-flags long-known historical artifacts (e.g. token-like
            # strings inside vendored *.patch blobs) on every such push and costs
            # ~8 min / 3 GB. New content still gets scanned via the PR range and
            # this tip-commit scan; history is audited by the scheduled deep scan.
            RANGE_ARGS=(--log-opts "-1 ${CURRENT_SHA}")
          fi

          "$GITLEAKS_BIN" detect \
            --config .gitleaks.toml \
            --source . \
            --verbose \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --no-banner \
            "${RANGE_ARGS[@]}"

      - name: Upload SARIF
        if: always()
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
