name: Transactional NPM Release

# A release is an explicit immutable transaction, never a consequence of a tag
# or GitHub Release event. The candidate is built and packed without credentials,
# npm publication consumes only those tarballs, and finalization can advance the
# exact Git tag and GitHub Release only after a live full-cohort registry check.

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full source commit SHA of the prepared release candidate
        required: true
        type: string
      version:
        description: Exact canonical semver already present in every cohort manifest
        required: true
        type: string
      channel:
        description: Public npm channel (beta or latest)
        required: true
        type: string
      candidate_run_id:
        description: Prior workflow run whose immutable candidate should be resumed
        required: false
        type: number
        default: 0
    secrets:
      NPM_TOKEN:
        description: Granular npm automation token used only by the publish job
        required: true
    outputs:
      source_sha:
        description: Verified source commit
        value: ${{ jobs.finalize.outputs.source_sha }}
      version:
        description: Published exact version
        value: ${{ jobs.finalize.outputs.version }}
      channel:
        description: Verified public npm channel
        value: ${{ jobs.finalize.outputs.channel }}
      registry_verified:
        description: Full immutable cohort and channel verification result
        value: ${{ jobs.finalize.outputs.registry_verified }}
      candidate_artifact:
        description: Final release plan, tarballs, and transition evidence artifact
        value: ${{ jobs.finalize.outputs.candidate_artifact }}
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA of the prepared release candidate
        required: true
        type: string
      version:
        description: Exact canonical semver already present in every cohort manifest
        required: true
        type: string
      channel:
        description: Public npm channel
        required: true
        type: choice
        options:
          - beta
          - latest
      candidate_run_id:
        description: Prior workflow run ID to resume without rebuilding (0 creates one)
        required: false
        type: number
        default: 0

concurrency:
  group: public-npm-release-transaction
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: Build immutable candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ format('npm-release-candidate-{0}-{1}-{2}', inputs.source_sha, inputs.version, inputs.channel) }}
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
      tag: ${{ format('v{0}', inputs.version) }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup credential-free workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          skip-avatar-clone: "true"
          no-vision-deps: "true"

      - name: Validate explicit release identity
        id: release_inputs
        run: >-
          node packages/scripts/release-candidate.mjs inputs
          --source-sha "${{ inputs.source_sha }}"
          --version "${{ inputs.version }}"
          --channel "${{ inputs.channel }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify exact checked-out commit
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.release_inputs.outputs.source_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Download prior immutable candidate
        if: inputs.candidate_run_id != 0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ format('npm-release-candidate-{0}-{1}-{2}', inputs.source_sha, inputs.version, inputs.channel) }}
          path: ${{ runner.temp }}/release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify release source before first pack
        if: inputs.candidate_run_id == 0
        run: bun run verify

      - name: Test release source before first pack
        if: inputs.candidate_run_id == 0
        run: bun run test

      - name: Build and pack once
        if: inputs.candidate_run_id == 0
        run: >-
          node packages/scripts/release-candidate.mjs candidate
          --cohort packages/scripts/release-cohort.json
          --candidate "${{ runner.temp }}/release-candidate"
          --version "${{ steps.release_inputs.outputs.version }}"
          --channel "${{ steps.release_inputs.outputs.channel }}"
          --source-sha "${{ steps.release_inputs.outputs.source_sha }}"
          --expected-commit "${{ steps.release_inputs.outputs.source_sha }}"
          --build-command bun
          --build-arg run
          --build-arg build

      - name: Verify immutable candidate bytes
        run: >-
          node packages/scripts/release-candidate.mjs verify
          --candidate "${{ runner.temp }}/release-candidate"
          --source-sha "${{ steps.release_inputs.outputs.source_sha }}"
          --version "${{ steps.release_inputs.outputs.version }}"
          --channel "${{ steps.release_inputs.outputs.channel }}"

      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ format('npm-release-candidate-{0}-{1}-{2}', inputs.source_sha, inputs.version, inputs.channel) }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Stage, verify, and promote npm cohort
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact source without Git credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Setup publication verifier
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          run-postinstall: "false"

      - name: Download verified tarball cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-candidate

      - name: Verify downloaded candidate
        run: >-
          node packages/scripts/release-candidate.mjs verify
          --repo-root "${{ github.workspace }}/release-source"
          --candidate "${{ runner.temp }}/release-candidate"
          --source-sha "${{ needs.candidate.outputs.source_sha }}"
          --version "${{ needs.candidate.outputs.version }}"
          --channel "${{ needs.candidate.outputs.channel }}"

      - name: Publish immutable tarballs and promote full cohort
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/release-npmrc
        run: |
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          node packages/scripts/release-candidate.mjs publish \
            --repo-root "${{ github.workspace }}/release-source" \
            --candidate "${{ runner.temp }}/release-candidate" \
            --registry https://registry.npmjs.org/ \
            --allow-public-registry \
            --token-env NODE_AUTH_TOKEN

      - name: Upload npm-verified candidate state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}-npm-verified
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  finalize:
    name: Verify registry and finalize exact release
    needs:
      - candidate
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    outputs:
      source_sha: ${{ needs.candidate.outputs.source_sha }}
      version: ${{ needs.candidate.outputs.version }}
      channel: ${{ needs.candidate.outputs.channel }}
      registry_verified: "true"
      candidate_artifact: ${{ needs.candidate.outputs.artifact_name }}-finalized
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact source for final tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: true

      - name: Setup final verifier
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          run-postinstall: "false"

      - name: Download npm-verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}-npm-verified
          path: ${{ runner.temp }}/release-candidate

      - name: Reverify every npm version and public channel
        run: >-
          node packages/scripts/release-candidate.mjs verify-promoted
          --repo-root "${{ github.workspace }}/release-source"
          --candidate "${{ runner.temp }}/release-candidate"
          --registry https://registry.npmjs.org/
          --allow-public-registry

      - name: Push only the exact planned Git tag
        run: >-
          node packages/scripts/release-candidate.mjs push-tag
          --repo-root "${{ github.workspace }}/release-source"
          --candidate "${{ runner.temp }}/release-candidate"
          --remote origin
          --tag "${{ needs.candidate.outputs.tag }}"

      - name: Publish idempotent GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node packages/scripts/release-candidate.mjs publish-release
          --repo-root "${{ github.workspace }}/release-source"
          --candidate "${{ runner.temp }}/release-candidate"
          --repository "${{ github.repository }}"
          --tag "${{ needs.candidate.outputs.tag }}"
          --allow-public-github
          --token-env GITHUB_TOKEN

      - name: Upload finalized transaction evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}-finalized
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Write release summary
        env:
          RELEASE_CHANNEL: ${{ needs.candidate.outputs.channel }}
          RELEASE_SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          {
            echo "# Transactional npm release"
            echo
            echo "- Source: \`$RELEASE_SOURCE_SHA\`"
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Channel: \`$RELEASE_CHANNEL\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Registry cohort: verified before Git/GitHub finalization"
          } >> "$GITHUB_STEP_SUMMARY"
