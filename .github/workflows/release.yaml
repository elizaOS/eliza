name: Transactional NPM Release

# A release is an explicit immutable transaction, never a consequence of a tag
# or GitHub Release event. The candidate is built and packed without credentials,
# npm publication consumes only those tarballs, and finalization can advance the
# exact Git tag and GitHub Release only after a live full-cohort registry check.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA of the prepared release candidate
        required: true
        type: string
      source_ref:
        description: Canonical branch ref whose exact tip was verified
        required: true
        type: string
      version:
        description: Exact canonical semver already present in every cohort manifest
        required: true
        type: string
      channel:
        description: Public npm channel (beta or latest)
        required: true
        type: string
      npm_publisher:
        description: Exact npm username represented by NPM_TOKEN
        required: true
        type: string
      candidate_run_id:
        description: Prior workflow run whose immutable candidate should be resumed
        required: false
        type: number
        default: 0
concurrency:
  group: public-npm-release-transaction
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Bind protected release authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tooling_sha: ${{ steps.authority.outputs.tooling_sha }}
    steps:
      - name: Require current protected release workflow
        id: authority
        shell: bash
        env:
          EXPECTED_CALLER_REF: elizaOS/eliza/.github/workflows/release.yaml@refs/heads/develop
          EXPECTED_REPOSITORY: elizaOS/eliza
          OBSERVED_REF: ${{ github.ref }}
          OBSERVED_REPOSITORY: ${{ github.repository }}
          OBSERVED_SHA: ${{ github.sha }}
          OBSERVED_SOURCE_REF: ${{ inputs.source_ref }}
          OBSERVED_SOURCE_SHA: ${{ inputs.source_sha }}
          OBSERVED_WORKFLOW_REF: ${{ github.workflow_ref }}
          OBSERVED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$OBSERVED_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "::error::Release caller repository is $OBSERVED_REPOSITORY, expected $EXPECTED_REPOSITORY."
            exit 1
          fi
          if [ "$OBSERVED_REF" != "refs/heads/develop" ]; then
            echo "::error::Release caller ref is $OBSERVED_REF, expected refs/heads/develop."
            exit 1
          fi
          if [ "$OBSERVED_SOURCE_REF" != "refs/heads/develop" ]; then
            echo "::error::Release source ref is $OBSERVED_SOURCE_REF, expected refs/heads/develop."
            exit 1
          fi
          if [ "$OBSERVED_WORKFLOW_REF" != "$EXPECTED_CALLER_REF" ]; then
            echo "::error::Release workflow is $OBSERVED_WORKFLOW_REF, expected $EXPECTED_CALLER_REF."
            exit 1
          fi

          # The dispatch binds one commit: the run SHA, declared source SHA,
          # and workflow SHA must be the same commit of refs/heads/develop.
          # That commit does not have to still be the live head — under
          # continuous merge traffic the queue delay would make an exact
          # head pin unsatisfiable — but it must be genuine develop history
          # (ancestor of the live head) and its release workflow must be
          # byte-identical to the live head's, so a stale dispatch cannot
          # run superseded release logic.
          if [ "$OBSERVED_SOURCE_SHA" != "$OBSERVED_SHA" ]; then
            echo "::error::Release source SHA is $OBSERVED_SOURCE_SHA, dispatch bound $OBSERVED_SHA."
            exit 1
          fi
          if [ "$OBSERVED_WORKFLOW_SHA" != "$OBSERVED_SHA" ]; then
            echo "::error::Release workflow SHA is $OBSERVED_WORKFLOW_SHA, dispatch bound $OBSERVED_SHA."
            exit 1
          fi

          protected_sha="$({
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $API_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${EXPECTED_REPOSITORY}/git/ref/heads/develop"
          } | node -e '
            let source = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(source)?.object?.sha;
              if (typeof value !== "string" || !/^[0-9a-f]{40}$/.test(value)) process.exit(1);
              process.stdout.write(value);
            });
          ')"
          if [ "$OBSERVED_SHA" != "$protected_sha" ]; then
            ancestry_status="$({
              curl --fail-with-body --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $API_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "${GITHUB_API_URL}/repos/${EXPECTED_REPOSITORY}/compare/${OBSERVED_SHA}...${protected_sha}"
            } | node -e '
              let source = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { source += chunk; });
              process.stdin.on("end", () => {
                const value = JSON.parse(source)?.status;
                if (typeof value !== "string") process.exit(1);
                process.stdout.write(value);
              });
            ')"
            if [ "$ancestry_status" != "ahead" ] && [ "$ancestry_status" != "identical" ]; then
              echo "::error::Release SHA $OBSERVED_SHA is not reachable from protected develop head $protected_sha (compare status: $ancestry_status)."
              exit 1
            fi
            workflow_blob_at() {
              curl --fail-with-body --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $API_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "${GITHUB_API_URL}/repos/${EXPECTED_REPOSITORY}/contents/.github/workflows/release.yaml?ref=$1" \
              | node -e '
                let source = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { source += chunk; });
                process.stdin.on("end", () => {
                  const value = JSON.parse(source)?.sha;
                  if (typeof value !== "string" || !/^[0-9a-f]{40}$/.test(value)) process.exit(1);
                  process.stdout.write(value);
                });
              '
            }
            dispatched_workflow_blob="$(workflow_blob_at "$OBSERVED_SHA")"
            protected_workflow_blob="$(workflow_blob_at "$protected_sha")"
            if [ "$dispatched_workflow_blob" != "$protected_workflow_blob" ]; then
              echo "::error::Release workflow at $OBSERVED_SHA no longer matches protected develop head $protected_sha; re-dispatch from the current head."
              exit 1
            fi
          fi
          echo "tooling_sha=$OBSERVED_SHA" >> "$GITHUB_OUTPUT"
          echo "Protected release tooling: $OBSERVED_SHA (develop head at verification: $protected_sha)" >> "$GITHUB_STEP_SUMMARY"

  candidate:
    name: Build immutable candidate
    needs: authorize
    runs-on: ubuntu-24.04
    # The capped turbo fan-out (RUN_TURBO_CONCURRENCY=3, needed to fit the
    # hosted runner's memory) makes verify+test+build exceed two hours.
    timeout-minutes: 210
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.release_inputs.outputs.artifact_name }}
      source_sha: ${{ steps.candidate_verify.outputs.source_sha }}
      source_ref: ${{ steps.candidate_verify.outputs.source_ref }}
      repository: ${{ steps.candidate_verify.outputs.repository }}
      registry: ${{ steps.candidate_verify.outputs.registry }}
      publisher: ${{ steps.candidate_verify.outputs.publisher }}
      version: ${{ steps.candidate_verify.outputs.version }}
      channel: ${{ steps.candidate_verify.outputs.channel }}
      tag: ${{ steps.release_inputs.outputs.tag }}
      plan_integrity: ${{ steps.candidate_verify.outputs.plan_integrity }}
      cohort_integrity: ${{ steps.candidate_verify.outputs.cohort_integrity }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup credential-free workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          run-postinstall: "false"

      - name: Validate explicit release identity
        id: release_inputs
        run: >-
          node packages/scripts/release-candidate.mjs inputs
          --repository "${{ github.repository }}"
          --source-ref "${{ inputs.source_ref }}"
          --source-sha "${{ inputs.source_sha }}"
          --registry https://registry.npmjs.org/
          --publisher "${{ inputs.npm_publisher }}"
          --version "${{ inputs.version }}"
          --channel "${{ inputs.channel }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify exact checked-out commit
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.release_inputs.outputs.source_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Bind source ref and repository
        run: >-
          node packages/scripts/release-candidate.mjs source
          --repository "${{ steps.release_inputs.outputs.repository }}"
          --source-ref "${{ steps.release_inputs.outputs.source_ref }}"
          --source-sha "${{ steps.release_inputs.outputs.source_sha }}"
          --registry "${{ steps.release_inputs.outputs.registry }}"
          --publisher "${{ steps.release_inputs.outputs.publisher }}"
          --version "${{ steps.release_inputs.outputs.version }}"
          --channel "${{ steps.release_inputs.outputs.channel }}"
          --remote origin

      - name: Download prior immutable candidate
        if: inputs.candidate_run_id != 0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ format('npm-release-candidate-{0}-{1}-{2}', inputs.source_sha, inputs.version, inputs.channel) }}
          path: ${{ runner.temp }}/release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify release source before first pack
        if: inputs.candidate_run_id == 0
        env:
          # verify's default typecheck fan-out (8 concurrent tsc processes)
          # exceeds hosted-runner memory and gets the step SIGTERMed; cap it.
          RUN_TURBO_CONCURRENCY: "3"
        run: bun run verify

      - name: Test release source before first pack
        if: inputs.candidate_run_id == 0
        env:
          RUN_TURBO_CONCURRENCY: "3"
        run: bun run test

      - name: Rebind source immediately before pack
        if: inputs.candidate_run_id == 0
        run: >-
          node packages/scripts/release-candidate.mjs source
          --repository "${{ steps.release_inputs.outputs.repository }}"
          --source-ref "${{ steps.release_inputs.outputs.source_ref }}"
          --source-sha "${{ steps.release_inputs.outputs.source_sha }}"
          --registry "${{ steps.release_inputs.outputs.registry }}"
          --publisher "${{ steps.release_inputs.outputs.publisher }}"
          --version "${{ steps.release_inputs.outputs.version }}"
          --channel "${{ steps.release_inputs.outputs.channel }}"
          --remote origin

      - name: Build and pack once
        if: inputs.candidate_run_id == 0
        env:
          RUN_TURBO_CONCURRENCY: "3"
        run: >-
          node packages/scripts/release-candidate.mjs candidate
          --cohort packages/scripts/release-cohort.json
          --candidate "${{ runner.temp }}/release-candidate"
          --version "${{ steps.release_inputs.outputs.version }}"
          --channel "${{ steps.release_inputs.outputs.channel }}"
          --source-sha "${{ steps.release_inputs.outputs.source_sha }}"
          --expected-commit "${{ steps.release_inputs.outputs.source_sha }}"
          --repository "${{ steps.release_inputs.outputs.repository }}"
          --source-ref "${{ steps.release_inputs.outputs.source_ref }}"
          --registry "${{ steps.release_inputs.outputs.registry }}"
          --publisher "${{ steps.release_inputs.outputs.publisher }}"
          --build-command bun
          --build-arg run
          --build-arg build

      - name: Rebind source after pack
        if: inputs.candidate_run_id == 0
        run: >-
          node packages/scripts/release-candidate.mjs source
          --repository "${{ steps.release_inputs.outputs.repository }}"
          --source-ref "${{ steps.release_inputs.outputs.source_ref }}"
          --source-sha "${{ steps.release_inputs.outputs.source_sha }}"
          --registry "${{ steps.release_inputs.outputs.registry }}"
          --publisher "${{ steps.release_inputs.outputs.publisher }}"
          --version "${{ steps.release_inputs.outputs.version }}"
          --channel "${{ steps.release_inputs.outputs.channel }}"
          --remote origin

      - name: Verify immutable candidate bytes
        id: candidate_verify
        run: >-
          node packages/scripts/release-candidate.mjs verify
          --candidate "${{ runner.temp }}/release-candidate"
          --repository "${{ steps.release_inputs.outputs.repository }}"
          --source-ref "${{ steps.release_inputs.outputs.source_ref }}"
          --source-sha "${{ steps.release_inputs.outputs.source_sha }}"
          --registry "${{ steps.release_inputs.outputs.registry }}"
          --publisher "${{ steps.release_inputs.outputs.publisher }}"
          --version "${{ steps.release_inputs.outputs.version }}"
          --channel "${{ steps.release_inputs.outputs.channel }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ format('npm-release-candidate-{0}-{1}-{2}', inputs.source_sha, inputs.version, inputs.channel) }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Stage, verify, and promote npm cohort
    needs:
      - authorize
      - candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: npm-public-release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.tooling_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact source without Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Setup publication verifier
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          run-postinstall: "false"

      - name: Download verified tarball cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-candidate

      - name: Verify downloaded candidate
        run: >-
          node packages/scripts/release-candidate.mjs verify
          --repo-root "${{ github.workspace }}/release-source"
          --candidate "${{ runner.temp }}/release-candidate"
          --repository "${{ needs.candidate.outputs.repository }}"
          --source-ref "${{ needs.candidate.outputs.source_ref }}"
          --source-sha "${{ needs.candidate.outputs.source_sha }}"
          --registry "${{ needs.candidate.outputs.registry }}"
          --publisher "${{ needs.candidate.outputs.publisher }}"
          --version "${{ needs.candidate.outputs.version }}"
          --channel "${{ needs.candidate.outputs.channel }}"
          --plan-integrity "${{ needs.candidate.outputs.plan_integrity }}"

      - name: Publish immutable tarballs and promote full cohort
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/release-npmrc
        run: |
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          node packages/scripts/release-candidate.mjs publish \
            --repo-root "${{ github.workspace }}/release-source" \
            --candidate "${{ runner.temp }}/release-candidate" \
            --repository "${{ needs.candidate.outputs.repository }}" \
            --source-ref "${{ needs.candidate.outputs.source_ref }}" \
            --source-sha "${{ needs.candidate.outputs.source_sha }}" \
            --registry "${{ needs.candidate.outputs.registry }}" \
            --publisher "${{ needs.candidate.outputs.publisher }}" \
            --version "${{ needs.candidate.outputs.version }}" \
            --channel "${{ needs.candidate.outputs.channel }}" \
            --plan-integrity "${{ needs.candidate.outputs.plan_integrity }}" \
            --allow-public-registry \
            --token-env NODE_AUTH_TOKEN

      - name: Upload npm-verified candidate state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}-npm-verified
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Verify registry and finalize exact release
    needs:
      - candidate
      - publish
      - authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: npm-public-release
    permissions:
      actions: read
      contents: write
    outputs:
      source_sha: ${{ needs.candidate.outputs.source_sha }}
      source_ref: ${{ needs.candidate.outputs.source_ref }}
      repository: ${{ needs.candidate.outputs.repository }}
      version: ${{ needs.candidate.outputs.version }}
      channel: ${{ needs.candidate.outputs.channel }}
      npm_publisher: ${{ needs.candidate.outputs.publisher }}
      plan_integrity: ${{ needs.candidate.outputs.plan_integrity }}
      cohort_integrity: ${{ needs.candidate.outputs.cohort_integrity }}
      registry_verified: "true"
      candidate_artifact: ${{ needs.candidate.outputs.artifact_name }}-finalized
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.tooling_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact source for final tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: true

      - name: Setup final verifier
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14"
          setup-python: "false"
          install-protoc: "false"
          install-native-deps: "false"
          run-postinstall: "false"

      - name: Download npm-verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}-npm-verified
          path: ${{ runner.temp }}/release-candidate

      - name: Reverify every npm version and public channel
        run: >-
          node packages/scripts/release-candidate.mjs verify-promoted
          --repo-root "${{ github.workspace }}/release-source"
          --candidate "${{ runner.temp }}/release-candidate"
          --repository "${{ needs.candidate.outputs.repository }}"
          --source-ref "${{ needs.candidate.outputs.source_ref }}"
          --source-sha "${{ needs.candidate.outputs.source_sha }}"
          --registry "${{ needs.candidate.outputs.registry }}"
          --publisher "${{ needs.candidate.outputs.publisher }}"
          --version "${{ needs.candidate.outputs.version }}"
          --channel "${{ needs.candidate.outputs.channel }}"
          --plan-integrity "${{ needs.candidate.outputs.plan_integrity }}"
          --allow-public-registry

      - name: Push only the exact planned Git tag
        run: >-
          node packages/scripts/release-candidate.mjs push-tag
          --repo-root "${{ github.workspace }}/release-source"
          --candidate "${{ runner.temp }}/release-candidate"
          --remote origin
          --tag "${{ needs.candidate.outputs.tag }}"
          --repository "${{ needs.candidate.outputs.repository }}"
          --source-ref "${{ needs.candidate.outputs.source_ref }}"
          --source-sha "${{ needs.candidate.outputs.source_sha }}"
          --registry "${{ needs.candidate.outputs.registry }}"
          --publisher "${{ needs.candidate.outputs.publisher }}"
          --version "${{ needs.candidate.outputs.version }}"
          --channel "${{ needs.candidate.outputs.channel }}"
          --plan-integrity "${{ needs.candidate.outputs.plan_integrity }}"

      - name: Publish idempotent GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node packages/scripts/release-candidate.mjs publish-release
          --repo-root "${{ github.workspace }}/release-source"
          --candidate "${{ runner.temp }}/release-candidate"
          --repository "${{ github.repository }}"
          --source-ref "${{ needs.candidate.outputs.source_ref }}"
          --source-sha "${{ needs.candidate.outputs.source_sha }}"
          --registry "${{ needs.candidate.outputs.registry }}"
          --publisher "${{ needs.candidate.outputs.publisher }}"
          --version "${{ needs.candidate.outputs.version }}"
          --channel "${{ needs.candidate.outputs.channel }}"
          --plan-integrity "${{ needs.candidate.outputs.plan_integrity }}"
          --tag "${{ needs.candidate.outputs.tag }}"
          --allow-public-github
          --token-env GITHUB_TOKEN

      - name: Upload finalized transaction evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}-finalized
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 30

      - name: Write release summary
        env:
          RELEASE_CHANNEL: ${{ needs.candidate.outputs.channel }}
          RELEASE_COHORT_INTEGRITY: ${{ needs.candidate.outputs.cohort_integrity }}
          RELEASE_PLAN_INTEGRITY: ${{ needs.candidate.outputs.plan_integrity }}
          RELEASE_PUBLISHER: ${{ needs.candidate.outputs.publisher }}
          RELEASE_SOURCE_REF: ${{ needs.candidate.outputs.source_ref }}
          RELEASE_SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          {
            echo "# Transactional npm release"
            echo
            echo "- Source: \`$RELEASE_SOURCE_SHA\`"
            echo "- Source ref: \`$RELEASE_SOURCE_REF\`"
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Channel: \`$RELEASE_CHANNEL\`"
            echo "- npm publisher: \`$RELEASE_PUBLISHER\`"
            echo "- Cohort integrity: \`$RELEASE_COHORT_INTEGRITY\`"
            echo "- Plan integrity: \`$RELEASE_PLAN_INTEGRITY\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Registry cohort: verified before Git/GitHub finalization"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-snap:
    name: Publish Snap Store release
    needs: finalize
    permissions:
      contents: read
    uses: ./.github/workflows/snap-publish.yml
    with:
      source_sha: ${{ needs.finalize.outputs.source_sha }}
      version: ${{ needs.finalize.outputs.version }}
      tag: ${{ format('v{0}', needs.finalize.outputs.version) }}
      channel: ${{ needs.finalize.outputs.channel == 'latest' && 'stable' || 'beta' }}
    secrets: inherit

  publish-mobile-stores:
    name: Publish Google Play and Apple App Store releases
    needs: finalize
    permissions:
      contents: read
    uses: ./.github/workflows/store-mobile-publish.yml
    with:
      source_sha: ${{ needs.finalize.outputs.source_sha }}
      version: ${{ needs.finalize.outputs.version }}
      tag: ${{ format('v{0}', needs.finalize.outputs.version) }}
      channel: ${{ needs.finalize.outputs.channel }}
    secrets: inherit

  publish-microsoft-store:
    name: Publish Microsoft Store release
    needs: finalize
    permissions:
      contents: read
    uses: ./.github/workflows/store-windows-publish.yml
    with:
      source_sha: ${{ needs.finalize.outputs.source_sha }}
      version: ${{ needs.finalize.outputs.version }}
      tag: ${{ format('v{0}', needs.finalize.outputs.version) }}
      channel: ${{ needs.finalize.outputs.channel }}
    secrets:
      MICROSOFT_STORE_TENANT_ID: ${{ secrets.MICROSOFT_STORE_TENANT_ID }}
      MICROSOFT_STORE_CLIENT_ID: ${{ secrets.MICROSOFT_STORE_CLIENT_ID }}
      MICROSOFT_STORE_CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
