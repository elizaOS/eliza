name: Valhalla copybot

on:
  pull_request:
    paths:
      - "plugins/plugin-valhalla-copybot/**"
      - ".github/workflows/valhalla-copybot.yml"
  push:
    branches: [develop]
    paths:
      - "plugins/plugin-valhalla-copybot/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Forbidden wallets
        run: bun plugins/plugin-valhalla-copybot/scripts/forbid-wallets.ts
      - name: No wallet sign or send
        run: bun plugins/plugin-valhalla-copybot/scripts/forbid-wallet-sign.ts
      - name: Valhalla spelling
        run: bun plugins/plugin-valhalla-copybot/scripts/spell-valhalla.ts
      - name: Install
        run: bun install --ignore-scripts
      - name: Lint
        run: bun run --cwd plugins/plugin-valhalla-copybot lint:check
      - name: Test
        run: bun run --cwd plugins/plugin-valhalla-copybot test
      - name: Self-repair suite
        run: bun run --cwd plugins/plugin-valhalla-copybot test __tests__/self-repair.test.ts
