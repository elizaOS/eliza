version: 2
updates:
  # JS/TS workspace (root). Bun monorepo — use bun ecosystem so dependabot
  # commits bun.lock with package.json bumps (npm ecosystem was leaving
  # frozen-lockfile CI red). See elizaOS/eliza#18756.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # Bun types must match the repository's pinned runtime API baseline.
      - dependency-name: "@types/bun"
        versions: ["> 1.4.2"]
      - dependency-name: "bun-types"
        versions: ["> 1.4.2"]
      # React's renderer must move with the host React version.
      - dependency-name: "react-test-renderer"
        versions: ["> 19.2.7"]
      # RainbowKit 2.2.11 requires Wagmi 2; migrate the wallet stack together.
      - dependency-name: "wagmi"
        versions: [">= 3.0.0"]
      # This workspace alias intentionally resolves to the public Vite package;
      # Dependabot otherwise queries the synthetic alias name and receives a
      # registry 404, failing the whole weekly update run.
      - dependency-name: "@elizaos/vitest-vite"
      # isomorphic-git@1.x requires ignore@^5; the `ignore` dep in @elizaos/agent
      # exists only to satisfy it. v6/v7 break isomorphic-git's GitIgnoreManager
      # (git.add fails — see closed PR #8483). Cap at major 5 until
      # isomorphic-git supports ignore@7.
      - dependency-name: "ignore"
        versions: [">= 6.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
