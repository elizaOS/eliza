version: 2
updates:
  # JS/TS workspace (root). Bun monorepo — pulls all workspace package.json files.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # isomorphic-git@1.x requires ignore@^5; the `ignore` dep in @elizaos/agent
      # exists only to satisfy it. v6/v7 break isomorphic-git's GitIgnoreManager
      # (git.add fails — see closed PR #8483). Cap at major 5 until
      # isomorphic-git supports ignore@7.
      - dependency-name: "ignore"
        versions: [">= 6.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python training security updates. Version updates stay disabled, while
  # Dependabot retains a dedicated security group for the tracked uv lockfile.
  - package-ecosystem: "uv"
    directory: "/packages/training"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      # vllm 0.20.x pins torch 2.11, which requires setuptools<82. Dependabot
      # cannot resolve the patched 83.x line until that upstream constraint is
      # relaxed; keep later majors eligible so the exception expires narrowly.
      - dependency-name: "setuptools"
        versions: [">= 83.0.0, < 84.0.0"]
