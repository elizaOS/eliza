name: Normal producer and ordinal whole-file qualification
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fresh Root-approved normal producer build, full113 ordinary cases and mandatory postCLI values
        required: true
        default: qualify
        type: choice
        options: [qualify]
      root_go_json:
        description: Exact Root-issued selected whole-file test JSON bound to the successor source and operator seal
        required: true
        type: string
      expected_workflow_sha:
        description: Exact reviewed qualification workflow commit
        required: true
        type: string
      expected_docker_server:
        description: Reviewed Docker server version (qualification only)
        required: false
        type: string
      expires_epoch:
        description: Root-issued one-run expiration, at most 20 minutes away
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: speech-retirement-intent-${{ fromJSON(inputs.root_go_json).intentId }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout reviewed operator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: operator
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          sparse-checkout: .github/qualification/speech-retirement
      - name: Validate and reserve exact Root intent
        id: claim
        env:
          ROOT_GO_TEXT: ${{ inputs.root_go_json }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          QUALIFICATION_MODE: ${{ inputs.mode }}
          EXPIRES_EPOCH: ${{ inputs.expires_epoch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B operator/.github/qualification/speech-retirement/claim.py
      - name: Persist one-use intent before source or tests
        id: claim_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: speech-intent-${{ steps.claim.outputs.intent_id }}
          path: ${{ runner.temp }}/speech-intent-claim.json
          retention-days: 7
          if-no-files-found: error
      - name: Checkout exact reviewed ordinal test source
        if: inputs.mode == 'qualify'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ff04a558747ed426d9d871a319f7b3946f7660e6
          path: source
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Isolated dependency installation and offline tests
        env:
          CLAIM_ARTIFACT_ID: ${{ steps.claim_artifact.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
          ROOT_GO_JSON: ${{ runner.temp }}/speech-root-go.json
          QUALIFICATION_RECIPE: ordinal-normal-producer-qualification
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          EXPECTED_DOCKER_SERVER: ${{ inputs.expected_docker_server }}
          QUALIFICATION_MODE: ${{ inputs.mode }}
          EXPIRES_EPOCH: ${{ inputs.expires_epoch }}
        run: |
          python3 -I -B operator/.github/qualification/speech-retirement/run.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/speech-retirement-results"
      - name: Retain bounded non-secret qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: speech-retirement-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ordinal-admission.json
            ${{ runner.temp }}/speech-retirement-results/*.json
            ${{ runner.temp }}/speech-retirement-results/*.log
            ${{ runner.temp }}/speech-retirement-results/*.xml
            ${{ runner.temp }}/ordinal-admission.json
            ${{ runner.temp }}/speech-retirement-results/*.jsonl
            !${{ runner.temp }}/speech-retirement-results/module-cache-*/**
            !${{ runner.temp }}/speech-retirement-results/preflight-cache-*/**
            !${{ runner.temp }}/speech-retirement-results/fs-module-cache/**
