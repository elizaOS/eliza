name: Google/offline eight normal Node-file qualification (hosted isolated)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Separately Root-approved paired-source normal qualification
        required: true
        default: qualify
        type: choice
        options: [qualify]
      root_go_json:
        description: Exact fresh Root one-run scope with source pairs and operator hashes
        required: true
        type: string
      expected_workflow_sha:
        description: Exact reviewed and published operator/workflow commit
        required: true
        type: string
      expires_epoch:
        description: Root scope expiration within 1200 seconds of issuance
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: google-offline-eight-node-intent-${{ fromJSON(inputs.root_go_json).intentId }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact reviewed operator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: operator
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          sparse-checkout: .github/qualification/google-offline-eight-node
      - name: Validate and reserve fresh paired Root intent before source or setup
        id: claim
        env:
          ROOT_GO_TEXT: ${{ inputs.root_go_json }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          QUALIFICATION_MODE: ${{ inputs.mode }}
          EXPIRES_EPOCH: ${{ inputs.expires_epoch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B operator/.github/qualification/google-offline-eight-node/claim.py
      - name: Persist immutable one-use claim before source checkout
        id: claim_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: google-offline-intent-${{ steps.claim.outputs.intent_id }}
          path: |
            ${{ runner.temp }}/google-offline-intent-claim.json
            ${{ runner.temp }}/google-offline-admission.json
          retention-days: 7
          if-no-files-found: error
      - name: Checkout exact admitted SDK source
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ff04a558747ed426d9d871a319f7b3946f7660e6
          path: source-sdk
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Checkout only exact paired Alpha commit before bounded ancestry intake
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: eliza-research/alphaphone
          ref: bcdefded4530202a283c77819b48d7ec40b05cbb
          path: source-alpha
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Bounded paired setup, canonical projection, normal module and full-file checks
        env:
          CLAIM_ARTIFACT_ID: ${{ steps.claim_artifact.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
          ROOT_GO_JSON: ${{ runner.temp }}/google-offline-root-go.json
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
        run: python3 -I -B operator/.github/qualification/google-offline-eight-node/run.py "$RUNNER_TEMP/google-offline-results"
      - name: Retain bounded non-secret case/source/resource/closure receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: google-offline-normal-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/google-offline-results/*.json
            ${{ runner.temp }}/google-offline-results/*.log
            ${{ runner.temp }}/google-offline-results/*.xml
            ${{ runner.temp }}/google-offline-results/dependencies-*/*.json
            ${{ runner.temp }}/google-offline-results/dependencies-*/*.jsonl
