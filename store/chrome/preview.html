<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #101820; font-family: system-ui, sans-serif; }
  .frame { width: 100vw; height: 100vh; display: grid; place-items: center; }
  .popup { width: min(360px, 90vw); background: #07080b; color: #e7eef8; border: 1px solid #e8b65a; border-radius: 12px; padding: 16px; }
  h1 { color: #e8b65a; letter-spacing: .14em; font-size: 18px; margin: 0 0 8px; }
  p { color: #93a4ba; }
  .row { background: #102033; padding: 8px; margin-top: 8px; }
  strong { color: #e7eef8; }
</style>
</head>
<body>
  <div class="frame">
    <div class="popup">
      <h1>VALHALLA</h1>
      <p>Read-only. This extension cannot send or withdraw.</p>
      <div class="row"><strong>Desk is read-only. 0 open.</strong><br>Sample view. Not your account.</div>
      <p>Not financial advice. Crypto is risky.</p>
    </div>
  </div>
</body>
</html>
