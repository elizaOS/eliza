<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Valhalla</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; width: 320px; color: #e7eef8; background: #07080b; }
    header { display: flex; gap: 8px; align-items: center; padding: 12px; }
    header img { width: 28px; height: 28px; }
    h1 { font-size: 16px; margin: 0; letter-spacing: .12em; color: #e8b65a; }
    main { padding: 0 12px 12px; }
    p, label { margin: 8px 0; }
    .note { color: #93a4ba; }
    input, button { width: 100%; min-height: 36px; box-sizing: border-box; }
    button { background: #e8b65a; color: #07080b; border: 0; font-weight: 700; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="">
    <h1>VALHALLA</h1>
  </header>
  <main>
    <p class="note">Read-only. This extension cannot send or withdraw. It never asks for a seed phrase.</p>
    <label>Desk address <input id="desk" value="http://127.0.0.1:8787" autocomplete="off"></label>
    <label>Access code, if the desk asks <input id="code" type="password" autocomplete="off"></label>
    <button id="pair" type="button">Show status</button>
    <button id="open-phantom" type="button">Connect Phantom</button>
    <button id="open-solflare" type="button">Connect Solflare</button>
    <p id="status" role="status">Not paired. Demo data is not shown until the desk answers.</p>
    <p id="house" hidden>Free plan. A short house message can show here. Pro removes ads.</p>
    <p class="note">Not financial advice. Crypto is risky.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
