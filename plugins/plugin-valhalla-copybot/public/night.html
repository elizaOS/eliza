<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>ACCELERATION · night</title>
<style>
body{margin:0;background:#050507;color:#f2ead8;font-family:"IBM Plex Mono",ui-monospace,monospace;display:flex;justify-content:center;padding:20px}
.wrap{max-width:1100px;width:100%;border:1px solid #1c1a16;background:#0a0a0e;padding:18px;position:relative}
.hdr{display:flex;gap:14px;align-items:center;position:sticky;top:0;z-index:5;background:#0a0a0e;padding:6px 0}
.mech{width:72px;height:72px;object-fit:contain;mix-blend-mode:screen;filter:drop-shadow(0 0 12px rgba(0,255,136,.5))}
h1{font-size:28px;letter-spacing:.18em;color:#ffb347;margin:0}
.sub{font-size:10px;color:#7a7468;letter-spacing:.2em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{border:1px solid #1c1a16;padding:12px;background:#08080c}
.card h3{font-size:10px;letter-spacing:.16em;color:#ff9a1f;margin:0 0 8px}
.bal{font-size:42px;color:#00ff88;font-weight:700}
.up{color:#00ff88}.dn{color:#ff3b4a}
.term{height:220px;overflow:auto;font-size:11px;background:#050506;padding:8px;border:1px solid #14120e;color:#c8bfa8}
a{color:#7ad7ff}
</style></head>
<body>
<div class="wrap">
  <div class="hdr">
    <img class="mech" src="/mech.jpg" alt="mech"/>
    <div><h1>ACCELERATION</h1><div class="sub">night desk · exclusive · 127.0.0.1</div></div>
    <div style="margin-left:auto;text-align:right"><div id="nmode" style="font-size:11px;letter-spacing:.2em;font-weight:700;color:#7a7468">…</div><div style="font-size:10px;letter-spacing:.2em;color:#7a7468">LIVE WALLET BALANCE · on-chain</div><div id="wbal" style="font-size:46px;font-weight:700;color:#00ff88;text-shadow:0 0 30px rgba(0,255,136,.45)">$—</div><div style="font-size:10px;letter-spacing:.2em;color:#7a7468;margin-top:6px">TRADING P&amp;L</div><div class="bal" id="bal" style="font-size:30px">$—</div><div id="pnl"></div><div id="meta" style="font-size:11px;color:#7a7468;margin-top:4px"></div></div>
  </div>
  <div class="grid">
    <div class="card"><h3>00 EQUITY · RULES</h3><div id="rules" style="font-size:11px;line-height:1.6;color:#7a7468"></div></div>
    <div class="card"><h3>02 POSITIONS</h3><div id="pos"></div></div>
    <div class="card" style="grid-column:1/-1"><h3>03 COPY LOG</h3><div class="term" id="term"></div></div>
  </div>
</div>
<script src="/night.js"></script>
</body></html>
