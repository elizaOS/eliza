// Native-only custody (ai.eliza.plugins.securestore.nativeonly): no Capacitor bridge and no
// Kotlin, so a host can take these classes without SecureStorePlugin.
apply plugin: 'com.android.library'

android {
    namespace = "ai.eliza.plugins.securestore.nativeonly"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}
