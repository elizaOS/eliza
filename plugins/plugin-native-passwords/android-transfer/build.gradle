apply plugin: 'com.android.library'
// Optional CSV import and export (PasswordTransferPlugin). Hosts that offer it include this module
// and register the plugin; the core module never compiles it.
android {
 namespace 'ai.eliza.plugins.passwords.transfer'
 compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
 defaultConfig { minSdk 29; targetSdk project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
repositories { google(); mavenCentral() }
dependencies {
 implementation project(':capacitor-android')
 implementation 'androidx.appcompat:appcompat:1.7.1'
 api project(':elizaos-capacitor-passwords')
}
