# Flatpak manifest — hardened side-load variant for elizaOS App.
#
# This profile narrows filesystem and D-Bus access and signals store mode to
# runtime capability gates. Its generated local runtime makes it unsuitable for
# Flathub's remote builder until immutable public sources replace `runtime/`.
#
# Use `ai.elizaos.App.yml` only when full home access is intentional.
#
# Build (hardened side-load):
#   flatpak-builder --repo=repo --force-clean build-dir ai.elizaos.App.store.yml
# Install:
#   flatpak --user install repo ai.elizaos.App
# Bundle:
#   flatpak build-bundle repo elizaos-app.flatpak ai.elizaos.App
#
# See ./README.md for the full sandbox philosophy and required portals.

app-id: ai.elizaos.App
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: elizaos-app

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    version: '24.08'
    directory: lib/ffmpeg
    add-ld-path: .

finish-args:
  # ── Required ────────────────────────────────────────────────────────────
  # Network: cloud APIs, model providers, plugin registry, web dashboard.
  - --share=network
  # Flatpak's per-app home and XDG directories persist without host filesystem
  # grants. The wrapper binds the runtime to XDG_STATE_HOME/eliza.
  # Fixed workspace folder; this manifest grant does not represent a portal
  # selection and everything outside the listed roots stays unreadable.
  - --filesystem=xdg-documents/Eliza:create
  # OpenURI portal — used to launch the user's browser for OAuth flows
  # (Eliza Cloud sign-in, app domain verification redirects). The
  # portal namespace is implicit on org.freedesktop.Platform//24.08;
  # we do NOT need to talk-name org.freedesktop.portal.* directly.

  # ── Explicitly DENIED (do not add these) ────────────────────────────────
  # See README.md for the full list of forbidden grants. In short: no
  # filesystem=home, no filesystem=host, no host-spawn portal
  # (org.freedesktop.Flatpak), no device=all, no raw session-bus or
  # system-bus sockets. These would defeat the hardened sandbox posture
  # and reviewers will reject them. The forbidden-list strings are
  # intentionally written without the leading `--` so the
  # test-packaging.sh sandbox-lockdown grep checks (which match the
  # actual `--option=...` argument form, with leading whitespace)
  # don't false-positive on these comment lines.

build-options:
  no-debuginfo: true

modules:
  # ── Node.js 24 LTS ───────────────────────────────────────────────────
  - name: nodejs
    buildsystem: simple
    build-commands:
      - cp -r lib /app/lib
      - cp -r include /app/include
      - install -Dm755 bin/node /app/bin/node
      - install -Dm644 LICENSE /app/share/licenses/ai.elizaos.App/nodejs-LICENSE
      - install -Dm644 node-runtime-provenance.json /app/share/licenses/ai.elizaos.App/nodejs-runtime-provenance.json
      - cp -P bin/npm /app/bin/npm
      - cp -P bin/npx /app/bin/npx
    sources:
      - type: archive
        url: https://nodejs.org/dist/v24.15.0/node-v24.15.0-linux-x64.tar.xz
        sha256: 472655581fb851559730c48763e0c9d3bc25975c59d518003fc0849d3e4ba0f6
        only-arches:
          - x86_64
      - type: file
        path: node-runtime-provenance.json

  # ── elizaOS App runtime (store variant) ──────────────────────────────
  # Store mode disables runtime surfaces that require arbitrary local process
  # execution; bubblewrap remains the authority for filesystem and D-Bus access.
  - name: elizaos-app
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg
      - mkdir -p /app/lib/elizaos-app
      - cp -a runtime/. /app/lib/elizaos-app/
      - install -Dm644 runtime/LICENSE /app/share/licenses/ai.elizaos.App/elizaos-LICENSE
      - install -Dm644 runtime/THIRD_PARTY_NOTICES.json /app/share/licenses/ai.elizaos.App/third-party-notices.json
      - install -Dm755 elizaos-app-wrapper.store.sh /app/bin/elizaos-app
      - install -Dm644 ai.elizaos.App.desktop /app/share/applications/ai.elizaos.App.desktop
      - install -Dm644 ai.elizaos.App.metainfo.xml /app/share/metainfo/ai.elizaos.App.metainfo.xml
      - install -Dm644 icons/128x128/ai.elizaos.App.png /app/share/icons/hicolor/128x128/apps/ai.elizaos.App.png
      - install -Dm644 icons/256x256/ai.elizaos.App.png /app/share/icons/hicolor/256x256/apps/ai.elizaos.App.png
      - install -Dm644 icons/512x512/ai.elizaos.App.png /app/share/icons/hicolor/512x512/apps/ai.elizaos.App.png
    sources:
      - type: dir
        path: runtime
        dest: runtime
      - type: file
        path: ai.elizaos.App.desktop
      - type: file
        path: ai.elizaos.App.metainfo.xml
      - type: file
        path: elizaos-app-wrapper.store.sh
      - type: dir
        path: icons
        dest: icons
