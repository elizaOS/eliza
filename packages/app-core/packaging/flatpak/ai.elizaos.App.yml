# Flatpak manifest — DIRECT (power-user) variant for elizaOS App.
#
# This is the less-restrictive Flatpak build for power users. Unlike the
# AppImage / .deb / .rpm distributions it remains inside Flatpak, but grants
# full $HOME access, the host network namespace, and local code
# execution inside the sandbox. It does not grant the host-spawn D-Bus portal
# or mount the Docker socket. It is intended for self-hosted Flatpak repos and
# side-loaded bundles, NOT for Flathub.
#
# For Flathub submission use `ai.elizaos.App.store.yml`, which removes
# `--filesystem=home` and other host-escape sockets that Flathub reviewers
# will reject.
#
# Build (direct, from the current checkout):
#   bun run --cwd packages/app-core build:flatpak:direct
# Install:
#   flatpak --user install repo ai.elizaos.App
# Bundle:
#   flatpak build-bundle repo elizaos-app.flatpak ai.elizaos.App
#
# See ./README.md for the difference between store and direct variants.

app-id: ai.elizaos.App
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: elizaos-app

finish-args:
  # Network access (required for AI provider APIs, plugin downloads, web dashboard)
  - --share=network
  # IPC namespace (required for localhost web dashboard binding)
  - --share=ipc
  # Home directory access (config, workspace, plugins, local models)
  - --filesystem=home
  # XDG config for .config/elizaos-app persistence
  - --filesystem=xdg-config/elizaos-app:create
  # D-Bus access for desktop notifications
  - --talk-name=org.freedesktop.Notifications
  # D-Bus access for system tray / status notifier
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  no-debuginfo: true

modules:
  # The runtime is pinned independently of the host so the installed artifact
  # always starts with the Node version required by the repository.
  - name: nodejs
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/node /app/bin/node
    sources:
      - type: archive
        url: https://nodejs.org/dist/v24.15.0/node-v24.15.0-linux-x64.tar.xz
        sha256: 472655581fb851559730c48763e0c9d3bc25975c59d518003fc0849d3e4ba0f6
        only-arches:
          - x86_64
      - type: archive
        url: https://nodejs.org/dist/v24.15.0/node-v24.15.0-linux-arm64.tar.xz
        sha256: f3d5a797b5d210ce8e2cb265544c8e482eaedcb8aa409a8b46da7e8595d0dda0
        only-arches:
          - aarch64

  # build-flatpak.mjs materializes this closure from the current checkout and
  # validates its version, help output, symlinks, and native architecture.
  - name: elizaos-app
    buildsystem: simple
    build-commands:
      - install -d /app/lib/elizaos-app
      - cp -a runtime/. /app/lib/elizaos-app/
      - install -Dm755 elizaos-app-wrapper.sh /app/bin/elizaos-app
      - install -Dm644 ai.elizaos.App.desktop /app/share/applications/ai.elizaos.App.desktop
      - install -Dm644 ai.elizaos.App.metainfo.xml /app/share/metainfo/ai.elizaos.App.metainfo.xml
      - install -Dm644 icons/128x128/ai.elizaos.App.png /app/share/icons/hicolor/128x128/apps/ai.elizaos.App.png
      - install -Dm644 icons/256x256/ai.elizaos.App.png /app/share/icons/hicolor/256x256/apps/ai.elizaos.App.png
      - install -Dm644 icons/512x512/ai.elizaos.App.png /app/share/icons/hicolor/512x512/apps/ai.elizaos.App.png

    sources:
      - type: dir
        path: ../../../../dist-flatpak/runtime
        dest: runtime
      - type: file
        path: ai.elizaos.App.desktop
      - type: file
        path: ai.elizaos.App.metainfo.xml
      - type: file
        path: elizaos-app-wrapper.sh
      - type: dir
        path: icons
        dest: icons
