name: elizaos-app
version: "2.0.3-beta.7"
summary: Personal AI assistant built on elizaOS
description: |
  elizaOS App is a personal AI assistant you run on your own devices, built on
  elizaOS. It provides guided onboarding, multi-provider AI support,
  a web dashboard, and a plugin system for extensibility.

  Features:
  - Interactive setup on first run — pick a name, personality, and AI provider
  - Support for Anthropic (Claude), OpenAI, Google Gemini, Ollama, and more
  - Web dashboard at http://localhost:2138
  - Gateway API at http://localhost:18789
  - Plugin system for extensibility
  - Web3 wallet integration (EVM + Solana)
  - Desktop apps for macOS, Windows, and Linux

  Quick start: sudo snap install elizaos-app && sudo snap connect elizaos-app:ffmpeg-2204 ffmpeg-2204:ffmpeg-2204 && elizaos-app serve

grade: stable
confinement: strict
base: core22
license: MIT
website: https://app.elizacloud.ai
source-code: https://github.com/elizaOS/eliza
issues: https://github.com/elizaOS/eliza/issues

architectures:
  - build-on: [amd64]
    build-for: [amd64]

layout:
  /usr/lib/x86_64-linux-gnu/libatomic.so.1:
    symlink: $SNAP/usr/lib/x86_64-linux-gnu/libatomic.so.1

plugs:
  ffmpeg-2204:
    interface: content
    target: ffmpeg-platform
    # The provider is published by Snapcrafters, so users must connect this
    # cross-publisher plug until the Snap Store grants and proves auto-connect.
    default-provider: ffmpeg-2204

apps:
  elizaos-app:
    command: bin/elizaos-app-wrapper
    plugs:
      - network
      - network-bind
      - home
      - desktop
      - browser-support
      - password-manager-service
      - ffmpeg-2204
    environment:
      PATH: $SNAP/ffmpeg-platform/usr/bin:$SNAP/node/bin:$SNAP/usr/bin:$SNAP/bin:$PATH
      LD_LIBRARY_PATH: $SNAP/ffmpeg-platform/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib/x86_64-linux-gnu
      NODE_PATH: $SNAP/lib/elizaos-app/node_modules
      HOME: $SNAP_USER_DATA
      ELIZA_STATE_DIR: $SNAP_USER_COMMON/state/eliza
      FFMPEG_BIN: $SNAP/ffmpeg-platform/usr/bin/ffmpeg
      FFMPEG_PATH: $SNAP/ffmpeg-platform/usr/bin/ffmpeg
      ELIZA_FFMPEG_PATH: $SNAP/ffmpeg-platform/usr/bin/ffmpeg
      FFPROBE_PATH: $SNAP/ffmpeg-platform/usr/bin/ffprobe
      FFMPEG_LOCATION: $SNAP/ffmpeg-platform/usr/bin
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
      XDG_CONFIG_HOME: $SNAP_USER_COMMON/config
      XDG_DATA_HOME: $SNAP_USER_COMMON/data
      XDG_STATE_HOME: $SNAP_USER_COMMON/state

parts:
  node:
    plugin: nil
    override-build: |
      set -eu
      NODE_VERSION="24.15.0"
      ARCH=$(dpkg --print-architecture)
      case "$ARCH" in
        amd64)
          NODE_ARCH="x64"
          NODE_SHA256="472655581fb851559730c48763e0c9d3bc25975c59d518003fc0849d3e4ba0f6"
          ;;
        *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
      esac

      NODE_ARCHIVE="/tmp/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz"
      curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" \
        -o "$NODE_ARCHIVE"
      printf '%s  %s\n' "$NODE_SHA256" "$NODE_ARCHIVE" | sha256sum -c -
      tar xJf "$NODE_ARCHIVE" --strip-components=1 -C "$CRAFT_PART_INSTALL"
      "$CRAFT_PART_INSTALL/bin/node" --version
    organize:
      "*": node/
    build-packages:
      - curl

  elizaos-app:
    after: [node]
    plugin: nil
    source: packages/app-core/packaging/snap
    override-build: |
      set -eu
      RUNTIME="$CRAFT_PART_BUILD/runtime"
      test -f "$RUNTIME/package.json"
      test -f "$RUNTIME/node_modules/@elizaos/agent/bin.js"
      test -s "$RUNTIME/LICENSE"
      test -s "$RUNTIME/THIRD_PARTY_NOTICES.json"

      mkdir -p "$CRAFT_PART_INSTALL/lib/elizaos-app"
      cp -a "$RUNTIME"/. "$CRAFT_PART_INSTALL/lib/elizaos-app/"

      install -Dm644 "$RUNTIME/LICENSE" \
        "$CRAFT_PART_INSTALL/usr/share/licenses/elizaos-app/LICENSE"
      install -Dm644 "$RUNTIME/THIRD_PARTY_NOTICES.json" \
        "$CRAFT_PART_INSTALL/usr/share/licenses/elizaos-app/THIRD_PARTY_NOTICES.json"

      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cat > "$CRAFT_PART_INSTALL/bin/elizaos-app-wrapper" << 'WRAPPER'
      #!/bin/sh
      set -eu
      mkdir -p "$ELIZA_STATE_DIR" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
      case "$(uname -m)" in
        x86_64) LIB_ARCH="x86_64-linux-gnu" ;;
        *) echo "Unsupported runtime architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      export LD_LIBRARY_PATH="$SNAP/ffmpeg-platform/usr/lib/$LIB_ARCH:$SNAP/usr/lib/$LIB_ARCH:$SNAP/lib/$LIB_ARCH"
      cd "$SNAP/lib/elizaos-app"
      exec "$SNAP/node/bin/node" \
        "$SNAP/lib/elizaos-app/node_modules/@elizaos/agent/bin.js" "$@"
      WRAPPER
      chmod +x "$CRAFT_PART_INSTALL/bin/elizaos-app-wrapper"
    stage-packages:
      - libatomic1
      - ca-certificates
      - libcap2
      - libgcc-s1
      - libstdc++6
      - libudev1
      - libx11-6
      - libxcb1
      - libxtst6
