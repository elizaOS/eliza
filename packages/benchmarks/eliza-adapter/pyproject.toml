[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eliza-adapter"
version = "0.1.0"
description = "Benchmark adapter for the TypeScript eliza agent"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["eliza_adapter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../..", "../mmau-audio", "../experience", "../webshop"]
