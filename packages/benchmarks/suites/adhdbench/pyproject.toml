[project]
name = "elizaos-adhdbench"
version = "0.1.0"
description = "Attention & context scaling benchmark for ElizaOS agents"
requires-python = ">=3.11"
dependencies = [
    "eliza-adapter",
    "rich>=15,<16",
    "pyyaml>=6.0,<7",
]

[tool.uv.sources]
eliza-adapter = { path = "../../harnesses/eliza", editable = true }

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2"]
openai = []
anthropic = []

[project.scripts]
adhdbench = "elizaos_adhdbench_cli.run_benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elizaos_adhdbench"]
only-include = ["elizaos_adhdbench", "elizaos_adhdbench_cli", "cli-source"]

[tool.hatch.build.targets.wheel.sources]
"cli-source" = "elizaos_adhdbench_cli"

[tool.hatch.build.targets.sdist]
only-include = ["elizaos_adhdbench", "elizaos_adhdbench_cli", "cli-source", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.sdist.sources]
"cli-source" = "elizaos_adhdbench_cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
