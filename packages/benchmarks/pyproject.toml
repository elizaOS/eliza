[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "elizaos-benchmark-support"
version = "0.1.0"
description = "Shared infrastructure for the elizaOS benchmark harnesses"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["benchmarks.lib"]
package-dir = { "benchmarks.lib" = "lib" }
include-package-data = false
