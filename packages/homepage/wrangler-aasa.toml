# Exact-path Cloudflare route for the production iOS association document.
# The homepage remains on Cloudflare Pages; this Worker owns only the exact
# response contract that static hosting cannot express.

name = "eliza-app-aasa-edge-prod"
main = "edge/apple-app-site-association.ts"
compatibility_date = "2026-07-15"
workers_dev = false
preview_urls = false

# The reviewed manifest stays a text module so the Worker serves its exact,
# human-reviewed bytes rather than a serializer-specific representation.
rules = [
  { type = "Text", globs = ["**/apple-app-site-association.json"], fallthrough = true },
]

# An exact HTTPS route leaves all other Pages traffic outside the Worker.
routes = [
  { pattern = "https://eliza.app/.well-known/apple-app-site-association", zone_name = "eliza.app" },
]
