name = "valhalla-brain-api"
main = "src/worker.ts"
compatibility_date = "2026-11-03"

# Valhalla Brain API - Production Worker Configuration
# Primary Target: https://valhalla-app.xyz/

[vars]
GEMINI_MODEL = "gemini-2.0-flash"

# D1 Database binding for user authentication & daily telemetry metrics
[[d1_databases]]
binding = "DB"
database_name = "valhalla-brain"
database_id = "TODO-TJ-FREE-ACCOUNT"

[triggers]
crons = ["*/5 * * * *"]

# KV Namespace for session caching and rate limiting
[[kv_namespaces]]
binding = "KV"
id = "TODO-TJ-FREE-ACCOUNT"
