name = "eliza-login"
main = "worker.ts"
account_id = "23cf6feaeaa541f6a0675053c33da768"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoginContainer"]

[env.staging]
name = "eliza-login-staging"
workers_dev = true
preview_urls = false

[env.staging.triggers]
crons = ["* * * * *"]

[[env.staging.containers]]
class_name = "LoginContainer"
image = "./Dockerfile"
image_build_context = "../../.."
max_instances = 1
instance_type = "standard-1"

[[env.staging.durable_objects.bindings]]
name = "LOGIN"
class_name = "LoginContainer"

[env.production]
name = "eliza-login-production"
workers_dev = true
preview_urls = false

[env.production.triggers]
crons = ["* * * * *"]

[[env.production.containers]]
class_name = "LoginContainer"
image = "./Dockerfile"
image_build_context = "../../.."
max_instances = 1
instance_type = "standard-1"

[[env.production.durable_objects.bindings]]
name = "LOGIN"
class_name = "LoginContainer"
