apply plugin: 'com.android.library'

// Consumers set ext.elizaKokoroSourceDir to this directory and apply this file.
def kokoroSource = project.hasProperty('elizaKokoroSourceDir') ? file(project.elizaKokoroSourceDir) : project.projectDir
// Output of packages/app/scripts/kokoro-voice/build-native.ts. Generated, never source.
def kokoroNative = project.hasProperty('elizaKokoroNativeDir') ? file(project.elizaKokoroNativeDir) : new File(kokoroSource, 'native')
// An app that already packages libelizainference.so links against its own
// staged copy and sets elizaKokoroPackageInference=false.
def packageInference = !project.hasProperty('elizaKokoroPackageInference') || project.elizaKokoroPackageInference.toString() != 'false'
def inferenceLibDir = project.hasProperty('elizaKokoroInferenceLibDir') ? file(project.elizaKokoroInferenceLibDir) : new File(kokoroNative, 'jniLibs')
def ffiInclude = project.hasProperty('elizaKokoroFfiIncludeDir') ? file(project.elizaKokoroFfiIncludeDir) :
    new File(kokoroSource, '../../../../../plugins/plugin-local-inference/native/llama.cpp/tools/omnivoice/include')
def kokoroAbis = ['arm64-v8a', 'x86_64']

android {
    namespace 'ai.eliza.kokoro'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 26
        externalNativeBuild {
            cmake {
                abiFilters(*kokoroAbis)
                arguments "-DKOKORO_VOICE_FFI_INCLUDE_DIR=${ffiInclude.canonicalPath}",
                    "-DKOKORO_VOICE_INFERENCE_LIB_DIR=${inferenceLibDir.canonicalPath}",
                    "-DKOKORO_VOICE_ESPEAK_DIR=${new File(kokoroNative, 'espeak').canonicalPath}",
                    '-DANDROID_STL=c++_shared'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path new File(kokoroSource, 'src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    sourceSets.main {
        java.srcDirs = [new File(kokoroSource, 'src/main/java')]
        manifest.srcFile new File(kokoroSource, 'src/main/AndroidManifest.xml')
        assets.srcDirs = [new File(kokoroNative, 'assets')]
        jniLibs.srcDirs = packageInference ? [new File(kokoroNative, 'jniLibs')] : []
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

// Refuse to build from native outputs or a model bundle that differ from the
// hash-pinned build record (build-native.ts writes it).
preBuild.doFirst {
    def record = new File(kokoroNative, 'build-record.json')
    if (!record.isFile()) throw new GradleException("[kokoro-voice] ${record} missing; run packages/app/scripts/kokoro-voice/build-native.ts")
    def approved = new groovy.json.JsonSlurper().parse(record)
    approved.files.each { entry ->
        if (!packageInference && entry.path.startsWith('jniLibs/')) return
        def target = new File(kokoroNative, entry.path)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        if (!target.isFile()) throw new GradleException("[kokoro-voice] missing ${target}")
        target.withInputStream { stream -> byte[] buffer = new byte[1 << 16]; int count; while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count) }
        if (digest.digest().encodeHex().toString() != entry.sha256) throw new GradleException("[kokoro-voice] ${target} differs from build-record.json")
    }
}
