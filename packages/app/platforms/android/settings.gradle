pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'

// The secure-store bridge depends on its native-only module, which Capacitor does not list.
def secureStore = findProject(':elizaos-capacitor-secure-store')
if (secureStore) {
    include ':elizaos-capacitor-secure-store-nativeonly'
    project(':elizaos-capacitor-secure-store-nativeonly').projectDir = new File(secureStore.projectDir, '../android-nativeonly')
}

// Explicit image-only companion; neither module is a launcher dependency.
include ':sense', ':sense-speech'

include ':voice-assets'

// Shared native Eliza Cloud sign-in client (packages/auth/android); ElizaCloudSignInPlugin hosts it.
include ':eliza-auth-cloud'
project(':eliza-auth-cloud').projectDir = new File(settingsDir, '../../../auth/android')
