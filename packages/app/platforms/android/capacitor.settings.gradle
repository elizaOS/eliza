// DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN
String resolveNodePackageDir(String packageName) {
    def appPackageRoot = new File(settingsDir, '../..').canonicalPath
    def output = providers.exec {
        commandLine 'node', '--print', "require('node:path').dirname(require.resolve(process.argv[1] + '/package.json', { paths: [process.argv[2]] }))", packageName, appPackageRoot
    }.standardOutput.asText.get().trim()
    if (!output) {
        throw new GradleException("Unable to resolve npm package: ${packageName}")
    }
    return output
}

