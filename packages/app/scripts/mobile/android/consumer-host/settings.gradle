pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
include ':app'
def profile = new groovy.json.JsonSlurper().parse(file('.eliza-consumer-profile.json'))
// A host whose generation inputs changed must be regenerated before it configures.
profile.generationInputs.each { input ->
 def source = new File(input.file)
 def digest = source.isFile() ? java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString() : null
 if (digest != input.sha256) throw new GradleException("Generated Android host is stale: ${input.file} changed. Regenerate the host.")
}
// Consumer admission that must complete before any module is configured.
profile.settingsAdmission.each { step ->
 def process = new ProcessBuilder(step.command).directory(new File(step.directory)).redirectError(ProcessBuilder.Redirect.INHERIT).start()
 process.inputStream.getText('UTF-8')
 if (process.waitFor() != 0) throw new GradleException("Android host admission failed: ${step.command.join(' ')}")
}
profile.modules.each { module ->
 include ":${module.name}"
 project(":${module.name}").projectDir = new File(module.directory)
}
