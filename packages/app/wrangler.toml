# Cloudflare Pages config for the hosted-web Eliza app.
#
# packages/app is the SINGLE web artifact for the public site, authentication,
# and the managed Cloud agent UI. Host-role routing serves eliza.app as the
# public/auth root and cloud.eliza.app as the managed app. Legacy domains attach
# to this project only long enough for edge redirects and protocol proxying.

name = "eliza-app"
pages_build_output_dir = "./dist"
compatibility_date = "2026-04-29"

# Cloudflare Pages uses top-level bindings for preview deployments; production
# overrides apply only to the configured production branch.
[vars]
API_UPSTREAM = "https://api-staging.eliza.app"
VITE_ELIZA_CLOUD_BASE = "https://cloud-staging.eliza.app"
# Pin the Steward tenant for the staging build so the SPA initialises the SDK
# with tenantId=elizacloud-staging and OAuth /authorize carries
# tenant_id=elizacloud-staging (Steward resolves the OAuth tenant from the
# query param, not the proxy X-Steward-Tenant header).
VITE_STEWARD_TENANT_ID = "elizacloud-staging"
NEXT_PUBLIC_STEWARD_TENANT_ID = "elizacloud-staging"
VITE_ENVIRONMENT = "staging"

[[services]]
binding = "API_WORKER"
service = "eliza-cloud-api-staging"

[env.production.vars]
API_UPSTREAM = "https://api.eliza.app"
VITE_ELIZA_CLOUD_BASE = "https://cloud.eliza.app"
VITE_STEWARD_TENANT_ID = "elizacloud"
NEXT_PUBLIC_STEWARD_TENANT_ID = "elizacloud"
VITE_ENVIRONMENT = "production"

[[env.production.services]]
binding = "API_WORKER"
service = "eliza-cloud-api-prod"
