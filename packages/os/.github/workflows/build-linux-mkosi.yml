name: Build canonical elizaOS Linux images

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      channel:
        type: string
        required: true
      sequence:
        type: string
        required: true
      expires:
        type: string
        required: true
      base_url:
        type: string
        required: true
      source_date_epoch:
        type: string
        required: true
      debian_snapshot_url:
        type: string
        required: true
      desktop_run_id:
        type: string
        required: true
      desktop_source_sha:
        type: string
        required: true
    secrets:
      ELIZA_ARTIFACT_TOKEN:
        required: true
      ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256:
        required: true
      ELIZAOS_RELEASE_ED25519_PRIVATE_KEY_PKCS8_BASE64:
        required: true
      ELIZAOS_RELEASE_ED25519_PUBLIC_KEY_SPKI_BASE64:
        required: true
      ELIZAOS_RELEASE_ED25519_PUBLIC_KEY_SPKI_SHA256:
        required: true
      ELIZAOS_RELEASE_REVOKED_ED25519_PUBLIC_KEY_SPKI_SHA256S:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a v prefix
        type: string
        required: true
      channel:
        description: Release channel
        type: choice
        options: [beta, stable]
        required: true
      sequence:
        description: Monotonic signed image release sequence
        type: string
        required: true
      expires:
        description: Signed manifest expiry as a canonical UTC timestamp
        type: string
        required: true
      base_url:
        description: HTTPS directory where canonical image assets will publish
        type: string
        required: true
      source_date_epoch:
        description: Reviewed OS commit timestamp used for reproducible metadata
        type: string
        required: true
      debian_snapshot_url:
        description: Dated snapshot.debian.org archive URL
        type: string
        required: true
      desktop_run_id:
        description: Successful elizaOS/eliza signed desktop producer run ID
        type: string
        required: true
      desktop_source_sha:
        description: Exact pinned Eliza commit built by the desktop producer
        type: string
        required: true

concurrency:
  group: canonical-linux-${{ inputs.version }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-qemu:
    name: Build and QEMU-qualify ${{ matrix.architecture }}
    environment: release
    runs-on: [self-hosted, linux, "${{ matrix.runner }}", elizaos-release-build]
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            build-architecture: amd64
            mkosi-architecture: x86-64
            runner: x64
            firmware-mode: pflash
            legacy-bios: /usr/share/qemu/bios-256k.bin
          - architecture: arm64
            build-architecture: arm64
            mkosi-architecture: arm64
            runner: arm64
            firmware-mode: pflash
          - architecture: riscv64
            build-architecture: riscv64
            mkosi-architecture: riscv64
            runner: riscv64
            firmware-mode: bios
    env:
      WORK_ROOT: /var/tmp/elizaos-mkosi-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256: ${{ secrets.ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256 }}
    steps:
      - name: Checkout exact OS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Validate immutable release inputs
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SEQUENCE: ${{ inputs.sequence }}
          EXPIRES: ${{ inputs.expires }}
          BASE_URL: ${{ inputs.base_url }}
          SNAPSHOT_URL: ${{ inputs.debian_snapshot_url }}
          DESKTOP_RUN_ID: ${{ inputs.desktop_run_id }}
          DESKTOP_SOURCE_SHA: ${{ inputs.desktop_source_sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$CHANNEL" =~ ^(beta|stable)$ ]]
          [[ "$SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]
          [[ "$DESKTOP_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DESKTOP_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SNAPSHOT_URL" =~ ^https://snapshot\.debian\.org/archive/debian/[0-9]{8}T[0-9]{6}Z/?$ ]]
          [[ "$BASE_URL" =~ ^https:// ]]
          [[ "$EXPIRES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{3})?Z$ ]]
          test "$SOURCE_DATE_EPOCH" = "$(git show -s --format=%ct HEAD)"
          node scripts/read-eliza-source-lock.ts --github-output > "$RUNNER_TEMP/eliza-source.outputs"
          pinned_commit="$(sed -n 's/^commit=//p' "$RUNNER_TEMP/eliza-source.outputs")"
          test "$DESKTOP_SOURCE_SHA" = "$pinned_commit"
          test -n "$ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256"

      - name: Download signed native desktop artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: elizaOS/eliza
          run-id: ${{ inputs.desktop_run_id }}
          github-token: ${{ secrets.ELIZA_ARTIFACT_TOKEN }}
          name: elizaos-linux-desktop-${{ matrix.architecture }}
          path: ${{ env.WORK_ROOT }}/desktop

      - name: Authenticate desktop artifact and resolve its external key
        id: desktop
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.desktop_source_sha }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          key_name="$(node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = path.join(process.env.WORK_ROOT, "desktop");
          const manifestPath = path.join(root, "desktop-artifact-manifest.json");
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          if (manifest.sourceCommit !== process.env.EXPECTED_SOURCE_SHA) throw new Error("desktop source commit mismatch");
          if (manifest.architecture !== process.env.EXPECTED_ARCHITECTURE) throw new Error("desktop architecture mismatch");
          const owned = new Set([
            "desktop-artifact-manifest.json",
            "desktop-artifact-manifest.json.sig",
            manifest.archive,
            manifest.signature,
          ]);
          const entries = fs.readdirSync(root, { withFileTypes: true });
          if (entries.some((entry) => !entry.isFile())) throw new Error("desktop artifact contains a non-file entry");
          const keys = entries.map((entry) => entry.name).filter((name) => !owned.has(name));
          if (entries.length !== 5 || keys.length !== 1 || path.basename(keys[0]) !== keys[0] ||
              !/^[A-Za-z0-9][A-Za-z0-9._-]*\.(?:pem|key|der)$/.test(keys[0])) {
            throw new Error("desktop artifact must contain exactly the manifest, two signatures, archive, and external public key");
          }
          process.stdout.write(keys[0]);
          NODE
          )"
          python3 scripts/linux/verify-desktop-artifact.py \
            --manifest "$WORK_ROOT/desktop/desktop-artifact-manifest.json" \
            --architecture "${{ matrix.architecture }}" \
            --public-key "$WORK_ROOT/desktop/${key_name}" \
            --public-key-spki-sha256 "$ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256"
          echo "image-key=/opt/elizaos/share/${key_name}" >> "$GITHUB_OUTPUT"

      - name: Download checksum-pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@52542941bb775adef77f7a51ff5ea984e600fab8

      - name: Build clean snapshot-pinned mkosi release disk
        env:
          ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY: ${{ steps.desktop.outputs.image-key }}
          SNAPSHOT_URL: ${{ inputs.debian_snapshot_url }}
        run: |
          set -euo pipefail
          output="$WORK_ROOT/mkosi"
          snapshot_id="${SNAPSHOT_URL%/}"
          snapshot_id="${snapshot_id##*/}"
          [[ "$snapshot_id" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]
          # Debian snapshot package bytes are immutable. Keying this persistent
          # native-runner cache by snapshot and architecture safely reuses the
          # expensive downloads across OS commits built from the same snapshot.
          cache="/var/cache/elizaos/mkosi-packages/${snapshot_id}/${{ matrix.architecture }}"
          sudo install -d -m 0755 "$output" "$cache"
          # A runner pool can schedule different releases concurrently. Keep
          # the immutable package bytes reusable, but serialize writers for an
          # identical snapshot/architecture cache so a partial download cannot
          # race another mkosi invocation.
          sudo --preserve-env=SOURCE_DATE_EPOCH,ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY,ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256 \
            flock --exclusive "$cache/.build.lock" \
            python3 scripts/linux/mkosi-linux-build.py \
              --architecture "${{ matrix.build-architecture }}" \
              --build-mode release \
              --debian-snapshot-url "$SNAPSHOT_URL" \
              --desktop-artifact-dir "$WORK_ROOT/desktop" \
              --package-cache-dir "$cache" \
              --output-dir "$output" \
              --evidence "$WORK_ROOT/evidence/mkosi-build-${{ matrix.architecture }}.json"
          sudo chown -R "$(id -u):$(id -g)" "$WORK_ROOT"

      - name: Stage canonical compressed and expanded names
        run: |
          set -euo pipefail
          mapfile -t images < <(find "$WORK_ROOT/mkosi" -maxdepth 1 -type f -name 'elizaos-linux-${{ matrix.mkosi-architecture }}*.raw.zst' -size +0c -print)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::expected exactly one nonempty mkosi raw.zst; found ${#images[@]}"
            exit 1
          fi
          mkdir -p "$WORK_ROOT/canonical"
          compressed="$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.raw.zst"
          cp --reflink=auto -- "${images[0]}" "$compressed"
          zstd --test -- "$compressed"
          zstd --decompress --keep -- "$compressed" \
            --output "${compressed%.zst}"

      - name: QEMU boot exact expanded disk as removable USB
        run: |
          set -euo pipefail
          image="$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.raw"
          common=(
            --architecture "${{ matrix.build-architecture }}"
            --image "$image"
            --disk-interface usb
            --transcript "$WORK_ROOT/evidence/qemu-${{ matrix.architecture }}.log"
            --evidence "$WORK_ROOT/evidence/qemu-${{ matrix.architecture }}.json"
          )
          if [ "${{ matrix.firmware-mode }}" = pflash ]; then
            common+=(
              --firmware-code "/opt/elizaos/release/firmware/${{ matrix.build-architecture }}/CODE.fd"
              --firmware-vars "/opt/elizaos/release/firmware/${{ matrix.build-architecture }}/VARS.fd"
            )
          else
            common+=(
              --firmware-mode bios
              --bios "/opt/elizaos/release/firmware/${{ matrix.build-architecture }}/fw_payload.bin"
            )
          fi
          scripts/linux/mkosi-qemu-qualify.py "${common[@]}"

      - name: QEMU legacy-BIOS boot exact x86_64 disk as removable USB
        if: ${{ matrix.architecture == 'x86_64' }}
        run: |
          set -euo pipefail
          scripts/linux/mkosi-qemu-qualify.py \
            --architecture amd64 \
            --image "$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-x86_64.raw" \
            --disk-interface usb \
            --firmware-mode bios \
            --bios "${{ matrix.legacy-bios }}" \
            --transcript "$WORK_ROOT/evidence/qemu-legacy-bios-x86_64.log" \
            --evidence "$WORK_ROOT/evidence/qemu-legacy-bios-x86_64.json"

      - name: Prove virtual USB readback and two-boot persistence
        run: |
          set -euo pipefail
          image="$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.raw"
          common=(
            --architecture "${{ matrix.build-architecture }}"
            --source-image "$image"
            --work-image "$WORK_ROOT/qualification/elizaos-${{ inputs.version }}-${{ matrix.architecture }}-usb.raw"
            --transcript-directory "$WORK_ROOT/evidence/persistence-${{ matrix.architecture }}"
            --evidence "$WORK_ROOT/evidence/persistence-${{ matrix.architecture }}.json"
          )
          if [ "${{ matrix.firmware-mode }}" = pflash ]; then
            common+=(
              --firmware-code "/opt/elizaos/release/firmware/${{ matrix.build-architecture }}/CODE.fd"
              --firmware-vars "/opt/elizaos/release/firmware/${{ matrix.build-architecture }}/VARS.fd"
            )
          else
            common+=(
              --firmware-mode bios
              --bios "/opt/elizaos/release/firmware/${{ matrix.build-architecture }}/fw_payload.bin"
            )
          fi
          sudo scripts/linux/mkosi-persistence-qualify.py "${common[@]}"
          sudo chown -R "$(id -u):$(id -g)" "$WORK_ROOT/evidence" "$WORK_ROOT/qualification"

      - name: Generate SPDX from exact mounted image filesystem
        env:
          SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: |
          sudo scripts/linux/generate-mkosi-sbom.sh \
            "$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.raw" \
            "$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.spdx.json" \
            "$SYFT_BIN"
          sudo chown "$(id -u):$(id -g)" \
            "$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.spdx.json"

      - name: Bind build, QEMU, SBOM, and exact image bytes
        run: |
          set -euo pipefail
          promotion=(node scripts/verify-mkosi-promotion-evidence.ts \
            --architecture "${{ matrix.architecture }}" \
            --compressed "$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.raw.zst" \
            --expanded "$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.raw" \
            --build-evidence "$WORK_ROOT/evidence/mkosi-build-${{ matrix.architecture }}.json" \
            --qemu-evidence "$WORK_ROOT/evidence/qemu-${{ matrix.architecture }}.json" \
            --persistence-evidence "$WORK_ROOT/evidence/persistence-${{ matrix.architecture }}.json" \
            --sbom "$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.spdx.json" \
            --source-sha "$GITHUB_SHA")
          if [ "${{ matrix.architecture }}" = x86_64 ]; then
            promotion+=(--legacy-bios-evidence "$WORK_ROOT/evidence/qemu-legacy-bios-x86_64.json")
          fi
          "${promotion[@]}"

      - name: Stage one flat bounded pre-signing artifact
        run: |
          set -euo pipefail
          stage="$WORK_ROOT/upload"
          mkdir "$stage"
          cp -- \
            "$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.raw.zst" \
            "$WORK_ROOT/canonical/elizaos-${{ inputs.version }}-${{ matrix.architecture }}.spdx.json" \
            "$WORK_ROOT/evidence/mkosi-build-${{ matrix.architecture }}.json" \
            "$WORK_ROOT/evidence/qemu-${{ matrix.architecture }}.json" \
            "$WORK_ROOT/evidence/qemu-${{ matrix.architecture }}.log" \
            "$WORK_ROOT/evidence/persistence-${{ matrix.architecture }}.json" \
            "$stage/"
          cp -- "$WORK_ROOT/evidence/persistence-${{ matrix.architecture }}/boot-1.log" \
            "$stage/persistence-boot-1-${{ matrix.architecture }}.log"
          cp -- "$WORK_ROOT/evidence/persistence-${{ matrix.architecture }}/boot-2.log" \
            "$stage/persistence-boot-2-${{ matrix.architecture }}.log"
          if [ "${{ matrix.architecture }}" = x86_64 ]; then
            cp -- \
              "$WORK_ROOT/evidence/qemu-legacy-bios-x86_64.json" \
              "$WORK_ROOT/evidence/qemu-legacy-bios-x86_64.log" \
              "$stage/"
          fi

      - name: Attest built image and filesystem SBOM
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            ${{ env.WORK_ROOT }}/canonical/*.raw.zst
            ${{ env.WORK_ROOT }}/canonical/*.spdx.json

      - name: Upload bounded pre-signing image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-linux-mkosi-built-${{ matrix.architecture }}
          path: ${{ env.WORK_ROOT }}/upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove privileged build workspace
        if: always()
        run: sudo node scripts/rm-path-recursive.ts "$WORK_ROOT"

  sign-and-stage:
    name: Sign and independently verify canonical image set
    needs: build-and-qemu
    environment: release
    runs-on: [self-hosted, linux, x64, elizaos-release-signing]
    timeout-minutes: 180
    env:
      WORK_ROOT: /var/tmp/elizaos-mkosi-${{ github.run_id }}-${{ github.run_attempt }}-signing
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      ELIZAOS_RELEASE_ED25519_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.ELIZAOS_RELEASE_ED25519_PRIVATE_KEY_PKCS8_BASE64 }}
      ELIZAOS_RELEASE_ED25519_PUBLIC_KEY_SPKI_BASE64: ${{ secrets.ELIZAOS_RELEASE_ED25519_PUBLIC_KEY_SPKI_BASE64 }}
      ELIZAOS_RELEASE_ED25519_PUBLIC_KEY_SPKI_SHA256: ${{ secrets.ELIZAOS_RELEASE_ED25519_PUBLIC_KEY_SPKI_SHA256 }}
      ELIZAOS_RELEASE_REVOKED_ED25519_PUBLIC_KEY_SPKI_SHA256S: ${{ secrets.ELIZAOS_RELEASE_REVOKED_ED25519_PUBLIC_KEY_SPKI_SHA256S }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Download exact pre-signing images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: elizaos-linux-mkosi-built-*
          path: ${{ env.WORK_ROOT }}/unsigned
          merge-multiple: true

      - name: Seal private offline signing root
        run: |
          set -euo pipefail
          chmod 0700 -- "$WORK_ROOT/unsigned"
          test "$(stat -c '%a' -- "$WORK_ROOT/unsigned")" = 700

      - name: Expand and reverify every architecture before signing
        run: |
          set -euo pipefail
          for architecture in x86_64 arm64 riscv64; do
            compressed="$WORK_ROOT/unsigned/elizaos-${{ inputs.version }}-${architecture}.raw.zst"
            expanded="${compressed%.zst}"
            test -s "$compressed"
            zstd --test -- "$compressed"
            zstd --decompress --keep -- "$compressed" --output "$expanded"
            promotion=(node scripts/verify-mkosi-promotion-evidence.ts \
              --architecture "$architecture" \
              --compressed "$compressed" \
              --expanded "$expanded" \
              --build-evidence "$WORK_ROOT/unsigned/mkosi-build-${architecture}.json" \
              --qemu-evidence "$WORK_ROOT/unsigned/qemu-${architecture}.json" \
              --persistence-evidence "$WORK_ROOT/unsigned/persistence-${architecture}.json" \
              --sbom "$WORK_ROOT/unsigned/elizaos-${{ inputs.version }}-${architecture}.spdx.json" \
              --source-sha "$GITHUB_SHA")
            if [ "$architecture" = x86_64 ]; then
              promotion+=(--legacy-bios-evidence "$WORK_ROOT/unsigned/qemu-legacy-bios-x86_64.json")
            fi
            "${promotion[@]}"
          done

      - name: Sign discovery metadata and all compressed images
        run: |
          # This mode-0700 tree is not a publication surface. The manifest is
          # the atomic commit marker and is created only after every signature.
          node scripts/sign-image-release.ts \
            --artifact-root "$WORK_ROOT/unsigned" \
            --version "${{ inputs.version }}" \
            --channel "${{ inputs.channel }}" \
            --sequence "${{ inputs.sequence }}" \
            --expires "${{ inputs.expires }}" \
            --base-url "${{ inputs.base_url }}" \
            --output "$WORK_ROOT/unsigned/elizaos-${{ inputs.version }}-images.json"
          node scripts/verify-image-release.ts \
            --require-private-root \
            --artifact-root "$WORK_ROOT/unsigned" \
            --manifest "$WORK_ROOT/unsigned/elizaos-${{ inputs.version }}-images.json" \
            --publish-root "$WORK_ROOT/publish"

      - name: Create bounded producer records and publication directories
        run: |
          set -euo pipefail
          # Promote only from the independently verified, committed private set.
          # The verifier created the signed files from the same held descriptors
          # used for validation. Never reopen the private paths to copy them.
          test "$(stat -c '%a' -- "$WORK_ROOT/publish")" = 700
          test "$(stat -c '%a' -- "$WORK_ROOT/publish/metadata")" = 700
          node scripts/create-release-evidence.ts \
            --artifact-id linux-image-release-manifest \
            --source-artifact elizaos-linux-image-metadata \
            --subject "$WORK_ROOT/publish/metadata/elizaos-${{ inputs.version }}-images.json" \
            --evidence ed25519-signature,image-release-verified \
            --output "$WORK_ROOT/publish/metadata/linux-image-release-manifest.release-evidence.json" \
            --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow "$GITHUB_WORKFLOW_REF" --job sign-and-stage
          node scripts/create-release-evidence.ts \
            --artifact-id linux-image-release-manifest-signature \
            --source-artifact elizaos-linux-image-metadata \
            --subject "$WORK_ROOT/publish/metadata/elizaos-${{ inputs.version }}-images.json.sig" \
            --evidence ed25519-signature,image-release-verified \
            --output "$WORK_ROOT/publish/metadata/linux-image-release-manifest-signature.release-evidence.json" \
            --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow "$GITHUB_WORKFLOW_REF" --job sign-and-stage
          for architecture in x86_64 arm64 riscv64; do
            directory="$WORK_ROOT/publish/${architecture}"
            test "$(stat -c '%a' -- "$directory")" = 700
            cp -- "$WORK_ROOT/unsigned/elizaos-${{ inputs.version }}-${architecture}.spdx.json" "$directory/"
            cp -- \
              "$WORK_ROOT/unsigned/mkosi-build-${architecture}.json" \
              "$WORK_ROOT/unsigned/qemu-${architecture}.json" \
              "$WORK_ROOT/unsigned/qemu-${architecture}.log" \
              "$WORK_ROOT/unsigned/persistence-${architecture}.json" \
              "$WORK_ROOT/unsigned/persistence-boot-1-${architecture}.log" \
              "$WORK_ROOT/unsigned/persistence-boot-2-${architecture}.log" \
              "$directory/"
            if [ "$architecture" = x86_64 ]; then
              cp -- \
                "$WORK_ROOT/unsigned/qemu-legacy-bios-x86_64.json" \
                "$WORK_ROOT/unsigned/qemu-legacy-bios-x86_64.log" \
                "$directory/"
            fi
            boot_evidence="mkosi-release-build,qemu-uefi-usb,persistent-reboot,usb-expanded-readback,slsa-provenance"
            if [ "$architecture" = x86_64 ]; then
              boot_evidence="${boot_evidence},qemu-legacy-bios-usb"
            fi
            node scripts/create-release-evidence.ts \
              --artifact-id "linux-mkosi-${architecture}" \
              --source-artifact "elizaos-linux-mkosi-${architecture}" \
              --subject "$directory/elizaos-${{ inputs.version }}-${architecture}.raw.zst" \
              --evidence "$boot_evidence" \
              --output "$directory/linux-mkosi-${architecture}.release-evidence.json" \
              --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow "$GITHUB_WORKFLOW_REF" --job sign-and-stage
            node scripts/create-release-evidence.ts \
              --artifact-id "linux-mkosi-${architecture}-signature" \
              --source-artifact "elizaos-linux-mkosi-${architecture}" \
              --subject "$directory/elizaos-${{ inputs.version }}-${architecture}.raw.zst.sig" \
              --evidence ed25519-signature,image-release-verified \
              --output "$directory/linux-mkosi-${architecture}-signature.release-evidence.json" \
              --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow "$GITHUB_WORKFLOW_REF" --job sign-and-stage
            node scripts/create-release-evidence.ts \
              --artifact-id "linux-mkosi-${architecture}-sbom" \
              --source-artifact "elizaos-linux-mkosi-${architecture}" \
              --subject "$directory/elizaos-${{ inputs.version }}-${architecture}.spdx.json" \
              --evidence syft-sbom,slsa-provenance \
              --output "$directory/linux-mkosi-${architecture}-sbom.release-evidence.json" \
              --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow "$GITHUB_WORKFLOW_REF" --job sign-and-stage
          done

      - name: Attest exact signed publication inputs
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            ${{ env.WORK_ROOT }}/publish/*/*

      - name: Upload x86_64 publication input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-linux-mkosi-x86_64
          path: ${{ env.WORK_ROOT }}/publish/x86_64/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload arm64 publication input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-linux-mkosi-arm64
          path: ${{ env.WORK_ROOT }}/publish/arm64/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload riscv64 publication input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-linux-mkosi-riscv64
          path: ${{ env.WORK_ROOT }}/publish/riscv64/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload signed image discovery metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-linux-image-metadata
          path: ${{ env.WORK_ROOT }}/publish/metadata/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Remove signing workspace
        if: always()
        run: node scripts/rm-path-recursive.ts "$WORK_ROOT"
