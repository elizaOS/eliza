name: Release USB Installer

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the packaged desktop application
        type: string
        default: "0.1.0"
      require_signing:
        description: Require verified Apple and Windows distribution signatures
        type: boolean
        default: false
      linux_release_only:
        description: Build only the canonical Linux raw.zst-capable release artifact
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v1.0.0)
        required: false
      require_signing:
        description: Require verified Apple and Windows distribution signatures
        type: boolean
        default: false
      linux_release_only:
        description: Build only the canonical Linux raw.zst-capable release artifact
        type: boolean
        default: false
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/release-usb-installer.yml"
      - "usb-installer/**"
      - "scripts/verify-electrobun-linux-package.sh"
      - "package.json"
      - "bun.lock"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.linux_release_only && '[{"os":"ubuntu-24.04","platform":"linux","artifact":"elizaos-usb-installer-linux","release-id":"usb-installer-linux-x64","payload-pattern":"*.tar.gz"}]' || '[{"os":"macos-15","platform":"darwin","artifact":"elizaos-usb-installer-macos","release-id":"usb-installer-macos-arm64","payload-pattern":"*.dmg"},{"os":"ubuntu-24.04","platform":"linux","artifact":"elizaos-usb-installer-linux","release-id":"usb-installer-linux-x64","payload-pattern":"*.tar.gz"},{"os":"windows-2025","platform":"win32","artifact":"elizaos-usb-installer-windows","release-id":"usb-installer-windows-x64","payload-pattern":"*.zip"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Reusable workflows do not inherit the caller job's environment. Bind the
    # protected release environment only for distribution-signing runs so its
    # scoped credentials are available without putting PR validation behind an
    # approval gate.
    environment: ${{ inputs.require_signing && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Restore checksum-pinned Electrobun release assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/elizaos/electrobun/v1.18.1
          key: electrobun-assets-v1.18.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/provision-electrobun-runtime.sh') }}
      - name: Verify and provision Electrobun runtime
        shell: bash
        run: scripts/provision-electrobun-runtime.sh
      - run: bun run --cwd usb-installer build
      - run: bun run --cwd usb-installer typecheck
      - run: bun run --cwd usb-installer test
      - name: Restore Playwright Chromium cache
        if: matrix.platform == 'linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Validate USB installer browser and virtual block-device proof
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          bun usb-installer/node_modules/@playwright/test/cli.js install --with-deps chromium
          bun run --cwd usb-installer test:e2e
          if ! modinfo scsi_debug >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          fi
          modinfo scsi_debug >/dev/null
          bun run --cwd usb-installer test:linux-virtual-usb
      - name: Configure Apple signing and notarization
        if: matrix.platform == 'darwin' && inputs.require_signing == true
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.APP_STORE_API_ISSUER_ID }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.APP_STORE_API_KEY_ID }}
          ELECTROBUN_APPLEAPIKEY_P8: ${{ secrets.APP_STORE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD ELECTROBUN_DEVELOPER_ID ELECTROBUN_APPLEAPIISSUER ELECTROBUN_APPLEAPIKEY ELECTROBUN_APPLEAPIKEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for signed desktop publication"
              exit 1
            fi
          done
          certificate="$RUNNER_TEMP/elizaos-signing.p12"
          keychain="$RUNNER_TEMP/elizaos-signing.keychain-db"
          api_key="$RUNNER_TEMP/AuthKey_${ELECTROBUN_APPLEAPIKEY}.p8"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$certificate"
          printf '%s' "$ELECTROBUN_APPLEAPIKEY_P8" > "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          {
            echo "ELECTROBUN_DEVELOPER_ID=$ELECTROBUN_DEVELOPER_ID"
            echo "ELECTROBUN_APPLEAPIISSUER=$ELECTROBUN_APPLEAPIISSUER"
            echo "ELECTROBUN_APPLEAPIKEY=$ELECTROBUN_APPLEAPIKEY"
            echo "ELECTROBUN_APPLEAPIKEYPATH=$api_key"
            echo "ELIZAOS_SIGNING_KEYCHAIN=$keychain"
            echo "ELIZAOS_MACOS_CERTIFICATE=$certificate"
          } >> "$GITHUB_ENV"

      - name: Configure Windows Authenticode certificate
        if: matrix.platform == 'win32' && inputs.require_signing == true
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PFX and WINDOWS_CERTIFICATE_PASSWORD are required for signed desktop publication"
          }
          $certificate = Join-Path $env:RUNNER_TEMP "elizaos-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          "ELIZAOS_WINDOWS_CERTIFICATE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure pinned release-manifest trust root
        shell: bash
        env:
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
          PRODUCTION_RELEASE_KEY: ${{ secrets.ELIZAOS_RELEASE_ED25519_PUBLIC_KEY_SPKI_BASE64 }}
          PRODUCTION_RELEASE_KEY_FINGERPRINT: ${{ secrets.ELIZAOS_RELEASE_ED25519_PUBLIC_KEY_SPKI_SHA256 }}
          PRODUCTION_REVOKED_RELEASE_KEYS: ${{ secrets.ELIZAOS_RELEASE_REVOKED_ED25519_PUBLIC_KEY_SPKI_SHA256S }}
        run: |
          set -euo pipefail
          if [ "$REQUIRE_SIGNING" = true ]; then
            if [ -z "$PRODUCTION_RELEASE_KEY" ] || [ -z "$PRODUCTION_RELEASE_KEY_FINGERPRINT" ]; then
              echo "::error::release public key and independently reviewed SPKI SHA-256 are required for release packaging"
              exit 1
            fi
            release_key="$PRODUCTION_RELEASE_KEY"
            release_key_fingerprint="$PRODUCTION_RELEASE_KEY_FINGERPRINT"
            revoked_release_keys="$PRODUCTION_REVOKED_RELEASE_KEYS"
          else
            # Unsigned PR/dispatch packages are validation artifacts only. Give
            # them a fresh, non-production trust root so the mandatory package
            # gate is exercised without exposing or silently substituting the
            # protected release identity.
            release_key="$(node -e 'const {generateKeyPairSync}=require("node:crypto"); const {publicKey}=generateKeyPairSync("ed25519"); process.stdout.write(publicKey.export({format:"der",type:"spki"}).toString("base64"))')"
            release_key_fingerprint="$(RELEASE_KEY="$release_key" node -e 'const {createHash}=require("node:crypto"); process.stdout.write(createHash("sha256").update(Buffer.from(process.env.RELEASE_KEY,"base64")).digest("hex"))')"
            revoked_release_keys=""
            echo "::notice::Using an ephemeral validation-only release trust root"
          fi
          RELEASE_KEY="$release_key" RELEASE_KEY_FINGERPRINT="$release_key_fingerprint" RELEASE_REVOKED_KEYS="$revoked_release_keys" node -e '
            const {createHash,createPublicKey}=require("node:crypto");
            const encoded=process.env.RELEASE_KEY ?? "";
            if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) throw new Error("release public key is not canonical base64");
            const der=Buffer.from(encoded,"base64");
            const key=createPublicKey({key:der,format:"der",type:"spki"});
            if (key.asymmetricKeyType !== "ed25519") throw new Error("release public key must be Ed25519");
            const fingerprint=createHash("sha256").update(key.export({format:"der",type:"spki"})).digest("hex");
            if (fingerprint !== process.env.RELEASE_KEY_FINGERPRINT) throw new Error("release public key does not match independently reviewed fingerprint");
            const revoked=process.env.RELEASE_REVOKED_KEYS ? process.env.RELEASE_REVOKED_KEYS.split(",") : [];
            if (new Set(revoked).size !== revoked.length || [...revoked].sort().join(",") !== process.env.RELEASE_REVOKED_KEYS || revoked.some(value => !/^[a-f0-9]{64}$/.test(value) || value === "0".repeat(64))) throw new Error("release revoked-key list is not canonical");
            if (revoked.includes(fingerprint)) throw new Error("release public key is revoked");
          '
          echo "ELIZAOS_RELEASE_ED25519_PUBLIC_KEY_SPKI_BASE64=$release_key" >> "$GITHUB_ENV"
          echo "ELIZAOS_RELEASE_ED25519_PUBLIC_KEY_SPKI_SHA256=$release_key_fingerprint" >> "$GITHUB_ENV"
          echo "ELIZAOS_RELEASE_REVOKED_ED25519_PUBLIC_KEY_SPKI_SHA256S=$revoked_release_keys" >> "$GITHUB_ENV"

      - name: Package desktop app
        env:
          ELIZAOS_RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}
        run: bun run --cwd usb-installer package:${{ matrix.platform }}
      - name: Sign and verify Windows installer
        if: matrix.platform == 'win32' && inputs.require_signing == true
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $zip = @(Get-ChildItem usb-installer/artifacts/*.zip)
          if ($zip.Count -ne 1) { throw "expected exactly one Windows USB installer zip; found $($zip.Count)" }
          $stage = Join-Path $env:RUNNER_TEMP "signed-usb-installer"
          Expand-Archive -Path $zip[0].FullName -DestinationPath $stage -Force
          $executables = @(Get-ChildItem $stage -Recurse -File -Filter *.exe)
          if ($executables.Count -eq 0) { throw "Windows USB installer zip contains no executable" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe is unavailable" }
          foreach ($executable in $executables) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $env:ELIZAOS_WINDOWS_CERTIFICATE /p $env:WINDOWS_CERTIFICATE_PASSWORD $executable.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $($executable.Name)" }
            & $signtool.FullName verify /pa /v $executable.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $($executable.Name)" }
          }
          Remove-Item $zip[0].FullName
          Compress-Archive -Path "$stage\*" -DestinationPath $zip[0].FullName -CompressionLevel Optimal
      - name: Require one release payload
        shell: bash
        run: |
          set -euo pipefail
          payloads=()
          while IFS= read -r payload; do payloads+=("$payload"); done < <(find usb-installer/artifacts -maxdepth 1 -type f -name '${{ matrix.payload-pattern }}' -size +0c -print)
          if [ "${#payloads[@]}" -ne 1 ]; then
            echo "::error::expected exactly one ${{ matrix.payload-pattern }} USB installer payload; found ${#payloads[@]}"
            exit 1
          fi
      - name: Verify Linux package boundary
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          payload="$(find usb-installer/artifacts -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          scripts/verify-electrobun-linux-package.sh "$payload"
      - name: Verify Apple signature and notarization
        if: matrix.platform == 'darwin' && inputs.require_signing == true
        shell: bash
        run: |
          set -euo pipefail
          payload="$(find usb-installer/artifacts -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$payload"
          codesign --verify --deep --strict --verbose=2 "$payload"
          xcrun stapler validate "$payload"
      - name: Bind USB installer evidence to exact output bytes
        shell: bash
        run: |
          set -euo pipefail
          payloads=()
          while IFS= read -r payload; do payloads+=("$payload"); done < <(find usb-installer/artifacts -maxdepth 1 -type f -name '${{ matrix.payload-pattern }}' -size +0c -print)
          test "${#payloads[@]}" -eq 1
          evidence=package-test
          if [ '${{ matrix.platform }}' = linux ]; then
            evidence="${evidence},browser-e2e,virtual-block-device"
          fi
          if [ '${{ inputs.require_signing }}' = true ] && [ '${{ matrix.platform }}' = darwin ]; then
            evidence="${evidence},apple-notarization"
          fi
          if [ '${{ inputs.require_signing }}' = true ] && [ '${{ matrix.platform }}' = win32 ]; then
            evidence="${evidence},authenticode"
          fi
          node scripts/create-release-evidence.mjs \
            --artifact-id '${{ matrix.release-id }}' \
            --source-artifact '${{ matrix.artifact }}' \
            --subject "${payloads[0]}" \
            --evidence "$evidence" \
            --output "usb-installer/artifacts/usb-installer-${{ matrix.platform }}.release-evidence.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow "$GITHUB_WORKFLOW_REF" \
            --job build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: |
            usb-installer/artifacts/${{ matrix.payload-pattern }}
            usb-installer/artifacts/*.release-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary Apple signing credentials
        if: always() && matrix.platform == 'darwin' && inputs.require_signing == true
        shell: bash
        run: |
          if [ -n "${ELIZAOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$ELIZAOS_SIGNING_KEYCHAIN" || true
          fi
          rm -f "${ELECTROBUN_APPLEAPIKEYPATH:-}" "${ELIZAOS_MACOS_CERTIFICATE:-}"
      - name: Remove temporary Windows signing credentials
        if: always() && matrix.platform == 'win32' && inputs.require_signing == true
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue $env:ELIZAOS_WINDOWS_CERTIFICATE
