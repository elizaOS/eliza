name: Publish OS homepage

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable OS repository commit containing the release source
        type: string
        required: true
      tag:
        description: Exact GitHub Release tag represented by the bundle
        type: string
        required: true
      dry_run:
        description: Build and test the release-bound site without deploying it
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.dry_run && '' || 'release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Restore Playwright Chromium cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Download the exact canonical release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: elizaos-release-bundle
          path: _release

      - name: Bind homepage downloads to the verified release bundle
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          manifest="_release/elizaos-os-${RELEASE_TAG}-manifest.json"
          checksums_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SHA256SUMS"
          test -s "$manifest"
          test -s _release/SHA256SUMS
          node scripts/verify-release-checksums.mjs \
            --manifest "$manifest" \
            --artifact-root _release \
            --checksums _release/SHA256SUMS
          node scripts/validate-release-manifest.mjs \
            --manifest "$manifest" \
            --require-publishable-checksums \
            --require-distribution-signatures
          node scripts/generate-os-homepage-data.mjs \
            --manifest "$manifest" \
            --output homepage/public/downloads/elizaos-beta-manifest.json \
            --checksums-url "$checksums_url"

      - name: Build and exercise the release-bound homepage
        run: |
          set -euo pipefail
          bun run --cwd homepage lint:check
          bun run --cwd homepage typecheck
          bun run --cwd homepage build
          bunx playwright install --with-deps chromium
          bun run --cwd homepage test:e2e

      - name: Upload the exact homepage deployment input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-homepage-${{ inputs.dry_run && 'rehearsal' || 'production' }}
          path: |
            homepage/dist/**
            homepage/public/downloads/elizaos-beta-manifest.json
            homepage/test-results/**
          if-no-files-found: error
          retention-days: 30

      - name: Require Cloudflare Pages credentials
        if: inputs.dry_run == false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is required"; exit 1; }

      - name: Deploy the tested tree to Cloudflare Pages
        if: inputs.dry_run == false
        working-directory: homepage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          bun run deploy --
          --commit-hash "$SOURCE_REF"
          --commit-message "Publish elizaOS OS ${RELEASE_TAG}"

      - name: Verify the production deployment identity and status
        if: inputs.dry_run == false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --get \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-urlencode env=production \
            --data-urlencode per_page=1 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/elizaos-homepage/deployments")"
          jq -e \
            --arg source "$SOURCE_REF" \
            '.success == true and (.result | length) == 1 and .result[0].environment == "production" and .result[0].latest_stage.status == "success" and .result[0].deployment_trigger.metadata.commit_hash == $source' \
            <<<"$response" >/dev/null
