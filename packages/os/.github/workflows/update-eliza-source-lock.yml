name: Update pinned Eliza source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: update-eliza-source-lock
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve immutable upstream head
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(node scripts/read-eliza-source-lock.mjs)"
          repository="$(jq -r .repository <<<"$current")"
          source_ref="$(jq -r .sourceRef <<<"$current")"
          commit="$(git ls-remote --exit-code "https://github.com/${repository}.git" "refs/heads/${source_ref}" | cut -f1)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve ${repository}:${source_ref} to one immutable commit"
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "source-ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "changed=$([[ "$commit" != "$(jq -r .commit <<<"$current")" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout candidate recursively
        if: steps.source.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: .eliza-source
          submodules: recursive
          fetch-depth: 1

      - name: Verify candidate identity and submodules
        if: steps.source.outputs.changed == 'true'
        id: identity
        working-directory: .eliza-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.commit }}"
          if git submodule status --recursive | grep -Eq '^[+-]'; then
            echo "::error::Eliza submodules are missing or differ from the candidate commit"
            exit 1
          fi
          timestamp="$(git show -s --format=%cI HEAD)"
          timestamp="$(date -u -d "$timestamp" +%Y-%m-%dT%H:%M:%SZ)"
          echo "commit-timestamp=$timestamp" >> "$GITHUB_OUTPUT"

      - name: Validate repository ownership boundary
        if: steps.source.outputs.changed == 'true'
        env:
          ELIZAOS_ELIZA_ROOT: ${{ github.workspace }}/.eliza-source
        run: node scripts/verify-eliza-source-boundary.mjs

      - name: Update and validate lock
        if: steps.source.outputs.changed == 'true'
        run: |
          node scripts/update-eliza-source-lock.mjs \
            --commit "${{ steps.source.outputs.commit }}" \
            --commit-timestamp "${{ steps.identity.outputs.commit-timestamp }}"
          node scripts/read-eliza-source-lock.mjs

      - name: Open validation PR
        if: steps.source.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_REF: ${{ steps.source.outputs.source-ref }}
        run: |
          set -euo pipefail
          branch="chore/update-eliza-source-${COMMIT:0:12}"
          git config user.name "elizaOS CI"
          git config user.email "ci@elizaos.ai"
          git checkout -b "$branch"
          git add release/eliza-source.lock.json
          git commit -m "chore: update pinned Eliza source"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            existing_pr="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')"
            if [ -n "$existing_pr" ]; then
              echo "Update PR already exists: $existing_pr"
              exit 0
            fi
          else
            git push origin "$branch"
          fi
          gh label create riscv64 --color 8A2BE2 --description "Run the riscv64 cross-build smoke" --force
          gh pr create \
            --base develop \
            --head "$branch" \
            --label riscv64 \
            --title "chore: update pinned Eliza source" \
            --body "Pins elizaOS/eliza \`${SOURCE_REF}\` to immutable commit \`${COMMIT}\`, recursively verifies its submodules, and delegates platform validation to required OS CI."

      - name: Report no update
        if: steps.source.outputs.changed != 'true'
        run: echo "Pinned Eliza source is already current."
