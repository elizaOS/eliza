name: OS verification

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Turbo task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Restore actionlint archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/elizaos/actionlint
          key: actionlint-v1.7.12-${{ runner.os }}-${{ runner.arch }}

      - name: Provision pinned actionlint
        run: scripts/provision-actionlint.sh

      - name: Lint GitHub Actions workflows
        run: actionlint

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify

  installer-native-linux-qualification:
    name: Native installer accepted-peer qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Qualify cross-process AF_UNIX credentials and pidfd lifecycle
        run: linux/installer/native/test-qualify.sh

  linux-static-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELIZAOS_ELIZA_ROOT: ${{ github.workspace }}/.eliza-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve pinned Eliza source
        id: eliza-source
        run: node scripts/read-eliza-source-lock.ts --github-output >> "$GITHUB_OUTPUT"

      - name: Checkout application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.eliza-source.outputs.repository }}
          ref: ${{ steps.eliza-source.outputs.commit }}
          path: .eliza-source
          submodules: recursive

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.eliza-source/bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision ripgrep for Linux static smoke
        shell: bash
        run: scripts/provision-ripgrep.sh

      - run: bun run verify:linux

      - name: Validate canonical mkosi workstation contract
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-cryptography
          bash scripts/linux/mkosi-lint.sh
          python3 -m unittest -v \
            scripts/linux/test_mkosi_qualification.py \
            scripts/linux/test_verify_desktop_artifact.py

  linux-usb-virtual-block:
    name: Canonical Linux USB virtual block-device proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Install source dependencies and kernel module tools
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kmod
          if ! modinfo scsi_debug >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends \
              "linux-modules-extra-$(uname -r)"
          fi
          modinfo scsi_debug >/dev/null

      - name: Exercise signed raw.zst write and expanded-byte readback
        run: bun run --cwd usb-installer test:linux-virtual-usb

  linux-restore-fd-vm:
    name: Restore retained-FD VM (${{ matrix.sector-size }} byte sectors)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sector-size: [512, 4096]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Qualify native child supervision without privileges
        run: |
          cc -std=c17 -O2 -Wall -Wextra -Werror -Wconversion -Wshadow -Wformat=2 \
            usb-installer/native/restore-tool-runner.test.c \
            -o "$RUNNER_TEMP/restore-tool-runner-test"
          "$RUNNER_TEMP/restore-tool-runner-test"
          python3 usb-installer/native/qualify-restore-vm.test.py

      - name: Install unprivileged VM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage fdisk

      - name: Download pinned qualification inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore-inputs"
          curl --fail --location --retry 3 --max-time 300 \
            https://cloud.debian.org/images/cloud/trixie/20260914-2601/debian-13-generic-amd64-20260914-2601.qcow2 \
            -o "$RUNNER_TEMP/restore-inputs/debian.qcow2"
          curl --fail --location --retry 3 --max-time 120 \
            https://codeload.github.com/exfatprogs/exfatprogs/tar.gz/3e87676349387a119cadacd68661d2966796b7fd \
            -o "$RUNNER_TEMP/restore-inputs/exfat.tar.gz"

      - name: Qualify only disposable VM disks
        shell: bash
        env:
          SECTOR_BYTES: ${{ matrix.sector-size }}
        run: |
          set -euo pipefail
          accelerator=tcg
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then accelerator=kvm; fi
          python3 usb-installer/native/qualify-restore-vm.py \
            --base-image "$RUNNER_TEMP/restore-inputs/debian.qcow2" \
            --source-archive "$RUNNER_TEMP/restore-inputs/exfat.tar.gz" \
            --output-dir "$RUNNER_TEMP/restore-evidence" \
            --sector-size "$SECTOR_BYTES" --accelerator "$accelerator"

      - name: Retain logs and exact-input qualification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: restore-fd-${{ matrix.sector-size }}
          path: |
            ${{ runner.temp }}/restore-evidence/*.log
            ${{ runner.temp }}/restore-evidence/qualification.json
            ${{ runner.temp }}/restore-evidence/gpt-snapshot.bin
          if-no-files-found: warn
