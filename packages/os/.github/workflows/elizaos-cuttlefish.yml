name: ElizaOS Cuttlefish

# Brand-aware AOSP / Cuttlefish build pipeline.
#
# Defaults to the elizaOS brand (scripts/distro-android/brand.eliza.json).
# Downstream brands (e.g. ElizaOS) supply their own brand config + vendor
# tree via `brand-config` and `vendor-source` inputs and call this workflow
# either via workflow_dispatch (manual run from this repo) or via
# workflow_call (cross-repo reusable workflow):
#
#   # downstream/.github/workflows/my-brand-cuttlefish.yml
#   jobs:
#     build:
#       uses: elizaOS/os/.github/workflows/elizaos-cuttlefish.yml@develop
#       with:
#         brand-config: android/brand.mybrand.json
#         vendor-source: android/vendor/mybrand
#         aosp-root: /aosp
#         launch: true

on:
  workflow_dispatch:
    inputs:
      brand-config:
        description: "Path to brand config JSON (relative to repo root). Default: eliza."
        required: false
        type: string
        default: "scripts/distro-android/brand.eliza.json"
      vendor-source:
        description: "Override path to the vendor tree (relative to repo root). Defaults to brand.vendorDir."
        required: false
        type: string
        default: ""
      aosp-root:
        description: "Existing AOSP checkout root on the Linux/KVM runner"
        required: true
        type: string
      jobs:
        description: "AOSP build parallelism"
        required: false
        default: "8"
        type: string
      launch:
        description: "Launch Cuttlefish and run adb boot validation"
        required: false
        default: true
        type: boolean
      bun-riscv64-url:
        description: "HTTPS URL for the pinned Bun riscv64-musl zip (required by riscv64 brands)"
        required: false
        default: ""
        type: string
      bun-riscv64-sha256:
        description: "SHA-256 for bun-riscv64-url (required by riscv64 brands)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      brand-config:
        description: "Path to brand config JSON (relative to repo root)."
        required: false
        type: string
        default: "scripts/distro-android/brand.eliza.json"
      vendor-source:
        description: "Override path to the vendor tree."
        required: false
        type: string
        default: ""
      aosp-root:
        description: "Existing AOSP checkout root."
        required: true
        type: string
      jobs:
        description: "AOSP build parallelism."
        required: false
        type: string
        default: "8"
      launch:
        description: "Launch Cuttlefish and run adb boot validation."
        required: false
        type: boolean
        default: true
      bun-riscv64-url:
        description: "HTTPS URL for the pinned Bun riscv64-musl zip (required by riscv64 brands)."
        required: false
        type: string
        default: ""
      bun-riscv64-sha256:
        description: "SHA-256 for bun-riscv64-url (required by riscv64 brands)."
        required: false
        type: string
        default: ""

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate brand AOSP image
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 720
    env:
      ZIG_VERSION: "0.13.0"
      ANDROID_NDK_VERSION: "29.0.13113456"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Resolve pinned Eliza source
        id: eliza-source
        run: node scripts/read-eliza-source-lock.mjs --github-output >> "$GITHUB_OUTPUT"

      - name: Check out retained Android application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.eliza-source.outputs.repository }}
          ref: ${{ steps.eliza-source.outputs.commit }}
          path: .eliza-source
          submodules: recursive

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Restore Eliza Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: eliza-bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.eliza-source/bun.lock') }}
          restore-keys: eliza-bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            .eliza-source/packages/app/platforms/android/**/*.gradle*
            .eliza-source/packages/app/platforms/android/gradle/wrapper/gradle-wrapper.properties

      # The brand validator shells out to `aapt` to inspect the staged APK,
      # and the brand `build:android:system` runs Gradle which needs a full SDK.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-36 ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Install workspace dependencies
        working-directory: .eliza-source
        run: bun install --frozen-lockfile

      - name: Run assistant verifier regression canary
        working-directory: .eliza-source
        run: bun test packages/app/scripts/lib/android-assistant-verify-lib.test.mjs
      - name: Resolve brand
        id: brand
        run: |
          BRAND_CONFIG="${{ inputs.brand-config }}"
          if [ ! -f "$BRAND_CONFIG" ]; then
            echo "::error::Brand config not found: $BRAND_CONFIG"
            exit 1
          fi
          echo "config=$BRAND_CONFIG" >> "$GITHUB_OUTPUT"
          BUILD_CMD=$(node -e "const c=JSON.parse(require('fs').readFileSync('$BRAND_CONFIG','utf8')); console.log((c.buildAndroidSystemCmd ?? ['bun','run','build:android:system']).join(' '))")
          echo "build-cmd=$BUILD_CMD" >> "$GITHUB_OUTPUT"
          REQUIRES_RISCV64=$(node -e "const c=JSON.parse(require('fs').readFileSync('$BRAND_CONFIG','utf8')); console.log(String(c.productName ?? '').includes('riscv64') ? 'true' : 'false')")
          echo "requires-riscv64=$REQUIRES_RISCV64" >> "$GITHUB_OUTPUT"
          INFERENCE_TARGETS=$(node -e "const c=JSON.parse(require('fs').readFileSync('$BRAND_CONFIG','utf8')); const p=String(c.productName ?? ''); const target=p.includes('riscv64')?'android-riscv64-cpu-fused':p.includes('x86_64')?'android-x86_64-cpu-fused':null; console.log(['android-arm64-cpu-fused', target].filter(Boolean).join(' '))")
          echo "inference-targets=$INFERENCE_TARGETS" >> "$GITHUB_OUTPUT"
          DISTRO_NAME=$(node -p "JSON.parse(require('fs').readFileSync('$BRAND_CONFIG','utf8')).distroName")
          echo "distro-name=$DISTRO_NAME" >> "$GITHUB_OUTPUT"

      - name: Restore Zig archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/elizaos/zig-archives
          key: zig-archive-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}

      - name: Provision pinned Zig 0.13
        run: scripts/provision-zig-linux-x64.sh "$ZIG_VERSION"

      - name: Compute native inference source fingerprint
        id: native-inference-fingerprint
        env:
          INFERENCE_TARGETS: ${{ steps.brand.outputs.inference-targets }}
          ELIZA_SOURCE_COMMIT: ${{ steps.eliza-source.outputs.commit }}
        run: |
          set -euo pipefail
          {
            printf 'eliza=%s\ntargets=%s\nzig=%s\nndk=%s\nworkflow=%s\n' \
              "$ELIZA_SOURCE_COMMIT" "$INFERENCE_TARGETS" "$ZIG_VERSION" \
              "$ANDROID_NDK_VERSION" "$GITHUB_WORKFLOW_SHA"
            git -C .eliza-source submodule status --recursive
            git -C .eliza-source ls-files -s \
              packages/app/scripts \
              packages/native/plugins
          } | sha256sum | awk '{ print "hash=" $1 }' >> "$GITHUB_OUTPUT"

      # Exact-key only. The compiler reruns its verification and incremental
      # CMake build after restore; no prefix restore may substitute stale native
      # bytes for a changed source, submodule, target set, or toolchain.
      - name: Restore native inference build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/eliza-android-agent
            .eliza-source/packages/app/platforms/android/app/src/main/assets/agent/arm64-v8a
            .eliza-source/packages/app/platforms/android/app/src/main/assets/agent/x86_64
            .eliza-source/packages/app/platforms/android/app/src/main/assets/agent/riscv64
          key: cuttlefish-native-${{ runner.os }}-${{ steps.native-inference-fingerprint.outputs.hash }}

      - name: Build fused Android inference libraries
        working-directory: .eliza-source
        shell: bash
        run: |
          set -euo pipefail
          read -r -a targets <<< "${{ steps.brand.outputs.inference-targets }}"
          args=()
          for target in "${targets[@]}"; do
            args+=(--target "$target")
          done
          node packages/app/scripts/aosp/compile-libllama.mjs \
            --assets-dir packages/app/platforms/android/app/src/main/assets/agent \
            "${args[@]}"

      - name: Verify fused Android inference artifacts
        shell: bash
        run: |
          set -euo pipefail
          read -r -a targets <<< "${{ steps.brand.outputs.inference-targets }}"
          args=()
          for target in "${targets[@]}"; do
            args+=(--target "$target")
          done
          mkdir -p reports/cuttlefish
          node scripts/aosp/verify-native-runtime.mjs \
            --asset-root .eliza-source/packages/app/platforms/android/app/src/main/assets/agent \
            "${args[@]}" | tee reports/cuttlefish/native-runtime.json

      - name: Build privileged APK (${{ steps.brand.outputs.distro-name }})
        working-directory: .eliza-source
        env:
          ELIZAOS_OS_REPO_ROOT: ${{ github.workspace }}
          ELIZA_BUN_RISCV64_URL: ${{ inputs.bun-riscv64-url }}
          ELIZA_BUN_RISCV64_SHA256: ${{ inputs.bun-riscv64-sha256 }}
          ELIZA_MTP_ANDROID_LIBDIR: ${{ github.workspace }}/.eliza-source/packages/app/platforms/android/app/src/main/assets/agent/arm64-v8a
          ELIZA_MTP_ANDROID_LIBDIR_X86_64: ${{ github.workspace }}/.eliza-source/packages/app/platforms/android/app/src/main/assets/agent/x86_64
          ELIZA_MTP_ANDROID_LIBDIR_RISCV64: ${{ github.workspace }}/.eliza-source/packages/app/platforms/android/app/src/main/assets/agent/riscv64
        run: |
          if [ "${{ steps.brand.outputs.requires-riscv64 }}" = "true" ]; then
            if [ -z "$ELIZA_BUN_RISCV64_URL" ] || [ -z "$ELIZA_BUN_RISCV64_SHA256" ]; then
              echo "::error::riscv64 brands require bun-riscv64-url and bun-riscv64-sha256 inputs"
              exit 1
            fi
          else
            export ELIZA_BUN_RISCV64_OPTIONAL=1
          fi
          ${{ steps.brand.outputs.build-cmd }}

      - name: Static brand validation
        run: |
          node scripts/distro-android/validate.mjs \
            --brand-config "${{ steps.brand.outputs.config }}"

      - name: Sync the immutable AOSP manifest revision
        working-directory: ${{ inputs.aosp-root }}
        shell: bash
        env:
          AOSP_SYNC_JOBS: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          [[ "$AOSP_SYNC_JOBS" =~ ^[1-9][0-9]*$ ]]
          (( AOSP_SYNC_JOBS <= 256 ))
          repo_cmd=$(command -v repo || true)
          if [ -z "$repo_cmd" ] && [ -x .repo/repo/repo ]; then
            repo_cmd=.repo/repo/repo
          fi
          if [ -z "$repo_cmd" ]; then
            echo "::error::repo launcher is unavailable"
            exit 1
          fi
          "$repo_cmd" sync -c --fail-fast -j "$AOSP_SYNC_JOBS"
          "$repo_cmd" forall -e -c \
            'git diff --quiet && git diff --cached --quiet || { echo "dirty AOSP project: $REPO_PATH" >&2; exit 1; }'

      - name: Verify immutable Cuttlefish AOSP source lock
        run: |
          node scripts/aosp/verify-source-lock.mjs \
            --profile cuttlefish \
            --aosp-root "${{ inputs.aosp-root }}" \
            --json

      - name: Sync, build, and optionally boot
        run: |
          ARGS=(
            --brand-config "${{ steps.brand.outputs.config }}"
            --aosp-root "${{ inputs.aosp-root }}"
            --jobs "${{ inputs.jobs }}"
          )
          if [ -n "${{ inputs.vendor-source }}" ]; then
            ARGS+=(--source-vendor "${{ inputs.vendor-source }}")
          fi
          if [ "${{ inputs.launch }}" = "true" ]; then
            ARGS+=(--launch --boot-validate)
          fi
          node scripts/distro-android/build-aosp.mjs "${ARGS[@]}"

      - name: Verify application-native kernels on Cuttlefish
        if: ${{ !cancelled() && inputs.launch == true }}
        env:
          ELIZAOS_ELIZA_ROOT: ${{ github.workspace }}/.eliza-source
        run: bash scripts/aosp/cuttlefish-native-inference-smoke.sh

      - name: Prove full WAV to ASR to agent to TTS round trip
        if: ${{ !cancelled() && inputs.launch == true }}
        working-directory: .eliza-source/packages/app
        env:
          ELIZA_ANDROID_BACKEND: local
          # The packaged agent is IPC-only. The spec itself, not the retired
          # TCP pre-gate, must decide whether every real voice stage passed.
          ELIZA_ANDROID_REQUIRE_AGENT: "0"
        run: |
          node scripts/run-ui-playwright.mjs \
            --config playwright.android.config.ts \
            test/android/voice-selftest.android.spec.ts

      - name: Exercise privileged Android instrumentation on Cuttlefish
        if: ${{ !cancelled() && inputs.launch == true }}
        working-directory: .eliza-source/packages/app/platforms/android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/reports/cuttlefish/instrumentation"
          ./gradlew :app:assembleDebugAndroidTest --stacktrace
          test_apk=$(find app/build/outputs/apk/androidTest/debug -type f -name '*androidTest*.apk' -print -quit)
          test -n "$test_apk"
          adb install -r -t "$test_apk"
          set +e
          adb shell am instrument -w -r \
            ai.elizaos.app.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "${GITHUB_WORKSPACE}/reports/cuttlefish/instrumentation/privileged.txt"
          instrument_status=${PIPESTATUS[0]}
          set -e
          test "$instrument_status" -eq 0
          grep -Eq '^OK \([1-9][0-9]* tests?\)$' \
            "${GITHUB_WORKSPACE}/reports/cuttlefish/instrumentation/privileged.txt"
          if grep -q 'INSTRUMENTATION_STATUS_CODE: -3' \
            "${GITHUB_WORKSPACE}/reports/cuttlefish/instrumentation/privileged.txt"; then
            echo "::error::Privileged instrumentation contained an assumption-skip"
            exit 1
          fi

      - name: Verify assistant role, IME, and assist-key routing
        if: ${{ !cancelled() && inputs.launch == true }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/reports/cuttlefish/assistant"
          mkdir -p "$evidence"
          # cmd voiceinteraction show requires ACCESS_VOICE_INTERACTION_SERVICE.
          # Scope root ADB to the selected disposable Cuttlefish userdebug guest.
          ANDROID_SERIAL=$(adb get-serialno)
          export ANDROID_SERIAL
          device=$(adb shell getprop ro.product.device | tr -d '\r')
          case "$device" in vsoc_x86_64|vsoc_x86_64_only) ;; *) exit 1 ;; esac
          test "$(adb shell getprop ro.build.type | tr -d '\r')" = userdebug
          adb root | tee "$evidence/adb-root.txt"
          adb wait-for-device
          test "$(adb shell id -u | tr -d '\r')" = 0
          adb logcat -c
          adb shell screenrecord --time-limit 45 /data/local/tmp/eliza-assistant.mp4 &
          recorder=$!
          cleanup_recording() {
            kill "$recorder" 2>/dev/null || true
            wait "$recorder" 2>/dev/null || true
            adb pull /data/local/tmp/eliza-assistant.mp4 "$evidence/screenrecord.mp4" || true
          }
          trap cleanup_recording EXIT
          set +e
          node .eliza-source/packages/app/scripts/android-assistant-verify.mjs \
            --require-device --require-engine --json 2>&1 \
            | tee "$evidence/verifier.log"
          verify_status=${PIPESTATUS[0]}
          set -e
          cleanup_recording
          trap - EXIT
          awk 'BEGIN { capture=0 } /^\{$/ { capture=1 } capture { print } capture && /^\}$/ { exit }' \
            "$evidence/verifier.log" > "$evidence/verifier.json"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' \
            "$evidence/verifier.json"
          adb exec-out screencap -p > "$evidence/final-screen.png" || true
          adb logcat -d -v threadtime > "$evidence/logcat.txt" || true
          adb shell dumpsys package ai.elizaos.app > "$evidence/package.txt" || true
          adb shell dumpsys voiceinteraction > "$evidence/voiceinteraction.txt" || true
          adb shell dumpsys input_method > "$evidence/input-method.txt" || true
          adb shell dumpsys activity activities > "$evidence/activities.txt" || true
          adb shell cmd role get-role-holders android.app.role.ASSISTANT > "$evidence/assistant-role.txt" || true
          {
            adb shell settings get secure voice_interaction_service
            adb shell settings get secure assistant
            adb shell settings get secure default_input_method
            adb shell ime list -s
          } > "$evidence/secure-settings.txt" 2>&1 || true
          test "$verify_status" -eq 0

      # connectedDebugAndroidTest installs the retail-signed debug target. Stop
      # Cuttlefish first so Gradle cannot collide with its platform-signed copy.
      - name: Stop Cuttlefish before retail instrumentation
        if: ${{ !cancelled() && inputs.launch == true }}
        working-directory: ${{ inputs.aosp-root }}
        shell: bash
        run: |
          set -euo pipefail
          source build/envsetup.sh
          cvd reset -y 2>/dev/null || stop_cvd 2>/dev/null || true

      - name: Run non-vacuous retail connectedDebugAndroidTest
        if: ${{ !cancelled() && inputs.launch == true }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            cd .eliza-source/packages/app/platforms/android
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            cd "${GITHUB_WORKSPACE}"
            node scripts/aosp/verify-android-instrumentation-results.mjs \
              --results .eliza-source/packages/app/platforms/android/app/build/outputs/androidTest-results/connected \
              --required-class ai.elizaos.app.ElizaAssistantSurfaceInstrumentedTest \
              --min-tests 6
            retail_apk=$(find .eliza-source/packages/app/platforms/android/app/build/outputs/apk/debug \
              -type f -name '*debug*.apk' -print -quit)
            test -n "$retail_apk"
            adb install -r -g "$retail_apk"
            mkdir -p reports/cuttlefish/retail-assistant
            set +e
            node .eliza-source/packages/app/scripts/android-assistant-verify.mjs \
              --require-device --json 2>&1 \
              | tee reports/cuttlefish/retail-assistant/verifier.log
            retail_verify_status=${PIPESTATUS[0]}
            set -e
            awk 'BEGIN { capture=0 } /^\{$/ { capture=1 } capture { print } capture && /^\}$/ { exit }' \
              reports/cuttlefish/retail-assistant/verifier.log \
              > reports/cuttlefish/retail-assistant/verifier.json
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' \
              reports/cuttlefish/retail-assistant/verifier.json
            test "$retail_verify_status" -eq 0

      - name: Collect Android validation evidence
        if: always() && inputs.launch == true
        shell: bash
        run: |
          mkdir -p reports/cuttlefish/retail-instrumentation
          if [ -d .eliza-source/packages/app/platforms/android/app/build/outputs/androidTest-results ]; then
            cp -a .eliza-source/packages/app/platforms/android/app/build/outputs/androidTest-results/. \
              reports/cuttlefish/retail-instrumentation/
          fi
          if [ -d .eliza-source/packages/app/test-results ]; then
            mkdir -p reports/cuttlefish/voice-selftest
            cp -a .eliza-source/packages/app/test-results/. \
              reports/cuttlefish/voice-selftest/
          fi
          if command -v adb >/dev/null 2>&1; then
            adb devices -l > reports/cuttlefish/adb-devices.txt 2>&1 || true
          fi

      - name: Record qualification boundary
        if: always()
        env:
          CVD_LAUNCH: ${{ inputs.launch }}
          CVD_JOB_STATUS: ${{ job.status }}
        run: |
          node scripts/android/record-cuttlefish-result.mjs \
            reports/cuttlefish/workflow-result.json "$CVD_LAUNCH" "$CVD_JOB_STATUS" "$GITHUB_SHA"

      - name: Upload Cuttlefish Android validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuttlefish-android-validation-${{ github.run_attempt }}
          path: reports/cuttlefish
          if-no-files-found: error
