name: Build authenticated elizaOS Debian packages

on:
  workflow_call:
    inputs:
      desktop_run_id:
        type: string
        required: true
      desktop_source_sha:
        type: string
        required: true
      source_date_epoch:
        type: string
        required: true
    secrets:
      ELIZA_ARTIFACT_TOKEN:
        required: true
      ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256:
        required: true
  workflow_dispatch:
    inputs:
      desktop_run_id:
        description: Successful signed GTK/WebKitGTK producer run in elizaOS/eliza
        type: string
        required: true
      desktop_source_sha:
        description: Exact pinned Eliza commit built by the producer
        type: string
        required: true
      source_date_epoch:
        description: Reviewed OS commit timestamp for reproducible package metadata
        type: string
        required: true
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/build-debian-package.yml"
      - "linux/packaging/debian/**"
      - "linux/elizaos/assets/logo_blue_nobg.svg"
      - "scripts/linux/verify-desktop-artifact.py"

permissions:
  contents: read

jobs:
  validate-packaging:
    name: Validate Debian packaging source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install desktop metadata validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
      - name: Validate architecture and native-payload contract
        run: |
          set -euo pipefail
          packaging=linux/packaging/debian
          dpkg-parsechangelog -l "$packaging/changelog" >/dev/null
          grep -qx 'Architecture: any' "$packaging/control"
          grep -Fq '${shlibs:Depends}' "$packaging/control"
          grep -Fq 'payload/bin/eliza-desktop' "$packaging/rules"
          grep -Fq 'readelf -h' "$packaging/rules"
          test -s linux/elizaos/assets/logo_blue_nobg.svg
          desktop-file-validate "$packaging/ai.elizaos.app.desktop"
          appstreamcli validate --no-net "$packaging/ai.elizaos.app.metainfo.xml"
          for executable in eliza-agent eliza-desktop eliza-doctor eliza-autostart; do
            test -x "$packaging/$executable"
            sh -n "$packaging/$executable"
          done
          grep -qx 'disable elizaos-session.target' "$packaging/80-elizaos.preset"
          grep -Fq 'WantedBy=graphical-session.target' "$packaging/elizaos-session.target"
          grep -Fq 'ConditionFileIsExecutable=' "$packaging/elizaos-agent.service"
          grep -Fq 'ConditionFileIsExecutable=' "$packaging/elizaos-desktop.service"
          grep -Fq 'PartOf=graphical-session.target elizaos-session.target' "$packaging/elizaos-agent.service"
          grep -Fq 'PartOf=graphical-session.target elizaos-session.target' "$packaging/elizaos-desktop.service"
          if grep -R -F 'ConditionPathIsExecutable=' "$packaging"; then
            echo "::error::ConditionPathIsExecutable is not a systemd directive"
            exit 1
          fi
          grep -Fq 'ELIZAOS_AUTOSTART_OWNER_REQUIRED' "$packaging/eliza-autostart"
          grep -Fq 'ELIZAOS_AUTOSTART_SESSION_UNAVAILABLE' "$packaging/eliza-autostart"
          grep -Fq 'dh_installsystemduser --no-enable' "$packaging/rules"

  build-deb:
    name: Build authenticated ${{ matrix.debian-architecture }} package
    if: github.event_name != 'pull_request'
    needs: validate-packaging
    environment: release
    runs-on: [self-hosted, linux, "${{ matrix.runner }}", elizaos-release-build]
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            debian-architecture: amd64
            runner: x64
          - architecture: arm64
            debian-architecture: arm64
            runner: arm64
          - architecture: riscv64
            debian-architecture: riscv64
            runner: riscv64
    env:
      WORK_ROOT: /var/tmp/elizaos-debian-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.debian-architecture }}
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256: ${{ secrets.ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Validate immutable inputs and native host
        env:
          DESKTOP_RUN_ID: ${{ inputs.desktop_run_id }}
          DESKTOP_SOURCE_SHA: ${{ inputs.desktop_source_sha }}
        run: |
          set -euo pipefail
          [[ "$DESKTOP_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DESKTOP_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]
          test "$SOURCE_DATE_EPOCH" = "$(git show -s --format=%ct HEAD)"
          test -n "$ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256"
          test "$(dpkg --print-architecture)" = "${{ matrix.debian-architecture }}"
          test "$DESKTOP_SOURCE_SHA" = "$(node scripts/read-eliza-source-lock.mjs)"
      - name: Install deterministic Debian packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            appstream binutils debhelper desktop-file-utils dpkg-dev lintian zstd
      - name: Download signed native desktop and agent artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: elizaOS/eliza
          run-id: ${{ inputs.desktop_run_id }}
          github-token: ${{ secrets.ELIZA_ARTIFACT_TOKEN }}
          name: elizaos-linux-desktop-${{ matrix.architecture }}
          path: ${{ env.WORK_ROOT }}/upstream
      - name: Authenticate and extract exact upstream payload
        id: upstream
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.desktop_source_sha }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT/source"
          node - <<'NODE' | tee "$RUNNER_TEMP/upstream.outputs" >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const path = require("node:path");
          const root = path.join(process.env.WORK_ROOT, "upstream");
          const manifest = JSON.parse(fs.readFileSync(path.join(root, "desktop-artifact-manifest.json"), "utf8"));
          if (manifest.sourceCommit !== process.env.EXPECTED_SOURCE_SHA) throw new Error("desktop source commit mismatch");
          if (manifest.architecture !== process.env.EXPECTED_ARCHITECTURE) throw new Error("desktop architecture mismatch");
          if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(manifest.version)) throw new Error("desktop version is invalid");
          const owned = new Set(["desktop-artifact-manifest.json", "desktop-artifact-manifest.json.sig", manifest.archive, manifest.signature]);
          const entries = fs.readdirSync(root, { withFileTypes: true });
          if (entries.some((entry) => !entry.isFile())) throw new Error("desktop artifact contains a non-file entry");
          const keys = entries.map((entry) => entry.name).filter((name) => !owned.has(name));
          if (entries.length !== 5 || keys.length !== 1 || path.basename(keys[0]) !== keys[0] ||
              !/^[A-Za-z0-9][A-Za-z0-9._-]*\.(?:pem|key|der)$/.test(keys[0])) {
            throw new Error("desktop artifact must contain exactly the manifest, two signatures, archive, and external public key");
          }
          process.stdout.write(`key-name=${keys[0]}\napp-version=${manifest.version}\n`);
          NODE
          key_name="$(sed -n 's/^key-name=//p' "$RUNNER_TEMP/upstream.outputs")"
          test -n "$key_name"
          python3 scripts/linux/verify-desktop-artifact.py \
            --manifest "$WORK_ROOT/upstream/desktop-artifact-manifest.json" \
            --architecture "${{ matrix.architecture }}" \
            --public-key "$WORK_ROOT/upstream/$key_name" \
            --public-key-spki-sha256 "$ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256" \
            --extract-to "$WORK_ROOT/source/payload"
      - name: Stage reproducible native Debian source package
        env:
          APP_VERSION: ${{ steps.upstream.outputs.app-version }}
          KEY_NAME: ${{ steps.upstream.outputs.key-name }}
        run: |
          set -euo pipefail
          cp -a linux/packaging/debian "$WORK_ROOT/source/debian"
          cp -- linux/elizaos/assets/logo_blue_nobg.svg "$WORK_ROOT/source/debian/elizaos-icon.svg"
          mkdir -p "$WORK_ROOT/source/upstream"
          cp -- "$WORK_ROOT/upstream/desktop-artifact-manifest.json" "$WORK_ROOT/source/upstream/desktop-artifact-manifest.json"
          cp -- "$WORK_ROOT/upstream/desktop-artifact-manifest.json.sig" "$WORK_ROOT/source/upstream/desktop-artifact-manifest.json.sig"
          cp -- "$WORK_ROOT/upstream/$KEY_NAME" "$WORK_ROOT/source/upstream/desktop-signing-public.key"
          debian_version="${APP_VERSION//-/~}-1"
          release_date="$(date -u -d "@$SOURCE_DATE_EPOCH" -R)"
          cat > "$WORK_ROOT/source/debian/changelog" <<EOF
          elizaos-app ($debian_version) unstable; urgency=medium

            * Package authenticated native Eliza artifact.

           -- elizaOS Release Automation <ci@elizaos.ai>  $release_date
          EOF
      - name: Build architecture-specific binary package
        run: cd "$WORK_ROOT/source" && dpkg-buildpackage --build=binary --no-sign
      - name: Verify package identity and exact installed payload
        id: deb
        env:
          APP_VERSION: ${{ steps.upstream.outputs.app-version }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find "$WORK_ROOT" -maxdepth 1 -type f -name '*.deb' -size +0c -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::expected exactly one nonempty Debian package; found ${#packages[@]}"
            exit 1
          fi
          package="${packages[0]}"
          expected_version="${APP_VERSION//-/~}-1"
          test "$(dpkg-deb --field "$package" Package)" = elizaos-app
          test "$(dpkg-deb --field "$package" Architecture)" = "${{ matrix.debian-architecture }}"
          test "$(dpkg-deb --field "$package" Version)" = "$expected_version"
          extracted="$WORK_ROOT/extracted"
          dpkg-deb --extract "$package" "$extracted"
          diff --no-dereference --recursive --brief \
            "$WORK_ROOT/source/payload" "$extracted/usr/lib/elizaos"
          readelf -h "$extracted/usr/lib/elizaos/bin/eliza-desktop" >/dev/null
          desktop-file-validate "$extracted/usr/share/applications/ai.elizaos.app.desktop"
          appstreamcli validate --no-net "$extracted/usr/share/metainfo/ai.elizaos.app.metainfo.xml"
          test -s "$extracted/usr/share/icons/hicolor/scalable/apps/ai.elizaos.app.svg"
          test -x "$extracted/usr/bin/eliza-autostart"
          grep -qx 'disable elizaos-session.target' \
            "$extracted/usr/lib/systemd/user-preset/80-elizaos.preset"
          control="$WORK_ROOT/control"
          dpkg-deb --control "$package" "$control"
          if grep -R -E 'systemctl[[:space:]]+--user|was-enabled defaults to true' "$control"; then
            echo "::error::package maintainer scripts must not default-enable user units or contact a user session"
            exit 1
          fi
          grep -Fq "debian-installed 'elizaos-session.target'" "$control/postinst"
          sha256sum "$package" > "$package.sha256"
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - name: Lint package with no policy errors
        run: |
          set +e
          lintian -i --pedantic --no-tag-display-limit "${{ steps.deb.outputs.path }}" > "$WORK_ROOT/lintian.log" 2>&1
          status=$?
          set -e
          while IFS= read -r line; do
            case "$line" in E:*) echo "::error::lintian: $line" ;; W:*) echo "::warning::lintian: $line" ;; esac
          done < "$WORK_ROOT/lintian.log"
          if grep -q '^E:' "$WORK_ROOT/lintian.log"; then exit 1; fi
          exit "$status"
      - name: Attest exact Debian package
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ steps.deb.outputs.path }}
      - name: Bind producer evidence to exact package bytes
        run: |
          node scripts/create-release-evidence.mjs \
            --artifact-id 'debian-package-${{ matrix.debian-architecture }}' \
            --source-artifact 'elizaos-debian-package-${{ matrix.debian-architecture }}' \
            --subject '${{ steps.deb.outputs.path }}' \
            --evidence lintian,slsa-provenance,upstream-ed25519-artifact \
            --output "$WORK_ROOT/debian-package-${{ matrix.debian-architecture }}.release-evidence.json" \
            --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow "$GITHUB_WORKFLOW_REF" --job build-deb
      - name: Upload architecture-specific package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizaos-debian-package-${{ matrix.debian-architecture }}
          path: |
            ${{ steps.deb.outputs.path }}
            ${{ steps.deb.outputs.path }}.sha256
            ${{ env.WORK_ROOT }}/debian-package-${{ matrix.debian-architecture }}.release-evidence.json
            ${{ env.WORK_ROOT }}/lintian.log
          if-no-files-found: error
          retention-days: 30
      - name: Remove package workspace
        if: always()
        run: sudo node scripts/rm-path-recursive.mjs "$WORK_ROOT"
