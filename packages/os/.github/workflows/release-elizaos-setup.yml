name: Release AOSP Flasher

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the packaged desktop application
        type: string
        default: "1.0.0"
      require_signing:
        description: Require verified Apple and Windows distribution signatures
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Version tag
        required: false
      require_signing:
        description: Require verified Apple and Windows distribution signatures
        type: boolean
        default: false
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/release-elizaos-setup.yml"
      - "setup/**"
      - "scripts/verify-electrobun-linux-package.sh"
      - "package.json"
      - "bun.lock"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            platform: darwin
            package-target: mac
            artifact: elizaos-setup-macos
            release-id: setup-macos-arm64
            payload-pattern: "*.dmg"
          - os: ubuntu-24.04
            platform: linux
            package-target: linux
            artifact: elizaos-setup-linux
            release-id: setup-linux-x64
            payload-pattern: "*.tar.gz"
          - os: windows-2025
            platform: win32
            package-target: windows
            artifact: elizaos-setup-windows
            release-id: setup-windows-x64
            payload-pattern: "*.zip"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Reusable workflows do not inherit the caller job's environment. Bind the
    # protected release environment only for distribution-signing runs so its
    # scoped credentials are available without putting PR validation behind an
    # approval gate.
    environment: ${{ inputs.require_signing && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Restore checksum-pinned Electrobun release assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/elizaos/electrobun/v1.18.1
          key: electrobun-assets-v1.18.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/provision-electrobun-runtime.sh') }}
      - name: Verify and provision Electrobun runtime
        shell: bash
        run: scripts/provision-electrobun-runtime.sh
      - run: bun run --cwd setup build
      - run: bun run --cwd setup typecheck
      - run: bun run --cwd setup test
      - name: Configure Apple signing and notarization
        if: matrix.platform == 'darwin' && inputs.require_signing == true
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.APP_STORE_API_ISSUER_ID }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.APP_STORE_API_KEY_ID }}
          ELECTROBUN_APPLEAPIKEY_P8: ${{ secrets.APP_STORE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD ELECTROBUN_DEVELOPER_ID ELECTROBUN_APPLEAPIISSUER ELECTROBUN_APPLEAPIKEY ELECTROBUN_APPLEAPIKEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for signed desktop publication"
              exit 1
            fi
          done
          certificate="$RUNNER_TEMP/elizaos-signing.p12"
          keychain="$RUNNER_TEMP/elizaos-signing.keychain-db"
          api_key="$RUNNER_TEMP/AuthKey_${ELECTROBUN_APPLEAPIKEY}.p8"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$certificate"
          printf '%s' "$ELECTROBUN_APPLEAPIKEY_P8" > "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          {
            echo "ELECTROBUN_DEVELOPER_ID=$ELECTROBUN_DEVELOPER_ID"
            echo "ELECTROBUN_APPLEAPIISSUER=$ELECTROBUN_APPLEAPIISSUER"
            echo "ELECTROBUN_APPLEAPIKEY=$ELECTROBUN_APPLEAPIKEY"
            echo "ELECTROBUN_APPLEAPIKEYPATH=$api_key"
            echo "ELIZAOS_SIGNING_KEYCHAIN=$keychain"
            echo "ELIZAOS_MACOS_CERTIFICATE=$certificate"
          } >> "$GITHUB_ENV"

      - name: Configure Windows Authenticode certificate
        if: matrix.platform == 'win32' && inputs.require_signing == true
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PFX and WINDOWS_CERTIFICATE_PASSWORD are required for signed desktop publication"
          }
          $certificate = Join-Path $env:RUNNER_TEMP "elizaos-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          "ELIZAOS_WINDOWS_CERTIFICATE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package desktop app
        env:
          ELIZAOS_RELEASE_VERSION: ${{ inputs.version || '1.0.0' }}
        run: bun run --cwd setup package:${{ matrix.package-target }}
      - name: Sign and verify Windows installer
        if: matrix.platform == 'win32' && inputs.require_signing == true
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $zip = @(Get-ChildItem setup/artifacts/*.zip)
          if ($zip.Count -ne 1) { throw "expected exactly one Windows setup zip; found $($zip.Count)" }
          $stage = Join-Path $env:RUNNER_TEMP "signed-setup"
          Expand-Archive -Path $zip[0].FullName -DestinationPath $stage -Force
          $executables = @(Get-ChildItem $stage -Recurse -File -Filter *.exe)
          if ($executables.Count -eq 0) { throw "Windows setup zip contains no executable" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe is unavailable" }
          foreach ($executable in $executables) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $env:ELIZAOS_WINDOWS_CERTIFICATE /p $env:WINDOWS_CERTIFICATE_PASSWORD $executable.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $($executable.Name)" }
            & $signtool.FullName verify /pa /v $executable.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $($executable.Name)" }
          }
          Remove-Item $zip[0].FullName
          Compress-Archive -Path "$stage\*" -DestinationPath $zip[0].FullName -CompressionLevel Optimal

      - name: Require one release payload
        shell: bash
        run: |
          set -euo pipefail
          payloads=()
          while IFS= read -r payload; do payloads+=("$payload"); done < <(find setup/artifacts -maxdepth 1 -type f -name '${{ matrix.payload-pattern }}' -size +0c -print)
          if [ "${#payloads[@]}" -ne 1 ]; then
            echo "::error::expected exactly one ${{ matrix.payload-pattern }} setup payload; found ${#payloads[@]}"
            exit 1
          fi
      - name: Verify Linux package boundary
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          payload="$(find setup/artifacts -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          scripts/verify-electrobun-linux-package.sh "$payload"
      - name: Verify Apple signature and notarization
        if: matrix.platform == 'darwin' && inputs.require_signing == true
        shell: bash
        run: |
          set -euo pipefail
          payload="$(find setup/artifacts -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$payload"
          codesign --verify --deep --strict --verbose=2 "$payload"
          xcrun stapler validate "$payload"
      - name: Bind setup release evidence to exact output bytes
        shell: bash
        run: |
          set -euo pipefail
          payloads=()
          while IFS= read -r payload; do payloads+=("$payload"); done < <(find setup/artifacts -maxdepth 1 -type f -name '${{ matrix.payload-pattern }}' -size +0c -print)
          test "${#payloads[@]}" -eq 1
          evidence=package-test
          if [ '${{ inputs.require_signing }}' = true ] && [ '${{ matrix.platform }}' = darwin ]; then
            evidence="${evidence},apple-notarization"
          fi
          if [ '${{ inputs.require_signing }}' = true ] && [ '${{ matrix.platform }}' = win32 ]; then
            evidence="${evidence},authenticode"
          fi
          node scripts/create-release-evidence.mjs \
            --artifact-id '${{ matrix.release-id }}' \
            --source-artifact '${{ matrix.artifact }}' \
            --subject "${payloads[0]}" \
            --evidence "$evidence" \
            --output "setup/artifacts/setup-${{ matrix.platform }}.release-evidence.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow "$GITHUB_WORKFLOW_REF" \
            --job build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: |
            setup/artifacts/${{ matrix.payload-pattern }}
            setup/artifacts/*.release-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary Apple signing credentials
        if: always() && matrix.platform == 'darwin' && inputs.require_signing == true
        shell: bash
        run: |
          if [ -n "${ELIZAOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$ELIZAOS_SIGNING_KEYCHAIN" || true
          fi
          rm -f "${ELECTROBUN_APPLEAPIKEYPATH:-}" "${ELIZAOS_MACOS_CERTIFICATE:-}"
      - name: Remove temporary Windows signing credentials
        if: always() && matrix.platform == 'win32' && inputs.require_signing == true
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue $env:ELIZAOS_WINDOWS_CERTIFICATE
