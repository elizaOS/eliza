name: Publish AOSP Update Manifest

on:
  workflow_call:
    inputs:
      version:
        description: Version string (e.g. 2.0.0-beta.0)
        type: string
        required: true
      channel:
        description: Release channel
        type: string
        default: beta
      tag:
        description: Git tag / GitHub release tag to attach manifest to
        type: string
        required: true

  workflow_dispatch:
    inputs:
      version:
        description: Version string (e.g. 2.0.0-beta.0)
        type: string
        required: true
      channel:
        description: Release channel
        type: choice
        default: beta
        options:
          - stable
          - beta
          - canary
      tag:
        description: Git tag / GitHub release tag (e.g. v2.0.0-beta.2)
        type: string
        required: true

# Default to least privilege. Override per-job where needed.
permissions:
  contents: write

jobs:
  publish-manifest:
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'true' && '["self-hosted","hetzner-robot"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Validate signed Android releases and publish index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/android-release.XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          gh release view "$RELEASE_TAG" >/dev/null
          gh release download "$RELEASE_TAG" --pattern "elizaos-*-android-*.zip" --dir "$stage"
          gh release download "$RELEASE_TAG" --pattern "*.android-release.json" --dir "$stage"
          output="$stage/aosp-update-manifest-${RELEASE_CHANNEL}.json"
          node scripts/android/publish-update-manifest.ts \
            "$stage" "$RELEASE_VERSION" "$RELEASE_CHANNEL" "$RELEASE_TAG" \
            "$GITHUB_REPOSITORY" "$output"
          gh release upload "$RELEASE_TAG" "$output" --clobber
