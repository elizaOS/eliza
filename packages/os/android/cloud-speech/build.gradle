apply plugin: 'com.android.library'
def cloudSource = layout.buildDirectory.dir('generated/source/cloudSpeech')
def stageCloudSpeech = tasks.register('stageCloudSpeechBridge', Sync) {
 from(file('../local-inference/speech-bridge/src/main/java')) { include 'ai/eliza/voice/SpeechStreamBridgePlugin.java', 'ai/eliza/voice/CloudSpeechWire.java' }
 into(cloudSource)
}
android {
 namespace 'ai.eliza.voice.cloud'
 compileSdk rootProject.ext.compileSdkVersion
 defaultConfig { minSdk 29; targetSdk rootProject.ext.targetSdkVersion }
 sourceSets.main {
  java.srcDirs = [cloudSource]
  manifest.srcFile file('../local-inference/src/main/AndroidManifest.xml')
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
}
preBuild.dependsOn(stageCloudSpeech)
dependencies {
 api project(':eliza-voice-io')
 implementation project(':capacitor-android')
 implementation 'com.squareup.okhttp3:okhttp:5.3.2'
}
