// The upstream cloud-only embedded agent and its runtime permissions.
apply plugin: 'com.android.library'
def profile = new groovy.json.JsonSlurper().parse(rootProject.file('.eliza-consumer-profile.json'))
android {
 namespace 'ai.eliza.plugins.agent.embedded'
 compileSdk rootProject.ext.compileSdkVersion
 defaultConfig {
  minSdk rootProject.ext.minSdkVersion
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 compileOptions {
  sourceCompatibility JavaVersion.toVersion(profile.toolchain.java)
  targetCompatibility JavaVersion.toVersion(profile.toolchain.java)
 }
}
dependencies {
 implementation project(':capacitor-android')
 implementation 'com.google.android.gms:play-services-auth:21.1.1'
 androidTestImplementation "androidx.test:runner:${rootProject.ext.androidxTestRunnerVersion}"
}
