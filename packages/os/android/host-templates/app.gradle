apply plugin: 'com.android.application'
def profile = new groovy.json.JsonSlurper().parse(rootProject.file('.eliza-consumer-profile.json'))
if (profile.kotlin) apply plugin: 'org.jetbrains.kotlin.android'
def identity = profile.identity
def hostEnvironment = { String name -> def value = System.getenv(name); value == null || value.trim().isEmpty() ? null : value.trim() }
def hostVersionCode = identity.versionCode
def hostVersionName = identity.version
if (profile.versionOverride) {
 def code = hostEnvironment(profile.versionOverride.versionCode)
 if (code != null) {
  if (!(code ==~ /[1-9][0-9]{0,9}/) || code.toLong() > 2100000000L)
   throw new GradleException("${profile.versionOverride.versionCode} must be a positive integer no greater than 2100000000")
  hostVersionCode = code.toInteger()
 }
 def name = hostEnvironment(profile.versionOverride.versionName)
 if (name != null) {
  if (!(name ==~ /[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}/))
   throw new GradleException("${profile.versionOverride.versionName} must be a plain version label")
  hostVersionName = name
 }
}
def hostSigning = null
if (profile.signing) {
 def names = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].collect { profile.signing[it] }
 def missing = names.findAll { hostEnvironment(it) == null }
 if (!missing.isEmpty() && missing.size() < names.size())
  throw new GradleException("[release-signing] incomplete signing environment. Missing: ${missing.join(', ')}. Set all of ${names.join(', ')}, or none.")
 if (missing.isEmpty()) {
  def store = file(hostEnvironment(profile.signing.storeFile))
  if (!store.isFile()) throw new GradleException("${profile.signing.storeFile} does not name a readable keystore file")
  hostSigning = [store: store, storePassword: hostEnvironment(profile.signing.storePassword),
   keyAlias: hostEnvironment(profile.signing.keyAlias), keyPassword: hostEnvironment(profile.signing.keyPassword)]
 }
}
def hostTestMocks = false
if (profile.testMocks) {
 def raw = project.findProperty(profile.testMocks.property) ?: System.getenv(profile.testMocks.property)
 hostTestMocks = raw != null && raw.toString() == '1'
}
android {
 namespace identity.appId
 compileSdk rootProject.ext.compileSdkVersion
 defaultConfig {
  applicationId identity.appId
  minSdk rootProject.ext.minSdkVersion
  targetSdk rootProject.ext.targetSdkVersion
  versionCode hostVersionCode
  versionName hostVersionName
  manifestPlaceholders = profile.manifestPlaceholders
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  profile.buildConfigFields.each { field -> buildConfigField field.type, field.name, field.value }
  if (profile.testMocks?.buildConfigField) buildConfigField 'boolean', profile.testMocks.buildConfigField, 'false'
 }
 buildFeatures { buildConfig true }
 androidResources { noCompress.addAll(profile.noCompress) }
 flavorDimensions += 'distribution'
 productFlavors {
  profile.flavors.each { flavor ->
   create(flavor.name) {
    dimension 'distribution'
    flavor.buildConfigFields.each { field -> buildConfigField field.type, field.name, field.value }
   }
  }
 }
 sourceSets.main.manifest.srcFile profile.manifest
 sourceSets.main.res.srcDir profile.identityResources
 profile.flavors.each { flavor -> if (flavor.manifest) sourceSets.getByName(flavor.name).manifest.srcFile flavor.manifest }
 profile.sourceSets.each { name, inputs ->
  inputs.each { kind, directories -> sourceSets.getByName(name).getProperty(kind).srcDirs(directories) }
 }
 profile.generatedSources.each { entry ->
  sourceSets.getByName(entry.sourceSet).getProperty(entry.kind).srcDir(layout.buildDirectory.dir(entry.path))
 }
 if (hostTestMocks) {
  profile.testMocks.debug.java.each { directory -> sourceSets.debug.java.srcDir directory }
  profile.testMocks.debug.res.each { directory -> sourceSets.debug.res.srcDir directory }
  if (profile.testMocks.debug.manifest) sourceSets.debug.manifest.srcFile profile.testMocks.debug.manifest
  profile.testMocks.androidTest.java.each { directory -> sourceSets.androidTest.java.srcDir directory }
 }
 signingConfigs {
  if (hostSigning) {
   release {
    storeFile hostSigning.store
    storePassword hostSigning.storePassword
    keyAlias hostSigning.keyAlias
    keyPassword hostSigning.keyPassword
   }
  }
 }
 buildTypes {
  debug {
   debuggable true
   profile.buildTypes.debug.buildConfigFields.each { field -> buildConfigField field.type, field.name, field.value }
  if (profile.testMocks?.buildConfigField) buildConfigField 'boolean', profile.testMocks.buildConfigField, hostTestMocks ? 'true' : 'false'
   if (profile.buildTypes.debug.abiFilters) ndk { abiFilters(*profile.buildTypes.debug.abiFilters) }
  }
  release {
   minifyEnabled profile.releaseMinify
   if (profile.buildTypes.release.shrinkResources) shrinkResources true
   if (profile.releaseMinify) proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), *profile.buildTypes.release.proguardFiles)
   profile.buildTypes.release.buildConfigFields.each { field -> buildConfigField field.type, field.name, field.value }
   if (profile.buildTypes.release.abiFilters) ndk { abiFilters(*profile.buildTypes.release.abiFilters) }
   if (hostSigning) signingConfig signingConfigs.release
  }
 }
 compileOptions {
  sourceCompatibility JavaVersion.toVersion(profile.toolchain.java)
  targetCompatibility JavaVersion.toVersion(profile.toolchain.java)
 }
 if (profile.kotlin) kotlinOptions { jvmTarget = String.valueOf(profile.toolchain.java) }
 if (profile.runtimeMain || profile.preserveRuntimeBytes || profile.nativeLibraries == 'extract-16k') packaging.jniLibs.useLegacyPackaging = true
 if (profile.nativeLibraries == 'extract-16k') androidResources.noCompress += 'so'
 if (profile.runtimeMain) {
  sourceSets.main.assets.srcDir(new File(profile.runtimeMain, 'assets'))
  sourceSets.main.jniLibs.srcDir(new File(profile.runtimeMain, 'jniLibs'))
 }
}
def variantManifest = profile.hostManifest ?: profile.embeddedServiceManifest
if (variantManifest) androidComponents.onVariants(androidComponents.selector().all()) { variant ->
 variant.sources.manifests.addStaticManifestFile(variantManifest)
}
dependencies {
 androidTestImplementation "androidx.test:runner:${rootProject.ext.androidxTestRunnerVersion}"
 profile.modules.findAll { it.appDependency }.each { module -> implementation project(":${module.name}") }
 profile.dependencies.each { dependency -> add(dependency.configuration, dependency.coordinate) }
}
def admissionBefore = null
profile.admission.each { step ->
 def previous = admissionBefore
 def admission = tasks.register(step.name, Exec) {
  workingDir step.directory
  commandLine step.command
  if (previous != null) dependsOn previous
 }
 tasks.named('preBuild').configure { dependsOn admission }
 admissionBefore = admission
}
def stagedAssets = [
 [task: 'stageElizaConsumerAssetFiles', directory: 'generated/eliza-consumer-assets', into: '', files: profile.assetFiles],
 [task: 'stageElizaAgentData', directory: 'generated/eliza-agent-data', into: 'agent', files: profile.agentFiles],
]
stagedAssets.findAll { it.files }.each { staged ->
 def directory = layout.buildDirectory.dir(staged.directory)
 def stage = tasks.register(staged.task, Sync) {
  into directory
  staged.files.each { asset -> from(asset.source) { if (staged.into) into staged.into; rename { asset.name } } }
 }
 android.sourceSets.main.assets.srcDir(directory)
 tasks.named('preBuild').configure { dependsOn stage }
}
if (profile.nativeLibraries == 'extract-16k') androidComponents.onVariants(androidComponents.selector().all()) { variant ->
 def buildTools = new File(androidComponents.sdkComponents.sdkDirectory.get().asFile, "build-tools/${android.buildToolsVersion}")
 def signing = android.buildTypes.getByName(variant.buildType).signingConfig
 tasks.matching { it.name == "package${variant.name.capitalize()}" }.configureEach { pack ->
  pack.doLast {
   def apks = pack.outputDirectory.get().asFile.listFiles().findAll { it.name.endsWith('.apk') }
   if (apks.size() != 1) throw new GradleException("${pack.name} wrote ${apks.size()} APKs, expected one")
   File apk = apks[0], aligned = new File(apk.parentFile, "${apk.name}.aligned")
   if (signing == null && !apk.name.endsWith('-unsigned.apk'))
    throw new GradleException("${apk.name} is signed by a key that 16 KiB realignment cannot renew")
   aligned.delete()
   project.exec { commandLine new File(buildTools, 'zipalign'), '-P', '16', '-f', '4', apk, aligned }
   if (signing != null) {
    project.exec {
     environment 'ELIZA_CONSUMER_STORE_PASSWORD', signing.storePassword
     environment 'ELIZA_CONSUMER_KEY_PASSWORD', signing.keyPassword
     commandLine new File(buildTools, 'apksigner'), 'sign', '--ks', signing.storeFile,
      *(signing.storeType ? ['--ks-type', signing.storeType] : []), '--ks-key-alias', signing.keyAlias,
      '--ks-pass', 'env:ELIZA_CONSUMER_STORE_PASSWORD', '--key-pass', 'env:ELIZA_CONSUMER_KEY_PASSWORD',
      '--v1-signing-enabled', String.valueOf(signing.enableV1Signing == true),
      '--v2-signing-enabled', String.valueOf(signing.enableV2Signing != false),
      '--v3-signing-enabled', String.valueOf(signing.enableV3Signing == true),
      '--v4-signing-enabled', 'false', aligned
    }
   }
   project.exec { commandLine new File(buildTools, 'zipalign'), '-c', '-P', '16', '4', aligned }
   if (!apk.delete() || !aligned.renameTo(apk)) throw new GradleException("Cannot replace ${apk}")
  }
 }
}
profile.appScripts.each { script -> apply from: script }

abstract class PreserveElizaRuntimeArchives extends DefaultTask {
 @InputDirectory @PathSensitive(PathSensitivity.RELATIVE) abstract DirectoryProperty getMergedAssets()
 @InputDirectory @PathSensitive(PathSensitivity.RELATIVE) abstract DirectoryProperty getRuntimeAssets()
 @Input abstract ListProperty<String> getArchivePaths()
 @OutputDirectory abstract DirectoryProperty getPackagedAssets()
 @javax.inject.Inject abstract FileSystemOperations getFileOperations()

 private static String digest(InputStream bytes) {
  def hash = java.security.MessageDigest.getInstance('SHA-256')
  new java.security.DigestInputStream(bytes, hash).withCloseable { stream ->
   stream.transferTo(OutputStream.nullOutputStream())
  }
  hash.digest().encodeHex().toString()
 }

 @TaskAction void preserve() {
  File runtime = runtimeAssets.get().asFile
  File merged = mergedAssets.get().asFile
  def archives = archivePaths.get()
  def expanded = archives.collect { name -> name.substring(0, name.length() - 3) }
  archives.eachWithIndex { name, index ->
   def shadow = expanded[index]
   def original = new File(runtime, name)
   def inflated = new File(merged, shadow)
   if (new File(runtime, shadow).exists() || new File(merged, name).exists() || !inflated.isFile()
     || original.withInputStream { input -> PreserveElizaRuntimeArchives.digest(new java.util.zip.GZIPInputStream(input)) } != PreserveElizaRuntimeArchives.digest(inflated.newInputStream())) {
    throw new GradleException("Cannot preserve the staged runtime archive ${name}: merged asset collision or unexpected bytes")
   }
  }
  fileOperations.sync {
   into packagedAssets
   from(merged) { exclude expanded }
   from(runtime) { include archives }
  }
 }
}

if (profile.runtimeMain) {
 def runtimeAssets = new File(profile.runtimeMain, 'assets')
 def archives = fileTree(runtimeAssets).files.findAll { archive -> archive.name.toLowerCase(Locale.ROOT).endsWith('.gz') }
 def archivePaths = archives.collect { archive -> runtimeAssets.toPath().relativize(archive.toPath()).join('/') }.sort()
 if (archivePaths) androidComponents.onVariants(androidComponents.selector().all()) { variant ->
  def preserve = tasks.register("preserve${variant.name.capitalize()}ElizaRuntimeArchives", PreserveElizaRuntimeArchives) {
   it.runtimeAssets.set(runtimeAssets)
   it.archivePaths.set(archivePaths)
  }
  variant.artifacts.use(preserve).wiredWithDirectories(
   { task -> task.mergedAssets }, { task -> task.packagedAssets }
  ).toTransform(com.android.build.api.artifact.SingleArtifact.ASSETS.INSTANCE)
 }
}
