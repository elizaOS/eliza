apply plugin: 'com.android.library'
android {
 namespace 'ai.eliza.os.agent'
 compileSdk rootProject.ext.compileSdkVersion
 defaultConfig { minSdk 29; targetSdk rootProject.ext.targetSdkVersion; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
 if (rootProject.findProject(':capacitor-android') != null) {
  sourceSets { main { java.srcDirs += 'src/capacitor/java' } }
 }
}
dependencies {
 api project(':eliza-runtime-files')
 if (rootProject.findProject(':capacitor-android') != null) {
  implementation project(':capacitor-android')
 }
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20250517'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
