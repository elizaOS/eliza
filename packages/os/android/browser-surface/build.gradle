import javax.inject.Inject

import org.gradle.process.ExecOperations

ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.6.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.1.5'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.5.1'
    androidxWebkitVersion = project.hasProperty('androidxWebkitVersion') ? rootProject.ext.androidxWebkitVersion : '1.16.0'
    coroutinesVersion = project.hasProperty('coroutinesVersion') ? rootProject.ext.coroutinesVersion : '1.9.0'
}

apply plugin: 'com.android.library'
// Explicitly apply the Kotlin Android plugin. Without it, AGP 8.13 falls back to
// its "built-in Kotlin" compile path, which does NOT bundle the compiled
// classes into the *release* library jar — the Capacitor plugin would then be
// absent from the release dex. Applying the standard plugin wires Kotlin into
// both debug and release jar-bundling.
apply plugin: 'org.jetbrains.kotlin.android'

abstract class GenerateBrowserControlAssets extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getControlModule()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getPageModules()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getReadPage()

    @OutputDirectory
    abstract DirectoryProperty getAssets()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void generate() {
        def output = assets.get().asFile
        output.mkdirs()
        java.nio.file.Files.copy(
                readPage.get().asFile.toPath(),
                new File(output, 'read-page.js').toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        new File(output, 'control-channel.js').withOutputStream { stream ->
            execOperations.exec {
                workingDir controlModule.get().asFile.parentFile
                commandLine 'node', '--input-type=module', '--eval',
                        "import { nativeControlProgram } from './native-control-channel.mjs'; process.stdout.write(nativeControlProgram());"
                standardOutput = stream
            }
        }
    }
}

def controlModule = layout.projectDirectory.file('native-control-channel.mjs')
def hasControlSource = controlModule.asFile.isFile()

android {
    namespace = "ai.eliza.plugins.browsersurface"
    if (!hasControlSource) sourceSets.main.assets.srcDirs += ['resources']
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34

    buildFeatures {
        aidl true
        buildConfig true
    }

    defaultConfig {
        def browserPackage = System.getenv('ELIZA_CHROMIUM_PACKAGE_NAME')
        if (browserPackage == null) browserPackage = 'org.chromium.chrome'
        if (!(browserPackage in ['org.chromium.chrome', 'ai.elizaos.chromium'])) {
            throw new GradleException('ELIZA_CHROMIUM_PACKAGE_NAME must be org.chromium.chrome or ai.elizaos.chromium')
        }
        def browserCertificate = System.getenv('ELIZA_CHROMIUM_CERT_SHA256') ?: ''
        if (browserCertificate && !(browserCertificate ==~ /[0-9a-fA-F]{64}/)) {
            throw new GradleException('ELIZA_CHROMIUM_CERT_SHA256 must be a 64-character SHA-256 certificate digest')
        }
        buildConfigField "String", "ELIZA_CHROMIUM_PACKAGE_NAME", "\"${browserPackage}\""
        buildConfigField "String", "ELIZA_CHROMIUM_CERT_SHA256", "\"${browserCertificate}\""
        manifestPlaceholders.elizaChromiumPackageName = browserPackage
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }
}

if (hasControlSource) {
    def controlAssets = tasks.register('generateBrowserControlAssets', GenerateBrowserControlAssets) {
        it.controlModule.set(controlModule)
        it.pageModules.from('../../browser/src/page-command.mjs', '../../browser/src/page-guidance.mjs')
        it.readPage.set(layout.projectDirectory.file('resources/read-page.js'))
        it.assets.set(layout.buildDirectory.dir('generated/browserControlAssets'))
    }
    androidComponents.onVariants(androidComponents.selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(controlAssets) { task -> task.assets }
    }
}

repositories {
    google()
    maven {
        url = uri(rootProject.ext.has('mavenCentralMirrorUrl') ? rootProject.ext.mavenCentralMirrorUrl : 'https://repo.maven.apache.org/maven2')
    }
    mavenCentral()
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.window:window:1.4.0"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    // Out-of-process renderer control + multi-profile storage partitioning.
    implementation("androidx.webkit:webkit:$androidxWebkitVersion") {
        version { require "1.16.0" }
    }

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.16.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.webkit:webkit:$androidxWebkitVersion"
}

tasks.withType(Zip).configureEach {
    if (name ==~ /bundle.*Aar/) {
        doLast {
            new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { archive ->
                for (asset in ['read-page.js', 'control-channel.js']) {
                    def entry = archive.getEntry("assets/${asset}")
                    if (entry == null || entry.size <= 0) {
                        throw new GradleException("Browser surface archive is missing ${asset}")
                    }
                }
            }
        }
    }
}

tasks.withType(Test).configureEach {
    systemProperty "robolectric.dependency.repo.url", rootProject.ext.has("mavenCentralMirrorUrl") ? rootProject.ext.mavenCentralMirrorUrl : "https://repo.maven.apache.org/maven2"
}
