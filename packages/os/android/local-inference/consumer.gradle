apply plugin: 'com.android.library'

// Consumers set ext.elizaParadeeSourceDir to this directory and apply this file.
def paradeeSource = project.hasProperty('elizaParadeeSourceDir') ? file(project.elizaParadeeSourceDir) : project.projectDir
def paradeeNative = project.hasProperty('elizaParadeeNativeDir') ? file(project.elizaParadeeNativeDir) : new File(paradeeSource, 'native')
// Packaging checks that need only the Java API (ai.eliza.voice): no native build, models or record.
def apiOnly = project.findProperty('elizaParadeeApiOnly')?.toString() == 'true'
def inferenceLibDir = new File(paradeeNative, 'jniLibs')
// The engine is the consumer's checkout of the pinned elizaOS/llama.cpp fork (engine.lock.json).
def engineDir = project.hasProperty('elizaInferenceEngineDir') ? file(project.elizaInferenceEngineDir) : null
def ffiInclude = engineDir == null ? null : new File(engineDir, 'tools/omnivoice/include')
if (!apiOnly && (ffiInclude == null || !new File(ffiInclude, 'eliza-inference-ffi.h').isFile())) throw new GradleException('[local-inference] set elizaInferenceEngineDir to the pinned engine checkout')
def jniSource = new File(paradeeSource, 'src/main/elizavoice-jni')
def paradeeAbis = project.findProperty('elizaParadeeAbis')?.toString()?.split(',', -1)?.toList() ?: ['arm64-v8a', 'x86_64']
if (!paradeeAbis || paradeeAbis.toSet().size() != paradeeAbis.size() || paradeeAbis.any { !(it in ['arm64-v8a', 'x86_64']) }) throw new GradleException('Invalid elizaParadeeAbis')

android {
    namespace 'ai.eliza.voice'
    compileSdk 36
    if (!apiOnly) { ndkVersion '28.2.13676358' }
    defaultConfig {
        minSdk 26
        consumerProguardFiles new File(paradeeSource, 'consumer-rules.pro')
        if (!apiOnly) {
            externalNativeBuild {
                cmake {
                    abiFilters(*paradeeAbis)
                    arguments "-DELIZAVOICE_FFI_INCLUDE_DIR=${ffiInclude.canonicalPath}",
                        "-DELIZAVOICE_INFERENCE_LIB_DIR=${inferenceLibDir.canonicalPath}",
                        "-DELIZA_VOICE_JNI_SOURCE_DIR=${jniSource.canonicalPath}",
                        '-DANDROID_STL=c++_shared'
                }
            }
        }
    }
    if (!apiOnly) {
        externalNativeBuild {
            cmake {
                path new File(paradeeSource, 'src/main/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }
    sourceSets.main {
        java.srcDirs = [new File(paradeeSource, 'src/main/java')]
        manifest.srcFile new File(paradeeSource, 'src/main/AndroidManifest.xml')
        assets.srcDirs = apiOnly ? [] : [new File(paradeeNative, 'assets')]
        jniLibs.srcDirs = apiOnly ? [] : [inferenceLibDir]
    }
    if (apiOnly) {
        packaging.jniLibs.excludes += ['**/libc++_shared.so', '**/libelizainference.so']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

// One hash-pinned input contract for the JNI consumer.
preBuild.doFirst {
    if (apiOnly) return
    def record = new File(paradeeNative, 'build-record.json')
    if (!record.isFile()) throw new GradleException("[paradee-voice] ${record} missing; run packages/os/android/local-inference/scripts/build-native.ts")
    def approved = new groovy.json.JsonSlurper().parse(record)
    if (!(approved.abis instanceof List) || !approved.abis.containsAll(paradeeAbis)) throw new GradleException('[paradee-voice] missing requested ABI in build-record.json')
    if (!(approved.files instanceof List) || approved.files.any { !(it.path instanceof String) } || approved.files*.path.toSet().size() != approved.files.size()) throw new GradleException('[paradee-voice] invalid or duplicate build-record paths')
    // Package exactly the recorded files, including notices and the manifest.
    // Reject symlinks before walking into them, so neither an unrecorded file nor
    // an aliased directory can silently extend the APK's model payload.
    def assetRoot = new File(paradeeNative, 'assets').toPath()
    def actualAssets = [] as Set
    if (java.nio.file.Files.isDirectory(assetRoot)) {
        def paths = java.nio.file.Files.walk(assetRoot)
        try {
            paths.forEach { path ->
                if (java.nio.file.Files.isSymbolicLink(path)) throw new GradleException('[paradee-voice] symlink in model assets')
                if (java.nio.file.Files.isRegularFile(path)) actualAssets.add('assets/' + assetRoot.relativize(path).toString().replace(File.separator, '/'))
            }
        } finally { paths.close() }
    }
    def recordedAssets = approved.files.findAll { it.path.startsWith('assets/') }.collect { it.path }.toSet()
    if (actualAssets != recordedAssets) throw new GradleException('[paradee-voice] model asset inventory differs from build-record.json')
    // The bundle must be the one inputs.json selects (scripts/voice-bundle.ts).
    def bundleCheck = providers.exec {
        commandLine 'node', new File(paradeeSource, 'scripts/voice-bundle.ts').absolutePath,
            '--inputs', new File(paradeeSource, 'inputs.json').absolutePath,
            '--record', record.absolutePath,
            '--manifest', new File(paradeeNative, 'assets/paradee-voice/v1/manifest.json').absolutePath
        ignoreExitValue = true
    }
    if (bundleCheck.result.get().exitValue != 0) throw new GradleException(bundleCheck.standardError.asText.get().trim())
    approved.files.each { entry ->
        def target = new File(paradeeNative, entry.path)
        if (!target.canonicalPath.startsWith(paradeeNative.canonicalPath + File.separator)) throw new GradleException('[paradee-voice] input path escaped native output')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        if (!target.isFile() || target.length() != entry.bytes) throw new GradleException("[paradee-voice] missing or resized ${target}")
        target.withInputStream { stream -> byte[] buffer = new byte[1 << 16]; int count; while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count) }
        if (digest.digest().encodeHex().toString() != entry.sha256) throw new GradleException("[paradee-voice] ${target} differs from build-record.json")
    }
}

// The agent service's inference host is served by HostInferenceNative over this module's natives;
// live capture and speech output run on the os voice-io module.
dependencies {
    implementation project(':eliza-agent-service')
    api project(':eliza-voice-io')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

// The product-subclassable on-device and Cloud speech bridges (LocalSpeechBridgePlugin,
// SpeechStreamBridgePlugin). The host enables them with elizaSpeechBridgeCapacitor=true and
// registers its own @CapacitorPlugin subclasses.
def speechBridgeEnabled = project.findProperty('elizaSpeechBridgeCapacitor')?.toString() == 'true'
if (speechBridgeEnabled) {
    android.sourceSets.main.java.srcDir new File(paradeeSource, 'speech-bridge/src/main/java')
    android.sourceSets.test.java.srcDir new File(paradeeSource, 'speech-bridge/src/test/java')
    dependencies {
        compileOnly project(':capacitor-android')
        implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    }
}
