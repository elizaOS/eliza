ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
}

apply plugin: 'com.android.library'
android {
    namespace = "ai.eliza.plugins.phone"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

repositories {
    google()
    maven { url = uri(rootProject.ext.has('mavenCentralMirrorUrl') ? rootProject.ext.mavenCentralMirrorUrl : 'https://repo.maven.apache.org/maven2') }
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')

    // JVM test of the shared call screen's keypad tone ownership.
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.16.1"
}

tasks.withType(Test).configureEach {
    systemProperty "robolectric.dependency.repo.url", rootProject.ext.has("mavenCentralMirrorUrl") ? rootProject.ext.mavenCentralMirrorUrl : "https://repo.maven.apache.org/maven2"
}
