apply plugin: 'com.android.library'
android {
 namespace 'ai.eliza.plugins.reminders'
 compileSdk rootProject.ext.compileSdkVersion
 defaultConfig { minSdk Math.max(26, rootProject.ext.minSdkVersion as int); targetSdk rootProject.ext.targetSdkVersion; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 testOptions { unitTests.includeAndroidResources = true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.16.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 implementation project(':capacitor-android')
 implementation 'androidx.appcompat:appcompat:1.7.1'
}

tasks.withType(Test).configureEach {
    systemProperty "robolectric.dependency.repo.url", rootProject.ext.has("mavenCentralMirrorUrl") ? rootProject.ext.mavenCentralMirrorUrl : "https://repo.maven.apache.org/maven2"
}
