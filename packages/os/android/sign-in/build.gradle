apply plugin: 'com.android.library'
android {
 namespace 'ai.eliza.plugins.signin'
 compileSdk rootProject.ext.compileSdkVersion
 defaultConfig { minSdk 29; targetSdk rootProject.ext.targetSdkVersion; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
}
dependencies {
 implementation project(':capacitor-android')
 implementation project(':eliza-secure-store')
 implementation project(':eliza-agent-service')
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'androidx.credentials:credentials:1.6.0'
 implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
 implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
