# Canonical elizaOS Debian workstation image.
#
# This configuration deliberately does not import ../config/includes.chroot or
# its live-build hooks. That tree contains the retired Cage kiosk, autologin,
# and an unrestricted sudo rule. mkosi.extra/ is the reviewed integration
# boundary for this image.

[Config]
# Debian trixie ships mkosi 25.3. Keep syntax compatible with that release and
# fail before doing build work when an older host is used.
MinimumVersion=25.3

[Distribution]
Distribution=debian
Release=trixie
Repositories=main,contrib,non-free-firmware

[Output]
ImageId=elizaos-linux-%a
OutputDirectory=../out/mkosi
Format=disk
ManifestFormat=json
CompressOutput=zstd

[Content]
Bootable=yes
Bootloader=grub
BiosBootloader=none
Locale=C.UTF-8
Timezone=UTC
WithDocs=no
Packages=
    systemd
    systemd-sysv
    systemd-resolved
    systemd-timesyncd
    systemd-repart
    dbus
    udev
    util-linux
    gdisk
    e2fsprogs
    btrfs-progs
    ntfs-3g
    initramfs-tools
    kbd
    locales
    ca-certificates
    curl
    git
    python3
    python3-cryptography
    polkitd
    sqlite3
    xdg-utils
    xdg-desktop-portal
    xdg-desktop-portal-gnome
    gdm3
    gnome-core
    gnome-initial-setup
    gnome-shell-extension-appindicator
    speech-dispatcher-espeak-ng
    dconf-cli
    accountsservice
    network-manager
    pipewire
    pipewire-pulse
    wireplumber
    libgl1-mesa-dri
    mesa-utils
    plymouth
    fontconfig
    fonts-noto-core
    fonts-noto-mono
    fonts-dejavu-core
    pciutils
    usbutils
    htop
    strace
    zstd

[Build]
# Release CI must additionally select a dated Debian snapshot and pass
# SOURCE_DATE_EPOCH. A rolling public mirror is not reproducible.
WithNetwork=yes
# Runtime artifacts are consumed as staged, signed packages. Build sources also
# provide the reviewed brand asset and sibling privileged-control package.
BuildSources=../..
Environment=ELIZAOS_BUILD_MODE=development
Environment=ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY
Environment=ELIZAOS_DESKTOP_SIGNING_PUBLIC_KEY_SPKI_SHA256

[Validation]
# Release signing keys never live in this tree. Developer images are unsigned;
# release promotion must supply keys and verify the resulting boot chain.
SecureBoot=no
# mkosi owns the checksum contract; scripts must not hash outputs before they
# exist.
Checksum=yes
