# elizaOS Linux — riscv64 UEFI overlay.
#
# Debian does not ship a signed shim chain for riscv64. Release metadata must
# record that exception rather than silently claiming Secure Boot parity.

[Match]
Architecture=riscv64

[Content]
KernelCommandLine=console=tty0 console=ttyS0,115200n8
Packages=
    linux-image-riscv64
    grub-efi-riscv64
    grub-efi-riscv64-bin
