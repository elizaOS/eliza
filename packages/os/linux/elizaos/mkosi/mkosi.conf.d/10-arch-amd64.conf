# elizaOS Linux — mkosi amd64 overlay.
# Mirrors ../config/package-lists/elizaos-amd64.list.chroot.

[Match]
Architecture=x86-64

[Content]
BiosBootloader=grub
ShimBootloader=signed
KernelCommandLine=console=tty0 console=ttyS0,115200n8
Packages=
    linux-image-amd64
    grub-efi-amd64-bin
    grub-efi-amd64-signed
    grub-pc-bin
    shim-signed
    intel-microcode
    amd64-microcode
