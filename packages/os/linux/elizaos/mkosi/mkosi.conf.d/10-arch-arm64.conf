# elizaOS Linux — mkosi arm64 overlay.
# Mirrors ../config/package-lists/elizaos-arm64.list.chroot.

[Match]
Architecture=arm64

[Content]
ShimBootloader=signed
KernelCommandLine=console=tty0 console=ttyAMA0,115200n8
Packages=
    linux-image-arm64
    grub-efi-arm64-bin
    grub-efi-arm64-signed
    shim-signed
