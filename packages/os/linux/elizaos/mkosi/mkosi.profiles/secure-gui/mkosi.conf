# Compatibility alias for a hardened GNOME image. GNOME comes from the base
# image, so this is deliberately the same hardening set as `secure`.

[Output]
ImageId=elizaos-linux-%a-secure-gui

[Content]
Packages=
    apparmor
    apparmor-utils
    apparmor-profiles
    apparmor-profiles-extra
    nftables
    unattended-upgrades
    usbguard
