# elizaOS Linux — mkosi arm64 overlay.

[Match]
Architecture=arm64

[Content]
ShimBootloader=signed
KernelCommandLine=console=tty0 console=ttyAMA0,115200n8 systemd.show_status=yes systemd.log_target=kmsg
Packages=
    linux-image-arm64
    grub-efi-arm64-bin
    grub-efi-arm64-signed
    shim-signed
