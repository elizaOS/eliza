# -----------------------------------------------------------------------------
# Required secrets — set via `wrangler secret put KEY` (or run
# packages/cloud/scripts/admin/cf-secrets-migrate.mjs which iterates a .env file).
#
# CANONICAL LIST (cross-reference cloud/packages/apps/api/MIGRATION_NOTES.md once Agent B
# publishes it; if names diverge, Agent B's c.env.X usage wins — update this
# file and leave a note in cloud/INFRA.md).
#
#   DATABASE_URL                       Railway Postgres (Worker reaches it via the HYPERDRIVE binding;
#       DATABASE_URL is the origin string for the sidecar/scripts — public-proxy DSNs need
#       ?sslmode=no-verify or DATABASE_SSL_NO_VERIFY=true for direct node-pg consumers)
#   REDIS_URL                          Railway TCP Redis for non-Worker consumers (rediss://...)
#   STEWARD_API_URL                    Optional Steward base URL override;
#       defaults to NEXT_PUBLIC_STEWARD_API_URL or NEXT_PUBLIC_API_URL + /steward
#   STEWARD_JWT_SECRET                 Canonical HS256 secret for Steward JWT verify (jose); MUST match Steward host
#   STEWARD_SESSION_SECRET             Deprecated compatibility alias for STEWARD_JWT_SECRET
#   REMOTE_PAIRING_HMAC_SECRET          Dedicated 32+ byte HMAC key for short-lived remote pairing verifiers
#   STORAGE_READ_SIGNING_SECRETS        Comma-separated 32+ byte capability HMAC keys; first signs, all verify
#   STEWARD_MASTER_PASSWORD            Steward vault encryption master password; required for wallet/key ops
#   STEWARD_TENANT_ID                  Default tenant scope; verifier rejects other tenants
#   STEWARD_DEFAULT_TENANT_ID          Embedded Steward default tenant id (optional; defaults to elizacloud)
#   STEWARD_DEFAULT_TENANT_KEY         Embedded Steward default tenant API key hash/source
#   STEWARD_PLATFORM_KEYS              Server-only platform key (server-wallets, tenant ops)
#   STEWARD_TENANT_API_KEY             Server-only tenant API key
#   STEWARD_REQUEST_SIGNING_SECRET     HMAC secret for signed Steward mutating requests
#   STEWARD_REQUEST_SIGNING_SECRETS    Comma-separated Steward HMAC secrets; first is used for signing
#   STEWARD_REQUEST_SIGNING_KEY_ID     Optional Steward tenant signing-key id
#   STAGING_SESSION_EXCHANGE_ENABLED   Staging-only QA session bridge kill switch
#   STAGING_SESSION_EXCHANGE_VERSION   Exact bridge/runtime contract version (v1)
#   STAGING_SESSION_EXCHANGE_SIGNING_SECRET
#                                      Dedicated QA-token HS256 key (never a Steward key)
#   STAGING_SESSION_EXCHANGE_SIGNING_KEY_ID
#                                      Dedicated protected-header kid (staging-qa-v1-*)
#   STAGING_SESSION_EXCHANGE_ALLOWED_API_KEY_IDS
#                                      Exact allowlisted source API-key UUIDs
#   STAGING_SESSION_EXCHANGE_ALLOWED_USER_IDS
#                                      Exact allowlisted Cloud user UUIDs
#   STAGING_SESSION_EXCHANGE_ALLOWED_ORGANIZATION_IDS
#                                      Exact allowlisted Cloud organization UUIDs
#   STRIPE_SECRET_KEY                  Stripe billing
#   STRIPE_WEBHOOK_SECRET              Stripe webhook signing (main billing endpoint)
#   STRIPE_CONNECT_WEBHOOK_SECRET      Stripe Connect endpoint webhook signing (payouts; distinct secret — the Connect payout webhook fail-closes without it)
#   STRIPE_SMALL_PACK_PRICE_ID         (and MEDIUM/LARGE *_PRICE_ID/_PRODUCT_ID)
#   STRIPE_PLUS_MONTHLY_PRICE_ID       Approved recurring Plus Price binding
#   STRIPE_PLUS_PRODUCT_ID             Approved Plus Product binding
#   STRIPE_PRO_MONTHLY_PRICE_ID        Approved recurring Pro Price binding
#   STRIPE_PRO_PRODUCT_ID              Approved Pro Product binding
#   OXAPAY_MERCHANT_API_KEY            OxaPay crypto checkout + webhook verification
#   OXAPAY_WEBHOOK_IPS                 Optional OxaPay webhook source IP allowlist
#   OXAPAY_PAYMENT_REQUESTS_CALLBACK_URL Payment-request settlement callback override
#   KV_REST_API_URL                    Environment-local redis-rest adapter URL for Worker direct consumers
#   KV_REST_API_TOKEN                  redis-rest bearer token
#   KV_REST_API_READ_ONLY_TOKEN        Optional read-only token for compatible hosted Redis REST providers
#   OPENROUTER_API_KEY                 OpenRouter BYOK key (backup for non-native models)
#   ANTHROPIC_API_KEY                  Claude
#   OPENAI_API_KEY                     OpenAI direct
#   GROQ_API_KEY                       Groq
#   CEREBRAS_API_KEY                   Cerebras — ultra-fast inference for provisioning chat agent
#   FAL_KEY                            Fal.ai video gen
#   FAL_API_KEY                        Alias for FAL_KEY used by image/video/music generation
#   ATLASCLOUD_API_KEY                 AtlasCloud image and fallback video generation billing key
#   ATLASCLOUD_BASE_URL                Optional AtlasCloud API base URL override
#   BIRDEYE_API_KEY                    Birdeye defi/price proxy key
#   ELEVENLABS_API_KEY                 ElevenLabs TTS
#   VOICE_STT_MAX_MULTIPART_BYTES      Optional STT multipart body cap in bytes
#                                      (default 25 MiB, invalid values fail closed)
#   HF_TOKEN                           HuggingFace token for the /api/v1/hf-proxy/* route
#       (gated eliza-1 bundle downloads; clients never hold an HF key)
#   VAST_API_KEY                       Vast.ai Serverless endpoint API token (Bearer)
#   VAST_BASE_URL                      Vast.ai Serverless endpoint URL (e.g.
#       https://run.vast.ai/route/abc123). Provider strips trailing slash and
#       appends /v1/chat/completions. Set both VAST_* secrets together — both
#       are required to enable the vast/* model family.
#   SENDGRID_API_KEY                   (or RESEND_API_KEY) — outbound mail
#   AWS_KMS_KEY_ID / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  KMS-only;
#       used by packages/lib/services/secrets/encryption.ts when AWS_KMS_KEY_ID
#       is set. Optional — LocalKMSProvider is the default. Container backend
#       has moved off AWS (see CONTAINERS_MIGRATION.md), so the rest of the
#       AWS_* / ECS_* / ACM_* secrets are gone.
#   GITHUB_APP_TOKEN  (or GIT_ACCESS_TOKEN)
#   CRON_SECRET                        Scheduled-job auth
#   CONTAINER_CONTROL_PLANE_URL        Node sidecar URL for container mutations + hot-pool image pre-pull
#   CONTAINER_CONTROL_PLANE_TOKEN      Shared Worker↔sidecar secret
#   HCLOUD_TOKEN                       Hetzner Cloud API token for elastic Docker node provisioning
#   CONTAINERS_AUTOSCALE_PUBLIC_SSH_KEY Public SSH key written to autoscaled nodes
#   CONTAINERS_BOOTSTRAP_CALLBACK_URL  Optional docker_nodes self-registration callback URL
#   CONTAINERS_BOOTSTRAP_SECRET        Optional docker_nodes self-registration shared secret
#   CDP_API_KEY_ID / CDP_API_KEY_SECRET / CDP_WALLET_SECRET   x402
#   DISCORD_BOT_TOKEN / DISCORD_CHANNEL_ID
#   GATEWAY_BOOTSTRAP_SECRET / GATEWAY_INTERNAL_SECRET
#   ELIZA_APP_WEBHOOK_GATEWAY_URL       Internal gateway-webhook service URL (Railway).
#                                      Required for staging+prod webhook flows; without
#                                      it, webhook routes 503 WEBHOOK_GATEWAY_NOT_CONFIGURED.
#   ELIZA_APP_WEBHOOK_GATEWAY_SECRET    Shared secret for BFF→gateway forwarding (L3).
#   JWT_SIGNING_PRIVATE_KEY / JWT_SIGNING_PUBLIC_KEY
#   OIDC_SIGNING_JWKS                  OIDC provider key ring: JSON array of PRIVATE JWKs
#                                      (element 0 signs, all published at jwks_uri).
#                                      Generate with packages/cloud/scripts/admin/generate-oidc-keys.ts.
#   OIDC_CLIENTS                       OIDC relying-party registry: JSON array; client
#                                      secrets stored as sha256 hex only.
#                                      OIDC_SIGNING_JWKS and OIDC_CLIENTS are
#                                      SECRETS on purpose: losing either makes
#                                      SSO fail closed instead of serving an
#                                      empty registry.
#   OIDC_REDIRECT_URI_ALIASES          Public JSON object of client_id to additive
#                                      exact HTTPS callbacks. It cannot create a
#                                      client or change any protected registration.
#                                      OIDC_ENABLED / OIDC_ISSUER_URL are
#                                      committed [vars] below for the same reason inverted:
#                                      losing them must not silently change the issuer.
#                                      OIDC_WALLET_EMAIL_DOMAIN is a var for that same
#                                      reason and is normally UNSET: it defaults to
#                                      users.noreply.<issuer hostname>, and an override is
#                                      accepted only as a strict subdomain of that hostname
#                                      (the rule that makes the domain unregisterable by a
#                                      user). Set but invalid fails the provider closed.
#   COINGECKO_API_KEY / BRAVE_SEARCH_API_KEY
#   TWITTER_BEARER_TOKEN / X_API_KEY / X_API_KEY_SECRET
#   X402_RECIPIENT_ADDRESS / PINATA_JWT
#   EVM_PAYOUT_PRIVATE_KEY / SOLANA_PAYOUT_PRIVATE_KEY
#   SECRETS_MASTER_KEY                 Field encryption master key
#   MICROSOFT_CLIENT_ID / MICROSOFT_CLIENT_SECRET
#   ELIZA_APP_DISCORD_BOT_TOKEN / ELIZA_APP_DISCORD_CLIENT_SECRET
#   ELIZA_APP_WHATSAPP_ACCESS_TOKEN / _APP_SECRET / _VERIFY_TOKEN
#   NEON_API_KEY                       RETIRED — provisioning moved to Railway; no longer used
#   CONTAINERS_SSH_KEY / AGENT_SSH_KEY Docker provider SSH private key for the Node sidecar
#   HEADSCALE_API_KEY / HEADSCALE_INTERNAL_TOKEN
#   TUNNEL_HOSTNAME_SIGNING_SECRET     Shared HMAC secret with tunnel-proxy
#   ELIZA_APNS_KEY                     Apple APNs provider .p8 key contents
#   ELIZA_APNS_KEY_ID                  Apple APNs provider key id
#   ELIZA_APNS_TEAM_ID                 Apple Developer team id
#   ELIZA_APNS_TOPIC                   Signed iOS bundle id (ai.elizaos.app)
#   ELIZA_APNS_PRODUCTION              Explicit host selector: 0 sandbox, 1 production
#   AGENT_SERVER_SHARED_SECRET / WAIFU_SERVICE_KEY
#   WAIFU_BRIDGE_ORG_ID                Required owner org for waifu bridge user provisioning
# -----------------------------------------------------------------------------

# =============================================================================
# Environments
# =============================================================================

[env.staging]
name = "eliza-cloud-api-staging"
workers_dev = false

# Smart Placement soak (#15513): run this Worker near the origins it fetches
# (api.cerebras.ai / api.openai.com) instead of near the caller — the measured
# Worker->origin hop is ~500ms of every inference call's TTFT. Staging-only
# until the before/after ttfb comparison on api-staging holds; production
# follows in its own change.
placement = { mode = "smart" }
routes = [
  # Canonical browser hosts belong to the eliza-app Pages project. Pages
  # Functions proxy /api and auth protocol paths to this Worker.
  { pattern = "api-staging.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "*.cloud-staging.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "blob-staging.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "plugins-staging.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "relay-staging.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "x402-staging.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "*.sites-staging.eliza.app/*", zone_name = "eliza.app" },
  # Legacy names remain routed only so this Worker can issue deterministic 308s
  # while clients, bookmarks, and webhooks transition to the canonical zone.
  { pattern = "staging.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "app-staging.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "api-staging.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "*.staging.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "*.tunnel-staging.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "*.sites-staging.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "blob-staging.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "plugins.staging.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "relay-staging.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "x402-staging.elizacloud.ai/*", zone_name = "elizacloud.ai" },
]

[env.staging.define]
__dirname = '"/"'
__filename = '"/worker.js"'

[env.staging.browser]
binding = "BROWSER"

[env.staging.vars]
NODE_ENV = "production"
# Signed Twilio callbacks and media-stream URLs must use the externally routed
# HTTPS origin, never a request-derived host. Keep this committed so any
# Wrangler deployment preserves inbound voice instead of failing closed.
TWILIO_PUBLIC_URL = "https://api-staging.eliza.app"
# Capture every staging turn while validating voice and cross-channel routing.
# Rows remain compact and exclude prompt/response text.
SHARED_TURN_TRACES_ENABLED = "true"
SHARED_TURN_TRACES_SAMPLE = "1"
# Keep every environment on the indexed canonical resolver until every
# identity/lifecycle writer participates in the durable mutation-fence protocol.
# The bound Durable Object remains available for exact-head isolated proof.
PERSONAL_DELIVERY_PROJECTION_READ_ENABLED = "false"
# Temporary Worker-first compatibility fence: this must deploy atomically with
# delivery epoch 2 before the legacy staging Gateway is replaced. Remove it only
# after the epoch-2 Gateway is live, legacy warnings are zero, and the drain and
# reconciliation checks in the PR rollout evidence have passed.
PERSONAL_TELEGRAM_DELIVERY_EPOCH1_COMPAT_ENABLED = "true"
# The protected staging cutover owns PERSONAL_SHARED_TELEGRAM_EDGE_CUTOVER_ENABLED
# as a secret binding. It uses a fresh name because keep_vars preserved the old
# staging plaintext binding; either binding must be exactly true to opt in.
# Emit per-turn inference spans at info for the staging latency matrix without
# changing production log volume or recording prompt content.
ELIZA_INFERENCE_TIMING = "info"
# Self-hosted TEI embeddings sidecar (packages/cloud/services/embeddings,
# bge-small-en-v1.5, 384 dims). The sidecar requires a bearer credential —
# LOCAL_EMBEDDINGS_API_KEY is published as a Worker secret by cloud-cf-release
# and must never appear in a [vars] block.
LOCAL_EMBEDDINGS_BASE_URL = "https://embeddings-staging-staging.up.railway.app"
# Parity wave 2 (staging-only prove-out): durable tenant memory rows for every
# Shared turn, plus flag-gated semantic recall over them via the sidecar.
# Reversible: delete both lines to return to byte-identical pre-parity turns.
SHARED_MEMORY_TABLES_ENABLED = "true"
SHARED_RECALL_ENABLED = "true"
# Apps (Product 2): wire the real deploy trigger so POST /api/v1/apps/:id/deploy
# enqueues an APP_DEPLOY job the provisioning-worker daemon runs (instead of the
# legacy status-only stub). Staging only — the apps data plane (tenant DB +
# Caddy app node + armed daemon) is live on staging. Gates configureAppsDeployTrigger
# in bootstrap-app.ts; no effect on Product-1 / agent paths.
APPS_DEPLOY_ENABLED = "1"
NEXT_PUBLIC_APP_URL = "https://cloud-staging.eliza.app"
NEXT_PUBLIC_API_URL = "https://api-staging.eliza.app"
ELIZA_CLOUD_URL = "https://api-staging.eliza.app"
ELIZA_FRONTEND_HOST_SUFFIX = "sites-staging.eliza.app"
# OpenID Connect provider (Eliza Cloud as the OP for Eliza Hub). Committed vars,
# not secrets: the issuer string is byte-compared by every relying party, so it
# must survive a redeploy that wipes secrets rather than silently disappear.
# OIDC_ENABLED is the kill switch; the provider serves nothing until it is "true".
# The issuer MUST be a bare origin on a host this Worker is routed for (see
# `routes` above) — the apex elizacloud.ai is the SPA and never reaches the
# Worker, and a path on the issuer is refused because every endpoint is served
# from the host root. The console SPA must be built with the same string as
# VITE_OIDC_ISSUER_URL or signed-out relying-party logins cannot resume; the
# `build:web` env blocks in .github/workflows/cloud-cf-deploy.yml carry it, and
# `packages/cloud/shared/src/lib/oidc/config.test.ts` fails if the two drift.
OIDC_ENABLED = "true"
OIDC_ISSUER_URL = "https://api-staging.eliza.app"
# Per-tenant `magicLinkBaseUrl` (set in Steward Neon `tenant_configs.email_config`)
# redirects email magic-link callbacks to staging.elizacloud.ai instead of the
# prod fallback (www.elizacloud.ai). Tenant row provisioned manually.
STEWARD_TENANT_ID = "elizacloud-staging"
NEXT_PUBLIC_STEWARD_TENANT_ID = "elizacloud-staging"
# Staging agents live at <id>.staging.elizacloud.ai (mirrors prod's
# <id>.elizacloud.ai), served by the *.staging.elizacloud.ai/* route above.
# Was "elizacloud.ai", which minted staging agent URLs on the PROD wildcard so
# the prod worker (which has no staging agents) served CORS-less 404s (#15205).
ELIZA_CLOUD_AGENT_BASE_DOMAIN = "cloud-staging.eliza.app"
# Routes agent-subdomain traffic to the staging control-plane VM. Without this
# the Worker falls back to DEFAULT_AGENT_ROUTER_ORIGIN_HOST in
# packages/cloud/api/src/index.ts (= eliza-production-1.elizacloud.ai) so
# staging agent requests would silently hit the prod CP.
AGENT_ROUTER_ORIGIN_HOST = "eliza-staging-1.eliza.app"
WAIFU_SERVICE_ORG_ID = "d96d3fc8-cc07-40be-b81c-ba7a7b4e8028"
WAIFU_SERVICE_USER_ID = "90101225-836f-4fa7-a69c-f70691dcf256"
ELIZA_APP_URL = "https://cloud-staging.eliza.app"
# Shared reminder cron dispatches Discord occurrences to the stateful gateway;
# keep the public destination committed so a Worker redeploy cannot remove it.
ELIZA_APP_DISCORD_WEBHOOK_HANDLER_URL = "https://gateway-discord-staging-staging.up.railway.app"
# Onboarding and billing links land in the hosted agent application's in-app
# Cloud view. This host is distinct from staging.eliza.app, which owns the
# public homepage and login entrypoint.
ELIZA_ONBOARDING_APP_URL = "https://cloud-staging.eliza.app"
# Canonical login and OIDC continuation origin. Onboarding itself uses the
# hosted app URL above; authentication remains owned by staging.eliza.app.
# The staging homepage is part of the host-aware eliza-app Pages artifact at
# https://staging.eliza.app and proxies to https://api-staging.eliza.app, so staging
# continuation tokens land on a bundle that redeems them against the STAGING
# API. Before that this had to stay unpinned (prod-only homepage would freeze
# staging tokens into a prod redemption endpoint - #18197); the interim live
# value was an out-of-band wrangler secret pointing at the same host, which
# this committed var replaces so a plain redeploy cannot silently regress the
# CTA to the code default (https://eliza.app = prod).
# The canonical Worker deploy removes the two legacy out-of-band secret
# bindings immediately before deployment and restores their staging value if
# that deployment fails. The committed var is the steady-state authority.
ELIZA_ONBOARDING_LOGIN_APP_URL = "https://staging.eliza.app"
# Mobile app auth is gated explicitly and bound to a fixed registered app
# identity. The protected deployment workflow verifies both before publishing.
ELIZA_MOBILE_APP_AUTH_ENABLED = "true"
ELIZA_MOBILE_APP_AUTH_APP_ID = "689a1597-85e7-43ca-b000-8c6392d79465"
NEXT_PUBLIC_NETWORK = "base"
NEXT_PUBLIC_SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
GITHUB_ORG_NAME = "eliza-cloud-apps"
GITHUB_TEMPLATE_REPO = "eliza-cloud-apps/cloud-apps-template"
ENVIRONMENT = "staging"
# Staging canary. Set false for an immediate rollback to the full app router.
THIN_INFERENCE_ENTRY_ENABLED = "true"
DATABASE_REGION = "na"
PAYOUT_TESTNET = "true"
# Warm-pool claim half (#16961). Staging enablement is the next step of that
# issue's dependency chain but is sequenced behind draining the residual
# sentinel-org pool rows; flip this committed value when that drain is done.
WARM_POOL_ENABLED = "false"
X402_NETWORK = "base"
X402_NETWORKS = "ethereum,sepolia,base-sepolia,base,bsc,bsc-testnet,solana-devnet,solana"
X402_ETHEREUM_RPC_URL = "https://ethereum-rpc.publicnode.com"
X402_BASE_RPC_URL = "https://base-rpc.publicnode.com"
X402_BSC_RPC_URL = "https://bsc-dataseed.binance.org"
CRYPTO_DIRECT_BASE_RECEIVE_ADDRESS = "0x72D043586b6226A97197408b4EE41572dD000ac6"
CRYPTO_DIRECT_BASE_SECURE_ADDRESS = "0x0551323d0631441EAAE1B5dB114dD3B50250e333"
CRYPTO_DIRECT_BASE_RPC_URL = "https://base-rpc.publicnode.com"
CRYPTO_DIRECT_BASE_TOKEN_ADDRESS = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
CRYPTO_DIRECT_BASE_TOKEN_DECIMALS = "6"
CRYPTO_DIRECT_BSC_RECEIVE_ADDRESS = "0x93cacDACDf6791be31EA44742CA94db238C887EB"
CRYPTO_DIRECT_BSC_SECURE_ADDRESS = "0x50Bd301C351AeF49aa01f5F4E069C9f398f6597b"
CRYPTO_DIRECT_BSC_RPC_URL = "https://bsc-dataseed.binance.org"
CRYPTO_DIRECT_BSC_TOKEN_ADDRESS = "0x55d398326f99059fF775485246999027B3197955"
CRYPTO_DIRECT_BSC_TOKEN_DECIMALS = "18"
CRYPTO_DIRECT_SOLANA_RECEIVE_ADDRESS = "D9KjXwECD1nqDQA1ektXjen1PAMcDnYKPmEGU9oZctzX"
CRYPTO_DIRECT_SOLANA_SECURE_ADDRESS = "97oFR38EpWEaLuKc13AnyL6GrqBZTBCVCh9rAHAXWgad"
CRYPTO_DIRECT_SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
CRYPTO_DIRECT_SOLANA_TOKEN_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
CRYPTO_DIRECT_SOLANA_TOKEN_DECIMALS = "6"
CACHE_ENABLED = "true"
# CacheClient prefers CACHE_KV in Workerd.
CACHE_BACKEND = "auto"
# Auth nonces, rate limits, and other direct Redis consumers use the same Redis
# through its HTTP proxy; raw Railway TCP from Workerd is not reliable.
DIRECT_REDIS_BACKEND = "redis-rest"
REDIS_RATE_LIMITING = "true"
# Enables post-provider billing for cache-only Worker admission. Worker cache
# misses warm and retry instead of joining an authoritative database fallback.
# SAFE_BALANCE_THRESHOLD remains a non-Worker compatibility control; exact
# Durable Object admission does not impose a minimum account-balance floor.
INFERENCE_OPTIMISTIC_BILLING = "true"
SAFE_BALANCE_THRESHOLD = "5.00"
# Compatibility selector for non-Worker admission and legacy sweep support.
# Worker inference uses a Durable Object lease as its pre-dispatch WAL.
INFERENCE_BILLING_LEDGER = "db"
# Required for the Worker cache-only path. The only pre-provider write is the
# per-organization Durable Object lease; Postgres accounting starts afterward.
INFERENCE_DEFERRED_ADMISSION = "true"
# Enables local decision memos in front of shared revisioned caches. Exact
# organization rate and spend decisions remain in the Durable Object.
INFERENCE_HOT_PATH_CACHES = "true"
# One combined auth+org+moderation read; authoritative refresh runs only under
# waitUntil and the 60s physical TTL bounds lost invalidation.
INFERENCE_AUTH_CACHE_ENABLED = "true"
# Default authoritative until the Durable Object revocation lane is soaked.
INFERENCE_STRONG_REVOCATION_ENABLED = "false"
# Pass-through streaming fast path (#15428): "true" pipes qualifying streamed
# chat completions (OpenAI-compatible direct upstream, no tools/response_format/
# web-search) byte-for-byte from the provider instead of decoding/re-encoding
# through the AI SDK; usage is metered from a teed branch and billed through
# the existing settle chain. Default off; rollback = flip off.
INFERENCE_PASSTHROUGH_STREAMING = "true"

# Sibling flag for the non-streaming embeddings pipe (#15512): "true" forwards
# qualifying embeddings requests (direct-OpenAI source) verbatim and returns
# the upstream JSON untouched; usage parses from the same buffer and bills
# through the identical settle chain. Default off; rollback = flip off.
INFERENCE_PASSTHROUGH_EMBEDDINGS = "true"

# Realtime voice is enabled on staging (proven live E2E 2026-07-22, EOT->first-audio
# median ~1446ms). The live staging worker already runs true; this keeps the toml in
# sync so a redeploy from develop does not silently flip realtime OFF. Production
# remains explicitly off (flag flip there is a separate, gated decision).
VOICE_REALTIME_WS_ENABLED = "true"
VOICE_REALTIME_CARTESIA_VOICE_ID = "db6b0ed5-d5d3-463d-ae85-518a07d3c2b4"
VOICE_REALTIME_ELIZA_ENDPOINT = "https://api-staging.eliza.app"
VOICE_REALTIME_ELIZA_MODEL = "gemma-4-31b"
