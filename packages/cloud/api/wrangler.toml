# credentials exist; the committed default remains safe for local deploys.
ELIZA_TTS_FISH_ENABLED = "false"
FISH_AUDIO_DATA_GOVERNANCE_APPROVED = "false"

FORCE_REDIS_EVENTS = "false"
R2_PUBLIC_HOST = "blob-staging.eliza.app"
SQL_HEAVY_PAYLOAD_STORAGE = "r2"
SQL_HEAVY_PAYLOAD_MIN_BYTES = "0"
SQL_HEAVY_PAYLOAD_INLINE_PREVIEW_BYTES = "512"
LLM_TRAJECTORY_STORAGE = "r2"
HEADSCALE_PUBLIC_URL = "https://headscale-staging.eliza.app"
HEADSCALE_API_URL = "https://headscale-staging.eliza.app"
HEADSCALE_USER = "tunnel"
TUNNEL_PROXY_HOST = "tunnel-staging.eliza.app"
TUNNEL_TAILNET_DOMAIN = "tunnel.staging.eliza.local"
TUNNEL_AUTH_KEY_COST_USD = "0.01"

# Cloudflare Workers does NOT inherit top-level r2_buckets into environment
# blocks — they must be re-declared per-env. Same physical resources.
[[env.staging.r2_buckets]]
binding = "BLOB"
bucket_name = "eliza-cloud-blob-staging"

# Hyperdrive proxies the Worker's Postgres connection to Railway (workerd can't
# reliably open a direct node-pg TCP/TLS connection to an external Postgres).
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
