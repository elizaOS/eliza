[env.production]
name = "eliza-cloud-api-prod"

# Smart Placement (#15513, prod leg): staging soak showed mode=smart applied
# cleanly but staging traffic is too thin for Cloudflare's placement analyzer
# to ever qualify it — prod volume is what it learns from. Fail-safe by
# design: CF only moves execution when its analysis concludes it improves
# performance (back-end-heavy requests to api.cerebras.ai / api.openai.com /
# Hyperdrive); otherwise requests keep default placement. Rollback = delete
# this line + redeploy.
placement = { mode = "smart" }
workers_dev = false
# Canonical routes serve the API and UUID agents. The cloud.eliza.app browser
# host belongs to Pages; legacy routes remain redirect ingress during the
# elizacloud.ai retirement window.
routes = [
  { pattern = "api.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "x402.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "blob.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "plugins.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "relay.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "*.cloud.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "*.sites.eliza.app/*", zone_name = "eliza.app" },
  { pattern = "*.tunnel.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "*.sites.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "app.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "api.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "relay.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  # The retired docs Worker is replaced by this exact route so every old docs
  # URL receives the same deterministic redirect to https://eliza.app.
  { pattern = "docs.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "x402.elizacloud.ai/*", zone_name = "elizacloud.ai" },
  { pattern = "*.elizacloud.ai/*", zone_name = "elizacloud.ai" },
]

[env.production.define]
__dirname = '"/"'
__filename = '"/worker.js"'

[env.production.browser]
binding = "BROWSER"

[env.production.vars]
NODE_ENV = "production"
# Signed Twilio callbacks and media-stream URLs must use the externally routed
# HTTPS origin, never a request-derived host. Keep this committed so any
# Wrangler deployment preserves inbound voice instead of failing closed.
TWILIO_PUBLIC_URL = "https://api.eliza.app"
SHARED_TURN_TRACES_ENABLED = "true"
SHARED_TURN_TRACES_SAMPLE = "0.1"
# Keep production on the indexed canonical resolver. The Durable Object cannot
# be activated until every identity/lifecycle/cutover writer participates in
# the durable mutation-fence protocol and adversarial staging proof is complete.
PERSONAL_DELIVERY_PROJECTION_READ_ENABLED = "false"
PERSONAL_SHARED_TELEGRAM_EDGE_ENABLED = "false"
# The protected production cutover owns
# PERSONAL_SHARED_TELEGRAM_EDGE_CUTOVER_PRODUCTION_ENABLED as a secret binding.
# The name is fresh (never bound in production, so no plaintext collision) and
# environment-pinned: the helper honors it only when ENVIRONMENT is production,
# and it must be exactly true to opt in.
THIN_INFERENCE_ENTRY_ENABLED = "true"
# Apps deploy (Product 2): arms the Worker-side deploy trigger (configureAppsDeployTrigger,
# bootstrap-app.ts) so POST /api/v1/apps/:id/deploy enqueues a real APP_DEPLOY job instead of
# the no-op stub. Mirrors [env.staging.vars]. CUTOVER GATE — only effective once the prod
# daemon is armed (arm-apps-daemon.yml -f environment=production, sets APPS_DEPLOY_ENABLED via
# #8422) AND the prod apps data plane exists (terraform). Do NOT merge develop→main until
# staging QA is green and the prod data plane is applied. Production deploys are ALSO refined by
# the route-level org allowlist (apps-deploy-gate.ts): without APPS_DEPLOY_ALLOWED_ORG_IDS the
# deploy POST fails closed with 403 even when this flag is "1".
APPS_DEPLOY_ENABLED = "1"
# Org allowlist for apps-deploy (apps-deploy-gate.ts). "*" = open to ALL orgs —
# the launch posture so any user can deploy an app. Set here as a COMMITTED var,
# NOT a Cloudflare secret: secrets get wiped on Worker redeploys, which already
# silently re-closed apps-deploy in prod once. Requires the "*" wildcard support
# in apps-deploy-gate.ts (#9735). To pilot a narrower cohort instead, replace "*"
# with comma/space-separated org UUIDs.
APPS_DEPLOY_ALLOWED_ORG_IDS = "*"
NEXT_PUBLIC_APP_URL = "https://cloud.eliza.app"
NEXT_PUBLIC_API_URL = "https://api.eliza.app"
ELIZA_CLOUD_URL = "https://api.eliza.app"
ELIZA_MOBILE_APP_AUTH_ENABLED = "true"
ELIZA_CLOUD_AGENT_BASE_DOMAIN = "cloud.eliza.app"
ELIZA_FRONTEND_HOST_SUFFIX = "sites.eliza.app"
# OpenID Connect provider — see the staging block for why these are vars, not
# secrets. Flip OIDC_ENABLED to "true" only after OIDC_SIGNING_JWKS and
# OIDC_CLIENTS are pushed; changing OIDC_ISSUER_URL afterwards invalidates every
# relying-party account link.
OIDC_ENABLED = "true"
OIDC_ISSUER_URL = "https://api.eliza.app"
OIDC_REDIRECT_URI_ALIASES = '{"elizahub":["https://git.slop.cash/user/oauth2/elizacloud/callback"]}'
# Pin the prod Steward tenant explicitly instead of leaning on the implicit
# DEFAULT_STEWARD_TENANT_ID ("elizacloud") in steward-tenant-config.ts. That
# implicit fallback is what the prod magic-link bug hinged on — make it explicit
# so prod tenant scope can't silently shift if the code default ever changes.
STEWARD_TENANT_ID = "elizacloud"
NEXT_PUBLIC_STEWARD_TENANT_ID = "elizacloud"
AGENT_ROUTER_ORIGIN_HOST = "eliza-production-1.eliza.app"
WAIFU_SERVICE_ORG_ID = "d96d3fc8-cc07-40be-b81c-ba7a7b4e8028"
WAIFU_SERVICE_USER_ID = "90101225-836f-4fa7-a69c-f70691dcf256"
ELIZA_APP_URL = "https://cloud.eliza.app"
ELIZA_APP_DISCORD_WEBHOOK_HANDLER_URL = "https://gateway-discord-production.up.railway.app"
ELIZA_ONBOARDING_APP_URL = "https://cloud.eliza.app"
ELIZA_ONBOARDING_LOGIN_APP_URL = "https://eliza.app"
NEXT_PUBLIC_NETWORK = "base"
NEXT_PUBLIC_SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
GITHUB_ORG_NAME = "eliza-cloud-apps"
GITHUB_TEMPLATE_REPO = "eliza-cloud-apps/cloud-apps-template"
ENVIRONMENT = "production"
DATABASE_REGION = "na"
PAYOUT_TESTNET = "false"
# Warm-pool claim half (#16961): the provision route only claims a pre-booted
# sandbox when this is "true". Committed here — never a dashboard-only secret —
# so the intended state survives every redeploy and is auditable in source.
# Production activation is gated on the #16961 checklist (capacity, starvation,
# identity, and health guards with staging soak evidence); flip this committed
# value in the same PR that attaches that evidence.
WARM_POOL_ENABLED = "false"
X402_NETWORK = "base"
X402_NETWORKS = "ethereum,sepolia,base-sepolia,base,bsc,bsc-testnet,solana-devnet,solana"
X402_ETHEREUM_RPC_URL = "https://ethereum-rpc.publicnode.com"
X402_BASE_RPC_URL = "https://base-rpc.publicnode.com"
X402_BSC_RPC_URL = "https://bsc-dataseed.binance.org"
CRYPTO_DIRECT_BASE_RECEIVE_ADDRESS = "0x72D043586b6226A97197408b4EE41572dD000ac6"
CRYPTO_DIRECT_BASE_SECURE_ADDRESS = "0x0551323d0631441EAAE1B5dB114dD3B50250e333"
CRYPTO_DIRECT_BASE_RPC_URL = "https://base-rpc.publicnode.com"
CRYPTO_DIRECT_BASE_TOKEN_ADDRESS = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
CRYPTO_DIRECT_BASE_TOKEN_DECIMALS = "6"
CRYPTO_DIRECT_BSC_RECEIVE_ADDRESS = "0x93cacDACDf6791be31EA44742CA94db238C887EB"
CRYPTO_DIRECT_BSC_SECURE_ADDRESS = "0x50Bd301C351AeF49aa01f5F4E069C9f398f6597b"
CRYPTO_DIRECT_BSC_RPC_URL = "https://bsc-dataseed.binance.org"
CRYPTO_DIRECT_BSC_TOKEN_ADDRESS = "0x55d398326f99059fF775485246999027B3197955"
CRYPTO_DIRECT_BSC_TOKEN_DECIMALS = "18"
CRYPTO_DIRECT_SOLANA_RECEIVE_ADDRESS = "D9KjXwECD1nqDQA1ektXjen1PAMcDnYKPmEGU9oZctzX"
CRYPTO_DIRECT_SOLANA_SECURE_ADDRESS = "97oFR38EpWEaLuKc13AnyL6GrqBZTBCVCh9rAHAXWgad"
CRYPTO_DIRECT_SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
CRYPTO_DIRECT_SOLANA_TOKEN_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
CRYPTO_DIRECT_SOLANA_TOKEN_DECIMALS = "6"
CACHE_ENABLED = "true"
# auto: Workers prefer CACHE_KV; non-Worker services use REDIS_URL when set.
# Explicit "redis" / "redis-rest" overrides remain compatibility options.
CACHE_BACKEND = "auto"
# Direct Redis consumers (auth nonces, rate limits, voice replay protection,
# relay state) use the environment-isolated Railway redis-rest proxy. Raw
# Railway TCP is not reliable from production Workers.
DIRECT_REDIS_BACKEND = "redis-rest"
REDIS_RATE_LIMITING = "true"
# Enables post-provider billing for cache-only Worker admission. Worker cache
# misses warm and retry instead of joining an authoritative database fallback.
# SAFE_BALANCE_THRESHOLD remains a non-Worker compatibility control; exact
# Durable Object admission does not impose a minimum account-balance floor.
INFERENCE_OPTIMISTIC_BILLING = "true"
SAFE_BALANCE_THRESHOLD = "5.00"
# Compatibility selector for non-Worker admission and legacy sweep support.
# Worker inference uses a Durable Object lease as its pre-dispatch WAL.
INFERENCE_BILLING_LEDGER = "db"
# Required for the Worker cache-only path. The only pre-provider write is the
# per-organization Durable Object lease; Postgres accounting starts afterward.
INFERENCE_DEFERRED_ADMISSION = "true"
# Enables local decision memos in front of shared revisioned caches. Exact
# organization rate and spend decisions remain in the Durable Object.
INFERENCE_HOT_PATH_CACHES = "true"
# One combined auth+org+moderation read; authoritative refresh runs only under
# waitUntil and the 60s physical TTL bounds lost invalidation.
INFERENCE_AUTH_CACHE_ENABLED = "true"
# Default authoritative until the Durable Object revocation lane is soaked.
INFERENCE_STRONG_REVOCATION_ENABLED = "false"
# Pass-through streaming fast path (#15428): "true" pipes qualifying streamed
# chat completions (OpenAI-compatible direct upstream, no tools/response_format/
# web-search) byte-for-byte from the provider instead of decoding/re-encoding
# through the AI SDK; usage is metered from a teed branch and billed through
# the existing settle chain. Default off; rollback = flip off.
INFERENCE_PASSTHROUGH_STREAMING = "true"

# Sibling flag for the non-streaming embeddings pipe (#15512): "true" forwards
# qualifying embeddings requests (direct-OpenAI source) verbatim and returns
# the upstream JSON untouched; usage parses from the same buffer and bills
# through the identical settle chain. Default off; rollback = flip off.
INFERENCE_PASSTHROUGH_EMBEDDINGS = "true"
# Production voice powers both authenticated app sessions and signed Twilio
# media streams. Keep it explicit so a deploy cannot silently hang up calls.
VOICE_REALTIME_WS_ENABLED = "true"
ELIZA_TTS_FISH_ENABLED = "false"
FISH_AUDIO_DATA_GOVERNANCE_APPROVED = "false"
FORCE_REDIS_EVENTS = "false"
R2_PUBLIC_HOST = "blob.eliza.app"
SQL_HEAVY_PAYLOAD_STORAGE = "r2"
SQL_HEAVY_PAYLOAD_MIN_BYTES = "0"
SQL_HEAVY_PAYLOAD_INLINE_PREVIEW_BYTES = "512"
LLM_TRAJECTORY_STORAGE = "r2"
HEADSCALE_PUBLIC_URL = "https://headscale.eliza.app"
HEADSCALE_API_URL = "https://headscale.eliza.app"
HEADSCALE_USER = "tunnel"
TUNNEL_PROXY_HOST = "tunnel.eliza.app"
TUNNEL_TAILNET_DOMAIN = "tunnel.eliza.local"
TUNNEL_AUTH_KEY_COST_USD = "0.01"

[[env.production.r2_buckets]]
binding = "BLOB"
bucket_name = "eliza-cloud-blob"

# Hyperdrive proxies the Worker's Postgres connection to Railway (workerd can't
# reliably open a direct node-pg TCP/TLS connection to an external Postgres).
# Inert until DATABASE_URL points at Railway (Neon uses the neon-serverless
# WebSocket driver in client.ts, which bypasses this binding).
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "9f59e4ec65f048f7b87e29e7b9c5d728"

# KV is the Worker's cache backend (CacheClient). Workers can't reliably open raw
# TCP to an external Redis (Railway's public proxy hangs under load), so the Worker
# caches auth/api-key/model-catalog in KV instead of Redis.
[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "1dafabf1293d4b6b97f61c5cc22d6fec"

