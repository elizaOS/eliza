# =============================================================================
# eliza-cloud-api — Cloudflare Worker config
# =============================================================================
# This file is committed; secrets live in `wrangler secret put` (push them via
# packages/cloud/scripts/admin/cf-secrets-migrate.mjs).  Anything marked REPLACE_ME must be filled
# in by the operator after running packages/cloud/scripts/admin/cf-bootstrap.sh.
# =============================================================================

name = "eliza-cloud-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "23cf6feaeaa541f6a0675053c33da768"
workers_dev = false
minify = true
# Voice routing/provider values are environment-managed plain-text bindings.
# Preserve those bindings when publishing the committed vars block; without
# this Wrangler deletes them and every configured Twilio line fails closed.
keep_vars = true

# -----------------------------------------------------------------------------
# Bundle-time aliases — swap Node-only / forbidden-top-level-IO modules for
# Workers-friendly stubs. The agent runtime itself runs on the agent-server
# sidecar, NOT on the Worker; the API only needs the schema *types* + *table
# objects* so Drizzle queries against shared tables compile and execute.
# -----------------------------------------------------------------------------
[define]
__dirname = '"/"'
__filename = '"/worker.js"'

[alias]
"@elizaos/plugin-sql" = "./src/stubs/elizaos-plugin-sql.ts"
"@elizaos/plugin-elevenlabs" = "./src/stubs/elizaos-plugin-elevenlabs.ts"
"@elizaos/core/documents" = "./src/stubs/elizaos-core-documents.ts"
"@elizaos/cloud-sdk" = "../sdk/src/index.ts"
"@elizaos/cloud-shared" = "../shared/src/index.ts"
"@elizaos/shared/contracts/cloud-coding-containers" = "../../shared/src/contracts/cloud-coding-containers.ts"
"@elizaos/shared/local-inference/voice-models" = "../../shared/src/local-inference/voice-models.ts"
"@brighter/storage-adapter-s3" = "./src/stubs/brighter-storage-adapter-s3.ts"
# ssh2 is Node-only (.node native binding). Container/agent SSH lives on the
# sidecar (cloud/INFRA.md). Stub at bundle time so the Worker compiles; any
# accidental runtime instantiation throws a clear error.
"ssh2" = "./src/stubs/ssh2.ts"
# undici is Node's fetch impl; references node:net, MessagePort, perf_hooks
# that don't exist on Workers. Re-export runtime globals + map the
# Agent/Pool/Dispatcher classes.
"undici" = "./src/stubs/undici.ts"
# unpdf/mammoth are core's document parsers. Core loads them via `await
# import()`, but this bundle resolves @elizaos/core/edge to core SOURCE
# (tsconfig paths), so the dynamic import is inlined and the PDF/DOCX
# toolchains (~70 pdfjs modules, jszip/pako/bluebird) ship in the deployed
# Worker. Document extraction runs on the sidecar and `documents` is false in
# core's nativeRuntimeFeatureDefaults, so both are stubbed here; an accidental
# Worker-side call throws instead of returning empty text (#21327).
"unpdf" = "./src/stubs/unpdf.ts"
"mammoth" = "./src/stubs/mammoth.ts"

[observability]
enabled = true

# Querying these logs after the fact: the Observability query API silently caps
# results (~50 events) with NO truncation signal — one wide query over a
# multi-minute window can cover only its last seconds and look complete. Slice
# the window (~5s slices) and aggregate before asserting absence or measuring a
# rate (#22548). Same caveat is documented in scripts/admin/cf-tail.sh.

# Logs and traces are configured separately. Keep logs complete for production
# diagnostics while sampling distributed traces to bound storage volume.
[observability.logs]
enabled = true
head_sampling_rate = 1.0

# Automatic Workers traces capture fetch, Hyperdrive/KV/R2 binding calls, and
# handler spans; X-Eliza-Trace-Id separately correlates caller measurements and
# application logs.
[observability.traces]
enabled = true
head_sampling_rate = 0.05

# -----------------------------------------------------------------------------
# Cron triggers — Cloudflare requires unique schedule strings. Multiple
# handlers per schedule are fanned out by the dispatcher in `src/lib/cron.ts`
# (CRON_FANOUT). See cloud/INFRA.md "Cron triggers" for the full mapping.
# -----------------------------------------------------------------------------
[triggers]
crons = [
  "* * * * *",      # deployment-monitor + health-check + process-provisioning-jobs
  "*/2 * * * *",    # pool-health-check
  "*/5 * * * *",    # social-automation + sample-eliza-price + process-redemptions + cleanup-stuck-provisioning + node-disk-cleanup
  "*/10 * * * *",   # cleanup-expired-crypto-payments
  "*/15 * * * *",   # auto-top-up + agent-budgets + cleanup-mobile-app-auth + refresh-model-catalog + domain-health
  "0 * * * *",      # agent-billing
  "0 */6 * * *",  # cleanup-cli-sessions + agent-backups + reap-orphan-shared-bridges + gc-stranded-sandbox-keys
  "0 0 * * *",      # container-billing
  "0 1 * * *",      # compute-metrics
  "0 2 * * *",      # cleanup-webhook-events
  "0 3 * * *",      # domain-renewals + reclaim-stale-domains
]

# -----------------------------------------------------------------------------
# Bindings
# -----------------------------------------------------------------------------

# R2 — primary blob/media storage. Use env.BLOB.put/get/etc.
[[r2_buckets]]
binding = "BLOB"
bucket_name = "eliza-cloud-blob"

[browser]
binding = "BROWSER"

[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1615301"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "CHAT_ROUTE_RATE_LIMITER"
namespace_id = "1615302"
simple = { limit = 200, period = 60 }

[[ratelimits]]
name = "DASHBOARD_CHAT_ROUTE_RATE_LIMITER"
namespace_id = "1615303"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "MOBILE_API_KEY_INGRESS_LIMITER"
namespace_id = "1615304"
simple = { limit = 120, period = 60 }

[[durable_objects.bindings]]
name = "SHARED_RUNTIME_CONVERSATIONS"
class_name = "SharedRuntimeConversation"

[[durable_objects.bindings]]
name = "INFERENCE_ADMISSION_GATES"
class_name = "InferenceAdmissionGate"

[[durable_objects.bindings]]
name = "DOORDASH_CHECKOUT_GATES"
class_name = "DoorDashCheckoutGate"

[[durable_objects.bindings]]
name = "ANONYMOUS_CHAT_GATES"
class_name = "AnonymousChatGate"

[[durable_objects.bindings]]
name = "ONBOARDING_SESSIONS"
class_name = "OnboardingSessionCoordinator"

[[durable_objects.bindings]]
name = "TWITTER_OAUTH_REFRESH_COORDINATORS"
class_name = "TwitterOAuthRefreshCoordinator"

[[durable_objects.bindings]]
name = "PERSONAL_DELIVERY_PROJECTIONS"
class_name = "PersonalDeliveryProjection"

[[durable_objects.bindings]]
name = "PERSONAL_TELEGRAM_DELIVERIES"
class_name = "PersonalTelegramDelivery"

# Declarative exports preserve the existing namespaces without replaying the
# Worker's historical migration tags. Do not mix this with `[[migrations]]`.
[exports.SharedRuntimeConversation]
type = "durable-object"
storage = "sqlite"

[exports.InferenceAdmissionGate]
type = "durable-object"
storage = "sqlite"

[exports.AnonymousChatGate]
type = "durable-object"
storage = "sqlite"

[exports.OnboardingSessionCoordinator]
type = "durable-object"
storage = "sqlite"

[exports.TwitterOAuthRefreshCoordinator]
type = "durable-object"
storage = "sqlite"

[exports.PersonalDeliveryProjection]
type = "durable-object"
storage = "sqlite"

[exports.PersonalTelegramDelivery]
type = "durable-object"
storage = "sqlite"

[exports.InferenceRateLimitV2RollbackFloor]
type = "durable-object"
storage = "sqlite"

[exports.DoorDashCheckoutGate]
type = "durable-object"
storage = "sqlite"

# General API limits and queues use the environment's Railway Redis. Worker
# direct consumers reach it through redis-rest; non-Worker services use
# REDIS_URL. Inference routes never connect to it: Cloudflare Rate Limiting bindings protect ingress,
# Durable Objects serialize organization/anonymous quotas, and CACHE_KV serves
# revisioned metadata. Local development can use embedded Wadis when configured.

# Vectorize — embeddings (uncomment after `wrangler vectorize create`)
# [[vectorize]]
# binding = "EMBEDDINGS"
# index_name = "eliza-cloud-embeddings"

# -----------------------------------------------------------------------------
# Queue: Stripe webhook fan-out runs on Redis (redis-rest in Workers, Railway
# TCP in non-Worker cloud services, embedded Wadis locally), not Cloudflare
# Queues. The webhook route LPUSHes a JSON
# envelope; the `* * * * *` cron fires `/api/cron/process-stripe-queue`
# which drains a bounded batch via the queue helper in
# `packages/lib/queue/redis-queue.ts`. Failed messages are retried with
# attempts++ and demoted to a `:dlq` list after `maxAttempts`.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Vars (non-secret build/runtime config — the rest live as wrangler secrets)
# -----------------------------------------------------------------------------
# AUTO_TOP_UP_DURABLE_ENABLED is deliberately absent from every vars block.
# The checked-in dry-run-first cutover operator must inventory and reconcile
# legacy Stripe PaymentIntents, prove its watermark and blockers, and move the
# primary database control to durable before the exact string "true" may be
# bound at 100%. A quiet timer is not a provider fence. For rollback, first
# transition the database control durable -> paused, then remove/false this
# secondary switch; keep the durable binary deployed so recovery can converge.
[vars]
NODE_ENV = "production"
# Compact Shared-runtime receipts contain timings and routing decisions only,
# never prompt/response text. Keep a bounded production sample so first-turn,
# provider, shouldReply, and selected-context regressions are measurable.
SHARED_TURN_TRACES_ENABLED = "true"
SHARED_TURN_TRACES_SAMPLE = "0.1"
PERSONAL_DELIVERY_PROJECTION_READ_ENABLED = "false"
PERSONAL_SHARED_TELEGRAM_EDGE_ENABLED = "false"
# PERSONAL_TELEGRAM_DELIVERY_EPOCH1_COMPAT_ENABLED is deliberately absent from
# the root and production vars blocks. Staging commits the temporary exact-true
# bridge below so its Worker deploy cannot race the legacy Gateway's headerless
# handoff or epoch-1 reconciliation. Production remains protected and closed.
# PERSONAL_SHARED_TELEGRAM_EDGE_CUTOVER_ENABLED and
# PERSONAL_SHARED_TELEGRAM_EDGE_CUTOVER_PRODUCTION_ENABLED are deliberately
# absent from every [vars] block. The protected activation workflows own them
# as environment-pinned secrets, while the legacy explicit-false binding stays
# as the default guard.
NEXT_PUBLIC_APP_URL = "https://cloud.eliza.app"
NEXT_PUBLIC_API_URL = "https://api.eliza.app"
ELIZA_CLOUD_URL = "https://api.eliza.app"
# Native Android PKCE is a committed product capability. The endpoint fails
# closed unless this public environment flag is exactly "true" or "false".
