# Railway deploy config for gateway-webhook.
#
# Multi-platform webhook gateway (Telegram, Blooio, Twilio). Stateless
# Hono HTTP handler on port 3000 (PORT env overrides).
#
# Required env vars / secrets:
#   ELIZA_CLOUD_URL            Canonical cloud API origin.
#   GATEWAY_BOOTSTRAP_SECRET   Secret used to acquire the gateway service JWT.
#   GATEWAY_INTERNAL_SECRET     Shared secret for internal routes from cloud-api.
#   AGENT_SERVER_SHARED_SECRET  Shared secret for forwards to agent-server.
#   ELIZA_APP_WEBHOOK_GATEWAY_SECRET  Shared secret required on BFF forwards.
#   REDIS_URL                   Upstash Redis REST URL (or KV_REST_API_URL).
#   KV_REST_API_TOKEN           Upstash Redis REST token.
#   AGENT_ROUTER_ORIGIN_HOST    Canonical control-plane router origin hostname.
#   ELIZA_CLOUD_AGENT_BASE_DOMAIN  Canonical dedicated-agent hostname suffix.
#
# Optional:
#   TWILIO_PUBLIC_URL                  Public URL Twilio status callbacks point at.
#   TWILIO_SMS_COST_PER_SEGMENT_USD    Override default SMS cost accounting.
#   KEDA_COOLDOWN_SECONDS              Graceful-shutdown delay before exit.

# The build context is the REPOSITORY ROOT, not this directory: the service
# depends on the @elizaos/cloud-services-common workspace package, which cannot
# resolve from a context holding only this package. On Railway that means the
# service's root directory stays unset and the Dockerfile path is repo-relative;
# for a manual `railway up`, run it from the repository root.
[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/cloud/services/gateway-webhook/Dockerfile"

[deploy]
healthcheckPath = "/health"
# JWT bootstrap is crash-only and may exhaust the bounded restart budget before
# a replacement can become healthy; the platform health window must encompass
# that budget without weakening startup authentication.
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
