name = "eliza-tunnel-proxy"
main = "worker.ts"
account_id = "23cf6feaeaa541f6a0675053c33da768"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "enable_request_signal", "request_signal_passthrough"]
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TunnelContainer", "TunnelState"]

[env.staging]
name = "eliza-tunnel-proxy-staging"

[env.staging.vars]
DEPLOYMENT_ENV = "staging"
TUNNEL_ENABLED = "false"

[env.staging.triggers]
crons = ["* * * * *"]

[[env.staging.containers]]
class_name = "TunnelContainer"
image = "../Dockerfile"
image_build_context = ".."
max_instances = 1
instance_type = "standard-1"

[[env.staging.durable_objects.bindings]]
name = "PROXY"
class_name = "TunnelContainer"

[env.production]
name = "eliza-tunnel-proxy-production"

[env.production.vars]
DEPLOYMENT_ENV = "production"
TUNNEL_ENABLED = "false"

[env.production.triggers]
crons = ["* * * * *"]

[[env.production.containers]]
class_name = "TunnelContainer"
image = "../Dockerfile"
image_build_context = ".."
max_instances = 1
instance_type = "standard-1"

[[env.production.durable_objects.bindings]]
name = "PROXY"
class_name = "TunnelContainer"

[[env.staging.durable_objects.bindings]]
name = "STATE"
class_name = "TunnelState"

[[env.production.durable_objects.bindings]]
name = "STATE"
class_name = "TunnelState"
