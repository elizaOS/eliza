name = "eliza-gateway"
main = "worker.ts"
account_id = "23cf6feaeaa541f6a0675053c33da768"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayContainer"]

[env.webhook-staging]
name = "eliza-gateway-webhook-staging"

[env.webhook-staging.vars]
DEPLOYMENT_ENV = "staging"
GATEWAY_KIND = "webhook"
GATEWAY_ENABLED = "false"

[env.webhook-staging.triggers]
crons = ["* * * * *"]

[[env.webhook-staging.containers]]
class_name = "GatewayContainer"
image = "../../gateway-webhook/Dockerfile"
image_build_context = "../../../../.."
max_instances = 1
instance_type = "standard-1"

[[env.webhook-staging.durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayContainer"

[env.webhook-production]
name = "eliza-gateway-webhook-production"

[env.webhook-production.vars]
DEPLOYMENT_ENV = "production"
GATEWAY_KIND = "webhook"
GATEWAY_ENABLED = "false"

[env.webhook-production.triggers]
crons = ["* * * * *"]

[[env.webhook-production.containers]]
class_name = "GatewayContainer"
image = "../../gateway-webhook/Dockerfile"
image_build_context = "../../../../.."
max_instances = 1
instance_type = "standard-1"

[[env.webhook-production.durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayContainer"

[env.discord-staging]
name = "eliza-gateway-discord-staging"

[env.discord-staging.vars]
DEPLOYMENT_ENV = "staging"
GATEWAY_KIND = "discord"
GATEWAY_ENABLED = "false"

[env.discord-staging.triggers]
crons = ["* * * * *"]

[[env.discord-staging.containers]]
class_name = "GatewayContainer"
image = "../../gateway-discord/Dockerfile"
image_build_context = "../../../../.."
max_instances = 1
instance_type = "standard-1"

[[env.discord-staging.durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayContainer"

[env.discord-production]
name = "eliza-gateway-discord-production"

[env.discord-production.vars]
DEPLOYMENT_ENV = "production"
GATEWAY_KIND = "discord"
GATEWAY_ENABLED = "false"

[env.discord-production.triggers]
crons = ["* * * * *"]

[[env.discord-production.containers]]
class_name = "GatewayContainer"
image = "../../gateway-discord/Dockerfile"
image_build_context = "../../../../.."
max_instances = 1
instance_type = "standard-1"

[[env.discord-production.durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayContainer"
